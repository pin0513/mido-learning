  school: 國中七至九年級自然課
  source: sci108
why:
  heading: 結果會回頭影響原因
  body:
  - 很多事不是一條直線，而是一個圈：結果會回過頭影響原因。研究系統的 Donella Meadows 把這種圈分成兩種：「A negative feedback loop is self-correcting; a positive feedback loop is self-reinforcing.」，也就是一種會自己修正，一種會自己加強（翻譯是本站整理）。本頁把前者叫平衡迴圈，後者叫增強迴圈。
  - 自然課也教身體裡的平衡迴圈：「人體會藉由各系統的協調，使體內所含的物質以及各種狀態能維持在一定範圍內。」課綱也要學生「理解較複雜的自然界模型，並能評估不同模型的優點和限制」；因果迴圈圖就是一種模型，能幫我們看懂自己的習慣。
  qa:
    question: 哪個循環讓你越來越好？哪個讓你越來越糟？
    answer: 越練越熟、越熟越想練，是讓你越來越好的增強迴圈；手機越用越晚睡、越晚睡白天越累、越累又越想滑手機，是讓你越來越糟的增強迴圈（例子是本站整理）。Meadows 說增強迴圈是「The more it works, the more it gains power to work some more.」，越轉越有力，好壞都一樣（翻譯是本站整理）。
    source: meadows-leverage
  items_title: 自然科學領綱的學習重點
  items:
  - title: 理解並評估模型
    text: 自然科學 tm-IV-1：能從實驗過程、合作討論中理解較複雜的自然界模型，並能評估不同模型的優點和限制，進能應用在後續的科學理解或生活。
    code: tm-IV-1
  - title: 人體維持一定範圍
    text: 自然科學 Dc-IV-4：人體會藉由各系統的協調，使體內所含的物質以及各種狀態能維持在一定範圍內。
    code: Dc-IV-4
  - title: 覺察變化維持恆定
    text: 自然科學 Dc-IV-5：生物體能覺察外界環境變化、採取適當的反應以使體內環境維持恆定，這些現象能以觀察或改變自變項的方式來探討。
    code: Dc-IV-5
