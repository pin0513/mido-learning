idea: 事情的原因常常不只一個，而且結果會回過頭影響原因，形成往同一個方向越走越遠的增強迴圈（越來越多或越來越少），或把狀態拉回某個目標或範圍的平衡迴圈（本站整理）。
guiding_questions:
- 哪個循環讓你越來越好？哪個讓你越來越糟？
- 增強迴圈和平衡迴圈有什麼不同？
- 要在迴圈的哪裡下手，才打得斷循環？
scenario: 畫出自己手機越用越晚睡的因果迴圈圖，找一個可以打斷循環的地方（本站建議）。
