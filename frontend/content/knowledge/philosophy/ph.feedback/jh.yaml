how:
  heading: 畫迴圈圖：找出下手處
  body:
  - 先寫下一個習慣，例如睡前滑手機。問：它讓什麼變多或變少？再問：那件事又讓什麼改變？一格一格寫下去，每個箭頭旁寫：前一格變多的時候，這一格跟著變多，還是變少（本站整理）。就算這個圈實際上越來越少，例如越少運動越沒體力，也照前一格變多來寫：運動變多，體力跟著變多（本站整理）。直到最後一個箭頭回到起點，圈就畫好了。例如滑手機越久就越晚睡，越晚睡白天越累，越累越想滑手機放鬆（例子是本站整理）。
  - 再判斷是哪一種迴圈：繞一圈下來，起點被推往同一個方向，越來越多或越來越少，是增強迴圈；起點被拉回某個目標或範圍，是平衡迴圈（本站整理）。判斷小技巧：照第一步的寫法（前一格變多時，這一格跟著變多還是變少），數一數圈上寫變少的箭頭，偶數個（沒有也算）是增強迴圈，奇數個是平衡迴圈（本站整理）。平衡迴圈像身體維持體溫，Meadows 舉的例子是「your ability to sweat or shiver to maintain your body temperature」，也就是靠流汗或發抖維持體溫（翻譯是本站整理）。
  - 最後找下手處：挑一個箭頭，想辦法讓它斷掉或變弱，例如手機放在房間外面充電，滑手機的時間可能就比較不會一直變長（本站建議）。試一週（示意，本站建議），記下睡覺時間有沒有改變；沒有效，就換另一個箭頭再試。
  qa:
    question: 增強迴圈和平衡迴圈有什麼不同？
    answer: 增強迴圈繞一圈會把起點推往同一個方向越走越遠，可能越來越多，也可能越來越少；平衡迴圈繞一圈會把起點拉回某個目標或範圍（本站整理）。Meadows 說「A negative feedback loop is self-correcting; a positive feedback loop is self-reinforcing.」，平衡迴圈會自己修正，增強迴圈會自己加強（翻譯是本站整理）。
    source: meadows-leverage
  items_title: 四步做
  items:
  - title: 寫下一個習慣
    text: 例如睡前滑手機。
  - title: 一格一格連
    text: 箭頭旁寫變多或變少。
  - title: 判斷迴圈
    text: 增強，還是平衡？
  - title: 找下手處
    text: 挑一個箭頭讓它變弱。
  checklist_title: 畫完檢查一下
  checklist:
  - 箭頭回到起點
  - 寫了變多變少
  - 選好下手處
  activity_figure: feedback-flow
  sources:
  - meadows-leverage
what:
  heading: 看得出循環，打得斷
  body:
  - 學完後，孩子能把一個生活中的習慣畫成因果迴圈圖，說出它是增強迴圈還是平衡迴圈，找出一個可以下手的箭頭，並實際試著改變自己的一個習慣。
  items_title: 學完能做到
  items:
  - title: 畫迴圈圖
    text: 最後的箭頭回到起點。
  - title: 分兩種迴圈
    text: 增強或平衡。
  - title: 找下手處
    text: 試一陣子再調整。
  checklist_title: 家長檢核
  checklist:
  - 迴圈圖畫好了
  - 說得出哪一種
  - 選好下手處
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  - 本頁的 AI 活動由老師或家長操作，孩子在旁邊一起看、一起檢查 AI 的回答（本站建議）。
  sources:
  - genai-student
