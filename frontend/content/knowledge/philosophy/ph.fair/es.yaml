how:
  heading: 分點心卡：三種分法
  body:
  - 準備畫的點心卡，不用真的食物，避免有人過敏（本站建議）。設定情境：小組裡有一人沒吃早餐特別餓，一人搬了最多桌椅。先試一樣多，每人拿一樣的張數；再試照需要，最餓的多拿；再試照付出，出力最多的多拿。大家條件差不多時適合一樣多，有人特別需要時適合照需要，有人付出特別多時適合照付出；不分一樣多時，要說得出大家都能接受的理由（本站整理）。
  - 換位子想：輪流站到最餓的人、出力最多的人和其他人的位置，說說在這個位置，哪種分法讓你覺得不公平、為什麼（本站建議）。綜合活動課綱說的「同理心的增進與實踐」，就是練習感受別人的處境。
  - 最後投票並說理由：投票前，每個人先說自己選哪種、為什麼；投票後，請大家複述一個和自己不同的理由。國語課綱要學生「與他人溝通時能尊重不同意見。」票少的那一方的理由也記下來，下次情況不同時可以再想（本站建議）。
  qa:
    question: 如果你是最餓的那個人，你會選哪一種分法？
    answer: 很多人會選照需要，因為自己最需要（本站整理）。但換到出力最多的人的位置，可能就想選照付出。發現自己的選擇會跟著位置改變，就是在練習同理；綜合活動課綱要五、六年級練習「同理心的增進與實踐。」
    source: zonghe
  items_title: 四步做
  items:
  - title: 準備點心卡
    text: 用畫的，不用真的食物。
  - title: 試三種分法
    text: 一樣多、照需要、照付出。
  - title: 換位子想
    text: 哪種讓你覺得不公平？
  - title: 投票說理由
    text: 複述一個不同的理由。
  checklist_title: 討論時檢查一下
  checklist:
  - 三種分法都試過
  - 說出自己的理由
  - 複述別人的理由
