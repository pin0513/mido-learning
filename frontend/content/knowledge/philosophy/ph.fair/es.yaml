why:
  heading: 公平不只一種分法
  body:
  - 分東西時常常吵架，因為大家心裡的公平不一樣。議題融入說明手冊說「社會生活中有許多公平性的問題，例如在資源、責任的分配」，國小法治教育就要認識公平。綜合活動課綱也要五、六年級練習「同理心的增進與實踐。」
  - 哲學家整理過幾種常見的分法。最基本的是一樣多：除非有大家都能接受的理由，否則「everyone should get an equal share」。常被當成理由的，有「need or differing natural disadvantages」，也就是需要不同；還有「desert, efforts, or sacrifices」，也就是付出不同（翻譯是本站整理）。
  qa:
    question: 什麼時候可以不分一樣多？
    answer: 有大家都能接受的理由時。哲學家說，一樣多是預設，除非差別「are relevant and justify, through universally acceptable reasons, unequal shares」，也就是差別有關係，又有大家都能接受的理由（翻譯是本站整理）。例如有人沒吃早餐特別餓，或有人搬了最多桌椅，大家同意了，就可以多分一點（例子是本站整理）。
    source: sep-equality
  items_title: 課綱的學習重點
