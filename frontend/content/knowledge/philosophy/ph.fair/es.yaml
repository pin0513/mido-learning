what:
  heading: 選分法，也說得出理由
  body:
  - 學完後，孩子遇到東西要分給大家時，能說出一樣多、照需要、照付出三種分法各適合什麼情況，站在別人的位置想想哪種會讓人覺得不公平，選一種並說出大家都能接受的理由。
  items_title: 學完能做到
  items:
  - title: 說出三種分法
    text: 一樣多、照需要、照付出。
  - title: 換位子想
    text: 說出誰會覺得不公平。
  - title: 說理由也聽理由
    text: 複述一個不同的理由。
  checklist_title: 家長檢核
  checklist:
  - 說得出三種分法
  - 說得出誰不公平
  - 複述不同理由
  notes:
  - 本點融入品德教育與法治教育議題：議題融入說明手冊國小的實質內涵有同理分享和認識公平。換位子想、一起決定怎麼分，就是在練習這兩件事。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - issues-handbook
  - genai-student
