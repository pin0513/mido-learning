how:
  heading: 兩難討論：價值、選擇、理由
  body:
  - 先找出衝突的價值：兩難是兩件事都應該做，每件也做得到，卻不能兩件都做。在虛構的作弊情境裡，誠實要你說出來，友情要你替朋友想；寫下這兩個價值，說明為什麼兩個都重要（本站整理）。
  - 再分組提出選擇：每組想至少兩種做法，例如私下勸朋友自首、告訴老師、什麼都不說，寫下每種的理由和可能的後果，包括對朋友、對自己、對其他同學（例子是本站整理）。有時候想一想，會找到兩個價值都顧到一部分的做法；找不到的時候，才是真的兩難（本站整理）。輪流發言時，先複述上一位的理由再說自己的，不打斷、不嘲笑，也不點名真實的同學；課綱要學生「聆聽他人意見，表達自我觀點」（本站建議）。
  - 最後換位思考：問自己，如果換成別人做這個選擇，我也覺得可以嗎？如果我是被看到作弊的朋友，或是其他認真準備的同學，我會怎麼想？答得出來，理由才站得穩。遇到和你選擇不同的同學，先問他看重的是哪一個價值，再複述他的理由（本站建議）。
  qa:
    question: 你的選擇，換成別人做，你也覺得可以嗎？
    answer: 這是換位思考的檢查：如果你的選擇只有自己做才可以，別人做就不行，理由可能就不夠公平（本站整理）。也想想選擇會影響到的人，課綱要學生「感受個人或不同群體在社會處境中的經歷與情緒，並了解其抉擇。」
    source: social108
  items_title: 四步做
  items:
  - title: 找出衝突價值
    text: 例如誠實和友情。
  - title: 提出選擇
    text: 每組至少兩種做法。
  - title: 寫下理由後果
