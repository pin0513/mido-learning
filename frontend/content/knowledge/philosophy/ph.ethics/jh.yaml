why:
  heading: 兩個都對，卻不能都選
  body:
  - 兩難是兩個都重要的價值撞在一起。研究道德兩難的哲學文章說，兩難的時候，一個人覺得自己「having moral reasons to do each of two actions, but doing both actions is not possible」，也就是兩件事都有道德上的理由去做，卻沒辦法兩件都做（翻譯是本站整理）。例如誠實要你說出來，友情要你替朋友想（例子是本站整理）。
  - 社會課綱要國中生「感受個人或不同群體在社會處境中的經歷與情緒，並了解其抉擇。」也要「聆聽他人意見，表達自我觀點，並能以同理心與他人討論。」綜合活動也要培養「同理心、人際溝通、衝突管理能力」。想兩難，就是在練習做選擇並說明理由。
  qa:
    question: 什麼是兩難？
    answer: 兩難是兩件事你都應該做，每一件也都做得到，卻不能兩件都做（本站整理）。哲學文章說兩難的特徵是「the agent is required to do each of two (or more) actions; the agent can do each of the actions; but the agent cannot do both (or all) of the actions」（翻譯是本站整理：兩件都應該做、每件都做得到、但不能都做）。
    source: sep-dilemmas
