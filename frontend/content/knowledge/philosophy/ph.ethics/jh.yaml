what:
  heading: 選得出，也說得出理由
  body:
  - 學完後，孩子面對一個兩難情境，能說出互相衝突的兩個價值，提出至少兩種選擇和各自的理由與後果，用換位思考檢查自己的選擇，也能複述一個和自己不同的理由。
  items_title: 學完能做到
  items:
  - title: 說出衝突價值
    text: 兩個都重要的價值。
  - title: 提出選擇理由
    text: 至少兩種做法。
  - title: 換位思考
    text: 換成別人也可以嗎？
  checklist_title: 家長檢核
  checklist:
  - 寫出兩個價值
  - 至少兩種選擇
  - 複述不同理由
  notes:
  - 本點融入品德教育議題：議題融入說明手冊國中的實質內涵有「理性溝通與問題解決。」討論兩難時說理由、聽別人的理由，就是在練習理性溝通。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  - 本頁的 AI 活動由老師或家長操作，孩子在旁邊一起看、一起檢查 AI 的回答（本站建議）。
  sources:
  - issues-handbook
  - genai-student
