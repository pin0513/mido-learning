idea: 有時候兩個都重要的價值會互相衝突，例如誠實和友情。思考兩難，是在練習做選擇並說明理由。
guiding_questions:
  - 你的選擇，換成別人做，你也覺得可以嗎？
scenario: 道德兩難討論：好朋友考試作弊被你看到，你會怎麼做？分組提出不同選擇和理由。
