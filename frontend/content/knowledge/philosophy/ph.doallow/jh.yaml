why:
  heading: 三種話不要併成一句
  body:
  - 甲把乙的耳機放進自己口袋，這是做了。丙看見了、說得出來，卻沒說，這是沒有阻止。有人對乙說「是你自己放在桌上」，這是把這次被拿走說成乙的錯。三句話指的人不同，不能併成「都是乙的事」（例子是本站整理）。
  - 沒有阻止的人，要先回到上一階問他有沒有該做的事。看見了、說得出來，只說明他和「動手拿走」不是同一種。本頁不判丙該不該負責。
  items_title: 先分開再改寫
  items:
  - title: 處境與抉擇
    text: 感受個人或不同群體在社會處境中的經歷與情緒，並了解其抉擇。
    code: 社 2b-IV-1
  - title: 做了
    text: 動手拿走，或動手取笑。這一次的行為在做的人身上。
  - title: 沒阻止
    text: 看見了、說得出來，卻沒說。和動手不是同一種。有沒有該做的事，回到上一階。
  - title: 怪對方
    text: 「是你自己放在桌上」「是你自己太小題大作」把這次的事說成被影響的人的錯。這種話要改寫。
  qa:
    question: 做了壞事、沒有阻止、沒有保護好自己，差在哪裡？
    answer: 做了是行為在動手的人身上。沒阻止是看見了卻沒說，先問他有沒有該做的事。沒有保護好自己常被用來責怪被影響的人，要改成提醒，不把這次的事說成他的錯。
    source: social108
  sources:
  - social108
how:
  heading: 把責怪改成提醒
  body:
  - 「耳機被拿走，是你自己放在桌上。」可以改成：「耳機被拿走了。先問是誰拿走的。如果要提醒，離開座位時放進袋子裡。」提醒是以後可以怎麼做。責怪是把這次被拿走說成他的錯。
  - 「他們笑你，是你自己太小題大作。」可以改成：「他們取笑你。先問是誰在笑。如果要提醒，可以說：覺得不舒服就直接說停，不用先怪自己反應太大。」被取笑的人能不能自己說停，不是把取笑移到他身上的理由。
  checklist_title: 改寫時檢查
  checklist:
  - 做了是一種
  - 沒阻止是另一種
  - 怪對方要改寫
  - 提醒不是責怪
  figures:
  - doallow-three
  qa:
    question: 「耳機被拿走，是你自己放在桌上。」這句要怎麼改成不責怪的提醒？
    answer: 先寫是誰拿走的。提醒可以說離開座位時放進袋子裡。不要把這次被拿走說成放在桌上的人的錯。
    source: sep-blame
  sources:
  - sep-doing
  - sep-blame
what:
  heading: 本頁不排哪一種比較重
  body:
  - 百科一開頭問，做了傷害和只是沒有阻止，在道德上有沒有差別。Quinn 的看法是：要為做了傷害辯護，需要比只是沒有阻止更強的理由，其他條件一樣。本頁把這句標成他的看法，不選邊。
  - 被影響的人有自己的感受。課綱要了解處境裡的經歷、情緒和抉擇。把責任推回去，會蓋掉那個感受。改寫時先留下誰做了什麼。
  items:
  - title: 責任留在原處
    text: 改寫之後，拿走的還是拿走的人，取笑的還是取笑的人。提醒不把這次的行為搬到被影響的人身上。
  qa:
    question: 看見同學被取笑卻沒說話，和動手取笑是同一種嗎？
    answer: 不是。動手取笑是做了。看見了、說得出來卻沒說，是沒有阻止。有沒有該做的事，用上一階的角色或約定來問。本頁不判他該不該負責。
    source: sep-doing
  notes:
  - 三格圖是本站整理。前兩格對上百科的做了和沒有阻止，第三格是責怪被影響的人。
  - 例子只停在東西被拿和被取笑。
  sources:
  - sep-doing
  - sep-blame
