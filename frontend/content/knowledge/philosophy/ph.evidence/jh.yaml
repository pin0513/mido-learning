est_time:
  school: 國中七至九年級社會課
  source: social108
why:
  heading: 相信之前，先問證據
  body:
  - 社會課綱要國中生「適當選用多種管道蒐集與社會領域相關的資料。」還要「整理並檢視所蒐集資料的適切性。」自然課綱也要學生面對報導，甚至權威的解釋，都「能抱持懷疑的態度，評估其推論的證據是否充分且可信賴。」
  - 轉傳的訊息常常看不出最早是誰說的。研究網路查證的課程說「the best way to learn about a website is lateral reading」，認識一個網站最好的方法是橫向閱讀，也就是離開這個網站，去看其他來源怎麼說它（翻譯是本站整理）。
  qa:
    question: 一則訊息被轉傳很多次，會讓它更可信嗎？
    answer: 不會。轉傳再多次，原始出處還是同一個；轉傳只代表很多人看過，不代表有人查證過（本站整理）。要看的是證據，自然課綱要學生「評估其推論的證據是否充分且可信賴。」
    source: sci108
  items_title: 社會與自然領綱的學習重點
  items:
  - title: 用多種管道蒐集
    text: 社會 社 3b-IV-1：適當選用多種管道蒐集與社會領域相關的資料。
    code: 社 3b-IV-1
  - title: 檢視資料適切性
    text: 社會 社 3b-IV-2：利用社會領域相關概念，整理並檢視所蒐集資料的適切性。
    code: 社 3b-IV-2
  - title: 評估證據可不可信
    text: 自然科學 ah-IV-1：對於有關科學發現的報導，甚至權威的解釋（例如：報章雜誌的報導或書本上的解釋），能抱持懷疑的態度，評估其推論的證據是否充分且可信賴。
    code: ah-IV-1
  checklist_title: 開始前先確認
  checklist:
  - 選一則轉傳訊息
  - 先不急著回覆
  figures:
  - evidence-compare
  notes:
  - 社會的代碼：開頭的社是社會領域共同的學習表現；中間的 IV 是第四學習階段（國中七至九年級）。
  - 自然科學的代碼：小寫字母開頭的是學習表現，ah 是科學的態度與本質裡的養成應用科學思考與探究的習慣；中間的 IV 是第四學習階段（國中七至九年級）。
  - 總綱把國民中學七、八、九年級定為第四學習階段，所以本頁代碼中間都是 IV。
  sources:
