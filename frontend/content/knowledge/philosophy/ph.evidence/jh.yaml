  - cor-lateral
  - zonggang
how:
  heading: 查證三問：誰、何時、佐證
  body:
  - 先分一手和二手來源：一手來源是當事人或最早的紀錄，例如機關發布的公告、研究者自己的報告；二手來源是別人轉述、整理的，例如轉述研究或公告的新聞報導、轉傳的圖卡（本站整理）。同一份資料是一手還是二手，要看你查的是什麼事（本站整理）。手上的轉傳訊息多半是二手，要往回找到一手來源。
  - 再問三件事：是誰說的？什麼時候說的？有沒有其他來源也這樣說？查一個網站可不可信，不要只看它怎麼介紹自己；查證課程說「checking what other websites say about a source is a better evaluation strategy than trusting what the source says about itself」，也就是去看其他網站怎麼說它，比相信它的自我介紹更好（翻譯是本站整理）。
  - 最後寫查證報告：寫下原始出處、說的人和時間、另一個來源比對的結果，以及結論是可信、不可信，還是還不確定。轉傳很多次不會讓訊息更可信，因為原始出處還是同一個。社會課綱要學生「檢視所蒐集資料的適切性」；告訴家人時先謝謝對方分享，再附上查到的出處；請大人用 AI 幫忙找出處時，只貼訊息內容，不貼家人的名字和頭像（本站建議）。
  qa:
    question: 怎麼查一個網站可不可信？
    answer: 離開這個網站，去看其他網站怎麼說它，這叫橫向閱讀。查證課程說，認識網站的好方法是「leaving a site to see what other digital sources say about it」，也就是離開網站，看其他數位來源怎麼說它（翻譯是本站整理）。
    source: cor-lateral
  items_title: 四步做
  items:
  - title: 找原始出處
    text: 往回找到一手來源。
  - title: 問誰和何時
    text: 誰說的、什麼時候。
  - title: 找佐證
    text: 看其他來源怎麼說。
  - title: 寫查證報告
    text: 語氣溫和，附上出處。
  checklist_title: 查證時檢查一下
  checklist:
  - 找到原始出處
  - 比對另一來源
  - 語氣溫和
  activity_figure: evidence-flow
  sources:
  - cor-lateral
  - social108
what:
  heading: 查得出出處，說得清楚
  body:
  - 學完後，孩子拿到一則轉傳的訊息，能往回查出原始出處、是誰在什麼時候說的，分得出一手和二手來源，找另一個來源比對，再寫成一段語氣溫和的查證報告。
  items_title: 學完能做到
  items:
  - title: 分一手二手
    text: 知道手上是哪一種。
  - title: 橫向閱讀
    text: 看別人怎麼說這個網站。
  - title: 寫查證報告
    text: 出處、時間、比對結果。
  checklist_title: 家長檢核
  checklist:
  - 寫了原始出處
  - 比對另一來源
  - 語氣是溫和的
  notes:
  - 本點融入閱讀素養教育議題：議題融入說明手冊國中的實質內涵有「小心求證資訊來源，判讀文本知識的正確性。」查證轉傳訊息的出處，就是在練習求證資訊來源。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  - 本頁的 AI 活動由老師或家長操作，孩子在旁邊一起看、一起檢查 AI 的回答（本站建議）。
  sources:
  - issues-handbook
  - genai-student
