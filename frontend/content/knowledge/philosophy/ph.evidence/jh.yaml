verify_notes:
- 核心素養 A2、B2：依總綱 p.4–6 國民中學教育的 J-A2、J-B2 與社會領綱 p.3–4 的社-J-A2、社-J-B2，自然科學領綱 p.4–6 的自-J-A2、自-J-B2原文確認（表格窄欄分散對齊，字距大，文字用 pdftotext 原始順序層與頁面文字塊核對；跨頁的標 p.a–b）。
- stage.grades 填 7、8、9：本點的代碼都是第四學習階段（IV），國中的學習重點沒有再分年級；總綱 p.7 說國民中學七、八、九年級為第四學習階段。
- est_time 依社會領綱 p.2 時間分配表：國民中學七至九年級社會每週 3 節；本點建議在社會課做。
- 頁碼都是頁腳印的頁碼：國語文領綱比 PDF 頁少 2，數學領綱少 3，社會、自然科學、綜合活動領綱與總綱少 4，議題融入說明手冊少 16。
- 新增學習表現代碼 社 3b-IV-1、社 3b-IV-2（p.11）與自然科學 ah-IV-1（p.22）；代碼表原本沒有自然科學區塊，本批新增，網址同 sources 的 sci108。
- 原 domains 的科技改成自然科學：科技領綱資訊科技國中的學習內容談媒體與資訊科技的社會議題、資訊倫理，沒有以查證來源、評估證據為主的條目；自然科學 ah-IV-1 要學生對報導抱持懷疑、評估證據。link_notes 保留科技（資訊科技），related 保留 it.media@jh。
- 原 issues 的資訊教育改成閱讀素養教育：議題融入說明手冊的資訊教育實質內涵表（p.87）只列國小，沒有國中的條目；閱讀素養教育國中的實質內涵 閱J7「小心求證資訊來源，判讀文本知識的正確性。」（p.104）正對應本點。
- 原 scenario 的引號拿掉（查證報告不是引文），補上溫和地告訴家人，並標本站建議；How 補上請大人用 AI 時只貼訊息內容，不貼家人的名字和頭像。
- 一手、二手來源的分法與例子是本站整理；原想引用美國國會圖書館的一手來源說明，但該網頁拒絕連線（HTTP 403），改用 Civic Online Reasoning 的橫向閱讀。
- 原 ai.delegable「協助搜尋可能的原始來源」補上由老師或家長操作（本站建議），並在 What 加上教育部注意事項（學生版）的使用規則。
- Teaching Lateral Reading 是 Digital Inquiry Group（原 Stanford History Education Group）Civic Online Reasoning 的課程頁，英文短句引用，中文說明是本站整理。
