est_time:
  school: 國小五、六年級國語課
  source: kuoyu
why:
  heading: 分清事實和意見
  body:
  - 國語課綱要五、六年級學生「判斷聆聽內容的合理性，並分辨事實或意見。」讀文章時也要「區分文本中的客觀事實與主觀判斷之間的差別。」社會課從三、四年級就開始練習「辨別社會生活中的事實與意見。」
  - 研究新聞讀者的皮尤研究中心這樣分：事實句是「capable of being proved or disproved by objective evidence」，意見句則「reflects the beliefs and values of whoever expressed it」。意思是事實句可以用證據檢查，意見句說的是說話的人相信什麼、看重什麼（翻譯是本站整理）。
  qa:
    question: 一句話說錯了，它還算事實的句子嗎？
    answer: 還算。皮尤研究中心分類時，只看能不能用證據檢查，「regardless of whether it was accurate or inaccurate」，也就是不管它對不對（翻譯是本站整理）。例如本班有 30 人，數一數發現是 28 人，這句話錯了，但它還是可以檢查的事實句（例子是本站整理）。
    source: pew-fact
  items_title: 國語文領綱的學習重點
  items:
  - title: 分辨事實或意見
    text: 國語文 1-III-3：判斷聆聽內容的合理性，並分辨事實或意見。
    code: 1-III-3
  - title: 區分事實與判斷
    text: 國語文 5-III-4：區分文本中的客觀事實與主觀判斷之間的差別。
    code: 5-III-4
  checklist_title: 開始前先確認
  checklist:
  - 準備一張廣告單
  - 準備剪刀和膠水
  figures:
  - fact-compare
  notes:
  - 國語文的代碼：第一碼是類別（1 聆聽、2 口語表達、5 閱讀），第二碼是學習階段，第三碼是流水號。
