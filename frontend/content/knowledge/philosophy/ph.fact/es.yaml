how:
  heading: 剪句子，分兩欄
  body:
  - 先剪：從廣告單和班刊各剪幾句話，不剪有姓名、電話或照片的部分（本站建議）。再分：每句問自己，可以用證據檢查嗎？可以數一數、量一量、查資料或去看看的，貼到事實欄，旁邊寫怎麼檢查；說的是喜不喜歡、好不好的，貼到意見欄，旁邊寫這是誰的看法。
  - 最後談難分的句子。像全校最受歡迎的飲料，聽起來像事實，但如果沒有人做過調查，其實是賣的人的看法；像這雙鞋很輕，只有 200 克，前半句是意見，後半句可以秤（例子是本站整理）。廣告常把意見寫得像事實，因為聽起來像事實的句子比較容易讓人相信（本站整理）。
  - 還要記得：這樣分，看的是能不能用證據檢查，不是對不對。皮尤研究中心說事實句是「capable of being proved or disproved」，所以一句事實句說錯了，被證據推翻，它仍然是事實句（說明是本站整理）。
  qa:
    question: 廣告為什麼常把意見說得像事實？
    answer: 因為聽起來像事實的句子，比較容易讓人相信，也比較想買（本站整理）。所以看到最好、第一名、最受歡迎這類字，先問：有證據嗎？是誰說的？國語課綱也要學生「判斷聆聽內容的合理性」，聽到的、讀到的都要想一想。
    source: kuoyu
  items_title: 四步做
  items:
  - title: 剪句子
    text: 不剪姓名、電話和照片。
  - title: 問能不能檢查
    text: 數、量、查、看得到嗎？
  - title: 分成兩欄
    text: 意見旁寫上是誰的看法。
  - title: 談難分的
    text: 說出為什麼難分。
  checklist_title: 分完檢查一下
  checklist:
  - 事實寫了怎麼查
  - 意見寫了是誰的
  activity_figure: fact-flow
  sources:
  - pew-fact
  - kuoyu
what:
  heading: 事實可以查，意見看是誰說
  body:
  - 學完後，孩子讀廣告或文章時，能把句子分成事實和意見，說出事實句可以怎麼檢查、意見是誰的看法，也說得出有些句子為什麼難分。
  items_title: 學完能做到
  items:
  - title: 找出事實句
    text: 說得出怎麼檢查。
  - title: 找出意見句
    text: 說得出是誰的看法。
  - title: 談難分的句子
    text: 說得出為什麼難分。
  checklist_title: 家長檢核
  checklist:
  - 事實意見都圈好
  - 說得出怎麼檢查
  - 說得出是誰的看法
  notes:
  - 本點融入閱讀素養教育議題：議題融入說明手冊國小的實質內涵有「發展詮釋、反思、評鑑文本的能力。」分辨廣告裡的事實和意見，就是在評鑑文本。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - issues-handbook
  - genai-student
