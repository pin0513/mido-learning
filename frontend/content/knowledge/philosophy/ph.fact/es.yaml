- 原 idea「『今天下雨』是事實，可以檢查；『下雨天很討厭』是意見，每個人可以不同。」的引號拿掉：例句是本站整理，不是引文；另補上出去看看就能檢查。
- 原 scenario「從廣告單和班刊剪下句子，分成事實和意見兩欄，討論哪些句子很難分。」保留做法，補上不剪姓名、電話和照片（本站建議）。
- 原 ai.delegable「出更多練習句子」補上由大人操作（本站建議），並在 What 加上教育部注意事項（學生版）的使用規則。
- Pew Research Center 2018 年的報告（Amy Mitchell 等）是研究新聞讀者的調查，本點只借它對事實句與意見句的定義，英文短句引用，中文說明是本站整理。
