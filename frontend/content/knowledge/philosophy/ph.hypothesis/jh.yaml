  notes:
  - 自然科學的代碼：小寫字母開頭的是學習表現，po、pe 是問題解決（p）裡的觀察與定題（o）、計劃與執行（e）；中間的 IV 是第四學習階段（國中七至九年級）。
  - 數學的代碼：第一碼 d 是資料與不確定性，第二碼 IV 是國民中學，第三碼是流水號。
  - 總綱把國民中學七、八、九年級定為第四學習階段，所以本頁代碼中間都是 IV。
