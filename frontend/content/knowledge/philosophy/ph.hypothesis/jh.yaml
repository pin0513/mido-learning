why:
  heading: 把好奇變成可以檢驗的
  body:
  - 自然課綱要國中生「能辨別適合科學探究或適合以科學方式尋求解決的問題（或假說）」，再「規劃具有可信度（例如：多次測量等）的探究活動。」數學課綱也要學生「運用簡單統計量分析資料的特性」。把問題寫成假設，才知道要觀察什麼、怎樣算對或錯。
  - 哲學家 Popper 認為，科學的假設要能被觀察推翻，他的標準是「if a theory is incompatible with possible empirical observations it is scientific」，也就是一個理論有可能和觀察結果不合，才算科學的（翻譯是本站整理）。科學就是「hypotheses or conjectures are imaginatively proposed and tested」的過程：大膽提出假設，再拿去檢驗（翻譯是本站整理）。
  qa:
    question: 如果結果和你的假設不同，代表你錯了嗎？
    answer: 代表這個假設可能錯了，但你沒有失敗：你學到了這個原因可能不對，或實驗哪裡要改，可以改寫假設再試（本站整理）。Popper 說檢驗前要先講好怎樣算推翻：「criteria of refutation have to be laid down beforehand」，事先說好，結果出來才不會找藉口（翻譯是本站整理）。也要回頭檢查，實驗是不是只改變了一個條件。
    source: sep-popper
  items_title: 自然與數學領綱的學習重點
  items:
  - title: 提出適宜探究的問題
    text: 自然科學 po-IV-2：能辨別適合科學探究或適合以科學方式尋求解決的問題（或假說），並能依據觀察、蒐集資料、閱讀、思考、討論等，提出適宜探究之問題。
    code: po-IV-2
  - title: 規劃可信的探究
    text: 自然科學 pe-IV-1：能辨明多個自變項、應變項並計劃適當次數的測試、預測活動的可能結果。在教師或教科書的指導或說明下，能了解探究的計畫，並進而能根據問題特性、資源（例如：設備、時間）等因素，規劃具有可信度（例如：多次測量等）的探究活動。
    code: pe-IV-1
  - title: 用統計量分析資料
    text: 數學 d-IV-1：理解常用統計圖表，並能運用簡單統計量分析資料的特性及使用統計軟體的資訊表徵，與人溝通。
    code: d-IV-1
