how:
  heading: 紙飛機實驗：一次改一個
  body:
  - 先寫假設：用如果……那麼……的句子，例如如果機翼摺得比較寬，那麼紙飛機會飛得比較遠（例子是本站整理）。同時寫下怎樣算假設錯了，例如寬翼的平均距離沒有比較遠。可以被結果推翻的假設，才可以檢驗；什麼結果都說得通的，就沒辦法檢驗（本站整理）。
  - 再設計公平的實驗：一次只改變一個條件，這叫自變項，例如機翼寬度；量的結果叫應變項，例如飛行距離；紙張、丟的人和力道都保持一樣。只改一個條件，結果不同時才知道是它造成的；同時改兩個，就分不出是哪一個（本站整理）。課綱要學生「能辨明多個自變項、應變項並計劃適當次數的測試」。在空曠的地方朝沒有人的方向丟（本站建議）。
  - 最後算平均：每種飛幾次，把距離加起來除以次數；多飛幾次，比較不會被某一次的意外影響。數學課綱要學生「運用簡單統計量分析資料的特性」。結果和假設不同也沒關係：這代表你學到寬翼可能不是讓它飛遠的原因，或是實驗哪裡要改；改寫假設再試一次（本站整理）。
  qa:
    question: 為什麼一次只改變一個條件？
    answer: 只改一個條件，結果不同時才知道是它造成的；同時改兩個，就分不出是哪一個造成的（本站整理）。課綱要學生「能辨明多個自變項、應變項並計劃適當次數的測試」，先分清楚改的是什麼、量的是什麼。
    source: sci108
  items_title: 四步做
  items:
  - title: 寫假設
    text: 如果……那麼……
  - title: 說好怎樣算錯
    text: 事先寫下來。
  - title: 一次改一個
    text: 其他條件都一樣。
  - title: 多飛幾次算平均
    text: 比較平均距離。
  checklist_title: 實驗時檢查一下
  checklist:
  - 只改一個條件
  - 朝沒人的方向
  - 記下每一次
  activity_figure: hypothesis-flow
  sources:
  - sci108
  - math108
what:
  heading: 問得出，也驗得了
  body:
  - 學完後，孩子能把一個問題寫成可以檢驗的假設，事先說好怎樣算錯，設計一次只改變一個條件的實驗，用平均數比較結果，也說得出結果和假設不同時學到了什麼。
  items_title: 學完能做到
  items:
  - title: 寫成假設
    text: 可以被結果推翻。
  - title: 公平的實驗
    text: 一次只改一個條件。
  - title: 用平均比較
    text: 多做幾次再下結論。
  checklist_title: 家長檢核
  checklist:
  - 假設寫好了
  - 只改一個條件
  - 算出平均
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  - 本頁的 AI 活動由老師或家長操作，孩子在旁邊一起看、一起檢查 AI 的回答（本站建議）。
  sources:
  - genai-student
