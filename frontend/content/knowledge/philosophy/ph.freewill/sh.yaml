why:
  heading: 先問他知不知道
  body:
  - |
    百科一開頭寫道："Making judgments about whether a person is morally responsible for their behavior, and holding others and ourselves responsible for actions and the consequences of actions, is a fundamental and familiar part of our moral practices and our interpersonal relationships." 判斷一個人負不負道德責任，是跟人相處時很基本的一件事（翻譯是本站整理）。
  - 甲不知道紙條在說什麼。乙知道朋友要他亂丟，沒有被抓著手，自己決定丟。兩個人都不一樣。差在哪裡，先用三個條件看。三個中文名字是本站整理。
  items_title: 課綱原句
  items:
  - title: 判斷對錯的因素
    text: 判斷行為者善惡及行為對錯時應考慮的因素。
    code: 生 Da-V-2
  qa:
    question: 被騙去做壞事的人，也算做錯嗎？
    answer: 要看他知不知道。甲以為是帶便當，不知道紙條要藏便當。百科說，人有時不知道壞的後果，這種不知道有時可以讓他不用被責怪。不是每一次不知道都可以。本頁不把他算成自己決定去做。
    source: sep-mr
  sources:
  - zonghe
  - sep-mr
how:
  heading: 三個條件都要問
  body:
  - |
    百科寫道："There has been a recent surge in interest in the epistemic condition on responsibility (as opposed to the freedom or control condition that is at the center of the free will debate)." 一層是知不知道，一層是有沒有自由或控制（翻譯是本站整理）。又寫道："Sometimes agents act in ignorance of the bad consequences of their actions, and sometimes their ignorance excuses them from blame." 不知道壞的後果，有時可以不用被責怪（翻譯是本站整理）。
  - |
    第三層用百科引用的 Strawson。原文是 "the attitudes and intentions towards us of other human beings"，以及 "the quality of others' wills towards us"。我們在意別人對我們的態度與意圖（翻譯是本站整理）。本站把這一層叫「刻意」：他是不是自己要這樣。
  - 三個條件都有，本站才說後面的決定切斷了「只怪前面那個人」。甲不知道內容，第一個條件沒有，不能這樣切。乙三個都有，不能把亂丟只算在慫恿的人身上。前面的人有沒有另外的責任，本頁不結論。
  items_title: 三個條件
  items:
  - title: 知情
    text: 他知道這是什麼事、可能有什麼後果嗎？甲不知道紙條要藏便當。乙知道是亂丟。
  - title: 自由
    text: 有沒有被逼、被抓住？兩個例子都沒有人抓著他們的手。這一頁只問這個，不把「自由」說成已經證明。
  - title: 刻意
    text: 是不是自己要這樣？乙自己決定丟。甲以為自己在傳帶便當的話，不是要藏便當。
  checklist_title: 先填三格
  checklist:
  - 他知道嗎
  - 有沒有被逼
  - 自己要這樣
  - 三格沒齊就停
  figures:
  - freewill-flow
  qa:
    question: 什麼時候後面的決定能切斷前面的人的責任？
    answer: 本站整理的說法是：知情、自由、刻意三個都有，就不能把整件事只算在前面那個人身上。乙可以這樣看。甲不知道內容，不能這樣切。這不是百科的原句，前面的人有沒有另外的責任，本頁不結論。
    source: sep-mr
  sources:
  - sep-mr
what:
  heading: 兩種回答不選邊
  body:
  - |
    百科寫道："Compatibilists maintain that free will and moral responsibility are compatible with determinism." 相容論認為，自由意志和道德責任跟決定論可以並存（翻譯是本站整理）。另一個條目寫道："Compatibilism is the thesis that free will is compatible with determinism." 因為自由意志通常被當成道德責任的必要條件，這個主張有時也說成：道德責任和決定論可以並存（翻譯是本站整理）。原文是："Because free will is typically taken to be a necessary condition of moral responsibility, compatibilism is sometimes expressed as a thesis about the compatibility between moral responsibility and determinism."
  - |
    同一頁寫道："incompatibilists accept (some version of at least one of) these arguments and so insist that our self-conception as free and responsible agents would be seriously misguided if causal determinism turns out to be true." 不相容論接受這些論證的某一種，因此認為：如果因果決定論為真，我們把自己看成自由、要負責的那幅圖像就會嚴重失準（翻譯是本站整理）。
  - 對乙來說，相容論可以說他仍要負責。不相容論會問：若他的決定早就被排好，這份責任還算不算。本頁不選邊，也不替甲、乙做判決。
  items_title: 兩種回答
  items:
  - title: 相容論
    text: 前面有原因，人仍可能有責任。對上的是百科對相容論的定義。
  - title: 不相容論
    text: 若行為早就被決定，把人看成自由、要負責，這幅圖像就會出問題。
  - title: 本頁不選邊
    text: 兩種都寫出來。不說哪一種才對，也不說乙有罪或沒罪。
  figures:
  - freewill-compare
  qa:
    question: 相容論和不相容論對「有沒有責任」回答有什麼不同？
    answer: 相容論說，就算前面的原因早就排好，人仍可能有責任。不相容論說，若決定論為真，把自己看成自由、要負責的那幅圖像就會嚴重失準。本頁不選邊。
    source: sep-compat
  sources:
  - sep-mr
  - sep-compat
  notes:
  - 流程、對照，以及「知情、自由、刻意」「切斷」，都是本站整理。
  - 百科談的是同一個人知不知道、有沒有受控制。本頁不把這寫成法條。
  - 條目裡有較重的例子，這一頁不引用。本頁不選邊。
