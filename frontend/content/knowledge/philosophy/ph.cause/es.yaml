why:
  heading: 一起出現還不夠
  body:
  - 天亮前公雞叫，然後太陽出來。兩件事常常接著出現。想一想：如果那天公雞沒叫，太陽還是會出來。所以不能說是公雞把太陽叫出來（例子是本站整理）。
  - 國語課要孩子「運用自我提問、推論等策略，推論文本隱含的因果訊息或觀點」，也要「區分文本中的客觀事實與主觀判斷之間的差別」。事實是「牠們常常一起出現」；「是牠造成的」是進一步的判斷（本站整理）。
  qa:
    question: 公雞叫了太陽才出來，是公雞把太陽叫出來嗎？
    answer: 不是。牠們常常一起出現，可是公雞不叫，太陽還是會出來。一起出現，還不能說是誰造成誰。
    source: kuoyu
  items_title: 先分開這兩句
  items:
  - title: 一起出現
    text: 兩件事常常接著發生。
  - title: 誰造成誰
    text: 要再問，不能只看一起出現。
  - title: 推論因果
    text: 運用自我提問、推論等策略，推論文本隱含的因果訊息或觀點。
    code: 5-III-8
  - title: 事實和判斷
    text: 區分文本中的客觀事實與主觀判斷之間的差別。
    code: 5-III-4
  sources:
  - kuoyu
how:
  heading: 先找第三個原因
  body:
  - 下雨的日子，很多人帶傘。帶傘和下雨一起出現，不是傘把雨帶來的。兩件事可以一起出現，因為第三件事（天氣）同時影響它們（例子是本站整理）。
  - 你澆水，花活著。可是沒澆水，花有時也活著，有時又枯了。只看到兩件事一起出現，還不能說澆水造成花活著。史丹佛哲學百科說，因果模型會「predict the effects of interventions」，也就是預測你動手改變一件事之後，另一件事會怎樣（翻譯是本站整理）。動手改變，是下一階才練的問法。
  - 怎樣才比較像是其中一件造成另一件？這一階的答案是：先不要用「常常一起」當作原因。下一階才問「假如沒有第一件，第二件還會不會發生」。
  items_title: 三個本站例子
  items:
  - title: 公雞和太陽
    example: 不叫，太陽還是出來。
    text: 一起出現，不是誰造成誰。
  - title: 雨傘和下雨
    example: 傘沒有把雨帶來。
    text: 可能有第三個原因。
  - title: 澆水和花
    example: 沒澆水，花不一定枯。
    text: 還要再問假如沒有。
  checklist_title: 讀到兩件事時
  checklist:
  - 先寫下兩件事實
  - 不急著說誰造成
  - 問有沒有第三個
  sources:
  - kuoyu
  - sep-causal-models
what:
  heading: 造成要比一起出現窄
  body:
  - 造成，比「常常一起出現」更窄。窄的意思是：還要能說，拿掉第一件，第二件會怎樣。這一階只把這句問題留著，不把它當成已經證明（本站整理）。
  - 史丹佛哲學百科的因果模型條目說：「A causal model makes predictions about the behavior of a system.」它也說，如果我們觀察到變項之間的機率相關，或實驗介入的結果，就可以看哪些因果模型和這些觀察一致（說明是本站整理）。國小先記住：相關、一起出現，都還不是造成。
  items_title: 帶走這三句
  items:
  - title: 事實
    text: 牠們一起出現了。
  - title: 判斷
    text: 是誰造成誰，要另外說。
  - title: 下一階
    text: 問假如沒有，還會不會。
  notes:
  - 本點的三個例子都是本站整理，不是某一篇論文的實驗。
  sources:
  - sep-causal-models
  - kuoyu
