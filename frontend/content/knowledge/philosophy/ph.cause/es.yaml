idea: 兩件事常常一起出現，不代表其中一件造成另一件。公雞叫了太陽才出來，不是公雞把太陽叫出來。
guiding_questions:
- 公雞叫了太陽才出來，是公雞把太陽叫出來嗎？
- 兩件事常常一起出現，就代表其中一件造成另一件嗎？
- 怎樣才比較像是其中一件造成另一件？
scenario: 親子共學：孩子先說一件「先發生、後發生」的事，大人問「假如第一件沒發生，第二件還會不會發生？」這一階只要能停下來，不急著回答法律或科學上的定論。
