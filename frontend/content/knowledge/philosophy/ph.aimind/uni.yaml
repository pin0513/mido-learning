what:
  heading: 分工、審查、負責
  body:
  - 學完後，你能自己定義問題，分配哪些工作交給 AI、哪些自己判斷，用自己設計的審查清單逐項查 AI 的輸出，記錄修改，並為報告的結論負責。
  items_title: 學完能做到
  items:
  - title: 分配人機工作
    text: 產出交給 AI，判斷自己做。
  - title: 審查 AI 輸出
    text: 用自己的清單逐項查。
  - title: 為結論負責
    text: 記錄分工，註明用途。
  checklist_title: 自我檢核
  checklist:
  - 清單自己設計
  - 輸出查證過
  - 分工寫清楚
  notes:
  - 本頁的期末報告是本站整理的例子。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - genai-student
