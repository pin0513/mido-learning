why:
  heading: AI 能產出，判斷還是你的
  body:
  - Lee 等人 2025 年調查 319 位知識工作者，發現「higher confidence in GenAI is associated with less critical thinking, while higher self-confidence is associated with more critical thinking.」這是自陳問卷的相關結果，不是因果（說明是本站整理）。NIST 的生成式 AI 風險框架也提醒「automation bias, or excessive deference to automated systems」，太相信機器會少想一步（說明是本站整理）。
  - AI 讓思考的重點移動：論文說生成式 AI 讓批判思考轉向「information verification, response integration, and task stewardship」（說明是本站整理）。高中資訊科技學過「資料探勘與機器學習的基本概念」，也要「能使用多元的觀點思辨資訊科技相關議題」；大學要能自己分配人和 AI 的工作，並為結果負責（本站整理）。
  qa:
    question: 太相信 AI 時，為什麼容易少想一步？
    answer: 太相信機器時，人會不再檢查。NIST 把這叫作「automation bias, or excessive deference to automated systems」；Lee 等人的自陳問卷也發現，越相信 AI 的人，自評的批判思考越少（這是相關，不是因果；說明是本站整理）。
    source: nist-genai
  items_title: 這一點用到的
