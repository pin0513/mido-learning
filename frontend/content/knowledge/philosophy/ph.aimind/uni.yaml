idea: AI 擅長產出與整理，人仍要負責定義問題、判斷價值與承擔後果；理解不等於能產出答案。
guiding_questions:
  - 如果答案都能問 AI，你還需要真正理解嗎？
scenario: 設計自己的「AI 輸出審查清單」，用在一份期末報告上，記錄哪些部分交給 AI、哪些自己判斷。
