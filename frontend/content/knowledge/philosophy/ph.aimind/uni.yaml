how:
  heading: 設計自己的 AI 輸出審查清單
  body:
  - 先自己定義問題：報告要回答什麼、怎樣才算答好（本站建議）。這一步不交給 AI，因為問題問錯了，答案再多也沒用（本站整理）。再分工：找資料、整理、比較、改文字可以交給 AI；選題、判斷證據、下結論、價值取捨自己做（本站建議）。如果答案都能問 AI，你還是要理解，因為不理解就看不出 AI 錯在哪（本站整理）。
  - 接著設計審查清單，逐項查 AI 的輸出：事實和數字對嗎、引用的資料真的存在嗎、有沒有漏掉反方、跟自己的論點接得上嗎（本站建議）。論文說使用者「increasingly move from task execution to oversight when using GenAI.」審查清單就是把監督寫成具體的步驟（說明是本站整理）。太相信機器、照單全收，NIST 稱為自動化偏誤（本站整理）。把檢查寫成固定的步驟，比較不會因為 AI 看起來很有把握就跳過（本站建議）。
  - 最後記錄分工和修改：哪些段落用了 AI、改了什麼、為什麼改，並在報告註明使用的工具和用途（本站建議）。論文也說使用者會「trade hands-on engagement for the challenge of verifying and editing AI outputs」；交給 AI 的部分出錯，負責的還是交報告的人（說明是本站整理）。
  qa:
    question: 如果答案都能問 AI，你還需要真正理解嗎？
    answer: 需要。不理解就看不出 AI 錯在哪，也沒辦法為結論負責。論文說使用 AI 時，工作會「move from task execution to oversight」，監督要靠理解（說明是本站整理）。
    source: lee-chi25
  items_title: 本站建議的步驟
