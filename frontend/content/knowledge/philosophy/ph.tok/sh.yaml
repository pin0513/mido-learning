how:
  heading: 比較四種讓人信服的方式
  body:
  - 先問知識從哪裡來。研究知識論的文章說，信念要算知識，來源要可靠，並列出「perception, introspection, memory, reason, and testimony.」，也就是知覺、內省、記憶、推理和他人的證詞（翻譯是本站整理）。歷史課本屬於證詞：你沒有親眼看到，是相信寫書的人和他們用的史料（本站整理）。
  - 再比較四個領域：數學靠證明，從前提一步步推出結論；科學靠實驗和觀察，別人可以重做來檢查；歷史靠史料，要分辨事實、史料證據和解釋，再看證據適不適切；藝術評論靠理由和作品裡的細節，讓別人看見你看到的東西（本站整理）。
  - 所以，你憑什麼相信歷史課本？不是因為它印成書，而是因為它的說法有史料支持；不同的書解釋不同時，要回去看它們用了哪些史料、證據夠不夠（本站整理）。寫短文時，每個領域寫一句它怎麼讓人信服、一個例子、一個限制（本站建議）。
  qa:
    question: 歷史課本寫的事，你憑什麼相信？
    answer: 因為課本的說法有史料支持，你信的是寫書的人整理過的證據。知識論的文章把「testimony」列為知識的來源之一（翻譯是本站整理：他人的證詞）；證詞可不可信，要看來源可不可靠，所以遇到不同說法時，要回去查它們用了哪些史料（本站整理）。
    source: sep-epist
