why:
  heading: 相信不等於知道
  body:
  - 知識論問的是：我們怎麼知道自己知道？研究知識分析的哲學文章說，傳統的分析有三個條件，認為「justified true belief is necessary and sufficient for knowledge.」，也就是要相信、要是真的、還要有好的理由（翻譯是本站整理）。文章也說，多數知識論學者同意「what is false cannot be known.」，錯的事不能算知道（翻譯是本站整理）。不過，1963 年葛梯爾舉出反例：有理由、也是真的，卻只是碰巧對了。文章說這些例子「appear to refute the JTB analysis」（翻譯是本站整理：看起來推翻了這個三條件分析）。所以，真和好的理由通常被當成知道的必要條件；多數哲學家認為這三個條件還不夠，至於要補上什麼，還在討論（本站整理）。
  - 歷史課綱要高中生「分辨歷史事實、史料證據與歷史解釋，說明歷史解釋不同的原因，並檢視證據的適切性。」也要「綜合歷史知識與史料證據，提出個人的分析與詮釋。」國語課的議論文本則要「以事實、理論為論據，達到說服、建構、批判等目的。」
  qa:
    question: 相信一件事，和知道一件事差在哪裡？
    answer: 相信只要你心裡這樣想；知道還要它是真的，而且你有好的理由。文章說傳統分析認為「justified true belief is necessary and sufficient for knowledge.」（翻譯是本站整理：傳統上認為，有理由的真信念就是知識）。後來有反例挑戰這個說法（本站整理）。猜中答案的人相信了，答案也是真的，但沒有理由，還不算知道（例子是本站整理）。
    source: sep-knowledge
