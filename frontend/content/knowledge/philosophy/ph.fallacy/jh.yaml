how:
  heading: 謬誤收集卡：找、認、改
  body:
  - 先認識四種常見謬誤（說明是本站整理，取自寫作指南）。稻草人：把對方的意見說得更簡單、更極端，再攻擊這個假的版本，指南說它「oversimplifies an opponent's viewpoint and then attacks that hollow argument」。以偏概全：證據太少就下結論。人身攻擊：不談意見，改攻擊說話的人，指南說是「an attack on the character of a person rather than his or her opinions or arguments」。滑坡：說一件小事會「through a series of small steps」一路變成很糟的結果，卻沒證明每一步真的會發生。
  - 再做收集卡：從網路留言和廣告中各找一個例子，先遮掉帳號和人名，抄下那句話，寫下是哪一種謬誤、錯在哪裡，最後改成好的說理，例如補上足夠的證據，或回到對方真正的意見（本站建議）。
  - 最後回頭看自己。跟人爭論時，先問自己三件事：我是不是把對方的話說得更極端？我是不是只憑一兩次經驗就下結論？我是不是在說對方這個人，而不是他的理由？有一題答是，就可能犯了謬誤，先停下來改（本站整理）。
  qa:
    question: 稻草人謬誤錯在哪裡？
    answer: 它攻擊的不是對方真正的意見，而是自己改過的假版本。指南說稻草人「oversimplifies an opponent's viewpoint and then attacks that hollow argument」，也就是把對方的觀點過度簡化，再攻擊這個空心的論點（翻譯是本站整理）。要回應，先把對方的意見正確說一次（本站建議）。
    source: purdue-fallacies
  items_title: 四步做
  items:
  - title: 認識四種謬誤
    text: 稻草人、以偏概全等。
  - title: 各找一個例子
    text: 留言一則，廣告一則。
  - title: 寫下錯在哪
    text: 先遮掉帳號和人名。
  - title: 改成好的說理
    text: 補證據或回到原意。
  checklist_title: 做卡時檢查一下
  checklist:
  - 遮掉帳號人名
  - 寫出哪種謬誤
  - 寫出怎麼改
