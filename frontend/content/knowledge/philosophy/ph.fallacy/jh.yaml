why:
  heading: 聽起來對，不一定對
  body:
  - 謬誤是推理上的錯誤。寫作指南說「Fallacies are common errors in reasoning that will undermine the logic of your argument.」，也就是常見的推理錯誤，會讓論證站不住（翻譯是本站整理）。研究謬誤的哲學文章說，學者多半把謬誤看成「deceptively bad arguments」，看起來像好論證，其實是壞論證（翻譯是本站整理）。
  - 國語課綱要國中生「分辨聆聽內容的邏輯性，找出解決問題的方法。」也要「有效把握聽聞內容的邏輯，做出提問或回饋。」網路留言和廣告常用謬誤說服人，認得出來，才不會被帶著走。
  qa:
    question: 你最常在哪裡看到以偏概全？
    answer: 網路留言和廣告很常見，例如看到兩則負評，就說這家店全部都很難吃（例子是本站整理）。寫作指南說以偏概全是「This is a conclusion based on insufficient or biased evidence.」，也就是證據不夠或有偏差，就下了結論（翻譯是本站整理）。
    source: purdue-fallacies
  items_title: 國語文領綱的學習重點
