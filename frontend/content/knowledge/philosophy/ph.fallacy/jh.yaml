what:
  heading: 認得出，也改得了
  body:
  - 學完後，孩子能說出稻草人、以偏概全、人身攻擊、滑坡謬誤各錯在哪裡，從網路留言和廣告中找出例子並改成好的說理，也能在跟人爭論時，問自己三件事，發現自己是不是也犯了謬誤。
  items_title: 學完能做到
  items:
  - title: 說出錯在哪
    text: 四種謬誤各錯在哪。
  - title: 找出例子
    text: 留言和廣告各一個。
  - title: 檢查自己
    text: 爭論時先問三件事。
  checklist_title: 家長檢核
  checklist:
  - 卡片遮好帳號
  - 說得出錯在哪
  - 說得出怎麼改
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  - 本頁的 AI 活動由老師或家長操作，孩子在旁邊一起看、一起檢查 AI 的回答（本站建議）。
  sources:
  - genai-student
