    code: 1-IV-3
  - title: 把握邏輯再回饋
    text: 國語文 2-IV-2：有效把握聽聞內容的邏輯，做出提問或回饋。
    code: 2-IV-2
  - title: 以事實理論為論據
    text: 國語文 Bd-IV-1：以事實、理論為論據，達到說服、建構、批判等目的。
    code: Bd-IV-1
