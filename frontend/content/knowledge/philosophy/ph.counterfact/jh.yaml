why:
  heading: 原因要造成一點差別
  body:
  - 史丹佛哲學百科引用 Lewis 的句子：「We think of a cause as something that makes a difference, and the difference it makes must be a difference from what would have happened without it.」原因要造成一點差別，而且是跟「如果沒有它」相比的差別（翻譯是本站整理）。同一頁把實際發生的兩件事寫成：若 c 沒發生，e 就不會發生，e 才因果地依賴 c（說明是本站整理）。
  - 自然科學要學生「獲知因果關係」，也要能「提出適宜探究之問題」。適宜的意思包含：這句「假如沒有」問的是真的會被你改到的條件，不是隨便一個沒參與的人（本站整理）。
  qa:
    question: 假如沒有第一件事，第二件事還會發生嗎？
    answer: 這就是這一階的問法。如果還是會發生，第一件就不像原因。如果就不會發生，它才比較像原因。這問法仍會抓太廣，也處理不了兩件事各自就夠的情形。
    source: sep-counterfactual
  items_title: 這問法在說什麼
  items:
  - title: 假如沒有
    text: 拿掉第一件，第二件還在嗎？
  - title: 有差別
    text: 拿掉之後，結果跟著變了。
  - title: 獲知因果
    text: 從資訊或數據獲知因果關係。
    code: pa-IV-2
  - title: 適宜的問題
    text: 提出適宜探究的問題。
    code: po-IV-2
  sources:
  - sep-counterfactual
  - sci108
how:
  heading: 寫下假如沒有
  body:
  - 今天下雨，你遲到了。假如沒下雨，你還是會遲到（你本來就晚出門），下雨就不像遲到的原因。假如沒下雨你會準時，下雨才比較像原因（例子是本站整理）。先備的假設課要你一次只改一個條件；這裡改的就是「有沒有下雨」。
  - 花園的花枯了。園丁沒澆水。住在遠方、從來沒看過這花園的人也沒澆水。假如遠方的人澆了水，水也到不了這花園。把他算成原因，就是抓太廣（例子是本站整理）。百科上 Hume 的那句是：「where, if the first object had not been, the second never had existed」。這句很窄，不能拿來把所有「沒做某事的人」都算進去（說明是本站整理；這句出現在該百科頁，本點沒有另開 Hume 的書）。
  - 兩個人各自點燃一把火，兩把火各自都燒得完一間空倉庫，倉庫裡沒有人。拿掉其中一把，倉庫還是燒了。只問「假如沒有」，兩把火都像不是原因。這叫過度決定。下一階才問該用哪一種規範來看，這一階不下結論（例子是本站整理）。
  items_title: 三題這樣問
  items:
  - title: 下雨和遲到
    example: 沒下雨，你還會遲到嗎？
    text: 先寫假如沒有。
  - title: 遠方的人
    example: 他澆了水也到不了。
    text: 抓太廣就先拿掉。
  - title: 兩把火
    example: 拿掉一把，倉庫還是燒。
    text: 這問法會說兩邊都不是。
  - title: 先別下結論
    example: 空倉庫，沒有人在裡面。
    text: 規範留到下一階。
  checklist_title: 問之前檢查
  checklist:
  - 只改一個條件
  - 那個人真的碰得到
  - 另一個是不是就夠了
  sources:
  - sep-counterfactual
  - sci108
what:
  heading: 這問法會漏也會抓太廣
  body:
  - 抓太廣，是把做不到那件事的人也算成原因。過度決定，是兩件事各自就足以產生結果，拿掉任何一件，結果還在，於是「假如沒有」說兩邊都不是原因（本站整理）。
  - 百科把因果依賴寫成：「Where c and e are two distinct actual events, e causally depends on c if and only if, if c were not to occur e would not occur.」這是哲學上的一種定義，不是臺灣法律的條文。法律要不要用這問法，是高中與大學那兩點的事（說明是本站整理）。
