idea: 問「假如沒有它，結果還會不會發生」。這比「一起出現」窄，可是問太寬會把沒做事的人也算進來；兩件事各自就夠時，這問法又會說兩邊都不是原因。
guiding_questions:
- 假如沒有第一件事，第二件事還會發生嗎？
- 為什麼遠方、什麼都沒做的人，不能算成原因？
- 兩把火各自都燒得完，為什麼「假如沒有」會說兩邊都不是原因？
scenario: 自然課討論：用一個可以改條件的問題，寫出「假如沒有」的句子，並指出這個句子有沒有把範圍抓得太廣。
