what:
  heading: 把原則用在專業決定上
  body:
  - 學完後，你能分辨合法和合乎倫理，用五項 AI 倫理原則檢查一個產品，處理原則互相衝突的情況並寫出理由，也能說清楚每一個決定由誰負責。
  items_title: 學完能做到
  items:
  - title: 分辨合法和倫理
    text: 法律是最低標準。
  - title: 用原則做審查
    text: 五項原則逐一檢查。
  - title: 說清誰負責
    text: 決定和後果都有人承擔。
  checklist_title: 自我檢核
  checklist:
  - 五原則都檢查
  - 衝突有取捨
  - 負責人寫出
  notes:
  - 本頁的 AI 產品是虛構的例子，本站整理。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - genai-student
