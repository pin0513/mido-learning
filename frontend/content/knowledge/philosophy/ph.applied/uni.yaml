how:
  heading: 上線前做一次倫理審查
  body:
  - 以一個虛構的 AI 產品為例：一個依學生作業紀錄預測誰會被當掉的系統（例子是本站整理）。先列出受影響的人：學生、老師、學校、家人；再寫出可能的傷害：資料外洩、預測不準被貼標籤、某些群體被誤判得特別多（本站整理）。ACM 守則說「Extraordinary care should be taken to identify and mitigate potential risks in machine learning systems.」（說明是本站整理）。
  - 接著用五項原則逐一檢查，並找出原則衝突的地方：例如要提早幫助學生（行善），就要用更多資料，卻可能侵犯隱私（不傷害、自主）（本站整理）。五項原則各問一件事（本站整理）：行善問對人有沒有好處，AI4People 的標題是「Promoting Well-Being, Preserving Dignity, and Sustaining the Planet」；不傷害問會不會侵犯隱私、危及安全；自主問人能不能自己決定，標題是「The Power to Decide (Whether to Decide)」；公正問好處和風險分得公不公平，論文說它「is typically invoked in relation to the distribution of resources」；可解釋問說不說得出怎麼決定、誰負責（說明是本站整理）。衝突時，先找能同時照顧兩邊的設計，例如只用必要的資料、讓學生知道並能拒絕；真的不能兼顧，就寫出選擇的理由（本站建議）。ACM 守則的序言說，專業人員可能會發現「multiple principles should be taken into account」，這時要記得「the public good is the paramount consideration」（說明是本站整理）。
  - 法律沒禁止的做法，也要過這一輪檢查：合法只是最低標準（本站整理）。守則說規則本身也要檢視，覺得規則不合倫理時，「should consider challenging the rule through existing channels before violating the rule」，也就是可以考慮先透過既有管道提出挑戰，再決定要不要不照做（說明是本站整理）。最後寫出誰負責。AI4People 說可解釋性包含「both intelligibility and accountability」：說得出系統怎麼運作，也說得出誰要為它負責（說明是本站整理）。每一個調整建議，都寫上由誰決定、出了問題由誰處理；守則還說「A system for which future risks cannot be reliably predicted requires frequent reassessment of risk as the system evolves in use, or it should not be deployed.」也就是未來風險無法可靠預測的系統，要在使用中經常重新評估風險，否則就不該部署（說明是本站整理）。AI 可以列出常見風險和原則，但在利益衝突中怎麼取捨、由誰承擔，要人來判斷（本站整理）。
  qa:
    question: 倫理原則互相衝突時，怎麼決定？
    answer: 先找能同時照顧兩邊的設計；真的不能兼顧，就寫出選擇的理由，並接受檢視。ACM 守則的序言說可能會發現「multiple principles should be taken into account」，並提醒「the public good is the paramount consideration」（說明是本站整理）。
    source: acm-code
