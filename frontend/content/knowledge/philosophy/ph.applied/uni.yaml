why:
  heading: 合法不等於應該
  body:
  - 專業工作常碰到法律沒有規定、或規定跟良心衝突的情況。ACM 的電腦專業倫理守則說，守則「is not an algorithm for solving ethical problems; rather it serves as a basis for ethical decision-making.」也說「Rules that are judged unethical should be challenged.」規則本身也要接受倫理檢視（說明是本站整理）。
  - Floridi 等人 2018 年整理 AI 倫理文件，提出五項原則：前四項是生命倫理學的「beneficence, non-maleficence, autonomy, and justice」（行善、不傷害、自主、公正），再加上可解釋性（說明是本站整理）。高中生命教育學過「判斷行為者善惡及行為對錯時應考慮的因素」；大學要把這些原則用在真實的專業決定上（本站整理）。
  qa:
    question: 法律沒禁止的事，就可以做嗎？
    answer: 不一定。法律只是最低標準（本站整理）。ACM 的電腦專業倫理守則也提醒，規則本身也可能不合倫理：「Rules that are judged unethical should be challenged.」法律沒禁止，還要問會不會傷害人、公不公平（說明是本站整理）。
    source: acm-code
  items_title: 這一點用到的
  items:
