how:
  heading: 回到原始研究檢查設計
  body:
  - 拿到一則研究發現新聞，先找原始研究：作者、期刊、研究對象是人還是動物、樣本有多少、有沒有對照組、是觀察還是實驗（本站建議）。Sumner 等人檢查的三種誇大是「Advice to readers to change behaviour, causal statements drawn from correlational research, and inference to humans from animal research」（說明是本站整理）。
  - 再逐句對照新聞和原文。一起變多不代表一個造成另一個：冰淇淋和溺水一起變多，很可能是因為天氣熱同時影響兩者（例子是本站整理）。所以要問：原文說相關，新聞說會造成嗎？原文做的是動物，新聞說人嗎？原文沒有給建議，新聞卻叫你改變習慣嗎（本站整理）？找到的每一處，都寫下原文怎麼說、新聞怎麼說（本站建議）。
  - 最後看有沒有別人重做過。Stanford 哲學百科的再現性條目說，再現性危機包括「widespread failure to reproduce results of published studies in large systematic replication projects」和「evidence of publication bias」（說明是本站整理）。所以一個研究不夠：要看有沒有獨立團隊重做，研究是不是事先公開登記假設；條目說「pre-registration involves making a public, date-stamped statement of predictions and/or hypotheses」（說明是本站整理）。AI 可以摘要研究、說明統計方法，但研究能不能支持新聞的說法，要你對照原文自己判斷（本站整理）。
  qa:
    question: 新聞說研究發現，你要回去查原始研究的哪些地方？
    answer: 查研究對象、樣本、有沒有對照組、是觀察還是實驗，再對照新聞有沒有把相關說成因果、把動物結果說成人、多加了建議。這三種誇大就是 Sumner 等人檢查的「causal statements drawn from correlational research」等（說明是本站整理）。
    source: sumner-2014
  items_title: 四步做
  items:
  - title: 找原始研究
    text: 作者、期刊、對象、樣本。
  - title: 看研究設計
    text: 觀察還是實驗？有對照嗎？
  - title: 對照新聞說法
    text: 因果、人或動物、建議。
  - title: 看有沒有重做
    text: 有人重做嗎？事先登記嗎？
  checklist_title: 寫完檢查
  checklist:
