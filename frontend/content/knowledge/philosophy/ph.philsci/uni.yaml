what:
  heading: 讀研究新聞先查原文
  body:
  - 學完後，你能分辨相關和因果，回到原始研究檢查樣本、對照和研究對象，指出新聞比研究說得更強的地方，也說得出為什麼一個結果要有別人重做才比較可信。
  items_title: 學完能做到
  items:
  - title: 分辨相關和因果
    text: 找出可能的第三個因素。
  - title: 檢查研究設計
    text: 樣本、對照、人或動物。
  - title: 指出誇大
    text: 新聞說得比原文強的地方。
  checklist_title: 自我檢核
  checklist:
  - 原文找到了
  - 設計限制寫出
  - 誇大處標出
  notes:
  - 本頁的冰淇淋例子是常見的教學例子，本站整理。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - genai-student
