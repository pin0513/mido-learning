why:
  heading: 相關不等於因果
  body:
  - 天氣熱時冰淇淋賣得多，去游泳的人也多，溺水的人跟著變多；兩者一起變多，很可能是因為都跟天氣有關，不是吃冰淇淋造成溺水（例子是本站整理）。Sumner 等人 2014 年在 BMJ 的研究說「It is notoriously difficult to ascertain cause from correlational results.」，並舉例：喝酒和某種疾病相關，可能是酒增加風險、疾病讓人多喝，或兩者都和另一個因素有關（說明是本站整理）。
  - 這份研究比對英國大學的新聞稿、論文和新聞，發現新聞稿中有「33% (26% to 40%) contained exaggerated causal claims」，而且「Exaggeration in news is strongly associated with exaggeration in press releases.」（說明是本站整理）。它本身是回溯性的觀察研究，作者也只說相關（本站整理）。高中自然科學要學生了解科學「講求經驗證據性、合乎邏輯性、存疑和反覆檢視」；大學要能回到原始研究，檢查設計撐不撐得起結論（本站整理）。
  qa:
    question: 冰淇淋賣得多時溺水的人也多，代表吃冰淇淋會溺水嗎？
    answer: 不代表。兩者一起變多，很可能是天氣熱這個第三個因素同時影響兩者。Sumner 等人說「It is notoriously difficult to ascertain cause from correlational results.」（說明是本站整理）。
    source: sumner-2014
  items_title: 這一點用到的
  items:
  - title: 相關
    text: 兩件事一起變多或變少。
  - title: 因果
    text: 一件事造成另一件事。
  - title: 干擾因素
    text: 同時影響兩者的第三件事。
  - title: 誇大
    text: 說得比研究結果更強。
