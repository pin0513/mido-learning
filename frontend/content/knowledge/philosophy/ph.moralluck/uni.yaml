- id: sep-moral
  title: Moral Luck（Stanford Encyclopedia of Philosophy）
  publisher: Dana K. Nelkin（Stanford Encyclopedia of Philosophy）
  url: https://plato.stanford.edu/entries/moral-luck/
  accessed: '2026-11-10'
  kind: reference
  supports: |
    2026-11-10 打開條目。開頭：「Moral luck occurs when an agent can be correctly treated as an object of moral judgment despite the fact that a significant aspect of what she is assessed for depends on factors beyond her control.」結果運氣一節：「Resultant luck is luck in the way things turn out.」以及：「Cases of negligence provide another important kind of resultant luck.」同段的煞車與小孩、謀殺未遂兩對例子本頁不引用。Williams 與 Hart 的句子讀到了，不寫進正文。
