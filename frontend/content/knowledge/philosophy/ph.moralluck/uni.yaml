verify_notes:
- 大學不填 curriculum_108、不列 est_time。
- 兩位駕駛同樣闖紅燈、一位撞到人、一位沒有，是本站虛構例子。不沿用百科裡煞車失靈、路上有小孩的那一對，也不用謀殺未遂的那一對。本頁不說誰有罪。
- 刑法第 12 條、第 276 條逐字引自 2026-11-10 讀取的全國法規資料庫單條頁。第 12 條第 2 項不稱作但書。
- 英文句子取自 2026-11-10 打開的 Moral Luck。Williams 期待 oxymoron 的那句、Hart 關於刑罰的提問都讀到了，本頁不引用，以免寫成臺灣法律的結論。
- 先修是 ph.freewill@sh。2026-11-11 該點建立後，不再接國中的做與不做。
