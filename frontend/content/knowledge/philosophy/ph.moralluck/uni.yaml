  kind: government
  supports: |
    第 1 項：「行為非出於故意或過失者，不罰。」第 2 項：「過失行為之處罰，以有特別規定者，為限。」2026-11-10 單條頁核對。
- id: penal-276
  title: 刑法第 276 條
  publisher: 全國法規資料庫
  url: https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=C0000001&flno=276
