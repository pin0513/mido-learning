why:
  heading: 同樣的決定，不同的結果
  body:
  - 甲、乙在同一個路口、同樣沒有減速就闖紅燈。兩人當時都沒看到有沒有人。甲這次有行人，行人死亡。乙這次沒有人，沒有人被撞到。決定一樣，差在當時有沒有人在。百科把這種「結果怎麼發生」的運氣叫做結果運氣（例子是本站整理，不是百科裡的那一對駕駛）。
  - 結果運氣的問題是：如果我們對兩人做出不同的道德評價，而這個差別取決於他們控制不了的結果，評價裡就有運氣。本頁不先說這樣對或不對。
  items:
  - title: 結果運氣
    text: 兩人的決定相同。要評價的那一塊，有一部分取決於當時有沒有人在。那一塊不是他們當下選的。
  - title: 先別定罪
    text: 這一點不說甲有罪，也不說乙無罪。其他交通法規本頁不查。
  qa:
    question: 什麼叫結果運氣？
    answer: 結果運氣是事情後來怎麼發生的運氣。兩人決定相同，一個有人死亡、一個沒有人被撞到，差別在他們控制不了的結果。
    source: sep-moral
  sources:
  - sep-moral
how:
  heading: 法條把死亡寫進構成
  body:
  - 刑法第 12 條第 1 項：「行為非出於故意或過失者，不罰。」第 2 項：「過失行為之處罰，以有特別規定者，為限。」第 2 項是另一項規定，不另取名字。
  - 第 276 條：「因過失致人於死者，處五年以下有期徒刑、拘役或五十萬元以下罰金。」條文把「致人於死」寫進去。甲這次有人死亡，才放得進這一條旁邊。乙這次沒有人死亡，對不上這一條。放在旁邊不是判決。本頁不說甲成立這個罪。
  checklist_title: 對照時寫下來
  checklist:
  - 兩人決定相同
  - 結果差在運氣
  - 第276條要有死亡
  - 自己寫立場
  figures:
  - luck-compare
  qa:
    question: 兩個人同樣闖紅燈，為什麼一個可能碰上刑法第 276 條、另一個碰不上？
    answer: 第 276 條寫的是因過失致人於死。有人死亡的那一次才放得進這一條旁邊。沒有人死亡的那一次對不上。這不是在判誰有罪。
    source: penal-276
  sources:
  - penal-12
  - penal-276
what:
  heading: 寫下你的立場
  body:
  - 道德問題是：結果應不應該改變我們怎麼看這兩個人。法律這兩條則是：過失要處罰，得有特別規定；第 276 條的特別規定裡有死亡。兩題可以答案不同。
  - 寫的時候標清楚你在回答哪一題。本頁的結論留白。
  items:
  - title: 兩題分開
    text: 一題是道德評價跟不跟著結果走。另一題是第 276 條的文字裡有沒有死亡。不要用其中一題的答案直接填另一題。
  qa:
    question: 結果不同，道德上的責任就該不同嗎？
    answer: 本頁不代答。把兩人的決定、結果的差別、第 12 條第 2 項和第 276 條寫在旁邊，再寫你自己的一句話。
    source: sep-moral
  notes:
  - 對照圖是本站整理，不是法條格式，也不是百科裡的原圖。
  - 百科把過失也算結果運氣的一種。本頁不重述百科的煞車例子。
  sources:
  - sep-moral
  - penal-12
