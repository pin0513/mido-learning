  - 請 AI 再寫一對只差在結果的虛構案例，不要用真實新聞，也不要替你選立場
  human_experience:
  - 用自己的話寫：結果應不應該改變這兩個人的責任，並標出你用的是道德判斷還是刑法第 276 條
idea: 兩個人做了一樣的決定，結果卻因運氣不同。道德上怎麼看，和法律為什麼把過失致死寫成要有死亡，是兩題。
guiding_questions:
- 兩個人同樣闖紅燈，為什麼一個可能碰上刑法第 276 條、另一個碰不上？
- 結果不同，道德上的責任就該不同嗎？
- 什麼叫結果運氣？
scenario: 同一路口、同樣沒有減速，甲和乙都闖了紅燈。兩人當時都沒看到有沒有人。甲這次有行人在，行人死亡。乙這次沒有人在，沒有人被撞到。兩人的決定一樣，結果不一樣。
formats:
  slides: []
  exercise: 目標：用結果運氣分析這兩個只差在運氣的虛構案例，對照過失處罰為什麼要有特別規定、第 276 條為什麼寫成有死亡，並寫下自己的立場。　檢核：立場寫明結果該不該改變責任；法條只放在有死亡的那一次旁邊，沒有把沒撞到的那一次說成適用第 276 條；本頁的結論欄留白。
