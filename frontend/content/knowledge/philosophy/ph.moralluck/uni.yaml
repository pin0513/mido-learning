- I-PING Huang
updated: '2026-11-10'
goal: 用結果運氣分析兩個只差在運氣的虛構案例，對照法律為什麼過失的處罰要有特別規定、過失致死要有死亡的結果，並寫下自己的立場。
review: 立場寫明結果該不該改變責任；法條只放在有死亡的那一次旁邊；沒有替兩人定罪。
audience:
- adult
