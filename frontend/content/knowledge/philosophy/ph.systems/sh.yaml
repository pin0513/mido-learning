    code: 地 2b-V-3
  - title: 行動方案評估影響
    text: 社會 公 3d-V-1：規劃具有公共性或利他性的行動方案並評估其影響。
    code: 公 3d-V-1
  - title: 建立模型知局限
    text: 自然科學 tm-Vc-1：能依據科學問題自行運思或經由合作討論來建立模型，並能使用例如：「比擬或抽象」的形式來描述一個系統化的科學現象，進而了解模型有其局限性。
    code: tm-Vc-1
