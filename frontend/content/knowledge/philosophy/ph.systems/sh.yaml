why:
  heading: 好意也會有副作用
  body:
  - 系統是彼此影響的一群東西，改一個地方，別的地方也會跟著變（本站整理）。系統思考學者梅多斯說，槓桿點是系統裡「where a small shift in one thing can produce big changes in everything.」的地方，也就是一個小改變可以帶來全面的大改變（翻譯是本站整理）。她也說，槓桿點「are not intuitive」，我們常常用反了，反而讓問題更糟（翻譯是本站整理）。
  - 地理課綱要高中生「理解地理環境的系統運作，體認環境倫理的內涵。」公民課要學生「規劃具有公共性或利他性的行動方案並評估其影響。」自然科學課則要學生建立模型來描述系統化的現象，「進而了解模型有其局限性。」
  qa:
    question: 有沒有哪個「解決方法」反而讓問題更嚴重？
    answer: 有。例如校門口早上很塞，學校多開一塊讓家長臨時停車的地方，結果更多家長開車來，反而更塞（例子是本站整理）。梅多斯說，我們常常直覺地把槓桿點用反了：「we intuitively use them backward, systematically worsening whatever problems we are trying to solve.」（翻譯是本站整理：用反了，反而讓想解決的問題更糟）。
    source: meadows-leverage
