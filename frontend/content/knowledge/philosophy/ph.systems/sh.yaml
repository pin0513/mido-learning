how:
  heading: 畫系統圖找槓桿點
  body:
  - 先畫系統圖：觀察上學時段校門口的交通，寫下會變多變少的東西，例如車輛數、等待時間、走路上學的同學，再用箭頭連起來，標上同向（一個變多，另一個也跟著變多；變少也跟著變少）或反向（一個變多，另一個反而變少）（本站建議）。觀察時站在人行道或校內安全的地方，不走進車道。箭頭繞一圈回到起點的環，就是回饋環（本站整理）。
  - 再找槓桿點，也就是小改變能帶來大改變的地方（本站整理）。梅多斯把調整數字放在最後：「Parameters are dead last on my list of powerful interventions.」，調整參數，例如多派一位導護，通常最沒力（翻譯是本站整理）。比較有力的常是資訊和回饋，她說「Missing feedback is one of the most common causes of system malfunction.」，缺少回饋是系統失靈最常見的原因之一（翻譯是本站整理）。例如讓家長看到每天各時段的等待時間，可能比多派人更有用（例子是本站整理）。
  - 最後寫副作用：每個方案問一句，它會讓箭頭另一頭的東西變多還是變少？誰會受影響？再訪談導護志工或同學，修正系統圖（本站建議）。
  qa:
    question: 為什麼調整數字常常沒什麼用？
    answer: 因為參數改了，系統的結構沒變（本站整理）。梅多斯說「Parameters are dead last on my list of powerful interventions.」（翻譯是本站整理：在她列的有力介入清單上，參數排最後）。改變回饋、資訊或規則，常常更有力。
    source: meadows-leverage
  items_title: 系統圖要有
  items:
  - title: 會變的東西
    text: 車輛數、等待時間。
  - title: 箭頭與方向
    text: 同向或反向。
  - title: 回饋環
    text: 繞回起點的環。
  - title: 副作用
    text: 方案會影響誰。
  checklist_title: 畫完檢查一下
  checklist:
