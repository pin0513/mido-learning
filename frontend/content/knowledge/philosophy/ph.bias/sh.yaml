  source: zonghe
why:
  heading: 大腦的省力捷徑
  body:
  - 人在判斷時會用省力的捷徑。一本談分析判斷的經典書說，這些捷徑常常有用，但在很多情況下「they lead to predictably faulty judgments known as cognitive biases.」，也就是會導致可以預期的錯誤判斷，稱為認知偏誤（翻譯是本站整理）。
  - 生命教育課綱把「以偏見及謬誤的各種形式呈現思考的阻礙。」列為學習內容，也要學生「摒除阻礙思考之負面因素」；歷史課則要高中生「聆聽他人並陳述自己的觀點，檢視自己的盲點與偏見，形成新的觀點。」
  qa:
    question: 知道自己有偏誤，就不會再犯了嗎？
    answer: 不會。書裡說認知偏誤像視覺錯覺，「the error remains compelling even when one is fully aware of its nature.」，而且「Awareness of the bias, by itself, does not produce a more accurate perception.」（翻譯是本站整理：就算完全知道，錯覺還是很有說服力；光知道偏誤，不會讓判斷變準）。所以要靠方法，例如刻意去找反面的證據（本站整理）。
    source: heuer-bias
