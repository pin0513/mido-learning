idea: 人腦有省力的捷徑，也因此有固定的盲點，例如確認偏誤和錨定效應。光知道它們還不夠，要靠方法踩煞車。
guiding_questions:
- 你最近一次只找支持自己的資料是什麼時候？
- 知道自己有偏誤，就不會再犯了嗎？
- 第一個看到的數字，為什麼會影響你的估計？
scenario: 寫一週決策日記，記下每個決定的理由，週末找出可能的偏誤（本站建議）。
