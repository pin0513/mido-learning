idea: 人腦有省力的捷徑，也因此有固定的盲點，例如確認偏誤、從眾、錨定效應。認識它們才能踩煞車。
guiding_questions:
  - 你最近一次只找「支持自己」的資料是什麼時候？
scenario: 寫一週「決策日記」，記下每個決定的理由，週末找出可能的偏誤。
