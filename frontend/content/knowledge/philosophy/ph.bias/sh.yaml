how:
  heading: 用決策日記抓盲點
  body:
  - 先認識兩種常見的偏誤。確認偏誤是偏愛支持自己的資料：書裡說，人常常「give more weight to information that supports a hypothesis than to information that weakens it.」，也就是支持的資料看得比較重，削弱的資料看得比較輕（翻譯是本站整理）。錨定效應是被第一個數字拉住：書裡說，起點會像「an anchor or drag」一樣減少調整，最後的估計離起點太近（翻譯是本站整理）。
  - 寫一週決策日記：每天記下一個決定，寫三件事：當時的理由、找了哪些資料、有沒有先看到某個數字或說法（本站建議）。週末回頭看，每個決定問兩個問題：我有沒有只找支持自己的資料？我的估計是不是被第一個看到的數字拉住？
  - 踩煞車的方法：替每個決定找一個反面的證據，再問一個看法不同的同學（本站建議）。光知道偏誤還不夠，要靠這類方法。書裡也說，錨定「can be demonstrated very simply in a classroom exercise」（翻譯是本站整理：用很簡單的課堂練習就能示範）；全班分組先看不同的起點數字，再估計同一題，比較結果（本站建議）。
  qa:
    question: 第一個看到的數字，為什麼會影響你的估計？
    answer: 因為我們會從第一個數字開始調整，但調整得不夠。書裡說，起點會變成「an anchor or drag that reduces the amount of adjustment」，所以最後的估計還是太接近起點（翻譯是本站整理）。
    source: heuer-bias
  items_title: 每個決定記下
  items:
  - title: 當時的理由
    text: 為什麼這樣決定。
  - title: 找了哪些資料
    text: 支持的和反對的。
  - title: 先看到的數字
    text: 有沒有被它拉住。
  - title: 一個反面證據
    text: 替決定找反例。
  checklist_title: 週末檢查一下
  checklist:
  - 每天都有記
  - 標出可能偏誤
  - 找了反面證據
