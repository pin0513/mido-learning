why:
  heading: 沒做也可能要負責
  body:
  - 值日生今天的工作是關窗。他沒關，雨把筆記本打濕了。路過的同學也沒關，可是關窗不是他的工作，班上也沒有跟他約定。兩個人都沒做，只有被派了工作的值日生要問責任（例子是本站整理）。
  - 該做的事通常從兩個地方來：一個是角色，例如值日生、園丁；一個是約定，例如大家說好輪流關窗。有這項該做的事、卻沒做，才進到「沒做也要問責任」。沒有這項角色、也沒有約定的人，這一點先不把他算進同一種責任。
  items_title: 責任從哪裡來
  items:
  - title: 權利與責任
    text: 兒童在生活中擁有許多權利（可包括生存權、學習權、表意權、隱私權、身體自主權及不受歧視的權利等）與責任（可包括遵守規範、尊重他人或維護公共利益等）。
    code: 社會:Ac-II-1
  - title: 從角色來
    text: 值日生是班上的角色。關窗是這個角色今天的工作。沒關，是該做的沒做。
  - title: 從約定來
    text: 如果大家說好輪流關窗，約定本身就是該做的事。沒有說好的人，不靠這一點被算進去。
  qa:
    question: 該做的事沒做，為什麼也可能要負責？
    answer: 因為那件事本來是他的工作，或大家約定過。沒有動手，不代表不用問。先問他有沒有該做的事。
    source: social108
  sources:
  - social108
how:
  heading: 先問誰有這工作
  body:
  - 花枯了，是因為沒有澆水。先找原因，是上一類的問題。接著才問誰有澆水的工作。園丁的工作是澆水。路過的人沒有這項角色，也沒有約定要澆。所以這一點怪有工作卻沒做的園丁，不把每個路過的人算成同一種責任。
  - 站在花園旁、澆得到水卻沒澆的人，用「假如沒有」會被算進去。那一題太寬，是別的知識點。這一點更窄：只問誰被派了這項工作，或誰答應過。路過的人是不是原因，這裡不回答。
  checklist_title: 問責任之前
  checklist:
  - 誰有該做的事
  - 角色或約定
  - 沒做先問責任
  - 不判斷是原因
  figures:
  - duty-compare
  qa:
    question: 花枯死了，為什麼怪園丁，不怪路過的人？
    answer: 園丁的工作是澆水，沒澆就是該做的沒做。路過的人沒有這項角色，也沒有約定。這一點不說他是不是原因。
    source: social108
  sources:
  - social108
  - sep-doing
what:
  heading: 責任比原因窄
  body:
  - 百科一開頭問：做了傷害，和只是沒有阻止，在道德上有沒有差別。國小這一點先不回答哪一種比較重。先把「有該做的事」圈出來。沒有這圈的人，不跟有工作的人放在同一種責任裡。
  items:
  - title: 先圈再問
    text: 先說這件事是誰的角色或約定。圈裡的人沒做，才問責任。圈外的人，這一點先停住。
  qa:
    question: 責任從哪裡來？
    answer: 從角色來，例如值日生、園丁；或從約定來，例如大家說好輪流做。兩種都要能指出來，才說他有該做的事。
    source: sep-doing
  sources:
  - sep-doing
  notes:
  - 對照圖是本站整理，不是課綱或百科裡的原圖。
  - 這一點不下誰該賠、誰該受罰的結論。
