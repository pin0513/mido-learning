idea: 演繹是前提真、結論就必真；歸納是從例子推到通則；溯因是找出最好的解釋。三種推理各有用處與風險。
guiding_questions:
- 為什麼看過一萬隻白天鵝，還是不能保證天鵝都是白的？
- 數學歸納法是歸納嗎？
- 醫師看病時用的是哪一種推理？
scenario: 老師挑一段偵探小說和一個醫師診斷的案例，學生把推理拆成步驟，逐步標出用的是演繹、歸納還是溯因（本站建議）。
