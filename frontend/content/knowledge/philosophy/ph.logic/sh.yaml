how:
  heading: 一步一步標出推理方式
  body:
  - 先看演繹：前提如果都是真的，結論一定是真的。研究溯因的文章說，演繹推論裡「the truth of the premises guarantees the truth of the conclusion.」，也就是前提保證結論（翻譯是本站整理）。三段論就是例子：所有人都會死，蘇格拉底是人，所以蘇格拉底會死（例子是本站整理）。數學歸納法名字裡有歸納，其實是演繹：證明了第一項成立，也證明了只要某一項成立、下一項就成立，結論就一定成立（本站整理）。
  - 再看另外兩種。文章說，一般會把不保證結論的推論「into inductive and abductive ones」，分成歸納和溯因（翻譯是本站整理）。歸納是從很多例子推到通則，例子再多也可能遇到反例，這就是白天鵝的問題。溯因是替眼前的現象找最好的解釋；文章說，溯因被認為是「the predominant mode of reasoning in medical diagnosis」，醫師會選最能解釋病人症狀的假設（翻譯是本站整理）。
  - 練習時，每一步問三個問題：前提都對，結論一定對嗎？是的話是演繹。是從多個例子推到通則嗎？是歸納。是在幾個可能的解釋裡挑最好的嗎？是溯因。歸納和溯因的結論要寫上可能，並寫出什麼新證據會推翻它（本站建議）。
  qa:
    question: 數學歸納法是歸納嗎？
    answer: 不是，它是演繹。數學歸納法先證明第一項成立，再證明某一項成立時下一項也成立，所以結論一定成立，不只是比較可能（本站整理）。數學課綱的核心素養也要學生「了解數學在觀察歸納之後還須演繹證明的思維特徵及其價值。」：觀察例子可以幫你猜出規律，證明才讓它確定。
    source: math108
  items_title: 每一步這樣標
  items:
  - title: 一定對嗎？
    text: 前提都對，結論必真是演繹。
  - title: 從例子推？
    text: 從多個例子推到通則是歸納。
  - title: 最好的解釋？
    text: 挑最能解釋現象的是溯因。
  - title: 寫上可能
    text: 歸納、溯因的結論要留餘地。
  checklist_title: 標完檢查一下
  checklist:
  - 每步都有標記
  - 寫出推翻條件
  activity_figure: logic-flow
  sources:
  - sep-abduction
  - math108
what:
  heading: 說得出自己怎麼推
  body:
  - 學完後，學生讀一段偵探小說或一個醫師診斷的案例，能把每一步標成演繹、歸納或溯因，說出哪幾步的結論一定成立、哪幾步只是可能，並為每個可能的結論寫一個會推翻它的新證據。
  items_title: 學完能做到
  items:
  - title: 分辨三種推理
    text: 每一步都標得出來。
  - title: 說出可靠程度
    text: 一定成立或只是可能。
  - title: 找出推翻條件
    text: 什麼證據會改變結論。
  checklist_title: 家長檢核
  checklist:
  - 每步都有標記
  - 分得出一定與可能
  - 有寫推翻條件
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  sources:
  - genai-student
  - moe-ai-guide
