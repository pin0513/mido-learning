why:
  heading: 三種推理，各有分寸
  body:
  - 寫報告、讀新聞、解數學題，都在推理。研究溯因的哲學文章說，溯因「is normally thought of as being one of three major types of inference, the other two being deduction and induction.」，也就是一般把推理分成演繹、歸納、溯因三大類（翻譯是本站整理）。分得清自己用的是哪一種，才知道結論有多可靠。
  - 國語課綱要高中生認識「論證方式如歸納、演繹、因果論證等。」數學課綱要學生「理解數學歸納法的意義，並能用於數學論證。」生命教育也把「正確思考的基本邏輯。」列為學習內容，補充說明舉的例子是三段論。
  qa:
    question: 為什麼看過一萬隻白天鵝，還是不能保證天鵝都是白的？
    answer: 因為歸納是從看過的例子推到沒看過的，例子再多，也只是讓結論比較可能。研究波普的文章說，用經驗「verify a universal proposition」在邏輯上是不可能的，但「a single genuine counter-instance falsifies the corresponding universal law.」（翻譯是本站整理：一個真正的反例就能推翻對應的通則）。只要真的找到一隻黑天鵝，天鵝都是白的這個通則就被推翻了。
    source: sep-popper
  items_title: 課綱裡的推理
  items:
  - title: 歸納演繹的論證
    text: 國語文 Bd-V-2：論證方式如歸納、演繹、因果論證等。
    code: Bd-V-2
  - title: 數學歸納法
    text: 數學 n-V-5：能察覺規律並以一般項或遞迴方式表現，進而熟悉級數的操作。理解數學歸納法的意義，並能用於數學論證。
    code: n-V-5
  - title: 正確思考的邏輯
    text: 綜合活動 生 Aa-V-2：正確思考的基本邏輯。
    code: 生 Aa-V-2
