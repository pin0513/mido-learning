- 核心素養 A2、B1：依總綱 p.4–6 高級中等學校教育的 U-A2、U-B1 與國語文領綱的國S-U-A2、國S-U-B1、數學領綱的數S-U-A2、數S-U-B1、綜合活動領綱的綜S-U-A2 原文確認（表格窄欄分散對齊，字距大，文字用 pdftotext 原始順序層與頁面文字塊核對；跨頁的標 p.a–b）。
- stage 不填 grades：高中的學習重點沒有再分年級，總綱 p.7 說高級中等學校十、十一、十二年級為第五學習階段；本點的代碼都是第五學習階段（V）。
- 頁碼都是頁腳印的頁碼：國語文領綱比 PDF 頁少 2，數學領綱少 3，社會、自然科學、綜合活動、科技領綱與總綱少 4，議題融入說明手冊少 16，Heuer 的 Psychology of Intelligence Analysis 少 28，NIST AI 600-1 少 4；教育部 AI 指引與 PDF 頁相同。
- est_time 寫高中生命教育課：綜合活動領綱 p.2 的高中部定必修有生命教育 1 學分；本點的綜合活動代碼都出自生命教育。
- 新增學習內容代碼 生 Aa-V-2（綜合活動領綱附錄二 p.95，生命教育）；Bd-V-2、n-V-5 沿用代碼表的文字與頁碼，n-V-5 依 B22 schema 放進 curriculum_108.performances。
- domains 加上綜合活動：生命教育的學習內容 生 Aa-V-2 是正確思考的基本邏輯，補充說明舉三段論；原稿的數學、語文保留。綜合活動領綱的核心素養沒有 B1，只引綜S-U-A2。
- 原 idea 的「演繹從普遍推到個別」改成前提真、結論就必真：演繹也可以從個別推到個別，SEP Abduction 用前提保證結論來界定演繹。
- 原 scenario 保留偵探小說與醫師診斷，補上由老師挑選案例，並標本站建議。
- 原 ai.delegable「產生更多案例讓你練習分類」補上使用條件（本站建議）。
- 高中的 ai.delegable 不改成由老師或家長操作：教育部《高級中等以下學校人工智慧使用和學習指引》讓高中生在規則內自己使用（同 B15、B19 高中的做法），每條補上使用條件（本站建議），What 加上注意事項（學生版）與指引的使用規則。
- Abduction（Igor Douven）與 Karl Popper（Stephen Thornton）是 Stanford Encyclopedia of Philosophy 的條目；英文短句引用，中文說明是本站整理。
