why:
  heading: 流暢不等於正確
  body:
  - 生成式 AI 會一本正經地說錯話。美國國家標準與技術研究院的報告說，這種現象和模型的設計方式有關：「Confabulations are a natural result of the way generative models are designed」（翻譯是本站整理：編造是生成式模型設計方式的自然結果）。報告說，統計預測可以產生正確的內容，但「it can also produce outputs that are factually inaccurate or internally inconsistent.」（翻譯是本站整理：也可能產生與事實不符或前後矛盾的內容）。
  - 科技課綱要高中生「能使用多元的觀點思辨資訊科技相關議題。」並認識「資料探勘與機器學習的基本概念。」國語課要學生「廣泛運用工具書及資訊網絡蒐集、分析資料，提高綜合學習和應用能力。」查證 AI 的回答，兩邊一起練。
  qa:
    question: AI 為什麼會說出流暢卻錯的話？
    answer: 因為生成式 AI 是照訓練資料的統計規律產生內容，通常不是先查證再回答（本站整理）。報告說，統計預測「can produce factually accurate and consistent outputs」，但也可能產生與事實不符或前後矛盾的內容（翻譯是本站整理）。所以流暢只代表像，不代表對。
    source: nist-genai
  items_title: 課綱裡的資訊判斷
  items:
  - title: 多元觀點思辨
    text: 科技 運 a-V-2：能使用多元的觀點思辨資訊科技相關議題。
    code: 運 a-V-2
  - title: 機器學習基本概念
    text: 科技 資 D-V-2：資料探勘與機器學習的基本概念。
    code: 資 D-V-2
