idea: AI 的回答可能很流暢卻是錯的。要追問來源、交叉比對，並分辨它是在給事實、推論還是猜測。
guiding_questions:
- AI 說得很有把握時，你會比較相信它嗎？
- AI 為什麼會說出流暢卻錯的話？
- AI 附上的理由和出處，就一定可信嗎？
scenario: 請 AI 回答你自主學習主題的三個問題，逐句查證，標出正確、可疑與錯誤（本站建議）。
