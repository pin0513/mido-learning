what:
  heading: 決定信不信、信多少
  body:
  - 學完後，學生能把 AI 的回答拆成句子，分辨事實、推論和猜測，逐句找來源查證，標出正確、可疑與錯誤，並說得出為什麼 AI 說得很有把握也不代表比較可信。
  items_title: 學完能做到
  items:
  - title: 拆句分類
    text: 事實、推論、猜測。
  - title: 逐句查證
    text: 找獨立來源核對。
  - title: 決定信多少
    text: 看查證結果，不看語氣。
  checklist_title: 家長檢核
  checklist:
  - 每句都有標記
  - 查證來源有記
  - 說得出為什麼
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  - 本點融入資訊教育議題：議題融入說明手冊說，資訊教育在國中與高中「已經規劃有科技領域課程，因此建議參考十二年國民基本教育科技領域課程綱要」，所以本點的學習重點用科技領綱高中的條目。
  sources:
  - genai-student
  - moe-ai-guide
  - issues-handbook
