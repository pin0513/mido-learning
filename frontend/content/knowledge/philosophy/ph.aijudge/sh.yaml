how:
  heading: 逐句查證 AI 的回答
  body:
  - 先把回答拆成句子，每一句標出它在給什麼：事實（可以查證的）、推論（從事實推出來的）、還是猜測（沒有根據的）（本站建議）。
  - 再逐句查證：事實去找可靠的來源核對，兩個彼此獨立的來源說法一致才算確認；推論檢查前提對不對、推得過去嗎（本站建議）。AI 附上的理由和出處也要查：報告說，AI 可能給出「confabulated logic or citations」，用編造的推理或出處來替答案辯護；也說「LLMs sometimes provide logical steps for how they arrived at an answer even when the answer itself is incorrect.」（翻譯是本站整理：答案錯了，也可能附上推理步驟）。
  - 最後用三色標記：正確、可疑、錯誤。AI 說得很有把握，不代表比較可信；報告提醒，使用者常因為回答的語氣很有自信而相信錯誤內容（本站整理），所以標記只看查證結果，不看語氣（本站建議）。依教育部指引，學生要「主動提問、比較多方資料並做出自己的判斷，為最終決定負責。」
  qa:
    question: AI 說得很有把握時，你會比較相信它嗎？
    answer: 不該因此比較相信。報告說，風險會出現在使用者相信了錯誤內容的時候：「Risks from confabulations may arise when users believe false content」，而這常跟回答的自信語氣有關（翻譯是本站整理）。判斷可信度要看查證結果，不看語氣（本站建議）。
    source: nist-genai
  items_title: 每句這樣查
  items:
  - title: 事實推論猜測
    text: 這句在給什麼？
  - title: 找來源核對
    text: 兩個獨立來源一致。
  - title: 查理由與出處
    text: 出處真的存在嗎？
  - title: 三色標記
    text: 正確、可疑、錯誤。
  checklist_title: 查完檢查一下
  checklist:
  - 每句都有標記
  - 出處都查過
  - 記下查證來源
