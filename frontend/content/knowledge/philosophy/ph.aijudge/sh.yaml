  supports: 「Confabulations are a natural result of the way generative models are designed」（p.6）；「While such statistical prediction can produce factually accurate and consistent outputs, it can also produce outputs that are factually inaccurate or internally inconsistent.」（p.6）；「Risks from confabulations may arise when users believe false content」（p.6）；「confabulated logic or citations」（p.6）；「LLMs sometimes provide logical steps for how they arrived at an answer even when the answer itself is incorrect.」（p.6）
