why:
  heading: 是什麼，推不出應該
  body:
  - 一間沒有人住的老房子倒了。同一個星期有地震，也有人說多年前施工少放了材料。兩件事都和倒塌一起出現。先備已經說過，一起出現不夠，還要問假如沒有（例子是本站整理）。
  - 問完還要再問：我們在用哪一種規範。科學問的是什麼條件會讓房子倒。道德或法律問的是誰有義務。史丹佛哲學百科整理一種主要讀法：「no ought-judgment may be correctly inferred from a set of premises expressed only in terms of」是。頁面上接著用引號標出 is。意思是：只用「是什麼」寫成的前提，推不出「應該怎樣」（翻譯是本站整理）。百科說這種從是到應該的推論，在休謨看來「altogether inconceivable」。
  qa:
    question: 從「是什麼」可以直接推出「應該怎樣」嗎？
    answer: 依這一頁讀到的主要解釋，不行。事實前提還要另外接上一條規範，才談得上應該。本點不決定那條規範的內容。
    source: sep-hume-moral
  items_title: 兩種問題
  items:
  - title: 科學問題
    text: 什麼條件會讓房子倒。
  - title: 規範問題
    text: 誰有義務做某件事。
  - title: 提出論證
    text: 整合公民知識，論述自己的主張，並能提出合理的論證。
    code: 公 1c-V-2
  - title: 分開事實和解釋
    text: 分辨歷史事實、史料證據與歷史解釋，說明歷史解釋不同的原因，並檢視證據的適切性。
    code: 歷 3b-V-3
  sources:
  - sep-hume-moral
  - social108
how:
  heading: 三道篩子按順序
  body:
  - 第一道：它們有沒有一起發生。老房子倒了，那個星期有地震，這是事實，還不是原因（本站整理）。
  - 第二道：假如沒有。假如沒有地震，房子還會不會倒？假如施工時材料沒少，房子還會不會倒？兩句都要寫出來，而且不要把沒碰過這房子的人寫進去。這是上一階的問法。
  - 第三道：誰有義務。這一階只把問題擺出來，不引用法條、也不說施工的人或地震「應該」負責。公民課要「整合公民知識，論述自己的主張，並能提出合理的論證」；合理的第一步是說清楚你用的規範是哪一種（本站整理）。
  items_title: 三道都要寫
  items:
  - title: 第一道
    example: 房子倒了，同時有地震。
    text: 只寫一起發生的事實。
  - title: 第二道
    example: 假如沒有地震呢？
    text: 再問假如沒有。
  - title: 第三道
    example: 這次問的是義務嗎？
    text: 標出你用的規範。
  - title: 先不下結論
    example: 不表決誰該負責。
    text: 篩子不是判決。
  checklist_title: 交出去之前
  checklist:
  - 事實是什麼
  - 反事實成立嗎
  - 依據哪條規範
  sources:
  - social108
  - sep-hume-moral
what:
  heading: 篩完只標出規範
  body:
  - 三道篩子的順序不能倒過來。先挑「誰有義務」，再回頭找一起發生的事，就會把結論藏進事實裡（本站整理）。
  - 歷史課要「分辨歷史事實、史料證據與歷史解釋，說明歷史解釋不同的原因，並檢視證據的適切性。」倒塌是事實，少放材料是有人提出的解釋，義務是另一種規範。三者不要寫成同一句（本站整理）。大學接著看 ph.philsci@uni 裡的相關與因果；法律條文上的因果在另一個學門。
  figures:
  - norm-flow
  notes:
  - 流程圖是本站整理，不是課綱或百科裡的原圖。
  - 本點的房子沒有人住，不用來討論傷亡。
  sources:
  - social108
  - sep-hume-moral
