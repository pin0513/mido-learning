what:
  heading: 分開檢查形式和前提
  body:
  - 學完後，你能把一段論述拆成前提和結論、寫成符號，判斷它的形式是否有效，用反例說明無效的論證，再檢查前提是否為真，說出它是否健全。
  items_title: 學完能做到
  items:
  - title: 寫成符號
    text: 一個簡單句子一個字母。
  - title: 判斷有效
    text: 用形式或反例。
  - title: 判斷健全
    text: 有效，前提也都真。
  checklist_title: 自我檢核
  checklist:
  - 符號寫出
  - 有效有理由
  - 健全有判斷
  notes:
  - 本頁的菸稅論證是虛構的例子，本站整理。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - genai-student
