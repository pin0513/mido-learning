  exercise: 目標：選一段政策論述，拆成前提和結論並補出沒寫出來的前提，寫成符號，判斷形式是否有效，無效時舉出反例，再逐條檢查前提，說出它是否健全。　檢核：不看本頁，說出有效和健全差在哪、為什麼有效的論證結論不一定是真的、怎麼用反例證明論證無效，並用自己選的政策論述說明它的形式和前提各有什麼問題。
