how:
  heading: 寫成符號，先查形式再查前提
  body:
  - 先把論述拆成前提和結論，補出沒寫出來的前提，再用一個字母代表一個簡單句子，例如 P 代表菸稅提高、Q 代表吸菸的人變少，寫成：若 P 則 Q；P；所以 Q（例子是本站整理）。寫成符號，是為了把形式和內容分開看：Assadian 在第 3 章討論「the explanation of validity in terms of logical form」，也說形式謬誤是「mistakes in an argument due to its logical form」（說明是本站整理）。
  - 接著查形式。常見的錯誤是肯定後件：若 P 則 Q；Q；所以 P。第 3 章的練習要學生用真值表證明「the fallacy of affirming the consequent」是無效的（說明是本站整理）。看不出是哪一種形式時，就找反例：「A counterexample is a scenario in which the premises of the argument are true while the conclusion is clearly false.」找得到反例，論證就無效（說明是本站整理）。
  - 最後查前提。有效的論證只確定一件事：前提都真時，結論必真；只要有一個前提是假的，結論就可能是假的（本站整理）。所以形式有效以後，再逐條問前提是不是真的、有沒有證據；政策論述常把有爭議的前提藏起來，要先補出來再檢查（本站整理）。形式有效、前提又都站得住，才是健全（本站整理）。AI 可以協助轉換符號、檢查推導，但哪些前提值得接受，要你自己判斷（本站整理）。
  qa:
    question: 怎麼證明一個論證無效？
    answer: 找反例：想出一個前提都真、結論卻假的情況，找得到就證明無效。教科書說反例是「a scenario in which the premises of the argument are true while the conclusion is clearly false」（說明是本站整理）。
    source: rebus-logic-ch2
  items_title: 本站建議的步驟
  items:
  - title: 拆前提和結論
    text: 補出沒寫出來的前提。
  - title: 寫成符號
