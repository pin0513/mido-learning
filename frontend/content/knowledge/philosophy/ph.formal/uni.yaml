idea: 用命題邏輯把論證形式化，區分「有效」（推理正確）與「健全」（推理正確且前提為真）。
guiding_questions:
- 一個有效的論證，結論一定是真的嗎？
- 怎麼證明一個論證無效？
- 把論證寫成符號，有什麼用？
scenario: 把一篇政策論述形式化，評估它是否有效、是否健全（本站建議）。
formats:
