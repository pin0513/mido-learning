why:
  heading: 有效不等於健全
  body:
  - 'Smith 在開放教科書《Introduction to Philosophy: Logic》第 2 章說「A valid argument is an argument whose premises guarantee the truth of the conclusion.」；前提又都是真的，才叫健全：「A valid deductive argument whose premises are all true is called a sound argument」（說明是本站整理）。他也說「Deductive arguments are either valid or invalid because of the form or structure of the argument.」有效只看形式，健全還要看內容（說明是本站整理）。'
  - 高中國語文學過「論證方式如歸納、演繹、因果論證等」，生命教育的補充說明提到「簡單的語句有效推論形式或三段論的基本推論形式」；大學要把論證寫成符號，分開檢查形式和前提（本站整理）。
  qa:
    question: 一個有效的論證，結論一定是真的嗎？
    answer: 不一定。有效只確定前提都真時結論必真；只要有一個前提是假的，結論就可能是假的。教科書說這種論證是「the structure is good, but the evidence is bad」（說明是本站整理）。
    source: rebus-logic-ch2
  items_title: 這一點用到的
  items:
  - title: 有效
    text: 前提都真時，結論不可能假。
  - title: 健全
    text: 有效，而且前提都真。
  - title: 邏輯形式
    text: 論證的結構，和內容分開。
  - title: 反例
    text: 前提都真、結論卻假的情況。
