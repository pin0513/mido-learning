how:
  heading: 寫下信心、找證據、再調整
  body:
  - 先選一個自己的判斷，寫下現在的信心（0 到 1 或百分比）和理由（本站建議）。這和全有全無的相信不同：教科書說，貝氏知識論先「discarding the traditional view of belief as an all-or-nothing affair」，不只問信不信，而是問有多相信（說明是本站整理）。再問兩個問題：如果我對，會看到什麼？如果我錯，會看到什麼？只有在一種情況下才容易出現的證據最有分量；兩種情況都很容易看到的證據，幾乎不該改變信心（本站整理）。教科書說貝氏定理「gives you the rules to follow to update your credences based on incoming evidence」，這種依證據更新的做法叫作條件化（說明是本站整理）。
  - 接著查先前機率：這種事本來有多常見？教科書提醒，「ignoring prior probabilities and focusing exclusively on the conditional probabilities is the notorious base-rate fallacy」（說明是本站整理）。算一次就看得出來：假設一千人裡只有 1 人有某種情況，檢驗對有的人 99% 會呈陽性，對沒有的人也有 5% 會誤判成陽性；一千人裡大約 51 人陽性，真的有的不到 1 人，陽性時真的有的機率只有約 2%（例子是本站整理，數字是示意）。起點不同的人，教科書說「enough evidence will wash out erroneous priors」，但也說短期內「subjective Bayesianism would allow someone to believe in unrealistic priors until enough evidence comes in.」（說明是本站整理）。Stanford 哲學百科說，這類意見會合的定理只在「under such and such contingent initial conditions」下成立，而且是在「the shared evidence accumulates indefinitely」時；條目也提醒「And the long run might be too long.」所以要先前機率不是 0 或 1、大家看到同樣的證據，而且對證據怎麼解讀的看法也一致（同一個證據在各假設下有多可能，教科書叫 likelihood，是在量「how well your hypothesis predicts the evidence」），信心才可能在長期靠近；先前機率是 0 的人，再多證據也動不了（說明是本站整理）。
  - 最後說出調整：信心調了多少、為什麼（本站建議）。不要把信心調到完全確定或完全不可能：教科書說「no matter how much evidence accrues, you will never be able to raise your credence to」1，也就是「absolute certainty」（說明是本站整理）。Stanford 哲學百科介紹的 Regularity 規範說，「if one has a credence in a logically consistent proposition, it is greater than 0」，這條規範在哲學上仍有爭論，但保留一點可能，才有被新證據改變的空間（說明是本站整理）。AI 可以幫你整理證據、試算機率，但信心該調多少、理由站不站得住，要你自己判斷（本站整理）。
  qa:
    question: 一個很準的檢驗呈陽性，為什麼還要看這種事本來有多常見？
    answer: 因為先前機率會大大影響結果：情況本來很少見時，陽性也可能多半是誤判。教科書說忽略先前機率、只看條件機率，是有名的「base-rate fallacy」（說明是本站整理）。
    source: rebus-epist-prob
  items_title: 四步做
  items:
  - title: 寫下信心和理由
    text: 先記下現在多相信。
  - title: 比較兩種情況
    text: 我對或我錯，各會看到什麼？
  - title: 查先前機率
    text: 這種事本來有多常見？
  - title: 說出調整
    text: 調了多少、為什麼。
