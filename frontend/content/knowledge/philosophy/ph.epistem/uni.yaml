what:
  heading: 依證據調整信心
  body:
  - 學完後，你能用信心程度描述自己的判斷，比較證據在我對和我錯時出現的可能，記得先看先前機率，並說出看到新證據後信心調了多少、為什麼。
  items_title: 學完能做到
  items:
  - title: 說出信心程度
    text: 不只說相信或不相信。
  - title: 判斷證據分量
    text: 我對或我錯時會不會出現。
  - title: 避開基本比率謬誤
    text: 先看這種事有多常見。
  checklist_title: 自我檢核
  checklist:
  - 信心寫成數字
  - 比較兩種情況
  - 說出調整理由
  notes:
  - 本頁的檢驗例子是虛構的，本站整理。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
