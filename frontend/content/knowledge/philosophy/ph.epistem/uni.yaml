why:
  heading: 相信有程度，證據會改變它
  body:
  - 'Lopez 在開放教科書《Introduction to Philosophy: Epistemology》第 6 章說，相信可以有程度：「your degree of belief in a proposition is the degree of confidence you have in that proposition」，可以放在 0 到 1 之間；形式知識論把它叫作 credence，也就是信心程度（說明是本站整理）。Stanford 哲學百科的 Bayesian Epistemology 條目也說，「Bayesian epistemologists study norms governing degrees of beliefs」，研究信心程度看到證據時該怎麼調整（說明是本站整理）。'
  - 高中歷史課要學生分辨史料證據與歷史解釋，並「檢視證據的適切性」；大學再往前一步：把我相信換成我有多相信，看到新證據時說得出要調多少、為什麼（本站整理）。
  qa:
    question: 什麼樣的證據會讓你改變最堅持的看法？
    answer: 如果我對就不太會出現、我錯了才容易出現的證據，最該讓人改變。教科書說，證據若是「easily obtained by chance」，就不該因此提高信心（說明是本站整理）。
    source: rebus-epist-prob
  items_title: 這一點用到的
  items:
  - title: 信心程度
    text: 多相信一件事，放在 0 到 1 之間。
  - title: 先前機率
    text: 還沒看新證據時的信心。
  - title: 條件化
    text: 依新證據更新信心。
  - title: 基本比率謬誤
    text: 只看證據，忘了先前機率。
