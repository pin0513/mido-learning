idea: 我們知道一件事，可能是親眼看到、聽別人說、或自己推想。不同的來源，可信度不一樣，機器說的也要想一想。
guiding_questions:
  - 聽說的事情，要怎麼確認是真的？
scenario: 神祕箱猜物：只能摸、只能聽或只能聽同學描述，猜完說出你是靠什麼知道的。
