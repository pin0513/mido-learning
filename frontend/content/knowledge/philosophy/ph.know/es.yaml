how:
  heading: 神祕箱：猜完說出根據
  body:
  - 大人先在箱子裡放一樣安全的物品，不放尖銳、易碎、會動的東西或食物（本站建議）。分三輪猜：第一輪只能伸手摸，第二輪只能搖一搖聽聲音，第三輪只能聽一位看過的同學描述。每輪寫下猜什麼，和靠什麼知道。
  - 打開箱子對答案，談談哪一輪猜錯、為什麼。摸和聽是自己的感官，可能把形狀或聲音相近的東西搞混；聽同學說，是靠別人的說法，說的人可能看錯或漏講；把線索拼起來猜，是自己推想，線索不夠就容易錯（本站整理）。
  - 最後練確認：聽到一句聽說的話，可以自己去看、問最早說的人、查書或可靠的網站，或請大人幫忙查。AI 的答案也要這樣查證，教育部提醒要「結合其他可靠來源的知識和批判性思維進行查證」。
  qa:
    question: 聽說的事情，要怎麼確認是真的？
    answer: 找第二個來源對一對：自己去看、問最早說的人，或查書、查可靠的網站（本站整理）。知識論把別人的說法列為知識的來源之一，但說的人也可能弄錯；文章說知識要來自「sources we have good reason to consider reliable」，所以重要的事要多查一個來源。
    source: sep-epist
  items_title: 四步做
  items:
  - title: 大人放物品
    text: 不放尖銳、易碎或食物。
  - title: 分三輪猜
    text: 摸、聽聲音、聽描述。
  - title: 寫下根據
    text: 每輪寫靠什麼知道。
  - title: 打開對答案
    text: 談哪一輪錯、為什麼。
  checklist_title: 猜完檢查一下
  checklist:
  - 寫下靠什麼知道
  - 說出為什麼猜錯
  - 想出確認方法
  activity_figure: know-flow
  sources:
  - sep-epist
  - genai-student
what:
  heading: 說得出我怎麼知道
  body:
  - 學完後，孩子猜一件事或回答問題時，能說出自己是靠看到摸到、聽別人說，還是自己推想知道的，說得出這種方法可能怎麼錯，也想得出兩種再確認的方法。
  items_title: 學完能做到
  items:
  - title: 說出來源
    text: 看到摸到、聽說，還是推想。
  - title: 說出可能的錯
    text: 感官、別人、線索都可能出錯。
  - title: 想出確認方法
    text: 自己看、問人、查資料。
  checklist_title: 家長檢核
  checklist:
  - 每次都寫根據
  - 說得出哪裡猜錯
  - 想得出兩種確認
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - genai-student
