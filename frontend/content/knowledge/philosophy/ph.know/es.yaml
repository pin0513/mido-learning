why:
  heading: 知道，是從哪裡來的
  body:
  - 我們相信一件事，總有個來源。研究知識的知識論說，要算是知識，信念必須「originate in sources we have good reason to consider reliable」，也就是來自有理由信得過的來源；常見的來源有「perception, introspection, memory, reason, and testimony」，也就是感官、內省、記憶、推理和別人的說法（翻譯是本站整理）。本點挑三種最常用的：自己看到摸到、聽別人說、自己推想。
  - 國語課綱要五、六年級學生「從聽聞內容進行判斷和提問，並做合理的應對。」上網查資料時，也要「進行資料蒐集、解讀與判斷」。AI 說的也一樣：教育部提醒，這些工具「無法自行判斷結果的正確性和合理性。」
  qa:
    question: 只能摸的時候，為什麼也會猜錯？
    answer: 因為感官也會出錯。知識論的文章說「It is easy to see how a perceptual seeming can go wrong」，摸起來像，不一定就是（翻譯是本站整理）。例如摸到圓圓硬硬的，可能是球，也可能是別的圓東西；多用一種感官，或打開來看，才比較確定（例子是本站整理）。
    source: sep-epist
