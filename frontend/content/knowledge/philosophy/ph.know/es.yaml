idea: 我們知道一件事，可能是親眼看到、聽別人說、或自己推想。不同的來源，可信度不一樣，機器說的也要想一想。
guiding_questions:
- 聽說的事情，要怎麼確認是真的？
- 只能摸的時候，為什麼也會猜錯？
- AI 說的答案，要怎麼查證？
scenario: 神祕箱猜物：箱子裡放大人檢查過的安全物品，只能摸、只能聽搖晃的聲音，或只能聽同學描述，猜完說出你是靠什麼知道的（本站建議）。
