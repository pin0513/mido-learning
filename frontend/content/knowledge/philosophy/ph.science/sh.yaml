what:
  heading: 說得出科學怎麼改
  body:
  - 學完後，學生能用地心說到日心說的例子，說出當時的人為什麼相信地心說、哪些觀察跟它不合、後來為什麼改變，並能判斷一個說法是否說得出什麼觀察會證明它錯。
  items_title: 學完能做到
  items:
  - title: 說出當時理由
    text: 古人相信也有證據。
  - title: 找出不合的觀察
    text: 異常怎麼累積。
  - title: 檢查可否證
    text: 說得出什麼會證明它錯。
  checklist_title: 家長檢核
  checklist:
  - 時間線完成
  - 說得出當時理由
  - 會檢查可否證
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  sources:
  - genai-student
  - moe-ai-guide
