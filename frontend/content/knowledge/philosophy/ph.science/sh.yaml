why:
  heading: 科學靠改錯變強
  body:
  - 波普認為，好的科學理論要可以被檢驗。研究波普的文章說，他拒絕把歸納當成科學的特徵方法，「substituting falsifiability in its place.」，也就是改用可否證性：理論要說得出什麼觀察會證明它錯（翻譯是本站整理）。怎麼樣都不會錯的說法，波普說是「simply non-testable, irrefutable.」，也就是無法檢驗、無法反駁（翻譯是本站整理）。
  - 自然科學課綱要高中生「了解科學的認知方式講求經驗證據性、合乎邏輯性、存疑和反覆檢視。」也要「了解科學知識是人們理解現象的一種解釋，但不是唯一的解釋。」歷史課則要「理解時空背景對歷史事件發展或人物的影響。」從地心說到日心說，正好兩邊一起看。
  qa:
    question: 什麼樣的說法，是怎麼樣都無法證明它錯的？那它還算科學嗎？
    answer: 不管發生什麼都能說得通的說法，就無法證明它錯，例如不管一個人做了什麼，都說成是小時候的經驗造成的（例子是本站整理，仿波普批評的精神分析一類理論）。波普認為這種說法不算科學；研究波普的文章引他批評某些理論：「There was no conceivable human behaviour which could contradict them」（翻譯是本站整理：沒有任何可以想像的人類行為能和它們矛盾）。怎麼樣都不會錯，也就沒辦法從錯誤中修正。
    source: sep-popper
