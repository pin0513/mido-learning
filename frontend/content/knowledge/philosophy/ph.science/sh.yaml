how:
  heading: 用地心說看科學修正
  body:
  - 先別急著笑古人。研究孔恩的文章說，他指出「Aristotelian science was genuine science」，做托勒密天文學的人是在做「an entirely reasonable and recognizably scientific project.」（翻譯是本站整理：亞里斯多德的科學是真正的科學，托勒密天文學是完全合理、也看得出是科學的工作）。地心說能預測天象，當時的人相信它是有理由的，不是不科學（本站整理）。
  - 再看理論怎麼被換掉。孔恩認為，平常遇到不合的觀察，「anomalies are ignored or explained away if at all possible.」，也就是異常常被忽略或解釋掉（翻譯是本站整理）。異常多到讓人對舊理論失去信心，才會出現危機；文章說「Crisis is followed by a scientific revolution if the existing paradigm is superseded by a rival.」（翻譯是本站整理：若舊典範被對手取代，危機之後就是科學革命）。所以一個反例不一定讓理論馬上被丟掉，但證據累積後，科學會修正自己。
  - 做法：把地心說到日心說畫成時間線，每一格寫三件事：當時的證據、理論的預測、跟它不合的觀察（本站建議）。最後用波普的標準檢查每個理論：說得出什麼觀察會證明它錯嗎？說得出來，就是可以被檢驗的說法。
  qa:
    question: 出現一個反例，理論就要馬上丟掉嗎？
    answer: 不一定。孔恩認為，平常科學家遇到異常，「anomalies are ignored or explained away if at all possible.」（翻譯是本站整理：異常能忽略或解釋掉，就會先這樣做）。要等異常多到讓人對舊典範失去信心，而且有對手理論可以取代，才會出現科學革命（本站整理）。
    source: sep-kuhn
  items_title: 時間線要寫
  items:
  - title: 當時的證據
    text: 他們看到了什麼？
  - title: 理論的預測
    text: 它說會發生什麼？
  - title: 不合的觀察
    text: 哪些現象對不上？
  - title: 能被推翻嗎
    text: 說得出什麼會證明它錯。
