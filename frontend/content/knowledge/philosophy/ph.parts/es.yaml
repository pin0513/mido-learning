est_time:
  school: 國小五、六年級綜合活動課
  source: zonghe
why:
  heading: 拿掉一個，整體會變
  body:
  - 綜合活動課綱要五、六年級學生「實踐環境友善行動，珍惜生態資源與環境。」補充說明也寫到要了解「生態資源的種類、所在地、重要性及其與環境的關係。」議題融入說明手冊的環境教育，要國小學生「參與戶外學習與自然體驗，覺知自然環境的美、平衡、與完整性。」
  - 花圃就是一個小小的整體。聯合國糧農組織說，全世界約 87.5% 的開花植物「are pollinated by animals」；少了授粉的動物，「many interconnected species and processes functioning within ecosystems would collapse」，意思是許多互相連結的物種和生態系裡的運作會垮掉（翻譯是本站整理）。
  qa:
    question: 花圃裡少了蜜蜂，花會怎樣？
    answer: 很多花要靠蜜蜂這類動物幫忙傳花粉，才能結出果實和種子；少了牠們，果實和種子可能變少，下一季的花也可能變少，吃果實的鳥也會受影響（本站整理）。糧農組織說，大部分開花植物「are pollinated by animals」。
    source: fao-poll
  items_title: 綜合活動領綱的學習重點
  items:
  - title: 環境友善行動
    text: 綜合活動 3d-III-1：實踐環境友善行動，珍惜生態資源與環境。
    code: 3d-III-1
  - title: 生態資源與環境
    text: 綜合活動 Cd-III-1：生態資源及其與環境的相關。
    code: Cd-III-1
