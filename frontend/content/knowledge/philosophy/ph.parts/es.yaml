how:
  heading: 畫出花圃的關係圖
  body:
  - 先觀察：大人陪同，在校園花圃旁站好，隔著一步以上的距離看，不碰、不抓、不追小動物；對蜂螫過敏的同學先告訴老師，站遠一點（本站建議）。把看到的植物、蟲、鳥，還有雨水、陽光、土壤寫在紙上。
  - 再連線：兩樣東西有關係就畫一條線，線旁寫誰幫誰或誰需要誰，例如蜜蜂幫花傳花粉、花需要雨水、鳥吃果實（例子是本站整理）。這就像大事拆成小事：先看清楚有哪些部分，再看它們怎麼連在一起。
  - 最後拿掉一個：用手遮住蜜蜂，沿著連線想，花傳不了花粉，果實和種子變少，吃果實的鳥也少了食物（本站整理）。班上也是一個整體，少了負責澆花的同學，花可能就沒人澆（例子是本站整理）。觀察完照原樣離開，不帶走花草和小動物，這就是課綱說的環境友善行動。
  qa:
    question: 觀察時，怎樣才不會打擾小動物？
    answer: 隔著距離看，不碰、不抓、不追，也不摘花草，看完照原樣離開（本站建議）。綜合活動課綱要學生「實踐環境友善行動，珍惜生態資源與環境。」安靜觀察就是一種友善行動。
    source: zonghe
  items_title: 四步做
  items:
  - title: 站好觀察
    text: 隔著距離，不碰不抓。
  - title: 寫下看到的
    text: 植物、蟲、鳥、雨水。
  - title: 畫線連起來
    text: 線旁寫誰幫誰。
  - title: 拿掉一個
    text: 沿著線想會怎樣。
  checklist_title: 觀察時檢查一下
  checklist:
  - 不碰不抓
  - 隔著距離看
  - 照原樣離開
  activity_figure: parts-flow
  sources:
  - zonghe
what:
  heading: 看見部分，也看見整體
  body:
  - 學完後，孩子觀察一個小環境時，能畫出裡面至少四樣東西的關係圖，說出每條線是誰幫誰或誰需要誰，並說出拿掉其中一樣，整體可能怎麼改變；觀察時做到不碰不抓、隔著距離看。
  items_title: 學完能做到
  items:
  - title: 畫出關係圖
    text: 每條線說得出關係。
  - title: 拿掉一個想
    text: 說出整體怎麼改變。
  - title: 友善觀察
    text: 不碰不抓，照原樣離開。
  checklist_title: 家長檢核
  checklist:
  - 關係圖有四樣以上
  - 線旁寫了關係
  - 說出少了會怎樣
  notes:
  - 本點融入環境教育議題：議題融入說明手冊國小的實質內涵有「參與戶外學習與自然體驗，覺知自然環境的美、平衡、與完整性。」到花圃觀察、畫出關係圖，就是在覺察自然的平衡與完整。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - issues-handbook
  - genai-student
