idea: 說「我覺得」之後，再補一句「因為」。有理由的想法，別人才聽得懂，也才能討論。
guiding_questions:
  - 有沒有一個理由，讓你改變了原本的想法？
scenario: 「小狗和金魚，誰比較適合當班寵？」每人說出主張和至少一個理由，再聽聽相反的理由。
