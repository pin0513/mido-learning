# ---------- 新增 ----------
why:
  heading: 有理由，別人才懂你
  body:
  - 國語課要學生樂於參加討論，提供自己的觀點和意見；讀文章時，也要找出支持作者觀點的理由。
  - 課綱把「議論」說成用論點、論據來表達看法。論點就是你的想法，論據就是你的理由。也就是說，只說「我覺得」，只有想法；補上「因為」，才有理由。五、六年級起，國語課會開始讀議論文。
  figures: [why-compare]
  qa:
    question: 「我覺得小狗比較好」和「我覺得小狗比較好，因為牠會陪我們玩」，哪一句讓人比較懂你？
    answer: 第二句。它多了理由，別人知道你為什麼這樣想，也才能回應：同意這個理由，或說出另一個理由。
    source: kuoyu
  sources: [kuoyu, zonggang, sinek]

how:
  heading: 我覺得……，因為……
  body:
  - 國語課綱建議在課堂上用討論、問答、論辯等方式發表意見或看法。這個練習就是一場小討論。
  items:
  - {title: 先說主張, text: 我覺得……, example: 我覺得金魚比較適合當班寵。}
  - {title: 再說理由, text: 因為……, example: 因為金魚不會吵到上課。}
  - {title: 聽相反的理由, text: 聽完再回應，不打斷。}
  - {title: 想一想有沒有改變, text: 哪個理由讓你想法變了？}
  checklist_title: 說完檢查一下
  checklist: [說出主張了嗎, 有說因為嗎, 理由對得上嗎, 聽完別人了嗎]
  activity_figure: how-flow
  sources: [kuoyu]

what:
  heading: 主張加理由
  notes:
  - 主張是「我覺得什麼」，理由是「為什麼」。國語課讀文章時，要找出「支持」觀點的理由，所以理由要能撐住主張。
  - 和別人理由不同不是吵架。國語課綱要學生與他人溝通時尊重不同意見，並理解與包容不同意見。
  - 上了國中，會進一步學習明確表達意見、進行有條理的論辯。
  sources: [kuoyu]

