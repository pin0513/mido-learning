idea: 說「我覺得」之後，再補一句「因為」。想法加上理由，別人才知道你為什麼這樣想，也才能回應你，或說出不一樣的理由。
guiding_questions:
- 有沒有一個理由，讓你改變了原本的想法？
- 「我覺得小狗比較好」和「我覺得小狗比較好，因為牠會陪我們玩」，哪一句讓人比較懂你？
- 別人的理由和你不一樣時，你可以怎麼回應？
scenario: 「小狗和金魚，誰比較適合當班寵？」只討論、不真的養。每人說出主張和至少一個理由，再聽聽相反的理由，最後說說有沒有哪個理由讓你想法變了。
goal: 說出自己的想法時，能用「因為」補上至少一個理由，也能好好聽完相反的理由。
review: 討論時，每個人都說出「我覺得……，因為……」，並且能複述一個和自己不同的理由。
