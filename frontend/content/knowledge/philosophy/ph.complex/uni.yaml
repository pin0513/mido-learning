how:
  heading: 做個簡單模擬，再問漏了什麼
  body:
  - 選一個模擬，例如一條單線道上的車：每輛車前面有空位就前進，偶爾無故減速（例子是本站整理）。先寫下每個個體的規則，再執行，觀察整體出現什麼現象，例如沒有車禍也會一段一段地塞住；沒有人安排、從個體規則自己長出來的整體現象，就是湧現（本站整理）。疾病傳播也一樣：每個人照接觸和康復的規則行動，看整體的病例曲線怎麼變（本站整理）。
  - '接著檢查結論可不可靠。Sayama 的教科書說「Here is a very brief summary of what a good model should look like: A good model is simple, valid, and robust.」這是一本教科書整理的三個標準（本站整理）。簡單是指：「If you can eliminate any parameters, variables, or assumptions from your model without losing its characteristic behavior, you should.」拿掉某個參數或假設、行為不變，就該拿掉（說明是本站整理）。符合觀察（valid）是指模型的預測和觀察有多吻合，也就是預測是否「agrees with the observed reality」（說明是本站整理）。穩健是指：「If the prediction made by your model is sensitive to their minor variations, then the conclusion derived from it is probably not reliable.」所以稍微改動規則，看結論變不變（說明是本站整理）。也不要讓模型太貼一組資料，否則「the model prediction may become adjusted too closely to a specific observation at the cost of generalizability to other cases.」（說明是本站整理）。'
  - 最後列出模型漏掉了什麼：司機的個性、天氣、車道變換、人會因為新聞而改變行為（本站整理）。模型一定要簡化，因為 Sayama 說建模就是「we want to have a shorter, simpler description of reality」，簡化了才算得動、看得懂（說明是本站整理）。所有模型都簡化，所以都有錯的地方，但 Epstein 說好的模型「are fruitfully wrong. They are illuminating abstractions.」它們讓我們看懂機制，不一定能準確預測（說明是本站整理）。AI 可以寫和執行模擬程式，但模型和真實世界差在哪，要你自己判斷（本站整理）。
  qa:
    question: 所有模型都是錯的，那為什麼還要用模型？
    answer: 因為簡化才讓人看懂機制。Epstein 說好的模型「are fruitfully wrong. They are illuminating abstractions.」它能解釋，不一定能準確預測（說明是本站整理）。
    source: epstein-why-model
