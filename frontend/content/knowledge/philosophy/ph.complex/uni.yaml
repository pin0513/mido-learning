why:
  heading: 模型會簡化，也會出錯
  body:
  - 每個個體只照簡單的規則行動，整體卻會出現沒有人安排的現象，例如沒有車禍也會塞車，這是湧現的常見例子（說明是本站整理）。哲學上講的湧現更嚴格：Emergent Properties 條目說「The general notion of emergence is meant to conjoin these twin characteristics of dependence and autonomy.」整體依存於組成部分，又有自己的規律；像鳥群這種「self-organizing group-level behaviors」，是說明湧現的一種方式（說明是本站整理）。條目用龍捲風舉例：它「depends for its existence on dust and debris」，但「one can have a rather good understanding of how tornadoes work while being entirely ignorant of particle physics」（說明是本站整理）。
  - 模型一定要簡化。Models in Science 條目說，理想化模型是「a deliberate simplification or distortion of something complicated with the objective of making it more tractable or understandable.」（說明是本站整理）。高中自然科學要學生建立模型，「進而了解模型有其局限性」；大學要說得出模型假設了什麼、漏掉了什麼（本站整理）。
  qa:
    question: 什麼是湧現？
    answer: 個體只照簡單的規則行動，整體卻出現沒有人安排的現象，像沒有車禍也會塞車。條目說理解龍捲風，可以「entirely ignorant of particle physics」（說明是本站整理）。
    source: sep-emergence
