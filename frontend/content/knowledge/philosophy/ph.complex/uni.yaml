what:
  heading: 用模型，也說出它的限度
  body:
  - 學完後，你能用簡單的模擬觀察湧現，用 Sayama 教科書提出的好模型三個標準檢查模擬，改動規則測試結論穩不穩，並說出模型假設了什麼、漏掉了真實世界的哪些東西。
  items_title: 學完能做到
  items:
  - title: 觀察湧現
    text: 簡單規則產生整體現象。
  - title: 檢查模型
    text: 簡單、符合觀察、穩健。
  - title: 說出限度
    text: 假設了什麼、漏了什麼。
  checklist_title: 自我檢核
  checklist:
  - 湧現說得出
  - 結論有測試
  - 限度寫出
  notes:
  - 本頁的交通和傳染病模擬是本站整理的例子。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
