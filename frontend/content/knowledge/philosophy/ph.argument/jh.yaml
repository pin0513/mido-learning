what:
  heading: 拆得開別人的說理
  body:
  - 學完後，孩子讀一篇議論文或社論，能標出結論和支持它的前提，畫成論證圖，找出一個沒說出口的前提，也說得出如果某個前提錯了，結論會怎樣。
  items_title: 學完能做到
  items:
  - title: 標出結論
    text: 找出這篇想說服你什麼。
  - title: 畫論證圖
    text: 前提用箭頭連到結論。
  - title: 找隱藏前提
    text: 補上沒說出口的那句。
  checklist_title: 家長檢核
  checklist:
  - 論證圖畫好了
  - 補上隱藏前提
  - 說得出前提錯時
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  - 本頁的 AI 活動由老師或家長操作，孩子在旁邊一起看、一起檢查 AI 的回答（本站建議）。
  sources:
  - genai-student
