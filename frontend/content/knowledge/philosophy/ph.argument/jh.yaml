    text: 國語文 5-IV-2：理解各類文本的句子、段落與主要概念，指出寫作的目的與觀點。
    code: 5-IV-2
  - title: 有條理的論辯
    text: 國語文 2-IV-3：依理解的內容，明確表達意見，進行有條理的論辯，並注重言談禮貌。
    code: 2-IV-3
  - title: 以事實理論為論據
    text: 國語文 Bd-IV-1：以事實、理論為論據，達到說服、建構、批判等目的。
    code: Bd-IV-1
  - title: 比較與比喻的論證
    text: 國語文 Bd-IV-2：論證方式如比較、比喻等。
    code: Bd-IV-2
