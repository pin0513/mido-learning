est_time:
  school: 國中七至九年級國語課
  source: kuoyu
why:
  heading: 看懂別人怎麼說服你
  body:
  - 報紙社論、網路貼文和廣告都在說服我們。研究論證的文章說，一段論證裡「some parts, known as the premises, offer support to another part, the conclusion」，也就是有些句子是前提，用來支持另一句結論（翻譯是本站整理）。看懂這個結構，才知道對方想說服你什麼、拿什麼來支持。
  - 國語課綱要國中生「理解各類文本的句子、段落與主要概念，指出寫作的目的與觀點。」議論文本的學習內容也說，議論要「以事實、理論為論據，達到說服、建構、批判等目的。」自己說理時，也要「明確表達意見，進行有條理的論辯」。
  qa:
    question: 如果某個前提是錯的，結論還站得住嗎？
    answer: 不一定。前提是用來支持結論的，論證的文章說，前提可能「guarantee the truth of the conclusion, or make its truth more probable」，也就是保證結論為真，或讓結論比較可能為真（翻譯是本站整理）。前提錯了，這份支持就不見了；結論也許另有理由，要再找找看（本站整理）。
    source: sep-argument
  items_title: 國語文領綱的學習重點
  items:
