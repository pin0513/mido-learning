how:
  heading: 畫論證圖：先找結論
  body:
  - 先找結論：問自己，這篇文章想要我相信什麼？結論常跟在所以、因此後面，前提常跟在因為、由於後面；論證的文章說，前提和結論之間常有「a stated or implicit marker」，也就是寫出來或沒寫出來的連接詞（翻譯是本站整理）。把結論寫在紙的最上面，前提寫在下面，再用箭頭連到它支持的句子（本站建議）。
  - 再找沒說出口的前提：假設寫出來的前提都對，結論還差哪一句才會成立？缺的那一句就是沒說出口的前提。例如社論說學生睡太少，所以學校應該晚點上課，沒說出口的前提是晚點上課學生就會多睡（例子是本站整理）。如果某個前提是錯的，結論就少了一個支撐，要再找別的理由才站得住。
  - 最後看前提怎麼支持：有的拿事實當論據，有的用比較或比喻，課綱說「論證方式如比較、比喻等。」用比喻時要問兩件事像不像；論證的文章說，這種論證的第一個前提要「establishes the analogy between two situations」，也就是先說明兩種情況相像（翻譯是本站整理）。
  qa:
    question: 沒說出口的前提要怎麼找？
    answer: 假設寫出來的前提都對，再問：結論還差哪一句才會成立？缺的那一句就是沒說出口的前提（本站整理）。因為論證是前提支持結論：「some parts, known as the premises, offer support to another part, the conclusion」，支持不夠的地方，常常就藏著沒說的前提。
    source: sep-argument
  items_title: 四步做
  items:
  - title: 找結論
    text: 這篇想要我相信什麼？
  - title: 連前提
    text: 用箭頭連到它支持的句子。
  - title: 補隱藏前提
    text: 結論還差哪一句？
  - title: 看支持方式
    text: 事實、比較或比喻。
