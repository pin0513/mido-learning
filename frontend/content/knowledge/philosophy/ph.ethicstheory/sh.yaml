how:
  heading: 用三欄表分析校規
  body:
  - 選一個校園議題，例如上課時手機怎麼管，畫三欄表（本站建議）。效益欄問：這條規定對所有受影響的人，好處和壞處加起來如何？義務欄問：有沒有該守的規則或權利，例如尊重個人財產、說到做到？德行欄問：這樣做會讓我們成為什麼樣的人，自律、負責，還是只想躲避規定？（本站整理）
  - 結果好但手段不對時，三欄常會吵架：效益欄可能說可以，義務欄可能說不行，德行欄會問做這件事的人會變成什麼樣子（本站整理）。文章提醒，三種取向都會談到美德、後果和規則，差別在把哪一個放在中心：「Each of the above-mentioned approaches can make room for virtues, consequences, and rules.」（翻譯是本站整理）。
  - 三種視角結論不同時，不要急著選邊：把三欄的理由都寫出來，找出彼此衝突的那一點，再寫自己的主張，說明為什麼在這個情況下某一欄的理由比較重（本站建議）。
  qa:
    question: 結果很好，但手段不對，這件事可以做嗎？
    answer: 要把三副眼鏡都戴上看看：效益看結果，義務看手段有沒有違反道德規則，德行看做這件事的人會變成什麼樣的人（本站整理）。文章說三種取向都能「make room for virtues, consequences, and rules」（翻譯是本站整理：都能容納美德、後果與規則），所以重點是把理由說清楚，再說明為什麼某一個理由比較重。
    source: sep-virtue
  items_title: 每欄這樣問
  items:
  - title: 效益
    text: 好處壞處加起來如何？
  - title: 義務
    text: 有沒有該守的規則？
  - title: 德行
    text: 會成為什麼樣的人？
  - title: 我的主張
    text: 哪一欄理由比較重。
  checklist_title: 寫完檢查一下
  checklist:
  - 三欄都有理由
  - 找出衝突點
  - 寫出自己的主張
  activity_figure: ethics-flow
  sources:
  - sep-virtue
what:
  heading: 把道德理由說清楚
  body:
  - 學完後，學生能用效益、義務、德行三種視角分析一個校園議題，寫出各自的理由與結論，找出它們衝突的地方，並提出自己的主張和理由。
  items_title: 學完能做到
  items:
  - title: 戴上三副眼鏡
    text: 效益、義務、德行。
  - title: 找出衝突點
    text: 三欄哪裡吵架。
  - title: 說出主張
    text: 說明為什麼這樣選。
  checklist_title: 家長檢核
  checklist:
  - 三欄表寫好
  - 找出衝突點
  - 主張有理由
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  - 本點融入生命教育議題：議題融入說明手冊高中的實質內涵要學生「思考人類福祉、生命意義、幸福、道德與至善的整體脈絡。」並在具爭議性的議題上「進行價值思辨，尋求解決之道。」
  sources:
  - genai-student
  - moe-ai-guide
  - issues-handbook
