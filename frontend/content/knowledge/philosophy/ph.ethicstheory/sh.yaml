est_time:
  school: 高中生命教育課
  source: zonghe
why:
  heading: 三副眼鏡看對錯
  body:
  - 倫理學有三種主要的視角。研究德行倫理的哲學文章說，德行倫理強調美德或品格，不同於強調「duties or rules」的義務論，也不同於強調「the consequences of actions」的後果論（翻譯是本站整理）。效益主義是後果論裡最有名的一種，看行為能不能讓大家的福祉最大（本站整理）。
  - 生命教育課綱要高中生「具備對道德、個人行為及公共議題進行價值思辨的素養。」學習「判斷行為者善惡及行為對錯時應考慮的因素。」公民課則要學生「整合公民知識，論述自己的主張，並能提出合理的論證。」
  qa:
    question: 三種視角分別看什麼？
    answer: 文章舉例：有人需要幫助，大家都同意該幫。效益主義者會指出「the consequences of doing so will maximize well-being」，義務論者會指出這是「acting in accordance with a moral rule」，德行倫理學者會指出幫助人是「charitable or benevolent」（翻譯是本站整理：效益看結果能讓福祉最大，義務看是否依照道德規則，德行看是否出於仁慈）。
    source: sep-virtue
  items_title: 課綱裡的價值思辨
  items:
  - title: 價值思辨的素養
    text: 綜合活動 生 4a-V-1：具備對道德、個人行為及公共議題進行價值思辨的素養。
    code: 生 4a-V-1
  - title: 判斷對錯的因素
    text: 綜合活動 生 Da-V-2：判斷行為者善惡及行為對錯時應考慮的因素。
    code: 生 Da-V-2
  - title: 提出合理的論證
    text: 社會 公 1c-V-2：整合公民知識，論述自己的主張，並能提出合理的論證。
    code: 公 1c-V-2
