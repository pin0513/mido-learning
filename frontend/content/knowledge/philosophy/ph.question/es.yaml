- 核心素養 A2、B1：依總綱 p.4–6 國民小學教育的 E-A2、E-B1 與國語文領綱 p.3–4 的國-E-A2、國-E-B1原文確認（表格窄欄分散對齊，字距大，文字用 pdftotext 原始順序層與頁面文字塊核對）。
- stage.grades 填 3、4：本點的國語文代碼都是第二學習階段（II），總綱 p.7 說國民小學三、四年級為第二學習階段。
- est_time 依國語文領綱 p.2 時間分配表：國民小學三、四年級國語文每週 5 節；本點建議在國語課讀完繪本後做。
- 頁碼都是頁腳印的頁碼：國語文領綱比 PDF 頁少 2，綜合活動領綱、總綱、社會領綱比 PDF 頁少 4，議題融入說明手冊少 16。
- 原 core_competencies 的 C1（道德實踐與公民意識）刪除：本點練的是提問與討論，對應總綱 E-A2 的探索問題與 E-B1 的語文素養，和國語文 國-E-A2、國-E-B1；C1 沒有對應的學習重點。
- 原 domains 的綜合活動刪除：本點沒有綜合活動第二學習階段的代碼；探究圈的討論改由國語文 1-II-1、2-II-4 支撐。
- 議題閱讀素養教育：議題融入說明手冊國小的實質內涵 閱E6「發展向文本提問的能力。」（p.103）；讀完繪本提出問題，就是在向文本提問。
- 原 scenario「讀完一本繪本後，全班圍成探究圈提問，把問題分成『查得到』和『要討論』兩堆，挑一題來討論。」保留做法，引號拿掉，改成每人提出一個問題，並標本站建議。
- 原 ai.delegable「回答『查得到』的問題」補上由大人操作（本站建議），並在 What 加上教育部注意事項（學生版）的使用規則。
- Philosophy for Children 是 Stanford Encyclopedia of Philosophy 的條目（Michael Pritchard），英文短句引用，中文說明是本站整理。
