    text: 國語文 5-II-8：運用預測、推論、提問等策略，增進對文本的理解。
    code: 5-II-8
  - title: 樂於參加討論
    text: 國語文 2-II-4：樂於參加討論，提供個人的觀點和意見。
    code: 2-II-4
  - title: 讓對方說完
    text: 國語文 1-II-1：聆聽時能讓對方充分表達意見。
    code: 1-II-1
