how:
  heading: 探究圈：先問，再分，再談
  body:
  - 讀完繪本，每個人想一個問題，輪流說出來，老師或家長寫在紙卡上。輪到別人時先聽完，不打斷；課綱要學生「聆聽時能讓對方充分表達意見。」等對方說完，再問：你為什麼這樣想？（本站建議）
  - 再把紙卡分成兩堆。問自己：這題去書裡、字典裡找，或請大人幫忙查，找得到大家都同意的答案嗎？找得到，就放查得到，並說出要去哪裡查。不同的人回答會不一樣，而且都說得出理由，就放要討論；像主角該不該說謊，連大人的想法也會不同（本站整理）。
  - 最後挑一題要討論的來談。兒童哲學的教室是探究的社群，學生在裡面「openly and respectfully exchange ideas」。每個人說出自己的想法和理由，也聽聽和自己不一樣的想法；課綱要學生「樂於參加討論，提供個人的觀點和意見。」
  qa:
    question: 怎麼分辨一個問題是查得到，還是要討論？
    answer: 問自己兩件事：書裡、字典裡或請大人幫忙查，找得到大家都同意的答案嗎？不同的人回答，會不會不一樣、又都說得出理由？第一題答找得到，就是查得到；第二題答會，就是要討論（本站整理）。課綱說提問是增進理解的策略：「運用預測、推論、提問等策略，增進對文本的理解。」
    source: kuoyu
  items_title: 四步做
  items:
  - title: 每人想一題
    text: 讀完繪本，想一個問題。
  - title: 輪流說
    text: 先聽完，不打斷。
  - title: 分成兩堆
    text: 查得到一堆，要討論一堆。
  - title: 挑一題來談
    text: 說想法，也說理由。
  checklist_title: 討論時檢查一下
  checklist:
  - 等別人說完
  - 說出理由
  - 問你為什麼
  activity_figure: question-flow
  sources:
  - kuoyu
  - sep-p4c
what:
  heading: 兩種問題都會問
  body:
  - 學完後，孩子讀完一篇故事，能提出一個查得到的問題和一個要討論的問題，說出查得到的去哪裡查、要討論的為什麼大家會有不同答案，並在討論時等別人說完再接著問。
  items_title: 學完能做到
  items:
  - title: 問查得到的
    text: 說得出去哪裡查。
  - title: 問要討論的
    text: 說得出為什麼答案會不同。
  - title: 聽完再問
    text: 問別人為什麼這樣想。
  checklist_title: 家長檢核
  checklist:
  - 兩個問題都寫好
  - 說得出去哪裡查
  - 說得出為何不同
  notes:
  - 本點融入閱讀素養教育議題：議題融入說明手冊國小的實質內涵有「發展向文本提問的能力。」讀完繪本提出問題，就是在練習向文本提問。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - issues-handbook
  - genai-student
