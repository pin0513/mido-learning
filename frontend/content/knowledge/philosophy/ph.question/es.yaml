est_time:
  school: 國小三、四年級國語課
  source: kuoyu
why:
  heading: 會問問題，才會開始想
  body:
  - 國語課綱要三、四年級學生「運用預測、推論、提問等策略，增進對文本的理解。」讀故事時一邊讀一邊問，是讀懂的方法。議題融入說明手冊的閱讀素養教育，也要國小學生「發展向文本提問的能力。」
  - 問題可以分成兩種：查得到答案的，例如這本書的作者是誰；需要大家一起想的，例如故事裡的主角做得對不對（例子是本站整理）。介紹兒童哲學的文章說，哲學探究提出的問題「more often than not resist definitive answers」，意思是常常沒有一個確定的答案（翻譯是本站整理）。正因為沒有標準答案，才需要大家一起想。
  qa:
    question: 哪一個問題，就算問了大人也沒有標準答案？
    answer: 像主角該不該說謊、怎樣才算好朋友這類問題，大人也會有不同想法，因為答案和每個人看重什麼有關（例子是本站整理）。兒童哲學的教室裡，孩子常提出這樣的問題：「Thoughtful and insightful questions like this are not unusual for children when they are given the opportunity to express them.」
    source: sep-p4c
  items_title: 國語文領綱的學習重點
  items:
