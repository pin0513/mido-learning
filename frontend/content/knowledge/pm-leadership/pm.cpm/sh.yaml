  supports: 要徑「Critical Path. A sequential path of activities in a network logic schedule that represents the longest overall duration from the status date through P/p completion, which determines the shortest possible P/p duration (i.e., least amount of float) and earliest possible P/p finish date.」（p.114）；「Any slippage of the tasks in the critical path will increase the P/p duration and slip the P/p finish date.」（p.114）；總浮時「Total Float is the amount of time an activity can be delayed before impacting the overall P/p completion」（p.118）；趕工「Schedule crashing is a schedule acceleration technique that adds extra resources to perform the work in a shorter period of time.」（p.330）；平行進行「Fast tracking is a schedule acceleration technique where activities that would have been performed sequentially are performed in parallel.」（p.331）；「performing tasks in parallel (fast tracking), adding resources (crashing)」（p.337）
