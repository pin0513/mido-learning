why:
  heading: 最長的那條路決定完工日
  body:
  - 108 課綱的家政要高中生「善用科技、資訊，管理個人與家庭重要事務。」學習「時間、精力管理與生活品質。」補充說明要「善用資源與管理技巧，提高時間密度、妥善分配精力與適度休閒。」資訊科技也要學生「能認識專案管理的概念。」並學「重要資料結構的概念與應用。」說明裡有「樹與圖於問題解決之應用。」把任務和先後畫成網路圖，就是一種圖（本站整理）。
  - NASA 的排程手冊說，要徑是「A sequential path of activities in a network logic schedule that represents the longest overall duration」，它決定了專案最短要多久；而且「Any slippage of the tasks in the critical path will increase the P/p duration and slip the P/p finish date.」要徑上任何一件延誤，整個專案就跟著延誤（P/p 是計畫或專案；翻譯是本站整理）。
  qa:
    question: 為什麼最長的那條路，決定最快多久能完成？
    answer: 因為最後一件事要等所有前面的路都走完才能開始。短的路先做完也只能等，最慢走完的那條路什麼時候結束，專案最快就什麼時候結束。手冊說要徑「determines the shortest possible P/p duration」（說明是本站整理）。
    source: nasa-smh
  items_title: 課綱的學習重點
