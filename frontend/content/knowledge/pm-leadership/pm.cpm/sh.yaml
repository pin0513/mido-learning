how:
  heading: 畫網路圖，手算要徑
  body:
  - 列任務和先後：把搭舞台要做的事列出來，每件估天數，寫出要等哪一件做完。例如設計舞台圖 2 天；借器材 3 天、做背板 4 天，都要等設計圖；搭骨架 2 天要等器材；裝燈光音響 1 天要等骨架；彩排 1 天要等背板和燈光音響都好（天數是示意，例子是本站整理）。每件任務畫成一個方塊，用箭頭連起先後，就是網路圖。
  - 算每條路：從開始走到彩排有兩條路。設計圖 → 借器材 → 搭骨架 → 燈光音響 → 彩排，共 2 + 3 + 2 + 1 + 1 = 9 天；設計圖 → 做背板 → 彩排，共 2 + 4 + 1 = 7 天。彩排要等兩條路都走完才能開始，短的那條先做完也只能等，所以最長的那條 9 天就是要徑，舞台最快 9 天完成（本站整理）。做背板不在要徑上，晚 9 − 7 = 2 天開始也不影響完工，這 2 天叫總浮時；手冊說總浮時是「the amount of time an activity can be delayed before impacting the overall P/p completion」（說明是本站整理）。要徑上的設計圖、借器材、搭骨架、燈光音響和彩排總浮時都是 0，一天都不能晚（本站整理）。借器材和做背板都只等設計圖，可以同時做；手冊把原本先後做的事改成同時做叫「fast tracking」。
  - 多一個人手放哪：放在要徑上、而且多一個人真的能做快的任務，例如搭骨架從 2 天縮成 1 天，舞台就能 8 天完成；放在做背板，背板提早做完也只能等，完工日不會變（本站整理）。手冊把加人加資源趕工叫 crashing，說它「adds extra resources to perform the work in a shorter period of time」，也要多花錢。縮短之後要重算：縮太多時，另一條路可能變成最長，要徑就換了（本站整理）。
  qa:
    question: 如果多一個人手，放在哪個任務上最有用？
    answer: 放在要徑上、而且多一個人真的能做快的任務，例如搭骨架；放在不在要徑上的任務，例如做背板，完工日不會提早。縮短後要重算，要徑可能換成另一條。手冊說要徑上的任務一延誤，就會「slip the P/p finish date」（說明是本站整理）。
    source: nasa-smh
  items_title: 四步做
  items:
  - title: 列任務和先後
    text: 每件估天數，寫要等誰。
  - title: 畫網路圖
    text: 方塊是任務，箭頭是先後。
  - title: 算每條路
    text: 把天數加起來，最長的是要徑。
  - title: 決定人手放哪
    text: 放在要徑上、做得快的任務。
  checklist_title: 算完檢查
  checklist:
  - 每件有天數
  - 箭頭有先後
  - 標出要徑
  activity_figure: cpm-flow
