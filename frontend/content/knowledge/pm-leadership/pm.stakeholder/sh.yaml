est_time:
  school: 高中生涯規劃或家政課
  source: zonghe
why:
  heading: 專案不只是團隊自己的事
  body:
  - 108 課綱的生涯規劃要高中生「具備職業道德與工作倫理，以適應未來職涯生活。」補充說明要學生「培養人際互動與合作共事的能力」；家政也學「人際互動倫理。」要「尊重並展現合宜的人際溝通與互動」。做專案時要合作的，不只是組員，還有所有會被專案影響、或能影響專案的人（本站整理）。
  - NASA 的系統工程手冊說，利害關係人是「a group or individual that is affected by or has a stake in the product or project.」也就是會被專案影響、或在專案裡有利害的個人或團體（翻譯是本站整理）。顧客和使用者通常很好找，其他利害關係人卻「may be more difficult to identify」，而且會隨專案的階段改變。
  qa:
    question: 利害關係人只有出錢或做決定的人嗎？
    answer: 不只。會被專案影響的人、能影響專案的人都是，例如來看展的同學、管場地的總務處、要配合調課的老師、成果展當天被吵到的隔壁班。NASA 手冊說，利害關係人是「affected by or has a stake in the product or project」的個人或團體（說明是本站整理）。
    source: nasa-seh
