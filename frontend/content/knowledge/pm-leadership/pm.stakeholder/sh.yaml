verify_notes:
- 核心素養 A2、A3、C2 保留：依總綱 p.4–6 高級中等學校教育的 U-A2、U-A3、U-C2 與綜合活動領綱 p.3、p.5 的綜S-U-A2、綜S-U-A3、綜S-U-C2 原文確認（表格窄欄分散對齊，字距大，文字已用頁面影像核對）。
- stage 不填 grades：綜合活動領綱 p.2 說普通型高中的生命教育、生涯規劃、家政「可在不同年級規劃修習不同科目。」高中的學習重點也沒有分年級；總綱 p.7 說高級中等學校十、十一、十二年級為第五學習階段。
- est_time 寫高中生涯規劃或家政課：綜合活動領綱 p.2 的高中部定必修是生命教育 1 學分、生涯規劃 1 學分、家政 2 學分；本點的代碼出自生涯規劃、家政。
- 頁碼都是頁腳印的頁碼：綜合活動領綱、總綱、科技領綱比 PDF 頁少 4，議題融入說明手冊少 16，NASA 排程手冊少 1，NASA 系統工程手冊少 10；OPM 手冊、教育部 AI 指引與 PDF 頁相同；ADP 6-22 用章節頁碼（例如 1-18）。
- 新增學習內容代碼的頁碼用附錄二學習內容說明裡代碼所在的頁（同代碼表既有的 家 Ca-V-1 p.100、涯 Cb-V-1 p.99）；學習表現用 p.28–31 學習重點表。
- 高中的 ai.delegable 不改成由老師或家長操作：教育部《高級中等以下學校人工智慧使用和學習指引》讓高中生在規則內自己使用（同 B15 高中的做法），每條補上使用條件（本站建議），What 加上注意事項（學生版）與指引的使用規則。
- 議題加品德教育：議題融入說明手冊高中的實質內涵 品U6「同理接納與包容欣賞。」（p.75）；找出別人在乎什麼、把他們放進溝通計畫，就是在練習同理。
- 原 scenario「社團成果展：畫利害關係人地圖（影響力 × 關心程度），擬定溝通計畫。」保留做法，改寫成完整句並補上本站建議；影響力 × 關心程度四格與每格的溝通方式是本站整理的常見做法，NASA 手冊只說要及早列出利害關係人、找出影響力最大的人。
- 原 ai.delegable「模擬不同利害關係人的立場與提問」補上使用條件（本站建議）。
- NASA Systems Engineering Handbook 是給太空任務用的系統工程手冊，本點只借利害關係人的定義、及早列名單、找出影響力最大的人、其他利害關係人比較難找、各階段都要讓利害關係人參與幾點；英文短句引用，中文說明是本站整理。社團成果展的人物是本站整理的例子。
