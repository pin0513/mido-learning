how:
  heading: 列名單、畫四格、定溝通
  body:
  - 先列名單：每組替成果展寫下所有會被影響、或能影響它的人。先問三個問題：誰要出力？誰要同意？誰會因為這件事多做事、少了什麼或被打擾？例如社員、指導老師、管場地的總務處、要配合調課的老師、來看展的同學和家長、幫忙宣傳的學生會、成果展當天被吵到的隔壁班（例子是本站整理）。NASA 手冊提醒，名單要「be identified early in the process」，還要找出對專案「the most significant influence」的人。
  - 最容易被漏掉的，是不在團隊裡、平常不常碰面的人，例如管場地的單位或隔壁班。他們沒有出現在名單上，就沒有人去溝通；等到活動前一天才發現場地借不到，或有人抗議太吵，專案就可能失敗（本站整理）。手冊說其他利害關係人「may be more difficult to identify」，所以要特別去想團隊外的人。
  - 畫四格：橫軸是關心程度，縱軸是影響力，把每個人放進一格，並說出理由（本站整理）。影響力大、也很關心的，要密切合作、一起做決定，例如指導老師；影響力大、不太關心的，要讓他們滿意，事先簡短報告、照規定申請，例如總務處；影響力小、很關心的，要隨時告知，例如來看展的同學；兩樣都低的，偶爾告知就好，但要留意他們會改變，例如隔壁班到了活動當天就很在乎噪音（本站整理）。最後替每一格寫溝通計畫：誰負責、怎麼說、什麼時候說。手冊也說「It is extremely important to involve stakeholders in all phases of a project.」
  qa:
    question: 誰沒有出現在你的名單上，卻可能讓專案失敗？
    answer: 常是不在團隊裡、卻管著資源或會被影響的人，例如管場地的總務處，或活動當天被吵到的隔壁班。沒列進名單就沒人去溝通，問題會到最後才爆發。NASA 手冊說其他利害關係人「may be more difficult to identify」（說明是本站整理）。
    source: nasa-seh
  items_title: 四步做
  items:
  - title: 列出名單
    text: 團隊內外會被影響的人都寫。
  - title: 放進四格
    text: 影響力和關心程度各看一次。
  - title: 說出理由
    text: 每個人為什麼放在這一格。
  - title: 寫溝通計畫
    text: 誰負責、怎麼說、什麼時候說。
  checklist_title: 畫完檢查
  checklist:
  - 有團隊外的人
  - 每人都有理由
  - 每格有溝通方式
  activity_figure: stakeholder-flow
  sources:
  - nasa-seh
  - zonghe
what:
  heading: 找得到人，也說得清楚
  body:
  - 學完後，學生能替一個活動列出團隊內外的利害關係人，畫成影響力 × 關心程度的四格地圖並說出每個人的位置理由，替每一格擬定溝通方式，也說得出誰最容易被漏掉、為什麼會讓專案失敗。
  items_title: 學完能做到
  items:
  - title: 列出團隊內外的人
    text: 不只組員，也想到團隊外。
  - title: 畫出四格地圖
    text: 每個人的位置都有理由。
  - title: 擬定溝通計畫
    text: 每一格都有溝通方式。
  checklist_title: 家長檢核
  checklist:
  - 名單有團隊外
  - 位置有理由
  - 有溝通計畫
  notes:
  - 本點融入品德教育議題：議題融入說明手冊高中的實質內涵有「同理接納與包容欣賞。」找出別人在乎什麼，就是在練習同理。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  sources:
  - issues-handbook
  - genai-student
  - moe-ai-guide
