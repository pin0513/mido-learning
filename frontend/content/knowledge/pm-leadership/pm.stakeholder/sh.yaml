  exercise: 目標：替一個社團或班級活動列出至少八個利害關係人，畫成影響力 × 關心程度的四格地圖，並替每一格寫出溝通方式。　檢核：老師看地圖和溝通計畫：名單有團隊外的人，例如管場地的單位或隔壁班；每個人放進哪一格都說得出理由，每一格都有誰負責、怎麼說、什麼時候說；學生說得出誰最容易被漏掉、為什麼可能讓專案失敗。
