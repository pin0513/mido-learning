est_time:
  school: 國小五、六年級綜合活動課
  source: zonghe
why:
  heading: 帶頭是先做給人看
  body:
  - 108 課綱的綜合活動要高年級「參與各項活動，適切表現自己在團體中的角色，協同合作達成共同目標。」補充說明寫，要了解自己在團體中的角色，也要扮演好。團隊合作的技巧包含「釐清團隊目標、表達自己的意見、尊重別人的意見及形成共識與決議等。」（頁腳 p.74）。
  - Kouzes 與 Posner 寫「there is no age requirement when it comes to leadership.」以身作則的其中一條是「Set the example by aligning actions with shared values.」國小的班長也可以先做給大家看（英文短句引用，說明是本站整理）。
  - Scrum 指南說 Scrum Master 是「true leaders who serve the Scrum Team and the larger organization.」帶頭是先做、幫忙、把意見聽進來，不是站在旁邊喊人（說明是本站整理）。
  qa:
    question: 帶頭的人是不是只要喊大家去做？
    answer: 不是。先做一個看得到的動作，注意到誰需要幫忙，再聽一個想法。Kouzes 與 Posner 把以身作則寫成「Set the example by aligning actions with shared values.」喊人而自己不做，大家看不到怎麼做（說明是本站整理）。
    source: kouzes
  items_title: 綜合活動領綱的學習重點
  items:
