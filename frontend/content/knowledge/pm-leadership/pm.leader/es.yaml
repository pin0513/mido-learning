  - kouzes
what:
  heading: 做完一起看結果
  body:
  - 學完後，孩子能當一次帶頭的人：自己先做一個動作，幫一位需要幫忙的人，聽進一個想法，再和大家一起看結果。紀錄要寫看得到的動作。
  items_title: 學完能做到
  items:
  - title: 自己先做
    text: 寫得出先做的動作。
  - title: 幫忙
    text: 寫得出幫了誰。
  - title: 聽意見
    text: 寫得出聽進的想法。
  - title: 一起看結果
    text: 寫得出大家看到什麼。
  checklist_title: 家長檢核
  checklist:
  - 寫了先做的動作
  - 寫了幫了誰
  - 寫了聽進的想法
  - 寫了一起看的結果
  figures:
  - leader-compare
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - genai-student
