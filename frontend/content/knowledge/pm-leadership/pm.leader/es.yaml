how:
  heading: 先做、幫忙、聽、再看
  body:
  - 自己先做：虛構的班長打掃教室，自己先拿起掃把掃一角，讓大家看到怎麼做（例子是本站整理）。這對照以身作則：行動和大家說好的做法一致。
  - 幫忙，也聽意見：他看到同學搬不動桌子，就過去一起抬。有人說先擦黑板，他把這個想法放進順序裡。課綱的補充說明要表達自己的意見，也尊重別人的意見。
  - 做完一起看：掃完，全班看地板和黑板，說哪裡乾淨、哪裡還沒好。一起看結果是本站建議的收尾，好接上下一課的回顧。
  qa:
    question: 先做給大家看，可以怎麼做？
    answer: 先做一個小動作，讓旁邊的人看得到。打掃時自己先掃一角，再去幫搬不動桌子的人。不要只站著喊「快掃」（例子是本站整理）。
    source: zonghe
  items_title: 四步做
  items:
  - title: 自己先做
    text: 先做一個看得到的動作。
  - title: 注意誰需要幫忙
    text: 看到卡住的人就過去。
  - title: 聽進一個想法
    text: 把聽到的放進做法裡。
  - title: 做完一起看
    text: 看結果，說哪裡還沒好。
  checklist_title: 做的時候看一下
  checklist:
  - 自己先做了
  - 幫到一個人
  - 聽進一個想法
  - 一起看了結果
  activity_figure: leader-flow
  sources:
