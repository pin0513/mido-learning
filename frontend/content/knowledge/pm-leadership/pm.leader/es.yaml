verify_notes:
- 查核日 2026-11-14。綜合活動領綱、總綱、Kouzes 與 Posner 教師指引、Scrum Guide、教育部生成式人工智慧注意事項（學生版）都在這一天打開核對。
- 核心素養 A2、A3、C2：總綱 PDF 第 8–10 頁（頁腳 p.4–6）的 E-A2、E-A3、E-C2，綜合活動領綱 PDF 第 7、9 頁（頁腳 p.3、p.5）的綜-E-A2、綜-E-A3、綜-E-C2。表格窄欄字距大，文字已併回。
- stage.grades 填 5、6：本點的綜合活動代碼都是第三學習階段（III）。總綱頁腳 p.7 把國民小學五、六年級定為第三學習階段。
- est_time 依綜合活動領綱頁腳 p.2：「第三學習階段實施領域教學，每週 2 節課。」本點建議在綜合活動課上做。
- 頁碼都是頁腳印的頁碼。綜合活動領綱、總綱比 PDF 頁少 4（綜合活動 PDF 77＝頁腳 73、PDF 78＝頁腳 74）。Kouzes 教師指引也少 4（PDF 第 5 頁頁首印 1，PDF 第 13 頁頁首印 9）。
- 學習重點原文：2b-III-1、Bb-III-1、Bb-III-3 在頁腳 p.73。Bb-III-1 補充「藉由參與各項活動及生活情境，了解自己在團體中扮演的角色，省思並扮演好自己的角色」。Bb-III-3 補充在頁腳 p.74：「團隊合作技巧包含釐清團隊目標、表達自己的意見、尊重別人的意見及形成共識與決議等。」
- 例子是虛構的班長打掃教室，沒有真人、真校。先做、幫忙、聽意見、一起看結果是本站整理，對照課綱的角色與團隊合作技巧，以及 Kouzes 與 Posner 的以身作則。
- 沒有放進 pm.lead 主線：主線的學段必須一路往後，pm.lead 已經從 pm.roles@es 接到 pm.lead@jh，不能再插入另一個國小站。本點用 prerequisites 接 pm.roles@es，deeper 接 pm.lead@jh。
- Kouzes 與 Posner 的 Instructor’s Guide 只短引印刷頁 1 與印刷頁 9 的句子，中文說明是本站整理。Scrum Guide 2020 是 CC BY-SA 4.0，只短引服務型領導那一句。
