what:
  heading: 讓團隊敢說真話
  body:
  - 學完後，你能說出心理安全感的意思和它與團隊感情好的差別，用問卷句子判斷一個團隊安不安全，並提出領導者做得到的做法，例如先承認自己會錯、多問問題。
  items_title: 學完能做到
  items:
  - title: 判斷安不安全
    text: 看說了之後發生什麼。
  - title: 分清和感情好
    text: 和氣不等於敢說。
  - title: 示範承認錯誤
    text: 從領導者自己開始。
  checklist_title: 自我檢核
  checklist:
  - 回顧寫完
  - 問卷評過
  - 做法具體
  notes:
  - 本頁的團隊例子是本站整理；回顧只寫自己的經驗。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - genai-student
