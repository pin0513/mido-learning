how:
  heading: 回顧、評一次、改一件事
  body:
  - 先回顧：挑一次自己參與過、結果不好的團隊經驗，只寫自己看到的事，不寫別人的名字（本站建議）。問自己：當時有沒有人看到問題卻沒說？為什麼？常見的原因是怕被當成不懂、怕被說成負面、怕得罪人（本站整理）。re:Work 說，心理安全感高的團隊，成員「feel confident that no one on the team will embarrass or punish anyone else for admitting a mistake, asking a question, or offering a new idea.」反過來，大家都沉默，就是不安全的訊號（說明是本站整理）。
  - 再評一次：用 re:Work 整理的 Edmondson 問卷句子替那個團隊評分，例如「If you make a mistake on this team, it is often held against you.」「Members of this team are able to bring up problems and tough issues.」「It is safe to take a risk on this team.」（說明是本站整理）。判斷說我不知道安不安全，看的是說了之後發生什麼事：有人幫忙解釋，就是安全；被笑、被記一筆、之後不再被找，就是不安全（本站整理）。也要分清楚：心理安全感的定義是成員共同相信「the team is safe for interpersonal risk taking.」，也就是在團隊裡冒人際上的風險（提問、認錯、唱反調）是安全的，這不等於感情好（說明是本站整理）。Edmondson 說它「is not the same as group cohesiveness」，太在意和氣，反而會讓人不敢反對；它是相信團隊「will not embarrass, reject, or punish someone for speaking up.」（說明是本站整理）
  - 最後改一件事：Edmondson 的研究認為，成員特別會注意領導者的行為；領導者支持、願意指導，被質疑時不防衛，成員就比較會覺得安全（本站整理）。re:Work 整理她的建議：「Frame the work as a learning problem, not an execution problem.」「Acknowledge your own fallibility.」「Model curiosity and ask lots of questions.」所以領導者可以先說自己哪裡不確定、開會時先問問題、有人說出錯誤時先謝謝他，再一起找原因（本站建議）。Watt 也說「Building trust on a project begins with the project manager.」
  qa:
    question: 在你的團隊裡，說「我不知道」安全嗎？
    answer: 看說了之後發生什麼事：有人幫忙解釋，就是安全；被笑、被記一筆，就是不安全。也可以用問卷句子替團隊評分，例如「It is safe to take a risk on this team.」（說明是本站整理）
    source: rework-teams
