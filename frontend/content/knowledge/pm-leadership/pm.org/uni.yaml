why:
  heading: 敢說出問題的團隊
  body:
  - Edmondson 1999 年的研究把團隊心理安全感定義為「a shared belief that the team is safe for interpersonal risk taking.」也就是成員都相信，在這個團隊裡承認錯誤、提問、提出不同意見，不會被羞辱或處罰（說明是本站整理）。她指出，人常常不敢求助、不敢說自己錯了，因為怕看起來無能；大家都不說，團隊就學不到東西（本站整理）。
  - Google 的 re:Work 整理自家團隊的研究，發現「what really mattered was less about who is on the team, and more about how the team worked together.」排在第一位的就是心理安全感（說明是本站整理）。Watt 的教科書也說，專案出問題時常怪溝通，但「With deeper investigation, the communication breakdown is associated with a breakdown in trust.」高中生涯規劃學過要「培養人際互動與合作共事的能力」；大學要看懂團隊裡看不見的規則（本站整理）。
  qa:
    question: 心理安全感是不是就是大家感情好、不吵架？
    answer: 不是。Edmondson 說它「is not the same as group cohesiveness」，感情太好反而可能讓人不敢唱反調；它也不是放任，而是相信團隊「will not embarrass, reject, or punish someone for speaking up.」（說明是本站整理）
    source: edmondson-1999
