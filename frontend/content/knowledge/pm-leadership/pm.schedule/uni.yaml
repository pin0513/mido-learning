why:
  heading: 資源有限，排程要重算
  body:
  - 高中學過要徑和三點估算，那時假設人和機具要多少有多少。真實的專案不是這樣：Watt 的教科書說，資源平準化是用來「examine unbalanced use of resources (usually people or equipment) over time and for resolving over-allocations or conflicts.」同一組人被排在兩件同時進行的工作上，就得把工作改成一先一後（說明是本站整理）。
  - NASA 的排程手冊說，排程定案前沒有排入資源、做平準化分析，等於承擔「a significant risk in achieving P/p completion within budget and on schedule.」（P/p 指計畫和專案，說明是本站整理）。高中資訊科技要學生「能應用運算思維評估解題方法的優劣。」到了大學，要比較的是不同的排程方案，也要知道模型算不到什麼（本站整理）。
  qa:
    question: 資源不夠時，排程會怎麼變？
    answer: 原本同時做的工作要錯開，完工日可能往後。Watt 說「leveling could result in a later project finish date if the tasks affected are in the critical path.」（說明是本站整理）
    source: watt-ch11
  items_title: 這一點用到的
  items:
  - title: 要徑
    text: 決定完工日的那條路。
  - title: 資源平準化
    text: 把超量的工作錯開。
  - title: 排程風險分析
    text: 估計準時完成的機會。
  - title: 合併偏誤
    text: 平行的路越多越容易晚。
  checklist_title: 開始前先確認
