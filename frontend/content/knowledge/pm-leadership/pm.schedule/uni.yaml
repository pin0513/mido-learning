  exercise: 目標：用一個虛構的小型施工排程（十項工作、兩種工班，數字是示意），找出資源超量的時段，做出兩個平準化方案，比較完工日和要徑的變化，並寫出模型沒考慮到的現場限制。　檢核：不看本頁，說出資源平準化在做什麼、為什麼它可能讓完工日延後、自動平準化沒有考慮到什麼、排程風險分析的結果要怎麼讀，並說明為什麼平行的工作越多，只用單一估計算出的完工日越不可靠。
