how:
  heading: 找出超量，錯開，再驗證
  body:
  - 先畫出資源需求：把虛構的小型施工排程，例如十項工作、兩種工班，畫成甘特圖，在每一週下面寫出各工班要幾組人，標出超過可用人數的時段（例子是本站整理）。NASA 的手冊說資源平準化是「the process of moving schedule tasks without violating network logic or constraints in order to achieve a more consistent level of resources throughout the schedule duration.」也就是不打破先後關係，把工作挪開，讓每段時間用的人比較平均（說明是本站整理）。
  - 再做兩個方案比較：方案一只挪有浮時的工作，完工日不變；方案二連要徑上的工作也挪，或者加派工班（本站建議）。這就是資源不夠時排程的變化：Watt 說「leveling could result in a later project finish date if the tasks affected are in the critical path.」挪到要徑上的工作，完工日就往後，要徑也可能換成另一條（說明是本站整理）。兩個方案各寫完工日、新的要徑和多花的錢，再決定用哪一個（本站建議）。
  - 最後請現場檢查，並讀懂模擬：模型算出的最佳排程，現場不一定做得到。手冊提醒「automated resource leveling does not factor in the varying skillsets and availability of specific resources (people).」結果要由團隊仔細檢查，「not just taken at face value」；所以要問現場的人：這組師傅會不會這項工、誰會請假、材料什麼時候到（說明是本站整理）。排程風險分析是要「evaluate the likelihood that the P/p plan is achievable within the planned finish date constraints」，結果是準時完成的機會有多大，不是保證；可以用它決定要留多少緩衝、先處理哪個風險（說明是本站整理）。手冊也說，蒙地卡羅模擬工具「is simply a mathematical machine that operates on the inputs to produce outputs.」輸入的估計不可靠，結果也不可靠。平行的工作越多越容易晚，因為幾條路在同一點會合時，任何一條晚了都會拖到後面：手冊說「the inclusion of parallel tasks in the schedule will cause the deterministic schedule to be at a low confidence level.」deterministic schedule 是每項工作只用一個估計值算出的排程，它沒算進這種會合造成的延誤，所以平行的路越多，它給的完工日越不可靠（說明是本站整理）。
  qa:
    question: 模型算出的「最佳」排程，現場的人做得到嗎？
    answer: 不一定。手冊提醒「automated resource leveling does not factor in the varying skillsets and availability of specific resources (people).」所以要拿排程去問現場的人：誰會做、誰有空、材料什麼時候到，再調整（說明是本站整理）。
    source: nasa-smh
  items_title: 四步做
  items:
  - title: 畫出資源需求
    text: 每週每種工班要幾組人。
  - title: 標出超量時段
    text: 超過可用人數就標出來。
  - title: 做兩個方案
    text: 比較完工日和要徑。
  - title: 請現場檢查
    text: 模型沒算到的寫下來。
  checklist_title: 每次做完勾一下
  checklist:
  - 超量已標出
  - 兩個方案都算
  - 要徑有重找
  - 問過現場
  activity_figure: schedule-flow
