what:
  heading: 會排程，也知道模型的限度
  body:
  - 學完後，你能在資源有限時重排排程：標出超量的時段，比較平準化方案的完工日和要徑，讀懂排程風險分析的結果，並說出模型沒考慮到的現場限制。
  items_title: 學完能做到
  items:
  - title: 重排排程
    text: 不打破先後關係。
  - title: 比較方案
    text: 完工日、要徑、成本。
  - title: 說出模型的限度
    text: 技能、請假、材料。
  checklist_title: 自我檢核
  checklist:
  - 平準化完成
  - 方案比較過
  - 限制寫下來
  notes:
  - 本頁的施工排程例子是虛構的，工作數和人數是示意。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - genai-student
