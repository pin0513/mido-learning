  exercise: 目標：用「怎麼學」的同一份示意資料，把 G 外牆改成 5 天，照四步重做一次：寫出要徑和 G 的浮時、土木班超量的天數、只用一組土木班時的完工日和要徑、加派一組時的完工日。　檢核：四個答案都寫出來後，再到「學什麼」說明裡的「練習對答案」核對。
  article: 這一頁用一個虛構的小工程示範資源平準化。先在「怎麼學」看資料，照四個步驟算出要徑、每天要幾組工班、超量的天數和兩個方案；再做下面的練習，把一項工作的天數改掉自己重算。
authors:
- I-PING Huang
updated: '2026-11-05'
goal: 用一份十項工作、兩種工班的示意資料，算出要徑和浮時，標出資源超量的時段，做出兩個平準化方案，比較完工日和要徑的變化，並寫出模型沒考慮到的現場限制。
review: 不看本頁，用練習的示意資料算出要徑、浮時和超量的天數，說出兩個平準化方案的完工日和要徑；再說明自動平準化沒有考慮到什麼、排程風險分析的結果要怎麼讀，以及為什麼平行的路在同一點會合時，只用單一估計算出的完工日偏樂觀。
why:
  heading: 資源有限，排程要重算
  body:
  - 高中學過要徑和三點估算，那時假設人和機具要多少有多少。真實的專案不是這樣：Watt 的教科書說，資源平準化是用來「examine unbalanced use of resources (usually people or equipment) over time and for resolving over-allocations or conflicts.」同一組人被排在兩件同時進行的工作上，就得把工作改成一先一後（說明是本站整理）。
  - NASA 的排程手冊說，排程定案前沒有排入資源、做平準化分析，等於承擔「a significant risk in achieving P/p completion within budget and on schedule.」（P/p 指計畫和專案，說明是本站整理）。高中資訊科技要學生「能應用運算思維評估解題方法的優劣。」到了大學，要比較的是不同的排程方案，也要知道模型算不到什麼（本站整理）。
  qa:
    question: 資源不夠時，排程會怎麼變？
    answer: 原本同時做的工作要錯開，完工日可能往後。Watt 說「leveling could result in a later project finish date if the tasks affected are in the critical path.」在本頁的示意資料裡，F 和 G 在第 15–17 天都要土木班，只有一組時改成 G 先 F 後，完工從第 21 天變成第 22 天，要徑也換成經過 G、F 的那條（說明是本站整理）。
    source: watt-ch11
  items_title: 這一點用到的
  items:
  - title: 要徑
    text: 決定完工日的那條路。
  - title: 資源平準化
    text: 把超量的工作錯開。
  - title: 排程風險分析
    text: 估計準時完成的機會。
  - title: 合併偏誤
    text: 平行的路越多越容易晚。
  checklist_title: 開始前先確認
  checklist:
  - 會找要徑
  - 會三點估算
