how:
  heading: 找出超量，錯開，再驗證
  body:
  - 示意資料（例子是虛構的，工作、天數和工班數都是本站示意）：每項工作要 1 組工班，土木、機電各只有 1 組。土木班做 A 放樣 2 天（起點）、B 開挖 3 天（接 A）、C 基礎 4 天（接 B）、E 結構 5 天（接 C）、F 屋頂 3 天（接 E）、G 外牆 4 天（接 E）、J 驗收 1 天（接 F、G、I）；機電班做 D 預埋管 2 天（接 B）、H 配線 4 天（接 D、E）、I 測試 2 天（接 H）。下面四步照這份資料算一次。
  - 平準化是什麼：NASA 的手冊說資源平準化是「the process of moving schedule tasks without violating network logic or constraints in order to achieve a more consistent level of resources throughout the schedule duration.」也就是不打破先後關係，把工作挪開，讓每段時間用的人比較平均。Watt 也提醒「leveling could result in a later project finish date if the tasks affected are in the critical path.」（說明是本站整理）
  qa:
    question: 模型算出的「最佳」排程，現場的人做得到嗎？
    answer: 不一定。手冊提醒「automated resource leveling does not factor in the varying skillsets and availability of specific resources (people).」所以要拿排程去問現場的人：誰會做、誰有空、材料什麼時候到，再調整（說明是本站整理）。
    source: nasa-smh
  items_title: 四步做（示範）
  items:
  - title: 算要徑和浮時
    text: 往前推每項最早的開工、完工日，往後推最晚的日子，兩者的差就是浮時。
    example: （示意）A 第 1–2 天、B 3–5、C 6–9、D 6–7、E 10–14、F 15–17、G 15–18、H 15–18、I 19–20、J 第 21 天完工。要徑依序經過 A、B、C、E、H、I、J；浮時 D 7 天、F 3 天、G 2 天，其餘 0。
  - title: 數每天要幾組工班
    text: 把每天在做的工作按工班加起來，就是資源直方圖。
    example: （示意）土木：第 1–14 天 1 組，第 15–17 天 2 組，第 18 天 1 組，第 19–20 天 0 組，第 21 天 1 組。機電：第 6–7 天、第 15–20 天各 1 組，其餘 0 組。
  - title: 標出超量、先試浮時
    text: 超過可用組數的天就標出來，先看只挪有浮時的工作夠不夠。
    example: （示意）土木只有 1 組，第 15–17 天超量 3 天。G 做到第 18 天後 F 才開始，F 第 19–21 天，比 F 最晚的第 20 天晚 1 天，浮時不夠。
  - title: 做兩個方案比較
    text: 每個方案寫完工日、要徑和多花的錢，再決定用哪一個（本站建議）。
    example: （示意）方案一，一組土木班 G 先 F 後：第 22 天完工，要徑換成依序經過 A、B、C、E、G、F、J，H、I 多出 1 天浮時；F 先 G 後也是第 22 天。方案二，第 15–17 天加派一組土木班：第 21 天完工，要徑不變，多付 3 組·天的工錢。
  checklist_title: 每次做完勾一下
  checklist:
  - 超量已標出
  - 兩個方案都算
  - 要徑有重找
  - 問過現場
  notes:
  - 算完之後請現場檢查：手冊說平準化的結果要由團隊仔細檢查，「not just taken at face value」（見上面的問答）。排程風險分析是要「evaluate the likelihood that the P/p plan is achievable within the planned finish date constraints」；手冊也說，蒙地卡羅模擬工具「is simply a mathematical machine that operates on the inputs to produce outputs.」輸入的估計不可靠，結果也不可靠（說明是本站整理）。
  activity_figure: schedule-flow
  sources:
  - nasa-smh
  - watt-ch11
what:
  heading: 會排程，也知道模型的限度
  body:
  - 學完後，你能在資源有限時重排排程：標出超量的時段，比較平準化方案的完工日和要徑，讀懂排程風險分析的結果，並說出模型沒考慮到的現場限制。
  items_title: 學完能做到
  items:
  - title: 重排排程
    text: 不打破先後關係。
  - title: 比較方案
    text: 完工日、要徑、成本。
  - title: 說出模型的限度
    text: 技能、請假、材料、會合點的延誤。
  checklist_title: 自我檢核
  checklist:
  - 平準化完成
  - 方案比較過
  - 限制寫下來
  qa:
    question: 模擬的結果要怎麼讀、怎麼用？
    answer: 結果是準時完成的機會有多大，不是保證。只用單一估計的排程會偏樂觀：本頁的 J 要等三條路會合，假設三條路都沒有浮時、各自有 80% 的機會準時、彼此不相關（數字是示意），三條都準時的機會只有 0.8×0.8×0.8，約 51%。手冊說「the inclusion of parallel tasks in the schedule will cause the deterministic schedule to be at a low confidence level.」所以可以用模擬決定要留多少緩衝、先處理哪個風險（說明是本站整理）。
    source: nasa-smh
  notes:
  - 合併偏誤的數字怎麼算（示意）：一條路準時的機會是 80%；兩條路會合，都準時是 0.8×0.8＝64%；三條路會合是 0.8×0.8×0.8，約 51%。真實的路有浮時、彼此也可能相關（例如同一場雨拖到所有戶外工作），所以這只說明方向，不是真實機率（本站整理）。
  - 模型沒考慮到的：工班會不會這項工、誰會請假、材料何時到、一組人能不能拆成半組、天氣；這些要問現場（本站整理）。
  - 練習對答案（G 外牆改成 5 天，示意）：要徑仍依序經過 A、B、C、E、H、I、J，第 21 天完工，G 的浮時剩 1 天，土木第 15–17 天仍要 2 組；只用一組土木班，不論 G 先或 F 先都是第 23 天完工，要徑變成依序經過 A、B、C、E、G、F、J（或 F 在 G 前）；第 15–17 天加派一組土木班，仍是第 21 天完工。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - nasa-smh
  - genai-student
