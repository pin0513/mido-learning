  exercise: 目標：把一個專題分成三個衝刺，每個衝刺開始前定好要做出的小版本，結束時展示給同學、記下回饋，並寫出下一輪要改什麼。　檢核：老師看衝刺紀錄：三個衝刺都有目標、展示和回饋紀錄，下一輪的計畫看得出是依回饋改的；學生說得出這個專題為什麼適合邊做邊改，什麼樣的專案適合一次規劃到底。
