verify_notes:
- 核心素養 A2、A3、C2 保留：依總綱 p.4–6 高級中等學校教育的 U-A2、U-A3、U-C2 與綜合活動領綱 p.3、p.5 的綜S-U-A2、綜S-U-A3、綜S-U-C2 原文確認（表格窄欄分散對齊，字距大，文字已用頁面影像核對）。
- stage 不填 grades：綜合活動領綱 p.2 說普通型高中的生命教育、生涯規劃、家政「可在不同年級規劃修習不同科目。」高中的學習重點也沒有分年級；總綱 p.7 說高級中等學校十、十一、十二年級為第五學習階段。
- est_time 寫高中生涯規劃或資訊科技課：綜合活動領綱 p.2 的高中部定必修是生命教育 1 學分、生涯規劃 1 學分、家政 2 學分；本點的代碼出自生涯規劃、資訊科技。
- 頁碼都是頁腳印的頁碼：綜合活動領綱、總綱、科技領綱比 PDF 頁少 4，議題融入說明手冊少 16，NASA 排程手冊少 1，NASA 系統工程手冊少 10；OPM 手冊、教育部 AI 指引與 PDF 頁相同；ADP 6-22 用章節頁碼（例如 1-18）。
- 新增學習內容代碼的頁碼用附錄二學習內容說明裡代碼所在的頁（同代碼表既有的 家 Ca-V-1 p.100、涯 Cb-V-1 p.99）；學習表現用 p.28–31 學習重點表。
- 高中的 ai.delegable 不改成由老師或家長操作：教育部《高級中等以下學校人工智慧使用和學習指引》讓高中生在規則內自己使用（同 B15 高中的做法），每條補上使用條件（本站建議），What 加上注意事項（學生版）與指引的使用規則。
- 運算思維學習表現（運 c-V-3）的代碼開頭是中文字加小寫字母，schema 的 curriculum_108.performances 只收數字開頭的代碼，所以只在項目的 code 引用（代碼表已有），curriculum_108 只列資訊科技學習內容（同 B15）。
- curriculum_108.domains 加科技：資訊科技 運 c-V-3「能整合適當的資訊科技與他人合作完成專題製作。」與 資 T-V-1「數位合作共創的概念與工具使用。」正是分衝刺合作做專題；related 的 it.build@sh 也用這兩個代碼。
- 議題加生涯規劃教育：議題融入說明手冊高中的實質內涵 涯U9「確認生涯目標，擬訂生涯行動方案，並在實踐中反思與修正。」（p.96）。
- curriculum_108.performances 留空：綜合活動高中沒有直接對應迭代開發的學習表現，學習內容 涯 Ca-V-2、涯 Cc-V-1 的補充說明（正向看待不確定性、根據結果修正行動計畫）已對應；運 c-V-3 只在項目引用。
- 原 scenario「專題製作分成 3 個兩週的衝刺，每次結束都展示成果給同學回饋。」的 3 改成三（scenario 不放沒有標示的阿拉伯數字），補上決定下一輪要改什麼與本站建議。
- 原 ai.delegable「快速產生原型、整理回饋」補上使用條件（本站建議）。
- The 2020 Scrum Guide 以 CC BY-SA 4.0 發布；《敏捷軟體開發宣言》網站說宣言可以自由複製但須完整，本點只短句引用並附出處。英文短句引用，中文說明是本站整理；專題、首頁和畢業典禮的例子是本站整理。
