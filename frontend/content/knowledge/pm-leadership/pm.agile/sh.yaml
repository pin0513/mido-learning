est_time:
  school: 高中生涯規劃或資訊科技課
  source: zonghe
why:
  heading: 先做小版本，再一路改進
  body:
  - 108 課綱的生涯規劃要高中生學「生涯反思與變化因應。」補充說明要「能正向看待不確定性，彈性的因應各種變化」；學「生涯願景與行動方案。」要「根據結果適時修正行動計畫」。資訊科技也要學生「能整合適當的資訊科技與他人合作完成專題製作。」並學「數位合作共創的概念與工具使用。」
  - 《敏捷軟體開發宣言》說「回應變化 重於 遵循計劃」，也說「雖然右側項目有其價值」，計畫還是有用。Scrum 指南說 Scrum「employs an iterative, incremental approach to optimize predictability and to control risk.」一輪一輪做、每次多做出一塊，讓進度更好預測、風險更小（翻譯是本站整理）。
  qa:
    question: 什麼樣的專案適合一次規劃到底？什麼樣的適合邊做邊改？
    answer: 要做什麼、怎麼做都很清楚，而且做到一半很難改的，適合一次規劃到底，例如畢業典禮的流程；不確定使用者要什麼、做了才知道好不好的，適合邊做邊改，例如給同學用的小工具或一支宣傳影片。Scrum 指南說它是為「complex problems」設計的（說明是本站整理）。
    source: scrum-guide
  items_title: 課綱的學習重點
  items:
  - title: 生涯反思與變化因應
    text: 綜合活動 涯 Ca-V-2：生涯反思與變化因應。
    code: 涯 Ca-V-2
  - title: 生涯願景與行動方案
    text: 綜合活動 涯 Cc-V-1：生涯願景與行動方案。
    code: 涯 Cc-V-1
  - title: 數位合作共創
    text: 高中科技領綱 資 T-V-1：數位合作共創的概念與工具使用。
    code: 資 T-V-1
  - title: 合作完成專題
    text: 高中科技領綱 運 c-V-3：能整合適當的資訊科技與他人合作完成專題製作。
    code: 運 c-V-3
  checklist_title: 開始前先確認
  checklist:
  - 專題題目定了
  - 組員分好工
  figures:
  - agile-compare
  notes:
  - 綜合活動高中的代碼：開頭的涯是生涯規劃、家是家政；接著是數字的是學習表現，是大寫字母的是學習內容；中間的 V 是第五學習階段（高中）。
  - 代碼開頭的「資」是科技領綱的資訊科技學習內容，「運」是運算思維的學習表現；中間的 V 是第五學習階段（高中），本頁只列高中必修的條目，不含標「※」的加深加廣選修。
  - 總綱把高級中等學校十、十一、十二年級定為第五學習階段，所以本頁代碼中間都是 V。
