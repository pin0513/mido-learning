how:
  heading: 三個衝刺，每輪都展示
  body:
  - 先排衝刺：把專題分成三個兩週的衝刺（週數是示意）。Scrum 指南說衝刺是「fixed length events of one month or less」，每個衝刺都可以看成「a short project」（說明是本站整理）。每個衝刺開始前，全組定好這一輪要做出什麼：要是別人真的能用、能看的小版本，例如第一輪只做出能操作的首頁，不是只寫完一份計畫（例子是本站整理）。
  - 衝刺結束時展示：一個衝刺結束時，拿出這一輪做好、可以用的小版本給同學試用，記下他們做了什麼、卡在哪裡、說了什麼。指南說衝刺檢視是要「inspect the outcome of the Sprint and determine future adaptations」（說明是本站整理）。記回饋時寫事實，不寫同學的姓名（本站建議）。
  - 回饋變成下一輪的計畫：把回饋分成要改、可以晚點改、不改三類，挑最重要的放進下一輪的目標，並寫下為什麼這樣選（本站建議）。每輪最後也回顧團隊合作得怎麼樣，三輪做完，比較第一版和最後一版差在哪裡。不是每個專案都要這樣做：目標和做法都很清楚、中途很難改的，例如畢業典禮的流程，一次規劃好再照著做比較好；做了才知道好不好的專題，才適合邊做邊改（本站整理）。
  qa:
    question: 回饋要怎麼變成下一輪的計畫？
    answer: 把回饋分成要改、可以晚點改、不改三類，挑最重要的放進下一輪的目標，寫下為什麼這樣選（本站建議）。Scrum 指南說衝刺檢視是要「determine future adaptations」。
    source: scrum-guide
  items_title: 四步做
  items:
  - title: 排三個衝刺
    text: 每個衝刺一樣長。
  - title: 定這輪的小版本
    text: 要能用、能看。
  - title: 展示拿回饋
    text: 記下事實，不寫姓名。
  - title: 回饋改成計畫
    text: 挑最重要的放進下一輪。
  checklist_title: 每輪檢查
  checklist:
  - 有可用的版本
  - 回饋有記下
  - 下一輪有改
  activity_figure: agile-flow
  sources:
  - scrum-guide
  - zonghe
what:
  heading: 邊做邊改，也知道何時不用
  body:
  - 學完後，學生能把專題分成幾個衝刺，每輪做出可以用的小版本、展示給別人並記下回饋，把回饋變成下一輪的計畫，也能判斷什麼樣的專案適合一次規劃到底、什麼樣的適合邊做邊改。
  items_title: 學完能做到
  items:
  - title: 做出小版本
    text: 每輪都有能用的成果。
  - title: 用回饋改計畫
    text: 下一輪看得出改了什麼。
  - title: 判斷適合的做法
    text: 一次規劃或邊做邊改。
  checklist_title: 家長檢核
  checklist:
  - 每輪有展示
  - 回饋有用上
  - 說得出差別
  notes:
  - 本點融入生涯規劃教育議題：議題融入說明手冊高中的實質內涵有「確認生涯目標，擬訂生涯行動方案，並在實踐中反思與修正。」每輪拿回饋再修正，就是在練習。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  sources:
  - issues-handbook
  - genai-student
  - moe-ai-guide
