verify_notes:
- 查核日 2026-11-14。健康與體育領綱、綜合活動領綱、總綱、Kouzes 與 Posner 教師指引、Scrum Guide、教育部生成式人工智慧注意事項（學生版）都在這一天打開核對。
- 新增健康與體育代碼，原文與 curriculum-108-codes.yaml 逐字相同。2c-III-2「表現同理心、正向溝通的團隊精神。」頁腳 p.17（PDF 第 21 頁頁首印 17）。Cb-III-1「運動安全教育、運動精神與運動營養知識。」頁腳 p.18（PDF 第 22 頁頁首印 18）。這份 PDF 比頁腳多 4。
- 沒有收健體 2c-III-1。它和綜合活動 2c-III-1 同號不同文；收進去會讓既有國小點的裸代碼變成 ambiguous。也沒有把 Hd-III-1「守備/跑分性球類運動基本動作及基礎戰術。」（頁腳 p.19）放進本點：本點練的是帶隊，不教基本動作和戰術。
- 競爭類型運動的說明在頁腳 p.12：「學生在競爭類型活動中需要運用思考、理解、溝通、技能、戰術和策略，以進行問題解決活動，並養成尊重、負責、參與、領導與關懷他人的個人與社會責任行為。」分類裡有守備/跑分性，正文沒有寫出「棒球」二字。棒球隊是本站虛構的例子，用來對上這段裡的領導與關懷。
- 核心素養 A2、C2 另核健體-E-A2（頁腳 p.3）、健體-E-C2（頁腳 p.5）。A3 用總綱 E-A3（頁腳 p.5）與綜合活動綜-E-A3（頁腳 p.3）。綜合活動 Bb-III-3 補充在頁腳 p.74。
- stage.grades 填 5、6：代碼都是第三學習階段（III）。總綱頁腳 p.7 把國民小學五、六年級定為第三學習階段。
- est_time 依健康與體育領綱頁腳 p.2：國民小學第三學習階段健康與體育「3 節∕週」；備註「健康與體育領域於第一、二、三學習階段，以領域教學為原則。」本點建議在體育課上做。
- 頁碼都是頁腳印的頁碼。健康與體育領綱、綜合活動領綱、總綱比 PDF 頁少 4。Kouzes 教師指引也少 4（PDF 第 5 頁頁首印 1，PDF 第 13 頁頁首印 9）。
- 例子是虛構的國小棒球隊，沒有真人、真校。輸了先打氣、聽每個人、說清楚目標、自己守規矩是本站整理。
- 這點是以後棒球隊 Scrum 主線的國小起點，主線還沒有，所以沒有寫進 paths。學段總圖會因為先備關係畫出這一點。pm.captain 的 related 含 pm.leader@es，所以不再把 pm.leader@es 放進 prerequisites。
- Kouzes 與 Posner 只短引印刷頁 9 的以身作則。Scrum Guide 2020 是 CC BY-SA 4.0，只短引團隊互相支持那一句。
