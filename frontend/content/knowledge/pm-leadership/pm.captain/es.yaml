  - zonghe
  - kouzes
what:
  heading: 說出目標再一起守
  body:
  - 學完後，孩子能當一次隊長：輸的時候先打氣，聽每個人一個想法，說清楚目標，自己也守一條規矩。紀錄要寫這四件看得到的事。
  items_title: 學完能做到
  items:
  - title: 替人打氣
    text: 寫得出打氣的話。
  - title: 聽想法
    text: 寫得出聽到的想法。
  - title: 說出目標
    text: 寫得出說給大家的目標。
  - title: 自己守規矩
    text: 寫得出自己守的規矩。
  checklist_title: 家長檢核
  checklist:
  - 寫了打氣的話
  - 寫了聽到的想法
  - 寫了說出的目標
  - 寫了自己的規矩
  figures:
  - captain-compare
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - genai-student
