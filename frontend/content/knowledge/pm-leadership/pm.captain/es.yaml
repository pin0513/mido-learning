  source: jienti
why:
  heading: 輸了也要一起守
  body:
  - 健康與體育領綱寫，學生在競爭類型活動中要養成「尊重、負責、參與、領導與關懷他人」的行為（頁腳 p.12）。學習表現 2c-III-2 是「表現同理心、正向溝通的團隊精神。」輸球時先打氣，就是把同理放進隊伍裡（說明是本站整理）。
  - 綜合活動 Bb-III-3 的補充說明寫，團隊合作技巧包含「釐清團隊目標、表達自己的意見、尊重別人的意見及形成共識與決議等。」（頁腳 p.74）。隊長要讓大家知道目標，也聽每個人的想法。
  - Scrum 指南寫團隊「commits to achieving its goals and to supporting each other.」打氣是支持隊友，不是怪誰打不好（英文短句引用，說明是本站整理）。棒球隊是虛構的例子；領綱這段沒有寫出棒球二字。
  qa:
    question: 輸球的時候，隊長先做什麼？
    answer: 先替隊友打氣，再聽大家怎麼想。健康與體育 2c-III-2 要的是同理心和正向溝通。先罵人，隊伍就聽不到下一句目標（說明是本站整理）。
    source: jienti
  items_title: 領綱的學習重點
  items:
  - title: 同理與正向溝通
    text: 健康與體育 2c-III-2：表現同理心、正向溝通的團隊精神。
    code: 2c-III-2
  - title: 運動精神
    text: 健康與體育 Cb-III-1：運動安全教育、運動精神與運動營養知識。本點用到的是運動精神。
    code: Cb-III-1
  - title: 在團體中合作
    text: 綜合活動 2b-III-1：參與各項活動，適切表現自己在團體中的角色，協同合作達成共同目標。
    code: 2b-III-1
  - title: 團隊合作的技巧
    text: 綜合活動 Bb-III-3：團隊合作的技巧。補充說明：「團隊合作技巧包含釐清團隊目標、表達自己的意見、尊重別人的意見及形成共識與決議等。」
    code: Bb-III-3
  checklist_title: 開始前先確認
  checklist:
  - 知道這一局的目標
  - 準備一句打氣的話
  notes:
  - 健康與體育和綜合活動的代碼都用拉丁字母 III，表示第三學習階段（國小五、六年級）。
  - 領綱把棒球這類運動放在守備/跑分性裡，但學習內容那一句沒有寫出棒球。本頁的球隊是虛構的。
  sources:
  - jienti
  - zonghe
  - scrum-guide
  - zonggang
how:
  heading: 打氣、聽、說目標、守規
  body:
  - 先打氣：虛構的隊長在落後時先說這一局還沒結束，再問誰需要喝水或換個位置練（例子是本站整理）。領綱要的是同理和正向溝通。
  - 聽，再說目標：每個人說一個想法，隊長再說這一局大家一起守的目標，例如先守住一壘。補充說明要釐清團隊目標，也尊重別人的意見。
  - 自己守規矩：不嘲笑對手、輪到自己就上場。隊長自己先做到。Kouzes 與 Posner 寫「Set the example by aligning actions with shared values.」自己守同一條規矩，就是先做給隊友看（英文短句引用，說明是本站整理）。
  qa:
    question: 隊長怎麼讓每個人知道目標？
    answer: 先聽每個人一個想法，再用一句話說出這一局要一起做的事，例如先守住一壘。目標要短，大家聽得完（例子是本站整理）。
    source: zonghe
  items_title: 四步做
  items:
  - title: 輸了先打氣
    text: 先說一句替隊友打氣的話。
  - title: 聽每個人
    text: 每人一個想法。
  - title: 說清楚目標
    text: 用一句話說這一局。
  - title: 自己守規矩
    text: 自己先守同一條規矩。
  checklist_title: 做的時候看一下
  checklist:
  - 說了打氣的話
  - 每人一個想法
  - 目標說出來了
  - 自己守了規矩
  activity_figure: captain-flow
