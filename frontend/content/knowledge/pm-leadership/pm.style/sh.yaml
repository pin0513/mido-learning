est_time:
  school: 高中生涯規劃課
  source: zonghe
why:
  heading: 同一招，不能帶所有人
  body:
  - 108 課綱的生涯規劃要高中生「分析與統整個人特質、價值觀、生涯態度及信念。」學「個人能力和興趣。」補充說明要「藉由測驗、自我覺察或重要他人的回饋等」了解自己；也要「培養人際互動與合作共事的能力」。帶人之前，先知道自己和組員各有什麼能力、想不想做（本站整理）。
  - 美國陸軍的領導準則（ADP 6-22）說：「Inexperienced subordinates and those with limited competence require greater oversight and control. Seasoned, competent subordinates require less oversight and control.」經驗少、能力還不夠的人需要多一點指導和檢查；有經驗、能力夠的人就少管一點（翻譯是本站整理）。準則也說，成員的經驗、能力和投入會「vary with the mission and situation」，同一個人換了工作也會不一樣。
  qa:
    question: 新手和老手，各該怎麼帶？
    answer: 新手要多指導：說清楚做什麼、怎麼做，常常一起檢查；老手能力夠、也願意做，就多授權，說好目標和期限，讓他自己決定做法。準則說有經驗、能力夠的人「require less oversight and control」（說明是本站整理）。
    source: army-adp
