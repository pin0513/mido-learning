how:
  heading: 看能力和意願，調整帶法
  body:
  - 先回顧：挑一次自己帶過或參與過的活動，例如社團成果展或班際比賽，選一位新手和一位老手（例子是本站整理）。替兩人各寫兩件事：這件工作他會不會做，也就是能力；他想不想做、有沒有信心，也就是意願。能力和意願要分開看：會做但不想做，和想做但還不會，需要的幫忙不一樣（本站整理）。
  - 再決定帶法：能力還不夠的，多指導，說清楚步驟、示範一次、常常一起檢查；能力夠但意願低的，多聽他的想法、說明這件事為什麼重要，讓他參與決定；能力和意願都高的，就授權，說好目標、期限和什麼時候回報，做法讓他自己決定（本站整理）。準則說，當成員「have greater levels of expertise and commitment」，領導者就「trust and empower them」。什麼時候可以放手：他已經做對過幾次、遇到問題會主動回報，就可以少管一點；放手後也要約好檢查的時間（本站建議）。這是帶人的經驗法則，研究對這類說法的支持有好有壞，用的時候要看對方的反應再調整（本站整理）。
  - 最後回頭看自己：你喜歡被怎麼帶？很多人會用自己喜歡的方式帶別人。喜歡自由發揮的人帶新手時如果也不多說，新手會不知道從哪裡開始；喜歡被詳細指導的人帶老手時管太細，老手會覺得不被信任（本站整理）。把自己喜歡的帶法和組員需要的帶法寫在一起比較，下次帶人時先問對方需要什麼（本站建議）。
  qa:
    question: 你喜歡被怎麼帶？這和你帶別人的方式一樣嗎？
    answer: 常常一樣，但不一定適合對方。喜歡自由發揮的人帶新手時容易說太少，喜歡被詳細指導的人帶老手時容易管太細，所以要先看對方的能力和意願再決定（本站整理）。準則說成員的經驗、能力和投入會「vary with the mission and situation」。
    source: army-adp
  items_title: 四步做
  items:
