what:
  heading: 依對方調整帶人方式
  body:
  - 學完後，學生能分開看組員的能力和意願，對新手多指導、對老手多授權，說出什麼時候可以放手，並比較自己喜歡被帶的方式和組員需要的帶法。
  items_title: 學完能做到
  items:
  - title: 分開看能力和意願
    text: 不只看會不會做。
  - title: 決定指導或授權
    text: 新手和老手帶法不同。
  - title: 反思自己的習慣
    text: 先問對方需要什麼。
  checklist_title: 家長檢核
  checklist:
  - 新手老手不同
  - 帶法有理由
  - 說得出何時放手
  notes:
  - 本點融入生涯規劃教育議題：議題融入說明手冊高中的實質內涵有「分析與統整個人特質、興趣、性向、價值觀、生涯態度及信念的能力。」先了解自己和組員，才知道怎麼帶。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  sources:
  - issues-handbook
  - genai-student
  - moe-ai-guide
