idea: 一件大事看起來很難，拆成一張張小任務卡，就知道明天可以從哪裡開始。
guiding_questions:
  - 一件事要拆到多小，才知道明天就能開始做？
  - 這張任務卡是一個人做得到，還是還要再拆？
  - 如果少做其中一張卡，同樂會還是開得成嗎？
  - 哪些卡可以同一天做，哪些一定要先做完？
scenario: 把同樂會拆成任務卡：場地布置、遊戲、點心、邀請老師……貼在白板上。可以印的任務卡範例：標題「準備點心」，誰來做「小華」，什麼時候「週五放學後」，完成的樣子「點心盒裝好、數量夠全班」，下一步「週六早上拿到教室」。
