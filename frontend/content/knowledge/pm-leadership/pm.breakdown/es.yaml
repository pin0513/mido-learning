# ---------- 新增 ----------
why:
  heading: 大事拆小，才知道從哪開始
  body:
  - 108 課綱的綜合活動，要國小高年級「分析與判讀各類資源，規劃策略以解決日常生活的問題」，也要在團體裡「協同合作達成共同目標」。先把大事拆成小事，才分得出誰做什麼。
  - 專案管理也這樣做。NASA 的工作分解手冊說，拆解是為了把整個專案的工作分成可以管理的小塊，方便規劃、追蹤時間和花費。
  figures: [why-compare]
  qa:
    question: 如果少做其中一張卡，同樂會還是開得成嗎？
    answer: 先看那張卡是不是同樂會一定要有的事。NASA 手冊說，清單外的工作不算在這次專案裡；反過來，該做的事都要列進清單。「準備點心」這張卡不見了，就沒有人會去準備點心。
    source: nasa-wbs
  sources: [zonghe, zonggang, nasa-wbs, sinek]

how:
  heading: 一張卡，寫一件事
  body:
  - 課綱的補充說明寫到，高年級做「解決問題的規劃」，要探究問題成因、思考解決方法、評估各種方法的優缺點，再擬訂解決步驟；團隊合作的技巧，包含釐清團隊目標、表達自己的意見、尊重別人的意見、形成共識。
  items:
  - {title: 先說好目標, text: 全班先說清楚，同樂會要辦成什麼樣子。}
  - {title: 想到一件寫一張, text: 先不排順序，把要做的事都寫成卡片。}
  - {title: 太大的卡再拆, text: 拆到看得出誰來做、什麼時候做完，就停。}
  - {title: 排先後、分工, text: 哪些要先做完，哪些可以同一天做，各由誰負責。}
  checklist_title: 每張任務卡寫上：
  checklist: [標題, 誰來做, 什麼時候, 完成的樣子, 下一步]
  activity_figure: how-flow
  sources: [zonghe, nasa-wbs]

what:
  heading: 從一件大事到一疊任務卡
  notes:
  - 專案管理有一種拆法叫「工作分解結構」（WBS），拆的是要交出來的東西（例如點心、海報、遊戲道具）。任務卡是在拆好之後，再寫下每樣東西要做的事、誰做、什麼時候做；NASA 手冊說，WBS 最底層的每一項，至少要有一件要做的工作。高中的 pm.estimate 會再學怎麼替每一項估時間。
  - 不必每一張都拆得一樣細。NASA 手冊說，每一支只要拆到足以管理、看得到進度就好。
  - 清單外的事不算在這次活動裡。想多做一件事，先加一張卡，大家同意再做。
  sources: [nasa-wbs]

