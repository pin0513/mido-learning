what:
  heading: 分得出專案和日常
  body:
  - 學完後，孩子能用有沒有開始和結束、會不會做出新的成果兩個問題，把生活中的事分成專案和日常，說出邊界例子的理由，並舉出一件自己參與過的專案，說出它的開始、結束和成果。
  items_title: 學完能做到
  items:
  - title: 說出兩個條件
    text: 開始和結束、新的成果。
  - title: 分類並說理由
    text: 邊界的例子也說得清楚。
  - title: 舉自己的例子
    text: 說出開始、結束和成果。
  checklist_title: 家長檢核
  checklist:
  - 六件都分好了
  - 每件有理由
  - 舉出自己的專案
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  - 本頁的 AI 活動由老師或家長操作，孩子在旁邊一起看、一起檢查 AI 的回答（本站建議）。
  sources:
  - genai-student
