how:
  heading: 兩個問題，把事情分兩類
  body:
  - 先列例子：每組寫下六件最近參與過或聽過的事，例如校慶攤位、每天打掃、畢業旅行、社團練習、班際合唱比賽、每週倒垃圾（例子是本站整理）。
  - 每件事問兩個問題：有沒有明確的開始和結束？做完會不會留下一個新的成果？兩個都是，就放進專案；一直重複、沒有結束那天的，放進日常。邊界的例子要說出理由：社團的每週練習一直重複，算日常；如果是為了某一場比賽練習，比賽那天就是結束，還要練出一套新的表演，就變成專案（本站整理）。最後每個人舉一件自己參與過的專案，說出它哪天開始、哪天結束、做出了什麼成果，例如畢業旅行從開始規劃到平安回家，成果是一份行程和一次全班的旅行（例子是本站整理）。
  - 為什麼要分：專案每次都不一樣，要先訂目標、排先後、分工，做完還要回顧；日常工作照固定的規則和習慣就能做好（本站整理）。童軍露營也是這樣做：「透過團隊編組與分工，擬定露營計畫，設計露營流程」，活動後再「藉由分享與討論進行回饋檢討與個人反思。」
  qa:
    question: 社團的每週練習是專案嗎？如果是為了比賽呢？
    answer: 每週練習一直重複、沒有結束那天，是日常；為了某一場比賽練習，比賽那天就是結束，還要練出新的表演，就變成專案。NASA 手冊說專案要有「a beginning, and an end」（說明是本站整理）。
    source: nasa-smh
