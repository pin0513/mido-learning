est_time:
  school: 國中七至九年級綜合活動課
  source: zonghe
why:
  heading: 專案有開始，也有結束
  body:
  - 108 課綱的綜合活動要國中生「善用各項資源，妥善計畫與執行個人生活中重要事務。」童軍的學習內容有「服務活動方案的規劃與執行。」補充說明要學生「發揮個人正向影響力，規劃各項服務活動方案。」一次服務活動有開始、有結束，還要做出一個新的成果，就是一個專案（本站整理）。
  - NASA 的排程手冊這樣說專案：「A specific investment identified in a Program Plan having defined requirements, a life cycle cost (LCC), a beginning, and an end.」意思是有清楚的要求、要花的成本，還有開始和結束；而且「A project yields new or revised products」，會做出新的或改良的成果（翻譯是本站整理）。每天打掃沒有結束的那一天，每次做的也都一樣，所以是日常工作。
  qa:
    question: 一件事要符合哪兩個條件，才算專案？
    answer: 第一，有明確的開始和結束；第二，做完會留下一個新的成果。NASA 手冊說專案有「a beginning, and an end」，而且會做出「new or revised products」。兩個條件都符合，才算專案（說明是本站整理）。
    source: nasa-smh
