- 核心素養 A2、A3、C2 保留：依總綱 p.4–6 國民小學教育的 E-A2、E-A3、E-C2 與綜合活動領綱 p.3、p.5 的綜-E-A2、綜-E-A3、綜-E-C2 原文確認（表格窄欄分散對齊，字距大，文字已用頁面影像核對）。
- stage.grades 填 5、6：本點的綜合活動代碼都是第三學習階段（III），總綱 p.7 說國民小學五、六年級為第三學習階段。
- est_time 依綜合活動領綱 p.2：第三學習階段綜合活動每週 2 節課；本點建議在綜合活動課上做。
- 頁碼都是頁腳印的頁碼：綜合活動領綱、總綱比 PDF 頁少 4，議題融入說明手冊少 16，氣象常識問答集少 10，NASA 排程手冊少 1，NASA 風險手冊少 20。
- 議題保留生涯規劃教育：議題融入說明手冊國小的實質內涵 涯E12「學習解決問題與做決定的能力。」（p.96），手冊建議融入綜合活動領域；本點的全班挑出共同目標就是在練習做決定。
- 原 idea「動手之前，先說清楚『成功長什麼樣子』。」的引號拿掉：那是本站整理的說法，不是引文。
- 原 scenario「班級同樂會：每人畫一張『同樂會成功的樣子』，再一起挑出大家都同意的三件事。」保留做法，引號拿掉，補上家庭聚會也可以照做，並把三件事寫成做完看得出有沒有做到的句子（本站建議）。
- 原 ai.delegable「提供活動點子、把大家的想法整理成清單」補上由大人操作（本站建議），並在 What 加上教育部注意事項（學生版）的使用規則。
- Scrum Guide 2020（Ken Schwaber、Jeff Sutherland，CC BY-SA 4.0）是軟體團隊的指南，本點只借它對目標和完成定義的說法，英文短句引用，中文說明是本站整理。
