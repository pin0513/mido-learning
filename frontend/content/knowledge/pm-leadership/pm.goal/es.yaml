how:
  heading: 從每個人的畫到三句話
  body:
  - 先各自畫：每個人畫一張活動成功的樣子，畫出當天會看到什麼。再輪流說給大家聽，其他人先聽完再發問。課綱說團隊合作要「表達自己的意見、尊重別人的意見」，最後「形成共識與決議」。
  - 再挑出共同點：把大家畫裡重複出現的事圈起來，挑三件大家都同意的。有人不同意時，先問他擔心什麼，能補進句子就補；補不進就投票，並把他的意見記下來，活動後回顧時再看（本站建議）。
  - 最後寫成檢查得到的句子：Scrum 指南把完成的定義寫成「a formal description of the state of the Increment when it meets the quality measures required for the product」。不寫要很好玩，改寫成每個人都玩到至少一個遊戲；不寫點心要夠，改寫成每人都拿到一份點心（例子是本站建議）。做完拿著句子一條一條對，就知道有沒有做到。
  qa:
    question: 怎樣寫，做完才看得出目標有沒有達成？
    answer: 寫成做完可以看、可以數的句子。例如每人都拿到一份點心，活動結束數一數就知道；要很好玩就沒辦法檢查。Scrum 指南把完成的定義叫做「a formal description」，大家照同一份說明檢查（說明是本站整理）。
    source: scrum-guide
  items_title: 四步做
  items:
  - title: 各自畫
    text: 畫出活動成功那天會看到什麼。
  - title: 輪流說
    text: 先聽完，再發問。
  - title: 圈出共同點
    text: 挑三件大家都同意的。
  - title: 寫成三句話
    text: 每句做完都看得出有沒有做到。
  checklist_title: 每句話檢查一下
  checklist:
  - 做完看得出來
  - 大家都同意
  - 說得出怎麼檢查
  activity_figure: goal-flow
  sources:
  - zonghe
  - scrum-guide
what:
  heading: 三句話，大家都同意
  body:
  - 學完後，孩子能和同學或家人一起，把一次活動成功的樣子寫成三句大家都同意、做完看得出有沒有做到的話，並在活動後拿來對照。
  items_title: 學完能做到
  items:
  - title: 說出成功的樣子
    text: 畫出來，再說給大家聽。
  - title: 找出共同點
    text: 有人不同意時先聽他擔心什麼。
  - title: 寫成檢查得到的話
    text: 做完數得出、看得到。
  checklist_title: 家長檢核
  checklist:
  - 三句話都寫好
  - 每句都能檢查
  - 說得出怎麼挑
  notes:
  - 本點融入生涯規劃教育議題：議題融入說明手冊國小的實質內涵有「學習解決問題與做決定的能力。」大家一起挑出三件事，就是在練習做決定。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - issues-handbook
  - genai-student
