est_time:
  school: 國小五、六年級綜合活動課
  source: zonghe
why:
  heading: 先說好成功的樣子
  body:
  - 108 課綱的綜合活動要國小高年級「參與各項活動，適切表現自己在團體中的角色，協同合作達成共同目標。」補充說明列出的團隊合作技巧，第一項就是釐清團隊目標：「團隊合作技巧包含釐清團隊目標、表達自己的意見、尊重別人的意見及形成共識與決議等。」
  - 專案管理也從目標開始。Scrum 指南說：「The Product Goal describes a future state of the product which can serve as a target for the Scrum Team to plan against.」意思是目標描述的是做完以後的樣子，大家照著它來計畫（翻譯是本站整理）。
  qa:
    question: 如果同樂會結束後大家都很開心，那是因為我們做對了什麼？
    answer: 拿出活動前大家說好的三句話，一句一句對照：做到了哪幾句，那幾句就是做對的事，下次要保留。沒有先說好，就只能說很好玩，說不出是哪裡做對了（本站整理）。綜合活動學習計畫的補充說明也寫到要「檢核、修正學習計畫，再度執行及檢討。」
    source: zonghe
  items_title: 綜合活動領綱的學習重點
  items:
  - title: 協同合作達成共同目標
    text: 綜合活動 2b-III-1：參與各項活動，適切表現自己在團體中的角色，協同合作達成共同目標。
    code: 2b-III-1
  - title: 團隊合作的技巧
    text: 綜合活動 Bb-III-3：團隊合作的技巧。
    code: Bb-III-3
  checklist_title: 開始前先確認
  checklist:
  - 有一件要辦的活動
  - 大家都到齊了
  figures:
  - goal-compare
  notes:
  - 綜合活動的代碼：數字開頭的是學習表現，大寫字母開頭的是學習內容；中間的 III 是第三學習階段（國小五、六年級）。
  - 總綱把國民小學五、六年級定為第三學習階段，所以本頁代碼中間都是 III。
