why:
  heading: AI 是隊友，責任在人
  body:
  - 行政院的生成式 AI 參考指引說：「生成式 AI 產出之資訊，須由業務承辦人就其風險進行客觀且專業之最終判斷，不得取代業務承辦人之自主思維、創造力及人際互動。」也說不得以未經確認的產出內容「作為公務決策之唯一依據」。指引是寫給政府機關的，但道理相通：AI 可以幫忙，最後的判斷和責任在人（本站整理）。
  - 美國 NIST 的 AI 風險管理框架說「Human roles and responsibilities in decision making and overseeing AI systems need to be clearly defined and differentiated.」人工智慧基本法第 4 條也把問責列為原則：「應確保承擔相應之責任」。高中資訊科技學過「資訊科技對人與社會的影響與衝擊。」也學過「能使用多元的觀點思辨資訊科技相關議題。」大學要把這些用在自己的專案分工上（本站整理）。
  qa:
    question: 如果 AI 的建議造成損失，責任在誰？
    answer: 在採用、核准這個建議的人身上，AI 不能替人負責。NIST 要人在決策和監督上的角色與責任「clearly defined and differentiated」，所以分工時就要先寫清楚誰做最後的決定（說明是本站整理）。
    source: nist-ai-rmf
  items_title: 這一點用到的
  items:
  - title: 最終判斷
    text: AI 的產出由人確認。
  - title: 角色與責任
    text: 誰決定、誰核准要寫清楚。
  - title: 適當揭露
    text: 用了 AI 要說明。
  - title: 過度相信
    text: 越信 AI，想得越少。
