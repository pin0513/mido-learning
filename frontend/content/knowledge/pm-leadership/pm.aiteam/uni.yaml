  exercise: 目標：用學校允許的 AI 工具規劃一個虛構的小專案，做一張分工紀錄：列出交給 AI 的工作和自己做的決定，每項寫理由、怎麼檢查 AI 的產出，以及出了錯由誰負責。　檢核：不看本頁，說出為什麼 AI 的建議造成損失時責任仍在做決定的人、哪些工作適合交給 AI、哪些判斷要自己做，以及你用哪些方法檢查 AI 的產出、避免太相信它。
