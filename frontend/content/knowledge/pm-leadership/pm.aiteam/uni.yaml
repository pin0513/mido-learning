- Lee 等人 2025 年論文的 PDF 沒有印頁碼，頁碼是 PDF 頁；這是 319 位知識工作者的自陳問卷研究，結果是相關，不是因果；CHI 論文經同儕審查，本點把 kind 標成 peer_reviewed（B16 的 it.hcai@uni 標成 reference，兩者都可）。
