what:
  heading: 會跟 AI 分工，也扛得起責任
  body:
  - 學完後，你能把專案的工作分成交給 AI 和自己做的兩類並說出理由，檢查 AI 的產出、避免太相信它，也能說明 AI 的建議出錯時，責任在做決定的人。
  items_title: 學完能做到
  items:
  - title: 合理分工
    text: 查得出、改得回的交出去。
  - title: 檢查產出
    text: 數字、事實、依據。
  - title: 扛起責任
    text: 做決定的人負責。
  checklist_title: 自我檢核
  checklist:
  - 分工紀錄完成
  - 產出都檢查過
  - 責任寫清楚
  notes:
  - 本頁的迎新活動例子是虛構的，本站整理。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - genai-student
