how:
  heading: 分工紀錄：交出去也要檢查
  body:
  - 先分工：用學校允許的 AI 工具規劃一個虛構的小專案，例如系上的迎新活動，不輸入任何人的名字和個人資料（例子是本站整理）。排程初稿、文件草稿、風險清單、會議紀錄這類量大、又可以檢查的工作，適合交給 AI；定目標、在價值之間取捨、決定做不做、對受影響的人負責，要自己做（本站整理）。判斷的原則是：做錯了查得出來、改得回來的，可以交出去；做錯了會傷到人，或需要對人負責的，留給自己（本站建議）。
  - 再檢查：每一項 AI 的產出都寫下怎麼檢查，例如數字自己算一次、事實對照原始資料、風險清單請組員補（本站建議）。行政院指引說「各機關不可完全信任生成式 AI 產出之資訊」，用了 AI 也要「適當揭露」。Lee 等人 2025 年的問卷研究發現「higher confidence in GenAI is associated with less critical thinking, while higher self-confidence is associated with more critical thinking.」越相信 AI，想得越少；這是相關，不一定是因果（說明是本站整理）。要避免太相信 AI：先自己想一個答案再問 AI，要求它列出依據，再挑一兩項從頭驗證（本站建議）。
  - 最後寫責任：分工紀錄的每一項都寫上出了錯由誰負責。AI 的建議造成損失時，責任在採用它、核准它的人，不在 AI：NIST 說「Human roles and responsibilities in decision making and overseeing AI systems need to be clearly defined and differentiated.」就像商業論證要寫清楚誰核准、誰負責交付（本站整理）。做完再反思：哪些決定你本來想交給 AI，後來收回來自己做？為什麼（本站建議）？
  qa:
    question: 怎麼避免太相信 AI？
    answer: 先自己想一個答案再問 AI，要求它列出依據，再挑一兩項從頭驗證（本站建議）。研究發現「higher confidence in GenAI is associated with less critical thinking」。
    source: lee-chi25
  items_title: 四步做
  items:
  - title: 列出工作
    text: 整個專案要做的事。
  - title: 分給 AI 或自己
    text: 每項都寫理由。
  - title: 寫檢查方法
    text: 數字、事實、依據。
  - title: 寫上負責人
    text: 出了錯誰負責。
  checklist_title: 每次做完勾一下
  checklist:
  - 沒輸入個資
  - 每項有理由
  - 產出檢查過
  - 負責人寫上
  activity_figure: aiteam-flow
