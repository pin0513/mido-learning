idea: AI 能處理大量規劃與分析，但目標設定、價值取捨與責任承擔仍在人身上。學會把 AI 當隊友來分工。
guiding_questions:
  - 如果 AI 的建議造成損失，責任在誰？
scenario: 用 AI 助理規劃一個專案，記錄哪些決定交給 AI、哪些自己做，並反思理由。
