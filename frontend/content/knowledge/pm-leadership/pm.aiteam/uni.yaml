- 原 ai.delegable「排程、文件、風險清單、會議紀錄等大量工作」補上使用條件（本站建議）。
- guiding_questions 補到三題，三題的答案都寫在 How 內文（qa 只是摘要）。
- 原 link_notes 哲學括號裡的兩個詞原本用「與」連接，剛好跟 B16 檢查擋下的一個 AI 素養面向名稱同字（那不是教育部《未來人才AI能力圖像》的名稱）；改用頓號「倫理、責任」，避免被當成框架名稱，意思不變。
- 哪些工作交給 AI 的判斷原則（做錯了查得出、改得回的可以交出去）是本站建議，不是指引或法規的條文。
