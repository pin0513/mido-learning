what:
  heading: 排得出先後，也知道哪裡不能晚
  body:
  - 學完後，孩子能替一次活動的任務卡畫出先後箭頭，從活動那天往回排到日曆上，指出最不能晚的那一串卡，並留一天緩衝。
  items_title: 學完能做到
  items:
  - title: 畫出先後
    text: 說得出為什麼要先做。
  - title: 排到日曆
    text: 從活動那天往回排。
  - title: 找出不能晚的卡
    text: 也留了緩衝。
  checklist_title: 家長檢核
  checklist:
  - 箭頭方向對
  - 日曆排得對
  - 留了緩衝
  figures:
  - seq-compare
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - genai-student
