- 原 scenario「做一張『倒數 10 天』日曆，把任務卡貼到對的日子。」保留做法，引號拿掉，天數標示意，補上先畫箭頭再往回排（本站建議）。
- 原 ai.delegable「檢查順序有沒有前後矛盾」補上由大人操作（本站建議），並在 What 加上教育部注意事項（學生版）的使用規則。
- 要徑（critical path）只在 How 的 qa 點到，算法留給高中的 pm.cpm@sh；NASA 手冊的定義原文見來源。
