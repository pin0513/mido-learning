how:
  heading: 畫箭頭，再往回排
  body:
  - 畫箭頭：拿出大事拆成小事那一課拆好的任務卡，兩張兩張問：哪張要先做完，另一張才能開始？從先做的畫箭頭指向後做的。NASA 手冊說，排程裡的每一項「should have at least one predecessor and at least one successor」，只有開始和結束可以例外；所以除了第一張和最後一張，每張卡前後都要接得上箭頭（本站整理）。
  - 往回排：活動日期不能改，所以從同樂會那天開始，沿著箭頭倒著把卡片貼到日曆上，才知道每張卡最晚哪天要開始；每張卡要花幾天就占幾格，沒有箭頭相連的卡可以排在同一天（本站整理）。課綱的學習計畫也包含「學習目標、學習時間、學習內容、學習方法等規劃」。最後在活動前留一天空白當緩衝（本站建議）。排好後，沿著箭頭找出每張卡天數加起來最多的那一串：這一串沒有空檔，任何一張晚一天，後面都跟著晚，只能用掉緩衝（本站整理）。
  qa:
    question: 哪一張任務卡如果晚了，後面全部都會跟著晚？
    answer: 沿著箭頭找出從開始到活動那天、每張卡天數加起來最多的那一串；這一串上的任何一張晚一天，後面每張都跟著晚一天，只能用掉活動前的緩衝，緩衝用完就來不及了。NASA 手冊把它叫做要徑：「the critical path is the sequence of activities that are tied together with network logic that have the longest overall duration」。高中會再學怎麼算（說明是本站整理）。
    source: nasa-smh
  items_title: 四步做
  items:
  - title: 畫先後箭頭
    text: 先做的指向後做的。
  - title: 從活動日往回排
    text: 每張卡最晚哪天開始。
  - title: 找出最不能晚的一串
    text: 天數加起來最多的那串。
  - title: 留一天緩衝
    text: 活動前空一天。
