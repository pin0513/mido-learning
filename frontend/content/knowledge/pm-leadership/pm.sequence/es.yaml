est_time:
  school: 國小五、六年級綜合活動課
  source: zonghe
why:
  heading: 有些事要等別的事做完
  body:
  - 108 課綱的綜合活動要高年級「規劃與執行學習計畫，培養自律與負責的態度。」補充說明也寫到「解決問題的規劃包括：探究問題成因、思考解決方法、評估各種方法的優缺點，進一步擬訂解決步驟等。」排出先後，就是在擬訂步驟。
  - NASA 的排程手冊把最常見的先後關係叫做完成到開始：「The successor activity cannot start until the predecessor activity has completed.」例如要先知道人數，才能買點心（例子是本站整理）。
  qa:
    question: 要先知道什麼，才能做下一件事？
    answer: 問自己：這張卡要用到哪張卡做出來的東西？買點心要用到人數，所以問人數那張卡要排前面。NASA 手冊說這是最常見的關係，因為它照著最常見的工作順序：「complete an activity and hand off the work to the next activity.」（說明是本站整理）
    source: nasa-smh
  items_title: 綜合活動領綱的學習重點
  items:
  - title: 規劃與執行計畫
    text: 綜合活動 1b-III-1：規劃與執行學習計畫，培養自律與負責的態度。
    code: 1b-III-1
  - title: 學習計畫
    text: 綜合活動 Ab-III-1：學習計畫的規劃與執行。
    code: Ab-III-1
  - title: 規劃策略解決問題
    text: 綜合活動 2c-III-1：分析與判讀各類資源，規劃策略以解決日常生活的問題。
    code: 2c-III-1
  - title: 解決問題的規劃
    text: 綜合活動 Bc-III-3：運用各類資源解決問題的規劃。
    code: Bc-III-3
  checklist_title: 開始前先確認
  checklist:
  - 任務卡已經拆好
  - 知道活動日期
  notes:
  - 綜合活動的代碼：數字開頭的是學習表現，大寫字母開頭的是學習內容；中間的 III 是第三學習階段（國小五、六年級）。
  - 總綱把國民小學五、六年級定為第三學習階段，所以本頁代碼中間都是 III。
