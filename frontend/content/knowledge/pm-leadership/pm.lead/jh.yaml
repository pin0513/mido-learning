why:
  heading: 領導看的是做了什麼
  body:
  - 108 課綱的綜合活動要國中生「體會參與團體活動的歷程，發揮個人正向影響，並提升團體效能。」輔導的補充說明寫「覺察團體氣氛，了解並發揮個人對團體運作的正向影響。」童軍露營要「透過領導或溝通，在團隊內分工合作」。課綱說的是每個人都能發揮影響，不是只有組長（本站整理）。
  - Scrum 指南描述的團隊「there are no sub-teams or hierarchies」，成員「internally decide who does what, when, and how.」它也說 Scrum Master 是「true leaders who serve the Scrum Team」：領導是為團隊服務，不是管人（翻譯是本站整理）。
  qa:
    question: 組長做的事，都算領導嗎？
    answer: 不一定。分配工作、催進度是組長的職責；讓大家朝同一個方向前進、幫卡住的人、自己先做到，才是領導行為，而且組員也做得到。Scrum 指南說 Scrum Master 是「true leaders who serve the Scrum Team」，領導是為團隊服務（說明是本站整理）。
    source: scrum-guide
