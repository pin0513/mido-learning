how:
  heading: 用觀察表找出領導行為
  body:
  - 先做觀察表：分成四種領導行為：主動（先開口提議、主動補位）、示範（自己先做到）、幫助（教人、幫卡住的人）、指方向（提醒大家目標是什麼）（分類是本站整理）。分配工作、催進度是組長的職責，不一定是領導；這四種行為不管是不是組長，做了才算領導，組員也做得到。
  - 觀察時只寫看得到的行為：寫誰、在什麼時候、做了什麼、對小組有什麼幫助。例如有位同學看到大家吵起來，先把兩個做法寫在白板上請大家比較（例子是本站整理）。不寫他很有領導力這種評語，也不打分數；觀察表只在班上分享，不拍照、不上傳（本站建議）。
  - 分享與練習：全組分享看到的行為，常會發現帶領大家的不只組長。再回想你最近一次沒有頭銜卻在帶領別人的時候，例如主動提醒大家集合時間；從四種行為裡選一個，下次合作時自己做做看（本站建議）。課綱的童軍露營也要學生「透過領導或溝通，在團隊內分工合作」。
  qa:
    question: 觀察表上的領導行為要怎麼寫，別人才看得出來？
    answer: 寫誰、在什麼時候、做了什麼、對小組有什麼幫助，只寫看得到的動作，不寫評語、不打分數（本站建議）。
    source: zonghe
  items_title: 四步做
  items:
  - title: 做觀察表
    text: 主動、示範、幫助、指方向。
  - title: 只記看得到的行為
    text: 誰、什麼時候、做了什麼。
  - title: 全組分享
    text: 帶領的人不只組長。
  - title: 選一個下次做
    text: 自己踏出第一步。
  checklist_title: 觀察表檢查
  checklist:
  - 寫了誰做的
  - 寫了做了什麼
  - 沒有寫評語
  activity_figure: lead-flow
  sources:
  - zonghe
  - scrum-guide
what:
  heading: 人人都能做的領導
  body:
  - 學完後，孩子能認出主動、示範、幫助、指方向四種領導行為，觀察並記錄同學看得到的行為，說出沒有頭銜也做得到的例子，並選一個自己下次合作時做做看。
  items_title: 學完能做到
  items:
  - title: 認出領導行為
    text: 不只看職位。
  - title: 觀察並記錄
    text: 只寫看得到的行為。
  - title: 自己踏出一步
    text: 選一個下次做。
  checklist_title: 家長檢核
  checklist:
  - 記了三個行為
  - 不只記組長
  - 選好自己要做的
  notes:
  - 本點融入生涯規劃教育議題：議題融入說明手冊國中的實質內涵有「覺察自己的能力與興趣。」在觀察和練習裡，孩子會發現自己擅長哪一種領導行為。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  - 本頁的 AI 活動由老師或家長操作，孩子在旁邊一起看、一起檢查 AI 的回答（本站建議）。
  sources:
  - issues-handbook
  - genai-student
