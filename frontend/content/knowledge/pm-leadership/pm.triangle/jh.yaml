why:
  heading: 想要的總比資源多
  body:
  - 國中公民課會問：個人與家庭為什麼需要做選擇？因為資源有限，又有很多種用途。課綱也要學生學會計算一項選擇的機會成本，並用它來解釋人為什麼這樣選。
  - 國中家政也要學生用合宜的方法，管理金錢、時間這些有限的資源。辦一個攤位也一樣：時間和錢都有限，還要顧好做出來的東西好不好。
  - 國中核心素養要求理解情境、善用資源擬定計畫，並與人合作。
  qa:
    question: 如果預算砍一半，你會犧牲時間還是品質？為什麼？
    answer: 兩種都可能，還有第三條路：少做一點。專案管理指南的說法是，時間縮短時常常要加錢；錢加不了，就可能要縮小範疇（少做一點），或降低品質。哪一個比較能接受，要看你們最在意什麼。
    source: pmi-rahschulte
  sources: [social, zonghe, zonggang, atkinson, pmi-rahschulte, sinek]

how:
  heading: 一次只動一角，看其他怎麼變
  body:
  - 專案管理指南說，這幾個因素只要改一個，很可能至少有另一個跟著受影響。所以比較方案時，固定預算和天數，一個一個看：這個方案，時間、金錢、品質哪一角變了？
  items:
  - {title: 先寫下限制, text: 預算多少、還有幾天，全組先講好。}
  - {title: 列出三種方案, text: 例如現做、買半成品加工、只賣飲料。}
  - {title: 每案標出動到哪一角, text: 省錢的方案，是花了更多時間，還是品質打了折？}
  - {title: 寫下放棄了什麼, text: 選了一個方案，其他方案就做不了。}
  activity_figure: how-flow
  sources: [pmi-rahschulte, social]

what:
  heading: 鐵三角和它的限制
  figures: [what-compare]
  notes:
  - 時間、成本、品質三項，常被叫做專案管理的「鐵三角」；研究者指出，近 50 年來它一直和「專案成不成功」綁在一起。
  - 品質沒有標準答案。研究者提醒，品質是從不同人的看法裡浮現出來的；每個人最在意的也不一樣，所以先問清楚客人和組員在意什麼。
  - 也有人把「範疇」（做多少）放進三角。專案管理指南最常列的限制就是成本、範疇、時間；這一頁用時間、金錢、品質，再把範疇當成可以調的第四個變數。
  - 鐵三角不是成功的全部：時間和成本都是事前的估計，還要看大家是不是真的得到好處。
  sources: [atkinson, pmi-rahschulte]

