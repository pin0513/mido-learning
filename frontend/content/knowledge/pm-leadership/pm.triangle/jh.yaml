idea: 時間、金錢、品質常被叫做專案的「鐵三角」。資源有限時，動了其中一個，通常會牽動另一個：時間變短，常要多花錢；錢加不了，就只能少做一點，或降低品質。所以「做多少」（範疇）也是可以調的變數。
guiding_questions:
- 如果預算砍一半，你會犧牲時間還是品質？為什麼？
- 這個攤位怎樣才算「做得好」？誰說了算？
- 多花一天準備，你放棄了什麼？
scenario: 園遊會攤位：在固定預算與兩週準備期內，先在紙上比較三種菜單方案（例如現做、買半成品加工、只賣飲料），每組說出每個方案動到了時間、金錢、品質的哪一角，再決定要選哪一個、放棄了什麼。
goal: 面對固定的預算和時間，說得出每個方案犧牲了什麼，並和組員一起做出決定。
review: 小組交出一張表：三個方案各寫時間、金錢、品質的變化，以及最後選擇放棄了什麼；每位組員都說得出選這個方案的理由。
