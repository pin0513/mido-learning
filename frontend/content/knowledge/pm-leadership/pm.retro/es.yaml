- 核心素養 A2、A3、C2 保留：依總綱 p.4–6 國民小學教育的 E-A2、E-A3、E-C2 與綜合活動領綱 p.3、p.5 的綜-E-A2、綜-E-A3、綜-E-C2 原文確認（表格窄欄分散對齊，字距大，文字已用頁面影像核對）。
- stage.grades 填 5、6：本點的綜合活動代碼都是第三學習階段（III），總綱 p.7 說國民小學五、六年級為第三學習階段。
- est_time 依綜合活動領綱 p.2：第三學習階段綜合活動每週 2 節課；本點建議在綜合活動課上做。
- 頁碼都是頁腳印的頁碼：綜合活動領綱、總綱比 PDF 頁少 4，議題融入說明手冊少 16，氣象常識問答集少 10，NASA 排程手冊少 1，NASA 風險手冊少 20。
- 原 scenario「同樂會後開 10 分鐘『星星與願望』回顧會：星星是做得好的事，願望是下次希望改進的事。」改成星星與箭頭：箭頭是下次要改的一件事，並寫成任務卡；時間標示意，補上家庭聚會也可以照做（本站建議）。
- 原 ai.delegable「把大家的回饋整理成清單」補上由大人操作（本站建議），並在 What 加上教育部注意事項（學生版）的使用規則。
- 對事不對人是本站建議：Scrum 指南要團隊檢視個人、互動、流程、工具與完成的定義，本點對國小只說事情和原因，不點名怪人。
