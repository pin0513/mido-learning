what:
  heading: 下次要改的，寫成任務卡
  body:
  - 學完後，孩子能在活動後說出做得好的事和可以更好的事，找出原因，並把最想改的一件事寫成下次的任務卡；說的時候對事不對人。
  items_title: 學完能做到
  items:
  - title: 說出星星和箭頭
    text: 好的和要改的都說。
  - title: 找出原因
    text: 對事不對人。
  - title: 寫成下次的卡
    text: 誰做、什麼時候。
  checklist_title: 家長檢核
  checklist:
  - 有星星有箭頭
  - 對事不對人
  - 改變寫成卡
  figures:
  - retro-compare
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - genai-student
