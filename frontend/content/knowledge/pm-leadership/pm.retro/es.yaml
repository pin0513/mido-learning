how:
  heading: 星星、箭頭，再選一件
  body:
  - 先寫星星和箭頭：每人寫一張星星（做得好的事）和一張箭頭（下次可以更好的事）。Scrum 指南說團隊要討論「what went well during the Sprint, what problems it encountered, and how those problems were (or were not) solved」。
  - 再找原因：把箭頭貼在一起，相近的放一堆，問這件事為什麼會發生。說的時候對事不對人：說點心單太晚定，不說都怪某個人（本站建議）。
  - 最後只選一件：指南說團隊要找出「the most helpful changes to improve its effectiveness」，最有幫助的改變要「addressed as soon as possible」。所以大家選一件最想改的事，寫成下次活動的任務卡，寫上誰做、什麼時候（本站整理）。
  qa:
    question: 下次再辦一次，你最想改變的一件事是什麼？
    answer: 每個人先說一件，再一起選出最有幫助的那一件，寫成任務卡：誰做、什麼時候。Scrum 指南說要找出「the most helpful changes to improve its effectiveness」；一次只改一件，下次才看得出有沒有變好（說明是本站整理）。
    source: scrum-guide
