why:
  heading: 做完回頭看，下次更好
  body:
  - 108 課綱的綜合活動要高年級「規劃與執行學習計畫，培養自律與負責的態度。」補充說明把學習計畫分成規劃、執行、檢核、修正，還要「檢核、修正學習計畫，再度執行及檢討。」在團隊裡，也要「在活動中覺察團隊運作出現的問題，找出原因，提出有效解決的策略，並著手改善。」
  - Scrum 指南說：「The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness.」回顧不是為了打分數，是為了讓下次做得更好（說明是本站整理）。
  qa:
    question: 做得好的地方，為什麼也要說出來？
    answer: 知道哪裡做對了，下次才會保留。Scrum 指南說回顧時要討論「what went well during the Sprint, what problems it encountered」，做得好的和遇到的問題都要說（說明是本站整理）。
    source: scrum-guide
