  kind: government
  supports: PV=BCWS、EV=BCWP、AC=ACWP；CPI = BCWP/ACWP、SPI = BCWP/BCWS，大於 1.0 為有利；CPI 為每 1 元實際成本賺得多少計畫工作；CV = BCWP − ACWP、SV = BCWP − BCWS；EAC 以 CPI 推估「typically a best case」、以 CPI×SPI 推估「typically a worst case」；TCPI = (BAC − BCWP) / (Target − ACWP)
- id: dau-spi
  title: "Acquipedia: Schedule Performance Index (SPI)"
