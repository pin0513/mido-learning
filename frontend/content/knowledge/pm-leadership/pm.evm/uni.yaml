# ---------- 新增 ----------
why:
  heading: 只看花了多少錢，看不出進度
  body:
  - 只比較預算和實際花費，不知道錢換到了多少工作。EVM 多了一個數字：實獲值 EV，也就是到今天實際完成的工作，原本編了多少預算。
  - 有了 EV，就能拆開兩個問題：錢花得值不值得（CPI = EV/AC），工作有沒有照計畫做出來（SPI = EV/PV）。
  qa:
    question: CPI 很好但 SPI 很差，可能發生了什麼事？
    answer: 已經做的工作花得比預算省，但完成的工作量比計畫少。示意：PV 100、EV 80、AC 70 萬元，CPI 約 1.14、SPI 0.80。可能是人手沒到齊，錢自然花得少。這不一定代表工期延誤，因為 SPI 不看要徑；要對照時程網路的要徑，才知道有沒有真的落後。
    source: dau-spi
  figures: [why-compare]
  sources: [nasa-evm-card, dau-spi, sinek]

how:
  heading: 三個數字，算兩個比值
  body:
  - EV 要算得出來，工作得先拆好、每一項都有預算。NASA 的 WBS 手冊說，WBS 的目的就是把工作分成可管理的小塊，以利控管成本與時程。
  - 下面照四步示範一次（數字是示意）：總預算 BAC 200 萬元、預計 8 個月，現在是第 4 個月底；算完比值後，再接著預測總成本、用時間看進度。
  items_title: 四步算（示範）
  items:
  - title: 定出 PV
    text: 到今天，依計畫應完成的工作值多少預算。
    example: （示意）照計畫，第 4 個月底該完成價值 100 萬元的工作：PV＝100。
  - title: 量出 EV
    text: 到今天，實際完成的工作值多少預算。
    example: （示意）實際做完的工作，原本預算是 80 萬元：EV＝80。
  - title: 記下 AC
    text: 為完成這些工作，實際花了多少。
    example: （示意）實際花了 70 萬元：AC＝70。
  - title: 算比值、看差額
    text: CPI = EV/AC，SPI = EV/PV；CV = EV − AC，SV = EV − PV。
    example: （示意）CV＝80−70＝＋10，SV＝80−100＝−20，單位都是萬元；CPI＝80÷70，約 1.14，每花 1 元做出約 1.14 元的工作；SPI＝80÷100＝0.80，每計畫做 1 元的工作，只做了 0.80 元。
  notes:
  - 接著預測總成本（示意）：NASA 參考卡的 EAC＝AC＋(BAC−EV)÷CPI，卡上說它「typically a best case」，這裡是 70＋120÷1.14…＝175 萬元；把 CPI×SPI 放進分母的版本「typically a worst case」，約 201 萬元。
  - 要照原預算做完（示意）：剩下的工作每花 1 元要做出 (200−80)÷(200−70)，約 0.92 元（TCPI），比目前的 1.14 低，代表目前的效率夠用（說明是本站整理）。
  - 用時間看進度（示意）：PV 照計畫逐月累積是 10、30、60、100、140、170、190、200 萬元。EV 80 落在第 3 個月底（60）和第 4 個月底（100）的正中間，所以賺得時程 ES＝3.5 個月；實際已過 AT＝4 個月，SPI(t)＝3.5÷4，約 0.88，等於落後半個月（說明是本站整理）。
  activity_figure: how-flow
  sources: [nasa-wbs, nasa-evm-card]

what:
  heading: SPI 的兩個盲點
  qa:
    question: 專案已經延誤，為什麼最後 SPI 還是 1？
    answer: 因為計畫的工作全部做完時，EV 等於 PV，SPI 依定義就是 1。示意：原訂 8 個月、預算 200 萬元的專案拖到第 10 個月才做完，那時 EV＝PV＝200，SPI＝1；用賺得時程看，ES＝8 個月、AT＝10 個月，SPI(t)＝0.8，才看得出晚了。
    source: dau-spi
  notes:
  - SPI 的兩個盲點：DAU 說明，SPI 不好不一定代表工期延誤，要評估時程網路的要徑才能判斷；而所有計畫工作做完時 EV 等於 PV，SPI 依定義就是 1，研究指出這段不可靠的時間通常落在專案的最後三分之一。
  - 常見的誤會：花了幾成錢不等於做了幾成。示意例子花了 70÷200＝35% 的預算，做了 80÷200＝40% 的工作；CPI 大於 1 也不代表最後一定不超支，EAC 只是假設未來的效率和過去一樣時的預測（本站整理）。
  - SV 是金額，不是天數。為了用時間看進度，Lipke 提出「賺得時程」（Earned Schedule）：ES 是目前做到的 EV，照計畫原本應該在第幾天達成；AT 是實際已經過了幾天。SPI(t) = ES / AT。
  - 練習對答案（示意，單位萬元）：CV＝210−250＝−40、SV＝210−240＝−30（都是金額，不是天數）；CPI＝210÷250＝0.84、SPI＝210÷240，約 0.88，兩個都不利；只用 CPI 推的 EAC＝250＋(400−210)÷0.84，約 476；用 CPI×SPI 推的 EAC 約 509；TCPI＝(400−210)÷(400−250)，約 1.27，比目前的 0.84 高很多。工期有沒有延誤，要看時程網路的要徑。
  sources: [dau-spi, vv-2006, nasa-evm-card]

