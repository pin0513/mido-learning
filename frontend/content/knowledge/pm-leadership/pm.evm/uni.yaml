idea: 用計畫價值（PV）、實獲值（EV）、實際成本（AC）三個數字，同時看進度與成本是否健康。成本績效 CPI=EV/AC，大於 1 代表每一元實際成本做出超過一元的實獲值。進度績效 SPI=EV/PV，大於 1 代表完成的工作（以預算計）比計畫多；但 SPI 不看要徑，要知道工期有沒有延誤，還得看時程網路。到了計畫結束、計畫的工作都做完時，EV 等於 PV，SPI 依定義就是 1，所以不能單靠它判斷收尾階段的進度。
guiding_questions:
- CPI 很好但 SPI 很差，可能發生了什麼事？
- 專案已經延誤，為什麼最後 SPI 還是 1？
scenario: 拿一份專案期中示意資料，計算 CPI、SPI，先說出數字代表什麼，再對照要徑上的工作有沒有落後，最後提出矯正行動。
goal: 會從 PV、EV、AC 算出 CPI、SPI，說得出它們代表什麼，也說得出 SPI 什麼時候不可靠。
review: 給一組期中資料，算出 CPI、SPI、CV、SV；用一句話解釋每個數字，並指出還需要看哪份資料才能判斷工期。
formats:
  slides: []
  article: 這一頁用一個虛構的專案示範實獲值管理。先在「怎麼學」照四步算出 PV、EV、AC 和兩個比值，再看預測總成本和用時間看進度的三段；「學什麼」說明 SPI 的盲點。最後做下面的練習。
  exercise: 目標：一個總預算 BAC 400 萬元的專案（示意），第 6 個月底 PV 240、EV 210、AC 250 萬元。照「怎麼學」的四步和後面的預測，算出 CV、SV、CPI、SPI、兩種 EAC 和 TCPI，各用一句話說它代表什麼，再說還要看哪份資料才知道工期有沒有延誤。　檢核：寫完後到「學什麼」的「練習對答案」核對。
