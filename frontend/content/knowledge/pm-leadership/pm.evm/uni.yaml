# ---------- 新增 ----------
why:
  heading: 只看花了多少錢，看不出進度
  body:
  - 只比較預算和實際花費，不知道錢換到了多少工作。EVM 多了一個數字：實獲值 EV，也就是到今天實際完成的工作，原本編了多少預算。
  - 有了 EV，就能拆開兩個問題：錢花得值不值得（CPI = EV/AC），工作有沒有照計畫做出來（SPI = EV/PV）。
  qa:
    question: CPI 很好但 SPI 很差，可能發生了什麼事？
    answer: 已經做的工作花得比預算省，但完成的工作量比計畫少。這不一定代表工期延誤，因為 SPI 不看要徑；要對照時程網路的要徑，才知道有沒有真的落後。
    source: dau-spi
  figures: [why-compare]
  sources: [nasa-evm-card, dau-spi, sinek]

how:
  heading: 三個數字，算兩個比值
  body:
  - EV 要算得出來，工作得先拆好、每一項都有預算。NASA 的 WBS 手冊說，WBS 的目的就是把工作分成可管理的小塊，以利控管成本與時程。
  items:
  - {title: 定出 PV, text: 到今天，依計畫應完成的工作值多少預算。}
  - {title: 量出 EV, text: 到今天，實際完成的工作值多少預算。}
  - {title: 記下 AC, text: 為完成這些工作，實際花了多少。}
  - {title: 算比值、看差額, text: CPI = EV/AC，SPI = EV/PV；CV = EV − AC，SV = EV − PV。, example: （示意）PV 100、EV 80、AC 70 → CPI ≈ 1.14，SPI = 0.80}
  activity_figure: how-flow
  sources: [nasa-wbs, nasa-evm-card]

what:
  heading: SPI 的兩個盲點
  notes:
  - SPI 不看要徑：DAU 說明，SPI 不好不一定代表工期延誤，要評估時程網路的要徑才能判斷。
  - 尾聲會趨近 1：所有計畫工作做完時 EV 等於 PV，SPI 依定義就是 1；研究指出，這段不可靠的時間通常落在專案的最後三分之一。
  - SV 是金額，不是天數。為了用時間看進度，Lipke 提出「賺得時程」（Earned Schedule）：ES 是目前做到的 EV，照計畫原本應該在第幾天達成；AT 是實際已經過了幾天。SPI(t) = ES / AT。
  sources: [dau-spi, vv-2006]

figures:
- id: why-compare
  type: compare
  title: 期中示意：成本好、進度差
  caption: 示意資料（單位：萬元），不是真實專案：PV 100、EV 80、AC 70。
