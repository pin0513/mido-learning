idea: 用計畫價值（PV）、實獲值（EV）、實際成本（AC）三個數字，同時看進度與成本是否健康。成本績效 CPI=EV/AC，大於 1 代表每一元實際成本做出超過一元的實獲值。進度績效 SPI=EV/PV，大於 1 代表進度超前。以成本為基礎的 SPI 在專案尾聲會趨近 1，不能單靠它判斷收尾階段的進度。
guiding_questions:
  - CPI 很好但 SPI 很差，可能發生了什麼事？
scenario: 拿一份專案期中資料，計算 CPI、SPI，並提出矯正行動。
