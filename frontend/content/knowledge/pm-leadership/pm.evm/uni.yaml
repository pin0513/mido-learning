sources:
- id: nasa-evm-card
  title: Performance Management Reference Card（Revised May 20, 2021）
  publisher: NASA
  url: https://www.nasa.gov/wp-content/uploads/2018/06/nasa_evm_reference_card.pdf
  accessed: "2026-10-28"
  kind: government
  supports: PV=BCWS、EV=BCWP、AC=ACWP；CPI = BCWP/ACWP、SPI = BCWP/BCWS，大於 1.0 為有利；CPI 為每 1 元實際成本賺得多少計畫工作；CV = BCWP − ACWP、SV = BCWP − BCWS
- id: dau-spi
  title: "Acquipedia: Schedule Performance Index (SPI)"
  publisher: Warfighting Acquisition University（WarU，原 Defense Acquisition University）
  url: https://www.waru.edu/acquipedia-article/schedule-performance-index-spi
  accessed: "2026-10-28"
  kind: government
  supports: SPI 大於 1.0 為有利；計畫工作全部完成時 BCWP 等於 BCWS，SPI 依定義為 1.0；SPI 與要徑時程無關，不利的 SPI 不一定代表延誤，延誤只能由網路時程的要徑判斷
- id: vv-2006
  title: "A comparison of different project duration forecasting methods using earned value metrics（International Journal of Project Management 24(4): 289–302，DOI 10.1016/j.ijproman.2005.10.004；Vlerick 工作論文版 2005/16）"
  publisher: Stephan Vandevoorde、Mario Vanhoucke，Elsevier（2006）
  url: https://public.vlerick.com/Publications/32498bd5-69a9-e011-8a89-005056a635ed.pdf
  accessed: "2026-10-28"
  kind: peer_reviewed
  supports: SV 以金額而非時間表示；專案尾聲 SV 收斂到 0、SPI 收斂到 1，即使專案延誤；不可靠的期間通常在最後三分之一；Lipke（2003）的賺得時程：把目前的 EV 對回計畫 PV 曲線，換算到時間軸上得到 ES；AT 指實際經過的時間（Actual Time）；SV(t) = ES − AT、SPI(t) = ES / AT
