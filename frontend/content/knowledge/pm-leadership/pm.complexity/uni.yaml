why:
  heading: 先看問題是哪一種
  body:
  - Kurtz 與 Snowden 2003 年的論文把情境分成幾種。可以分析（knowable）的領域裡，「While stable cause and effect relationships exist in this domain, they may not be fully known, or they may be known only by a limited group of people.」只要花時間研究或請專家，就能找出原因和結果（說明是本站整理）。複雜（complex）的領域不一樣：「Emergent patterns can be perceived but not predicted; we call this phenomenon retrospective coherence.」事後看起來有道理，事前卻預測不到（說明是本站整理）。
  - 所以不同的問題要用不同的方法：可以分析的問題適合先規劃、再照做的預測式方法；複雜的問題要邊做邊學。Scrum 指南說 Scrum 是要用「adaptive solutions for complex problems」創造價值，也說「Empiricism asserts that knowledge comes from experience and making decisions based on what is observed.」（說明是本站整理）。高中生涯規劃要學生「能正向看待不確定性，彈性的因應各種變化」；大學要能判斷不確定從哪裡來，再選方法（本站整理）。
  qa:
    question: 在複雜的情況下，還需要計畫嗎？
    answer: 需要，但計畫要短、要能改。Scrum 用「an iterative, incremental approach to optimize predictability and to control risk.」每一輪都檢視結果再調整下一輪的計畫（說明是本站整理）。
    source: scrum-guide
  items_title: 這一點用到的
  items:
  - title: 可以分析的問題
    text: 因果存在，花時間查得清。
  - title: 複雜的問題
