idea: 有些問題可以預測，有些高度複雜。先判斷問題的性質，再選擇預測式、敏捷或混合方法。
guiding_questions:
- 你怎麼知道一個問題是「複雜」而不只是「困難」？
- 建築案和 AI 產品開發案，各適合什麼管理方法？
- 在複雜的情況下，還需要計畫嗎？
scenario: 比較一個建築案與一個 AI 產品開發案（兩個都是虛構的），分析各自適合的管理方法（本站建議）。
