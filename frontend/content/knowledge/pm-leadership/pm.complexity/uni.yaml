how:
  heading: 判斷、選方法、先試一小步
  body:
  - 先判斷：列出案子裡已知和未知的事，再問三個問題：同樣的事以前做過嗎？請專家、多花時間分析，能不能事先知道結果？做了之後，別人的反應會不會改變結果（本站整理）？如果查得清楚、只是很花力氣，那是困難；如果怎麼分析都要等做了才知道，那是複雜（本站整理）。論文說，可以分析的領域要「sense incoming data, analyze that data, and then respond in accordance with expert advice」；複雜的領域則要「create probes to make the patterns or potential patterns more visible before we take any action.」先做小實驗，讓模式看得見（說明是本站整理）。論文也提醒，在複雜的領域只靠專家依過去穩定的模式判斷，會讓人沒準備好看出和因應意料之外的新模式（本站整理）。
  - 比較兩個案子：蓋一棟建築，結構、法規、工序大多查得到，請專業技師就能計算，比較接近可以分析的問題，適合預測式的計畫和要徑排程；開發一個 AI 產品，使用者會怎麼用、模型在真實資料上表現如何，常常做了才知道，比較接近複雜的問題，適合敏捷，用短週期做出小版本，看結果再調整（例子是本站整理）。很多案子是混合的：建築案裡的室內規劃要問使用者，AI 產品裡的資訊安全和法規要事先規劃（本站整理）。
  - 複雜時也要計畫，只是計畫要短、要能改。Scrum 指南說它用「an iterative, incremental approach to optimize predictability and to control risk.」每一輪都當成一次小實驗：先寫下你猜會發生什麼，做了再看，猜錯就改下一輪的計畫（本站建議）。AI 可以幫你整理不同方法論的比較，但案子屬於哪一種、要冒多少風險，要你自己判斷（本站整理）。
  qa:
    question: 你怎麼知道一個問題是「複雜」而不只是「困難」？
    answer: 看能不能事先查清楚：多花時間分析或請專家就能知道結果的，是困難；怎麼分析都要等做了才看得出來的，是複雜。論文說複雜的領域要先「create probes」，讓模式變得看得見（說明是本站整理）。
    source: kurtz-snowden-2003
  items_title: 四步做
  items:
  - title: 列已知和未知
    text: 兩個案子各列三件。
  - title: 判斷問題類型
    text: 查得清，還是試了才知道？
  - title: 選方法
    text: 預測式、敏捷或混合。
  - title: 設計第一個小實驗
    text: 先猜結果，再做做看。
