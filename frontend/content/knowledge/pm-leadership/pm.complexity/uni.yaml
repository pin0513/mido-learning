what:
  heading: 看清問題，再選方法
  body:
  - 學完後，你能分辨困難的問題和複雜的問題，為不同的案子選預測式、敏捷或混合方法並說出理由，也能在複雜的情況下用短週期的小實驗來計畫。
  items_title: 學完能做到
  items:
  - title: 分辨困難和複雜
    text: 查得清，還是試了才知道。
  - title: 選對方法
    text: 預測式、敏捷或混合。
  - title: 用小實驗計畫
    text: 先猜、再做、再改。
  checklist_title: 自我檢核
  checklist:
  - 兩案都分析
  - 方法有理由
  - 小實驗設計好
  notes:
  - 本頁的建築案和 AI 產品案是虛構的例子，本站整理。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
