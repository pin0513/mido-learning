idea: 計畫常會遇到意外。事先想好「萬一」，真的發生時就不會手忙腳亂。
guiding_questions:
- 哪些「萬一」最可能發生？哪些發生了最麻煩？
- 什麼時候要改用 B 計畫？
- 哪些萬一不是小朋友自己處理，要馬上找大人？
scenario: 每組替同樂會想 2 個萬一（個數是示意），替每個萬一寫好 B 計畫和改用 B 計畫的時機；家庭出遊也可以照做（本站建議）。
formats:
  slides: []
  exercise: 目標：替一次活動想出幾個萬一，比較每個萬一多可能發生、發生了多麻煩，替最重要的兩個寫好 B 計畫和改用的時機，並分得出哪些要馬上找大人。　檢核：家長或老師看 B 計畫：每個都寫了什麼情況改用、改成怎樣、誰負責；孩子說得出為什麼先處理這兩個萬一，也說得出受傷或地震這類情況要馬上找大人、照學校的規定做。
