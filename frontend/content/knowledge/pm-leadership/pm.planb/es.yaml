verify_notes:
- 核心素養 A2、A3、C2 保留：依總綱 p.4–6 國民小學教育的 E-A2、E-A3、E-C2 與綜合活動領綱 p.3、p.5 的綜-E-A2、綜-E-A3、綜-E-C2 原文確認（表格窄欄分散對齊，字距大，文字已用頁面影像核對）。
- stage.grades 填 5、6：本點的綜合活動代碼都是第三學習階段（III），總綱 p.7 說國民小學五、六年級為第三學習階段。
- est_time 依綜合活動領綱 p.2：第三學習階段綜合活動每週 2 節課；本點建議在綜合活動課上做。
- 頁碼都是頁腳印的頁碼：綜合活動領綱、總綱比 PDF 頁少 4，議題融入說明手冊少 16，氣象常識問答集少 10，NASA 排程手冊少 1，NASA 風險手冊少 20。
- 原 curriculum_108.domains 的健康與體育刪除：本點的危機辨識與 B 計畫對應綜合活動 3a-III-1 與 Ca-III-1～Ca-III-3，沒有對應的健康與體育代碼；link_notes 仍保留健康與體育（安全）當跨科提示（本站建議）。
- 3a-III-1、Ca-III-1、Ca-III-2、Ca-III-3 不在 main 的代碼表，已寫進 taxonomy-additions.yaml，頁碼用綜合活動領綱 p.15 的學習重點表（整句都在同一頁）。
- 議題保留安全教育：議題融入說明手冊國小的實質內涵 安E2「了解危機與安全。」、安E4「探討日常生活應該注意的安全。」（p.89），手冊建議融入的領域包含綜合活動領域（p.90）。
- 原 scenario「每組替同樂會想 2 個『萬一』，並寫下對應的 B 計畫。」保留做法，引號拿掉，個數標示意，補上改用 B 計畫的時機和家庭出遊也可以照做（本站建議）。
- 原 ai.delegable「列出常見的意外狀況」補上由大人操作（本站建議），並在 What 加上教育部注意事項（學生版）的使用規則。
- 降雨機率的說法依中央氣象局氣象常識問答集 p.55；前一天看降雨機率、很高就改到室內是本站建議，沒有訂數字門檻。
- 安全界線：受傷、地震、火災這類情況要馬上找大人、照學校的防災規定做，不由孩子自己的 B 計畫處理（本站建議；資源清單依綜合活動領綱 p.79）。
