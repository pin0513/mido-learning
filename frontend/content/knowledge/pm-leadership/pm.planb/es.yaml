est_time:
  school: 國小五、六年級綜合活動課
  source: zonghe
why:
  heading: 事先想好萬一
  body:
  - 108 課綱的綜合活動要高年級「辨識周遭環境的潛藏危機，運用各項資源或策略化解危機。」補充說明舉的例子是「自然環境潛藏的危機，如：風災、地震、水災、火災、土石流、雷擊、海嘯及複合式危機等。」
  - NASA 的風險管理手冊把風險拆成三件事：會發生什麼情況、多可能發生、發生了有多嚴重。原文是「The scenario(s) leading to degraded performance」、「The likelihood(s) (qualitative or quantitative) of those scenarios.」和「The consequence(s) (qualitative or quantitative severity of the performance degradation) that would result if those scenarios were to occur.」（翻譯是本站整理）
  qa:
    question: 哪些「萬一」最可能發生？哪些發生了最麻煩？
    answer: 把每個萬一問兩題：多可能發生？發生了多麻煩？這就是 NASA 手冊說的可能性「The likelihood(s)」和後果「The consequence(s)」。兩題都高的先寫 B 計畫；不太可能又不麻煩的，記下來就好（說明是本站整理）。
    source: nasa-risk
  items_title: 綜合活動領綱的學習重點
  items:
  - title: 辨識危機並化解
    text: 綜合活動 3a-III-1：辨識周遭環境的潛藏危機，運用各項資源或策略化解危機。
    code: 3a-III-1
  - title: 環境潛藏的危機
    text: 綜合活動 Ca-III-1：環境潛藏的危機。
    code: Ca-III-1
  - title: 辨識危機的方法
    text: 綜合活動 Ca-III-2：辨識環境潛藏危機的方法。
    code: Ca-III-2
  - title: 化解危機的資源或策略
    text: 綜合活動 Ca-III-3：化解危機的資源或策略。
    code: Ca-III-3
  checklist_title: 開始前先確認
  checklist:
  - 活動計畫已排好
  - 知道活動場地
  notes:
  - 綜合活動的代碼：數字開頭的是學習表現，大寫字母開頭的是學習內容；中間的 III 是第三學習階段（國小五、六年級）。
  - 總綱把國民小學五、六年級定為第三學習階段，所以本頁代碼中間都是 III。
