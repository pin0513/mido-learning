  - nasa-risk
what:
  heading: 萬一發生，也不慌
  body:
  - 學完後，孩子能替一次活動想出萬一，比較可能性和麻煩程度，替最重要的萬一寫好 B 計畫和改用時機，並分得出哪些情況要馬上找大人。
  items_title: 學完能做到
  items:
  - title: 找出萬一
    text: 看場地、問老師。
  - title: 排出先後
    text: 先處理又可能又麻煩的。
  - title: 寫好 B 計畫
    text: 也寫好改用的時機。
  - title: 知道找大人
    text: 受傷、地震、火災。
  checklist_title: 家長檢核
  checklist:
  - B 計畫寫清楚
  - 說得出改用時機
  - 知道要找大人
  figures:
  - planb-compare
  notes:
  - 本點融入安全教育議題：議題融入說明手冊國小的實質內涵有「了解危機與安全。」和「探討日常生活應該注意的安全。」
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - issues-handbook
  - genai-student
