  - zonggang
how:
  heading: 看天氣，寫 B 計畫
  body:
  - 列出萬一：用課綱說的方法「有效運用各種感官，客觀蒐集訊息，以辨識可能存在的危機。」例如去看場地、問老師以前遇過什麼事。再把每個萬一問兩題：多可能？多麻煩？兩題都高的先處理（本站建議）。
  - 看降雨機率：中央氣象局的氣象常識問答集說，降雨機率大時，「對於預定的活動即須預作準備」，也提醒「在使用降雨機率預報時，必須存有風險的觀念」。所以 B 計畫要先寫好改用的時機，例如前一天降雨機率很高就改到室內（本站建議）。
  - 寫 B 計畫：每個 B 計畫寫清楚什麼情況改用、改成怎樣、誰負責。NASA 手冊說：「Risk drivers can be selected for detailed observation and contingency plans developed.」受傷、地震、火災這類情況不是孩子自己處理，課綱列的資源有「親人、師長、社區愛心商店、急救專線、社會福利機構等」，要馬上找大人、照學校的防災規定做（本站建議）。
  qa:
    question: 什麼時候要改用 B 計畫？
    answer: 事先說好一個看得到的時機，到時候照著做，不用臨時吵。例如前一天晚上看降雨機率，很高就改到室內。問答集說降雨機率大時，「對於預定的活動即須預作準備」（時機的訂法是本站建議）。
    source: cwa-qa
  items_title: 四步做
  items:
  - title: 列出萬一
    text: 看場地、問老師。
  - title: 問兩題
    text: 多可能？多麻煩？
  - title: 寫 B 計畫
    text: 什麼時候改用、改成怎樣、誰負責。
  - title: 危險就找大人
    text: 照學校的防災規定做。
  checklist_title: 每個 B 計畫寫上
  checklist:
  - 什麼時候改用
  - 改成怎樣
  - 誰負責
  activity_figure: planb-flow
  sources:
  - zonghe
