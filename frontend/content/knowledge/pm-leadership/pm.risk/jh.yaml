how:
  heading: 兩把尺，四個格子
  body:
  - 先列風險、再評分：每組列出畢業旅行可能出的狀況，例如下雨、暈車、有人走失、遺失錢包、戲水時有人落水（例子是本站整理）。每個風險評兩次：可能性高或低、影響大或小，並寫下理由，例如以前發生過、天氣預報怎麼說、問過老師。NASA 手冊說放進格子要有「a rational, objective, and defensible process」，講得出道理，別人才能檢查。
  - 放進四格表，照格子處理：很可能又很嚴重的先處理，因為它最可能真的發生，發生了傷害也最大；想辦法讓它不容易發生或傷害變小，手冊叫 Mitigate。很少發生但很嚴重的，例如落水、走失，一發生就無法挽回，不能因為少見就不管，要事先準備救生衣、集合地點和聯絡方式，並指定誰注意訊號，真的發生時立刻找帶隊老師，照學校規定處理（本站建議），手冊叫 Watch：「Risk drivers can be selected for detailed observation and contingency plans developed.」很可能但影響小的，簡單預防就好，例如帶暈車藥；不太可能又影響小的，可以接受，手冊叫 Accept（對應是本站整理）。
  - 記得四格表的限制：手冊說矩陣是「a simple, supplementary communication tool」，而且「Interaction between individual risks is not considered.」例如下雨可能讓走失更容易發生，格子看不出來，要另外討論（例子是本站整理）。活動前一天再看一次表，情況變了就移動格子。
  qa:
    question: 有沒有哪個風險很少發生，但一發生就無法挽回？
    answer: 有，例如戲水時有人落水、在山上走失。它們放在很少發生但很嚴重的那一格，不能因為少見就不管：事先準備救生衣、集合地點和聯絡方式，並指定誰注意訊號（本站建議）。
    source: nasa-risk
  items_title: 四步做
  items:
  - title: 列出風險
    text: 畢業旅行可能出的狀況。
  - title: 評可能性和影響
    text: 高或低、大或小，寫下理由。
  - title: 放進四格表
    text: 一格一格看。
  - title: 照格子處理
    text: 最重的先處理，少見嚴重要準備。
  checklist_title: 畫完檢查
  checklist:
  - 每個都有理由
  - 最重的先處理
  - 少見嚴重有準備
  activity_figure: risk-flow
  sources:
  - nasa-risk
  - zonghe
what:
  heading: 排出先處理哪個風險
  body:
  - 學完後，孩子能替一次校外活動列出風險，用可能性和影響兩把尺放進四格表並寫下理由，說出每一格怎麼處理，也知道四格表看不出風險之間的影響。
  items_title: 學完能做到
  items:
  - title: 用兩把尺評風險
    text: 每個都寫理由。
  - title: 照格子處理
    text: 先處理最重的那一格。
  - title: 說出四格表的限制
    text: 看不出風險之間的影響。
  checklist_title: 家長檢核
  checklist:
  - 每格都有理由
  - 先處理最重的
  - 少見嚴重有準備
  notes:
  - 本點融入安全教育議題：議題融入說明手冊國中的實質內涵有「了解日常生活容易發生事故的原因。」和「探討日常生活發生事故的影響因素。」替每個風險寫理由，就是在找事故的原因。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  - 本頁的 AI 活動由老師或家長操作，孩子在旁邊一起看、一起檢查 AI 的回答（本站建議）。
  sources:
  - issues-handbook
  - genai-student
