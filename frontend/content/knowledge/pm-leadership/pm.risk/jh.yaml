    text: 綜合活動 3a-IV-1：覺察人為或自然環境的危險情境，評估並運用最佳處理策略，以保護自己或他人。
    code: 3a-IV-1
  - title: 戶外活動的風險管理
    text: 綜合活動 童 Cc-IV-1：戶外休閒活動的安全、風險管理與緊急事件的處理。
    code: 童 Cc-IV-1
