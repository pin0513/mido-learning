est_time:
  school: 國中七至九年級綜合活動課
  source: zonghe
why:
  heading: 不是每個萬一都一樣重要
  body:
  - 108 課綱的綜合活動要國中生「覺察人為或自然環境的危險情境，評估並運用最佳處理策略，以保護自己或他人。」童軍的補充說明也要「探討戶外休閒活動的安全與風險管理，培養戶外休閒活動處理緊急事件的能力，並能運用小隊的危機處理能力隨機應變。」
  - NASA 的風險手冊說，看一個風險要看兩件事：「The likelihood(s) (qualitative or quantitative) of those scenarios.」和「The consequence(s) (qualitative or quantitative severity of the performance degradation) that would result if those scenarios were to occur.」也就是多可能發生、發生後多嚴重（翻譯是本站整理）。國小學過替萬一準備 B 計畫，國中再用這兩把尺排出先處理哪一個。
  qa:
    question: 一個風險要放哪一格，怎麼決定才不是亂猜？
    answer: 每個風險都寫出理由：以前發生過幾次、天氣預報怎麼說、問過老師或家長。NASA 手冊說放進矩陣要有「a rational, objective, and defensible process」，也就是講得出道理、別人可以檢查（說明是本站整理）。
    source: nasa-risk
  items_title: 綜合活動領綱的學習重點
  items:
