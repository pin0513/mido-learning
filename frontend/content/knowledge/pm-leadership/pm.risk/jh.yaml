- stage.grades 填 7、8、9：本點的綜合活動代碼都是第四學習階段（IV），綜合活動領綱國中的學習重點沒有再分年級；總綱 p.7 說國民中學七、八、九年級為第四學習階段。
- est_time 依綜合活動領綱 p.2：第四學習階段綜合活動實施領域教學，每週 3 節課；本點建議在綜合活動課上做。
- 頁碼都是頁腳印的頁碼：綜合活動領綱、總綱比 PDF 頁少 4，議題融入說明手冊少 16，NASA 排程手冊少 1，NASA 風險手冊少 20；會議規範沒有印頁碼，用 PDF 頁並註明條次。
- 新增學習內容代碼的頁碼用附錄二學習內容說明裡代碼所在的頁（同代碼表既有的家 Ca-IV-1 p.85、童 Cb-IV-2 p.88）；學習表現用 p.19–21 學習重點表。
- 原 curriculum_108.domains 的數學刪除：本點的風險評估對應綜合活動 3a-IV-1、童 Cc-IV-1，四格表只分高低，沒有計算機率，沒有對應的數學代碼；link_notes 仍保留數學（機率入門）當跨科提示，related 的 ma.prob@jh 不變。
