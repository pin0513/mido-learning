- 原 idea「不是每個『萬一』都一樣重要。用『多可能發生』和『發生後多嚴重』排出優先順序。」的引號拿掉：那是本站整理的說法，不是引文。
- 原 scenario「畢業旅行風險表：把 10 個風險放進 2×2 格子，先處理『很可能又很嚴重』的那一格。」的 10 改成十、2×2 格子改成可能性和影響各分高低的四格表，引號拿掉（本站建議）。
- NASA 手冊談的是 5x5 矩陣，並列出它的限制；本點簡化成四格表給國中生用（本站建議），並在 How 說明格子看不出風險之間的影響。Accept、Mitigate、Watch 的說法依手冊 p.19，對應到四格表的處理方式是本站整理。
- 原 ai.delegable「腦力激盪出風險清單」補上由老師或家長操作（本站建議），並在 What 加上教育部注意事項（學生版）的使用規則。
