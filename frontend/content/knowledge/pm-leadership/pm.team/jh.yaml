how:
  heading: 開會前、開會時、開會後
  body:
  - 開會前：主持人先寫好會議目的和要討論的事。《會議規範》說「開會應於事先編訂會議程序」，程序裡有報告事項、討論事項和臨時動議。紀錄可以由主持人指定或大家推選：「會議之紀錄人員，除各該會議另有規定外，得由主席指定，或由會議推選之。」小組每次輪流換人當（本站建議）。
  - 開會時：主持人照順序請每個人發言、掌握時間，自己先不搶著表達意見；規範說「主席應居於公正超然之地位，嚴格執行會議規則，維持會議和諧，使會議順利進行。」意見不合時，先請雙方說出理由和擔心，找出共同點、修改提案；還是談不攏，就照事先說好的方式表決，少數意見也寫進紀錄（本站建議）。紀錄寫下出席的人、每件討論的事和結果，散會前唸一遍讓大家確認。
  - 開會後：每項決議寫上負責人和期限，例如海報組負責、星期五前完成（例子是本站整理）。規範的議事紀錄要寫「討論事項，表決方法及結果。」本站建議再加上負責人和期限，下次開會先「報告上次會決議案執行情形。」Scrum 指南也要每天的短會產出「an actionable plan for the next day of work」，也就是有下一步（說明是本站整理）。散會時每個人都說得出做了哪些決議、誰負責、什麼時候完成，這場會才算有開成；只聊得很熱鬧、散會後沒人知道要做什麼，就是沒開成（本站整理）。
  qa:
    question: 主持人和紀錄各要做什麼？
    answer: 主持人事先寫好目的和程序，開會時請每個人發言、掌握時間、保持公正；紀錄寫下出席的人、討論的事和決議，散會前唸一遍讓大家確認（本站建議）。
    source: moi-meeting
  items_title: 四步做
  items:
