    text: 開會前由主持人準備。
  - title: 輪流發言
    text: 主持人掌握時間、保持公正。
  - title: 做出決議
    text: 談不攏就照說好的方式表決。
  - title: 寫負責人和期限
    text: 下次開會先追蹤。
