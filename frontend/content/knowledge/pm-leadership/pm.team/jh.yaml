what:
  heading: 開一場有開成的會
  body:
  - 學完後，孩子能輪流當主持人或紀錄，開一場有目的的小組會議，在意見不合時一起做出決議，寫出每項都有負責人和期限的紀錄，並在下次開會先追蹤。
  items_title: 學完能做到
  items:
  - title: 主持一場會議
    text: 有目的、有程序、人人發言。
  - title: 寫會議紀錄
    text: 決議都有負責人和期限。
  - title: 追蹤上次決議
    text: 下次開會先報告。
  checklist_title: 家長檢核
  checklist:
  - 有會議目的
  - 決議有負責人
  - 決議有期限
  notes:
  - 本點融入品德教育議題：議題融入說明手冊國中的實質內涵有「溝通合作與和諧人際關係。」和「理性溝通與問題解決。」開會時輪流發言、意見不合時說理由，就是在練習。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  - 本頁的 AI 活動由老師或家長操作，孩子在旁邊一起看、一起檢查 AI 的回答（本站建議）。
  sources:
  - issues-handbook
  - genai-student
