- 核心素養 A2、A3、C2 保留：依總綱 p.4–6 國民中學教育的 J-A2、J-A3、J-C2 與綜合活動領綱 p.3、p.5 的綜-J-A2、綜-J-A3、綜-J-C2 原文確認（表格窄欄分散對齊，字距大，文字已用頁面影像核對）。
- stage.grades 填 7、8、9：本點的綜合活動代碼都是第四學習階段（IV），綜合活動領綱國中的學習重點沒有再分年級；總綱 p.7 說國民中學七、八、九年級為第四學習階段。
- est_time 依綜合活動領綱 p.2：第四學習階段綜合活動實施領域教學，每週 3 節課；本點建議在綜合活動課上做。
- 頁碼都是頁腳印的頁碼：綜合活動領綱、總綱比 PDF 頁少 4，議題融入說明手冊少 16，NASA 排程手冊少 1，NASA 風險手冊少 20；會議規範沒有印頁碼，用 PDF 頁並註明條次。
- 新增學習內容代碼的頁碼用附錄二學習內容說明裡代碼所在的頁（同代碼表既有的家 Ca-IV-1 p.85、童 Cb-IV-2 p.88）；學習表現用 p.19–21 學習重點表。
- 議題加品德教育：議題融入說明手冊國中的實質內涵 品J1「溝通合作與和諧人際關係。」、品J8「理性溝通與問題解決。」（p.75）；輪流發言、意見不合時說理由，就是在練習這兩項。
- 原 idea「好團隊會經歷磨合期。開會要有目的、有紀錄、有下一步。」改寫：團隊發展階段的理論本點沒有引用，改說新團隊一開始常會意見不合，要靠溝通慢慢磨合（本站整理），依據是綜合活動 輔 Dc-IV-2、童 Aa-IV-2 的補充說明；link_notes 的心理學（團隊發展階段）跟著改成心理學（團體動力），對齊課綱用詞。
- 原 scenario「輪流擔任主持人與紀錄，練習寫出『決議＋負責人＋期限』的會議紀錄。」保留做法，引號拿掉，補上下次開會先追蹤（本站建議）。
- 原 ai.delegable「把會議錄音整理成重點與待辦」改成整理老師或家長打好的紀錄：錄音裡有同學的聲音，教育部注意事項要求不輸入他人的個人資料，所以不上傳錄音（本站建議）。
- 會議規範是內政部公布的會議通則，本點只取會議的定義、程序、紀錄與主席的規定；每項決議寫負責人和期限是本站建議，規範沒有這樣規定。
- Scrum Guide 2020（CC BY-SA 4.0）是軟體團隊的指南，本點只借 Daily Scrum 產出下一步的說法，英文短句引用，中文說明是本站整理。
