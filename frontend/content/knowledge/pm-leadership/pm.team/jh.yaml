est_time:
  school: 國中七至九年級綜合活動課
  source: zonghe
why:
  heading: 開會是為了一起做決定
  body:
  - 108 課綱的綜合活動要國中生「參與各項團體活動，與他人有效溝通與合作，並負責完成分內工作。」輔導的學習內容有「團體溝通、互動與工作效能的提升。」補充說明要學生「學習團體集思廣益，溝通協商以及形成團體共識的方法。」童軍的小隊也要「學習團隊合作與增進團體動力的方式。」
  - 內政部的《會議規範》第一條說：「三人以上，循一定之規則，研究事理，達成決議，解決問題，以收群策群力之效者，謂之會議。」開會不是聊天，是為了做出決議、解決問題。新組成的小組一開始常會意見不合，照規則開會、把決議寫下來，就是磨合的方法（本站整理）。
  qa:
    question: 一場會議結束時，怎樣才算「有開成」？
    answer: 散會時每個人都說得出做了哪些決議，每項決議都有負責人和期限，而且寫進了紀錄，下次開會一開始就能追蹤。只聊得很熱鬧、散會後沒人知道要做什麼，就是沒開成（本站整理）。
    source: moi-meeting
