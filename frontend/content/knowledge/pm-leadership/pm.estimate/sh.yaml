# ---------- 新增 ----------
why:
  heading: 人總是把時間估得太短
  body:
  - 心理學家把這種現象叫「計畫謬誤」。在一項研究裡，大學生預測自己平均 33.9 天完成榮譽學程的畢業論文，實際平均花了 55.5 天；只有 29.7% 的人在自己預測的時間內完成。
  - 高中課綱的生涯規劃，要學自主學習的方法與策略、時間管理；總綱也讓高中的彈性學習時間可以做學生自主學習。估得準，計畫才排得出來。
  figures: [why-compare]
  qa:
    question: 悲觀估計就一定夠用嗎？
    answer: 不一定。同一項研究也請學生想像「一切都最糟」時要幾天，平均答 48.6 天，還是比實際的 55.5 天短，只有 48.7% 的人在這個悲觀日期內完成。
    source: buehler
  sources: [buehler, zonghe, zonggang, sinek]

how:
  heading: 拆開、估三次、再對照
  body:
  - 同一項研究的研究四發現，只請受試者回想過去的經驗，預測一樣偏短；要把過去類似的任務花了多久，明確連到這一次的預測，偏短的情形才消失。不過作者也指出，這樣的預測偏差較小，卻沒有比較準。
  - 一個實用的做法（這是建議，不是研究結果）：三點估算之後，記下每一項實際花的時間，下一次估計前拿出來對照。
  items:
  - {title: 拆到估得出來, text: 用 WBS 拆到每一項都有具體要做的事。}
  - {title: 每項估三個數, text: 樂觀 O、最可能 M、悲觀 P。}
  - {title: 算出期望值, text: PERT：E=(O+4M+P)/6。, example: （示意）O=2、M=3、P=7 小時 → E=(2+12+7)/6=3.5 小時}
  - {title: 記實際、回頭對照, text: 每週記下實際時數，下次估計前先看上次差多少。}
  activity_figure: how-flow
  sources: [nasa-wbs, pert-1959, buehler]

what:
  heading: 三個估計，兩種分佈
  notes:
  - PERT 原始論文（1959）用 a、m、b 代表樂觀、最可能、悲觀，期望值 t_e = (a+4m+b)/6；它假設標準差可以用 (b−a)/6 估計，活動時間服從 beta 分佈。
  - 如果把三個值當成三角分佈的最低、最可能、最高，平均是 (O+M+P)/3。NASA 的成本估算手冊說，三角分佈只要三個點就能定出來，常用來描述風險；再用蒙地卡羅模擬反覆抽樣，算出可能結果的範圍。
  - 最可能的值、中位數、平均不一定相同：分佈左右對稱時三者相等（NASA 手冊的常態分佈例子，三者都是 15），偏向一邊時就會分開。像 NASA 手冊這個偏右的三角分佈例子：最低 10、最可能 15、最高 30，中位數 17.75，平均 18.33。
  - NASA 手冊也提醒，分析師和工程師常把最好的情況想得太好、把最壞的情況想得不夠壞。
  - 平均數、標準差、期望值是高中數學 10 年級的學習內容（D-10-2、D-10-4）。11 年級 A 類還要檢視主觀機率合不合理（D-11A-1）。PERT 公式本身不在課綱裡。
  sources: [pert-1959, nasa-ceh, wiki-triangular, math]

figures:
- id: why-compare
  type: compare
  title: 三點估算也救不了低估
  caption: 把 Buehler 等人（1994）研究一的平均預測（最好 27.4、最可能 33.9、最糟 48.6 天）代入兩個公式，再和實際平均比較。這是示意計算，不是原論文做的。原論文的三種問法（最可能、一切最順、一切最糟）和 M、O、P 意思接近，但不完全相同。
  alt: PERT 期望值約 35.3 天、三角分佈平均約 36.6 天，實際平均 55.5 天
  source: buehler
  relation: versus
  items:
  - {term: PERT 期望值, reading: 約 35.3 天, note: (27.4+4×33.9+48.6)÷6}
  - {term: 三角分佈平均, reading: 約 36.6 天, note: (27.4+33.9+48.6)÷3}
  - {term: 實際平均, reading: 55.5 天}
- id: how-flow
  type: flow
  alt: 估算五步驟：用 WBS 拆出工作項目，每項寫三個估計，算出期望值，記錄實際花的時間，對照後修正下次估計
  source: buehler
  steps:
  - {text: 拆出工作項目}
  - {text: 每項寫三個估計}
  - {text: 算出期望值}
  - {text: 記錄實際時間}
  - {text: 對照、修正下次估計}

