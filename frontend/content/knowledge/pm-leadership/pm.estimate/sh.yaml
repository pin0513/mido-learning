idea: 把工作拆到可以估算的大小，叫做 WBS（工作分解結構）。再用樂觀（O）、最可能（M）、悲觀（P）三個值估時間。PERT 期望值 E=(O+4M+P)/6，標準差約 (P−O)/6。另一種三角分佈是 (O+M+P)/3。這樣是承認不確定，而不是假裝有一個準確數字。
guiding_questions:
  - 為什麼人總是低估自己需要的時間？
scenario: 替自主學習計畫建立 WBS，用三點估算算出預期工時，期末再對照實際花費。
