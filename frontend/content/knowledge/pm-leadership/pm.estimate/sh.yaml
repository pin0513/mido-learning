idea: 把工作拆到可以估算的大小，叫做 WBS（工作分解結構）。再替每一項給樂觀（O）、最可能（M）、悲觀（P）三個估計。PERT 的期望值是 E=(O+4M+P)/6，並假設標準差約為 (P−O)/6；如果改用三角分佈，平均是 (O+M+P)/3。三點估算是承認不確定，但不會自動治好低估，還要拿實際花的時間回頭對照。
guiding_questions:
- 為什麼人總是低估自己需要的時間？
- 悲觀估計就一定夠用嗎？
- 最可能的時間，就是平均會花的時間嗎？
scenario: 替彈性學習時間的自主學習計畫建立 WBS，每一項用三點估算算出期望時數；每週記下實際花的時間，期末對照估計，寫下下次要怎麼調整。
goal: 用 WBS 和三點估算排出自主學習計畫，期末用實際紀錄檢討自己的估計。
review: 計畫裡每一項都有 O、M、P 和算出的期望值；期末表格列出「估計／實際／差多少」，並寫出一條下次估計時要改的做法。
