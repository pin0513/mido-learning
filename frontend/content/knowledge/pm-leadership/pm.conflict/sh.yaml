est_time:
  school: 高中生涯規劃或家政課
  source: zonghe
why:
  heading: 衝突可以變成一起解決問題
  body:
  - 108 課綱的生涯規劃要高中生「具備職業道德與工作倫理，以適應未來職涯生活。」補充說明要「培養人際互動與合作共事的能力」；家政學「人際互動倫理。」要「尊重並展現合宜的人際溝通與互動」。一起做事難免意見不合，重要的是怎麼談（本站整理）。
  - 美國聯邦人事管理局（OPM）的爭議處理手冊介紹一種做法：「The process separates the person from the problem, explores all interests to define issues clearly, brainstorms possibilities and opportunities, and uses some mutually agreed upon standard to reach a solution.」也就是把人和問題分開、找出各方真正在乎的事、一起想很多方案，再用大家同意的標準決定（翻譯是本站整理）。手冊說它常用來取代「position-based bargaining」，也就是只比立場的談判。
  qa:
    question: 吵架和協商差在哪裡？
    answer: 吵架是在攻擊人、比誰的立場比較大聲；協商是把人和問題分開，一起找出雙方真正在乎的事，想出兩邊都能接受的方案。手冊說這種做法能「creates effective solutions while improving the relationship between the parties」（說明是本站整理）。
    source: opm-adr
