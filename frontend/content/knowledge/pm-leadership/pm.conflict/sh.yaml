  exercise: 目標：和同學角色扮演一次兩個社團爭場地的協商：寫出雙方的立場和真正的需求，想出至少三個方案，用雙方都同意的標準選出一個。　檢核：老師看協商紀錄：雙方的立場和需求分開寫，需求不只是重複立場；至少有三個方案，選擇的標準寫清楚；學生說得出對方表面上要的和真正需要的差在哪裡，吵架和協商有什麼不同，以及為什麼用標準決定比較公平。
