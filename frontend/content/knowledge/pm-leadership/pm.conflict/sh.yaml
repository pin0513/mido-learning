how:
  heading: 分開人和問題，再找方案
  body:
  - 先分角色、寫立場和需求：兩組各代表一個社團，例如熱舞社和吉他社都想在同一個星期五借活動中心（例子是本站整理）。各自寫下立場，也就是我們要什麼；再問為什麼要：熱舞社要的是有大片鏡子的地板練舞，吉他社要的是成果發表前能試音響。立場是表面上要的東西，需求是背後真正在乎的事；兩個社團的立場互相衝突，需求卻不一定（本站整理）。
  - 協商時先講好規則：一次一個人說，說事情、不說人，例如說我們擔心來不及練，不說你們每次都霸占；聽完要先複述一次對方的需求，確認聽懂了（本站建議）。吵架是在攻擊人、比誰的立場大聲；協商是把人和問題分開，一起解決問題（本站整理）。接著一起想方案，想的時候先不批評，例如熱舞社借星期五、吉他社改到音響已經架好的星期四、兩社各用半個場地、或一起辦聯合發表（例子是本站整理）。
  - 選方案要用雙方都同意的標準，例如誰先登記、誰的活動日期比較近、或輪流使用；手冊說要「uses some mutually agreed upon standard to reach a solution」。先講好標準再決定，結果不會變成誰大聲誰贏，所以比較公平（本站整理）。談不攏時，可以請雙方都信任的老師當中間人；情緒很強時先暫停，冷靜了再談；談完要修復關係，例如兩社一起把決定告訴社員（本站建議）。
  qa:
    question: 對方表面上要的，和他真正需要的，是同一件事嗎？
    answer: 常常不是。表面上要的是立場，例如星期五的活動中心；真正需要的是背後的原因，例如大片鏡子或能試音響。找到需求，就可能有不只一種方案能滿足。手冊說要「explores all interests to define issues clearly」（說明是本站整理）。
    source: opm-adr
  items_title: 四步做
  items:
  - title: 分開立場和需求
    text: 問自己為什麼要。
  - title: 複述對方需求
    text: 確認真的聽懂了。
  - title: 想多個方案
    text: 先不批評，越多越好。
  - title: 用標準決定
    text: 標準要雙方都同意。
  checklist_title: 談完檢查
  checklist:
  - 需求不是立場
  - 至少三個方案
  - 標準雙方同意
  activity_figure: conflict-flow
  sources:
  - opm-adr
  - zonghe
what:
  heading: 談出雙方都接受的方案
  body:
  - 學完後，學生能在意見衝突時把人和問題分開，分辨對方的立場和真正的需求，複述對方的需求，一起想出多個方案，並用雙方同意的標準公平地做決定。
  items_title: 學完能做到
  items:
  - title: 分辨立場和需求
    text: 知道對方真正在乎什麼。
  - title: 想出多個方案
    text: 不只一種解法。
  - title: 用標準決定
    text: 公平，不是誰大聲誰贏。
  checklist_title: 家長檢核
  checklist:
  - 需求寫清楚
  - 有三個方案
  - 標準寫清楚
  notes:
  - 本點融入品德教育議題：議題融入說明手冊高中的實質內涵有「批判反思與理性論辯。」和「問題解決與創新發展。」協商時說理由、一起想新方案，就是在練習。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  sources:
  - issues-handbook
  - genai-student
  - moe-ai-guide
