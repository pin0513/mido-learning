what:
  heading: 看得到誰在做什麼
  body:
  - 學完後，孩子能在任務板上認領任務、每天移動自己的卡片，卡住時在約好的時間前說出來，也會一起幫忙卡住的同學。
  items_title: 學完能做到
  items:
  - title: 認領任務
    text: 卡上寫名字。
  - title: 每天移卡片
    text: 進行中一次一張。
  - title: 卡住早點說
    text: 也幫忙卡住的同學。
  checklist_title: 家長檢核
  checklist:
  - 每張卡有名字
  - 卡片有移動
  - 卡住有說出來
  figures:
  - roles-compare
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - genai-student
