why:
  heading: 說好的事，大家看得到
  body:
  - 108 課綱的綜合活動要高年級「參與各項活動，適切表現自己在團體中的角色，協同合作達成共同目標。」補充說明寫到，要「了解自己在團體中扮演的角色，省思並扮演好自己的角色」。
  - Scrum 指南把承諾寫成團隊的價值：「The Scrum Team commits to achieving its goals and to supporting each other.」說到做到不只是做好自己那張卡，也包括卡住時讓別人幫得上忙（說明是本站整理）。
  qa:
    question: 認領一張卡以後，怎樣才算說到做到？
    answer: 照卡上寫的時間做完，移到完成；做不完時，在約好的時間前先說出來，請大家一起想辦法。Scrum 指南說團隊承諾的是「achieving its goals and to supporting each other」，所以早點說、讓人幫忙，也是說到做到（說明是本站整理）。
    source: scrum-guide
