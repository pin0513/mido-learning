how:
  heading: 一張卡，從待做移到完成
  body:
  - 做一個任務板：Kanban 指南說「The visualization of a DoW is a Kanban board.」DoW 是工作流程的定義，要寫清楚工作從哪裡開始、到哪裡算完成：「A definition for when work items are started and finished within the workflow.」同樂會的任務板分成待做、進行中、完成三欄，卡片就是大事拆成小事那一課拆出來的那一疊（本站整理）。
  - 認領與移動：每人認領卡片，在卡上寫好名字和約好做完的日子，開始做就移到進行中，做完才移到完成。指南說「Any work items between a started point and a finished point are considered work in progress (WIP).」也要控制進行中的數量；本站建議每人同時最多一張在進行中，做完一張再拿下一張。
  - 卡住早點說：指南說「Items in the workflow must be managed actively.」卡片停在進行中好幾天沒動，就是要停下來問的訊號。課綱的補充說明也要在活動中「覺察團隊運作出現的問題，找出原因，提出有效解決的策略，並著手改善。」大家可以幫忙做一部分、把卡再拆小，或換人接手（本站建議）。
  qa:
    question: 如果有人的卡片一直停在「進行中」，我們可以怎麼幫他？
    answer: 先問他卡在哪裡，不要先怪他。Kanban 指南有一個量法叫工作項目的年齡：「The elapsed time between when a work item started and the current date.」卡片停得越久，越要早點一起想辦法：幫忙做一部分、把卡再拆小，或換人接手（說明是本站整理）。
    source: kanban-guide
