  exercise: 目標：為一個校園改善提案寫一頁商業論證：寫出 SMART 目標和不做時的情況，比較兩到三個方案的成本、效益與風險，寫出每個效益的受益者和衡量方式，並寫清楚誰核准、誰負責交付。　檢核：不看本頁，說出商業論證的五個面向各在回答什麼問題、為什麼要拿不做時的情況來比、為什麼做完了卻沒有人受益不算成功，並說出你的提案裡誰核准、誰負責交付、要防哪一種估算偏誤。
