how:
  heading: 一頁論證，五個面向
  body:
  - 先寫為什麼、跟什麼比：一頁論證可以照指引的五個面向排：策略面說為什麼要做，經濟面比哪個方案最值得，商務面看能不能跟供應商談成可行的合約，財務面看付不付得起，管理面看交付得了嗎（本站整理）。目標要寫成指引說的「specific, measurable, achievable, realistic, and time-limited (SMART)」。接著寫不做時的情況：指引說「Practitioners should not assume that the organisation will do nothing under existing arrangements.」不做新提案，原來的做法還是有成本、效益和風險，要拿它當比較的基準；所以不做會怎樣，要寫成現況接下來會怎麼發展，而不是什麼都不變（說明是本站整理）。
  - 再比方案、算效益：列出兩到三個方案，維持現狀也算一個，各寫成本、效益、風險（本站建議）。每個效益都寫指引要的「Beneficiary」「Metric」「Baseline」，也就是誰受益、怎麼衡量、跟維持現狀比（說明是本站整理）。這也回答了做成了卻沒人受益算不算成功：蓋好一座單車棚是產出，停車不再擠、違規停車變少才是效益；沒有人受益，產出再漂亮也不算成功（例子是本站整理）。財務可以用 Watt 書裡的「net present value (NPV), rate of return (ROI), and payback analysis」試算。估算時要防樂觀偏誤：指引說它是「the demonstrated systematic tendency for practitioners to be over-optimistic about key assumptions in appraisal」，成本和時間常比預估多、效益常比預估少，所以要先把估計調保守（說明是本站整理）。
  - 最後寫誰決定、誰負責：治理是讓每個決定都有人負責。指引要記下一位資深負責人（SRO）：「The SRO is accountable for the delivery of the project or programme, and for ensuring that it meets its objectives.」也說「Projects and programmes should be governed by a board.」（說明是本站整理）。在你的提案裡寫清楚：誰核准做不做，例如系上或社區的委員會；誰對交付負責；多久向委員會報告一次。委員會可以要求修改、暫停或否決（本站建議）。AI 可以幫你蒐集資料、試算數字，但值不值得做是人的判斷，做錯了也由核准和負責交付的人承擔（本站整理）。
  qa:
    question: 不做這個案子，情況會怎樣？要拿什麼來比？
    answer: 現況不會停住：指引說「Practitioners should not assume that the organisation will do nothing under existing arrangements.」所以要寫出維持現狀時接下來的成本、效益和風險，拿它當比較每個方案的基準（說明是本站整理）。
    source: hmt-business-case
  items_title: 四步寫
  items:
  - title: 寫目標和現況
    text: 目標要 SMART，現況是比較的基準。
  - title: 列兩到三個方案
    text: 維持現狀也算一個。
  - title: 寫效益和受益者
    text: 每個效益都寫怎麼衡量。
  - title: 寫清楚誰負責
    text: 誰核准、誰交付、多久報告。
  checklist_title: 寫完檢查
  checklist:
  - 有比較基準
  - 效益有受益者
  - 估計調保守
  - 負責人寫清楚
  activity_figure: business-flow
  sources:
  - hmt-business-case
  - watt-ch7
what:
  heading: 用證據說服人投入資源
  body:
  - 學完後，你能寫一頁商業論證：用 SMART 目標和維持現狀當基準，比較方案的成本、效益與風險，寫出受益者和衡量方式，並說清楚誰核准、誰負責交付。
  items_title: 學完能做到
  items:
  - title: 比較方案
    text: 維持現狀也要比。
  - title: 分清產出和效益
    text: 沒人受益不算成功。
  - title: 指定負責人
    text: 每個決定都有人負責。
  checklist_title: 自我檢核
  checklist:
  - 論證一頁寫完
  - 效益可衡量
  - 負責人清楚
  notes:
  - 本頁的校園單車棚例子是本站整理。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - genai-student
