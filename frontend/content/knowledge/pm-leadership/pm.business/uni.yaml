why:
  heading: 先問值不值得做
  body:
  - 專案開始前，要先有人寫清楚為什麼要做。Watt 的教科書說，商業論證是用來「define the problem or opportunity in detail and identify a preferred solution for implementation.」內容包括其他可選的方案，以及效益、成本、風險的分析；接著由專案發起人決定：「It is up to the project sponsor to determine if the project is worth undertaking」（翻譯是本站整理）。
  - 英國財政部的指引把商業論證定義為「The document that provides the information, evidence and options appraisal that a decision maker needs to assess a spending proposal.」也就是給做決定的人看的證據和方案比較。指引要一份論證說明提案「Provides strategic fit」「Provides the best value for money」「Is affordable」，而且「Is set up for successful delivery」（說明是本站整理）。高中資訊科技要學生「能認識專案管理的概念。」也要「能應用運算思維評估解題方法的優劣。」大學再往前一步：用證據說服別人投入資源（本站整理）。
  qa:
    question: 如果這個案子做成了卻沒有人受益，算成功嗎？
    answer: 不算。指引說效益是「the value, or other positive impact, resulting from an outcome, which is perceived as an advantage by one or more stakeholders.」做出了東西卻沒有人得到好處，就沒有效益；所以論證要先寫好受益者和衡量方式（說明是本站整理）。
    source: hmt-business-case
  items_title: 論證要回答的問題
  items:
  - title: 策略面：為什麼要做
    text: 跟組織的目標合不合。
  - title: 經濟面：哪個方案最值得
    text: 跟維持現狀比，效益和成本。
  - title: 商務與財務：談得成、付得起
    text: 跟供應商的合約可行，錢有來源。
  - title: 管理面：交付得了
    text: 誰負責、怎麼管。
  checklist_title: 開始前先確認
  checklist:
  - 選好一個提案
  - 知道利害關係人
  figures:
