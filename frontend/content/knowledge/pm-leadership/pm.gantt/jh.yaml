how:
  heading: 從任務清單到甘特圖
  body:
  - 先列任務、找先後：把合唱比賽要做的事列出來，例如選曲、分部練唱、做服裝、彩排，每件估要幾天、誰負責。再找出先後：選好曲才能開始練唱，要等前一件做完；做服裝和練唱不用互相等，可以同時進行（例子是本站整理）。
  - 畫橫條：橫軸寫日期，一件任務一列，從開始那天畫到結束那天。可以同時做的任務，橫條會上下重疊；要等前一件的，橫條排在前一條的後面。NASA 手冊提醒「In its typical form, the Gantt chart does not show task dependencies」，一般的甘特圖不會畫出誰在等誰，所以要自己用箭頭連起來，一件延誤時才看得出會影響後面哪幾條（本站建議）。
  - 標里程碑：里程碑只有一天，不是一段時間，手冊說「Milestones differ from the bars in a Gantt chart in that they show only a single date」。挑三個一定要完成的關鍵點，例如曲目定案、第一次全班合唱、比賽當天。比賽當天是學校訂的，你們改不了，就是不能延的日期；練唱進度是自己訂的，可以商量調整（本站整理）。之後每週對照實際進度更新一次。
  qa:
    question: 哪些橫條可以同時進行？哪些不行？
    answer: 不用等別人做完的可以同時進行，例如做服裝和練唱；要等前一件做完才能開始的不行，例如選好曲才能練唱。手冊說一般的甘特圖「does not show task dependencies」，所以要自己加箭頭（說明是本站整理）。
    source: nasa-smh
  items_title: 四步做
  items:
  - title: 列任務估天數
    text: 每件寫誰負責、要幾天。
  - title: 找出先後
    text: 哪件要等前一件做完。
  - title: 畫橫條
    text: 從開始畫到結束，加上箭頭。
  - title: 標里程碑
    text: 三個一定要完成的日子。
  checklist_title: 畫完檢查
  checklist:
  - 橫軸是日期
  - 每條有起訖
  - 里程碑只標一天
  activity_figure: gantt-flow
  sources:
  - nasa-smh
  - zonghe
what:
  heading: 看得懂也畫得出甘特圖
  body:
  - 學完後，孩子能替一次班級活動畫出甘特圖，標出三個里程碑，說出哪些任務可以同時做、哪件要等前一件、哪個日期不能延，也會每週對照進度更新。
  items_title: 學完能做到
  items:
  - title: 畫出甘特圖
    text: 橫軸是日期，一件任務一條。
  - title: 分辨能不能同時做
    text: 要等的用箭頭連起來。
  - title: 找出不能延的日期
    text: 別人訂的日期改不了。
  checklist_title: 家長檢核
  checklist:
  - 每條有起訖
  - 有三個里程碑
  - 說得出先後
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  - 本頁的 AI 活動由老師或家長操作，孩子在旁邊一起看、一起檢查 AI 的回答（本站建議）。
  sources:
  - genai-student
