verify_notes:
- 核心素養 A2、A3、C2 保留：依總綱 p.4–6 國民中學教育的 J-A2、J-A3、J-C2 與綜合活動領綱 p.3、p.5 的綜-J-A2、綜-J-A3、綜-J-C2 原文確認（表格窄欄分散對齊，字距大，文字已用頁面影像核對）。
- stage.grades 填 7、8、9：本點的綜合活動代碼都是第四學習階段（IV），綜合活動領綱國中的學習重點沒有再分年級；總綱 p.7 說國民中學七、八、九年級為第四學習階段。
- est_time 依綜合活動領綱 p.2：第四學習階段綜合活動實施領域教學，每週 3 節課；本點建議在綜合活動課上做。
- 頁碼都是頁腳印的頁碼：綜合活動領綱、總綱比 PDF 頁少 4，議題融入說明手冊少 16，NASA 排程手冊少 1，NASA 風險手冊少 20；會議規範沒有印頁碼，用 PDF 頁並註明條次。
- 原 curriculum_108.domains 的數學、科技刪除：本點的計畫與時間管理對應綜合活動 2c-IV-1、家 Ca-IV-1、童 Cb-IV-2，沒有對應的數學或科技代碼（畫甘特圖用試算表或方格紙都可以）；link_notes 仍保留數學、科技當跨科提示，related 的 ma.coord@jh、it.datatable@jh 不變。
- 原 idea「把任務畫成橫條放在時間軸上，用里程碑標出『這天一定要完成』的關鍵點。」的引號拿掉：那是本站整理的說法，不是引文。
- 原 scenario「用試算表替班際合唱比賽畫甘特圖，標出 3 個里程碑。」的 3 改成三，並補上方格紙也可以（本站建議）。
- 原 ai.delegable「由任務清單自動產生甘特圖」補上由老師或家長操作（本站建議），並在 What 加上教育部注意事項（學生版）的使用規則。
- 甘特圖、里程碑與控制里程碑的說法依 NASA Schedule Management Handbook；手冊的 P/p 是 program/project（計畫或專案）。英文短句引用，中文說明是本站整理；合唱比賽的任務與先後是本站整理的例子。
