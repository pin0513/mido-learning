est_time:
  school: 國中七至九年級綜合活動課
  source: zonghe
why:
  heading: 一張圖看懂誰在什麼時候做什麼
  body:
  - 108 課綱的綜合活動要國中生「善用各項資源，妥善計畫與執行個人生活中重要事務。」家政要學「個人與家庭生活的金錢及時間管理。」童軍露營也要「透過團隊編組與分工，擬定露營計畫，設計露營流程」。活動的任務一多，就需要一張大家都看得懂的時間表。
  - NASA 的排程手冊說甘特圖是「a Gantt chart, or horizontal bar chart」：橫軸是時間，每件工作是一條橫條，橫條從開始畫到結束；「Key milestones are typically represented by diamonds (or triangles).」里程碑通常畫成菱形或三角形（翻譯是本站整理）。
  qa:
    question: 哪個日期是真正不能延的？為什麼？
    answer: 由別人訂下、你們改不了的日期，例如學校訂的比賽當天；你們自己訂的練唱進度還可以商量。NASA 手冊把這種日期叫控制里程碑：「Control milestones are typically milestones owned by the sponsors or the stakeholders and cannot be changed by the P/p.」（P/p 是計畫或專案；說明是本站整理）
    source: nasa-smh
  items_title: 綜合活動領綱的學習重點
  items:
  - title: 妥善計畫重要事務
    text: 綜合活動 2c-IV-1：善用各項資源，妥善計畫與執行個人生活中重要事務。
    code: 2c-IV-1
  - title: 時間管理
    text: 綜合活動 家 Ca-IV-1：個人與家庭生活的金錢及時間管理。
    code: 家 Ca-IV-1
  - title: 露營的計畫與分工
    text: 綜合活動 童 Cb-IV-2：露營活動組織分工、計畫、執行、檢討與反思。
    code: 童 Cb-IV-2
  checklist_title: 開始前先確認
  checklist:
  - 任務已經列好
  - 知道比賽日期
  figures:
  - gantt-compare
  notes:
  - 綜合活動的代碼：數字開頭的是學習表現；開頭是家、童、輔的是學習內容，分別是家政、童軍、輔導；中間的 IV 是第四學習階段（國中七至九年級）。
  - 總綱把國民中學七、八、九年級定為第四學習階段，所以本頁代碼中間都是 IV。
