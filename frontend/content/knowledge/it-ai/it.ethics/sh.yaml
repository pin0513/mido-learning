idea: AI 會影響公平、隱私、工作與民主。評估一個 AI 應用時要問：誰受益、誰受害、誰負責、出錯時誰能申訴（本站整理）。
guiding_questions:
- 如果 AI 的判斷比老師更一致，但更難解釋，你會選誰？
scenario: 辯論：學校該不該用 AI 批改作文？分成正方、反方和受影響者角色（學生、老師、家長），用四個問題整理論點，最後提出折衷方案和使用規範；討論只用虛構的案例，不拿同學真實的作文或成績（本站建議）。
