why:
  heading: AI 下判斷，誰來負責
  body:
  - 科技領綱高中學「資訊科技對人與社會的影響與衝擊。」，學習表現要「能使用多元的觀點思辨資訊科技相關議題。」；議題融入說明手冊的品德教育，高中的實質內涵有「品U7批判反思與理性論辯。」
  - 教育部的指引說，學校導入自動化評量時，要「保留教師專業裁量與學生選擇空間，避免形成對演算法的過度依賴」。
  - 教育部《未來人才AI能力圖像》高中階段也要學生「能覺察資料或演算法中隱含的社會刻板印象」。
  items_title: 科技領綱的學習重點
  items:
  - title: 多元觀點思辨
    text: 高中科技領綱 運 a-V-2：能使用多元的觀點思辨資訊科技相關議題。
    code: 運 a-V-2
  - title: 對人與社會的影響
    text: 高中科技領綱 資 H-V-3：資訊科技對人與社會的影響與衝擊。
    code: 資 H-V-3
  checklist_title: 開始前先確認
  checklist:
  - 聽過 AI 批改
  - 會整理論點
  notes:
  - 代碼開頭的「資」是科技領綱的資訊科技學習內容，「運」是運算思維的學習表現；中間的 V 是第五學習階段（高中），本頁只列高中必修的條目，不含標「※」的加深加廣選修。
  sources:
  - tech108
  - issues-handbook
  - moe-ai-guide
  - moe-ai-portrait
how:
  heading: 先問四個問題，再辯論
  body:
  - 先分角色：正方、反方，以及學生、老師、家長等受影響者。每個角色用四個問題整理論點：誰受益、誰受害、誰負責、誰能申訴（本站整理）。教育部的指引提醒，演算法可能對某些學生「產生不公平結果」，有偏見的輸出不能直接用於「分組、評分或標籤學生」。
  - 辯論時每個論點都要說出根據；Google 的機器學習課程也說，機器學習模型「are not inherently objective.」辯論時先聽完對方再回應，針對論點、不針對人（本站建議）。最後全班一起寫折衷規範，例如 AI 只給初步建議、老師做最後判斷、學生可以申訴（本站建議）。
  qa:
    question: 如果 AI 的判斷比老師更一致，但更難解釋，你會選誰？
    answer: 不一定選 AI。一致不等於公平：訓練資料有偏誤時，AI 會一致地犯同樣的錯；難以解釋，學生也很難申訴（本站整理）。教育部的指引說，學校要「確保教學決策、評量判斷與學生學習歷程的關鍵環節仍由專業教育人員掌握」。
    source: moe-ai-guide
  items_title: 辯論四步
  items:
  - title: 分角色
    text: 正反方和受影響者。
  - title: 問四個問題
    text: 受益、受害、負責、申訴。
  - title: 有根據地辯
    text: 論點要說出根據。
  - title: 寫折衷規範
    text: 人做最後決定，可申訴。
  checklist_title: 每次做完勾一下
  checklist:
  - 四問都回答
  - 論點有根據
  - 規範寫完成
  activity_figure: ethics-flow
  sources:
  - moe-ai-guide
  - mlcc-bias
what:
  heading: 會思辨，也會訂規範
  body:
  - 學完後，學生能用誰受益、誰受害、誰負責、誰能申訴四個問題分析一個 AI 應用，在辯論中提出有根據的論點，並提出由人做最後決定、可以申訴的使用規範。
  items_title: 學完能做到
  items:
  - title: 四個問題
    text: 分析一個 AI 應用。
  - title: 有根據
    text: 論點說得出根據。
  - title: 訂規範
    text: 人做最後決定、可申訴。
  checklist_title: 家長檢核
  checklist:
  - 四問有答
  - 論點有據
  - 規範可行
  figures:
  - ethics-compare
  notes:
  - 本頁的辯論案例是虛構的。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  sources:
  - moe-ai-guide
  - genai-student
