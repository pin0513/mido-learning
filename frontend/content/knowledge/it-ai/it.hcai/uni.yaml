verify_notes:
- 原有待核對「108 課綱科技領域在生成式 AI 普及前公布，涉及生成式 AI 的內容屬延伸。國中資訊科技主題名稱與高中加深加廣選修名稱，上線前請以教育部科技領域課綱核對。」已處理：大學不屬於 108 課綱，本點不填 curriculum_108、不列年級、item 不放代碼；高中資訊科技必修的相關學習重點（資 H-V-3、運 a-V-2）只在 tech108 來源逐字引用（含頁碼，頁碼是頁腳印的頁碼，比 PDF 頁少 4），當作先學過的內容，不引用高中加深加廣選修；主要依據改用大學教科書和官方文件。生成式 AI 的使用規則依教育部注意事項（學生版）中大學生也適用的原則（本站建議）；教育部《高級中等以下學校人工智慧使用和學習指引》的適用對象是高級中等以下學校，本點不引用。
- 原有待核對「UNESCO 2024 學生與教師 AI 素養框架的面向名稱與進階層次待核對。」已處理：本點不引用 UNESCO 框架，人機協作的設計原則改依可查證原文的來源（見 sources）。
- 英文網頁的引文取自 2026-10-29 讀取的網頁；只取不含彎引號或數學式的句子或片段，省略處用刪節號。
- NIST AI 100-1 的頁碼是頁腳印的「Page N」（PDF 頁 − 5）；引文避開 PDF 換行斷字（例如 oper- ation）的地方。
- Lee 等人 2025 年論文的 PDF 沒有印頁碼，頁碼是 PDF 頁；這是 319 位知識工作者的自陳問卷研究，結果是相關，不是因果。
- 原 scenario「觀察一位家人或同學用 AI 完成一件事，找出困難與風險，重新設計流程並測試。」改成大學生觀察同學：先徵得同意，只記錄步驟和困難，不記錄姓名、學號或對話裡的個人資料；刪除家人。
- 原 ai.delegable「協助整理觀察紀錄與方案」保留，加上紀錄先去除個人資料（本站建議）。
