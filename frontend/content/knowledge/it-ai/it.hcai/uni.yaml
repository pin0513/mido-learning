why:
  heading: 讓人更有能力
  body:
  - PAIR 的人與 AI 指南把 AI 的角色分成自動化和輔助兩種，並建議「Augment tasks that people enjoy doing, that carry social capital」…。要問的不只是能不能用 AI，而是用了之後人得到什麼。
  - 卡內基美隆大學和微軟研究院的研究者 2025 年調查 319 位知識工作者，發現「higher confidence in GenAI is associated with less critical thinking, while higher self-confidence is associated with more critical thinking.」這是自陳問卷，只能說兩者相關，但提醒設計者：工具要讓人保持判斷。高中學過資訊科技對人與社會的影響，大學要把它變成設計。
  items_title: 三個關鍵詞
  items:
  - title: 自動化
    text: 交給 AI 做完。
  - title: 輔助
    text: AI 幫忙，人做決定。
  - title: 校準信任
    text: 知道何時信、何時查。
  checklist_title: 開始前先確認
  checklist:
  - 用過生成式 AI
  - 會寫觀察紀錄
  sources:
  - pair-needs
  - lee-chi25
  - tech108
how:
  heading: 觀察、找風險、重新設計
  body:
  - 觀察：先徵得同學同意，說明只記錄步驟和困難，不記姓名、學號或對話裡的個人資料。設計方法教科書介紹的可用性測試是「In a usability test, you define some common tasks to perform with your user interface」，也建議「ask your participants to think aloud」。請同學邊做邊說，看他怎麼下指令、有沒有檢查 AI 的回答、在哪裡卡住，觀察時不插手（本站建議）。
  - 找風險：PAIR 說使用者應該「know when to trust the system」，也知道什麼時候「apply their own judgement」。Lee 等人也發現，生成式 AI 讓批判思考轉向「information verification, response integration, and task stewardship」。對照紀錄，標出他直接採信、沒有查證的地方。
  - 重新設計與測試：改流程讓人多做一步判斷，例如先自己寫出答案大綱再問 AI、AI 回答後列出要查證的兩件事。NIST 說人和 AI 的分工可以「span from fully autonomous to fully manual」。請同學用新流程再做一次，比較查證的次數和他的感受（數字是示意，本站整理）。
  qa:
    question: 用了 AI 之後，你變得更會思考，還是更少思考？
    answer: 看你怎麼用。Lee 等人的調查發現「higher confidence in GenAI is associated with less critical thinking」，對自己越有信心的人想得越多。這是問卷調查，只能說兩者相關，不能說誰造成誰；但先自己想、再用 AI、最後查證，至少讓判斷留在自己手上（說明是本站整理，做法是本站建議）。
    source: lee-chi25
  items_title: 四步做
  items:
  - title: 徵得同意
    text: 只記步驟，不記個資。
  - title: 觀察使用
    text: 看下指令和查證。
  - title: 標出風險
    text: 直接採信的地方。
  - title: 改流程再試
    text: 比較前後差異。
  checklist_title: 每次做完勾一下
  checklist:
  - 已徵得同意
  - 紀錄無個資
  - 標出風險
  - 試用新流程
  activity_figure: hcai-flow
  sources:
  - dm-empirical
  - pair-trust
  - lee-chi25
  - nist-ai-rmf
what:
  heading: 設計讓人保持判斷
  body:
  - 學完後，自己能觀察真實的使用過程，分辨自動化和輔助，找出過度依賴的地方，並設計讓人保持判斷的流程。
  - 設計也要讓人能改正 AI。PAIR 說：「When users have the opportunity to offer feedback, they can play a direct role in personalizing their experiences and maximizing the benefit your product brings to them.」
  items_title: 學完能做到
  items:
  - title: 分辨角色
    text: 自動化還是輔助。
  - title: 找出依賴
    text: 直接採信的步驟。
  - title: 改善流程
    text: 讓人多做一步判斷。
  checklist_title: 自我檢核
  checklist:
  - 觀察完成
  - 風險標出
  - 新流程試過
  figures:
  - hcai-compare
  notes:
  - 本頁的觀察例子和數字是示意。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，程式、數字和引用的資料要自己驗證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - pair-feedback
  - genai-student
