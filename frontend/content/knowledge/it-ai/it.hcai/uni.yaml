idea: 好的 AI 工具讓人變得更有能力，而不是更依賴。設計時從人的需求、能力與價值出發：哪些事交給 AI、哪些留給人，人什麼時候該信它、什麼時候該自己判斷。
guiding_questions:
- 用了 AI 之後，你變得更會思考，還是更少思考？
- 哪些事該讓 AI 做，哪些該留給人？
scenario: 徵得一位同學同意後，觀察他用 AI 完成一件課業任務，只記錄步驟和遇到的困難，不記錄姓名和個人資料；找出困難與風險，重新設計流程並請他試用（本站整理）。
