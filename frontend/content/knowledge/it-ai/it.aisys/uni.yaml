idea: 把 AI 放進產品，要定義成功標準、建立評估方法、設計人工審核點，並準備好出錯時怎麼辦。
guiding_questions:
- AI 助教答錯一題，影響有多大？怎麼及早發現？
- 準確率高，就可以上線嗎？
scenario: 為一門大學課程設計 AI 助教：定義它能做與不能做的事，用自己寫、不含學生個資的題組評估它，並訂出何時轉給真人老師（本站整理）。
