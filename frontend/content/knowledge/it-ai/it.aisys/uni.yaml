why:
  heading: 上線前先想清楚
  body:
  - PAIR 的人與 AI 指南說：「When AI makes an error or fails, things can get complicated.」它也提醒要依情境估計出錯的風險：使用者是新手、系統信心低、結果牽涉健康或安全時，風險較高（說明是本站整理）。
  - NIST 的 AI 風險管理框架要求評估要接近實際使用：「AI system performance or assurance criteria are measured qualitatively or quantitatively and demonstrated for conditions similar to deployment setting(s).」也要事先規劃人的監督：「Processes for human oversight are defined, assessed, and documented」。高中學過機器學習的基本概念和評估解題方法的優劣，大學把評估變成上線前的必要工作。
  items_title: 三件事先定
  items:
  - title: 成功標準
    text: 答對什麼才算有用。
  - title: 評估方法
    text: 用題組量出表現。
  - title: 人工審核點
    text: 什麼情況交給真人。
  checklist_title: 開始前先確認
  checklist:
  - 會算比例
  - 分得清訓練與測試
  sources:
  - pair-errors
  - nist-ai-rmf
  - tech108
how:
  heading: 定界線、做題組、算指標
  body:
  - 定界線：列出 AI 助教能做的（例如解釋課本概念、出練習題）和不能做的（例如判定成績、回答考試題目、處理個人問題），寫在介面上讓學生看得到。PAIR 建議「Help users calibrate their trust」，讓使用者「know when to trust the system」，什麼時候該自己判斷（說明是本站整理）。
  - 做題組：自己寫 20 題課程問題和標準答案，不放任何真實學生的資料；分成調整用和最後評估用兩份，最後那份只在定稿時用。MLCC 建議把資料分成「training, validation, and test sets」。AI 助教用學校或課程核可的工具（本站建議）。每題先標好該不該轉人工，再讓 AI 助教作答，記下它答對、答錯，以及它有沒有轉人工（數字是示意，本站整理）。
  - 算指標：MLCC 說哪個指標最有意義，要看「the cost of different misclassifications, and whether the dataset is balanced or imbalanced」。三個指標都用轉不轉人工的判斷來算，把該轉人工的題目當成正類：準確率看全部題目裡，轉或不轉判斷對的有多少；精確率看它說要轉的有多少真的該轉；召回率看該轉的有多少被它抓到（說明是本站整理）。答錯會誤導學生的題目，召回率要優先（本站建議）。
  qa:
    question: AI 助教答錯一題，影響有多大？怎麼及早發現？
    answer: 要看答錯什麼：練習題的提示答錯，學生還能查證；考試規定或作業截止日答錯，影響就大。及早發現靠三件事：上線前用題組評估、上線後讓學生能回報錯誤、定期抽查紀錄。NIST 也要求建立讓使用者「report problems and appeal system outcomes」的回饋管道（說明是本站整理）。
    source: nist-ai-rmf
  items_title: 四步做
  items:
  - title: 寫能做與不能做
    text: 放在介面上讓人看到。
  - title: 做評估題組
    text: 調整用和評估用分開。
  - title: 算三個指標
    text: 準確率、精確率、召回率。
  - title: 訂轉人工規則
    text: 低信心或敏感問題就轉。
  checklist_title: 每次做完勾一下
  checklist:
  - 清單寫好
  - 題組無個資
  - 算出三指標
  - 規則寫清楚
  activity_figure: aisys-flow
  sources:
  - pair-trust
  - mlcc-split
  - mlcc-acc
what:
  heading: 評得出，也接得住
  body:
  - 學完後，自己能為一個 AI 功能訂出成功標準、做評估題組、依錯誤代價選指標，並設計轉給真人的規則。
  - 上線後也要能停：NIST 要求有機制「to supersede, disengage, or deactivate AI systems that demonstrate performance or outcomes inconsistent with intended use」。PAIR 也建議出錯時「Address mistakes with humanity and humility」，說明系統的限制，讓人能繼續往下做。準確率高也不代表可以放心上線，教科書提醒：「Sometimes models appear to perform marvelously as measured by test set accuracy but fail catastrophically in deployment when the distribution of data suddenly shifts.」學期中課程內容改了，就要用新題組再評一次（本站建議）。
  items_title: 學完能做到
  items:
  - title: 訂標準
    text: 說得出什麼算成功。
  - title: 選指標
    text: 依錯誤代價選。
  - title: 設轉人工
    text: 知道何時交給人。
  checklist_title: 自我檢核
  checklist:
  - 標準寫清楚
  - 指標選得對
  - 轉人工會啟動
  figures:
  - aisys-compare
  notes:
  - 本頁的題數和例子是示意。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，程式、數字和引用的資料要自己驗證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - nist-ai-rmf
  - pair-errors
  - d2l-shift
  - genai-student
