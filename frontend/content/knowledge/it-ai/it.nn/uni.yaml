why:
  heading: 一層層的簡單計算
  body:
  - Google 的機器學習速成課這樣定義隱藏層：「additional layers between the input layer and the output layer are called hidden layers」；隱藏層每個神經元的值，算法和線性模型的輸出一樣。但只疊線性計算沒有用：「Linear operations performed on linear operations are still linear.」所以每層要再經過非線性的激活函數。
  - 加上非線性之後，「Stacking nonlinearities on nonlinearities lets us model very complicated relationships between the inputs and the predicted outputs.」高中學過機器學習的基本概念和文字式程式設計，大學把它們接起來：自己寫出一個多層網路並訓練它。
  items_title: 三個零件
  items:
  - title: 隱藏層
    text: 輸入和輸出之間的層，先做線性計算。
  - title: 激活函數
    text: 加上非線性，才學得到複雜關係。
  - title: 反向傳播
    text: 算出每個權重該往哪裡調。
  checklist_title: 開始前先確認
  checklist:
  - 會算導數
  - 會寫迴圈
  sources:
  - mlcc-nodes
  - mlcc-act
  - tech108
how:
  heading: 先手算，再訓練
  body:
  - 手算梯度下降：教科書用 f(x) ＝ x² 示範，x 從 10 開始，每步減掉學習率 η 乘上導數 2x，也就是每步乘上 (1 − 2η)。在試算表算 10 步：η ＝ 0.2 時 x 約 0.060466；η ＝ 0.05 時只到約 3.486784；η ＝ 1.1 時每步乘 −1.2，x 正負跳動、越跳越遠，約 61.917364（數字是示意，本站整理）。書上說「If we use a learning rate that is too small, it will cause」…「to update very slowly, requiring more iterations to get a better solution」，太大則「the optimization problem might diverge due to an overly large learning rate」。
  - 訓練網路：照教科書的從零實作，建一個「MLP with one hidden layer and 256 hidden units」，學習率 0.1，資料是教科書用的 Fashion-MNIST 衣物圖片（「784 input features and 10 classes」）。不用手寫數字的 MNIST，是因為教科書說「Today, MNIST serves as more of a sanity check than as a benchmark.」反向傳播負責算梯度：「It makes gradient descent feasible for multi-layer neural networks.」再把學習率改小、改大各訓練一次，畫出損失曲線比較（設定是示意，本站整理）。
  - 讀曲線：MLCC 說學習率太低時「the model can take a long time to converge」，太高時「the model never converges, but instead bounces around the weights and bias that minimize the loss」。損失降得很慢就調大，忽上忽下或變成很大的數就調小；學習率是自己設定的超參數，權重是訓練算出的參數。每次訓練都記下學習率、訓練輪數、最後的損失和測試準確率，比較時才知道差別從哪來（說明是本站整理）。
  qa:
    question: 學習率太大或太小，訓練會怎樣？
    answer: 太小時每步只動一點點，要很多步才接近最低點；太大時會跨過最低點來回跳，甚至越跳越遠。MLCC 的說法是學習率太高時「the model never converges」（說明是本站整理）。
    source: mlcc-lr
  items_title: 四步做
  items:
  - title: 手算梯度下降
    text: 試算表算三種學習率各 10 步。
  - title: 建一層隱藏層
    text: 照教科書的從零實作。
  - title: 換學習率訓練
    text: 改小、改大各試一次。
  - title: 比較損失曲線
    text: 說出太慢、剛好、震盪。
  checklist_title: 每次做完勾一下
  checklist:
  - 算出三種結果
  - 網路跑得起來
  - 畫出損失曲線
  - 說出調整理由
  activity_figure: nn-flow
  sources:
  - d2l-gd
  - d2l-mlpimpl
  - d2l-data
  - mlcc-bp
  - mlcc-lr
what:
  heading: 會訓練，也知道限度
  body:
  - 學完後，自己能手算梯度下降、說明學習率的影響，能訓練一個一層隱藏層的網路並讀懂損失曲線。
  - 但會訓練不代表看得懂模型在想什麼。NIST 的 AI 風險管理框架說，難以理解可能來自「the opaque nature of AI systems」，而「Explainable systems can be debugged and monitored more easily」。所以要記錄資料、設定和測試結果，不把準確率當成理解。
  qa:
    question: 模型「學會」了，我們能知道它是怎麼想的嗎？
    answer: 只能知道一部分。每個權重的數值都看得到，卻很難直接讀出它為什麼這樣判斷；NIST 把這種情形說成「the opaque nature of AI systems」。實際的做法是記錄資料與設定、用沒看過的測試資料檢查，並看它在哪些例子出錯（說明是本站整理）。
    source: nist-ai-rmf
  items_title: 學完能做到
  items:
  - title: 說明學習率
    text: 太小慢，太大震盪或發散。
  - title: 訓練小網路
    text: 一層隱藏層，讀懂損失曲線。
  - title: 說出限度
    text: 準確率高不等於看得懂。
  checklist_title: 自我檢核
  checklist:
  - 三種結果算對
  - 說出非線性
  - 說出限度
  figures:
  - nn-compare
  notes:
  - 本頁的數字和訓練設定是示意。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，程式、數字和引用的資料要自己驗證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - nist-ai-rmf
  - genai-student
