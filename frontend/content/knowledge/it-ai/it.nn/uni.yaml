idea: 神經網路由許多簡單單元層層組成：每個隱藏層先做線性計算，再經過非線性的激活函數；訓練時用反向傳播算出梯度，再用梯度下降調整權重。學習率太小學得慢，太大會來回震盪甚至發散。
guiding_questions:
- 模型「學會」了，我們能知道它是怎麼想的嗎？
- 學習率太大或太小，訓練會怎樣？
scenario: 先用試算表算 f(x) ＝ x² 的梯度下降，比較三種學習率；再照教科書的從零實作，訓練一層隱藏層的神經網路辨識衣物圖片，觀察學習率太大或太小時損失怎麼變（數字是示意，本站整理）。
formats:
