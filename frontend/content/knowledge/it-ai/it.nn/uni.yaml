  exercise: 目標：用試算表算出三種學習率下梯度下降 10 步的結果，說明學習率太小、剛好、太大各會怎樣，訓練一個一層隱藏層的網路並讀懂損失曲線（數字是示意）。　檢核：不看本頁，自己算出 x 從 10 開始、學習率 0.2 時每步乘 0.6，說出學習率 1.1 為什麼會發散，並用一句話說明為什麼隱藏層要有非線性的激活函數；三件事都對（數字是示意）。
