verify_notes:
- 原有待核對「108 課綱科技領域在生成式 AI 普及前公布，涉及生成式 AI 的內容屬延伸。國中資訊科技主題名稱與高中加深加廣選修名稱，上線前請以教育部科技領域課綱核對。」已處理：大學不屬於 108 課綱，本點不填 curriculum_108、不列年級、item 不放代碼；高中資訊科技必修的相關學習重點（資 D-V-2、資 P-V-1）只在 tech108 來源逐字引用（含頁碼，頁碼是頁腳印的頁碼，比 PDF 頁少 4），當作先學過的內容，不引用高中加深加廣選修；主要依據改用大學教科書和官方文件。生成式 AI 的使用規則依教育部注意事項（學生版）中大學生也適用的原則（本站建議）；教育部《高級中等以下學校人工智慧使用和學習指引》的適用對象是高級中等以下學校，本點不引用。
- 英文網頁的引文取自 2026-10-29 讀取的網頁；只取不含彎引號或數學式的句子或片段，省略處用刪節號。
- NIST AI 100-1 的頁碼是頁腳印的「Page N」（PDF 頁 − 5）；引文避開 PDF 換行斷字（例如 oper- ation）的地方。
- 原 scenario「從零寫一個小型神經網路辨識手寫數字，觀察學習率太大或太小時會怎樣。」改成先用試算表手算 f(x) ＝ x² 的梯度下降，再照 d2l 5.2 的從零實作訓練一層隱藏層、256 個隱藏單元的網路；資料用教科書用的 Fashion-MNIST 衣物圖片（784 個輸入特徵、10 類），手寫數字的 MNIST 也可以換用，教科書說它現在多半只當基本檢查。
- d2l 12.3 的例子：f(x) ＝ x²、x 從 10 開始、走 10 步，每步 x ← (1 − 2η)x；η ＝ 0.2 得 10 × 0.6¹⁰ ≈ 0.060466（書上印出的值相同），η ＝ 0.05 得 10 × 0.9¹⁰ ≈ 3.486784，η ＝ 1.1 得 10 × (−1.2)¹⁰ ≈ 61.917364，都已驗算。
- 原 ai.delegable「提供框架、加速訓練」保留，加上先自己算一次再用框架（本站建議）。
