idea: 電腦裡的文字、圖片、聲音，最後都變成 0 和 1。一張圖片就是很多小方格（像素）。
guiding_questions:
  - 格子越多，圖片會怎麼樣？檔案會怎麼樣？
scenario: 在方格紙上用「塗黑＝1、空白＝0」畫像素畫，把數字唸給同學聽，看他能不能畫出一樣的圖。
