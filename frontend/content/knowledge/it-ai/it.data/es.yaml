  exercise: 目標：在 8 × 8 的方格紙上畫一張黑白像素畫（大小是示意），用 1 代表白、0 代表黑把每一行寫成數字，讓家長只看數字畫出同樣的圖。　檢核：家長只看孩子寫的數字畫圖：兩張圖一樣；孩子說得出 1 和 0 各代表什麼；也說得出格子變多時，要寫的數字會變多（本站整理）；三件事都做到。
