est_time:
  school: 國小五、六年級（議題融入）
  source: es-ref
why:
  heading: 圖片也能變成數字
  body:
  - 國家教育研究院的參考說明，三、四年級先認識「文字、圖片、影像、聲音數位檔案的種類、儲存裝置及其儲存方法。」，五、六年級再學「常見的數位資料類型與儲存架構。」；國中科技領綱接著學「二進位資料表示法。」
  - CS Unplugged 說，二進位只用兩個數字「with just two digits (usually written as 0 and 1)」，而且這些位元「are used to store text, numbers, images, video, and anything else that we need to store or transmit.」
  items_title: 國中會接著學
  items:
  - title: 數位資料的表示
    text: 科技領綱 資 D-IV-2：數位資料的表示方法。
    code: 資 D-IV-2
  checklist_title: 開始前先確認
  checklist:
  - 會數到八
  - 會塗方格
  notes:
  - 國小沒有部定的資訊科技課程，資訊教育是融入各領域實施的議題；國小的學習重點出自國家教育研究院的參考說明，只寫在來源裡。本頁列的代碼開頭的「資」是科技領綱（國中、高中）的資訊科技學習內容，中間的 IV 是第四學習階段（國中）、V 是第五學習階段（高中），代表之後會接著學。
  sources:
  - es-ref
  - cs-binary-about
  - tech108
  - zonggang
how:
  heading: 畫像素畫，寫成數字
  body:
  - CS Unplugged 說，螢幕上的小方格「We call these squares picture elements, or pixels.」在方格紙上畫一張黑白像素畫，照 CS Unplugged 的規則「If a 1 indicates a white square and a 0 indicates a black square」，把每一行寫成一串 0 和 1。
  - 把數字唸給家長，家長只看數字在另一張方格紙上塗黑，最後比一比兩張圖。再交換：家長寫一串數字，孩子只看數字畫回圖。再想一想：方格變成兩倍寬、兩倍高，要寫的數字變成幾倍？答案是 4 倍（本站整理）。
  qa:
    question: 格子越多，圖片會怎麼樣？檔案會怎麼樣？
    answer: 格子越多，圖片越細緻，但要記的數字也越多，檔案就越大（本站整理）。CS Unplugged 說，每一格只有黑或白的圖片「is much simpler to represent using digits than a full length, colour, and high-definition film is!」
    source: cs-image-about
  items_title: 像素畫四步
  items:
  - title: 畫像素畫
    text: 在方格紙上塗黑白。
  - title: 寫成數字
    text: 白寫 1、黑寫 0。
  - title: 唸給家長
    text: 家長只看數字畫圖。
  - title: 比一比
    text: 看兩張圖一不一樣，再交換。
  checklist_title: 每次做完勾一下
  checklist:
  - 數字寫完整
  - 兩張圖一樣
  - 說得出規則
  activity_figure: data-flow
  sources:
  - cs-colour
  - cs-image-about
what:
  heading: 看得懂 0 和 1 的圖
  body:
  - 學完後，孩子能把一張黑白像素畫寫成 0 和 1，也能把一串 0 和 1 畫回圖片，並說出格子越多、要存的數字越多。
  items_title: 學完能做到
  items:
  - title: 編碼
    text: 把圖寫成 0 和 1。
  - title: 解碼
    text: 把數字畫回圖。
  - title: 說出取捨
    text: 格子多，圖細、數字也多。
  checklist_title: 家長檢核
  checklist:
  - 編碼正確
  - 解碼正確
  - 說得出取捨
  figures:
  - data-compare
  notes:
  - 本頁的方格大小是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - cs-colour
  - genai-student
