idea: 變數記住資料、迴圈重複工作、函式把常用的步驟包起來重複使用。寫程式就是把想法變成可以執行的步驟。
guiding_questions:
  - 為什麼程式「看起來對」卻跑出錯的結果？
scenario: 寫一個「班級零用錢記帳」小程式，或一個猜數字遊戲，並請同學試玩找 bug。
