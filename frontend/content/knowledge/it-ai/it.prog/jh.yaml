what:
  heading: 會用變數、迴圈和函式
  body:
  - 學完後，孩子能用變數記住資料、用迴圈重複步驟、把常用的步驟包成函式，寫出一個能玩的小遊戲，並找到、修好 bug。
  items_title: 學完能做到
  items:
  - title: 變數
    text: 記住答案和次數。
  - title: 迴圈
    text: 重複到猜中為止。
  - title: 函式
    text: 把回答步驟包起來。
  checklist_title: 家長檢核
  checklist:
  - 遊戲玩得完
  - 說得出變數
  - 說得出函式
  figures:
  - prog-compare
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - tech108
  - genai-student
