  exercise: 目標：寫一個猜數字小遊戲：用變數記住答案和次數、用迴圈重複猜、用函式回答太大或太小；請家人試玩，找到並修好至少一個 bug（數字是示意）。　檢核：遊戲能從頭玩到猜中；說得出每個變數記什麼、迴圈什麼時候停、函式做什麼；修好了家人找到的 bug；三件事都做到。
