verify_notes:
- 原有待核對「108 課綱科技領域在生成式 AI 普及前公布，涉及生成式 AI 的內容屬延伸。國中資訊科技主題名稱與高中加深加廣選修名稱，上線前請以教育部科技領域課綱核對。」已處理：本點的代碼與文字逐條對照科技領域課綱（教育部 107 年 9 月 20 日發布）原文，頁碼是頁腳印的頁碼（比 PDF 頁少 4）；本點不引用高中加深加廣選修。涉及 AI 的內容另依教育部《未來人才AI能力圖像》（115 年）與注意事項（學生版），不寫成課綱內容。
- 運算思維學習表現（運 t-IV-3）的代碼開頭是中文字加小寫字母，schema 的 curriculum_108.performances 只收數字開頭的代碼，所以只在項目的 code 引用（已加進代碼表），curriculum_108 只列資訊科技學習內容。
- 核心素養依科技領綱 p.3–4 的 科-J-A2、科-J-B1 原文挑選（表格窄欄，文字已用頁面影像核對）。
- stage.grades 依科技領綱 p.10–11 表格所列的年級：資 P-IV-1、資 P-IV-2 七年級，資 P-IV-4 八年級。
- 原 scenario「寫一個『班級零用錢記帳』小程式，或一個猜數字遊戲，並請同學試玩找 bug。」改成只做猜數字遊戲、請家人試玩（本站建議）。
- 原稿的核心素養 B2 改成 B1：本點重在用程式符號表達解題步驟，對應科-J-B1。
- 次數從 0 開始寫成從 1 開始的 bug 是本站整理的示意例子。
