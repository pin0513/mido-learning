how:
  heading: 寫遊戲，請家人試玩
  body:
  - 先在紙上寫出步驟：電腦想一個數、玩家猜、回答太大或太小、猜中就結束。再用程式工具做出來：一個變數記住電腦想的數，另一個變數記次數，每猜一次加 1；重複執行直到猜中；把回答太大或太小的積木包成一個自訂積木（函式），需要時呼叫它（本站整理）。
  - 寫好後請家人試玩，故意輸入最小和最大的數。例如次數應該從 0 開始卻寫成從 1 開始，程式看起來對，結果卻多算一次（數字是示意）；找到 bug 就改，再試一次（本站建議）。
  qa:
    question: 為什麼程式「看起來對」卻跑出錯的結果？
    answer: 電腦只照寫下的步驟做，不會猜你想做什麼；初始值、判斷條件或迴圈停止的時機寫錯一點，結果就會錯（本站整理）。CS Unplugged 說，除錯要「step through each instruction and identify when something goes wrong」。
    source: cs-kidbots-about
  items_title: 寫程式四步
  items:
  - title: 先寫步驟
    text: 在紙上寫出遊戲怎麼玩。
  - title: 用變數記
    text: 記住答案和次數。
  - title: 用迴圈重複
    text: 一直猜到猜中為止。
  - title: 包成函式
    text: 把回答步驟包起來重複用。
  checklist_title: 每次做完勾一下
  checklist:
  - 遊戲能猜中
  - 次數算對
  - 修好 bug
