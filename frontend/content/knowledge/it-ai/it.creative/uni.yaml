what:
  heading: 能創作，也懂權利
  body:
  - 學完後，自己能用規則、隨機和雜訊寫出生成藝術作品，說明不同隨機方法的效果，並說明人和 AI 在作品裡的角色與權利。
  - 美國著作權局 2025 年的報告也說：「Where AI merely assists an author in the creative process, its use does not change the copyrightability of the output.」並認為以目前的技術，「prompts alone do not provide sufficient human control to make users of an AI system the authors of the output」。這是美國的見解，只當對照；台灣以智慧局的令函為準。
  items_title: 學完能做到
  items:
  - title: 寫生成藝術
    text: 規則、隨機、雜訊。
  - title: 說明差別
    text: random() 和 noise()。
  - title: 說明權利
    text: 創意投入決定作者。
  checklist_title: 自我檢核
  checklist:
  - 作品完成
  - 差別說對
  - 權利說對
  figures:
  - creative-compare
  notes:
  - 本頁的點數和例子是示意。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，程式、數字和引用的資料要自己驗證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - usco-ai2
  - genai-student
