why:
  heading: 規則加上隨機
  body:
  - 《The Nature of Code》整本書反覆問：「How do you define the rules that govern the behavior of your objects?」生成藝術就是這樣：作者寫規則，電腦依規則一筆筆畫出來，每次執行都可能不同。
  - 隨機不一定自然。書上介紹 Perlin 雜訊，它「producing a naturally ordered sequence of pseudorandom numbers, where each number in the sequence is quite close in value to the one before it」。高中學過文字式程式設計和資訊科技的合理使用原則，這裡把程式當畫筆，也要面對作品歸誰的問題。
  items_title: 三個關鍵詞
  items:
  - title: 規則
    text: 作者寫下的畫法。
  - title: 隨機
    text: 每次執行都不同。
  - title: 作者
    text: 有實際創意投入的人。
  checklist_title: 開始前先確認
  checklist:
  - 會寫迴圈
  - 會用變數
  sources:
  - noc-random
  - tech108
how:
  heading: 寫規則、加雜訊、談作者
  body:
  - random()：p5.js 說它「follows uniform distribution, which means that all outcomes are equally likely」。讓 200 個點各自隨機走步，線條會抖得很碎；用 randomSeed() 固定種子，p5.js 說可以「generate the same sequence of numbers or choices each time a sketch runs」，方便重現同一件作品（數字是示意，本站整理）。
  - noise()：把隨機走步換成 noise()，p5.js 說「Calls to noise() with similar inputs will produce similar outputs.」輸入每次只加一點點，線條就會平滑起伏；這個函式由 Ken Perlin 發明，常用來做紋理、動作和地形。noise() 的種子要另外固定，p5.js 說「The noiseSeed() function can be used to generate the same sequence of Perlin noise values each time a sketch runs」。比較兩張圖，寫下你選哪一種、為什麼。
  - 談作者：智慧局令函把 AI 的創作分成兩種：「第一種是『以人工智慧為工具的創作』，也就是人類有實際的創意投入」，成果仍受保護；「第二種是『人工智慧獨立創作』」，成果「原則上無法享有著作權」。另一函也提醒，AI 生成的圖若與訓練資料中的原作「構成實質近似」，商業使用可能侵權。把自己的程式作品和一張用學校允許的 AI 工具生成的圖並陳，說明兩者各有多少你的創意投入（本站建議）。
  qa:
    question: 規則是你寫的、畫面是電腦畫的，作品是誰的？
    answer: 規則、參數和挑選都是你決定的，電腦只是照規則執行，所以是你的作品。令函說用工具的創作「著作權則由該投入創意的自然人享有」；如果只讓 AI 自己生成、人沒有實際的創意投入，原則上就沒有著作權（說明是本站整理）。
    source: tipo-1111031
  items_title: 四步做
  items:
  - title: 用 random()
    text: 均勻隨機，線條碎。
  - title: 用 noise()
    text: 相近輸入得相近輸出。
  - title: 固定種子
    text: randomSeed() 和 noiseSeed()。
  - title: 並陳討論
    text: 說出各有多少創意投入。
  checklist_title: 每次做完勾一下
  checklist:
  - 兩種線條都畫出
  - 種子已固定
  - AI 圖已標註
  - 說出作者是誰
  activity_figure: creative-flow
