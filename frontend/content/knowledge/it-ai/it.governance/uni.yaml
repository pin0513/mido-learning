idea: 依風險高低管理 AI：透明、可解釋、可問責。台灣的人工智慧基本法和美國 NIST 的 AI 風險管理框架，都把風險評估、人類監督和申訴救濟放在核心。
guiding_questions:
- AI 造成傷害時，責任在開發者、使用者還是 AI？
- 履歷篩選 AI 為什麼要特別小心？
scenario: 為一個虛構的履歷篩選 AI 做風險評估：找出可能的傷害和受影響的人、對照法規原則，提出治理措施與申訴機制（案例是虛構的，本站整理）。
formats:
  slides: []
  exercise: 目標：為虛構的履歷篩選 AI 寫一頁風險評估：列出至少 3 個風險和受影響的人，各配一個治理措施，並設計申訴與人工覆核流程（數字是示意）。　檢核：不看本頁，說出人工智慧基本法第 4 條裡和履歷篩選最相關的三項原則，說明就業服務法第 5 條為什麼跟履歷篩選有關，並說出你的申訴流程誰收件、誰覆核、多久回覆（數字是示意）。
