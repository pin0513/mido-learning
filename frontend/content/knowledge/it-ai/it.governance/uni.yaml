why:
  heading: 影響越大，管得越嚴
  body:
  - 教科書提醒，部署機器學習系統時，「you are typically providing a tool that will be used to (partially or fully) automate decisions」，而且「These technical systems can impact the lives of individuals who are subject to the resulting decisions.」履歷篩選就是這樣：模型的判斷會影響誰拿到面試。
  - 台灣 115 年公布的人工智慧基本法要「推動與國際介接之人工智慧風險分類框架」（第 16 條），也要求「政府應就高風險人工智慧之應用，明確其責任歸屬及歸責條件，並建立其救濟、補償或保險機制。」（第 17 條）。第 4 條列了七項原則，下面挑和履歷篩選最相關的三項。高中學過資訊科技對人與社會的影響，也練習過用多元觀點思辨資訊科技議題，大學要能把原則變成具體措施。
  items_title: 第 4 條挑三項
  items:
  - title: 透明與可解釋
    text: 產出要適當揭露或標記。
  - title: 公平與不歧視
    text: 不對特定群體造成歧視。
  - title: 問責
    text: 承擔內部與外部的責任。
  checklist_title: 開始前先確認
  checklist:
  - 讀過資訊倫理
  - 知道個資保護
  sources:
  - d2l-shift
  - aibasic
  - tech108
how:
  heading: 評風險、定措施、留申訴
  body:
  - 找風險：先寫清楚系統用途和誰會受影響。NIST 框架用治理、對應、衡量、管理四個功能整理風險，也舉了「AI RMF hiring profile」當例子，表示徵才可以有專屬的風險做法。履歷篩選的風險例如：模型從過去的錄取資料學到對某些性別或年齡的偏差、求職者不知道有 AI 參與、被刷掉的人無從申訴（說明是本站整理）。
  - 對照法規：就業服務法第 5 條規定雇主「不得以種族、階級、語言、思想、宗教、黨派、籍貫、出生地、性別、性傾向、年齡、婚姻、容貌、五官、身心障礙、星座、血型或以往工會會員身分為由，予以歧視」，用 AI 篩選也一樣；人工智慧基本法第 4 條要求「允許人類監督」，第 14 條要「避免不必要之個人資料蒐集、處理或利用」。所以不把性別、年齡、照片等欄位給模型，也檢查會間接透露這些特徵的欄位，並定期比較不同群體的通過率（本站建議）。基本法主要規範政府怎麼推動和管理 AI，雇主直接要遵守的是就業服務法等法律（說明是本站整理）。
  - 定措施與申訴：NIST 要求「Fairness and bias – as identified in the MAP function – are evaluated and results are documented.」上線後的監測也要包含「appeal and override」。設計申訴流程：告知求職者有 AI 參與、可以要求真人重看、由誰在幾天內回覆，紀錄留下來供下次檢討（說明是本站整理）。
  qa:
    question: AI 造成傷害時，責任在開發者、使用者還是 AI？
    answer: AI 本身不是負責的對象，責任落在開發、部署和使用它的人與組織，依角色分擔：開發者對模型和資料的品質負責，部署的公司對怎麼用、有沒有人工覆核負責，使用者要依規定使用。人工智慧基本法第 4 條的問責原則是「應確保承擔相應之責任，包含內部治理責任及外部社會責任。」（說明是本站整理）
    source: aibasic
  items_title: 四步做
  items:
  - title: 寫系統用途
    text: 誰用、用來決定什麼。
  - title: 列風險與受影響者
    text: 偏差、不透明、無法申訴。
  - title: 配治理措施
    text: 移除敏感欄位、定期檢查。
  - title: 設計申訴流程
    text: 告知、人工重看、回覆期限。
  checklist_title: 每次做完勾一下
  checklist:
  - 風險至少三個
  - 每個都有措施
  - 申訴有負責人
  - 不用真人資料
  activity_figure: gov-flow
  sources:
  - nist-ai-rmf
  - esa5
  - aibasic
what:
  heading: 把原則變成措施
  body:
  - 學完後，自己能為一個 AI 應用做風險評估，把法規原則對到具體措施，並設計申訴和人工覆核。
  - NIST 也提醒，人和 AI 的分工要先講清楚：「Human roles and responsibilities in decision making and overseeing AI systems need to be clearly defined and differentiated.」
  items_title: 學完能做到
  items:
  - title: 評估風險
    text: 找出受影響的人。
  - title: 對照法規
    text: 說出條文和對應措施。
  - title: 設計申訴
    text: 有人收件、有人覆核。
  checklist_title: 自我檢核
  checklist:
  - 風險評估完成
  - 法規對得上
  - 申訴流程可行
  figures:
  - gov-compare
  notes:
  - 本頁的履歷篩選案例是虛構的，數字是示意。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，程式、數字和引用的資料要自己驗證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - nist-ai-rmf
  - genai-student
