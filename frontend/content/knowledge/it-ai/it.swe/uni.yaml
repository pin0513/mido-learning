verify_notes:
- 原有待核對「108 課綱科技領域在生成式 AI 普及前公布，涉及生成式 AI 的內容屬延伸。國中資訊科技主題名稱與高中加深加廣選修名稱，上線前請以教育部科技領域課綱核對。」已處理：大學不屬於 108 課綱，本點不填 curriculum_108、不列年級、item 不放代碼；高中資訊科技必修的相關學習重點（資 P-V-1、資 T-V-1、運 c-V-2、運 c-V-3）只在 tech108 來源逐字引用（含頁碼，頁碼是頁腳印的頁碼，比 PDF 頁少 4），當作先學過的內容，不引用高中加深加廣選修；主要依據改用大學教科書和官方文件。生成式 AI 的使用規則依教育部注意事項（學生版）中大學生也適用的原則（本站建議）；教育部《高級中等以下學校人工智慧使用和學習指引》的適用對象是高級中等以下學校，本點不引用。
- 英文網頁的引文取自 2026-10-29 讀取的網頁；只取不含彎引號或數學式的句子或片段，省略處用刪節號。
- 原 guiding question「為什麼『我電腦上可以跑』不夠？」改成「為什麼『我這裡能跑』不夠？」：引號裡是口語說法，不是引用來源，縮短後意思相同。
- 原 idea 的「清楚的架構」用 Software Engineering at Google 第 11 章說明：寫自動測試會逼人及早面對設計問題，通常帶來更模組化的軟體；本頁不另教架構模式。
