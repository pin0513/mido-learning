review: 不看本頁，自己說出分支、程式碼審查、自動測試各防止什麼問題，說明為什麼只在自己電腦上能跑還不夠，並指出一次合併衝突兩邊的內容、把它解決。
why:
  heading: 軟體要活很久
  body:
  - Google 的軟體工程書說：「Software engineering is programming integrated over time.」寫一次能跑的程式只是開始；別人接手、需求改變、好幾個人同時修改，才是真實軟體的日常。
  - Pro Git 這樣說明分支：「Branching means you diverge from the main line of development and continue to do work without messing with that main line.」高中學過文字式程式設計、數位合作共創的工具和專案管理的概念，大學把它們變成團隊每天的工作方式。
  items_title: 三個工具
  items:
  - title: 版本控制
    text: 每次修改都有紀錄，可以回頭。
  - title: 程式碼審查
    text: 合併前讓另一個人看過。
  - title: 自動測試
    text: 每次提交都自動檢查。
  checklist_title: 開始前先確認
  checklist:
  - 會寫函式
  - 會用終端機
  sources:
  - seag1
  - git-branch
  - tech108
how:
  heading: 分支、審查、測試
  body:
  - '分支與合併：每人從主線開自己的分支改一個功能。兩人改到同一個檔案的同一段時，Git 會停下來，書上的例子是「CONFLICT (content): Merge conflict in index.html」；打開檔案看兩邊的內容、決定保留什麼，再提交（說明是本站整理）。'
  - 審查：在 GitHub 開 pull request，GitHub 說它「letting you discuss and review changes before merging them」。Google 的書說「Having another set of eyes look over a change helps ensure that the change does what was intended.」，而且「A code review is often the first test of whether a given change is understandable to a broader audience」。
  - 自動測試與持續整合：為新功能寫一個測試，再用 GitHub Actions 設定 CI，GitHub 說「CI using GitHub Actions offers workflows that can build the code in your repository and run your tests.」。在儲存庫裡加一個 workflow 檔，讓每次提交都自動跑測試；儲存庫裡不放密碼、金鑰或個人資料（本站建議）。GitHub 說「Committing code more often detects errors sooner and reduces the amount of code a developer needs to debug」；Google 的書說自動測試「can quickly catch mistakes, and this makes it possible to change software with confidence」，寫測試也會逼人及早面對設計問題，通常帶來「more modular software that enables greater flexibility later on」。
  qa:
    question: 為什麼「我這裡能跑」不夠？
    answer: 你的電腦可能裝了別人沒有的套件、留著沒提交的檔案，或只試過你想到的情況。CI 在共用儲存庫上自動建置和測試每次提交，GitHub 說這樣「detects errors sooner」；在共用的環境跑過、別人也能重現，才算真的能用（說明是本站整理）。
    source: gh-ci
  items_title: 四步做
  items:
  - title: 開分支
    text: 每人改一個功能。
  - title: 寫測試
    text: 為新功能寫一個自動測試。
  - title: 開 pull request
    text: 請同學審查、回應意見。
  - title: CI 通過才合併
    text: 有衝突就自己解決。
  checklist_title: 每次做完勾一下
  checklist:
  - 分支有說明
  - 測試會跑
  - 審查有回應
  - 衝突已解決
  activity_figure: swe-flow
  sources:
  - git-merge
  - gh-pr
  - seag9
  - gh-ci
  - seag11
what:
  heading: 多人一起改也不亂
  body:
  - 學完後，自己能用分支和 pull request 跟同學協作、寫自動測試並設定 CI，在合併前審查別人的程式碼，遇到合併衝突能自己解決。
  - Google 的書也提醒，審查不必完美，它是多道防線之一：「A code review is neither a panacea nor the only check for such correctness」。
  items_title: 學完能做到
  items:
  - title: 協作流程
    text: 分支、審查、合併。
  - title: 自動測試
    text: 每次提交都檢查。
  - title: 解決衝突
    text: 看懂兩邊，決定保留什麼。
  checklist_title: 自我檢核
  checklist:
  - 合併成功
  - CI 通過
  - 說出各防什麼
  figures:
  - swe-compare
  notes:
  - 本頁的網站和分組是示意。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，程式、數字和引用的資料要自己驗證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - seag9
  - genai-student
