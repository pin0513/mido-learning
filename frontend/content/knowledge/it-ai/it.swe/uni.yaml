idea: 真實的軟體是團隊長期維護的。版本控制、自動測試、清楚的架構，讓很多人能一起改而不出亂子。
guiding_questions:
- 為什麼「我這裡能跑」不夠？
- 合併前為什麼要讓別人看過？
scenario: 幾位同學一組，用 Git 協作開發一個小網站（例如學習資源分享站）：每人在自己的分支改一個功能，開 pull request 互相審查，讓自動測試跑過才合併（本站整理）。
formats:
  slides: []
  exercise: 目標：用 Git 分支和 pull request 完成一次團隊協作：為新功能寫一個自動測試、讓 CI 跑過、經同學審查後合併，並自己解決一次合併衝突。　檢核：不看本頁，自己說出分支、程式碼審查、自動測試各防止什麼問題，說明為什麼只在自己電腦上能跑還不夠，並指出一次合併衝突兩邊的內容、把它解決。
