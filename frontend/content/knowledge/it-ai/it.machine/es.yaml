idea: AI 不是天生就懂，而是看了很多例子，找出規律。例子給得好不好，會影響它學得準不準（本站整理）。
guiding_questions:
- 如果只給機器看白色的貓，它會認得黑貓嗎？
scenario: 親子共學（不用電腦）：家長扮演機器，只能照孩子挑的例子卡學規則；孩子故意只給白色的貓卡，再拿黑貓卡考它，看它哪裡會錯（本站建議）。
