est_time:
  school: 國小五、六年級（議題融入）
  source: es-ref
why:
  heading: AI 從例子裡學
  body:
  - 教育部《未來人才AI能力圖像》國小階段要「理解AI透過資料學習產生結果的基本理念。」，也要「引導學生理解AI產出並非絕對正確」。
  - 國家教育研究院的參考說明，五、六年級要「理解資訊科技於日常生活之重要性。」；議題融入說明手冊也列出「了解資訊科技於日常生活之重要性。」
  items_title: 高中會接著學
  items:
  - title: 機器學習的基本概念
    text: 高中科技領綱 資 D-V-2：資料探勘與機器學習的基本概念。
    code: 資 D-V-2
  checklist_title: 開始前先確認
  checklist:
  - 分得出貓和狗
  - 會畫簡單的圖
  notes:
  - 國小沒有部定的資訊科技課程，資訊教育是融入各領域實施的議題；國小的學習重點出自國家教育研究院的參考說明，只寫在來源裡。本頁列的代碼開頭的「資」是科技領綱（國中、高中）的資訊科技學習內容，中間的 IV 是第四學習階段（國中）、V 是第五學習階段（高中），代表之後會接著學。
  sources:
  - moe-ai-portrait
  - es-ref
  - issues-handbook
  - tech108
  - zonggang
how:
  heading: 當一次教機器的人
  body:
  - 準備貓和狗的圖卡（家長畫或從圖鑑挑，不用家人的照片）。孩子挑幾張當例子教機器：家長扮演機器，只能照例子裡看到的特徵判斷，不能用自己原本的知識（本站建議）。
  - 孩子故意只給白色的貓當例子，再拿一張黑貓卡考它；機器可能說它不是貓，因為例子裡的貓都是白的（本站整理）。把黑貓、花貓也加進例子，再考一次，看看有沒有變準。
  qa:
    question: 如果只給機器看白色的貓，它會認得黑貓嗎？
    answer: 可能認不得：它只從例子學，例子裡的貓都是白的，它可能把顏色當成規則（本站整理）。《未來人才AI能力圖像》國小階段也要「引導學生理解AI產出並非絕對正確」。
    source: moe-ai-portrait
  items_title: 教機器四步
  items:
  - title: 挑例子
    text: 挑幾張貓和狗的卡。
  - title: 機器學規則
    text: 家長只照例子判斷。
  - title: 用新卡考
    text: 拿沒看過的卡考它。
  - title: 補例子
    text: 補上沒給到的例子再考。
  checklist_title: 每次做完勾一下
  checklist:
  - 用新卡考過
  - 找到認錯的卡
  - 補了例子
  activity_figure: machine-flow
  sources:
  - moe-ai-portrait
what:
  heading: 知道 AI 會學，也會錯
  body:
  - 學完後，孩子能說出 AI 是從例子學會判斷的，也能說出例子太少或太偏時，AI 可能會判斷錯。
  items_title: 學完能做到
  items:
  - title: 說出怎麼學
    text: AI 從例子找規律。
  - title: 找出錯誤
    text: 用沒看過的例子考它。
  - title: 改善例子
    text: 例子要多樣，才學得準。
  checklist_title: 家長檢核
  checklist:
  - 說得出怎麼學
  - 找得到錯誤
  - 知道要補例子
  figures:
  - machine-compare
  notes:
  - 本頁的活動不用電腦，也不用孩子或家人的照片（本站建議）。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - moe-ai-portrait
  - genai-student
