est_time:
  school: 國小三、四年級（議題融入）
  source: es-ref
why:
  heading: 拆小、找規律、抓重點
  body:
  - 國家教育研究院的參考說明，三、四年級要「認識以運算思維解決問題的過程。」，五、六年級再「運用運算思維解決問題。」；議題融入說明手冊也列出「應用運算思維描述問題解決的方法。」
  - CS Unplugged 說，分解是「breaking down problems into smaller, more manageable, parts」，抽象化是「all about simplifying things to help us manage complexity.」教育部《未來人才AI能力圖像》國小階段也寫到「能運用運算思維將問題拆解」。
  items_title: 國中會接著學
  items:
  - title: 演算法基本概念
    text: 科技領綱 資 A-IV-1：演算法基本概念。
    code: 資 A-IV-1
  checklist_title: 開始前先確認
  checklist:
  - 會畫簡單的圖
  - 認得常見動物
  notes:
  - 國小沒有部定的資訊科技課程，資訊教育是融入各領域實施的議題；國小的學習重點出自國家教育研究院的參考說明，只寫在來源裡。本頁列的代碼開頭的「資」是科技領綱（國中、高中）的資訊科技學習內容，中間的 IV 是第四學習階段（國中）、V 是第五學習階段（高中），代表之後會接著學。
  sources:
  - es-ref
  - issues-handbook
  - cs-ct
  - moe-ai-portrait
  - tech108
  - zonggang
how:
  heading: 分卡片，猜規則
  body:
  - 先和孩子一起畫幾張動物卡。孩子選一個特徵當規則，例如會不會飛，把卡分成兩堆；家長看兩堆卡猜規則。猜的時候只看和規則有關的特徵，不管顏色、大小這些細節，這就是抽象化（本站整理）。
  - 再換家長出題：家長選一個特徵把卡分成兩堆，孩子猜規則。最後家長拿一張新卡，問孩子它該放哪一堆；放對了，表示孩子猜到的規則是對的（本站整理）。CS Unplugged 說，把方法推廣到相似的問題，可以「come up with solutions quickly and effectively」。
  qa:
    question: 同一堆卡片，可以有幾種分法？哪一種最好用？
    answer: 可以有很多種：會不會飛、有幾隻腳、住在哪裡都行（本站整理）。哪一種最好用，要看想解決什麼問題；CS Unplugged 說，評估是判斷哪個方法「is the best to use」。
    source: cs-ct
  items_title: 分類四步
  items:
  - title: 選一個特徵
    text: 例如會不會飛。
  - title: 分成兩堆
    text: 照規則把卡片分好。
  - title: 猜出規則
    text: 看兩堆卡，說出規則。
  - title: 用新卡檢查
    text: 新卡放對，猜的規則才對。
  checklist_title: 每次做完勾一下
  checklist:
  - 說得出規則
  - 猜出規則
  - 新卡放對
  activity_figure: pattern-flow
  sources:
  - cs-ct
what:
  heading: 分得出，也說得出規則
  body:
  - 學完後，孩子能自己訂規則分類、說出規則，也能從別人分好的結果猜出規則，並用新的例子檢查。
  items_title: 學完能做到
  items:
  - title: 訂規則分類
    text: 選一個特徵分成兩堆。
  - title: 猜出規則
    text: 從分好的結果說出規則。
  - title: 用例子檢查
    text: 用新卡確認規則。
  checklist_title: 家長檢核
  checklist:
  - 規則說得清
  - 猜得出規則
  - 會用新卡試
  figures:
  - pattern-compare
  notes:
  - 本頁的特徵和卡片都是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - cs-ct
  - genai-student
