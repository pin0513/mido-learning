est_time:
  school: 國小五、六年級（議題融入）
  source: es-ref
why:
  heading: 重複和判斷，讓程式更好用
  body:
  - 國家教育研究院的參考說明，三、四年級先認識「圖像式程式設計工具的操作介紹」，五、六年級再學「圖像式程式設計工具的基本功能及操作」；議題融入說明手冊也列出「使用資訊科技解決生活中簡單的問題。」
  - 'Scratch 基金會說，孩子用的是「a simple, block-based coding interface that they can drag and snap together: no tricky syntax required.」'
  items_title: 國中會接著學
  items:
  - title: 結構化程式設計
    text: 科技領綱 資 P-IV-2：結構化程式設計。說明包含「重複結構的程式設計實作與應用。」
    code: 資 P-IV-2
  checklist_title: 開始前先確認
  checklist:
  - 會用滑鼠拖拉
  - 做過指令卡
  notes:
  - 國小沒有部定的資訊科技課程，資訊教育是融入各領域實施的議題；國小的學習重點出自國家教育研究院的參考說明，只寫在來源裡。本頁列的代碼開頭的「資」是科技領綱（國中、高中）的資訊科技學習內容，中間的 IV 是第四學習階段（國中）、V 是第五學習階段（高中），代表之後會接著學。
  sources:
  - es-ref
  - issues-handbook
  - scratch-about
  - tech108
  - zonggang
how:
  heading: 先排一步步，再縮短
  body:
  - 家長先開好圖像式程式工具。孩子先一步一步排出走迷宮的積木，例如前進、前進、前進、右轉；接著把三塊一樣的前進積木換成一塊重複 3 次的積木，程式變短，結果一樣（次數是示意）。
  - 再加一塊如果積木：如果碰到牆，就右轉。按下執行前，先讓孩子預測角色會走到哪裡；走錯了就一塊一塊檢查。作品不上傳、不登入帳號，只在家長準備的電腦上做（本站建議）。
  qa:
    question: 怎樣用最少的積木讓角色走完迷宮？
    answer: 找出一直重複的步驟，用重複積木包起來；需要判斷的地方用如果積木（本站整理）。CS Unplugged 說，找出重複的指令後，就可以「reuse these groups of instructions」。
    source: cs-kidbots-about
  items_title: 積木三步
  items:
  - title: 一步一步排
    text: 先把每一步都排出來。
  - title: 用重複縮短
    text: 相同的積木換成重複積木。
  - title: 加上如果
    text: 碰到牆就轉彎。
  checklist_title: 每次做完勾一下
  checklist:
  - 先預測再執行
  - 用了重複積木
  - 用了如果積木
  activity_figure: blocks-flow
  sources:
  - cs-kidbots-about
what:
  heading: 會用重複，也會用如果
  body:
  - 學完後，孩子能用圖像式程式工具排出走迷宮的程式，用重複積木把相同步驟縮短，用如果積木讓角色碰到牆時轉彎。
  items_title: 學完能做到
  items:
  - title: 排出程式
    text: 一步一步排出走迷宮的積木。
  - title: 用重複縮短
    text: 把相同步驟換成重複積木。
  - title: 用如果判斷
    text: 碰到牆時讓角色轉彎。
  checklist_title: 家長檢核
  checklist:
  - 角色走到終點
  - 說得出重複
  - 說得出如果
  figures:
  - blocks-compare
  notes:
  - 本頁的步數和次數是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - tech108
  - genai-student
