  exercise: 目標：用積木讓角色走完一段迷宮：先排出一步一步的指令，再用重複積木把相同的步驟縮短，並加一個碰到牆就轉彎的如果積木。　檢核：孩子的程式讓角色走到終點；說得出哪幾塊積木換成了重複積木；也指得出如果積木在什麼時候會執行；三件事都做到。
