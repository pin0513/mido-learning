  supports: 學習重點：運 c-V-2「能認識專案管理的概念。」（p.7）；運 c-V-3「能整合適當的資訊科技與他人合作完成專題製作。」（p.7）；資 T-V-1「數位合作共創的概念與工具使用。」（p.11）；資 P-V-1「文字式程式設計概念與實作。」（p.11）；資訊科技學習內容說明「高級中等學校教育階段則更重視整合運用，藉由資訊科學的初步探索，讓學生進一步理解運算思維之相關原理，以培養整合資訊科技與運算思維以有效解決問題之能力。」（p.10）；時間分配「高級中等學校教育階段資訊科技與生活科技之部定必修課程各為 2 學分，建議依學期開設，採資訊科技與生活科技上下學期對開，每週連排 2 節課。」（p.2）；資 T-V-1 說明「專案管理的概念。」、「版本控制的概念。」（p.45）；資 P-V-1 說明「文字式程式設計的概念。」（p.45）；核心素養：科S-U-A3「善用科技資源規劃、執行、反思及創新，解決情境中的問題，進而精進科技專題的製作品質。」（p.3）；科S-U-B2「理解科技與資訊的原理及發展趨勢，整合運用科技、資訊及媒體，並能分析思辨人與科技、社會、環境的關係。」（p.4）
