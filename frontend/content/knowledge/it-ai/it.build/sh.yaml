how:
  heading: 先寫測試，再請 AI 幫忙
  body:
  - 先分工：誰寫需求、誰寫測試案例、誰整合。把需求寫成一句話，再寫 3 個測試案例：輸入什麼、應該得到什麼（數字是示意）。接著請 AI 產生程式草稿，給 AI 的內容只用示意資料，不放任何真實姓名或帳號（本站建議）。
  - 拿到草稿後逐段讀，讀不懂就追問或自己改寫，再跑測試；每次修改都用版本控制存一版，並寫一句說明改了什麼（例如 Git，或共用文件的版本紀錄，本站建議）。Pro Git 說版本控制「records changes to a file or set of files over time so that you can recall specific versions later.」最後寫好 AI 協作紀錄：用了哪個工具、版本、做了什麼、哪裡被帶錯（本站建議）。
  qa:
    question: 如果你看不懂 AI 寫的程式，你敢交出去嗎？
    answer: 不應該交。看不懂就無法確認它對不對、安不安全，出了問題也說不出原因；自己讀懂、測試過，才能為作品負責（本站整理）。教育部的指引說，學生要「為自己的選擇與行為負責」。
    source: moe-ai-guide
  items_title: 協作四步
  items:
  - title: 分工寫需求
    text: 誰做什麼先講好。
  - title: 先寫測試
    text: 寫好輸入和預期結果。
  - title: 讀懂再用
    text: AI 草稿逐段讀懂。
  - title: 存版寫紀錄
    text: 版本控制和 AI 紀錄。
  checklist_title: 每次做完勾一下
  checklist:
  - 測試都通過
  - 每段讀得懂
  - 紀錄寫完整
  activity_figure: build-flow
  sources:
  - git-vc
  - moe-ai-guide
what:
  heading: 會分工，也會把關
  body:
  - 學完後，學生能和同學分工、先寫測試再請 AI 產生草稿，讀懂並測試每一段程式，用版本控制保存修改，並誠實寫出 AI 協作紀錄。
  items_title: 學完能做到
  items:
  - title: 寫測試
    text: 先定好預期結果。
  - title: 讀懂程式
    text: 說得出每段在做什麼。
  - title: 揭露 AI
    text: 寫出工具、版本和用途。
  checklist_title: 家長檢核
  checklist:
  - 測試有通過
  - 說得出程式
  - 紀錄有寫
  figures:
  - build-compare
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  sources:
  - moe-ai-guide
  - genai-student
