why:
  heading: AI 寫草稿，你要負責
  body:
  - 科技領綱高中學「數位合作共創的概念與工具使用。」，說明包含「專案管理的概念。」和「版本控制的概念。」；也學「文字式程式設計概念與實作。」學習表現要「能整合適當的資訊科技與他人合作完成專題製作。」
  - 教育部的指引說，學生不應「只是複製貼上系統產出」，作品中要「標註所使用的工具名稱、版本與使用方式」。
  items_title: 科技領綱的學習重點
  items:
  - title: 專案管理的概念
    text: 高中科技領綱 運 c-V-2：能認識專案管理的概念。
    code: 運 c-V-2
  - title: 合作完成專題
