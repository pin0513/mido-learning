scenario: 和同學分工做一個解決校園小問題的小工具（例如社團活動時間查詢，只用示意資料、不收任何人的個資）：先寫需求和測試案例，請 AI 產生程式草稿，自己讀懂、測試、修改，用版本控制保存每一版，並寫下 AI 協作紀錄（本站建議）。
