verify_notes:
- 原有待核對「108 課綱科技領域在生成式 AI 普及前公布，涉及生成式 AI 的內容屬延伸。國中資訊科技主題名稱與高中加深加廣選修名稱，上線前請以教育部科技領域課綱核對。」已處理：本點的代碼與文字逐條對照科技領域課綱（教育部 107 年 9 月 20 日發布）原文，頁碼是頁腳印的頁碼（比 PDF 頁少 4）；本點不引用高中加深加廣選修。涉及 AI 的內容另依教育部《未來人才AI能力圖像》（115 年）與注意事項（學生版），不寫成課綱內容。
- 運算思維學習表現（運 c-V-2、運 c-V-3）的代碼開頭是中文字加小寫字母，schema 的 curriculum_108.performances 只收數字開頭的代碼，所以只在項目的 code 引用（已加進代碼表），curriculum_108 只列資訊科技學習內容。
- 核心素養依科技領綱 p.3–4 的 科S-U-A3、科S-U-B2 原文挑選（表格窄欄，文字已用頁面影像核對）。
- 科技領綱只說高中資訊科技部定必修 2 學分、「建議依學期開設」（p.2），沒有指定年級，所以 stage 不填 grades；est_time 寫高中資訊科技必修課。
- 原 scenario「和 AI 協作做一個解決校園小問題的工具（如社團報名表），記錄每一步誰做了什麼、哪裡被 AI 帶錯。」的社團報名表改成只用示意資料的社團活動時間查詢工具，不收集任何人的個人資料（本站建議）。
- 原稿的核心素養 A2 改成 A3：本點是規劃、執行並反思一個科技專題，對應科S-U-A3。
- 測試案例數是示意。
- 教育部《高級中等以下學校人工智慧使用和學習指引》（115 年 6 月 5 日核定）頁碼是頁腳印的頁碼（與 PDF 頁相同）；該 PDF 網站缺中繼憑證，下載時要略過憑證檢查。
