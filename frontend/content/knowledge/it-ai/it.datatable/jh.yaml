idea: 資料要先整理乾淨，才看得出規律；同一份資料，畫法不同，給人的印象也不同（本站整理）。
guiding_questions:
- 同一份資料，怎麼畫會讓人產生完全不同的印象？
scenario: 親子共學：用試算表整理一份示意資料（例如一週每天走路的步數），先檢查有沒有打錯或漏填，再做長條圖；最後故意做一張縱軸不從零開始的圖，比一比兩張圖給人的感覺（本站建議）。
formats:
  slides: []
  exercise: 目標：把一週每天走路的步數（示意資料）輸入試算表，找出並修正打錯或漏填的資料，做成長條圖；再做一張縱軸不從零開始的圖，說出它哪裡會誤導人。　檢核：表格裡打錯或漏填的資料都處理了；長條圖的縱軸從零開始；說得出縱軸不從零開始的圖為什麼會誇大差距；三件事都做到。
