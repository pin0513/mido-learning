how:
  heading: 整理、畫圖、找誤導
  body:
  - 先把示意資料輸入試算表，檢查有沒有打錯（例如多打一個 0）或漏填的格子，修好再算平均；這就是資料清理（本站整理）。再選資料做長條圖，縱軸從 0 開始。
  - 接著做一張縱軸從較大的數開始的長條圖，看起來每天差很多。英國政府 Analysis Function 的圖表指引說「Do not break the numerical axis on bar charts」，因為截斷縱軸「distorts these relative proportions.」
  qa:
    question: 同一份資料，怎麼畫會讓人產生完全不同的印象？
    answer: 把長條圖的縱軸改成不從 0 開始，小差距看起來就像大差距（本站整理）。英國政府 Analysis Function 的指引說，截斷縱軸是「when you make the axis start from a number other than zero」。
    source: gss-charts
  items_title: 資料四步
  items:
  - title: 輸入資料
    text: 把示意資料打進試算表。
  - title: 清理資料
    text: 找出打錯和漏填的格子。
  - title: 畫長條圖
    text: 縱軸從 0 開始。
  - title: 找誤導
    text: 比較截斷縱軸的圖。
  checklist_title: 每次做完勾一下
  checklist:
  - 資料清理過
  - 縱軸從 0 開始
  - 說出誤導處
  activity_figure: datatable-flow
  sources:
  - gss-charts
what:
  heading: 會整理資料，也會挑圖錯
  body:
  - 學完後，孩子能用試算表整理和清理資料、做出誠實的長條圖，也能看出截斷縱軸的圖哪裡會誤導人。
  items_title: 學完能做到
  items:
  - title: 清理資料
    text: 找出並修正錯誤和漏填。
  - title: 誠實畫圖
    text: 長條圖縱軸從 0 開始。
  - title: 看出誤導
    text: 說出截斷縱軸的問題。
  checklist_title: 家長檢核
  checklist:
  - 表格正確
  - 圖表誠實
  - 說得出誤導
  figures:
  - datatable-compare
  notes:
  - 本頁的資料是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - gss-charts
  - genai-student
