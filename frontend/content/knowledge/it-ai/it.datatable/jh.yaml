why:
  heading: 從資料看出故事
  body:
  - 科技領綱七年級的資料處理應用專題，說明包含「資料運算與分析：應用數位工具進行資料運算與分析以獲取所需資訊，可視需要融入試算表軟體的應用。」；九年級學「資料處理概念與方法。」，說明包含「資料前處理的概念與方法。」
  - 學習表現要「能選用適當的資訊科技組織思維，並進行有效的表達。」
  items_title: 科技領綱的學習重點
  items:
