  checklist:
  - 會打字輸入
  - 看得懂長條圖
  notes:
  - 代碼開頭的「資」是科技領綱的資訊科技學習內容，「運」是運算思維的學習表現；中間的 IV 是第四學習階段（國中七至九年級），V 是第五學習階段（高中）。
  sources:
