verify_notes:
- 原有待核對「108 課綱科技領域在生成式 AI 普及前公布，涉及生成式 AI 的內容屬延伸。國中資訊科技主題名稱與高中加深加廣選修名稱，上線前請以教育部科技領域課綱核對。」已處理：本點的代碼與文字逐條對照科技領域課綱（教育部 107 年 9 月 20 日發布）原文，頁碼是頁腳印的頁碼（比 PDF 頁少 4）；本點不引用高中加深加廣選修。涉及 AI 的內容另依教育部《未來人才AI能力圖像》（115 年）與注意事項（學生版），不寫成課綱內容。
- 運算思維學習表現（運 p-IV-1）的代碼開頭是中文字加小寫字母，schema 的 curriculum_108.performances 只收數字開頭的代碼，所以只在項目的 code 引用（已加進代碼表），curriculum_108 只列資訊科技學習內容。
- 核心素養依科技領綱 p.3–4 的 科-J-A2、科-J-B2 原文挑選（表格窄欄，文字已用頁面影像核對）。
- stage.grades 依科技領綱 p.10–11 表格所列的年級：資 T-IV-1 七年級、資 D-IV-3 九年級。
- 原 scenario「用試算表整理全班一週的睡眠時數」改成示意資料，不收集同學的資料（本站建議）。
- 截斷縱軸的提醒依英國政府 Analysis Function 的圖表指引；步數資料是示意。
