idea: 模型用訓練資料調整參數，讓預測誤差變小；但太複雜的模型會把訓練資料背下來（過度擬合），遇到新資料就失準（本站整理）。
guiding_questions:
- 考試前只背考古題，和機器過度擬合有什麼像？
scenario: 用試算表和一份示意資料（10 天的氣溫和手搖飲杯數），拿 8 天當訓練資料、2 天當測試資料；比較一條直線和一條穿過每個訓練點的彎曲線，在測試資料上誰預測得比較準（資料是示意，本站建議）。
formats:
  slides: []
  exercise: 目標：用示意資料分出訓練資料和測試資料，畫出直線和彎曲線兩個模型，算出兩者在測試資料上的誤差，說出哪個比較好、為什麼彎曲線可能過度擬合。　檢核：測試資料沒有拿來畫模型；兩個模型的測試誤差都算對；說得出訓練誤差小不代表新資料也準；能把過度擬合和只背考古題連起來說明；四件事都做到。
