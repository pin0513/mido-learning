why:
  heading: 學規律，不是背答案
  body:
  - 科技領綱高中學「資料探勘與機器學習的基本概念。」，說明包含「機器學習的概念與應用。」；學習表現要「能應用運算思維評估解題方法的優劣。」
  - Google 的機器學習速成課程說，過度擬合是模型太貼合訓練資料，以致「fails to make correct predictions on new data.」
  - 教育部《未來人才AI能力圖像》高中階段要學生理解資料的代表性與偏差，「避免因訓練資料偏頗導致錯誤決策。」
