how:
  heading: 直線和曲線，新資料見真章
  body:
  - 把示意資料輸入試算表，先蓋住其中 2 天當測試資料，只用 8 天畫散布圖（天數是示意）。模型一：加一條趨勢線（直線），Google 的課程說線性迴歸是找出「the relationship between features and a label」。模型二：把散布圖印出來，用手畫一條穿過每個訓練點的彎曲線，它在訓練資料上的誤差是 0（本站整理）。
  - 翻開測試資料，用兩個模型各預測一次（彎曲線在圖上讀出預測值），算出誤差 ＝ 實際杯數 − 預測杯數（取絕對值）。如果彎曲線在測試資料上錯得比直線多，就是過度擬合：Google 的課程說，過度擬合的模型「makes excellent predictions on the training set but poor predictions on new data」（本站整理）。
  qa:
    question: 考試前只背考古題，和機器過度擬合有什麼像？
    answer: 很像。只背考古題，遇到同樣的題目會答，換個問法就不會；過度擬合的模型也是把訓練資料背下來，遇到新資料就失準，所以要用模型沒看過的測試資料檢查（本站整理）。Google 的課程說，過度擬合的模型太貼合「the training set so closely that the model fails to make correct predictions on new data.」
    source: mlcc-overfit
  items_title: 比較兩個模型
  items:
  - title: 分開資料
    text: 訓練和測試分開。
  - title: 畫直線
    text: 用趨勢線當模型一。
  - title: 畫彎曲線
    text: 穿過每個訓練點。
  - title: 比測試誤差
    text: 看誰在新資料上準。
  checklist_title: 每次做完勾一下
  checklist:
  - 測試資料沒用
  - 誤差算對
  - 說出過度擬合
  activity_figure: ml-flow
  sources:
  - mlcc-linreg
  - mlcc-overfit
what:
  heading: 會比模型，看出過度擬合
  body:
  - 學完後，學生能把資料分成訓練和測試，比較直線和彎曲線在新資料上的誤差，說出訓練誤差小不代表模型好，並用過度擬合說明原因。
  items_title: 學完能做到
  items:
  - title: 訓練與測試
    text: 測試資料不拿來畫模型。
  - title: 算誤差
    text: 比兩模型的測試誤差。
  - title: 過度擬合
    text: 說出背答案的問題。
  checklist_title: 家長檢核
  checklist:
  - 分組正確
  - 誤差算對
  - 說得出原因
  figures:
  - ml-compare
  notes:
  - 本頁的氣溫和杯數都是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  sources:
  - mlcc-overfit
  - genai-student
  - moe-ai-guide
