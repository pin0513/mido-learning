- 原有待核對「108 課綱科技領域在生成式 AI 普及前公布，涉及生成式 AI 的內容屬延伸。國中資訊科技主題名稱與高中加深加廣選修名稱，上線前請以教育部科技領域課綱核對。」已處理：本點的代碼與文字逐條對照科技領域課綱（教育部 107 年 9 月 20 日發布）原文，頁碼是頁腳印的頁碼（比 PDF 頁少 4）；本點不引用高中加深加廣選修。涉及 AI 的內容另依教育部《未來人才AI能力圖像》（115 年）與注意事項（學生版），不寫成課綱內容。
- 運算思維學習表現（運 t-V-3）的代碼開頭是中文字加小寫字母，schema 的 curriculum_108.performances 只收數字開頭的代碼，所以只在項目的 code 引用（已加進代碼表），curriculum_108 只列資訊科技學習內容。
- 核心素養依科技領綱 p.3–4 的 科S-U-A2、科S-U-B2 原文挑選（表格窄欄，文字已用頁面影像核對）。
- 科技領綱只說高中資訊科技部定必修 2 學分、「建議依學期開設」（p.2），沒有指定年級，所以 stage 不填 grades；est_time 寫高中資訊科技必修課。
- 原 scenario 的資料改成 10 天的示意資料（8 天訓練、2 天測試），用試算表做；天數、氣溫和杯數都是示意（本站整理）。彎曲線的訓練誤差是 0，是因為它穿過每個訓練點。
- 教育部《高級中等以下學校人工智慧使用和學習指引》（115 年 6 月 5 日核定）頁碼是頁腳印的頁碼（與 PDF 頁相同）；該 PDF 網站缺中繼憑證，下載時要略過憑證檢查。
- 《未來人才AI能力圖像》的編號（例如 A-1-III-1）是該文件自己的編碼，III 是高中，不是 108 課綱代碼，只在來源引用；能力名稱照原文（能力A 運用AI學習的能力、能力B 負責任使用AI的能力、能力C 運用AI解決問題的能力、能力D AI無法取代的能力）；頁碼是頁腳印的頁碼（比 PDF 頁少 1），文字已用頁面影像核對。
