idea: 語言模型從大量文字學會估計下一個詞出現的機率，一個接一個產生文字。它很會說話，但會一本正經地說錯（幻覺）；提問方式也會影響回答（本站整理）。
guiding_questions:
- 會說話，就代表懂嗎？
scenario: 人工接龍（不用電腦）：老師給一句話的開頭，每位學生在紙上寫下一個詞，統計最常見的接法，重複幾輪接出一句話；再由老師用學校核可的教育用 AI 工具示範同樣的開頭，全班比較並查證它的說法，討論它為什麼會編造（本站建議）。
formats:
  slides: []
  exercise: 目標：完成人工接龍並統計每輪最常見的接法，說明語言模型是依前文估計下一個詞的機率來產生文字，再從 AI 的回答中挑出一個說法查證。　檢核：統計表正確；說得出語言模型是依前文估計下一個詞的機率；挑出的說法有用可靠來源查證；說得出會說話不等於真的理解；四件事都做到。
