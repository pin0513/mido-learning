idea: 語言模型根據大量文字學會「預測下一個字」。它很會說話，但會一本正經地說錯（幻覺）；提問方式會影響回答。
guiding_questions:
  - 會說話，就代表懂嗎？
scenario: 人工接龍：全班根據前文猜下一個詞，統計最常見答案；再比較 AI 的接法，討論為什麼會「編造」。
