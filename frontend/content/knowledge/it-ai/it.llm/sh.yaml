how:
  heading: 人工接龍，再比 AI
  body:
  - 老師給一句話的開頭（例如：今天放學後，我想去……，示意），每人在紙上寫下一個詞，統計各種接法的人數，選最多人寫的接上去，再接下一輪。這就是語言模型的基本想法：Google 的機器學習課程說，語言模型「estimates the probability of a token or sequence of tokens occurring within a longer sequence of tokens.」
  - 接著老師用學校核可的教育用 AI 工具示範同樣的開頭，全班比較 AI 的接法，並挑出一個具體說法查證。Google 的課程提醒「LLMs hallucinate」，也就是預測常常有錯；教育部的指引說「學生也應學習向人工智慧『追問』，了解系統給出答案的可能依據與限制」，全班可以請老師代為追問。
  qa:
    question: 會說話，就代表懂嗎？
    answer: 不一定。語言模型是根據大量文字估計下一個詞的機率，說得通順不代表真的理解，也可能一本正經地說錯（本站整理）。教育部《未來人才AI能力圖像》說，AI 系統「並非具備真實理解力」。
    source: moe-ai-portrait
  items_title: 接龍四步
