why:
  heading: 會說話，不等於懂
  body:
  - 科技領綱高中學「資料探勘與機器學習的基本概念。」，說明包含「模式識別的概念與應用（如電腦視覺、自然語言處理、生物特徵識別等）。」；學習表現要「能探索新興的資訊科技。」
  - 教育部《未來人才AI能力圖像》高中階段要學生「知曉AI系統是基於機率的統計推論，並非具備真實理解力，釐清其能力邊界。」
