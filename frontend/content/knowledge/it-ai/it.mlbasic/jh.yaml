how:
  heading: 分組訓練，再用新卡考
  body:
  - 畫 20 張垃圾分類卡（張數是示意），洗牌後分成訓練組 15 張、測試組 5 張，測試組先蓋起來。孩子只看訓練組，寫下自己歸納的分類規則；規則不一定完全對，這正是要測試的（本站整理）。
  - 再翻開測試組，照規則分類，算出準確率 ＝ 答對張數 ÷ 測試張數。如果測試組幾乎都是紙類，就算規則只會說紙類，準確率也可能很高（本站整理）。Google 的課程舉例，一個沒有用的模型也可能「would score 99% on accuracy, despite being useless.」
  qa:
    question: 準確率 95%，代表它可以放心用嗎？
    answer: 不一定。要看測試資料是不是模型沒看過的，以及各類別的資料夠不夠平均（本站整理）。Google 的課程提醒，在「heavily imbalanced datasets」裡，只看準確率不夠。
    source: mlcc-acc
  items_title: 訓練測試四步
  items:
  - title: 分兩組
    text: 訓練組和測試組分開。
  - title: 學規則
    text: 只看訓練組寫規則。
  - title: 算準確率
    text: 答對張數 ÷ 測試張數。
  - title: 找常錯的
    text: 看哪一類最常錯、為什麼。
  checklist_title: 每次做完勾一下
  checklist:
  - 測試組沒偷看
  - 準確率算對
  - 找到常錯類別
  activity_figure: mlbasic-flow
  sources:
  - mlcc-acc
what:
  heading: 會測試，也看得出偏誤
  body:
  - 學完後，孩子能說出訓練資料和測試資料要分開、會算準確率，也知道資料偏了，模型就可能學偏，準確率高不代表一定可靠。
  items_title: 學完能做到
  items:
  - title: 分開資料
    text: 訓練和測試不混用。
  - title: 算準確率
    text: 算出答對的比例。
  - title: 看出偏誤
    text: 說出資料偏了會怎樣。
  checklist_title: 家長檢核
  checklist:
  - 說得出分組
  - 算得出比例
  - 說得出偏誤
  figures:
  - mlbasic-compare
  notes:
  - 本頁的卡片張數和準確率都是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - mlcc-split
  - genai-student
