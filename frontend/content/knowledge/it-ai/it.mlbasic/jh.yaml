idea: 機器學習是從訓練資料找規律，再用沒看過的測試資料檢查學得好不好；資料偏了，模型就會學偏（本站整理）。
guiding_questions:
- 準確率 95%，代表它可以放心用嗎？
scenario: 親子共學（不用電腦）：用自己畫的垃圾分類卡（紙類、塑膠、廚餘），分成訓練組和測試組；孩子當模型只看訓練組歸納規則，再用測試組算答對幾張，找出常錯的類別（本站建議）。
formats:
  slides: []
  exercise: 目標：把分類卡分成訓練組和測試組，只看訓練組寫出分類規則，再用測試組算出準確率（例如 5 張答對 4 張是 80%，數字是示意），並找出最常錯的類別和原因。　檢核：孩子說得出為什麼測試組不能先看；準確率算對；也說得出只看準確率可能被騙，例如資料大多是同一類的時候（本站整理）；三件事都做到。
