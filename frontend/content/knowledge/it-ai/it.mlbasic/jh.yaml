verify_notes:
- 原有待核對「108 課綱科技領域在生成式 AI 普及前公布，涉及生成式 AI 的內容屬延伸。國中資訊科技主題名稱與高中加深加廣選修名稱，上線前請以教育部科技領域課綱核對。」已處理：本點的代碼與文字逐條對照科技領域課綱（教育部 107 年 9 月 20 日發布）原文，頁碼是頁腳印的頁碼（比 PDF 頁少 4）；本點不引用高中加深加廣選修。涉及 AI 的內容另依教育部《未來人才AI能力圖像》（115 年）與注意事項（學生版），不寫成課綱內容。
- 運算思維學習表現（運 a-IV-2）的代碼開頭是中文字加小寫字母，schema 的 curriculum_108.performances 只收數字開頭的代碼，所以只在項目的 code 引用（已加進代碼表），curriculum_108 只列資訊科技學習內容。
- 核心素養依科技領綱 p.3–4 的 科-J-A2、科-J-B2 原文挑選（表格窄欄，文字已用頁面影像核對）。
- stage.grades 依科技領綱 p.10–11 表格所列的年級：資 D-IV-3、資 H-IV-6 九年級。
- 《未來人才AI能力圖像》的編號（例如 A-1-I-1）是該文件自己的編碼，I、II 分別是國小、國中，不是 108 課綱代碼，只在來源引用；頁碼是頁腳印的頁碼（比 PDF 頁少 1），文字已用頁面影像核對。
- 國中科技領綱沒有機器學習的學習內容；機器學習列在高中必修 資 D-V-2，本點只在 Why 列為之後會學，國中的依據是 資 D-IV-3、資 H-IV-6 和《未來人才AI能力圖像》國中階段。
- 原 scenario「訓練一個分辨垃圾分類的影像模型」改成不用電腦的分類卡活動；卡片張數、準確率都是示意（本站整理）；分類規則是孩子自己歸納的，不是垃圾分類的官方規定。
