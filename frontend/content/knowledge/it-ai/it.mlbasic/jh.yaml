why:
  heading: 從例子學，用新例子考
  body:
  - 科技領綱九年級學「資料處理概念與方法。」和「資訊科技對人類生活之影響。」；機器學習要到高中才列入學習內容。教育部《未來人才AI能力圖像》國中階段要「理解AI透過資料訓練與模型運算產生結果的基本原理」。
  - Google 的機器學習速成課程說，模型要用另一份資料測試：「Machine learning models should be tested against a separate dataset, called the test set, to ensure accurate predictions on unseen data.」
  items_title: 科技領綱的學習重點
  items:
  - title: 法律倫理與社會議題
    text: 科技領綱 運 a-IV-2：能了解資訊科技相關之法律、倫理及社會議題，以保護自己與尊重他人。
    code: 運 a-IV-2
  - title: 資料處理
    text: 科技領綱 資 D-IV-3：資料處理概念與方法。
    code: 資 D-IV-3
  - title: 對人類生活的影響
    text: 科技領綱 資 H-IV-6：資訊科技對人類生活之影響。
    code: 資 H-IV-6
  - title: 高中：機器學習
    text: 高中科技領綱 資 D-V-2：資料探勘與機器學習的基本概念。
    code: 資 D-V-2
  checklist_title: 開始前先確認
  checklist:
  - 會算百分率
  - 知道垃圾分類
  notes:
  - 代碼開頭的「資」是科技領綱的資訊科技學習內容，「運」是運算思維的學習表現；中間的 IV 是第四學習階段（國中七至九年級），V 是第五學習階段（高中）。
