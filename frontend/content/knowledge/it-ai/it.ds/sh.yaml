how:
  heading: 畫成圖，一層一層找
  body:
  - 先畫圖：每站是一個點，相鄰兩站連一條邊，再為每站寫出相鄰的站（相鄰串列）。從起點開始：起點做記號、放進佇列；佇列像排隊，先放進去的先取出。每次從佇列前面取出一站，把還沒做記號的相鄰站做記號、記下是從哪站來的，再放到佇列後面（本站整理）。
  - 這樣會先找到距離 1 站的所有站，再找距離 2 站的，所以第一次碰到終點時，沿著記下的來源倒推回去，就是經過站數最少的路線；Open Data Structures 說，這個方法依「in increasing order of distance」拜訪各點。每站只放進佇列一次、每條連線最多從兩端各看一次，所以步驟數大約和站數加連線數成正比（本站整理）。
  qa:
    question: 為什麼導航 App 能在一瞬間找到路線？
    answer: 因為地圖先存成圖（路口或車站是點，路段是邊），再用有效率的圖搜尋演算法找路；像廣度優先搜尋每個點最多處理一次，不必把所有路線一條條試完（本站整理）。實際的導航 App 還要考慮距離和路況，方法更複雜（本站整理）。Open Data Structures 說，廣度優先搜尋可以用在「computing shortest paths」。
    source: ods-bfs
  items_title: 廣度優先四步
  items:
