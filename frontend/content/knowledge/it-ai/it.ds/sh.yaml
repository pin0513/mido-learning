  heading: 把路網變成一張圖
  body:
  - 科技領綱高中學「重要資料結構的概念與應用。」，說明包含「圖的表示法。」和「樹與圖於問題解決之應用。」；也學「演算法效能分析。」，說明包含「時間複雜度的概念」。學習表現要「能應用運算思維評估解題方法的優劣。」
  - Open Data Structures 說，廣度優先搜尋很適合用來算最短路徑：「A particularly useful application of the breadth-first-search algorithm is, therefore, in computing shortest paths.」
