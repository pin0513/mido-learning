verify_notes:
- 原有待核對「108 課綱科技領域在生成式 AI 普及前公布，涉及生成式 AI 的內容屬延伸。國中資訊科技主題名稱與高中加深加廣選修名稱，上線前請以教育部科技領域課綱核對。」已處理：本點的代碼與文字逐條對照科技領域課綱（教育部 107 年 9 月 20 日發布）原文，頁碼是頁腳印的頁碼（比 PDF 頁少 4）；本點不引用高中加深加廣選修。涉及 AI 的內容另依教育部《未來人才AI能力圖像》（115 年）與注意事項（學生版），不寫成課綱內容。
- 原有待核對「國小沒有獨立科技領域；資訊教育以議題融入與彈性學習課程實施，此落點待核對。」已處理：國家教育研究院參考說明 p.1 確認「國民小學教育階段則是採用議題融入各領域學習課程/彈性學習課程中實施。」；年級依參考說明的學習階段與總綱 p.7（三、四年級為第二學習階段，五、六年級為第三學習階段）。參考說明頁碼是頁腳印的頁碼（比 PDF 頁少 2），議題融入說明手冊頁碼是頁腳印的頁碼（比 PDF 頁少 16），總綱頁碼是頁腳印的頁碼（比 PDF 頁少 4）。
- 參考說明的「資議」代碼（例如資議 t-Ⅱ-3）與議題融入說明手冊的「資 E」代碼不是部定課綱代碼，也不合 schema 的代碼格式，只在來源 supports 逐字引用，不列入 curriculum_108 和代碼表；參考說明自述「本說明係為參考性質」。國小因此不列 curriculum_108 學習內容，只在 Why 列出國中、高中會接著學的科技領綱代碼。
- 國小沒有科技領域，curriculum_108.domains 改填社會（本站建議）：議題融入說明手冊 p.87 說「建議融入之領域/科目：例如科技領域等，其他相關領域亦可適切融入。」，並舉社會領域「例如可探討資訊科技相關之法律、倫理及社會議題，以保護自己與尊重他人。」；原稿的綜合活動沒有對應的官方融入例子，已刪除。
- 核心素養依總綱 p.4–6 國民小學教育的 E-B2、E-C1 原文挑選（總綱表格窄欄分散對齊，字距大，文字已用頁面影像核對）。
- 原有待核對「UNESCO 2024 學生與教師 AI 素養框架的面向名稱與進階層次待核對。」已處理：本點不引用 UNESCO 框架，AI 相關內容改依教育部《未來人才AI能力圖像》（115 年）和注意事項（學生版）。
- 《未來人才AI能力圖像》的編號（例如 A-1-I-1）是該文件自己的編碼，I、II 分別是國小、國中，不是 108 課綱代碼，只在來源引用；頁碼是頁腳印的頁碼（比 PDF 頁少 1），文字已用頁面影像核對。
- 原稿的核心素養 A2 改成 C1：本點談個資保護和網路禮儀，對應總綱 E-C1 的「理解並遵守社會道德規範」。
- 情境卡由家長準備，演一演只在家人之間（本站建議）；個人資料的例子依教育部注意事項（學生版）六（三）。
