est_time:
  school: 國小三、四年級（議題融入）
  source: es-ref
why:
  heading: 保護自己，也尊重別人
  body:
  - 國家教育研究院的參考說明，三、四年級要「領會資訊倫理的重要性。」，學習內容包含「資訊安全的基本概念。」，說明列出「網路病毒防治、智慧財產權、個人資料保護、網路詐騙等」，也要介紹「媒體識讀、網路禮儀、網路著作權等。」
  - 教育部《未來人才AI能力圖像》國小階段要「具備個資保護意識，不洩露自己或他人的隱私資訊」，並「引導學生理解AI產出並非絕對正確」。議題融入說明手冊也列出「了解並遵守資訊倫理與使用資訊科技的相關規範。」
  items_title: 國中會接著學
  items:
  - title: 個人資料保護
    text: 科技領綱 資 H-IV-1：個人資料保護。
    code: 資 H-IV-1
  checklist_title: 開始前先確認
  checklist:
  - 知道自己的名字
  - 知道找誰幫忙
  notes:
  - 國小沒有部定的資訊科技課程，資訊教育是融入各領域實施的議題；國小的學習重點出自國家教育研究院的參考說明，只寫在來源裡。本頁列的代碼開頭的「資」是科技領綱（國中、高中）的資訊科技學習內容，中間的 IV 是第四學習階段（國中）、V 是第五學習階段（高中），代表之後會接著學。
  sources:
  - es-ref
  - moe-ai-portrait
  - issues-handbook
  - tech108
  - zonggang
how:
  heading: 演一演，說出做法
  body:
  - 家長準備幾張情境卡，例如：遊戲裡有陌生人要你的照片；有人傳來寫著中獎的連結；AI 給了一個奇怪的答案。孩子抽一張，說出會怎麼做，再和家長演一演（本站建議）。
  - 安全的做法有三個重點：個人資料不給、遇到怪怪的事先告訴大人、AI 的回答不直接相信（本站整理）。教育部注意事項（學生版）也說，AI 的回答「不宜直接採信」。
  qa:
    question: 哪些資料是「只屬於你」、不能隨便給的？
    answer: 姓名、照片、聯絡方式、住址、學號都是個人資料。教育部注意事項（學生版）說「不可以將自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料…輸入至『生成式人工智慧』工具。」給陌生人也一樣不行（本站建議）。
    source: genai-student
  items_title: 安全三步
  items:
  - title: 個資不給
    text: 姓名、照片、住址不給陌生人。
  - title: 告訴大人
    text: 怪怪的事先告訴家長。
  - title: 不急著信
    text: AI 的回答要再查證。
  checklist_title: 每次做完勾一下
  checklist:
  - 說出個資
  - 說出做法
  - 會找大人
  activity_figure: safe-flow
  sources:
  - genai-student
what:
  heading: 會保護個資，也會求助
  body:
  - 學完後，孩子能說出哪些是個人資料、遇到可疑的要求會拒絕並告訴大人，也知道 AI 的回答不一定對。
  items_title: 學完能做到
  items:
  - title: 認出個資
    text: 說出哪些是個人資料。
  - title: 拒絕與求助
    text: 可疑的要求先拒絕、告訴大人。
  - title: 不急著信 AI
    text: AI 的回答要再查證。
  checklist_title: 家長檢核
  checklist:
  - 認得出個資
  - 會拒絕
  - 會求助
  figures:
  - safe-compare
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - genai-student
