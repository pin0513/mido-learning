  exercise: 目標：說出哪些是不能隨便給的個人資料（例如姓名、照片、住址），並對每張情境卡說出安全的做法，包含拒絕、告訴大人和不急著相信 AI 的回答。　檢核：孩子說得出幾種不能隨便給的個人資料；每張情境卡都說出安全的做法；也說得出 AI 的回答要再問大人或查證；三件事都做到。
