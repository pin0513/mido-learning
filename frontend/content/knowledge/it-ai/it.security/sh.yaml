verify_notes:
- 原有待核對「108 課綱科技領域在生成式 AI 普及前公布，涉及生成式 AI 的內容屬延伸。國中資訊科技主題名稱與高中加深加廣選修名稱，上線前請以教育部科技領域課綱核對。」已處理：本點的代碼與文字逐條對照科技領域課綱（教育部 107 年 9 月 20 日發布）原文，頁碼是頁腳印的頁碼（比 PDF 頁少 4）；本點不引用高中加深加廣選修。涉及 AI 的內容另依教育部《未來人才AI能力圖像》（115 年）與注意事項（學生版），不寫成課綱內容。
- 運算思維學習表現（運 a-V-1）的代碼開頭是中文字加小寫字母，schema 的 curriculum_108.performances 只收數字開頭的代碼，所以只在項目的 code 引用（已加進代碼表），curriculum_108 只列資訊科技學習內容。
- 核心素養依科技領綱 p.3–4 的 科S-U-B2、科S-U-C1 原文挑選（表格窄欄，文字已用頁面影像核對）。
- 科技領綱只說高中資訊科技部定必修 2 學分、「建議依學期開設」（p.2），沒有指定年級，所以 stage 不填 grades；est_time 寫高中資訊科技必修課。
- 原 ai.delegable「產生釣魚信範例供練習辨識」改成請 AI 解釋加密和雜湊（本站建議）：釣魚信範例由老師事先準備虛構版本，不讓學生用 AI 產生詐騙內容。
- 原 scenario 的公開金鑰比喻刪除（本頁沒有教公開金鑰，也找不到合適的來源），改教網站用雜湊保存密碼（OWASP）。
- 原 human_experience「建立自己的安全習慣、幫家人檢查帳號」改成和家人一起設定強密碼，不查看他人帳號（本站建議）。
- 原稿的核心素養 A2 改成 C1：本點重在數位公民的安全習慣與責任，對應科S-U-C1。
- 科技領綱高中必修沒有獨立的資訊安全學習內容；本點依 資 H-V-2 的說明「資訊科技對個人隱私的保護方法。」和 運 a-V-1。
- 凱薩密碼最多 25 種位移是本站整理（英文字母 26 個，扣掉不移動）；破綻數是示意。
- 教育部《高級中等以下學校人工智慧使用和學習指引》（115 年 6 月 5 日核定）頁碼是頁腳印的頁碼（與 PDF 頁相同）；該 PDF 網站缺中繼憑證，下載時要略過憑證檢查。
