how:
  heading: 加密、破解、辨識釣魚
  body:
  - 凱薩密碼：把每個字母往後移固定幾位，例如移 3 位，A 變 D、B 變 E，知道移幾位的人才能解回。但英文字母只有 26 個，位移最多 25 種，逐一試就能破解，所以真正的加密要用夠長、猜不到的金鑰（本站整理）。
  - 網站保存密碼不該用加密，而要用雜湊：OWASP 說雜湊是「a one-way function」，不像加密可以用金鑰解回原文；攻擊者拿到雜湊值也不能拿來登入；但太簡單的密碼仍可能被一個個試出來，所以密碼要夠長（本站整理）。最後看老師準備的虛構釣魚信，圈出急迫的語氣、要你登入或提供個資、可疑的寄件人或連結；只在紙上圈，不點連結（本站建議）。
  qa:
    question: 為什麼網站不應該知道你的密碼原文？
    answer: 因為網站一旦被入侵，存著原文的密碼會全部外洩，你在別的網站用同一組密碼也會跟著危險；只存雜湊值，登入時比對雜湊就好，網站不需要知道原文（本站整理）。OWASP 說，攻擊者即使拿到雜湊後的密碼，「they cannot use it to log in as the victim.」
    source: owasp-pw
  items_title: 資安四步
  items:
  - title: 凱薩加密
    text: 每個字母移固定位數。
  - title: 逐一破解
    text: 試遍所有位移就能解。
  - title: 雜湊存密碼
    text: 網站不存密碼原文。
  - title: 圈出破綻
    text: 找出釣魚信的破綻。
  checklist_title: 每次做完勾一下
  checklist:
  - 加解密正確
  - 說出雜湊
  - 圈出破綻
  activity_figure: security-flow
  sources:
