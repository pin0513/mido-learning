what:
  heading: 懂加密，也防得了釣魚
  body:
  - 學完後，學生能用凱薩密碼加密和破解，說出它為什麼不安全、網站為什麼只存密碼的雜湊值，也能在釣魚訊息裡找出破綻，不點可疑連結。
  items_title: 學完能做到
  items:
  - title: 加密與破解
    text: 說出凱薩密碼的弱點。
  - title: 雜湊
    text: 說出網站不存原文的理由。
  - title: 辨識釣魚
    text: 找出破綻，不點連結。
  checklist_title: 家長檢核
  checklist:
  - 會加解密
  - 說得出雜湊
  - 找得出破綻
  figures:
  - security-compare
  notes:
  - 本頁的釣魚信是老師準備的虛構範例。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  sources:
  - moe-ai-guide
  - genai-student
