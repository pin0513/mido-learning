why:
  heading: 保護資料，也保護自己
  body:
  - 科技領綱高中學「個人資料的保護。」，說明包含「資訊科技對個人隱私的保護方法。」；學習表現要「能實踐健康適切的數位公民生活。」
  - 教育部的指引提醒學生「不隨意下載來路不明的程式、不點擊可疑連結、不在公共電腦儲存帳號密碼」。
