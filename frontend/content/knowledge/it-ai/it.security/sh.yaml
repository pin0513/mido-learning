scenario: 在紙上用凱薩密碼加密一句話，請同學逐一試位移來破解；再討論網站為什麼只該存密碼的雜湊值；最後看老師準備的一封虛構釣魚信範例，圈出破綻（不點任何連結、不輸入真實帳號密碼，本站建議）。
formats:
  slides: []
  exercise: 目標：用凱薩密碼加密並破解一句話，說出為什麼最多試 25 種位移就能破解；說出加密和雜湊的差別；在虛構的釣魚信範例圈出至少 3 個破綻（25 種是本站整理，破綻數是示意）。　檢核：加密和解密都正確；說得出凱薩密碼為什麼容易破解；說得出網站存雜湊值、不存原文的理由；圈出的破綻包含急迫語氣或要求個資；四件事都做到。
