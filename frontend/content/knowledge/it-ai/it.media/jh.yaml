est_time:
  school: 國中七、八年級資訊科技課
  source: tech108
why:
  heading: 看得出、查得到、用得對
  body:
  - 科技領綱七年級學「資訊科技合理使用原則。」，說明包含「創用 CC。」；八年級學「媒體與資訊科技相關社會議題。」和「資訊倫理與法律。」；學習表現要「能了解資訊科技相關之法律、倫理及社會議題，以保護自己與尊重他人。」
  - 教育部《未來人才AI能力圖像》國中階段要「具備辨識 AI 生成內容的基本能力，防範假訊息傳播。」，也要能識別 AI 的錯誤資訊，「並習慣交叉比對具代表性資料庫。」
  items_title: 科技領綱的學習重點
  items:
  - title: 法律倫理與社會議題
    text: 科技領綱 運 a-IV-2：能了解資訊科技相關之法律、倫理及社會議題，以保護自己與尊重他人。
    code: 運 a-IV-2
  - title: 合理使用原則
