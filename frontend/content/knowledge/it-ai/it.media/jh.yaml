how:
  heading: 先猜，再查證
  body:
  - 家長先準備幾組材料，記下每一張的來源；孩子不自己用 AI 生成。孩子先猜哪一個是 AI 做的，說出線索，例如手指、文字、光影怪怪的（本站整理）。光看外表可能猜錯，所以接著要查證（本站整理）。
  - 查證兩招：查來源（誰發布的、什麼時候），交叉比對（其他可信的資料怎麼說）（本站整理）。分享或使用前，要標示哪些是 AI 生成的，也要看作品的授權，例如創用 CC（本站建議）。
  qa:
    question: 如果看不出真假，你還能怎麼判斷要不要相信？
    answer: 看不出來時，就查來源和交叉比對；查不到可靠來源，就先不相信、不分享（本站整理）。《未來人才AI能力圖像》國中階段要能識別 AI 的錯誤資訊，「並習慣交叉比對具代表性資料庫。」
    source: moe-ai-portrait
  items_title: 查證四步
  items:
  - title: 先猜
    text: 說出覺得是 AI 的線索。
  - title: 查來源
    text: 誰發布、什麼時候。
  - title: 交叉比對
    text: 看其他可信資料怎麼說。
  - title: 再決定
    text: 查不到來源就不分享。
  checklist_title: 每次做完勾一下
  checklist:
  - 說出線索
  - 查了來源
  - 交叉比對過
  activity_figure: media-flow
  sources:
  - moe-ai-portrait
what:
  heading: 會查證，也尊重創作
  body:
  - 學完後，孩子能說出判斷 AI 生成內容的線索、用查來源和交叉比對查證，也知道分享前要標示 AI 生成、尊重創作者的授權。
  items_title: 學完能做到
  items:
  - title: 查證
    text: 查來源、交叉比對。
  - title: 標示
    text: 說明哪些是 AI 生成。
  - title: 尊重授權
    text: 使用前看作品的授權。
  checklist_title: 家長檢核
  checklist:
  - 會查證
  - 會標示
  - 會看授權
  figures:
  - media-compare
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - moe-ai-portrait
  - genai-student
