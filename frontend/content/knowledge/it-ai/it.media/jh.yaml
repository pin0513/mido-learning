idea: AI 可以生成很像真的圖片和文字；看不出真假時，就查來源、交叉比對，分享和使用前也要標示與尊重授權（本站整理）。
guiding_questions:
- 如果看不出真假，你還能怎麼判斷要不要相信？
scenario: 親子共學：家長事先準備幾組圖片或短文（有的是 AI 生成、有的不是，來源都記下來），孩子不自己生成，先猜哪個是 AI 做的，再一起查來源、比對其他資料，討論分享前該做什麼（本站建議）。
formats:
  slides: []
  exercise: 目標：對家長準備的圖片或短文，說出判斷是不是 AI 生成的線索，並用查來源、交叉比對兩種方法查證；說出分享或使用別人的作品前要注意什麼。　檢核：孩子對每組材料說出判斷線索；用了查來源和交叉比對兩種方法；也說得出要標示 AI 生成、尊重創作者的授權；三件事都做到。
