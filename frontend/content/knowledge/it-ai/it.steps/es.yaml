est_time:
  school: 國小三、四年級（議題融入）
  source: es-ref
why:
  heading: 說清楚，電腦才做得對
  body:
  - 國家教育研究院的參考說明，國小三、四年級的資訊教育要「認識以運算思維解決問題的過程。」，學習內容的說明是「以圖表或語言，描述日常生活或課業問題的簡單解決步驟。」議題融入說明手冊也列出「應用運算思維描述問題解決的方法。」
  - CS Unplugged 說，電腦需要非常具體的指令：「They need to be told each of the tiny steps they need to follow in order to do things.」
  items_title: 國中會接著學
  items:
  - title: 演算法基本概念
    text: 科技領綱 資 A-IV-1：演算法基本概念。
    code: 資 A-IV-1
  checklist_title: 開始前先確認
  checklist:
  - 分得清左右
  - 會數格子
  notes:
  - 國小沒有部定的資訊科技課程，資訊教育是融入各領域實施的議題；國小的學習重點出自國家教育研究院的參考說明，只寫在來源裡。本頁列的代碼開頭的「資」是科技領綱（國中、高中）的資訊科技學習內容，中間的 IV 是第四學習階段（國中）、V 是第五學習階段（高中），代表之後會接著學。
  sources:
  - es-ref
  - issues-handbook
  - cs-ct
  - tech108
  - zonggang
how:
  heading: 寫指令卡，照著走
  body:
  - 在方格紙上畫起點和終點，放一個小玩偶。孩子用「前進」「左轉」「右轉」三種指令卡排出步驟；移動前，先讓孩子預測玩偶會停在哪一格；家長只照卡片移動玩偶，不幫忙猜（本站建議）。
  - 走錯了就從第一張卡開始，一張一張照著走，看玩偶在哪一步走偏。CS Unplugged 的 Kidbots 活動說，孩子要能「Identify where a bug has occurred and be able to correct the code to allow the object to move to the desired destination.」
  qa:
    question: 指令出錯時，怎麼找到是哪一步錯了？
    answer: 從第一張卡開始，一張一張照著走，看玩偶在哪一步偏離路線，就是那張卡錯了（本站整理）。CS Unplugged 說，孩子要「step through each instruction and identify when something goes wrong」。
    source: cs-kidbots-about
  items_title: 寫指令四步
  items:
  - title: 畫起點終點
    text: 在方格紙上畫出起點和終點。
  - title: 排指令卡
    text: 用前進、左轉、右轉排出步驟。
  - title: 照卡片走
    text: 家長只照卡片移動玩偶。
  - title: 找錯改好
    text: 走錯時一張一張檢查，改掉錯的卡。
  checklist_title: 每次做完勾一下
  checklist:
  - 指令有順序
  - 玩偶到終點
  - 找到錯的卡
  activity_figure: steps-flow
  sources:
  - cs-rescue
  - cs-kidbots-about
what:
  heading: 指令清楚，也會除錯
  body:
  - 學完後，孩子能把一件事寫成有順序的指令，讓玩偶照著走到終點；走錯時能一步一步檢查，找出並改好錯的那一步。
  items_title: 學完能做到
  items:
  - title: 寫出指令
    text: 照順序寫出每一步。
  - title: 先預測
    text: 走之前先說玩偶會停在哪。
  - title: 找錯改好
    text: 找出錯的那一步並改好。
  checklist_title: 家長檢核
  checklist:
  - 說得出步驟
  - 會先預測
  - 會改錯
  figures:
  - steps-compare
  notes:
  - 本頁的方格和步數是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - cs-ct
  - genai-student
