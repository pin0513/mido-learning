- 「去洗手」對電腦來說，要拆成幾個步驟？
- 指令出錯時，怎麼找到是哪一步錯了？
scenario: 親子共學：在方格紙上放一個小玩偶，孩子用「前進」「左轉」「右轉」寫指令卡，家長只照卡片移動玩偶，看它能不能走到終點；走錯了就一起找出錯的那一步（本站建議）。
