what:
  heading: 懂封包，也懂隱私
  body:
  - 學完後，孩子能說出訊息會切成封包、靠位址和編號傳到對方再拼回，也知道訊息沿路可能被看到，個人資料不要隨便傳。
  items_title: 學完能做到
  items:
  - title: 封包
    text: 訊息切成小塊傳送。
  - title: 位址
    text: 每台裝置有自己的位址。
  - title: 隱私
    text: 訊息沿路可能被看到。
  checklist_title: 家長檢核
  checklist:
  - 說得出封包
  - 說得出位址
  - 說得出隱私
  figures:
  - network-compare
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - mdn-dns
  - genai-student
