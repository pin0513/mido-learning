why:
  heading: 訊息怎麼跑過網路
  body:
  - 科技領綱九年級學「網路技術的概念與介紹。」和「網路服務的概念與介紹。」，說明包含「網際網路的重要概念。」；學習表現要「能了解資訊系統的基本組成架構與運算原理。」
  - MDN 說，網際網路「is a large network of computers which communicate all together.」；封包是「a formatted chunk of data sent over a network.」
  items_title: 科技領綱的學習重點
