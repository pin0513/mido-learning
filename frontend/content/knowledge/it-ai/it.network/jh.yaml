how:
  heading: 拆成紙條，照號碼拼回
  body:
  - 把一句話拆成 4 張紙條（張數是示意），每張寫上寄件人、收件人和第幾張。MDN 說封包裡有「network addresses for the source and destination, sequencing information」。紙條經過家人一個傳一個送到收件人，收件人照編號拼回句子。真正的網路上，寄件人和收件人是每台裝置的 IP 位址；我們打的網址（例如 mozilla.org）會先換成 IP 位址（本站整理）。
  - 故意弄丟一張：收件人看編號就知道少了哪一張，可以請寄件人重傳（本站整理）。再想一想：傳紙條的人都看得到內容，所以重要的訊息要用加密的服務，個人資料不要隨便傳（本站整理）。
  qa:
    question: 你傳出去的訊息，真的只有對方看得到嗎？
    answer: 不一定。訊息會經過很多台設備才到對方手上；就像傳紙條，沿路的人可能看得到，所以重要的內容要用加密的服務，個人資料不要隨便傳（本站整理）。MDN 說網際網路由很多網路連在一起：「The Internet consists of this whole infrastructure of networks.」
    source: mdn-internet
  items_title: 封包四步
  items:
  - title: 切成小塊
    text: 一句話拆成編號紙條。
  - title: 寫上位址
    text: 寄件人、收件人、第幾張。
  - title: 一站一站傳
    text: 經過家人傳到終點。
  - title: 照號碼拼回
    text: 少了就請對方重傳。
  checklist_title: 每次做完勾一下
  checklist:
  - 句子拼對
  - 找到少的那張
  - 說出誰看得到
