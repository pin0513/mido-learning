idea: 用程式或試算表分析開放資料，提出有證據的觀點；同時注意授權、個資和資料是否具代表性，也分清楚相關和因果（本站整理）。
guiding_questions:
- 資料說的是「發生了什麼」，還是「為什麼發生」？
scenario: 從政府資料開放平臺（data.gov.tw）選一份不含個人資料的資料集，先讀授權條款，再用試算表或程式整理、畫圖，做成一頁報告：寫出發現、標示資料來源，並說明資料的限制（本站建議）。
formats:
  slides: []
  exercise: 目標：選一份不含個人資料的開放資料，依授權條款標示資料來源，做出一張圖和一頁報告，寫出一個有證據的發現和兩個限制（例如代表性、相關不等於因果）。　檢核：報告有資料來源和授權標示；沒有出現能認出個人的資料；限制寫到代表性或相關不等於因果；說明發現時沒有把相關寫成因果；四件事都做到。
