why:
  heading: 用資料說話，也守規矩
  body:
  - 科技領綱高中學「資訊科技的合理使用原則。」，說明包含「數位作品的授權。」；也學「個人資料的保護。」，說明包含資訊科技「對個人隱私之影響。」學習表現要「能整合資訊科技進行有效的溝通表達。」
  - 政府資料開放授權條款規定，使用開放資料要「明確標示原資料提供機關之相關聲明」。
  items_title: 科技領綱的學習重點
  items:
  - title: 有效的溝通表達
    text: 高中科技領綱 運 p-V-1：能整合資訊科技進行有效的溝通表達。
    code: 運 p-V-1
  - title: 合理使用原則
    text: 高中科技領綱 資 H-V-1：資訊科技的合理使用原則。
    code: 資 H-V-1
  - title: 個人資料的保護
    text: 高中科技領綱 資 H-V-2：個人資料的保護。
    code: 資 H-V-2
  checklist_title: 開始前先確認
  checklist:
  - 會用試算表
  - 畫過統計圖
  notes:
  - 代碼開頭的「資」是科技領綱的資訊科技學習內容，「運」是運算思維的學習表現；中間的 V 是第五學習階段（高中），本頁只列高中必修的條目，不含標「※」的加深加廣選修。
  sources:
  - tech108
  - datagov-license
how:
  heading: 選資料、畫圖、寫限制
  body:
  - 先在資料集頁面看授權方式：採用政府資料開放授權條款的資料可以自由利用，但報告要照條款附件的顯名聲明標示來源。再檢查欄位，有姓名、電話這類能認出個人的資料就換一份（本站建議）。
  - 整理資料、畫一張圖，寫出一個發現；再寫限制：資料涵蓋誰、漏了誰（代表性），以及兩件事一起變化不代表一件造成另一件（本站整理）。澳洲統計局提醒，常有人誤以為「because the data shows a correlation that there is necessarily an underlying causal relationship.」
  qa:
    question: 資料說的是「發生了什麼」，還是「為什麼發生」？
    answer: 多半只說得出發生了什麼：資料能顯示兩件事一起變化（相關），要說為什麼發生，還得排除其他原因或另外設計研究（本站整理）。澳洲統計局說，因果是統計中「commonly misunderstood and misused」的部分。
    source: abs-corr
  items_title: 分析四步
  items:
  - title: 看授權
    text: 照顯名聲明標示來源。
  - title: 查個資
    text: 有能認出個人的資料就換。
  - title: 畫圖找發現
    text: 寫出一個有證據的發現。
  - title: 寫限制
    text: 代表性、相關不等於因果。
  checklist_title: 每次做完勾一下
  checklist:
  - 標示來源
  - 沒有個資
  - 寫出兩個限制
  activity_figure: analysis-flow
  sources:
  - datagov-license
  - abs-corr
what:
  heading: 會分析，也會說限制
  body:
  - 學完後，學生能合法使用開放資料並標示來源、避開個人資料，用圖表提出一個有證據的發現，並寫出資料的限制，不把相關說成因果。
  items_title: 學完能做到
  items:
  - title: 標示來源
    text: 依授權條款標示。
  - title: 保護個資
    text: 不用能認出個人的資料。
  - title: 說出限制
    text: 分清相關和因果。
  checklist_title: 家長檢核
  checklist:
  - 來源有標示
  - 沒有個資
  - 限制寫清楚
  figures:
  - analysis-compare
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  sources:
  - abs-corr
  - genai-student
  - moe-ai-guide
