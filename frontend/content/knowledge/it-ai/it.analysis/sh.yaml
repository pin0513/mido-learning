  supports: 學習重點：運 p-V-1「能整合資訊科技進行有效的溝通表達。」（p.7）；資 H-V-1「資訊科技的合理使用原則。」（p.11）；資 H-V-2「個人資料的保護。」（p.11）；資訊科技學習內容說明「高級中等學校教育階段則更重視整合運用，藉由資訊科學的初步探索，讓學生進一步理解運算思維之相關原理，以培養整合資訊科技與運算思維以有效解決問題之能力。」（p.10）；時間分配「高級中等學校教育階段資訊科技與生活科技之部定必修課程各為 2 學分，建議依學期開設，採資訊科技與生活科技上下學期對開，每週連排 2 節課。」（p.2）；資 H-V-1 說明「數位作品的授權。」（p.46）；資 H-V-2 說明「資訊科技（如網路、社交媒體、巨量資料、行動裝置、網路銀行與政府等）對個人隱私之影響。」、「資訊科技對個人隱私的保護方法。」（p.46）；核心素養：科S-U-A2「運用科技工具與策略進行系統思考與分析探索，並有效解決問題。」（p.3）；科S-U-B2「理解科技與資訊的原理及發展趨勢，整合運用科技、資訊及媒體，並能分析思辨人與科技、社會、環境的關係。」（p.4）
