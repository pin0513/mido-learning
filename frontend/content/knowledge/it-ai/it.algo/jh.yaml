how:
  heading: 猜數字，再排撲克牌
  body:
  - 猜數字：家長心裡想一個 1 到 100 的數，孩子每次猜範圍的中間，家長只說太大或太小。每猜一次，剩下的數最多只有一半：100 個數縮成最多 50、25、12、6、3、1 個，所以第 7 次一定猜中（本站整理）。
  - 排序：拿 8 張牌，先試每次找出最小的放到左邊，記下比了幾次；再試一張一張插到已排好的位置（本站整理）。比一比哪種比較次數少，換一副牌再試（牌數是示意）。
  qa:
    question: 猜 1 到 100 的數字，每次都猜中間，最多要猜幾次？
    answer: 最多 7 次：每猜一次，剩下的數最多只有一半，100 個數猜 6 次後只剩 1 個，第 7 次一定猜中（本站整理）。CS Unplugged 說，二分搜尋「eliminates half the items we are searching every time we look at an item」。
    source: cs-search-about
  items_title: 演算法四步
  items:
