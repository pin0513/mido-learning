verify_notes:
- 核心素養 A2、A3：依總綱 p.4–6 國民中學教育的 J-A2、J-A3 與綜合活動領綱 p.3 的綜-J-A2、綜-J-A3，自然科學領綱 p.4–5 的自-J-A2原文確認（表格窄欄分散對齊，字距大，文字用 pdftotext 原始順序層與頁面文字塊核對）。
- stage.grades 填 7、8、9：本點的代碼都是第四學習階段（IV），國中的學習重點沒有再分年級；總綱 p.7 說國民中學七、八、九年級為第四學習階段。
- est_time 依綜合活動領綱 p.2：第四學習階段綜合活動每週 3 節課；本點建議在綜合活動課上做，也可以親子一起練（本站建議）。
- 頁碼都是頁腳印的頁碼：綜合活動領綱與總綱比 PDF 頁少 4，自然科學領綱少 4；教育部學生版的 PDF 頁就是頁腳印的頁碼。
- 綜合活動 2c-IV-1、自然科學 pe-IV-1 都沿用代碼表的文字與頁碼。
- 健康與體育領綱也有同號的學習表現：1b-IV-2、2a-IV-1、2a-IV-3、2c-IV-1（健體 p.26），文字和綜合活動不同；健體不在代碼表，代碼表以代碼為鍵，將來要收健體要先改 schema（taxonomy 的綜合活動區塊加了註解）。健體的學習內容 Da-IV-1、Db-IV-1（健體 p.28）沒有科目字首，本點的家 Da-IV-1、輔 Db-IV-1 帶字首，鍵不衝突。
- 原 curriculum_108.domains 是綜合活動、科技；本點引的是自然科學 pe-IV-1（計劃適當次數的測試、預測活動的可能結果），科技領綱沒有對應計畫、測試、檢討改進的條目被引用，所以科技改成自然科學。
- 標題維持 PDCA（原稿）。CMS、AHRQ 的工具都寫成 PDSA（Study），第三步看結果、和預測比較；本頁把兩種寫法當成同一個循環教，並在 How 說明（本站整理）。Act 依 CMS 寫成 Adopt、Adapt、Abandon（保留、修改或放棄）。
- 原 review 的兩週紀錄表、P 欄、C 欄、A 欄保留；goal、review、What 的兩週都標成天數是示意。
- 原 scenario「親子共學：親子各跑一輪自己的 PDCA（孩子：讀書方法；大人：運動或睡眠），兩週後互相報告數字。」保留做法，補上本站建議。
- 原 ai.delegable「整理紀錄、畫成圖表」補上由老師或家長操作（本站建議），並在 What 加上教育部注意事項（學生版）的使用規則。
- 原有草稿說明「課綱對應只到領域、核心素養與議題…」已處理：本點已逐條對照官方領綱與議題融入說明手冊原文（頁碼見來源）。
- 原有草稿說明「引用的框架只寫名稱（PDCA 循環）…」已處理：依美國聯邦醫療保險與補助服務中心（CMS）QAPI 的 PDSA 範本與 AHRQ 健康識能工具包的 PDSA 說明改寫，英文短句逐字引用（頁碼見來源），中文說明是本站整理。
- 原 link_notes 的跨學門提示改寫成 ph.hypothesis 加標題，拿掉長引號。CMS、AHRQ 的工具是寫給醫療照護機構的；本點用在國中生改善讀書、作息（本站建議）。
- 英文網頁的引文取自 2026-10-30 讀取的網頁；只取不含彎引號、撇號的句子或片段；中文說明和翻譯是本站整理。
