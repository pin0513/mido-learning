idea: PDCA 是一個改進循環：計畫（要試什麼、怎麼量）、執行、檢查（用數字比較前後）、改進（保留、修改或放棄）。它跟科學實驗很像：先有假設，再用結果檢驗。
guiding_questions:
- 你怎麼知道新的讀書方法真的比較有效？
scenario: 親子共學：親子各跑一輪自己的 PDCA（孩子：讀書方法；大人：運動或睡眠），兩週後互相報告數字。
goal: 用兩週跑一輪 PDCA，用數字檢查辦法有沒有效，再決定怎麼改。
review: 交一張兩週的 PDCA 紀錄表：P 欄寫清楚要量什麼、C 欄有前後的數字、A 欄寫出下一輪要改什麼；家長檢查 C 欄真的有數字。
