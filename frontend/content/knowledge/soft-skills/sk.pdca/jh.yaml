why:
  heading: 先小小試，再看數字
  body:
  - 綜合活動課綱要國中生「善用各項資源，妥善計畫與執行個人生活中重要事務。」核心素養也提到要「檢核、評估學習及生活計畫」。自然科學課綱則要學生「計劃適當次數的測試、預測活動的可能結果。」
  - 美國聯邦醫療保險與補助服務中心（CMS）的改善範本有一個先問的問題：「How will we know that change is an improvement (measures)?」，也就是先想好用什麼數字判斷有沒有變好（翻譯是本站整理）。美國醫療研究與品質局（AHRQ）也說，這個方法是「a way to test a change that is implemented.」，用來檢驗一個改變（翻譯是本站整理）。
  qa:
    question: 你怎麼知道新的讀書方法真的比較有效？
    answer: 先決定要量什麼，例如每天小考的對題數；試之前先記下原本的數字，試完再比較（例子是本站建議）。CMS 的範本在計畫時就要問「What data need to be collected?」，也就是要收集哪些資料（翻譯是本站整理）。
    source: cms-pdsa
  items_title: 課綱的學習重點
  items:
  - title: 計畫與執行重要事務
    text: 綜合活動 2c-IV-1：善用各項資源，妥善計畫與執行個人生活中重要事務。
    code: 2c-IV-1
  - title: 計劃測試、預測結果
    text: 自然科學 pe-IV-1：能辨明多個自變項、應變項並計劃適當次數的測試、預測活動的可能結果。在教師或教科書的指導或說明下，能了解探究的計畫，並進而能根據問題特性、資源（例如：設備、時間）等因素，規劃具有可信度（例如：多次測量等）的探究活動。
    code: pe-IV-1
  checklist_title: 開始前先確認
  checklist:
  - 選一件想改的事
  - 準備紀錄表
  figures:
  - pdca-compare
  notes:
  - 綜合活動的代碼：數字開頭的是學習表現；開頭的家、輔是家政、輔導的學習內容；中間的 IV 是第四學習階段（國中七至九年級）。
  - 自然科學的代碼：小寫字母開頭的是學習表現（pa 分析與發現、pe 計劃與執行）；中間的 IV 是第四學習階段（國中七至九年級）。
  - 總綱把國民中學七、八、九年級定為第四學習階段，所以本頁代碼中間都是 IV。
  sources:
