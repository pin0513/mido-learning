what:
  heading: 用數字決定下一步
  body:
  - 學完後，能用兩週（天數是示意）跑一輪 PDCA：計畫時寫好要量什麼，檢查時用前後的數字比較，再決定下一輪要保留、修改或放棄。
  items_title: 學完能做到
  items:
  - title: 寫好計畫
    text: 要試什麼、量什麼。
  - title: 用數字檢查
    text: 有前後的數字。
  - title: 決定下一輪
    text: 保留、修改或放棄。
  checklist_title: 家長檢核
  checklist:
  - P 欄寫了要量什麼
  - C 欄有前後數字
  - A 欄寫了下一輪
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - genai-student
