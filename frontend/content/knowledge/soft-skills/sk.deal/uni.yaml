sources:
- id: pon-positional
  title: Positional Bargaining Pitfalls
  publisher: Program on Negotiation at Harvard Law School
  url: https://www.pon.harvard.edu/daily/negotiation-skills-daily/positional-bargaining-pitfalls/
  accessed: '2026-11-05'
  kind: reference
  supports: 引《Getting to Yes》：立場式談判是「each side takes a position, argues for it, and makes concessions to reach a compromise」；整理三個缺點：produces unwise agreements、is ineffective、harms the relationship；兩姊妹分柳橙的例子
- id: pon-interests
  title: 'Principled Negotiation: Focus on Interests to Create Value'
  publisher: Program on Negotiation at Harvard Law School
  url: https://www.pon.harvard.edu/daily/negotiation-skills-daily/principled-negotiation-focus-interests-create-value/
  accessed: '2026-11-05'
  kind: reference
  supports: 「Positions are surface-level statements. Beneath them lie interests—the underlying needs, motivations, and concerns driving those demands.」；聚焦需要而非立場，常能找到讓雙方都滿意的方案（often discover creative solutions that satisfy both sides）
- id: pon-integrative
  title: 'Expanding the Pie: Integrative versus Distributive Bargaining Negotiation Strategies'
  publisher: Program on Negotiation at Harvard Law School
  url: https://www.pon.harvard.edu/daily/negotiation-skills-daily/negotiation-skills-expanding-the-pie-integrative-bargaining-versus-distributive-bargaining/
  accessed: '2026-11-05'
  kind: reference
  supports: 改寫自《Getting to Yes》的整合式談判要素：「Focus on interests, not positions. Positions are demands (“$12,000 for the car”). Interests explain why (“I need funds quickly for a move”).」；「Invent options for mutual gain」；「Use objective criteria」
- id: pon-batna
  title: Translate Your BATNA to the Current Deal
  publisher: Program on Negotiation at Harvard Law School
  url: https://www.pon.harvard.edu/daily/batna/translate-your-batna-to-the-current-deal/
  accessed: '2026-11-05'
  kind: reference
  supports: 「BATNA stands for Best Alternative to a Negotiated Agreement. In plain terms, it is what you will do if you do not reach a deal.」
