link_notes: 框架：Fisher、Ury、Patton《Getting to Yes》的原則式談判（聚焦利益而非立場），經哈佛法學院談判研究計畫（PON）整理。準備 BATNA 在 sk.batna@sh；商業論證在 pm.business@uni；說服的界線在 sk.fairsale@uni。
