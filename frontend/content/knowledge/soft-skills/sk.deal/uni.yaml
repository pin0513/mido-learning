why:
  heading: 只談價格，常常兩邊都吃虧
  body:
  - 《Getting to Yes》描述立場式談判：「each side takes a position, argues for it, and makes concessions to reach a compromise」。PON 整理這本書的說法：這樣談容易得到不明智的協議、拖長時間，也傷害關係。
  - PON 也說，立場只是表面，底下是需要、動機和顧慮；把需要找出來，常能想出讓雙方都滿意的方案。
  qa:
    question: 對方說「價格沒得談」，你下一句要說什麼？
    answer: 先問為什麼：「這個價格對你們最重要的考量是什麼？」如果是年底要達標，也許可以談付款時間或採購數量；如果真的只能這樣，就回頭比你的 BATNA，決定接或不接。
    source: pon-interests
  items_title: 原則式談判的四件事
  items:
  - title: 問需要
    text: 從立場往下問「為什麼」。
  - title: 加條件
    text: 價格之外，再放交期、數量、付款一起談。
  - title: 用標準
    text: 用市價、行情這類雙方都認的標準。
  - title: 寫下來
    text: 把談好的事寫成雙方確認的協議。
  sources:
  - pon-positional
  - pon-interests
  - pon-integrative
how:
  heading: 探詢、組合、比較、寫下
  body:
  - 開談先問，不急著出價；把聽到的需要寫下來，組成兩三個條件組合；每個組合都和自己的 BATNA 比；最後把結論寫成協議，請對方確認。（本站建議的順序）
  items:
  - title: 探詢
    example: 這次採購，最怕的是什麼？
    text: 問立場背後的需要。
  - title: 組合
    example: 價格不動，交期提前一週
    text: 把價格之外的條件一起放進來。
  - title: 比較
    example: 這個組合比另一家報價好
    text: 每個組合都和 BATNA 比。
  - title: 寫下
    example: 誰、做什麼、何時、多少錢
    text: 寫成協議，請對方書面確認。
  activity_figure: how-flow
  sources:
  - pon-integrative
  - pon-batna
what:
  heading: 立場不等於需要
  figures:
  - what-compare
  notes:
  - 立場是嘴上的要求（「一台車一萬二」）；需要是背後的原因（「搬家急著用錢」）。PON 用的例子是兩姊妹分一顆柳橙：一個要皮做蛋糕，一個要果汁，切一半兩人都只拿到一半。
  sources:
  - pon-positional
  - pon-integrative
