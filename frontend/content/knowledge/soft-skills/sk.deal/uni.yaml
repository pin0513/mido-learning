idea: 商業談判常卡在立場：「價格就是這樣」「低於這個不做」。往下問「為什麼」，常會找到不同的需要，例如一方要快、一方要穩定。把需要攤開，就能多放幾個條件一起談（交期、數量、付款方式），最後把談好的事寫成雙方都看得懂的協議。
guiding_questions:
- 對方說「價格沒得談」，你下一句要說什麼？
scenario: 親子共學：大人把一場工作上的談判（採購、合作、報價）改成家庭版，讓孩子扮演對方，只准問「為什麼」；結束後一起寫一份一頁的協議。
goal: 在一場真實的商業談判中，問出對方立場背後的需要，提出至少兩個條件組合，並寫下雙方確認的協議。
review: 完成一場真實的商業談判（接案報價、採購、社團贊助）：事前有 BATNA 和底線；紀錄裡至少三個「為什麼」的提問與回答、兩個條件組合；協議寫明誰、做什麼、何時、多少錢，並經對方書面確認。
