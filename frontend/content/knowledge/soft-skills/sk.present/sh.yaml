why:
  heading: 簡報是幫聽眾理解
  body:
  - 高中國語文課綱把「簡報」列為應用文本的學習重點，也要學會用「數據、圖表、圖片、工具列等輔助說明」。核心素養要高中生「善用科技、資訊與各類媒體所提供的素材」，整合資訊。
  - 一項 110 位工程系學生的研究發現：投影片標題寫成一句主張、內文用圖片或圖表當證據的組別，比照軟體預設條列式投影片的組別理解得更好、迷思更少。
  qa:
    question: 台下的人開始滑手機，是哪一張投影片出了問題？
    answer: 先看那一張：標題是不是只有幾個字的主題，而不是一句話說出重點？內文是不是一大段字，而你正在照著念？這篇研究引用多媒體學習的「重複原則」指出，講者念出投影片上的同一段文字，會讓聽眾同時讀和聽重複的內容，可能增加負擔。
    source: garner-alley
  items_title: 練好以後，可以
  items:
  - title: 會用簡報格式
    text: 以簡報、讀書報告、演講稿等格式與寫作方法為主。
    code: Be-V-3
  - title: 用圖表輔助
    text: 數據、圖表、圖片、工具列等輔助說明。
    code: Bc-V-3
  sources:
  - kuoyu
  - garner-alley
how:
  heading: 先結論、再重點、再結論
  body:
  - 麻省理工學院（MIT）溝通實驗室的建議：每張投影片先說關鍵訊息，再說你看到什麼、為什麼重要；開頭和結尾是最重要的時刻，可以先把第一張和最後一張要說的話寫下來；配合投影片說話，但不是照著念。
  - 本站把它整理成練習結構：開場一句結論 → 幾個重點（建議三個），每個配一個例子或數字 → 再說一次結論。
  items:
  - title: 開場說結論
    example: 我建議社團成果展改在週六。
    text: 第一張就說出你要聽眾記住的話。
  - title: 重點配證據
    example: 去年週五場只來了一半的人（附出席圖）。
    text: 標題一句話，內文放圖表或例子。
  - title: 結尾再說一次
    example: 所以，改到週六。
    text: 最後一張回到結論。
  activity_figure: how-flow
  sources:
  - mit-nse
  - garner-alley
