sources:
- id: kuoyu
  title: 十二年國民基本教育課程綱要 國民中小學暨普通型高級中等學校—語文領域－國語文
  publisher: 國家教育研究院（教育部 2018 發布）
  url: https://stv.naer.edu.tw/data/course_outline/pta_18510_4703638_59125.pdf
  accessed: '2026-10-28'
  kind: curriculum
  supports: 學習內容 Bc-Ⅴ-3「數據、圖表、圖片、工具列等輔助說明。」（p.17）、Be-Ⅴ-3「在學習應用方面，以簡報、讀書報告、演講稿、會議紀錄、劇本、小論文、計劃書、申請書等格式與寫作方法為主。」（p.18）；國 S-U-B2（p.4）
- id: garner-alley
  title: 'How the Design of Presentation Slides Affects Audience Comprehension: A Case for the Assertion–Evidence Approach'
  publisher: Joanna K. Garner & Michael Alley，International Journal of Engineering Education 29(6), pp.1564–1579（2013）
  url: https://www.ijee.ie/articles/Vol29-6/23_ijee2791ns.pdf
  accessed: '2026-10-28'
  kind: peer_reviewed
  supports: 110 位工程系學生的比較：採用「主張—證據」（assertion–evidence）投影片的組別，理解較好、迷思較少、認知負荷較低，延後測驗回憶較強（摘要 p.1564）；這種投影片用一句完整句子的標題說出主要訊息（p.1568）；講者照念投影片上的文字會造成重複（redundancy），可能增加額外認知負荷（p.1567，這段是論文引用多媒體學習理論的論證，不是本實驗的測量結果）。研究對象是工程教育情境
- id: mit-nse
  title: Delivery and Q&A（CommKit）
  publisher: MIT Department of Nuclear Science and Engineering Communication Lab
  url: https://mitcommlab.mit.edu/nse/commkit/delivery-and-qa/
  accessed: '2026-10-28'
  kind: reference
  supports: 1.2：先說關鍵訊息（state the key message），再說看到什麼、為什麼重要（Claim-Evidence-Reasoning）；配合投影片說明不等於照念；開頭與結尾是最重要的時刻
