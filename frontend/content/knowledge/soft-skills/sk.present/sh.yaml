idea: 簡報是幫聽眾理解一件事或做一個決定。開場先說結論，接著幾個重點各配一個例子或數字（本站建議三個），最後再說一次結論。投影片標題寫成一句完整的話，是給聽眾看的提示，不是講稿。
guiding_questions:
- 台下的人開始滑手機，是哪一張投影片出了問題？
scenario: 親子共學：孩子用 5 分鐘簡報自主學習成果，大人用 5 分鐘簡報自己的工作；互相只給一個讚美、一個建議。
goal: 做 5 分鐘簡報：一開始就說結論，一張投影片一個重點，準時結束。
review: 錄 5 分鐘簡報，家長勾：第一分鐘內說出結論、每張投影片一個重點、沒有照念投影片、時間誤差 30 秒內（示意）；再請一位聽眾寫下「記得的一句話」，看是不是你的結論。
