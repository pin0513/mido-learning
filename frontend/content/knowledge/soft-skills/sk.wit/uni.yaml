ai:
  delegable:
  - 請 AI 標出這句有沒有點名權力較小的人，或有沒有重複某個群體的刻板印象
  human_experience:
  - 在會議或台上決定這句說不說，並為說出口的話負責
idea: 報告或會議裡的一句玩笑，是放在重點之後的短轉折，不是拿身分差來顯得自己比較高。主管說的玩笑，和下屬之間的玩笑，份量不一樣。重複刻板印象的玩笑，就算說的人沒有敵意，句子仍在流傳。
guiding_questions:
- 主管在會議上開玩笑，底下的人笑了，就代表可以繼續嗎？
scenario: 親子共學：大人把會議或報告裡想用的一句話先講給家人聽。孩子問三件事：這是什麼場合、誰的權力比較小、笑的是事情還是人。笑的是權力較小的人，就改掉。
goal: 在報告或會議裡用一句玩笑前，寫下場合、身分差，以及笑的是事情還是人。
review: 對一次真實的報告或會議（課堂、社團或實習）事前寫下場合、身分差、笑的是事情還是人；若笑的是權力較小的人就改掉。事後請一位聽眾說有沒有哪句讓他不舒服。
