why:
  heading: 身分不同，玩笑的份量不同
  body:
  - 史丹佛哲學百科整理三種老說法。優越論：「our laughter expresses feelings of superiority over other people or over a former state of ourselves.」釋放論把笑說成神經能量的釋放；同一頁寫「today almost no scholar in philosophy or psychology explains laughter or humor as a process of releasing pent-up nervous energy.」不一致論把笑說成預期被打破，並寫「It is now the dominant theory of humor in philosophy and psychology.」（翻譯是本站整理）。
  - 美國平等就業機會委員會寫道：「Offensive conduct may include, but is not limited to, offensive jokes」，冒犯性的玩笑可以是騷擾行為的一種（翻譯是本站整理）。同頁也寫：「Petty slights, annoyances, and isolated incidents (unless extremely serious) will not rise to the level of illegality.」小事和單次事件不一定違法，除非極為嚴重（翻譯是本站整理）。本頁談的是說不說的判斷，不是認定某句話違法。
  qa:
    question: 主管在會議上開玩笑，底下的人笑了，就代表可以繼續嗎？
    answer: 不一定。同頁寫「The harasser can be the victim's supervisor」，騷擾者可以是被害人的主管（翻譯是本站整理）。權力較小的人跟著笑，可能是因為身分，不是因為這句沒有問題。先停，問一位聽眾有沒有哪句不舒服（本站整理）。
    source: eeoc-harass
  items_title: 三種說法，外加違法界線
  items:
  - title: 優越論
    text: 笑是不是在表達自己比某人高。
  - title: 釋放論
    text: 百科說現在很少人再用它解釋所有的笑。
  - title: 不一致論
    text: 百科說這是目前哲學和心理學的主流。
  - title: 違法是另一件事
    text: 單次、輕微的冒犯不一定達到美國法上的違法程度。
  sources:
  - sep-humor
  - eeoc-harass
how:
  heading: 先寫身分，再決定說不說
  body:
  - 先寫場合和誰的權力比較小，再決定這句是接在重點後面的短轉折，還是拿某人的身分當笑點。後者就改掉（本站建議）。重點怎麼講，用說服那一點；這句只放在重點之後。
  - 史丹佛哲學百科寫：「While playing with negative stereotypes in jokes does not require endorsement of those stereotypes, however, it still keeps them in circulation, and that can be harmful in a racist or sexist culture where stereotypes support prejudice and injustice.」在玩笑裡玩味負面刻板印象，並不表示說話者同意那些印象，那些印象仍會繼續流傳；在刻板印象支撐偏見與不公的文化裡，這可能有害（翻譯是本站整理）。CASEL 的社會覺察包括理解不同背景、文化和情境的人，例子有「Identifying diverse social norms, including unjust ones」，辨認不同的社會規範，包括不公正的規範（翻譯是本站整理）。
  items_title: 上台前四格
  items:
  - title: 場合
    example: 課堂報告、會議、實習
    text: 先寫這句出現在哪裡。
  - title: 身分差
    example: 誰能決定分數或班表
    text: 權力較小的人先標出來。
  - title: 接在重點後
    example: 結論說完，才有一句轉折
    text: 玩笑不取代要講的重點。
  - title: 改掉
    example: 笑點是某一個人的身分
    text: 換成笑事情，或整句不用。
  checklist_title: 說出口前
  checklist:
  - 寫下場合
  - 寫下身分差
  - 不笑權力較小者
  - 聽眾不適就改
  activity_figure: wit-flow
  sources:
  - sep-humor
  - casel-framework
  - eeoc-harass
what:
  heading: 短轉折，不拿身分當笑點
  figures:
  - wit-compare
  notes:
  - 不一致論說明預期如何被打破。心理模式被打破時，人「may well feel fear, disgust, or anger and not amusement」，也可能害怕、厭惡或生氣，而不覺得好笑（翻譯是本站整理）。聽眾笑了，不是這句可以繼續的證據。
  - EEOC 同頁寫，雇主對主管造成負面就業行動的騷擾負自動責任；調查時看整份紀錄，包括行為的性質和情境。本頁引用它來說明身分差，不是對個案下法律結論。
  sources:
  - sep-humor
  - eeoc-harass
