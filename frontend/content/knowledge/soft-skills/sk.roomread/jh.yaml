  - 看這是什麼場合、誰會看到，決定說不說、轉不轉
idea: 同一句話，換了場合和聽眾，就不一樣。開口或轉傳之前，先寫下這是什麼場合、誰會看到、誰可能被點到。笑的是事情，還是某一個人，先分開。
guiding_questions:
- 這則想轉到班級群組，誰可能不舒服？
scenario: 親子共學：孩子挑一則想分享的內容，先寫三格（場合、誰會看到、誰可能不舒服）。有一格寫出可能不舒服，就先不轉。不把那則內容貼進練習單。
goal: 開口或轉傳前寫下場合、誰會看到、誰可能不舒服。
review: 孩子挑一則想分享的內容，寫出三格；其中一格若寫「可能不舒服」，就選擇不轉。大人確認三格都寫了，而且練習單上沒有嘲弄某人的句子。
