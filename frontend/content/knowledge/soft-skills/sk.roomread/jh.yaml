why:
  heading: 場合換了，話就要換
  body:
  - 國語課綱要國中生「依據不同情境，分辨聲情意涵及表達技巧，適切回應。」也要「視不同情境，進行報告、評論、演說及論辯。」同一件事，課堂、家裡、班級群組，能說的不一樣（本站整理）。
  - CASEL 的社會覺察例子包括「Recognizing situational demands and opportunities」，也就是認出這個場合要求什麼、有什麼機會（翻譯是本站整理）。先看臉的練法在國小那一點，這裡加上場合和轉傳。
  qa:
    question: 這則想轉到班級群組，誰可能不舒服？
    answer: 先寫下誰會看到、誰被點到。科技領綱要了解資訊科技相關的法律、倫理和社會議題，以保護自己與尊重他人。不確定誰會不舒服，就先不轉（本站整理）。
    source: tech108
  items_title: 課綱要看的場合
  items:
  - title: 聽出場合
    text: 依據不同情境，分辨聲情意涵及表達技巧，適切回應。
    code: 1-IV-2
  - title: 換了場合就換說法
    text: 視不同情境，進行報告、評論、演說及論辯。
    code: 2-IV-5
  - title: 資訊倫理
    text: 資訊倫理與法律。
    code: 資 H-IV-5
  - title: 尊重他人
    text: 能了解資訊科技相關之法律、倫理及社會議題，以保護自己與尊重他人。
    code: 運 a-IV-2
  sources:
  - kuoyu
  - tech108
  - casel-framework
how:
  heading: 三格寫完，再決定轉不轉
  body:
  - 先寫場合，再寫誰會看到，再寫誰可能被點到。三格裡有一格是「可能不舒服」，就先不說、不轉（本站建議）。
  - 《校園霸凌防制準則》第 4 條的方式包含電子通訊、網際網路，行為包含故意戲弄。轉傳會把這句再送出去。法律上的霸凌還要看是不是持續，以及有沒有造成敵意環境、損害或影響學習。達不到那條定義，仍然可以選擇不轉（本站整理）。
  items_title: 轉傳前三格
  items:
  - title: 場合
    example: 課堂、家裡、班級群組
    text: 這句是在哪裡說。
  - title: 誰會看到
    example: 全班，還是只有家人
    text: 範圍越大，越要先停一下。
  - title: 誰被點到
    example: 這則是在笑某一個人嗎
    text: 笑事情和笑人分開。
  - title: 先不轉
    example: 有一格不舒服，就先留著
    text: 不確定就不要送出去。
  checklist_title: 送出前檢查
  checklist:
  - 寫下場合
  - 寫下誰會看到
  - 有人不舒服就不轉
  activity_figure: room-flow
  sources:
  - bully-rule
  - tech108
what:
  heading: 笑事情，不等於笑人
  figures:
  - room-compare
  notes:
  - 本點不把嘲弄某人的圖文收成教材。查這則內容的來源真不真，練法在 it.media@jh。
  - 準則第 4 條的霸凌是持續的故意行為。本頁的三格比法律定義更早用：還沒送出去，就先問誰可能不舒服（本站整理）。
  sources:
  - bully-rule
  - casel-framework
