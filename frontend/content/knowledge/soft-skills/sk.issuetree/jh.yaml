why:
  heading: 大問題拆小，才知道從哪裡做
  body:
  - 綜合活動課綱要國中生「善用各項資源，妥善計畫與執行個人生活中重要事務。」家政的學習內容有「個人與家庭生活的金錢及時間管理。」科技課綱也要學生「能應用運算思維解析問題。」
  - 英國內閣辦公室執行小組的工具說明，「Issue trees help to break down a key issue into its smaller, component parts」，也就是把一個大問題拆成比較小的部分（翻譯是本站整理）。拆完之後，每個小問題比較好回答，也比較知道要先做哪一件（本站整理）。
  qa:
    question: 怎麼存到買腳踏車的錢，可以先拆成哪兩大塊？
    answer: 可以先拆成增加收入和減少花費兩塊，兩塊不重疊（例子是本站整理）。英國內閣辦公室的工具說，問題樹是把大問題拆成「sub-questions you can answer」，也就是答得出來的小問題（翻譯是本站整理）。
    source: uk-issuetrees
  items_title: 課綱的學習重點
  items:
  - title: 計畫與執行重要事務
    text: 綜合活動 2c-IV-1：善用各項資源，妥善計畫與執行個人生活中重要事務。
    code: 2c-IV-1
  - title: 金錢及時間管理
    text: 綜合活動 家 Ca-IV-1：個人與家庭生活的金錢及時間管理。
    code: 家 Ca-IV-1
  - title: 用運算思維解析問題
    text: 科技 運 t-IV-4：能應用運算思維解析問題。
    code: 運 t-IV-4
  checklist_title: 開始前先確認
  checklist:
  - 選一個大目標
  - 準備紙和筆
  figures:
