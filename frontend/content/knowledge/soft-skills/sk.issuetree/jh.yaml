verify_notes:
- 核心素養 A2：依總綱 p.4–6 國民中學教育的 J-A2 與綜合活動領綱 p.3 的綜-J-A2、科技領綱 p.3 的科-J-A2原文確認（表格窄欄分散對齊，字距大，文字用 pdftotext 原始順序層與頁面文字塊核對）。
- stage.grades 填 7、8、9：本點的代碼都是第四學習階段（IV），國中的學習重點沒有再分年級；總綱 p.7 說國民中學七、八、九年級為第四學習階段。
- est_time 依綜合活動領綱 p.2：第四學習階段綜合活動每週 3 節課；本點建議在綜合活動課上做，也可以親子一起練（本站建議）。
- 頁碼都是頁腳印的頁碼：綜合活動領綱與總綱比 PDF 頁少 4，科技領綱少 4；教育部學生版的 PDF 頁就是頁腳印的頁碼。
- 綜合活動 2c-IV-1、家 Ca-IV-1、科技 運 t-IV-4 都沿用代碼表的文字與頁碼。
- 健康與體育領綱也有同號的學習表現：1b-IV-2、2a-IV-1、2a-IV-3、2c-IV-1（健體 p.26），文字和綜合活動不同；健體不在代碼表，代碼表以代碼為鍵，將來要收健體要先改 schema（taxonomy 的綜合活動區塊加了註解）。健體的學習內容 Da-IV-1、Db-IV-1（健體 p.28）沒有科目字首，本點的家 Da-IV-1、輔 Db-IV-1 帶字首，鍵不衝突。
- 原 curriculum_108.domains 只有綜合活動，本點加上科技 運 t-IV-4（能應用運算思維解析問題），所以 domains 補科技；核心素養維持 A2。
- 原 scenario 的第一層是交通、住宿、玩什麼、預算：預算和其他三塊重疊（交通、住宿、玩都要花錢），違反本點教的不重複；改成交通、住宿、吃、玩也還會重疊（夜市既是吃也是玩）、會遺漏（行前準備），所以第一層改用時間切成出發前、旅途中、回家後，三段不重疊、也不遺漏。
- 原 guiding question 的長引號拿掉；原 link_notes 的跨學門提示改寫成 pm.breakdown 加標題，拿掉長引號；原 review 的 3 層標成示意，並補上家長檢查沒有漏掉。
- 原 ai.delegable「檢查有沒有漏掉的分支」補上由老師或家長操作（本站建議），並在 What 加上教育部注意事項（學生版）的使用規則。
- 原有草稿說明「課綱對應只到領域、核心素養與議題…」已處理：本點已逐條對照官方領綱與議題融入說明手冊原文（頁碼見來源）。
- '原有草稿說明「引用的框架只寫名稱（問題樹、MECE）…」已處理：依英國內閣辦公室執行小組（Cabinet Office Implementation Unit）的 Implementation Insights: Using Issues Trees 改寫，英文短句逐字引用（頁碼見來源），中文說明是本站整理。'
- 英國內閣辦公室的工具是寫給政府團隊規劃政策分析的；本點把問題換成國中生的生活目標（本站建議）。MECE 的英文全名照原文。
- 英文 PDF 的引文避開彎引號；PDF 換行處照原詞接回，其餘空白照原文。
- 生成式 AI 的使用規則依教育部注意事項（學生版）；supports 逐段標頁碼（學生版的 PDF 頁就是頁腳印的頁碼）。
