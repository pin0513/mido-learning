what:
  heading: 拆得開，做得到
  body:
  - 學完後，能把一個大目標拆成至少三層的問題樹，同一層不重複、不遺漏，最底層的每個小問題都能寫出一個行動。
  items_title: 學完能做到
  items:
  - title: 拆成問題樹
    text: 一層一層往下拆。
  - title: 同層檢查
    text: 不重複、不遺漏。
  - title: 底層寫行動
    text: 每個小問題一個行動。
  checklist_title: 家長檢核
  checklist:
  - 至少三層
  - 同層沒有重疊
  - 底層都有行動
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - genai-student
