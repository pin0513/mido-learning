idea: 問題樹把大問題一層層拆開，直到每個小問題都知道怎麼回答。拆的時候檢查同一層：有沒有重疊（不重複）、有沒有漏掉（不遺漏），這個原則常叫 MECE。
guiding_questions:
- 怎麼存到買腳踏車的錢，可以先拆成哪兩大塊？
- 怎麼知道同一層沒有重疊、沒有漏掉？
- 拆到什麼時候可以停？
scenario: 親子共學：規劃家庭旅行時，大人用時間畫第一層（出發前、旅途中、回家後），孩子負責往下拆一個分支（本站建議）。
goal: 把一個大問題拆成問題樹，同一層不重複、不遺漏。
review: 孩子把一個目標（存錢買東西、提高某一科成績）拆成至少 3 層的問題樹（數字是示意）；家長檢查同一層沒有重疊、沒有漏掉，每個最底層的小問題都能寫出一個行動。
