  notes:
  - 綜合活動的代碼：數字開頭的是學習表現；開頭的家、輔是家政、輔導的學習內容；中間的 IV 是第四學習階段（國中七至九年級）。
  - 科技的代碼：開頭的運是運算思維的學習表現；中間的 IV 是第四學習階段（國中七至九年級）。
  - 總綱把國民中學七、八、九年級定為第四學習階段，所以本頁代碼中間都是 IV。
  sources:
  - zonghe
  - tech108
  - zonggang
  - uk-issuetrees
how:
  heading: 一層一層拆，同層檢查
  body:
  - 先寫最上面的大問題，例如怎麼在暑假前存到買腳踏車的錢（例子是本站整理）。英國內閣辦公室的工具提醒「Invest time in getting the primary question right」，也就是先花時間把最上面的問題問對（翻譯是本站整理）。
  - 再往下拆，每拆一層就檢查同一層（本站建議）。不重複：工具說「Mutually Exclusive if there is no overlap between what they cover」；不遺漏：「Collectively Exhaustive if between them they cover 100% of the original question」，也就是同一層的小問題沒有重疊，加起來涵蓋整個上一層的問題（翻譯是本站整理）。這個原則常叫 MECE（本站整理）。
  - 拆到什麼時候停：工具說，每一枝最後的問題最好是「simple yes/no questions」，做一點分析就答得出來（翻譯是本站整理）。本頁建議至少拆三層，最底層的每個小問題都寫出一個行動，例如每週少買一杯飲料（本站建議）。
  qa:
    question: 怎麼知道同一層沒有重疊、沒有漏掉？
    answer: 問自己兩句：有沒有一件事可以同時放進兩格？有就是重疊。有沒有一件相關的事，哪一格都放不進去？有就是漏掉（本站整理）。英國內閣辦公室的工具說，同一層「Mutually Exclusive if there is no overlap between what they cover」（翻譯是本站整理）。
    source: uk-issuetrees
  items_title: 四步做
  items:
  - title: 寫大問題
    text: 先把問題問對。
  - title: 往下拆一層
    text: 拆成幾個小問題。
  - title: 同層檢查
    text: 不重複、不遺漏。
  - title: 拆到能行動
    text: 底層寫一個行動。
  checklist_title: 拆的時候檢查一下
  checklist:
  - 同層沒有重疊
  - 同層沒有漏掉
  - 至少拆三層
  - 底層都有行動
  activity_figure: issuetree-flow
