how:
  heading: 觀察、感受、需要、請求
  body:
  - 觀察：像攝影機一樣，只說看到、聽到的事（本站整理）。加州大學的講義寫「Observe the behavior without evaluating or judging.」，也就是描述行為，不評價、不下判斷（翻譯是本站整理）。都、總是、很懶這類字是評價，放進觀察句，對方容易只想反駁，所以要拿掉（本站建議）。
  - 感受和需要：先說自己的感受，講義提醒感受是「Emotion or sensation rather than thought.」，是情緒或身體的感覺，不是想法（翻譯是本站整理）。再說感受背後的需要，也就是你在乎的是什麼，例如需要休息、需要被尊重（例子是本站整理）。
  - 請求：講義要人「Phrase a specific request positively」，也就是說出具體、正面的請求，說希望對方做什麼，而不是不要做什麼（翻譯是本站整理）。請求要讓對方可以說不；CNVC 建議先問自己「Is my request really a demand in disguise?」，也就是這個請求是不是偽裝的命令（翻譯是本站整理）。
  qa:
    question: 請求和命令差在哪裡？
    answer: 請求具體、做得到，而且對方可以說不；如果對方說不，你就生氣或處罰，那其實是命令（本站整理）。CNVC 的提問是「Am I prepared to hear no, listen empathically, and maintain connection?」，也就是準備好聽到不、仍然好好聽、維持關係（翻譯是本站整理）。
    source: cnvc-purpose
  items_title: 四步做
  items:
  - title: 觀察
    text: 說看到、聽到的事。
  - title: 感受
    text: 說情緒，不說想法。
  - title: 需要
    text: 說你在乎什麼。
  - title: 請求
    text: 具體、對方可以說不。
  checklist_title: 說的時候檢查一下
  checklist:
  - 觀察沒有評價字
  - 感受不是想法
  - 請求很具體
  - 對方可以說不
