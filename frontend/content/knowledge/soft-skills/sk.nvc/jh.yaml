idea: 非暴力溝通（盧森堡提出）分四步：觀察（像攝影機一樣描述）、感受、需要（我在乎的是什麼）、請求（具體、做得到、對方可以拒絕）。最難的是第一步：把評價拿掉。
guiding_questions:
- 「你很懶」是觀察還是評價？
scenario: 親子共學：大人先示範：把最近一次對孩子發脾氣的事，用四句話重說一次給孩子聽。
goal: 用四個步驟說出一次衝突：不加評價的觀察、感受、背後的需要、具體的請求。
review: 寫下一次真實衝突的四句話，家長檢查：觀察句裡沒有「都、總是、很懶」這類評價字；請求是具體行動，而且對方可以說不。
