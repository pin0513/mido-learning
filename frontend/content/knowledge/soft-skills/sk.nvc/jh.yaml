what:
  heading: 四句話說一次衝突
  body:
  - 學完後，能用觀察、感受、需要、請求四句話說一次真實的衝突：觀察裡沒有評價字，請求具體，而且對方可以說不。
  items_title: 學完能做到
  items:
  - title: 寫出四句話
    text: 觀察、感受、需要、請求。
  - title: 拿掉評價字
    text: 像攝影機一樣說。
  - title: 提出請求
    text: 具體、對方可以說不。
  checklist_title: 家長檢核
  checklist:
  - 觀察沒有評價字
  - 說出需要
  - 請求可以被拒絕
  notes:
  - 本點融入品德教育議題：議題融入說明手冊國中的實質內涵有溝通合作與和諧人際關係、理性溝通與問題解決。用四句話重說一次衝突，就是在練習理性溝通。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - issues-handbook
  - genai-student
