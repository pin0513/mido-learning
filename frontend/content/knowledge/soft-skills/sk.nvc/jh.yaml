- 核心素養 C2、B1：依總綱 p.4–6 國民中學教育的 J-C2、J-B1 與綜合活動領綱 p.5 的綜-J-C2（綜-J-B1 跨頁，只引總綱 J-B1）原文確認（表格窄欄分散對齊，字距大，文字用 pdftotext 原始順序層與頁面文字塊核對）。
- stage.grades 填 7、8、9：本點的代碼都是第四學習階段（IV），國中的學習重點沒有再分年級；總綱 p.7 說國民中學七、八、九年級為第四學習階段。
- est_time 依綜合活動領綱 p.2：第四學習階段綜合活動每週 3 節課；本點建議在綜合活動課上做，也可以親子一起練（本站建議）。
- 頁碼都是頁腳印的頁碼：綜合活動領綱與總綱比 PDF 頁少 4，議題融入說明手冊少 16；教育部學生版的 PDF 頁就是頁腳印的頁碼。
- 綜合活動 2a-IV-1 原本不在代碼表，本批依綜合活動領綱 p.19 原文加入（taxonomy patch，與 sk.empmap@jh 共用）；輔 Dc-IV-1 沿用代碼表的文字與頁碼。
- 健康與體育領綱也有同號的學習表現：1b-IV-2、2a-IV-1、2a-IV-3、2c-IV-1（健體 p.26），文字和綜合活動不同；健體不在代碼表，代碼表以代碼為鍵，將來要收健體要先改 schema（taxonomy 的綜合活動區塊加了註解）。健體的學習內容 Da-IV-1、Db-IV-1（健體 p.28）沒有科目字首，本點的家 Da-IV-1、輔 Db-IV-1 帶字首，鍵不衝突。
- 原核心素養 C1（道德思辨、公民意識）改成 B1：總綱 J-B1 有「能以同理心與人溝通互動」，比 C1 更貼近本點。
- 議題品德教育：品德教育國中實質內涵 品J1「溝通合作與和諧人際關係。」（p.75）；品德教育國中實質內涵 品J8「理性溝通與問題解決。」（p.75）。原稿的議題人權教育刪除：手冊國中人權教育的實質內涵沒有直接講溝通方法的條目（人J4 談公平正義、人J5 跨頁談多元差異），所以不列。
- 原 idea 的「最難的是第一步」改成常常最難的是第一步（不寫成定論）；盧森堡依 CNVC 原文寫成提出者，不寫心理學家。
- 原 review 的「都、總是、很懶」拿掉引號（引號內超過 5 個字的字串只放在有出處的地方）；原 link_notes 的跨學門提示改寫成 ph.fact 加標題，拿掉長引號。
