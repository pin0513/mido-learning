why:
  heading: 拿掉評價，才聽得見需要
  body:
  - 綜合活動課綱要國中生「學習人際溝通技巧，以正向的態度經營人際關係。」輔導的學習內容有「同理心、人際溝通、衝突管理能力的培養與正向經營人際關係。」品德教育議題的國中實質內涵，則有「溝通合作與和諧人際關係。」和「理性溝通與問題解決。」
  - 非暴力溝通（Nonviolent Communication，NVC）是盧森堡（Marshall Rosenberg）提出的，非暴力溝通中心（CNVC）寫「Marshall Rosenberg conceived of NVC and developed a process」。它的做法是說出自己的感受和需要，再提出請求，「without making demands.」，也就是不強迫對方（翻譯是本站整理）。
  qa:
    question: 「你很懶」是觀察還是評價？
    answer: 是評價。觀察只說看到、聽到的事，例如這週有三天碗放到隔天才洗（例子是本站整理）。加州大學的非暴力溝通講義提醒「separate observation from evaluation」，也就是把觀察和評價分開（翻譯是本站整理）。
    source: uc-nvc
  items_title: 課綱的學習重點
  items:
  - title: 學習人際溝通技巧
    text: 綜合活動 2a-IV-1：體認人際關係的重要性，學習人際溝通技巧，以正向的態度經營人際關係。
    code: 2a-IV-1
  - title: 衝突管理
    text: 綜合活動 輔 Dc-IV-1：同理心、人際溝通、衝突管理能力的培養與正向經營人際關係。
    code: 輔 Dc-IV-1
