idea: 說話的人要替聽的人著想：聲音讓最後一排也聽得到，速度慢到對方跟得上，眼睛看著聽的人。緊張時容易越講越快，開口前先慢慢深呼吸，再放慢說。
guiding_questions:
- 你說話時，坐在最後一排的人聽得到嗎？
scenario: 親子共學：晚餐時輪流當「今日播報員」，每人說一分鐘今天發生的事，其他人只聽不插話。大人也要輪。
goal: 用夠大的聲音、不趕的速度、看著聽的人，說完一分鐘。
review: 錄一段 1 分鐘（示意）自我介紹，一起看回放，家長勾三格：聽得清楚、不趕、有看鏡頭；一週後（示意）再錄一次，比較哪一格進步。
formats:
