why:
  heading: 說出來，對方要聽得到
  body:
  - 對方聽不清楚、跟不上，內容再好也傳不過去。國語文課綱在一、二年級就要孩子「以正確發音流利的說出語意完整的話」，三、四年級再要求「用清晰語音、適當語速和音量說話」。
  qa:
    question: 你說話時，坐在最後一排的人聽得到嗎？
    answer: 要試了才知道。上台說話時，要把聲音送到教室最後面，眼睛輪流看不同的聽眾；練習時可以請家人坐到最遠的位置，聽聽看是不是每個字都清楚（本站建議）。
    source: mit-nse
  items_title: 練好以後，孩子可以
  items:
  - title: 說出完整的話
    text: 用正確發音，流利說出語意完整的話。
    code: 2-I-1
  - title: 清楚的聲音
    text: 用清晰語音、適當語速和音量說話。
    code: 2-II-1
  - title: 加上語調表情
    text: 高年級再用語調、表情和肢體輔助口語表達。
    code: 2-III-4
  sources:
  - kuoyu
  - zonggang
how:
  heading: 大聲、放慢、看著人
  body:
  - 課綱提醒，老師要指導學生「說得正確、說得清楚、說得有條理」，也要培養「發表的信心和儀態」。上台時，把聲音送到最後一排，眼睛輪流看不同的人；很多人一緊張就講太快，所以要刻意放慢，開口前先慢慢深呼吸。
  checklist_title: 說話前，提醒自己：
  checklist:
  - 最後一排聽得到
  - 速度不趕
  - 看著聽的人
  - 先慢慢深呼吸
  activity_figure: how-flow
  sources:
  - kuoyu
  - mit-nse
what:
  heading: 聲音、速度、眼神
  figures:
  - what-compare
  notes:
  - 音量：以最後一排聽得清楚為準，不是用喊的（本站建議）。
  - 速度：講太快常是因為緊張或太熟內容；放慢，讓聽的人有時間理解。
  - 眼神：輪流看不同的聽眾，不是只盯著一個人或地板（本站建議）。
  sources:
  - mit-nse
  - kuoyu
