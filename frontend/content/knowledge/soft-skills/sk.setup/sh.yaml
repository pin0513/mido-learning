why:
  heading: 轉折不等於可以笑人
  body:
  - "史丹佛哲學百科描述笑匠的做法：「The set-up is the first part of the joke: it creates the expectation. The punch (line) is the last part that violates that expectation.」前面建立預期，後面打破預期（翻譯是本站整理）。國語課綱要高中生辨析文本的結構及寫作手法，也要在討論裡「達成友善且平等的溝通。」"
  - 同一本百科也說，心理模式被打破時，「we may well feel fear, disgust, or anger and not amusement.」人不一定覺得好笑，也可能害怕、厭惡或生氣（翻譯是本站整理）。所以轉折之後要看場合，而不是把話說完。
  qa:
    question: 自嘲說到一半，怎樣算踩到別人？
    answer: 笑自己當下的失誤，可以停在自己身上。若這句要成立，得把在場、權力比較小、或沒在笑的人放進來當笑點，就不是自嘲，停下來（本站整理）。
    source: sep-humor
  items_title: 課綱、預期與轉折
  items:
  - title: 友善且平等
    text: 討論時適切陳述立場，並達成友善且平等的溝通。
    code: 2-V-2
  - title: 看出結構
    text: 辨析文本的結構及寫作手法。
    code: 5-V-1
  - title: 預期
    text: 前半先讓人以為會往哪個方向走。
  - title: 轉折
    text: 後半打破那個預期，然後看反應。
  sources:
  - sep-humor
  - kuoyu
how:
  heading: 鋪預期、轉折、停在自己
  body:
  - 先說一句讓人有預期的話，再用轉折打破它，最後檢查笑點是不是自己的行為。聽到停，或看到有人不笑，就把轉折停住（本站建議）。
  - 百科舉的一種自嘲是：找眼鏡找了很久，結果在自己頭上。「If I search high and low for my eyeglasses only to find them on my head, the Superiority Theory seems unable to explain my laughter at myself.」這種笑停在自己當下的失誤（翻譯是本站整理）。優越論說的則是笑別人，或笑過去的自己。
  items_title: 四步做
  items:
  - title: 鋪預期
    example: 我找了十分鐘
    text: 先讓聽的人以為結果是什麼。
  - title: 給轉折
    example: 眼鏡在頭上
    text: 打破剛才的預期。
  - title: 停在自己
    example: 笑的是我自己的失誤
    text: 不把在場的人放進笑點。
  - title: 說停就停
    example: 有人說停，這句結束
    text: 不把轉折說完。
  checklist_title: 說完檢查
  checklist:
  - 指出預期
  - 指出轉折
  - 自嘲不踩人
  - 說停就停
  activity_figure: setup-flow
  sources:
  - sep-humor
what:
  heading: 自嘲停在自己身上
  figures:
  - setup-compare
  notes:
  - 不一致論是史丹佛哲學百科所說、目前哲學和心理學裡較常被採用的幽默說明：「It is now the dominant theory of humor in philosophy and psychology.」它說明預期為什麼會被打破。聽的人覺得好笑與否，要看當下的反應（翻譯是本站整理）。
  - 本點不練習貶低別人的轉折。場合看不懂時，回到 sk.roomread@jh。
  sources:
  - sep-humor
