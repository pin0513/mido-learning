  human_experience:
  - 聽現場有沒有人說停，決定要不要把轉折說完
idea: 一句讓人會心一笑的話，常常先建立預期，再用轉折打破預期。預期被打破不一定好笑，也可能讓人害怕或生氣。自嘲只笑自己當下的失誤；這句若需要權力較小的人當笑點，就不是自嘲。
guiding_questions:
- 自嘲說到一半，怎樣算踩到別人？
scenario: 親子共學：孩子用自己的一件小失誤說一段話，先指出哪句在建立預期、哪句是轉折，不拿在場的人當笑點。大人說停的時候，孩子就停。
goal: 用預期和轉折說一件自己的事，自嘲不把在場的人當笑點，聽到停就停。
review: 孩子說一段約一分鐘（示意）的話，指出哪句是預期、哪句是轉折；自嘲只針對自己的行為；大人說停時就停。三項都做到，大人打勾。
