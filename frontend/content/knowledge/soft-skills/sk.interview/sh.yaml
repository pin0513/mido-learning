idea: 設計思考的第一步是同理：去問、去看真正會用的人。問「上次……的時候發生什麼事？」這種開放式問題，再追問「為什麼」；不推銷自己的點子，多聽少說。
guiding_questions:
- 「你喜歡這個 App 嗎？」問了能得到什麼？
scenario: 親子共學：孩子訪談一位長輩「你小時候怎麼上學」，大人在旁邊數開放式問題和追問的次數。
goal: 訪談一位使用者 20 分鐘，用開放式問題和追問找出他真正的困擾。
review: 把訪談錄音整理成逐字稿，家長數一數：開放式問題至少一半、追問至少 3 次、孩子說話時間少於三分之一；最後寫出一個「沒想到」的發現。
