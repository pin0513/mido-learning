verify_notes:
- 核心素養 C2、B1：依總綱 p.4–6 高級中等學校教育的 U-C2、U-B1 與綜合活動領綱的綜S-U-C2、國語文領綱的國S-U-B1 原文確認（表格窄欄分散對齊，字距大，文字用 pdftotext 原始順序層與頁面文字塊核對）。
- stage 不填 grades：綜合活動領綱 p.2 說普通型高中的生命教育、生涯規劃、家政「可在不同年級規劃修習不同科目。」高中的學習重點也沒有分年級；總綱 p.7 說高級中等學校十、十一、十二年級為第五學習階段。
- est_time 寫高中家政或國語文課：綜合活動領綱 p.2 的高中部定必修有家政 2 學分，本點的綜合活動代碼出自家政；國語文 1-V-1 是聆聽的學習表現，也可以在國語文課練習（本站建議）。
- 頁碼都是頁腳印的頁碼：綜合活動領綱與總綱比 PDF 頁少 4，國語文領綱少 2；教育部 AI 指引與學生版注意事項的 PDF 頁就是頁腳印的頁碼；d.school Bootleg沒有印頁碼或印的就是 PDF 頁，用 PDF 頁。
- 高中的 ai.delegable 不改成由老師或家長操作：教育部《高級中等以下學校人工智慧使用和學習指引》讓高中生在規則內自己使用（同 B15、B19、B23 高中的做法），每條補上使用條件（本站建議），What 加上注意事項（學生版）與指引的使用規則。
- 國語文 1-V-1、家 Cb-V-2 沿用代碼表的文字與頁碼；本點沒有新加代碼。國語文口語表達的 2-V-6 和英語文領綱的 2-V-6 同號（文字不同），代碼表以代碼為鍵，本點不新增它，改用代碼表已有的 1-V-1。
- 原 curriculum_108.domains 是綜合活動、科技：代碼表的科技區塊只收資訊科技，沒有對應訪談的條目，本點拿掉科技、加上國語文 1-V-1（聆聽並適切回應），domains 改成語文、綜合活動。
- 原 core_competencies 是 C2、A2：訪談重在從對方的角度聽懂他，改成 C2、B1，依總綱 U-B1 的能以同理心與他人溝通並解決問題與國S-U-B1 的學會從他人的角度思考問題。
- 原 idea、guiding question、scenario 裡的問句拿掉引號（那是本站整理的問句，不是引文）；另加兩題，答案寫在 Why 的問答、How 內文與 How 的問答。
- 原 goal 的 20 分鐘、原 review 的至少一半、至少 3 次、少於三分之一標成示意，做法都寫在 How；review 補上錄音前先徵得對方同意（本站建議），一個「沒想到」的發現拿掉引號。
- 原 ai.delegable「把錄音轉成逐字稿、初步分類」改成把自己打好、刪去姓名的逐字稿初步分類：錄音是受訪者的聲音，屬於個人資料，依教育部注意事項不輸入他人的個人資料，所以不交給 AI（本站建議）；逐字稿交給 AI 前也先問過受訪者同意，對方不同意錄音就改成手寫重點（本站建議）。
- 原 link_notes 的跨學門先學拿掉引號，改寫成哲學的好問題從為什麼開始（ph.question@es）。
- 原有草稿說明「課綱對應只到領域、核心素養與議題…」已處理：本點已逐條對照官方領綱與議題融入說明手冊原文（頁碼見來源）。
- 原有草稿說明「引用的框架只寫名稱（設計思考：同理階段、開放式問題）…」已處理：依史丹佛大學設計學院（d.school）Design Thinking Bootleg（2018，CC BY-NC-SA 4.0）的 Interview for Empathy 與訪談準備卡改寫，英文短句逐字引用，中文說明是本站整理。
- Bootleg 的訪談卡建議兩人一組，一人問、一人記；本點改成家長在旁邊記錄與計數（本站建議）。Bootleg 沒有印頁碼，頁碼用 PDF 頁；含撇號的句子（例如問題要中立那句的後半）不引。
- 英文 PDF 的引文避開彎引號與撇號；PDF 換行處的斷字照原詞接回，其餘空白照原文；中文說明和翻譯是本站整理。
- 生成式 AI 的使用規則依教育部注意事項（學生版）與《高級中等以下學校人工智慧使用和學習指引》；supports 逐段標頁碼。
