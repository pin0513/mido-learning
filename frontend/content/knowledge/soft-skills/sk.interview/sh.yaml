idea: 設計思考的第一步是同理：去問、去看真正會用的人。問像是上次……的時候發生什麼事這樣的開放式問題，再追問為什麼；不推銷自己的點子，多聽少說。
guiding_questions:
- 問你喜歡這個 App 嗎，能得到什麼？
- 開放式問題和是非題差在哪裡？
- 訪談時，自己要說多少話？
scenario: 親子共學：孩子訪談一位長輩，問他小時候怎麼上學，大人在旁邊數開放式問題和追問的次數（本站建議）。
goal: 訪談一位使用者約 20 分鐘（時間是示意），用開放式問題和追問找出他真正的困擾。
review: 先徵得對方同意再錄音，把訪談整理成逐字稿，家長數一數：開放式問題至少一半、追問至少 3 次、孩子說話時間少於三分之一（數字都是示意）；最後寫出一個沒想到的發現。
