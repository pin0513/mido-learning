why:
  heading: 問對問題，才聽得到真話
  body:
  - 國語課綱要高中生「面對不同的聆聽情境及文化差異，正確分析話語的訊息，並給予適切的回應。」家政的學習內容「人際互動倫理。」，補充說明要「尊重並展現合宜的人際溝通與互動」。訪談就是一種要用心聽、適切回應的對話（本站整理）。
  - 史丹佛大學設計學院（d.school）說「We interview to gain empathy.」，訪談是為了同理對方（翻譯是本站整理）。他們的訪談準備卡寫「Remember, open ended questions allow for stories and stories lead to insights for design solutions.」，也就是開放式問題讓對方說故事，故事帶來新的發現（翻譯是本站整理）。
  qa:
    question: 問你喜歡這個 App 嗎，能得到什麼？
    answer: 多半只能得到喜歡或不喜歡，很難知道他怎麼用、卡在哪裡（本站整理）。d.school 建議「Instead, ask about a specific occurrence.」，例如改問上次用這個 App 時發生了什麼事（翻譯和例子是本站整理）。
    source: dschool-bootleg
