idea: 會議引導常分兩段：發散時不批評，把想法都寫出來；收斂時先訂選擇標準，再分類、比較、合併。共識不是每個人最喜歡，而是每個人都能接受、願意支持，可以用五指表態（拳頭到五指）檢查。
guiding_questions:
- 投票決定，輸的那一方會願意一起做嗎？
scenario: 親子共學：換孩子當家庭會議主持人，大人當成員；大人故意提一個很不一樣的意見，看主持人怎麼收。
goal: 主持一場會議：先讓想法都出來，再訂標準收斂，最後用表態確認共識。
review: 孩子主持 20 分鐘家庭會議決定一件事（週末行程、零用錢規則），交出一張紀錄：決議、負責人、期限；最後每人五指表態，三指以下的人有被問到原因。
