why:
  heading: 投票之後，大家還願意做嗎
  body:
  - 投票很快，但輸的一方不一定願意一起做。高中國語文課綱要學生「討論過程中，能適切陳述自身立場，歸納他人論點並給予回應，達成友善且平等的溝通」，核心素養也要「尋求共識，具備與他人有效溝通與協商的能力」。
  - 綜合活動課綱的高中核心素養，則要學生「提升在團體生活中共同決策、合作解決問題」。
  qa:
    question: 投票決定，輸的那一方會願意一起做嗎？
    answer: 不一定。所以在決定前，先請每個人表態：用五指表態，兩指以下（含拳頭）代表有疑慮，要先聽他的理由；大家都三指以上，代表都能接受、願意支持，才往下走。
    source: berkeley-f2f
  items_title: 練好以後，可以
  items:
  - title: 陳述與歸納
    text: 陳述自身立場，歸納他人論點並回應。
    code: 2-V-2
  sources:
  - kuoyu
  - zonghe
how:
  heading: 先發散，再收斂
  body:
  - 英國設計委員會的雙鑽石模型，把過程分成先廣泛探索（發散）、再聚焦行動（收斂）。發散時，IDEO.org 建議「暫緩評判」（Defer judgement），讓每個人都敢說；收斂時先訂標準，哈佛談判專案的原則式談判也建議，雙方事先同意要用哪些客觀標準。
  - 最後用五指表態確認：拳頭表示反對、要停下來談；三指表示可以接受；五指表示全心支持。
  items:
  - title: 發散
    example: 週末想去哪？每個人寫三個。
    text: 先寫下來，不批評。
  - title: 訂標準
    example: 車程一小時內、花費一千元內。
    text: 先同意要用什麼標準選。
  - title: 收斂
    example: 把相近的合併，用標準刪去。
    text: 分類、比較、合併。
  - title: 五指表態
    example: 妹妹出兩指，先聽她的擔心。
    text: 兩指以下先聽理由。
  activity_figure: how-flow
  sources:
  - designcouncil
  - ideo-rules
  - pon-principled
  - berkeley-f2f
what:
  heading: 五指表態怎麼看
  figures:
  - what-compare
  notes:
  - 五指表態是快速測溫的工具：大家同時舉手、一眼看出支持程度。因為是公開表態，加州大學柏克萊分校（UC Berkeley）提醒它不適合敏感或高度爭議的決定。
  - 車程、花費等標準數字都是示意。
  sources:
  - berkeley-f2f
