- id: berkeley-f2f
  title: Fist to Five（Decision Making Tools）
  publisher: 加州大學柏克萊分校（UC Berkeley）Business Process Management Office
  url: https://bpm.berkeley.edu/tools-resources/decision-making-tools/fist-five
  accessed: '2026-10-28'
  kind: reference
  supports: 拳頭（0）＝我反對、需要停下來談；1 指＝重大疑慮；2 指＝有些疑慮；3 指＝I can live with it（不是最喜歡但會支持）；4 指＝支持；5 指＝全心支持。兩指以下（含拳頭）的人有值得先聽的疑慮，拳頭會讓決定暫停；全員三指以上即有足夠支持。它是 temperature check（快速測溫），不適合敏感或高度爭議的決定
