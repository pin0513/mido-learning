why:
  heading: 有順序，大家才聽得懂
  body:
  - Show and Tell（展示與分享）是給年紀小的孩子做的學校活動：孩子帶一樣東西到班上，向同學介紹它。
  - 說的人把話照順序說，聽的人才跟得上；說完回答同學的提問，就是在練習課綱說的「與他人交談時，能適當的提問、合宜的回答，並分享想法」。
  qa:
    question: 你最想拿哪一樣東西跟大家分享？第一句要說什麼？
    answer: 第一句先說「這是什麼」，例如「這是阿公送我的陀螺。」大家馬上知道你要介紹什麼，接著再說它的故事。（本站整理的開場方式）
    source: kuoyu
  items_title: 練好以後，孩子可以
  items:
  - title: 分享，也回答
    text: 交談時適當的提問、合宜的回答，並分享想法。
    code: 2-I-3
  - title: 照順序說
    text: 把握說話的重點與順序。
    code: 2-II-3
  sources:
  - cambridge
  - kuoyu
how:
  heading: 開頭、經過、結尾
  body:
  - 這裡用三段順序練習（本站整理的練習方式）：開頭說這是什麼，經過說它的故事，結尾說你為什麼喜歡。說完留時間讓大家問問題。
  - 課綱也提醒老師培養孩子「發表的信心和儀態」，並讓每個孩子都有發言的機會；所以本站建議家庭分享會要輪流，大人也要上場。
  items:
  - title: 開頭：這是什麼
    example: 這是阿公送我的陀螺。
    text: 一句話讓大家知道主角。
  - title: 經過：它的故事
    example: 去年過年，阿公教我怎麼打。
    text: 說一兩件和它有關的事。
  - title: 結尾：為什麼喜歡
    example: 它讓我想起阿公。
    text: 說出你的感受。
  - title: 回答一個問題
    example: 「它可以轉多久？」
    text: 聽完問題，再回答。
  activity_figure: how-flow
  sources:
  - kuoyu
