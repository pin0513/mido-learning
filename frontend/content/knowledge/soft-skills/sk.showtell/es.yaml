idea: 分享要有順序：開頭說這是什麼，經過說它的故事，結尾說你為什麼喜歡。說完留時間讓大家問問題。
guiding_questions:
- 你最想拿哪一樣東西跟大家分享？第一句要說什麼？
scenario: 親子共學：週末「家庭分享會」：每人帶一樣東西，大人分享自己小時候的一樣物品。
goal: 拿一樣東西，用開頭、經過、結尾說一分鐘給全家聽，再回答一個問題。
review: 家長計時 1 分鐘（前後差 15 秒內都算），勾選：有開頭、有經過、有結尾、結束後回答了 1 個問題。
