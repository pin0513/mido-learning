how:
  heading: 四步走：看懂、想法、動手、回頭看
  body:
  - 看懂，再想辦法：先說出要求什麼、知道什麼；波利亞問「What is the unknown?」，也要找出題目給了哪些資料（翻譯是本站整理）。再想辦法，他問「Have you seen it before?」，有沒有做過類似的題目（翻譯是本站整理）。生活問題就先想幾個辦法，挑一個最容易先試的（本站建議）。
  - 動手做：照計畫一步一步做，波利亞說「Carrying out your plan of the solution, check each step.」，每一步都要檢查（翻譯是本站整理）。數學題就一步一步寫算式；生活的辦法就試一週，用貼紙表記下每天有沒有做到（本站建議）。
  - 回頭看：數學題把答案代回題目，看合不合理，因為波利亞問「Can you check the result?」（翻譯是本站整理）。生活的辦法在週末看貼紙表，看問題有沒有變好：變好就繼續，沒有就回到想辦法那一步換一個（本站建議）。
  qa:
    question: 回頭看時，要檢查什麼？
    answer: 檢查結果對不對、合不合理：數學題把答案代回題目，生活問題看有沒有變好（本站整理）。波利亞問「Can you check the result?」，還問「Can you use the result, or the method, for some other problem?」，看這個方法下次能不能再用（翻譯是本站整理）。
    source: ucr-polya
  items_title: 四步做
  items:
  - title: 看懂
    text: 要求什麼、知道什麼。
  - title: 想辦法
    text: 想幾個，挑一個先試。
  - title: 動手做
    text: 一步一步做，每步檢查。
  - title: 回頭看
    text: 檢查結果，再決定。
  checklist_title: 做完檢查一下
  checklist:
  - 說出要求什麼
  - 想過幾個辦法
  - 答案代回檢查
