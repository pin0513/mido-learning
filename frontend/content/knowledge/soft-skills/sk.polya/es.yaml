what:
  heading: 卡住時，照四步走
  body:
  - 學完後，孩子遇到數學應用題或生活問題，能照看懂、想辦法、動手做、回頭看四步走：說出要求什麼和知道什麼，做完把結果拿回來檢查，沒變好就換一個辦法。
  items_title: 學完能做到
  items:
  - title: 看懂問題
    text: 要求什麼、知道什麼。
  - title: 試一個辦法
    text: 一步一步做。
  - title: 回頭檢查
    text: 繼續或換辦法。
  checklist_title: 家長檢核
  checklist:
  - 說得出要求什麼
  - 想過幾個辦法
  - 做完有回頭看
  notes:
  - 同樣四步可以用在數學題和生活問題：數學題回頭看是把答案代回檢查，生活問題回頭看是看有沒有變好（本站整理）。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - genai-student
