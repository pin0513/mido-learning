idea: 數學家波利亞把解題分成四步：了解問題、擬定計畫、執行計畫、回顧。這四步不只用在數學題，也能用在生活：想三個辦法挑一個試，試完回頭看有沒有變好，沒有就換一個。
guiding_questions:
- 試了一個辦法沒成功，下一步該怎麼辦？
scenario: 親子共學：把一道數學應用題和一個生活問題並排，親子一起用同樣四步走一次。
goal: 遇到問題照四步走：先看懂、想辦法、試試看、回頭檢查有沒有變好。
review: 針對「五個為什麼」找到的原因，想 3 個辦法、挑 1 個試一週，用貼紙表記錄每天有沒有做到；週末一起回頭看，決定繼續或換辦法。
