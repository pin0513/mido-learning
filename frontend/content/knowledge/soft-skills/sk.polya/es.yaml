why:
  heading: 解題有步驟，卡住不慌
  body:
  - 數學課綱要五、六年級「在具體情境中，解決三步驟以上之常見應用問題。」綜合活動課綱也要孩子「分析與判讀各類資源，規劃策略以解決日常生活的問題。」
  - 數學家波利亞（G. Polya）在《How to Solve It》把解題分成四個階段：「Understanding the problem」、「Devising a plan」、「Carrying out the plan」、「Looking back」，也就是看懂問題、想出計畫、照計畫做、回頭看（中文名稱是本站整理）。
  qa:
    question: 試了一個辦法沒成功，下一步該怎麼辦？
    answer: 回頭看：辦法哪裡沒用、問題有沒有看懂，再換一個辦法試（本站整理）。波利亞的第四步是「Examine the solution obtained.」，檢查得到的結果（翻譯是本站整理）。沒變好也不是白做，你知道了這個辦法不適合（本站建議）。
    source: ucr-polya
  items_title: 課綱的學習重點
  items:
  - title: 解多步驟應用題
    text: 數學 n-III-2：在具體情境中，解決三步驟以上之常見應用問題。
    code: n-III-2
  - title: 規劃策略解決問題
    text: 綜合活動 2c-III-1：分析與判讀各類資源，規劃策略以解決日常生活的問題。
    code: 2c-III-1
