idea: 數學家波利亞把解題分成四步：看懂問題、想出計畫、照計畫做、回頭看。這四步不只用在數學題，也能用在生活：想幾個辦法挑一個試，試完回頭看有沒有變好，沒有就換一個。
guiding_questions:
- 試了一個辦法沒成功，下一步該怎麼辦？
- 看懂一道題，要先找出哪幾樣？
- 回頭看時，要檢查什麼？
scenario: 親子共學：把一道數學應用題和一個生活問題並排，親子一起用同樣四步走一次（本站建議）。
goal: 遇到數學應用題或生活問題，照四步走：看懂問題、想辦法、動手做、回頭檢查答案或結果，沒變好就換辦法。
review: 針對五個為什麼找到的原因，想 3 個辦法、挑 1 個試一週（示意），用貼紙表記錄每天有沒有做到，週末一起回頭看有沒有變好，決定繼續或換辦法；再拿一道三步驟的應用題，孩子說出要求什麼、知道什麼，算完把答案代回題目檢查。
