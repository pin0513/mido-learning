why:
  heading: 具體的回饋，對方才能照做
  body:
  - 國語課綱要高中生在「討論過程中，能適切陳述自身立場，歸納他人論點並給予回應，達成友善且平等的溝通。」家政的學習內容有「人際互動倫理。」，補充說明要「尊重並展現合宜的人際溝通與互動」。給回饋和收回饋，就是一來一往的溝通（本站整理）。
  - '美國的創意領導中心（CCL）教一種給回饋的方法：「When giving feedback, remember the simple SBI method: clarify the situation, describe the behavior, then share the impact.」也就是先說情境、再說行為、最後說影響（翻譯是本站整理）。CCL 表示他們的研究發現「SBI reduces anxiety around giving feedback, as well as the defensiveness of the recipient in hearing it.」，也就是給的人比較不緊張，聽的人比較不會急著防衛（翻譯是本站整理）。'
  qa:
    question: 說做得很好，和說先講結論讓我馬上就懂了，哪一句比較有用？
    answer: 後面那句。做得很好只有評價，對方不知道哪裡好；後面那句說出行為（先講結論）和影響（我馬上就懂了），對方下次知道可以照做（本站整理）。CCL 要人「Describe the actual, observable behavior.」，也就是說看得到的行為（翻譯是本站整理）。
    source: ccl-sbi
