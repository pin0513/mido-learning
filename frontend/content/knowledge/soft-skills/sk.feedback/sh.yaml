idea: 好的回饋具體到對方能照做：在什麼情境、看到什麼行為、造成什麼影響（SBI 模式）。收回饋時不急著解釋，先說謝謝並複述，之後再決定要採用哪些。
guiding_questions:
- 「做得很好」和「先講結論，我馬上就懂了」，哪一句比較有用？
scenario: 親子共學：每週一次家庭回饋時間：每人給另一人一則 SBI，大人先收、先示範不辯解。
goal: 用「情境、行為、影響」給具體回饋；收到回饋時先謝謝、複述，再決定怎麼用。
review: 孩子和家長互給一則 SBI 回饋（一則讚美、一則建議），家長檢查三段都有；收回饋的一方先謝謝並複述，沒有辯解。
