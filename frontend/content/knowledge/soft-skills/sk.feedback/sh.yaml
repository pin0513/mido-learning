idea: 好的回饋具體到對方能照做：在什麼情境、看到什麼行為、造成什麼影響（SBI 模式）。收回饋時不急著解釋，先說謝謝並複述，之後再決定要採用哪些。
guiding_questions:
- 說做得很好，和說先講結論讓我馬上就懂了，哪一句比較有用？
- SBI 的三段是什麼？
- 收到不同意的回饋，要馬上解釋嗎？
