how:
  heading: 給用三段，收先謝謝
  body:
  - 給回饋用三段（SBI）。情境：說清楚是哪一次，CCL 說要「Describe the specific situation in which the behavior occurred.」，並且「Avoid generalities」，不要只說最近（翻譯是本站整理）。行為：只說看得到的事，「Keep to the facts.」，例如說你報告時先講結論，不說你很厲害（例子是本站整理）。影響：說這個行為帶來的結果，「Describe the results of the behavior.」，例如我馬上就懂了（例子是本站整理）。讚美和建議都可以用這三段（本站整理）。
  - 說完可以問對方的想法。CCL 說，回饋本來是單向的，加上詢問對方的本意就變成雙向：「The success of Situation-Behavior-Impact is enhanced when the feedback, which is one-way, is accompanied by an inquiry about intent, which makes the conversation two-way.」（翻譯是本站整理）。例如問：你那時候是怎麼想的？然後好好聽完（例子是本站建議）。
  - 收回饋分三步（本站建議）：先說謝謝，不急著解釋；再用自己的話複述一次，例如你是說我報告太長，最好先講結論，對嗎？（例子是本站整理）；最後自己決定要採用哪些，可以晚一點再回覆。複述就是課綱說的歸納他人論點並給予回應（本站整理）。不同意也先聽完，之後再說明自己的想法（本站建議）。
  qa:
    question: 收到不同意的回饋，要馬上解釋嗎？
    answer: 先不要。先謝謝、複述，確認自己聽懂了；要不要採用之後再決定，也可以晚一點再說明自己的想法（本站建議）。CCL 提到 SBI 能減少聽的人的防衛，收的人先不辯解，對話也比較能繼續下去（本站整理）。
    source: ccl-sbi
  items_title: 四步做
  items:
  - title: 說情境
    text: 哪一次、在哪裡。
  - title: 說行為
    text: 只說看得到的事。
  - title: 說影響
    text: 帶來什麼結果。
  - title: 收的時候先謝謝
    text: 再複述，之後決定。
