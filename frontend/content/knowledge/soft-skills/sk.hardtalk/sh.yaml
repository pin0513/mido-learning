idea: 困難對話會卡住，常是因為情緒還沒被接住。先說出你看到的對方感受，再講事實；用非暴力溝通的四步提出請求，也先想好對方說不的時候怎麼辦。
guiding_questions:
- 要跟老師爭取延後交作業，第一句話要說什麼？
- 對話中情緒上來了，怎麼辦？
- 對方說不，要怎麼回應？
scenario: 親子共學：大人分享一次自己工作上的困難對話（不提對方的名字），孩子幫忙找出哪一句是評價、哪一句是事實（本站建議）。
goal: 準備並進行一次困難對話：先承認對方的感受，再談事實和請求。
review: 家長扮演對方演練一次（例如向教練說想退出校隊，或跟家人談想減少一門補習，例子是示意），家長勾：開頭承認對方感受、事實與評價分開、有具體請求、被拒絕時沒有翻臉；演練後再真的去談。
