verify_notes:
- 核心素養 C2、A2：依總綱 p.4–6 高級中等學校教育的 U-C2、U-A2 與綜合活動領綱的綜S-U-A2、綜S-U-C2 原文確認（表格窄欄分散對齊，字距大，文字用 pdftotext 原始順序層與頁面文字塊核對）。
- stage 不填 grades：綜合活動領綱 p.2 說普通型高中的生命教育、生涯規劃、家政「可在不同年級規劃修習不同科目。」高中的學習重點也沒有分年級；總綱 p.7 說高級中等學校十、十一、十二年級為第五學習階段。
- est_time 寫高中家政課：綜合活動領綱 p.2 的高中部定必修是生命教育 1 學分、生涯規劃 1 學分、家政 2 學分；本點的綜合活動代碼出自家政。
- 頁碼都是頁腳印的頁碼：綜合活動領綱與總綱比 PDF 頁少 4，議題融入說明手冊少 16；教育部 AI 指引與學生版注意事項的 PDF 頁就是頁腳印的頁碼；CICMH 工作單、UC NVC 講義沒有印頁碼或印的就是 PDF 頁，用 PDF 頁。
- 新增代碼的頁碼：學習表現用綜合活動領綱 p.28–32 學習重點表，學習內容用附錄二學習內容說明裡代碼所在的頁（同代碼表既有的 家 Ca-V-1 p.100、家 Cb-V-2 p.100）。
- 高中的 ai.delegable 不改成由老師或家長操作：教育部《高級中等以下學校人工智慧使用和學習指引》讓高中生在規則內自己使用（同 B15、B19、B23 高中的做法），每條補上使用條件（本站建議），What 加上注意事項（學生版）與指引的使用規則。
- 綜合活動 家 4b-V-2（p.32 學習重點表）、家 Db-V-2（p.101 附錄二）原本不在代碼表，本批依原文加入（taxonomy patch）；家 Cb-V-2 沿用代碼表的文字與頁碼。
- 健康與體育領綱也有同號的代碼（文字不同）：學習表現 3a-V-1、4b-V-2（健體 p.30）、3c-V-1（p.31），學習內容 Ca-V-1、Db-V-2（p.31）、Cc-V-1（p.32）；國語文也有學習內容 Ca-V-1（國語文 p.18）、Cc-V-1（p.19）；綜合活動高中本身也有 生 3a-V-1、生 Ca-V-1、生 Db-V-2、涯 3c-V-1、涯 Cc-V-1。本點的代碼都帶科目字首（涯、家），代碼表的鍵不衝突（taxonomy 的綜合活動區塊加了註解；領綱用羅馬數字，本站整理成拉丁字母 V）。
- 原 core_competencies 是 C2、A1：A1 是身心素質與自我精進，和困難對話的連結較弱；改成 C2、A2，依綜S-U-A2 的積極面對及處理生活與生命中的各種挑戰。
- 議題家庭教育：家庭教育高中實質內涵 家U7「解析個人與家人的互動並能適切地調適。」（p.66）；和家人談一件難開口的事，就是在練習。
- 原 guiding question 保留，另加兩題，答案寫在 Why 的問答、How 內文與 How 的問答；原 review 的例子（向教練說想退出校隊）保留並標成示意，另加和家人談的例子，對應家政的家人互動；四項勾選的做法都寫在 How。
- 原 scenario「親子共學：大人分享一次自己工作上的困難對話，孩子幫忙找出『哪一句是評價、哪一句是事實』。」保留做法，內層引號拿掉，補上不提對方的名字（本站建議）。
- 原 ai.delegable「陪你演練對方可能的反應」補上使用條件（本站建議）。
- 原有草稿說明「課綱對應只到領域、核心素養與議題…」已處理：本點已逐條對照官方領綱與議題融入說明手冊原文（頁碼見來源）。
- 原有草稿說明「引用的框架只寫名稱（非暴力溝通、困難對話）…」已處理：困難對話依加拿大 Centre for Innovation in Campus Mental Health（CICMH）的 Curious and Courageous Conversations Worksheet（西安大略大學監察人室網站提供，參考 Stone、Patton、Heen《Difficult Conversations》）；非暴力溝通依加州大學監察人室的 NVC 講義（改編自 Marshall Rosenberg）。英文短句逐字引用，中文說明是本站整理。
- CICMH 工作單每頁印的頁碼（[ n ]）和 PDF 頁相同；工作單是寫給大專校院學生與職員的，本點用在高中生和家人、老師、教練之間（本站建議）。工作單的例句含彎引號或撇號，本頁不引。
- 英文 PDF 的引文避開彎引號與撇號；PDF 換行處的斷字照原詞接回，其餘空白照原文；中文說明和翻譯是本站整理。
- 生成式 AI 的使用規則依教育部注意事項（學生版）與《高級中等以下學校人工智慧使用和學習指引》；supports 逐段標頁碼。
