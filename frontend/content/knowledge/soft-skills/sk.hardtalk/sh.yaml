what:
  heading: 難開口的話，也說得出口
  body:
  - 學完後，能準備並進行一次困難對話：先謝謝並承認對方的感受，把事實和評價分開，說出影響和具體的請求；情緒上來時先停，被拒絕時也不翻臉。
  items_title: 學完能做到
  items:
  - title: 先承認感受
    text: 說出看到的對方感受。
  - title: 分開事實和評價
    text: 只說看得到的事。
  - title: 提出具體請求
    text: 被拒絕也不翻臉。
  checklist_title: 家長檢核
  checklist:
  - 開頭承認感受
  - 事實評價分開
  - 請求具體
  - 被拒絕沒翻臉
  notes:
  - 本點融入家庭教育議題：議題融入說明手冊高中的實質內涵有「解析個人與家人的互動並能適切地調適。」和家人談一件難開口的事，就是在練習。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  sources:
  - issues-handbook
  - genai-student
  - moe-ai-guide
