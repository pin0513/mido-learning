why:
  heading: 先接住情緒，再談事情
  body:
  - 108 課綱的家政要高中生「探究家庭系統與個人的關聯，精進互動與溝通策略，增進家人互動關係。」學習內容「家庭系統與家人互動。」的補充說明也要「精進互動與溝通策略」；家庭教育議題的高中實質內涵是「解析個人與家人的互動並能適切地調適。」難開口的話，常常是要對家人、老師或教練說的（本站整理）。
  - 加拿大校園心理健康創新中心（CICMH）的困難對話工作單提醒「Intentions are different from impact.」，也就是你的本意和對方感受到的不一定一樣；又說「When a conversation becomes emotional, it is important to pause and address the emotion(s).」，對話一有情緒，要先停下來處理情緒（翻譯是本站整理）。
  qa:
    question: 要跟老師爭取延後交作業，第一句話要說什麼？
    answer: 先謝謝對方願意聽，再說事實，不先說評價或要求（本站建議）。工作單的開場第一步是「Thank them for meeting with you.」，第二步是「Start by describing the facts as you see them」，也就是先說你看到的事實（翻譯是本站整理）。例如：謝謝老師願意聽我說，這週我有三科報告要交，進度落後了（例子是示意）。
    source: cicmh-conversations
