how:
  heading: 先準備，再照順序說
  body:
  - 準備：先約好時間和地點，UC 的非暴力溝通講義寫「Make a time to talk and in the appropriate place」（翻譯是本站整理），例如等練習結束、旁邊沒有別人的時候（例子是本站整理）。把想說的先寫下來，事實和評價分開：事實是看得到、聽得到的事，評價是自己的看法；講義說「Observe the behavior without evaluating or judging.」（翻譯是本站整理）。也先想想對方的感受，工作單問「What emotions do you think they might be experiencing?」（翻譯是本站整理）；再想好對方說不的時候怎麼回；也可以先請家長扮演對方演練一次，再真的去談（本站建議）。
  - 開口照順序（整理自工作單的開場五步）：先謝謝對方，並說出你看到的對方感受，例如我知道教練很看重比賽前的出席（例子是本站整理）；再說事實，「Start by describing the facts as you see them, understanding that the other person likely see things differently.」；接著說你的猜想，並願意被更正；然後「Talk about how the situation impacted you.」；最後「Ask for what you need.」，工作單說「The key is to be specific about what you need and want moving forward.」（翻譯是本站整理）。講義也說請求要「Phrase a specific request positively」，具體、正面地說（翻譯是本站整理）。
  - 情緒上來時，先停一下，說出你看到的情緒，例如你看起來有點失望，我們先停一下好嗎？（例子是本站整理）。對方說不時，不翻臉、不威脅；工作單建議事先準備好回應，「have a response ready that respects their space while keeping the door open for future dialogue.」，也就是尊重對方，也留下之後再談的機會（翻譯是本站整理）。談完不論結果，都對自己寬容一點：「Demonstrate compassion for yourself as you reflect.」（翻譯是本站整理）。
  qa:
    question: 對方說不，要怎麼回應？
    answer: 先接受對方現在的答案，不翻臉；謝謝他聽完，問問有沒有別的做法，或約下次再談（本站建議）。工作單說要事先準備一個「respects their space while keeping the door open for future dialogue」的回應（翻譯是本站整理）。
    source: cicmh-conversations
