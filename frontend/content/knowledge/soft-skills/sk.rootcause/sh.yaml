why:
  heading: 用資料找出主要原因
  body:
  - 數學課綱要高中生「能判斷分析數據的時機，能選用適當的統計量作為描述數據的參數，理解數據分析可能產生的例外，並能處理例外。」家政要學生「善用科技、資訊，管理個人與家庭重要事務。」學習內容「時間、精力管理與生活品質。」的補充說明，也要「善用資源與管理技巧，提高時間密度、妥善分配精力與適度休閒。」記下自己分心的原因，就是用資料管理時間（本站整理）。
  - 美國健康照護改善研究所（IHI）的品質改善工具說，柏拉圖是一種長條圖，「the various factors that contribute to an overall effect are arranged in order from the largest to the smallest contribution to the effect.」，也就是把造成結果的因素由大排到小（翻譯是本站整理）。IHI 也提到常見的說法：「roughly 80% of the effect comes from 20% of the causes.」，大約八成的結果來自兩成的原因；這是經驗法則，不是每次都這樣（翻譯和說明是本站整理）。
  qa:
    question: 抱怨最多的原因，一定是影響最大的原因嗎？
    answer: 不一定。被抱怨最多，可能只是最常被想起來，要用資料比一比（本站整理）。IHI 要人寫下每個因素的「magnitude of each factor」，也就是它的大小，例如發生了幾次（翻譯是本站整理）。分心也一樣：手機可能次數最多，但一次被叫去幫忙可能花掉更多時間；所以先決定要比次數還是分鐘（例子是示意）。
    source: ihi-pareto
  items_title: 課綱的學習重點
  items:
  - title: 選適當統計量描述數據
    text: 數學 d-V-2：能判斷分析數據的時機，能選用適當的統計量作為描述數據的參數，理解數據分析可能產生的例外，並能處理例外。
    code: d-V-2
  - title: 善用資訊管理事務
    text: 綜合活動 家 3a-V-1：善用科技、資訊，管理個人與家庭重要事務。
    code: 家 3a-V-1
  - title: 時間與精力管理
    text: 綜合活動 家 Ca-V-1：時間、精力管理與生活品質。
    code: 家 Ca-V-1
