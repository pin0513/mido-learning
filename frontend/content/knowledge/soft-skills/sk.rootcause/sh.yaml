verify_notes:
- 核心素養 A2、B2：依總綱 p.4–6 高級中等學校教育的 U-A2、U-B2 與數學領綱的數S-U-A2、數S-U-B2、綜合活動領綱的綜S-U-A2 原文確認（表格窄欄分散對齊，字距大，文字用 pdftotext 原始順序層與頁面文字塊核對）。
- stage 不填 grades：綜合活動領綱 p.2 說普通型高中的生命教育、生涯規劃、家政「可在不同年級規劃修習不同科目。」高中的學習重點也沒有分年級；總綱 p.7 說高級中等學校十、十一、十二年級為第五學習階段。
- est_time 寫高中數學或家政課：數學 d-V-2 是高中的數據分析；綜合活動領綱 p.2 的高中部定必修有家政 2 學分，本點的綜合活動代碼出自家政（本站建議）。
- 頁碼都是頁腳印的頁碼：綜合活動領綱與總綱比 PDF 頁少 4，數學領綱少 3；教育部 AI 指引與學生版注意事項的 PDF 頁就是頁腳印的頁碼；IHI 的 Pareto Chart 工具、CMS 的 PDSA 範本沒有印頁碼或印的就是 PDF 頁，用 PDF 頁。
- 高中的 ai.delegable 不改成由老師或家長操作：教育部《高級中等以下學校人工智慧使用和學習指引》讓高中生在規則內自己使用（同 B15、B19、B23 高中的做法），每條補上使用條件（本站建議），What 加上注意事項（學生版）與指引的使用規則。
- 數學 d-V-2（數學領綱 p.13 學習表現表）原本不在代碼表，本批依原文加入（taxonomy patch）；家 3a-V-1、家 Ca-V-1 沿用代碼表的文字與頁碼。數學領綱附錄一把 d-V-2 和數S-U-B2 列在同一列（p.60）。
- d-V-2 沒有同號：已查健體、國語文、自然科學、科技、社會、英語文、第二外國語文與綜合活動領綱。
- 原 core_competencies A2、B2 保留：B2 依總綱 U-B2 與數S-U-B2（正確使用計算機和電腦軟體，知道其適用性與限制）；用試算表畫柏拉圖、算百分比時，要自己核對數字（本站建議）。數S-U-B2 的條文接到 p.5，本點只引 p.4 的第一句。
- 原 idea 保留（80/20 是經驗法則，不是定律）；IHI 原文寫 roughly，本頁寫成大約。
- 原 guiding question 保留，另加兩題，答案寫在 Why 的問答、How 內文與 How 的問答；原 scenario 的「工作被打斷的原因」拿掉引號並標出一週是示意；原 review 的一週、前兩名標成示意，當下記錄的理由寫在 How。
- 原 link_notes 的跨學門先學拿掉引號，改寫成數學的整理資料與統計圖（ma.data@es）。
- 原 ai.delegable「資料整理與畫圖」補上使用條件（本站建議）。
- 原有草稿說明「課綱對應只到領域、核心素養與議題…」已處理：本點已逐條對照官方領綱與議題融入說明手冊原文（頁碼見來源）。
- 原有草稿說明「引用的框架只寫名稱（柏拉圖分析、80/20 經驗法則）…」已處理：依美國健康照護改善研究所（IHI）QI Essentials Toolkit 的 Pareto Chart 工具改寫（由大到小排列、算百分比與累積百分比），英文短句逐字引用，中文說明是本站整理；小實驗引用 CMS 的 PDSA 範本。
- IHI 工具沒有印頁碼，頁碼用 PDF 頁；Pareto principle、vital few 等詞在原文帶彎引號，本頁不引。IHI 的版權說明允許教育、非營利用途影印，本頁只短句引用並註明出處。柏拉圖是 Pareto chart 的常見中文譯名，和哲學家柏拉圖無關（本站整理）。
- 英文 PDF 的引文避開彎引號與撇號；PDF 換行處的斷字照原詞接回，其餘空白照原文；中文說明和翻譯是本站整理。
- 生成式 AI 的使用規則依教育部注意事項（學生版）與《高級中等以下學校人工智慧使用和學習指引》；supports 逐段標頁碼。
