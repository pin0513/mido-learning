idea: 想到的原因要用資料確認。把每次發生的情況記下來、分類計數，畫成柏拉圖（由多到少排列），常會發現少數原因造成大部分的問題（80/20 是經驗法則，不是定律）。再對最主要的原因做小實驗。
guiding_questions:
- 抱怨最多的原因，一定是影響最大的原因嗎？
- 柏拉圖要怎麼畫？
- 為什麼資料要當下記，不能事後回想？
scenario: 親子共學：大人也記一週（時間是示意）工作被打斷的原因，和孩子的分心紀錄一起畫柏拉圖比較（本站建議）。
goal: 收集資料、畫柏拉圖找出最主要的原因，再用小實驗驗證。
review: 收集一段時間的資料（例如一週內每天分心的原因與次數）畫柏拉圖，指出前兩名原因，設計一週的小實驗並報告結果（一週、前兩名都是示意）；家長檢查資料是當下記錄，不是事後回想。
