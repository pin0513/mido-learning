how:
  heading: 當下記錄，畫圖，再做小實驗
  body:
  - 先記錄：決定要記什麼，例如每次分心的原因和花掉的分鐘（例子是示意），做一張紀錄表，分心一發生就記，不要等晚上再回想；事後回想容易漏掉，也容易只記得印象最深的幾次（本站建議）。IHI 的第一步就是「Write your data in a simple table」，把因素和數量寫成簡單的表（翻譯是本站整理）。
  - 再畫柏拉圖：把原因分類、計數，照 IHI 的步驟「Order the factors according to the magnitude of contribution to the effect, from largest to smallest.」，再「Calculate the percentage of the total that each factor represents.」（翻譯是本站整理）。由多到少畫長條，接著「calculate the cumulative percentage for each category until you reach 100%.」，把累積百分比畫成折線（翻譯是本站整理）。看前兩名原因加起來佔了多少（前兩名是示意）。也想想有沒有例外，例如考試前那天特別不一樣（例子是本站整理），這就是課綱說的數據分析可能產生的例外（本站整理）。
  - 最後做小實驗：只對最主要的原因改一件事，例如讀書時把手機放到另一個房間，做一週（例子和時間是示意），一樣當下記錄；CMS 的改善循環範本也說「Plan a small test of change.」（翻譯是本站整理）。實驗前後的數字變了，也可能是別的原因，例如那週作業比較少，所以也記下那段時間還有什麼不一樣（本站整理）。最後報告：改了什麼、前後的數字、還想再試什麼（本站建議）。
  qa:
    question: 為什麼資料要當下記，不能事後回想？
    answer: 事後回想容易漏掉，也容易只記得印象最深的那幾次，數字就不準了（本站整理）。柏拉圖要先有每個因素的數量，IHI 的第一步是「Write your data in a simple table」，所以當下就把每一次記進表格（翻譯是本站整理）。
    source: ihi-pareto
  items_title: 四步做
  items:
