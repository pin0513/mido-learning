idea: 說服不是比誰大聲。先清楚說出主張，再給理由和例子，最後回應對方可能的擔心。理由要讓對方在乎，不只是你在乎。
guiding_questions:
- 想說服爸媽讓你晚一點睡，你最有力的理由是什麼？
scenario: 親子共學：家庭提案日：孩子提一個想做的事，大人提一個想改的家規，雙方都照「主張、理由、例子」說，再投票。
goal: 用一個主張、兩三個理由和具體例子，在三分鐘內說服家人。
review: 孩子做 3 分鐘家庭提案（例如假日行程），家長用檢核表勾：主張一句話說清楚、至少 2 個理由、每個理由有例子、回應了 1 個反對意見、沒有超時。
