why:
  heading: 讓對方願意聽你的理由
  body:
  - 國中國語文課綱要學生「依理解的內容，明確表達意見，進行有條理的論辯，並注重言談禮貌」，也要能「視不同情境，進行報告、評論、演說及論辯」。學習內容則要學「以事實、理論為論據，達到說服、建構、批判等目的」。
  - 所以說服靠的是有條理的理由和事實，不是音量；而且理由要配合聽的人，課綱說要「依目的、聽話對象和情境，適時調整說話的方式」。
  qa:
    question: 想說服爸媽讓你晚一點睡，你最有力的理由是什麼？
    answer: 最有力的理由通常是爸媽也在乎的事，例如「我功課都寫完了，而且明天第二節才有考試，晚半小時睡還能睡滿八小時」，再拿出這週作息當例子。只說「我想玩」，是你在乎的理由。
    source: kuoyu
  items_title: 練好以後，可以
  items:
  - title: 有條理的論辯
    text: 明確表達意見，有條理的論辯，注重言談禮貌。
    code: 2-IV-3
  - title: 看場合說服
    text: 視不同情境，進行報告、評論、演說及論辯。
    code: 2-IV-5
  - title: 用事實當論據
    text: 以事實、理論為論據，達到說服的目的。
    code: Bd-IV-1
  sources:
  - kuoyu
how:
  heading: 主張、理由、例子、回應
  body:
  - 一句話說主張；每個理由配一個例子或事實；最後回應一個反對意見。論證學裡的圖爾敏模式也有類似的拆法：主張（claim）、證據（grounds）、連接兩者的理由（warrant），還有承認另一種合理看法的反駁（rebuttal）。這裡的對照是近似，不是一一相等。
  items:
  - title: 主張
    example: 我想週五晚上晚半小時睡。
    text: 一句話說清楚你要什麼。
  - title: 理由
    example: 隔天不用上學，睡眠時間還夠。
    text: 說對方也在乎的原因。
  - title: 例子／事實
    example: 這週我每天十點前寫完功課。
    text: 用具體的事撐住理由。
  - title: 回應擔心
    example: 如果週六爬不起來，下週就照舊。
    text: 先說出對方可能的擔心，再回應。
  activity_figure: how-flow
  sources:
  - purdue-toulmin
  - kuoyu
