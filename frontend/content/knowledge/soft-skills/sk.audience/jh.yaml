idea: 傳播學常用拉斯威爾（Lasswell）的五個問題拆解一次溝通：誰說、說什麼、透過什麼管道、對誰說、產生什麼效果。內容一樣，換了聽眾或管道，說法就要換。這五個問題裡沒有「回饋」；後來的互動模式才強調：看對方的反應，再跟著調整。
guiding_questions:
- 同一件事說給阿嬤聽和說給同學聽，哪裡要換？
scenario: 親子共學：全家選一則新聞，各自用「傳給長輩群組」「跟同學聊」「上台報告」三種方式說，比一比哪裡變了。
goal: 說話前先想清楚：誰說、說什麼、用什麼管道、對誰說、想要什麼效果。
review: 把「段考成績」分別說給阿嬤、同學、老師聽（可錄音），家長用五個問題的表格比較三段，至少要有兩處（示意）用詞或順序不同。
