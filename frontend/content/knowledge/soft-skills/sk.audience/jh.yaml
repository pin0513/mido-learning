why:
  heading: 同一件事，聽眾不同
  body:
  - 同一件事，說給阿嬤聽和說給同學聽，用詞、順序、要補充的背景都不一樣。國語文課綱要國中生「掌握生活情境，適切表情達意」，也要能「依據不同情境，分辨聲情意涵及表達技巧，適切回應」。
  - 課綱的實施要點也提醒：要懂得「依目的、聽話對象和情境，適時調整說話的方式」。
  qa:
    question: 同一件事說給阿嬤聽和說給同學聽，哪裡要換？
    answer: 對象（To Whom）換了，用詞和順序就要跟著換：對阿嬤少用流行語、多補背景；對同學可以直接說重點（本站舉例）。管道（In Which Channel）也會影響說法，例如傳到家族群組要寫短、寫清楚。
    source: lasswell
  items_title: 練好以後，可以
  items:
  - title: 看情境說話
    text: 掌握生活情境，適切表情達意，分享自身經驗。
    code: 2-IV-1
  - title: 聽出語氣再回應
    text: 依不同情境，分辨聲情意涵及表達技巧，適切回應。
    code: 1-IV-2
  sources:
  - kuoyu
how:
  heading: 說之前，問五個問題
  body:
  - 拉斯威爾在 1948 年用五個問題描述一次傳播行為：誰（Who）、說什麼（Says What）、透過什麼管道（In Which Channel）、對誰說（To Whom）、產生什麼效果（With What Effect）。說話前，先把五格填好。
  - 說的時候再看對方的反應：聽不懂、皺眉、追問，都是回饋。把回饋納入，是後來「互動模式」補上的觀點，不是拉斯威爾原本的五個問題。
  figures:
  - how-5w
  activity_figure: how-flow
  sources:
  - lasswell
  - macewan
what:
  heading: 五個問題與回饋
  figures:
  - what-compare
  notes:
  - 5W 是 Who、Says What、In Which Channel、To Whom、With What Effect 五個英文問題的簡稱。
  - 傳遞模式把溝通看成單向送出訊息；互動模式則把對方的反應（回饋）也算進來，雙方輪流當說話者和聽話者。
  sources:
  - lasswell
  - macewan
