scenario: 親子共學：家庭小市集。孩子和大人各拿三樣不用的小東西，輪流說「我想要……」「你想要什麼？」，雙方都點頭才交換。
goal: 交換前說出自己想要什麼、問出對方想要什麼，雙方都同意才交換。
review: 家庭小市集玩三輪，每輪孩子都先說「我想要……」並問一次「你想要什麼？」；有一輪大人說「不要」，孩子能接受並換別的提議，大人逐輪打勾。
