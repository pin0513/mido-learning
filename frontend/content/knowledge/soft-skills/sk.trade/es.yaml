why:
  heading: 兩個人都願意，才叫交換
  body:
  - 社會課綱要三、四年級的孩子知道「人們透過儲蓄與消費，來滿足生活需求。」也知道人在各行各業裡「與他人形成分工合作的關係。」交換就是最小的分工合作。
  - 美國聯邦準備體系的經濟教案引用美國經濟教育標準：人們自願交換，是因為預期交換後會過得比較好。本站的解讀：要先知道對方想要什麼，才找得到兩個人都說好的交換。
  qa:
    question: 你想用貼紙換同學的卡片，可是他不想換，怎麼辦？
    answer: 先問他：「你想要什麼？」也許他想要的是別的東西。如果他還是不想換，就說「好，沒關係」；交換要兩個人都願意。
    source: fed-yen
  items_title: 練好以後，孩子可以
  items:
  - title: 說出想要
    text: 用「我想要……」說清楚自己想換什麼。
  - title: 問對方
    text: 用「你想要什麼？」聽懂對方的需要。
  - title: 接受不要
    text: 對方說不要時，不生氣、不硬換。
  sources:
  - shehui
  - fed-yen
how:
  heading: 我想要、你想要、換不換
  body:
  - 先用一句話說自己想要什麼；再問對方想要什麼，聽他說完；最後一起決定換不換。不換也可以，下次再說。
  items:
  - title: 我想要
    example: 我想要你的恐龍卡。
    text: 一句話說清楚。
  - title: 你想要
    example: 你想要什麼？貼紙還是彈珠？
    text: 問完，等對方說。
  - title: 換不換
    example: 一張恐龍卡換兩張貼紙，好嗎？
    text: 兩個人都點頭才換；有人搖頭就不換。
  activity_figure: how-flow
  sources:
  - fed-yen
what:
  heading: 交換不是搶
  figures:
  - what-compare
  notes:
