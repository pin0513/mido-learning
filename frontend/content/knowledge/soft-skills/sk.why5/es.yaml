idea: 第一個想到的原因常常只是表面。一直問為什麼會這樣，常常要問三到五次，才找得到更根本、自己改得動的原因。要問為什麼，不要問是誰的錯。
guiding_questions:
- 早上常常遲到，真正的原因是起不來，還是別的？
- 問到第幾次可以停？
- 為什麼不要問是誰的錯？
scenario: 親子共學：大人也挑一個自己的問題（例如常忘記帶鑰匙），請孩子當為什麼小偵探一直追問（本站建議）。
goal: 對一個生活小問題一層一層問為什麼，問到改掉這個原因、問題就不容易再發生，而且是自己改得動的事。
review: 對早上常遲到或作業忘了帶，一起問到第 3–5 層（示意），畫成一串；家長檢查最後一個原因是我們改得動的事、改掉後問題不容易再發生，而且沒有變成責怪某個人。
