why:
  heading: 找到根本原因，才改得動
  body:
  - 綜合活動課綱要五、六年級「分析與判讀各類資源，規劃策略以解決日常生活的問題。」學習內容也有「運用各類資源解決問題的規劃。」要規劃解決的辦法，先要找到真正的原因（本站整理）。
  - 美國聯邦醫療保險與補助服務中心（CMS）的品質改善教材介紹五個為什麼：「The Five Whys is a simple problem-solving technique that helps to get to the root of a problem quickly.」，也就是很快找到問題根本的簡單方法（翻譯是本站整理）。
  qa:
    question: 早上常常遲到，真正的原因是起不來，還是別的？
    answer: 起不來常常只是第一層。再問為什麼起不來，可能是太晚睡；再問為什麼太晚睡，可能是睡前還在看平板（例子是本站整理）。CMS 說「It often takes three to five whys」，常常要多問幾層（翻譯是本站整理）。
    source: cms-5why
  items_title: 課綱的學習重點
  items:
  - title: 規劃策略解決問題
    text: 綜合活動 2c-III-1：分析與判讀各類資源，規劃策略以解決日常生活的問題。
    code: 2c-III-1
  - title: 規劃解決問題
    text: 綜合活動 Bc-III-3：運用各類資源解決問題的規劃。
    code: Bc-III-3
  checklist_title: 開始前先確認
  checklist:
  - 先說清楚問題
  - 準備紙和筆
