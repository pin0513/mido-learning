  - cms-rca
what:
  heading: 找到改得動的原因
  body:
  - 學完後，孩子遇到生活小問題，能一層一層問為什麼並畫成一串，找到改掉後問題就不容易再發生、自己改得動的原因；問的是事情，不是責怪人。
  items_title: 學完能做到
  items:
  - title: 連續問為什麼
    text: 畫成一串原因。
  - title: 知道何時停
    text: 改掉後不再發生。
  - title: 問事情不怪人
    text: 找改得動的原因。
  checklist_title: 家長檢核
  checklist:
  - 問了三層以上
  - 原因改得動
  - 沒有責怪人
  notes:
  - 原因不只一條時，到國中可以學魚骨圖，從不同類別一起找原因（本站建議）。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - genai-student
