how:
  heading: 一層一層問為什麼
  body:
  - 先把問題說清楚：寫成看得到的事實，例如這星期有三天遲到（本站建議）。CMS 的步驟第一步是寫下問題，提醒要「Be clear and specific.」（翻譯是本站整理）。
  - 再一層一層問：在紙上寫下問題，往下畫箭頭，問為什麼會這樣，寫下答案；再對答案問為什麼，畫成一串（本站建議）。每寫一個答案，就用 CMS 的檢查問題：「If the most recent response were corrected, is it likely the problem would recur?」，也就是改掉這個原因，問題還會再發生嗎？會的話就繼續問（翻譯是本站整理）。最後的原因要是自己改得動的事（本站建議）。
  - 問事情，不怪人：CMS 說「The RCA process should focus on systems rather than individual performance.」，重點放在做事的方法，不是某個人的表現（翻譯是本站整理）。答案出現誰很懶、都是誰害的，就改問那時發生了什麼事（本站建議）。大人也挑一個自己的問題讓孩子追問，大家輪流當小偵探（本站建議）。
  qa:
    question: 問到第幾次可以停？
    answer: 不看次數，看改掉這個原因後，問題還會不會再發生（本站整理）。CMS 說常常要三到五次，「but it can take more than five!」（翻譯是本站整理）。答案已經是自己改得動、改了就不容易再發生的事，就可以停下來想辦法（本站建議）。
    source: cms-5why
  items_title: 四步做
  items:
  - title: 說清楚問題
    text: 寫成看得到的事實。
  - title: 一層層問為什麼
    text: 畫成一串。
  - title: 檢查會不會再發生
    text: 會就繼續問。
  - title: 問事情不怪人
    text: 找改得動的原因。
  checklist_title: 問完檢查一下
  checklist:
  - 問了三層以上
  - 原因改得動
  - 沒有責怪人
  activity_figure: why5-flow
