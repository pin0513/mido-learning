idea: 第一個想到的原因常常只是表面。一直問「為什麼會這樣？」問三到五次，就會找到更根本、自己改得動的原因（豐田的「五個為什麼」）。要問「為什麼」，不要問「是誰的錯」。
guiding_questions:
- 早上常常遲到，真正的原因是起不來，還是別的？
scenario: 親子共學：大人也挑一個自己的問題（例如常忘記帶鑰匙），請孩子當「為什麼小偵探」一直追問。
goal: 對一個問題連續問「為什麼」，找到自己改得動的原因。
review: 對「早上常遲到」或「作業忘了帶」一起問到第 3–5 層，畫成一串；家長檢查最後一個原因是「我們改得動的事」，而且沒有變成責怪某個人。
formats:
