what:
  heading: 聽完說得回來
  body:
  - 學完後，孩子在別人說話時，會放下手邊的事、看著對方、讓對方說完，再用自己的話說回人、事、感覺，並問對方說得對不對。
  items_title: 學完能做到
  items:
  - title: 專心聽
    text: 放下手邊的事、看著對方。
  - title: 說回三樣
    text: 人、事、感覺。
  - title: 確認聽懂
    text: 問對方說得對不對。
  checklist_title: 家長檢核
  checklist:
  - 看著對方聽
  - 說回人事感覺
  - 問了對不對
  notes:
  - 本點融入家庭教育議題：議題融入說明手冊國小的實質內涵有了解家庭中各種關係的互動。吃飯時輪流說、輪流聽，就是在練習家人之間的互動。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - issues-handbook
  - genai-student
