how:
  heading: 停下來聽，再說回來
  body:
  - 先停下來：放下手上的東西、手機放旁邊，看著對方（本站建議）。CDC 的建議是「Make eye contact and stop other things you are doing.」對方說的時候不插嘴，讓他說完；國語課綱要「聆聽時能讓對方充分表達意見。」
  - 再說回來：用自己的話說回三樣重點，人（誰）、事（發生什麼事）、感覺（他覺得怎樣）（本站整理）。CDC 建議「Reflect or repeat back what they are saying and what they may be feeling to make sure you understand.」，說回對方說的事，也說回他可能的感覺（翻譯是本站整理）。可以這樣開頭：你是說……，你覺得……（本站建議）。
  - 最後問對不對：說完問一句對嗎。CDC 也提醒，先說回聽到的，「ask if you have it right」，再問別的或說自己的想法（翻譯是本站整理）。對方說不對，就請他再說一次，你再說回一次（本站建議）。練習時大人先說、孩子說回，再交換角色（本站建議）。
  qa:
    question: 說回重點時，要說哪三樣？
    answer: 人、事、感覺：誰、發生什麼事、他覺得怎樣（本站整理）。CDC 說說回時，要包括對方說的事和「what they may be feeling」，所以感覺也要說回（翻譯是本站整理）。
    source: cdc-listen
