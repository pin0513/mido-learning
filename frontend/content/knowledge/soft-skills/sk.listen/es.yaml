  - 放下手邊的事，專心看著對方
idea: 聽的時候放下手上的東西、看著對方、點頭；等他說完，用「你是說……對嗎？」說回重點。對方說「對！」，才算真的聽懂了。
guiding_questions:
- 怎麼讓對方知道你真的有在聽？
scenario: 親子共學：吃飯時手機放旁邊，輪流說一件今天的小事，下一個人先說回上一個人的重點再說自己的。
goal: 別人說話時看著對方、不插嘴，聽完用「你是說……」說回重點。
review: 家長說一件 1 分鐘的小煩惱，孩子聽完複述；家長判斷「人、事、感覺」三樣有沒有說對，再交換角色。
