why:
  heading: 對方沒笑，就先停
  body:
  - 國語課綱要孩子「與他人溝通時能尊重不同意見。」開玩笑也是溝通。你站在旁邊覺得好玩，不代表站在中間的人覺得好玩（本站整理）。
  - CASEL（美國推動社會情緒學習的組織）把社會覺察說明為「The abilities to understand the perspectives of and empathize with others, including those from diverse backgrounds, cultures, and contexts.」，例子包括「Showing concern for the feelings of others」，也就是理解別人的觀點、在意別人的感受（翻譯是本站整理）。換位子的完整練法在先備的點，這裡只多練一件事：先看臉。
  qa:
    question: 你覺得好玩，對方的臉也在笑嗎？
    answer: 不一定。史丹佛哲學百科整理一種老說法，叫做優越論：「our laughter expresses feelings of superiority over other people or over a former state of ourselves.」，笑是在表達自己比別人高，或比過去的自己高（翻譯是本站整理）。對方沒笑，就先停。
    source: sep-humor
  items_title: 開口前，並對到課綱
  items:
  - title: 看臉
    text: 對方有沒有跟著笑。
  - title: 問一句
    text: 你覺得好笑嗎？
  - title: 停下來
    text: 沒笑、皺眉、低頭，就換話題。
  - title: 尊重不同意見
    text: 與他人溝通時能尊重不同意見。
    code: 2-III-7
  sources:
  - kuoyu
  - casel-framework
  - sep-humor
how:
  heading: 看臉、問一句、停
  body:
  - 先看臉，再問一句，再決定說不說下去。沒笑就停，換一個不拿某一個人當笑點的話題（本站建議）。
  - 教育部《校園霸凌防制準則》第 4 條把霸凌定義成：個人或集體持續以言語、文字、電子通訊、網際網路或其他方式，故意對他人貶抑、排擠、欺負、騷擾或戲弄，使人處在敵意或不友善的環境，或造成損害、影響學習。單次玩笑不一定就是這條說的霸凌；臉已經不對，仍然先停（本站整理）。
  items_title: 四步做
  items:
  - title: 看臉
    example: 他有沒有跟著笑？
    text: 開口前先看對方。
  - title: 問一句
    example: 你覺得好笑嗎？
    text: 問被說到的那個人。
  - title: 停
    example: 他沒笑，這句到此。
    text: 沒笑、皺眉、低頭就停。
  - title: 換話題
    example: 改笑一件事，不笑人。
    text: 不拿某一個人當笑點。
  checklist_title: 說之前檢查
  checklist:
  - 先看對方的臉
  - 問他好不好笑
  - 不笑就停
  activity_figure: laugh-flow
  sources:
  - bully-rule
  - casel-framework
what:
  heading: 一起笑，才算好玩
  figures:
  - laugh-compare
  notes:
  - 本點不收集會傷人的句子。準則裡的霸凌還要看有沒有持續、故意，以及有沒有造成敵意環境、損害或影響學習。本頁的停比那條定義更早：臉不對就停（本站整理）。
  - 史丹佛哲學百科引 Roger Scruton：「If people dislike being laughed at,」人不喜歡被笑（翻譯是本站整理）。先看臉，就是在確認這句有沒有把對方貶低。
  sources:
  - sep-humor
  - bully-rule
