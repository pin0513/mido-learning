idea: 你覺得好笑，不代表被笑到的人也覺得好笑。開口前先看對方的臉；沒有一起笑，就停。拿別人的難堪來顯得自己比較高，就先不要說。
guiding_questions:
- 你覺得好玩，對方的臉也在笑嗎？
scenario: 親子共學：看一段大家都在笑的短片時暫停。孩子先看大人的臉，問「你覺得好笑嗎？」大人有一次不笑，孩子要能停，並換一個不拿人當笑點的話題。
goal: 開玩笑前先看對方的臉、問一句，對方沒笑就停。
review: 家庭練習三次，每次孩子都先看臉並問「你覺得好笑嗎？」；其中一次大人不笑，孩子能停下來並換話題，大人逐次打勾。
