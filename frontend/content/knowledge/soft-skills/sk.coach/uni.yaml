idea: 教練式對話常用 GROW 四步：目標（你想要什麼）、現況（現在怎樣）、選項（有哪些做法）、行動（你要先做哪一步）。多問少給答案，讓下一步由對方自己決定。
guiding_questions:
- 朋友來問你意見，直接給建議和多問幾個問題，哪個對他比較有用？
- 四個步驟各可以問什麼問題？
- 對方的煩惱超出你能陪的範圍時，怎麼辦？
scenario: 親子共學：家人遇到想解決的事時，大學生只用 GROW 四類問題陪他談，忍住不給答案；之後換家人陪大學生談（本站建議）。
goal: 用目標、現況、選項、行動四類問題，陪一個人談他想解決的事，讓下一步由他自己決定。
review: 不看本頁，說出 GROW 四步各是什麼、各舉一個可以問的問題、什麼情況要停下來陪對方找專業協助；並用 GROW 陪一位朋友或同學談約二十分鐘（時間是示意）他想解決的事，談完寫下你問了幾個問題、給了幾個建議，提問要比建議多；再請對方用一到五分評下一步是不是自己想出來的（分數是示意）。錄音要先徵得對方同意（本站建議）。
