why:
  heading: 用提問陪對方找答案
  body:
  - 加拿大公共服務學院的教練工作單這樣定義：「Coaching is a confidential process that meets a person where they are and uses a process of questioning and personal discovery to support growth and sustainable change in achieving professional and personal goals.」也就是保密、從對方現在的狀況出發，用提問陪他自己發現（翻譯是本站整理）。
  - Imperial College 的學習指南說「One of the earliest models is the GROW model, developed by Sir John Whitmore.」，它是「a learner-centred approach to structuring a conversation」（翻譯是本站整理）。給建議，是把你的答案交給對方；提問，是讓對方說出只有他知道的情況和在乎的事，再自己選（本站整理）。如果對方缺的只是資訊，例如報名截止日，就直接告訴他（本站建議）。
  qa:
    question: 朋友來問你意見，直接給建議和多問幾個問題，哪個對他比較有用？
    answer: 看情況。缺資訊就直接告訴他；要他自己做決定的事，多問幾個問題通常比較有用，因為只有他知道自己的情況。工作單說教練是用「a process of questioning and personal discovery」陪對方（翻譯是本站整理）。
    source: csps-grow
  items_title: 這一點用到的
  items:
  - title: 目標
    text: 對方想要達到什麼。
  - title: 現況
    text: 現在怎樣、卡在哪裡。
  - title: 選項
    text: 有哪些可能的做法。
  - title: 行動
    text: 第一步是什麼、何時做。
  checklist_title: 開始前先確認
  checklist:
  - 會問開放式問題
  - 會給回饋也收回饋
  figures:
  - coach-compare
  sources:
  - csps-grow
  - imperial-grow
how:
  heading: 四類問題陪對方談
  body:
  - 開始前先說好：我會多問少給答案，談的內容不外傳；要錄音先問對方，同意才錄，不同意就談完馬上寫下記得的內容（本站建議）。先問目標，工作單的例子是「What do you want to achieve?」、「What does success look like?」；再問現況，例如「What is the current situation?」、「What are the internal/external obstacles?」（翻譯是本站整理）。
  - 接著問選項：「What are your options?」、「What else could you do?」；Imperial 說這一步要「generate as many options as possible relating to your goal」（翻譯是本站整理）。最後問行動：「What is the first, next step?」、「When will you do it by?」，也可以問「On a scale of 1 to 10, what is your level of commitment to this action?」（翻譯是本站整理）。想給建議時，先把它改成問題，例如你想過先問助教嗎（例子是本站整理），選不選由對方決定（本站建議）。
  - 談完馬上寫下你問了幾個問題、給了幾個建議，數一數提問有沒有比建議多；再請對方用一到五分評下一步是不是自己想出來的（分數是示意）。教練式對話不是心理諮商：對方談到想傷害自己或他人、受到暴力，或長期情緒低落，就停止練習，陪他找學校諮商中心或專業人員；有立即危險就打 110 或 119（本站建議；電話是本站整理）。AI 可以提供問題清單，但不輸入對方姓名和談話內容（本站建議）。
  qa:
    question: 四個步驟各可以問什麼問題？
    answer: 目標問想達到什麼，現況問現在怎樣、卡在哪，選項問還有什麼做法，行動問第一步和何時做。工作單的例子有「What do you want to achieve?」和「What is the first, next step?」（翻譯是本站整理）。
    source: csps-grow
  items_title: 四步做
  items:
  - title: 說好規則
    text: 多問少答、保密、錄音先問。
  - title: 問目標和現況
    text: 想達到什麼？卡在哪？
  - title: 問選項
    text: 還有什麼做法？
  - title: 問第一步
    text: 先做什麼？何時做？
  checklist_title: 寫完檢查
  checklist:
  - 提問比建議多
  - 下一步對方定
  - 錄音有同意
  activity_figure: coach-flow
  sources:
  - csps-grow
  - imperial-grow
what:
  heading: 讓下一步由對方決定
  body:
  - 學完後，你能用目標、現況、選項、行動四類問題陪一個人談，忍住不給答案，讓他自己決定第一步，也知道什麼時候該停下來陪他找專業協助。
  items_title: 學完能做到
  items:
  - title: 問出目標
    text: 幫對方說清楚想要什麼。
  - title: 陪對方想選項
    text: 多問還有什麼做法。
  - title: 讓對方定第一步
    text: 做什麼、何時做由他決定。
  checklist_title: 自我檢核
  checklist:
  - 忍住沒給答案
  - 對方定了下一步
  - 知道何時轉介
  notes:
  - 本頁的問助教例子是本站整理；GROW 四步的英文問題取自加拿大公共服務學院的工作單，中文說明是本站整理。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - genai-student
