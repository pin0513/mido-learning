why:
  heading: 問答是一段對話
  body:
  - 麻省理工學院（MIT）溝通實驗室提醒：簡報後要留時間給提問，這些討論常是整場最有收穫的一段。
  - 高中國語文課綱也要學生「正確分析話語的訊息，並給予適切的回應」，並能「辨別聆聽內容的核心論點、議論立場及目的，並加以包容與尊重」。
  qa:
    question: 被問到不會的問題，你會硬掰還是怎麼說？
    answer: 不要硬掰。MIT 的建議是只說真的事，不要編造；可以說「這點我還沒查證」，說明你會怎麼查，並在之後確認你的回答有沒有解決對方的問題。
    source: mit-cee
  items_title: 練好以後，可以
  items:
  - title: 聽懂再回應
    text: 正確分析話語的訊息，並給予適切的回應。
    code: 1-V-1
  - title: 聽出立場
    text: 辨別核心論點、議論立場及目的，包容與尊重。
    code: 1-V-3
  sources:
  - mit-nse
  - kuoyu
how:
  heading: 聽完、複述、再答
  body:
  - 麻省理工學院（MIT）溝通實驗室建議：聽完整個問題，再向提問的人複述一次。這樣可以確認你聽懂了、讓其他聽眾也聽到問題，也替自己爭取思考的時間；回答前先吸一口氣。
  - 被質疑時，避免帶情緒或對抗的回應，先問清楚對方不同意的是哪一部分。
  items:
  - title: 聽完整個問題
    example: 不在對方說到一半時搶答。
    text: 先讓對方說完。
  - title: 複述確認
    example: 你是問：樣本只有 20 人夠不夠？
    text: 確認聽懂，也讓大家聽到。
  - title: 一兩句答重點
    example: 不夠下定論，所以我只說是初步結果。
    text: 先給答案，再補一句理由。
  - title: 不會就誠實說
    example: 這點我還沒查證，我會查課本和原始資料。
    text: 不編造；本站建議約好補充。
  activity_figure: how-flow
  sources:
  - mit-nse
  - mit-cee
