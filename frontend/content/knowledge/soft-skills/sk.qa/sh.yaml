idea: 問答常比簡報更重要。先複述或確認問題，再用一兩句回答重點；不知道就說「這點我還沒查證，會後補給你」。被質疑時，先找出對方擔心的是什麼。
guiding_questions:
- 被問到不會的問題，你會硬掰還是怎麼說？
scenario: 親子共學：大人的工作報告也請孩子當「刁難觀眾」問 3 題，換大人練習。
goal: 被提問時先確認問題，簡短回答；不知道就誠實說，並約好補充。
review: 簡報後家長問 3 題（一題刁難、一題不在內容裡），孩子每題都先確認問題、30 秒內答完重點；不會的題目沒有亂答。
