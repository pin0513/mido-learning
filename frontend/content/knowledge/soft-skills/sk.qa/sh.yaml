  supports: 學習表現 1-Ⅴ-1「面對不同的聆聽情境及文化差異，正確分析話語的訊息，並給予適切的回應。」、1-Ⅴ-3「能辨別聆聽內容的核心論點、議論立場及目的，並加以包容與尊重。」（p.7）
- id: mit-nse
  title: Delivery and Q&A（CommKit）
  publisher: MIT Department of Nuclear Science and Engineering Communication Lab
  url: https://mitcommlab.mit.edu/nse/commkit/delivery-and-qa/
  accessed: '2026-10-28'
  kind: reference
  supports: 3.3：聽完整個問題後複述給提問者，可確認理解、讓其他聽眾聽到、爭取思考時間；回答前先吸一口氣（Take a breath）；4：要留時間給提問，「These discussions are often the most valuable part of the presentation」
- id: mit-cee
  title: Handling the Q&A Session（CommKit，Matthew Goss）
  publisher: MIT Civil and Environmental Engineering Communication Lab
  url: https://mitcommlab.mit.edu/cee/commkit/handling-the-question-and-answer-session/
  accessed: '2026-10-28'
  kind: reference
  supports: 問題分三類（Clarify、Justify/Explain、Extrapolate/Reach）；被質疑時「avoid an emotional or combative response」並問清楚對方不同意哪一部分；不知道答案時，可說明若有更多時間與資源會怎麼處理，並「stick with saying true things… don’t make stuff up」；「consider following up to see if your answer addressed their question」。情境是研究生口試
