idea: 簡報後的問答，常是整場最有收穫的一段。先完整聽完問題、複述確認，再用一兩句回答重點；不知道就誠實說，不要硬掰；本站建議可以約好會後補充。被質疑時不要動氣，先問清楚對方不同意的是哪一部分。
guiding_questions:
- 被問到不會的問題，你會硬掰還是怎麼說？
scenario: 親子共學：大人的工作報告也請孩子當「刁難觀眾」問 3 題，換大人練習。
goal: 被提問時先確認問題，簡短回答；不知道就誠實說，並約好補充。
review: 簡報後家長問 3 題（一題刁難、一題不在內容裡），孩子每題都先確認問題、30 秒內答完重點（示意）；不會的題目沒有亂答。
