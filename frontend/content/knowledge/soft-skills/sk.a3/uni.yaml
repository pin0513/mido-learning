what:
  heading: 用一頁報告帶團隊解題
  body:
  - 學完後，你能帶團隊把一個問題寫成一頁報告：看懂現況、追到根本原因、訂出對策和分工，約好怎麼追蹤，並回報結果。
  items_title: 學完能做到
  items:
  - title: 寫清現況和原因
    text: 現況有數據，原因追到根本。
  - title: 分工到人
    text: 每個成員說得出自己負責的事。
  - title: 追蹤結果
    text: 照約好的日期量，寫下結果。
  checklist_title: 自我檢核
  checklist:
  - 一頁寫得下
  - 成員說得出分工
  - 追蹤結果已回報
  notes:
  - 本頁的家事、社團例子是本站整理；報告欄位依 Sobek 與 Jimmerson 2006 的 A3 範本，中文欄名是本站整理。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - genai-student
