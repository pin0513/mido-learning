how:
  heading: 照欄位帶團隊寫一頁
  body:
  - 先看現況、找原因。找問題相關的人一起做，到現場看：「In practice, this involves observing the process first-hand, gathering data, and interviewing those affected.」（翻譯是本站整理）。再一路問為什麼，因為「The apparent direct cause of a problem is rarely the root cause.」；寫好後拿給受影響的人看，請他們補充、指出漏掉的地方（翻譯是本站整理）。例如社團器材常常不見，直接原因是有人借了沒還，問下去可能是借用沒有登記的地方（例子是本站整理）。
  - 再訂對策和分工。每個對策都要對準一個根本原因；行動計畫要寫出「who will take each action, and when.」，也就是每一列都有負責人和完成日期（翻譯是本站整理）。要讓每個成員都知道自己負責什麼，會議結束前請每個人用自己的話說出自己那一列和期限，說不清楚就當場改寫那一列（本站建議）。
  - 最後約好追蹤。A3 教學網站說追蹤計畫要寫「what will be measured, when, and who will do the measuring.」（翻譯是本站整理）。一個問題解決了，要確定它不再發生：對策要對準根本原因，並在約好的日期量一次，例如約一個月後（時間是示意），把結果寫進結果欄；沒達到就回頭檢查是現況沒看懂，還是計畫沒做到（本站整理）。AI 可以幫忙整理資料、排版，但不輸入成員姓名等個人資料，數字要對照原始資料（本站建議）。
  qa:
    question: 一個問題解決了，怎麼確定它不會再發生？
    answer: 對策要對準根本原因，並照追蹤計畫在約好的日期量一次、寫下結果。A3 教學網站說追蹤計畫要寫「what will be measured, when, and who will do the measuring.」（翻譯是本站整理）。
    source: a3-report
