why:
  heading: 一張紙說清楚問題
  body:
  - Sobek 與 Jimmerson 介紹豐田的做法：「The A3 report is a tool that Toyota Motor Corporation uses in problem-solving.」名稱來自紙張大小，「The A3 report is so named because it is written on an A3 sized paper」，不是課綱的核心素養（翻譯是本站整理）。範本依序寫問題陳述、背景、現況、原因分析、目標、行動計畫、追蹤和結果；原因分析要寫出「chain of cause-and-effects leading to the root of the problem.」，也就是一路追到根本原因的因果鏈（翻譯是本站整理）。
  - 寫在一頁上，有兩個好處（本站整理）：一是逼自己把每一欄寫短、寫清楚；二是大家能看著同一張紙討論。Sobek 與 Jimmerson 說，寫好現況和原因後，要拿給「representatives of all affected parties」看並請他們回饋，這時「The draft A3 report in-progress serves as the focal point of discussion, and is revised as appropriate.」（翻譯是本站整理）。
  qa:
    question: 為什麼要把解題過程寫在一頁上？
    answer: 寫在一頁上，逼團隊把每一欄說清楚，也讓相關的人能看著同一張紙討論、一起改。Sobek 與 Jimmerson 說草稿「serves as the focal point of discussion」（翻譯是本站整理）。
    source: sobek-a3-2006
