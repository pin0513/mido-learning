idea: A3 報告（源自豐田汽車，A3 是紙張大小）把整個解題過程寫在一張紙上：背景、現況、原因分析、目標、對策與行動計畫、追蹤。寫在一頁上，逼團隊把話說清楚，也方便大家一起看、一起改。
