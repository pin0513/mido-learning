idea: A3 報告（源自豐田）把整個解題過程寫在一張紙上：背景、現況、目標、原因分析、對策、行動計畫、追蹤。寫在一頁上，逼團隊把話說清楚，也方便大家一起看、一起改。
guiding_questions:
- 一個問題解決了，怎麼確定它不會再發生？
scenario: 親子共學：家庭年度檢討：大人把一件想改善的家事寫成一頁報告，孩子負責追蹤欄。
goal: 用一頁的 A3 報告帶團隊走完：問題、原因、對策、行動與追蹤。
review: 帶 3 人以上的團隊處理一個真實問題，交一頁報告，一個月後回報追蹤數字；請每位成員回答「我知道我負責什麼」。
formats:
