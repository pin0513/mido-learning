verify_notes:
- 核心素養 C2、B1：依總綱 p.4–6 國民中學教育的 J-C2、J-B1 與綜合活動領綱 p.5 的綜-J-C2、國語文領綱 p.4 的國-J-B1（綜-J-B1 跨頁，改引國-J-B1）原文確認（表格窄欄分散對齊，字距大，文字用 pdftotext 原始順序層與頁面文字塊核對）。
- stage.grades 填 7、8、9：本點的代碼都是第四學習階段（IV），國中的學習重點沒有再分年級；總綱 p.7 說國民中學七、八、九年級為第四學習階段。
- est_time 依綜合活動領綱 p.2：第四學習階段綜合活動每週 3 節課；本點建議在綜合活動課上做，也可以親子一起練（本站建議）。
- 頁碼都是頁腳印的頁碼：綜合活動領綱與總綱比 PDF 頁少 4，國語文領綱少 2，議題融入說明手冊少 16；教育部學生版的 PDF 頁就是頁腳印的頁碼。
- 綜合活動 2a-IV-3（p.19 學習表現表）、家 Da-IV-1（p.85 附錄學習內容說明表，與代碼表既有的家 Ca-IV-1 同頁）原本不在代碼表，本批依原文加入（taxonomy patch）；國語文 2-IV-1 沿用代碼表的文字與頁碼。
- 健康與體育領綱也有同號的學習表現：1b-IV-2、2a-IV-1、2a-IV-3、2c-IV-1（健體 p.26），文字和綜合活動不同；健體不在代碼表，代碼表以代碼為鍵，將來要收健體要先改 schema（taxonomy 的綜合活動區塊加了註解）。健體的學習內容 Da-IV-1、Db-IV-1（健體 p.28）沒有科目字首，本點的家 Da-IV-1、輔 Db-IV-1 帶字首，鍵不衝突。
- 原 curriculum_108.domains 只有綜合活動，本點加上國語文 2-IV-1（適切表情達意），所以 domains 補語文。
- 議題家庭教育：家庭教育國中實質內涵 家J5「了解與家人溝通互動及相互支持的適切方式。」（p.66）。
- 原稿的三部分是事件、感受、原因；依高登訓練機構的原文，第三部分改成對我的具體影響（EFFECT），句型的因為後面接影響。
- 原 idea 的「對方會先防衛」改成容易先防衛、「對方比較聽得進去」改成比較可能聽得進去（不寫成定論）；「這個說法來自心理學家高登的親子溝通」改成來自美國的高登博士：來源只寫 Dr. Thomas Gordon 與 P.E.T. 的作者，沒有寫心理學家。
- 原 guiding question 的兩句引文拿掉引號；原 goal 的句型拿掉引號（引號內超過 5 個字的句子只放在有出處的地方）；原 review 的 3 句標成示意，原因改成影響。
- 原 scenario「親子共學：冰箱上貼一張『你訊息 → 我訊息』改寫表，誰說了『你都……』就一起改一句。」保留做法，補上本站建議。內層引號與箭頭拿掉。
- 原 ai.delegable「把一句指責改寫成我訊息的草稿」補上由老師或家長操作（本站建議），並在 What 加上教育部注意事項（學生版）的使用規則。
- 原有草稿說明「課綱對應只到領域、核心素養與議題…」已處理：本點已逐條對照官方領綱與議題融入說明手冊原文（頁碼見來源）。
- 原有草稿說明「引用的框架只寫名稱（我訊息（I-message））…」已處理：依 Gordon Training International（高登訓練機構）兩篇文章改寫，英文短句逐字引用，中文說明是本站整理。
- 兩篇文章是寫給大人（職場、親子）的；本點用在國中生和家人之間的溝通（本站建議）。文章裡的例句含彎引號，本頁不引例句。
- 英文網頁的引文取自 2026-10-30 讀取的網頁；只取不含彎引號、撇號的句子或片段；中文說明和翻譯是本站整理。
- 生成式 AI 的使用規則依教育部注意事項（學生版）；supports 逐段標頁碼（學生版的 PDF 頁就是頁腳印的頁碼）。
