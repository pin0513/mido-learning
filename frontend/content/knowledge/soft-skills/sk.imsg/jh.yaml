idea: 「你訊息」聽起來像指責，對方會先防衛。「我訊息」說的是事件、我的感受和原因，對方比較聽得進去（這個說法來自心理學家高登的親子溝通）。
guiding_questions:
- 「你都不聽我說」和「我說到一半被打斷，覺得很挫折」，哪一句比較不會吵起來？
scenario: 親子共學：冰箱上貼一張「你訊息 → 我訊息」改寫表，誰說了「你都……」就一起改一句。
goal: 把「你都……」改成「當……時，我覺得……，因為……」。
review: 孩子和家長各把 3 句最近說過的「你訊息」改寫成我訊息，互相檢查每句是否有事件、感受、原因三部分，並在一週內真的用一次。
