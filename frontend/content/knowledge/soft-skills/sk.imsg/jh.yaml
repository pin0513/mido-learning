idea: 「你訊息」聽起來像指責，對方容易先防衛。「我訊息」說的是對方做了什麼、我的感受、對我的影響，對方比較可能聽得進去（這個說法來自美國的高登博士）。
guiding_questions:
- 你都不聽我說，和我說到一半被打斷覺得很挫折，哪一句比較不會吵起來？
- 我訊息要有哪三部分？
- 為什麼只說我很生氣還不夠？
scenario: 親子共學：冰箱上貼一張你訊息改成我訊息的改寫表，誰說了你都……，就一起改一句（本站建議）。
goal: 把指責別人的你訊息，改成用當……時，我覺得……，因為……說出事、感受和影響的我訊息。
review: 孩子和家長各把 3 句最近說過的你訊息改寫成我訊息，互相檢查每句有沒有事、感受、影響三部分，並在一週內真的用一次（數字都是示意）。
