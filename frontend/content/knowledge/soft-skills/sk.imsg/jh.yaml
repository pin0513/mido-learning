how:
  heading: 三部分：事、感受、影響
  body:
  - 第一部分說事：只說對方做了什麼，不加罵人的字（本站建議）。高登訓練機構列的第一部分是「A brief, non-blameful description of the BEHAVIOR you find unacceptable.」，也就是簡短、不責怪地描述那個行為（翻譯是本站整理）。例如：當我說到一半被打斷時（例子是本站整理）。
  - 第二部分說感受：我覺得挫折、擔心或難過（例子是本站整理）。第三部分說影響：「The tangible and concrete EFFECT of the behavior on you.」，也就是這件事對你具體造成什麼影響，例如因為我會忘了要說什麼（翻譯和例子是本站整理）。可以用這個句型：當……時，我覺得……，因為……（本站建議）。
  - 練習時先改寫：把最近說過的你都……，改成三部分的我訊息，請對方檢查三部分有沒有齊；一週內挑情緒比較平穩的時候，真的說出口一次（本站建議）。剛開始會覺得不自然，文章說「with practice, they will come much more naturally」（翻譯是本站整理）。太生氣時，可以先離開一下再說（本站建議）。
  qa:
    question: 我訊息要有哪三部分？
    answer: 事、感受、影響：對方做了什麼、你覺得怎樣、對你有什麼具體影響（本站整理）。高登訓練機構寫的三部分是行為（BEHAVIOR）、感受（FEELINGS）和具體影響（EFFECT），第三部分是「The tangible and concrete EFFECT of the behavior on you.」（翻譯是本站整理）。
    source: gti-three
  items_title: 四步做
  items:
  - title: 說事
    text: 對方做了什麼，不罵人。
  - title: 說感受
