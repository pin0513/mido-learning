why:
  heading: 說出感受，不先指責
  body:
  - 綜合活動課綱要國中生「覺察自己與家人溝通的方式，增進經營家庭生活能力。」家政的學習內容有「家人溝通與情感表達。」國語課綱也要「掌握生活情境，適切表情達意，分享自身經驗。」家庭教育議題的國中實質內涵，則有「了解與家人溝通互動及相互支持的適切方式。」
  - 我訊息是美國的高登博士（Thomas Gordon）提出的說法，高登訓練機構寫「The three-part I-Message was created by Thomas Gordon.」。文章說，你訊息「places blame on the other person」，而且「they have the added effect of damaging the relationship.」，也就是把錯推給對方，還會傷到關係（翻譯是本站整理）。
  qa:
    question: 為什麼只說我很生氣還不夠？
    answer: 只說感受，對方不知道是哪件事、對你有什麼影響（本站整理）。高登訓練機構的文章說，只說自己的感覺是「an incomplete confrontation」，因為三個部分只說了一個（翻譯是本站整理）。
    source: gti-three
  items_title: 課綱的學習重點
