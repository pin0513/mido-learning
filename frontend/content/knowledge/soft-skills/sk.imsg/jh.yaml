what:
  heading: 不吵也說得出口
  body:
  - 學完後，能把指責對方的你訊息，改成有事、感受、影響三部分的我訊息，並挑平靜的時候在生活中試著用。
  items_title: 學完能做到
  items:
  - title: 改寫你訊息
    text: 改成我訊息。
  - title: 三部分齊全
    text: 事、感受、影響。
  - title: 真的用一次
    text: 挑平靜的時候說。
  checklist_title: 家長檢核
  checklist:
  - 三部分都有
  - 沒有罵人的字
  - 一週內用過
  notes:
  - 本點融入家庭教育議題：議題融入說明手冊國中的實質內涵有了解與家人溝通互動及相互支持的適切方式。親子互相改寫我訊息，就是在練習家人之間的溝通。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - issues-handbook
  - genai-student
