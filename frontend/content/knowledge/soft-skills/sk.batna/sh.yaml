  - 誠實判斷自己最多能接受到哪裡
idea: 談判前先寫下兩件事：談不成的話，我最好的其他選擇是什麼（BATNA）；根據這個選擇，我最多能接受到哪裡（底線）。有了這兩件事，比較不會因為現場氣氛答應一個比不談還差的條件。
guiding_questions:
- 想跟爸媽談延長手機時間，談不成的話你還能做什麼？
scenario: 親子共學：孩子和大人各準備一場真的要談的事（零用錢、打工時薪、家事分工），開談前互看對方的準備表：其他選擇、底線、想問對方的問題。
goal: 談判前寫出至少兩個其他選擇、挑出最好的一個，並依它定出底線。
review: 為一場真實的談判（打工時薪、二手買賣、社團經費）填準備表：至少兩個其他選擇並標出最好的、一個底線和理由、兩個想問對方的問題；談完寫下結果有沒有高於底線。
