why:
  heading: 知道談不成怎麼辦，才知道要不要答應
  body:
  - 社會課綱在高中公民問：「消費者對某單位產品的願付價格是如何決定的？」願付價格不是憑感覺：你知道別處可以用多少錢買到，就知道這裡最多付多少。
  - 哈佛法學院談判研究計畫（PON）說明，BATNA 是「Best Alternative to a Negotiated Agreement」，白話就是「what you will do if you do not reach a deal」；底線則是「the least favorable deal you’d accept, based on that alternative.」
  qa:
    question: 想跟爸媽談延長手機時間，談不成的話你還能做什麼？
    answer: 先列出來：例如週末改去打球、用電腦做作業時順便查資料。挑出最好的一個，再想：如果爸媽只答應多十分鐘，比這個選擇好還是差？比較差就不必急著答應，可以再提別的方案。
    source: pon-batna
  items_title: 練好以後，可以
  items:
  - title: 願付價格
    text: 說明自己的願付價格是怎麼決定的。
    code: 公 Bo-V-1
  - title: 列出替代方案
    text: 談判前寫出談不成時的其他選擇。
  - title: 定出底線
    text: 根據最好的替代方案，說出最多接受到哪裡。
  sources:
  - shehui
  - pon-batna
  - pon-reservation
how:
  heading: 列選擇、挑最好、定底線
  body:
  - 先把談不成時能做的事都寫下來；挑出最好的一個；再用它算出底線。最後準備兩個問題，開談時先問對方在意什麼。底線自己知道就好，不必一開口就說。（本站建議）
  items:
  - title: 列選擇
    example: 便利商店時薪、家教、不打工專心讀書
    text: 談不成時，你還能做什麼。
  - title: 挑最好
    example: 便利商店，時薪已知
    text: 選出最好的那一個，就是你的 BATNA。
  - title: 定底線
    example: 低於便利商店的時薪就不接
    text: 根據 BATNA，寫下最多接受到哪裡。
  - title: 備問題
    example: 這份工作最需要什麼時段？
    text: 準備兩個問對方需要的問題。
  activity_figure: how-flow
  sources:
  - pon-batna
  - pon-reservation
what:
  heading: 替代方案不等於底線
  figures:
  - what-compare
  notes:
  - BATNA 是「談不成時最好的其他選擇」，是一件你真的可以去做的事；底線是根據它算出來的數字或條件。替代方案變好，底線也會跟著變。
  sources:
  - pon-batna
  - pon-reservation
