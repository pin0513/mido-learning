idea: 問題就是現在的樣子和想要的樣子之間的差距。把兩邊都說清楚，才知道要解決什麼，也才知道什麼時候算解決了。
guiding_questions:
- 「房間好亂」是問題，還是一種感覺？
- 怎樣的希望才算說清楚？
- 為什麼先不要急著說要怎麼做？
scenario: 親子共學：全家各寫一張便利貼，寫下現在怎樣、我希望怎樣，貼在冰箱，一週後看哪幾張做到了（本站建議）。
goal: 用兩句話把一個生活小問題說清楚：「現在……」說看得到的事實，「我希望……」說做到時看得到、能確認的樣子。
review: 孩子挑家裡一個小問題，寫成「現在……」和「我希望……」兩句貼在便利貼上；家長檢查現在那句是看得到的事實，希望那句看得到、能確認（例如書都在書架上，不是變整齊），而且還沒有寫要怎麼做。
