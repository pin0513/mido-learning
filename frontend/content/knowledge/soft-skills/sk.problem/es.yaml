what:
  heading: 把問題說成兩句話
  body:
  - 學完後，孩子能用現在和我希望兩句話，把一個生活小問題說清楚：現在那句是看得到的事實，希望那句是做到時看得到、能確認的樣子，而且先不急著寫辦法。
  items_title: 學完能做到
  items:
  - title: 說出現在
    text: 看得到的事實。
  - title: 說出希望
    text: 做到時能確認。
  - title: 分開問題和辦法
    text: 先說問題，再想辦法。
  checklist_title: 家長檢核
  checklist:
  - 現在是事實
  - 希望能確認
  - 還沒寫辦法
  notes:
  - 問題說清楚之後，下一步可以學問五次為什麼，找出問題的原因（本站建議）。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - genai-student
