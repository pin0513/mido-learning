idea: 問題就是「現在的樣子」和「想要的樣子」之間的差距。把兩邊都說清楚，才知道要解決什麼，也才知道什麼時候算解決了。
guiding_questions:
- 「房間好亂」是問題，還是一種感覺？
scenario: 親子共學：全家各寫一張「現在……，我希望……」便利貼貼在冰箱，一週後看哪幾張做到了。
goal: 用「現在……，我希望……」把一個問題說清楚。
review: 孩子挑家裡一個小問題，用「現在……，我希望……」寫在便利貼上；家長檢查「希望」是看得到、能確認的（例如「書都在書架上」，不是「變整齊」）。
