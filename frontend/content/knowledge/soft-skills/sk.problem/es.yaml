how:
  heading: 兩句話：現在和我希望
  body:
  - 先寫現在：寫下看得到的事實，例如書和衣服堆在床上；不寫好亂、好煩這種感覺的詞（本站建議）。CMS 的教材說，寫問題要「objectively state what went wrong, not why, or how」，所以先不寫原因，也先不寫要怎麼做（翻譯是本站整理）。
  - 再寫我希望：寫一個看得到、能確認的樣子，例如書都在書架上，而不是變整齊（本站建議）。AHRQ 建議找出「a measurable goal」，也就是做到沒有，能量得出來、看得出來的目標（翻譯是本站整理）。
  - 最後檢查兩句：問自己，別人看了這兩句，能不能知道現在怎樣、做到時是什麼樣子（本站建議）。CMS 也提醒「Be sure to start with a problem and not the solution.」，所以像要買收納盒這類辦法先不寫（翻譯是本站整理）。貼在冰箱，一週後一起看希望那句做到了沒有（本站建議）。
  qa:
    question: 怎樣的希望才算說清楚？
    answer: 看得到、能確認：別人來看，也能說出做到了沒有（本站整理）。AHRQ 建議找出「a measurable goal」（翻譯是本站整理）。像書都在書架上，一看就知道；變整齊每個人想的不一樣（例子是本站整理）。
    source: ahrq-gap
