why:
  heading: 說清楚問題，才知道往哪走
  body:
  - 綜合活動課綱要三、四年級「蒐集與整理各類資源，處理個人日常生活問題。」要處理問題，先要知道問題是什麼（本站整理）。
  - 美國醫療研究與品質局（AHRQ）的品質改善教材說，差距分析是找出「the difference between your current performance, or where you are now, and the ideal state, or where you want to be」，也就是現在在哪裡、想到哪裡（翻譯是本站整理）。把它說成兩句，就是現在怎樣、我希望怎樣（本站整理）。
  qa:
    question: 「房間好亂」是問題，還是一種感覺？
    answer: 比較像感覺。好亂沒有說清楚現在是什麼樣子，也沒有說想要什麼樣子（本站整理）。美國聯邦醫療保險與補助服務中心（CMS）的教材提醒，寫問題要客觀說出「what went wrong」（翻譯是本站整理）。可以改成：現在書和衣服堆在床上，我希望書都在書架上（例子是本站整理）。
    source: cms-rca
