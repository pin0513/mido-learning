idea: 亞里斯多德把說服分成三種：信譽（為什麼信你）、情感（對方在乎什麼）、邏輯（證據與推理）。只有邏輯常常不夠；先了解決策者的處境與顧慮，再設計提案。
guiding_questions:
- 數據都對，對方還是說不要，少了什麼？
scenario: 親子共學：大人把下一個工作提案先講給家人聽，孩子負責找出「哪裡讓我想相信你」。
goal: 對真正能做決定的人提案，兼顧信譽、情感和邏輯三種說服力。
review: 對一位真正的決策者（主管、系上老師、社區里長）做 10 分鐘提案；事前寫下三種說服力各用在哪裡，事後請對方說出「最被說服的一點」和「最大的顧慮」。
