sources:
- id: aristotle-rhetoric
  title: Rhetoric, Book I（Aristotle，W. Rhys Roberts 英譯）
  publisher: The Internet Classics Archive，麻省理工學院（MIT）
  url: https://classics.mit.edu/Aristotle/rhetoric.1.i.html
  accessed: '2026-10-28'
  kind: reference
  supports: Part 2：演說提供的說服方式有三種，取決於說話者的品格、讓聽眾產生某種心情、以及演說本身的證明；品格的說服「should be achieved by what the speaker says, not by what people think of his character before he begins to speak」；「persuasion may come through the hearers, when the speech stirs their emotions」。Part 1：面對某些聽眾，即使擁有最精確的知識也不容易說服，此時要用大家都有的共同觀念（notions possessed by everybody）。Part 8：政治演說的脈絡下「all men are persuaded by considerations of their interest」（脈絡是談政體：their interest lies in the maintenance of the established order）
- id: aristotle-perseus
  title: Rhetoric 1.2（Aristotle，J. H. Freese 英譯，備援版本）
  publisher: Perseus Digital Library，Tufts University
  url: https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0060%3Abook%3D1%3Achapter%3D2
  accessed: '2026-10-28'
  kind: reference
  supports: 1.2.3：「the proofs furnished by the speech are of three kinds」：說話者的品格、讓聽者產生某種心情、演說本身；1.2.4：可信度「must be due to the speech itself, not to any preconceived idea of the speaker's character」。與 MIT 版不同譯者，用來備援核對
- id: sep-rhetoric
  title: Aristotle’s Rhetoric（Stanford Encyclopedia of Philosophy）
  publisher: Christof Rapp，Stanford Encyclopedia of Philosophy（2002 初版，2022 修訂）
  url: https://plato.stanford.edu/entries/aristotle-rhetoric/
  accessed: '2026-10-28'
  kind: reference
  supports: §5 三種說服方式：說話者的品格、聽者的情感、論證本身；§5.1 演說要讓說話者顯得值得相信，說話者需要展現實踐智慧（phronêsis）、德行與善意（Rhet. II.1）
