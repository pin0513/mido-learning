idea: 亞里斯多德把演說的說服方式分成三種：說話者的品格（這次說的話讓人覺得可信）、聽眾的情感（說的話讓聽眾產生某種心情）、論證本身（證據與推理）。他也提醒，面對某些聽眾，光有最精確的知識也不容易說服；先了解決策者的處境與顧慮，再設計提案。
guiding_questions:
- 數據都對，對方還是說不要，少了什麼？
scenario: 親子共學：大人把下一個工作提案先講給家人聽，孩子負責找出「哪裡讓我想相信你」。
goal: 對真正能做決定的人提案，兼顧可信度、情感和邏輯三種說服力。
review: 對一位真正的決策者（主管、系上老師、社區里長）做 10 分鐘（示意）提案；事前寫下三種說服力各用在哪裡，事後請對方說出「最被說服的一點」和「最大的顧慮」。
