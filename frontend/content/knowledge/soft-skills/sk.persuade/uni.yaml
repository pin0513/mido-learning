why:
  heading: 數據都對，為什麼還不夠
  body:
  - 亞里斯多德在《修辭學》第一卷說，面對某些聽眾，即使擁有最精確的知識，也不容易讓他們信服，因為以知識為基礎的論證需要教導，而有些人無法這樣被教導。
  - 在第一卷第 2 章（MIT 譯本標為 Part 2），他把演說本身能提供的說服方式分成三種：靠說話者的品格、靠讓聽眾產生某種心情、靠演說本身的證明。本站建議：提案前三種都檢查一遍。
  qa:
    question: 數據都對，對方還是說不要，少了什麼？
    answer: 可能少了另外兩種說服：對方是否覺得你可信（你這次說的話是否顯得有見識、正直、為他著想），以及提案有沒有讓他產生想支持的心情。另外，亞里斯多德在談政治演說與政體時也提到，人會被和自身利益有關的考量說服，所以也要說清楚這個提案對他有什麼好處。
    source: sep-rhetoric
  items_title: 三種說服方式
  items:
  - title: 品格（可信度）
    text: 這次說的話，讓人覺得你可信。
  - title: 情感
    text: 讓聽眾產生某種心情。
  - title: 論證（邏輯）
    text: 用證據與推理證明。
  sources:
  - aristotle-rhetoric
  - aristotle-perseus
  - sep-rhetoric
how:
  heading: 先懂對方，再設計提案
  body:
  - 可信度要在這次提案裡建立：亞里斯多德說，品格的說服應該來自說話者這次說了什麼，不是開口前別人怎麼看他。史丹佛哲學百科整理，說話者要展現實踐智慧、德行和善意。
  - 情感與論證則要配合對方：先問清楚決策者的處境與顧慮，再決定先說哪個證據、碰觸他在乎的哪件事。（本站建議）
  items:
  - title: 可信度
    example: 說明你查了哪些資料、提案的限制在哪裡。
    text: 展現見識、正直與善意。
  - title: 情感
    example: 先描述團隊不再加班後的輕鬆，讓人產生期待。
    text: 讓聽眾產生想支持的心情。
  - title: 論證
    example: 三個月試行數據：準時率提高（數字示意）。
    text: 證據與推理。
  activity_figure: how-flow
  sources:
  - aristotle-rhetoric
  - sep-rhetoric
what:
  heading: 可信度不等於名聲
  figures:
  - what-compare
  notes:
  - 本點用「可信度」翻譯第一種說服方式，避免讀成「開口前的名聲」；學界常用希臘文 ethos、pathos、logos 指這三種方式，《修辭學》英譯本原文寫的是 personal character、frame of mind、proof。
  sources:
  - aristotle-rhetoric
  - sep-rhetoric
