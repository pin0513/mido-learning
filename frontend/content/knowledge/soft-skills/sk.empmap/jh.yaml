idea: 同理心地圖把一個人分成四格：說了什麼、做了什麼（看得到），可能在想什麼、可能有什麼感受（要推測）。看得到的寫事實，推測的要標出來，之後再去問本人確認。
guiding_questions:
- 一個人說「沒關係」的時候，心裡想的也是沒關係嗎？
scenario: 親子共學：親子互畫：孩子畫爸媽的一天，爸媽畫孩子的一天，交換後只說「哪一格最像、哪一格猜錯」。
goal: 為一個真實的人畫同理心地圖，分開寫出他說的、做的、想的和感受。
review: 為一位家人畫同理心地圖（例如每天準備晚餐的爸爸），請本人在每格打勾或打叉「像不像我」；至少 3 格打勾，打叉的格子寫下自己猜錯的原因。
