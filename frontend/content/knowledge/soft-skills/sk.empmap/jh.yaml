why:
  heading: 先看見對方，再猜他的心
  body:
  - 綜合活動課綱要國中生「體認人際關係的重要性，學習人際溝通技巧，以正向的態度經營人際關係。」輔導的學習內容也有「同理心、人際溝通、衝突管理能力的培養與正向經營人際關係。」國語課綱則要「以同理心，聆聽各項發言，並加以記錄、歸納。」
  - 同理心地圖是設計思考常用的工具。美國的使用者經驗研究機構 Nielsen Norman Group 說，傳統的同理心地圖分成說（Says）、想（Thinks）、做（Does）、感受（Feels）四格，「The four quadrants of an empathy map surround the persona at the center.」，也就是四格圍著中間那個人（翻譯是本站整理）。把看到的和猜的分開寫，比較不會把自己的想法硬套在別人身上（本站整理）。
  qa:
    question: 一個人說「沒關係」的時候，心裡想的也是沒關係嗎？
    answer: 不一定。說出口的話寫在說那一格，心裡的想法只能先猜，寫在想那一格並標出是猜的（本站建議）。Nielsen Norman Group 也提醒，四格有時會互相矛盾，「You may encounter positive actions next to negative emotions.」，而且「Those contradictions are worth investigating」，例如嘴上說好、看起來卻很累，就值得再去問清楚（翻譯和例子是本站整理）。
    source: nng-empathy
  items_title: 課綱的學習重點
  items:
  - title: 用同理心聆聽
    text: 國語文 1-IV-1：以同理心，聆聽各項發言，並加以記錄、歸納。
    code: 1-IV-1
  - title: 學習人際溝通技巧
    text: 綜合活動 2a-IV-1：體認人際關係的重要性，學習人際溝通技巧，以正向的態度經營人際關係。
    code: 2a-IV-1
  - title: 培養同理心
    text: 綜合活動 輔 Dc-IV-1：同理心、人際溝通、衝突管理能力的培養與正向經營人際關係。
    code: 輔 Dc-IV-1
