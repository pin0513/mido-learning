how:
  heading: 四格分開寫，再問本人
  body:
  - 先寫看得到的兩格（本站建議）。說：寫他真的說過的話，Nielsen Norman Group 說這一格最好是「verbatim, direct quotes」，也就是原話（翻譯是本站整理）。做：寫他做了什麼，文章建議「ask what the user actually does and how they go about it.」，也就是看他實際上做什麼、怎麼做（翻譯是本站整理）。
  - 再寫要推測的兩格：想（他心裡可能在想什麼）、感受（他可能覺得怎樣），寫的時候標出是猜的（本站建議）。文章說，資料不夠也可以先畫，只要「the team is honest and clearly distinguishes evidence from assumptions.」，也就是誠實分清楚哪些是證據、哪些是猜測（翻譯是本站整理）。
  - 最後問本人：拿給對方看，請他每格打勾（像）或打叉（不像）（本站建議）。打叉的格子，寫下自己猜錯的原因，例如只看到一次就下結論（例子是本站整理）。地圖只拿來確認自己懂了沒，不拿來評論對方；猜錯了就改，再問一次（本站建議）。
  qa:
    question: 哪兩格看得到，哪兩格要推測？
    answer: 說和做看得到，寫你真的聽到、看到的事；想和感受要推測，寫的時候標出是猜的（本站整理）。文章說做這一格要問「what the user actually does」，也就是他實際上做了什麼（翻譯是本站整理）。
    source: nng-empathy
  items_title: 四步做
  items:
  - title: 寫說的話
    text: 只寫真的聽到的。
  - title: 寫做的事
    text: 只寫真的看到的。
  - title: 猜想法和感受
    text: 標出是猜的。
  - title: 請本人打勾
    text: 打叉的寫原因。
