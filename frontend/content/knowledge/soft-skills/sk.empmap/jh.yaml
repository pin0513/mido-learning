what:
  heading: 分得清看到的和猜的
  body:
  - 學完後，能為一位真實的人畫同理心地圖，把他說的、做的（看得到）和想的、感受（要推測）分開寫，請本人確認，並說出自己哪裡猜錯。
  items_title: 學完能做到
  items:
  - title: 分開四格
    text: 說、做、想、感受。
  - title: 標出推測
    text: 想和感受標出是猜的。
  - title: 請本人確認
    text: 寫下猜錯的原因。
  checklist_title: 家長檢核
  checklist:
  - 四格都有寫
  - 推測有標出
  - 本人打過勾叉
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - genai-student
