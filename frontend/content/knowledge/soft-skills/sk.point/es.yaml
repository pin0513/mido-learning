why:
  heading: 先聽到答案，比較好懂
  body:
  - 國語文課綱要三、四年級的孩子「把握說話的重點與順序，對談時能做適當的回應」。先說答案，對方就知道接下來的話在說什麼。
  - 美國陸軍的公文寫作規定，要求把重點放在最前面，叫 BLUF（bottom line up front，結論先行）；美國政府的白話寫作指引也說，讀者想快點得到答案。這些是寫作規範，本站建議說話也這樣做。
  qa:
    question: 媽媽問「今天好玩嗎？」你第一句會說什麼？
    answer: 先直接回答：「好玩！」或「普通。」再用「因為……」說原因，例如「因為下課我們玩了躲避球。」
    source: digitalgov
  items_title: 練好以後，孩子可以
  items:
  - title: 抓住重點和順序
    text: 把握說話的重點與順序，對談時適當回應。
    code: 2-II-3
  - title: 說得有結構
    text: 高年級再把握說話的主題、重要細節與結構邏輯。
    code: 2-III-5
  sources:
  - kuoyu
  - zonggang
  - ar25-50
  - digitalgov
how:
  heading: 答案、因為、例子
  body:
  - 第一句說答案；第二句用「因為……」補一兩個原因；有需要再舉一個例子。說完可以問對方：「你還想知道什麼？」
  items:
  - title: 第一句：答案
    example: 今天最開心的是體育課。
    text: 用一句話直接回答問題。
  - title: 第二句：因為
    example: 因為我們第一次跳箱。
    text: 補一兩個原因。
  - title: 第三句：例子
    example: 我跳過了四層。
    text: 需要時，舉一個具體的例子。
  activity_figure: how-flow
  sources:
  - kuoyu
  - digitalgov
what:
  heading: 重點放在第一句
  figures:
  - what-compare
  notes:
  - BLUF 是 bottom line up front 的縮寫，意思是把結論放在最前面；美國陸軍的公文寫作規定就用了這個說法。
  - 先說重點不是只說重點：答案後面仍要有原因，對方才知道你為什麼這樣說。
  sources:
  - ar25-50
  - digitalgov
