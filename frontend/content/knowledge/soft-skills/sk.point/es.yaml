idea: 很多時候，問問題的人想先聽到答案。先說重點（今天最開心的是……），再用「因為……」補原因，最後可以舉一個例子。
guiding_questions:
- 媽媽問「今天好玩嗎？」你第一句會說什麼？
scenario: 親子共學：接送路上玩「一句話答案」：大人問，孩子先用一句話回答，再說原因；換孩子問大人。
goal: 回答問題時第一句就說答案，再用「因為」補一兩個原因。
review: 家長問 3 個問題（今天最好玩的事、晚餐想吃什麼、為什麼喜歡某本書），每題第一句就是答案、後面有「因為」，家長逐題打勾。
