why:
  heading: 討論是接力，不是輪流演講
  body:
  - 每個人只說自己原本想說的，討論就變成輪流演講。國中國語文課綱要學生「以同理心，聆聽各項發言，並加以記錄、歸納」，也要「有效把握聽聞內容的邏輯，做出提問或回饋」。
  - 綜合活動課綱也要國中生「參與各項團體活動，與他人有效溝通與合作」；輔導科的學習內容「團體溝通、互動與工作效能的提升」，包含學習團體集思廣益、溝通協商與形成共識。
  qa:
    question: 別人說完，你是接著他的話說，還是說你原本想說的？
    answer: 先接住他的話：用一句話說出你聽到的重點，確認沒聽錯，再補充或提出不同看法。這樣大家的想法才會疊在一起，而不是各說各的。
    source: kuoyu
  items_title: 練好以後，可以
  items:
  - title: 聽完再整理
    text: 以同理心聆聽各項發言，並加以記錄、歸納。
    code: 1-IV-1
  - title: 提問或回饋
    text: 把握聽聞內容的邏輯，做出提問或回饋。
    code: 2-IV-2
  - title: 團體中合作
    text: 參與團體活動，與他人有效溝通與合作。
    code: 2b-IV-1
  sources:
  - kuoyu
  - zonghe
how:
  heading: 先複述，再補充
  body:
  - 國語文課綱的實施要點說，聆聽後要「能複述重點，並能有條理的回答問題」，也要兼顧每個學生發言的均等機會。IDEO.org 的腦力激盪規則也建議「Build on the ideas of others」（接著別人的想法往下想，多說「而且」，少說「但是」），以及「One conversation at a time」（一次只有一個人說）（這些規則原本是腦力激盪用的）。
  items:
  - title: 複述
    example: 我聽到你說，週末想去爬山。
    text: 用一句話說出上一個人的重點。
  - title: 確認
    example: 我這樣理解對嗎？
    text: 讓對方有機會更正。
  - title: 補充或不同看法
    example: 我想補充……／我有不同看法，因為……
    text: 接著他的話往下說。
  - title: 邀請沒說話的人
    example: 妹妹還沒說，你覺得呢？
    text: 讓每個人都有機會。
  activity_figure: how-flow
  sources:
  - kuoyu
  - ideo-rules
