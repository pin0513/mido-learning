  - 在討論現場等別人說完、接住他的話
idea: 好的討論像接力：先說「我聽到你說……」，確認沒聽錯，再說「我想補充……」或「我有不同看法，因為……」。也要讓還沒說話的人有機會。
guiding_questions:
- 別人說完，你是接著他的話說，還是說你原本想說的？
scenario: 親子共學：家庭會議輪流當「接話員」：每個人發言前，要先用一句話說出上一個人的重點。
goal: 討論時先複述別人的重點，再補充或提出不同意見，不打斷、不搶話。
review: 一次 15 分鐘家庭會議，家長記錄孩子用了幾次「我聽到你說……」（目標至少 2 次），並確認沒有打斷別人。
