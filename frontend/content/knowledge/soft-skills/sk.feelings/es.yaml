    text: 綜合活動 1a-II-1：展現自己能力、興趣與長處，並表達自己的想法和感受。
    code: 1a-II-1
  - title: 覺察情緒變化
    text: 綜合活動 1d-II-1：覺察情緒的變化，培養正向思考的態度。
    code: 1d-II-1
  - title: 探索想法與感受
    text: 綜合活動 Aa-II-3：自我探索的想法與感受。
    code: Aa-II-3
