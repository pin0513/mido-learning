why:
  heading: 說得出感覺，別人才懂
  body:
  - 綜合活動課綱要三、四年級「表達自己的想法和感受」，也要「覺察情緒的變化」。家庭教育議題的國小實質內涵有「覺察個人情緒並適切表達」；生命教育也要孩子「理解人是會思考、有情緒、能進行自主決定的個體。」
  - CASEL（美國推動社會情緒學習的組織）列出的自我覺察能力，包括「Linking feelings, values, and thoughts」，也就是把感覺、看重的事（價值）和想法連起來（翻譯是本站整理）。說出感覺，再說出因為什麼，就是在練習這件事（本站整理）。
  qa:
    question: 說感覺時，為什麼要加上因為？
    answer: 說出原因，別人才知道發生了什麼事、可以怎麼幫你（本站整理）。CASEL 的自我覺察包括「Linking feelings, values, and thoughts」，把感覺、看重的事（價值）和想法連起來（翻譯是本站整理）。
    source: casel-framework
  items_title: 課綱的學習重點
  items:
