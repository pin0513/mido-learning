idea: 感覺不只開心和生氣，還有失望、擔心、委屈、害羞、興奮……。說得出更準確的感覺和原因，別人比較知道發生了什麼事、可以怎麼幫你。
guiding_questions:
- 「不開心」裡面，可能藏著哪些不一樣的感覺？
- 說感覺時，為什麼要加上因為？
- 別人的感覺跟你不一樣時，怎麼辦？
scenario: 親子共學：睡前用心情溫度計，每人說一個今天的感覺和原因，大人也說自己的（本站建議）。
goal: 分辨並說出至少 8 種感覺的名字（數字是示意），用我覺得……因為……說出自己的感覺和原因。
review: 用情緒卡或表情圖，孩子說得出 8 種感覺的名字（示意）；一週內，家長記下孩子自己用我覺得……因為……說出感覺和原因至少 3 次（示意），看有沒有說出原因、有沒有把感覺說得更準確。
