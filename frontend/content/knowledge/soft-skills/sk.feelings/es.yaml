what:
  heading: 我覺得……因為……
  body:
  - 學完後，孩子能分辨並說出多種感覺的名字，用我覺得……因為……說出自己的感覺和原因；聽別人說感覺時，先聽、不評論。
  items_title: 學完能做到
  items:
  - title: 說出感覺名字
    text: 開心、生氣以外的詞。
  - title: 說出原因
    text: 我覺得……因為……
  - title: 尊重別人的感覺
    text: 先聽，不評論。
  checklist_title: 家長檢核
  checklist:
  - 說得出多種感覺
  - 會說因為
  - 不評論別人
  notes:
  - 本點融入家庭教育與生命教育議題：議題融入說明手冊國小的實質內涵有覺察個人情緒並適切表達，以及理解人是有情緒的個體。睡前輪流說感覺，就是在練習這兩件事。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - issues-handbook
  - genai-student
