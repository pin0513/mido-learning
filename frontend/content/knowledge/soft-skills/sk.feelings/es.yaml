how:
  heading: 情緒卡：找到更準的詞
  body:
  - 先做情緒卡：大人和孩子一起在卡片上寫感覺的名字，像開心、生氣、失望、擔心、委屈、害羞、興奮、緊張，旁邊畫表情（本站建議）。玩法是大人說一個情境，孩子挑出最接近的卡；一張不夠就挑兩張，因為 CDC 說孩子「may have several emotions at the same time」，同時可能有好幾種感覺（翻譯是本站整理）。
  - 再用一句話說出來：我覺得（感覺），因為（發生的事）（本站建議）。把不開心拆開想：是失望、委屈，還是生氣？越說越準確（本站建議）。大人可以先示範，CDC 說幫孩子說出感覺，「gives your child a word for the emotion」，讓孩子有詞可以用（翻譯是本站整理）。
  - 睡前心情溫度計：每人說一個今天的感覺和原因，大人也說；聽的人不評論，也不說不要難過（本站建議）。CDC 提醒「Telling your child to stop feeling a particular way does not show your child you are trying to understand how they feel.」（翻譯是本站整理）。家長可以在一週裡記下孩子自己說出感覺和原因的次數（本站建議）。
  qa:
    question: 別人的感覺跟你不一樣時，怎麼辦？
    answer: 先聽，不評論，也不叫他不要那樣覺得；CDC 說叫孩子停止某種感覺，「does not show your child you are trying to understand how they feel」（翻譯是本站整理）。可以問他：你覺得怎樣？因為什麼？每個人的感覺都可以說出來（本站建議）。
    source: cdc-listen
  items_title: 四步做
  items:
  - title: 做情緒卡
    text: 寫名字、畫表情。
  - title: 挑最接近的卡
    text: 一張不夠就挑兩張。
  - title: 說一句完整的
    text: 我覺得……因為……
  - title: 不評論別人
    text: 每種感覺都可以說。
  checklist_title: 說的時候檢查一下
  checklist:
  - 說出感覺名字
  - 說出原因
  - 沒有評論別人
  activity_figure: feel-flow
  sources:
