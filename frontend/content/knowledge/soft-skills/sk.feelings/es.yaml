idea: 感覺不只開心和生氣，還有失望、擔心、委屈、害羞、興奮……。說得出更精確的感覺，別人才知道怎麼幫你，你也比較不會用發脾氣代替說話。
guiding_questions:
- 「不爽」裡面，可能藏著哪些不一樣的感覺？
scenario: 親子共學：睡前「心情溫度計」：每人說一個今天的感覺和原因，大人也要說，不評論別人的感覺。
goal: 分辨並說出至少 8 種感覺，用「我覺得……因為……」說出來。
review: 用情緒卡或表情圖，孩子能說出 8 種感覺的名字；一週內，家長記錄孩子主動用「我覺得……因為……」說出 3 次。
