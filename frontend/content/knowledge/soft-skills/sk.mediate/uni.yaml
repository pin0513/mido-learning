why:
  heading: 調解人不判誰對
  body:
  - Model Standards 這樣定義調解：「Mediation is a process in which an impartial third party facilitates communication and negotiation and promotes voluntary decision making by the parties to the dispute.」也就是中立的第三方幫兩方溝通，決定由兩方自己做（翻譯是本站整理）。聯合國的指引也說調解是「a voluntary process that requires the consent of the conflict parties to be effective.」（翻譯是本站整理）。
  - 所以兩個朋友都來找你，你不先站任何一邊。調解人要能「run a balanced process that treats all actors fairly」（翻譯是本站整理）；Model Standards 也說，做不到中立就要退出：「If at any time a mediator is unable to conduct a mediation in an impartial manner, the mediator shall withdraw.」（翻譯是本站整理）。你一選邊，另一方就不會再說真話（本站整理）。
  qa:
    question: 兩個朋友吵架都來找你，你要先站哪一邊？
    answer: 不站任何一邊。調解人的工作是讓兩方都能好好說、好好聽，由他們自己決定；Model Standards 說調解人是「an impartial third party」（翻譯是本站整理）。做不到中立就請別人協助。
    source: msc-2005
  items_title: 這一點用到的
  items:
  - title: 中立
    text: 不選邊，兩方一樣對待。
  - title: 自願
    text: 要不要談、怎麼決定由兩方定。
  - title: 立場與需要
    text: 說出來的要求，和背後在乎的事。
  - title: 保密
    text: 談的內容不外傳。
