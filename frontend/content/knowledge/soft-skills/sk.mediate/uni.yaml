what:
  heading: 陪兩方找到共同需要
  body:
  - 學完後，你能在兩方同意下，協助一次意見衝突：保持中立，請兩方輪流說、互相複述，把立場轉成需要，由兩方自己選做法，也知道什麼時候該停下來找專業協助。
  items_title: 學完能做到
  items:
  - title: 保持中立
    text: 不選邊，兩方一樣對待。
  - title: 把立場轉成需要
    text: 問出要求背後在乎的事。
  - title: 知道何時停下
    text: 有暴力或做不到中立就停。
  checklist_title: 自我檢核
  checklist:
  - 兩方輪流說過
  - 找到共同需要
  - 知道何時停下
  notes:
  - 本頁的室友爭冷氣例子是本站整理；調解原則取自 Model Standards of Conduct for Mediators 與聯合國調解指引，立場與需要取自 Harvard PON，中文說明是本站整理。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - genai-student
