how:
  heading: 輪流說、複述，找需要
  body:
  - 先說好規則：兩方都同意才談，談的內容不外傳，一次一個人說，不打斷（本站建議）；Model Standards 說調解人要保密所有在調解中得知的資訊（翻譯是本站整理）。接著請甲方說，說完請乙方用自己的話複述甲方在乎什麼，甲方確認聽對了再換人；PON 的建議是「Practice active listening」、「Clarify misunderstandings」（翻譯是本站整理）。
  - 立場和需要不一樣：PON 說「Positions are surface-level statements.」，而「Beneath them lie interests—the underlying needs, motivations, and concerns driving those demands.」（翻譯是本站整理）。例如室友爭冷氣：立場是開到幾度，需要可能是一個怕熱睡不著、一個怕電費太高（例子是本站整理）。找到需要後，請兩方一起想選項，由他們自己選；調解人不替他們決定（本站建議）。
  - 什麼情況不該自己調解：有暴力、威脅、騷擾，或一方怕另一方時，不要再談，停止並陪當事人找學校或專業人員，有立即危險就打 110（本站建議；電話是本站整理）。Model Standards 說遇到暴力時要停止，「including, if necessary, postponing, withdrawing from or terminating the mediation.」（翻譯是本站整理）；自己做不到中立時也要退出。會後請兩方各用一到五分評覺得對方懂自己在乎什麼（分數是示意）；AI 可以幫忙整理雙方說法的重點，但要兩方同意，不輸入姓名和可辨認的細節（本站建議）。
  qa:
    question: 立場和需要差在哪裡？
    answer: 立場是說出來的要求，需要是要求背後在乎的事。PON 說「Positions are surface-level statements.」（翻譯是本站整理）；兩方的立場常常對立，需要卻可能找得到一起滿足的做法。
    source: pon-principled
  items_title: 四步做
  items:
  - title: 說好規則
    text: 兩方同意、保密、一次一人說。
  - title: 輪流說與複述
    text: 說完請對方用自己的話複述。
  - title: 找出需要
    text: 問立場背後在乎什麼。
  - title: 一起想選項
    text: 由兩方自己選做法。
  checklist_title: 寫完檢查
  checklist:
  - 兩方都同意談
  - 沒有選邊
  - 兩方都被複述過
  - 做法由兩方選
  activity_figure: mediate-flow
