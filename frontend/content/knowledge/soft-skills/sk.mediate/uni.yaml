- id: msc-2005
  title: Model Standards of Conduct for Mediators（2005 年版）
  publisher: 美國仲裁協會 AAA（2005 年 9 月 8 日通過）、美國律師協會 ABA（2005 年 8 月 9 日通過）、Association for Conflict Resolution（2005 年 8 月 22 日通過）；ICDR 網站提供
  url: https://icdr.org/sites/default/files/document_repository/Model_Standards_of_Conduct_for_Mediators.pdf
  accessed: '2026-10-30'
  kind: reference
  supports: 「Mediation is a process in which an impartial third party facilitates communication and negotiation and promotes voluntary decision making by the parties to the dispute.」（p.2）；「If at any time a mediator is unable to conduct a mediation in an impartial manner, the mediator shall withdraw.」（p.4）；「A mediator shall maintain the confidentiality of all information obtained by the mediator in mediation」（p.6）；「If a mediator is made aware of domestic abuse or violence among the parties, the mediator shall take appropriate steps including, if necessary, postponing, withdrawing from or terminating the mediation.」（p.8）
- id: un-mediation
  title: United Nations Guidance for Effective Mediation
  publisher: 聯合國（2012 年）
