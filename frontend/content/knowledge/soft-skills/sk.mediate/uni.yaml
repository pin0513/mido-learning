- 原有草稿說明「引用的框架只寫名稱（調解、利益與立場）…」已處理：依 Model Standards of Conduct for Mediators 2005、聯合國調解指引與 Harvard PON 的部落格改寫，英文短句逐字引用，中文說明是本站整理。
- guiding_questions 補到三題，三題的答案都寫在 Why 或 How 內文（qa 只是摘要）。
- 原 scenario「親子共學：手足吵架時，大人改當調解人：不判誰對，只請兩人輪流複述對方在乎的事。」大學點改成家人之間有意見不同時，由大學生當調解人，補上本站建議；有暴力時不適用，見安全界線。
- 原 ai.delegable「整理雙方說法的重點」補上使用條件（本站建議）。
