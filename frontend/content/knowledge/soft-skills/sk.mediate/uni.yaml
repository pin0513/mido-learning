idea: 調解人不判對錯，而是讓兩方輪流說，請一方複述「你聽到他在乎什麼」，把立場轉成需要，再一起想選項。調解人要中立，也要知道什麼時候該請專業的人。
guiding_questions:
- 兩個朋友吵架都來找你，你要先站哪一邊？
scenario: 親子共學：手足吵架時，大人改當調解人：不判誰對，只請兩人輪流複述對方在乎的事。
goal: 協助兩個有衝突的人輪流說、互相複述，找到雙方都在乎的事。
review: 在社團或工作中協助一次真實的意見衝突（或做角色扮演），會後請兩方各回答「我覺得對方懂我在乎什麼」1–5 分，兩方都 4 分以上。
