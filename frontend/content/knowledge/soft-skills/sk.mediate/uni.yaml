  kind: reference
  supports: 「Mediation is a voluntary process that requires the consent of the conflict parties to be effective.」（p.8）；「A mediator should be able to run a balanced process that treats all actors fairly and should not have a material interest in the outcome.」（p.10）
- id: pon-principled
  title: 'Principled Negotiation: Focus on Interests to Create Value'
