sources:
- id: pon-principled
  title: 'Principled Negotiation: Focus on Interests to Create Value'
  publisher: Program on Negotiation at Harvard Law School（Katie Shonk）
  url: https://www.pon.harvard.edu/daily/negotiation-skills-daily/principled-negotiation-focus-interests-create-value/
  accessed: '2026-10-28'
  kind: reference
  supports: 《Getting to Yes》原則式談判：把人和問題分開（處理情緒與關係的顧慮要和議題分開；主動聆聽、承認情緒、澄清誤解、把議題重新框成共同問題）；著眼利益（interests）而非立場（positions），立場是表面的要求，底下是需要與擔心；創造互利選項；堅持事先同意的客觀標準
- id: iaf-ethics
  title: IAF Statement of Values & Code of Ethics
  publisher: International Association of Facilitators（國際引導者協會，2004 通過）
  url: https://iaf-world.org/wp-content/uploads/2025/09/IAF-Statement-of-Values-Code-of-Ethics.pdf
  accessed: '2026-10-28'
  kind: reference
  supports: 前言：引導者「fill an impartial role in helping groups become more effective」、在參與與成果之間取得平衡；第 5 條（Respect, Safety, Equity, and Trust）：「elicit and honour the perspectives of all」，確保所有參與者都有機會表達想法；第 6 條：對過程負責（stewardship of process），對內容保持中立（impartiality toward content）
