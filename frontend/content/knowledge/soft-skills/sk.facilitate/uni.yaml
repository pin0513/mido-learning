idea: 立場對立時，主持人對內容保持中立、對過程負責：維持規則與公平，讓每一方說出背後在乎的事（利益），把各自的「立場」轉成「大家要一起解決的問題」。收斂不了時，本站建議先決定下一步，例如補資料或組小組研議。
guiding_questions:
- 兩派吵起來時，主持人該先處理事情還是情緒？
scenario: 親子共學：家族聚會要決定一件有爭議的事時，由大人主持、孩子記錄，會後一起檢討哪一句話讓氣氛轉好。
goal: 主持一場有對立意見的會議，讓每一方都覺得被聽到，並收斂出下一步。
review: 主持一次真實會議（社團、系學會、工作），會後發匿名問卷「我的意見有被聽到」1–5 分，平均 4 分以上（示意），且紀錄裡有決議或明確的下一步。
