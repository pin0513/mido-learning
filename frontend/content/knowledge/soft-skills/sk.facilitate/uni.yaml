why:
  heading: 吵的是立場，要談的是利益
  body:
  - 哈佛法學院談判專案（Program on Negotiation，PON）整理的原則式談判指出：立場是表面的要求，底下的利益才是真正的需要、動機和擔心。只在立場上爭，很難有進展；說出各自在乎的事，常能找到雙方都能接受的做法。
  - 國際引導者協會（International Association of Facilitators，IAF）的倫理守則也期許引導者扮演中立的角色，引出並尊重所有人的觀點，讓每位參與者都有機會說出想法。
  qa:
    question: 兩派吵起來時，主持人該先處理事情還是情緒？
    answer: 兩個都要處理，但要分開處理。原則式談判建議把人和問題分開：先主動聆聽、承認雙方的情緒、澄清誤解，再把議題重新說成「我們要一起解決的問題」，回到事情本身。
    source: pon-principled
  items_title: 練好以後，可以
  items:
  - title: 中立主持
    text: 對內容保持中立，對過程負責。
  - title: 找出利益
    text: 把立場背後的需要和擔心問出來。
  - title: 讓人和事分開
    text: 先接住情緒，再談共同的問題。
  sources:
  - pon-principled
  - iaf-ethics
how:
  heading: 先立規則，再問在乎什麼
  body:
  - 開場先說規則（以下規則是本站建議）：一次一人發言、對事不對人、每一方都會輪到。接著請每一方說「你最擔心什麼、最在乎什麼」，主持人把它寫成利益，而不是要求。
  - 最後把各方利益並排，改寫成一個共同的問題：「怎樣才能同時顧到……和……？」原則式談判也建議，雙方先同意用哪些客觀標準來比較選項。
  items:
  - title: 定規則
    example: 一次一人、對事不對人、每方都輪到。
    text: 對過程負責，不替任何一方說話。
  - title: 問利益
    example: 你最擔心的是什麼？
    text: 把立場背後的需要寫下來。
  - title: 改寫成共同問題
    example: 怎樣才能同時顧到預算和時間？
    text: 讓兩方面對同一個問題。
  - title: 訂標準
    example: 先同意用去年的出席數據比較。
    text: 事先同意客觀標準。
  activity_figure: how-flow
  sources:
  - iaf-ethics
  - pon-principled
