how:
  heading: 寫假說、找反證、再修正
  body:
  - 先寫問題陳述，再寫至少三個對立的假說（數量是示意）。例如社團人數下降，假說可以是社課時間和必修課衝堂、社課內容太難、宣傳沒觸及新生（例子是本站整理）。每個假說都要說得出什麼結果算它錯；Platt 說「a theory is not a theory unless it can be disproved」（翻譯是本站整理）。
  - 再替每個假說寫要收的資料，先收最能推翻它、也最能分辨不同假說的資料；Platt 建議問自己「what experiment could disprove your hypothesis?」（翻譯是本站整理）。例如問退社的人為什麼不來，比問還留下的人喜不喜歡社課更能分辨（例子是本站整理）。AI 可以幫忙整理資料、找反例，但不輸入成員姓名，找到的反例和資料要自己查證（本站建議）。
  - 資料推翻了假說，就把它劃掉，寫下是哪筆資料推翻的，再細分或修正留下的假說，進下一輪；Platt 的步驟是「Recycling the procedure, making subhypotheses or sequential hypotheses to refine the possibilities that remain」（翻譯是本站整理）。他也提醒「Any conclusion that is not an exclusion is insecure and must be rechecked.」（翻譯是本站整理）。約兩週後（時間是示意）更新清單，誠實寫下哪些假說被推翻（本站建議）。
  qa:
    question: 怎樣的假說才算可以檢驗？
    answer: 說得出什麼結果算它錯，而且找得到那筆資料。Platt 說「a theory is not a theory unless it can be disproved」（翻譯是本站整理）；說不出什麼會推翻它的，就還不是可以檢驗的假說。
    source: platt-1964
  items_title: 四步做
  items:
  - title: 寫問題陳述
    text: 一句話說清楚要解的問題。
  - title: 寫對立假說
    text: 每個都說得出什麼算它錯。
  - title: 先收反證
    text: 收最能推翻、分辨的資料。
  - title: 刪掉再修正
    text: 劃掉被推翻的，進下一輪。
  checklist_title: 寫完檢查
  checklist:
  - 假說不只一個
  - 寫了推翻條件
  - 先收能推翻的
  - 記下被推翻的
