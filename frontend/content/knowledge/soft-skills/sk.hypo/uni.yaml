what:
  heading: 用對立假說逼近答案
  body:
  - 學完後，你能面對一個複雜問題，寫出幾個可以被推翻的對立假說和要收的資料，先找能推翻它們的資料，再誠實刪掉、修正假說。
  items_title: 學完能做到
  items:
  - title: 寫可檢驗的假說
    text: 說得出什麼結果算它錯。
  - title: 先找反證
    text: 收最能推翻、分辨的資料。
  - title: 用資料修正
    text: 劃掉被推翻的，再細分。
  checklist_title: 自我檢核
  checklist:
  - 寫了幾個假說
  - 每個都可推翻
  - 更新了清單
  notes:
  - 本頁的社團人數下降例子是本站整理；方法取自 Chamberlin 1890 的多重工作假說與 Platt 1964 的 Strong Inference，中文說明是本站整理。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，數字、事實和引用的資料要自己查證；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - genai-student
