why:
  heading: 先猜，但猜好幾個
  body:
  - 先猜答案確實可能有偏見。Chamberlin 指出只抱一個理論的毛病：「Under the method of the ruling theory, the stimulus was directed to the finding of facts for the support of the theory.」，也就是只去找支持它的事實（翻譯是本站整理）。他提出的解法是「the method of multiple working hypotheses」：同時寫好幾個可能的答案，讓它們互相競爭（翻譯是本站整理）。
  - Platt 把做法寫成步驟，第一步就是「Devising alternative hypotheses」，第二步是設計關鍵檢驗，每個可能的結果都能「exclude one or more of the hypotheses」（翻譯是本站整理）。先猜不是問題，只猜一個、只找支持的資料才是；同時寫幾個，再找能分辨它們的資料，就能把偏見攤在桌上（本站整理）。
  qa:
    question: 還沒收集資料就先猜答案，不會有偏見嗎？
    answer: 只猜一個、只找支持的資料，就容易有偏見。Chamberlin 建議「the method of multiple working hypotheses」：同時寫幾個對立的假說，再找能分辨它們的資料（翻譯是本站整理）。
    source: chamberlin-1890
