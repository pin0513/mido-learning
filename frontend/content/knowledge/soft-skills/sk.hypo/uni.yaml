idea: 問題很大、時間有限時，可以先根據經驗提出假說（答案可能是……），列出它要成立需要哪些證據，再優先收集最能推翻它的資料。要刻意找反例，避免只看支持自己的證據。
guiding_questions:
- 還沒收集資料就先猜答案，不會有偏見嗎？
scenario: 親子共學：大人把自己工作上的一個問題寫成假說樹，請孩子專門找「什麼證據會推翻它」。
goal: 面對複雜問題，先寫出可檢驗的假說與要收的證據，再用資料修正。
review: 選一個真實問題（社團人數下降、產品回購率低），交一頁：問題陳述、假說樹、每個假說要收的資料與「什麼結果會推翻它」；兩週後更新哪些假說被推翻。
formats:
