why:
  heading: 先懂使用的人，再動手做
  body:
  - 108 課綱的家政要高中生「運用巧思，體現生活美學於居家生活。」學習內容「綠色居家與空間美化。」的補充說明，要學生「善用美感規劃與佈置生活空間，並了解通用設計與綠建築的要素。」也要「運用創意生活手作，美化居家或社區空間。」改善家裡一個不好用的地方，就是從使用的人出發做設計（本站整理）。
  - 設計思考是史丹佛大學設計學院（d.school）推廣的方法。他們的工具包說「Empathy is the foundation of human-centered design.」，也就是同理是以人為本設計的基礎；也說「Prototyping gets ideas out of your head and into the world.」，原型就是把點子從腦中拿出來給人試（翻譯是本站整理）。
  qa:
    question: 還沒做出成品，可以先讓人試用嗎？
    answer: 可以，而且越早越好。用紙或紙箱做的粗略原型就能讓人試（本站整理）。d.school 說早期的原型要「keep prototypes inexpensive and low resolution to learn quickly and explore possibilities.」，也就是便宜、粗略，才能很快學到東西（翻譯是本站整理）。
    source: dschool-bootleg
