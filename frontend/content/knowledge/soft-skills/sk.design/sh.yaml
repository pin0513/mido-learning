how:
  heading: 五步走一輪，早點讓人試
  body:
  - 同理與定義：先找 2 位會用到的人（數字是示意），例如每天在玄關換鞋的家人，請他實際做一次，邊做邊問（例子是本站整理）。d.school 說「We interview to gain empathy.」，訪談時要「Encourage stories.」，請他說說發生過的事（翻譯是本站整理）；訪談的做法見同理訪談那一點。接著寫問題定義句：誰、需要什麼、因為什麼，例如奶奶需要一進門就能坐著穿鞋，因為她彎腰不方便（例子是本站整理）。d.school 說定義是把同理的發現整理成「needs and insights」，也就是需求和洞見（翻譯是本站整理）。
  - 發想與原型：先求多再求好，例如先寫下 10 個以上的點子（數字是示意），想的時候不批評（本站建議）；d.school 說發想要探索「both a large quantity and broad diversity of ideas.」，點子要多，也要不一樣（翻譯是本站整理）。挑一兩個點子，用紙、紙箱和膠帶做出粗略的原型，例如用紙箱做一張能放鞋的矮凳（例子是本站整理）；用剪刀、美工刀時請大人在旁邊（本站建議）。
  - 測試與修改：把原型交給使用者，只說最基本的用法；d.school 說「Let your user experience the prototype.」、「Have them talk through their experience.」，並且要「Actively observe.」，也就是讓他自己用、邊用邊說，你仔細看（翻譯是本站整理）。他用錯了先不糾正，看他在哪裡卡住（本站建議）。把觀察到的事寫下來，例如 3 件（數字是示意），再決定改什麼；d.school 也提醒，測試可能發現「you also framed the problem incorrectly.」，也就是連問題都定錯了，這時回到定義重來（翻譯是本站整理）。
  qa:
    question: 測試時，使用者用錯了要馬上糾正嗎？
    answer: 先不要。看他怎麼用、在哪裡卡住，用錯的地方常常就是要改的地方（本站整理）。用完再追問，d.school 的測試卡寫「Follow up with questions.」，並說「This is often the most valuable part.」，也就是測完的追問常最有收穫（翻譯是本站整理）。
    source: dschool-bootleg
  items_title: 四步做
  items:
  - title: 訪談和觀察
    text: 請使用者實際做一次。
  - title: 寫問題定義句
    text: 誰、需要什麼、因為什麼。
  - title: 發想再做原型
    text: 先求多，再用紙箱做。
  - title: 測試再修改
    text: 看他卡在哪裡再改。
  checklist_title: 測試前檢查一下
  checklist:
  - 定義句寫好了
  - 點子先求多
  - 原型夠粗略
  - 先看不糾正
  activity_figure: design-flow
  sources:
  - dschool-bootleg
what:
  heading: 做出能讓人試的原型
  body:
  - 學完後，能為一個真實的問題走一輪設計思考：訪談使用的人、寫出問題定義句、發想多個點子、做出粗略的原型讓使用者試用，並依觀察到的事修改。
  items_title: 學完能做到
  items:
  - title: 寫出問題定義句
    text: 從使用者的需求出發。
  - title: 做出粗略原型
    text: 用紙和紙箱就夠。
  - title: 依測試修改
    text: 說得出改了什麼。
  checklist_title: 家長檢核
  checklist:
  - 有問題定義句
  - 有測試紀錄
  - 寫了改什麼
  notes:
  - 本點融入品德教育議題：議題融入說明手冊高中的實質內涵有「問題解決與創新發展。」為使用的人改善一個真實的問題、想出新做法，就是在練習。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  sources:
  - issues-handbook
  - genai-student
  - moe-ai-guide
