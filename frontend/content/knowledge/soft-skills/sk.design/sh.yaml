idea: 設計思考常分五步：同理（訪談使用者）、定義（寫出「誰需要什麼，因為什麼」）、發想（先求多再求好）、原型（用紙、紙箱快速做出來）、測試（看使用者卡在哪裡）。重點是早一點讓真的人試，錯了就改。
guiding_questions:
- 還沒做出成品，可以先讓人試用嗎？
scenario: 親子共學：親子一起改善家裡一個不好用的地方（例如玄關鞋櫃），孩子訪談家人、大人陪著做紙箱原型。
goal: 走一輪設計思考：同理、定義、發想、原型、測試，做出可以給人試用的原型。
review: 為家裡或學校一個真實問題做紙原型，找 2 位使用者測試，交一頁紀錄：問題定義句、10 個以上的點子、測試時觀察到的 3 件事、改了什麼。
