verify_notes:
- 核心素養 A2、A3：依總綱 p.4–6 高級中等學校教育的 U-A2、U-A3 與綜合活動領綱的綜S-U-A2、綜S-U-A3 原文確認（表格窄欄分散對齊，字距大，文字用 pdftotext 原始順序層與頁面文字塊核對）。
- stage 不填 grades：綜合活動領綱 p.2 說普通型高中的生命教育、生涯規劃、家政「可在不同年級規劃修習不同科目。」高中的學習重點也沒有分年級；總綱 p.7 說高級中等學校十、十一、十二年級為第五學習階段。
- est_time 寫高中家政課：綜合活動領綱 p.2 的高中部定必修是生命教育 1 學分、生涯規劃 1 學分、家政 2 學分；本點的綜合活動代碼出自家政。
- 頁碼都是頁腳印的頁碼：綜合活動領綱與總綱比 PDF 頁少 4，議題融入說明手冊少 16；教育部 AI 指引與學生版注意事項的 PDF 頁就是頁腳印的頁碼；d.school Bootleg沒有印頁碼或印的就是 PDF 頁，用 PDF 頁。
- 新增代碼的頁碼：學習表現用綜合活動領綱 p.28–32 學習重點表，學習內容用附錄二學習內容說明裡代碼所在的頁（同代碼表既有的 家 Ca-V-1 p.100、家 Cb-V-2 p.100）。
- 高中的 ai.delegable 不改成由老師或家長操作：教育部《高級中等以下學校人工智慧使用和學習指引》讓高中生在規則內自己使用（同 B15、B19、B23 高中的做法），每條補上使用條件（本站建議），What 加上注意事項（學生版）與指引的使用規則。
- 綜合活動 家 3c-V-1（p.32 學習重點表）、家 Cc-V-1（p.100 附錄二）原本不在代碼表，本批依原文加入（taxonomy patch）。
- 健康與體育領綱也有同號的代碼（文字不同）：學習表現 3a-V-1、4b-V-2（健體 p.30）、3c-V-1（p.31），學習內容 Ca-V-1、Db-V-2（p.31）、Cc-V-1（p.32）；國語文也有學習內容 Ca-V-1（國語文 p.18）、Cc-V-1（p.19）；綜合活動高中本身也有 生 3a-V-1、生 Ca-V-1、生 Db-V-2、涯 3c-V-1、涯 Cc-V-1。本點的代碼都帶科目字首（涯、家），代碼表的鍵不衝突（taxonomy 的綜合活動區塊加了註解；領綱用羅馬數字，本站整理成拉丁字母 V）。
- 原 curriculum_108.domains 有科技：代碼表的科技區塊目前只收資訊科技（鍵是 科技/資訊科技），沒有生活科技的條目，要收要先改 taxonomy 結構，列為後續；本點先只放綜合活動家政的代碼，domains 改成只有綜合活動。核心素養維持 A2、A3。
- 議題品德教育：品德教育高中實質內涵 品U8「問題解決與創新發展。」（p.75）；為使用的人改善一個真實的問題、想出新做法，就是在練習。
- 原 idea 的「誰需要什麼，因為什麼」拿掉引號（那是本站整理的句型，不是引文）；原 guiding question 保留，另加兩題，答案寫在 Why 的問答、How 內文與 How 的問答；原 review 的 2 位使用者、10 個以上的點子、3 件事標成示意，三樣做法都寫在 How。
- 原 scenario「親子共學：親子一起改善家裡一個不好用的地方（例如玄關鞋櫃），孩子訪談家人、大人陪著做紙箱原型。」保留做法，補上用剪刀、美工刀時大人在旁邊（本站建議）。
- 原 ai.delegable「發想點子、快速做出草圖」補上使用條件（本站建議）。
- 原有草稿說明「課綱對應只到領域、核心素養與議題…」已處理：本點已逐條對照官方領綱與議題融入說明手冊原文（頁碼見來源）。
- 原有草稿說明「引用的框架只寫名稱（設計思考五步驟）…」已處理：依史丹佛大學設計學院（d.school）的 Design Thinking Bootleg（2018，CC BY-NC-SA 4.0）改寫：五個模式 Empathize、Define、Ideate、Prototype、Test，以及訪談、測試的工具卡；英文短句逐字引用，中文說明是本站整理。
- Bootleg 沒有印頁碼，頁碼用 PDF 頁；卡片內的例句含彎引號或撇號，本頁不引。玄關鞋櫃、矮凳的例子是本站整理。
- 英文 PDF 的引文避開彎引號與撇號；PDF 換行處的斷字照原詞接回，其餘空白照原文；中文說明和翻譯是本站整理。
- 生成式 AI 的使用規則依教育部注意事項（學生版）與《高級中等以下學校人工智慧使用和學習指引》；supports 逐段標頁碼。
