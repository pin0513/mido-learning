idea: 好的決定先決定「怎麼比」，再看選項。列出準則、給權重、替每個方案打分，算出總分後還要問：結果跟直覺不同嗎？為什麼？分數是幫助思考，不是取代判斷。
guiding_questions:
- 選社團時，「好朋友在那裡」應該佔幾分？
scenario: 親子共學：全家用同一張決策矩陣選下一次旅行地點，每個人先各自訂權重，再比較誰的權重不同、為什麼。
goal: 用決策矩陣比較方案：先訂準則與權重，再打分，最後說出取捨。
review: 用決策矩陣做一個真實選擇（選組、選社團、買哪台電腦）；家長檢查權重在打分前就寫好、至少 3 個方案與 4 個準則，最後有一段「我放棄了什麼」。
