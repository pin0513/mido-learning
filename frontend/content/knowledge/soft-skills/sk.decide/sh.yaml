why:
  heading: 先決定怎麼比，再做選擇
  body:
  - 108 課綱的生涯規劃要高中生「能使用生涯評估與抉擇的方法，規劃未來。」學習內容「抉擇歷程與評估工具。」的補充說明，要學生「善用各種評估模式或工具進行選課選組、選校選系等重要的生涯抉擇。」生涯規劃教育議題也要「具備生涯評估與決定的方法，展現反思與彈性的能力。」
  - 決策矩陣就是一種評估工具。美國太空總署（NASA）的系統工程手冊這樣定義：「A methodology for evaluating alternatives in which valuation criteria are typically displayed in rows on the left side of the matrix and alternatives are the column headings of the matrix.」也就是把準則列在左邊、方案排在上面，一格一格評比（翻譯是本站整理）。手冊也說「Completing the decision matrix is iterative.」，算完常要回頭再檢查、再調整（翻譯是本站整理）。
  qa:
    question: 選社團時，好朋友在那裡應該佔幾分？
    answer: 沒有標準答案，要看你自己最在乎什麼；重要的是在打分前就寫下來（本站建議）。NASA 手冊說要先訂出「The rank of each criterion by its importance.」，也就是依重要程度替準則排序（翻譯是本站整理）。例如有人給和好朋友一起 2 分、興趣 5 分，也有人反過來（例子和數字是示意）。
    source: nasa-seh
