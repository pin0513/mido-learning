how:
  heading: 先寫準則和權重，再打分
  body:
  - 先列方案和準則。方案多列幾個，例如 3 個（數字是示意），也可以把維持現狀當成一個方案；NASA 手冊說「Sometimes doing nothing or not making a decision is an option.」（翻譯是本站整理）。準則是用來比的條件，例如選社團看興趣、每週要花的時間、和好朋友一起（例子是本站整理），列 4 個左右就好（數字是本站建議）；手冊說「Criteria should be objective and measurable.」，也就是盡量寫成量得出來的樣子（翻譯是本站整理）。
  - 再給權重、打分。還沒打分前，先替每個準則寫權重，例如 1 到 5 分（本站建議）；先寫好，才不會為了想選的方案回頭改權重（本站整理）。手冊提醒「It is important to question and understand the operational definitions for the weights and scales of the tool.」，也就是先講清楚每個分數代表什麼（翻譯是本站整理），例如每週花不到 2 小時給 5 分（例子是示意）。接著替每個方案在每個準則打分，分數乘上權重再加起來，就是加權總分（本站整理）。
  - 最後說出取捨。總分最高的不一定要選；手冊說「Sometimes the benefits and advantages of a lower or close score outweigh the highest score.」，但選了別的方案要說明理由：「an explanation should be provided as to why the lower score is preferred.」（翻譯是本站整理）。結果跟直覺不同時，先回頭看準則和權重有沒有漏掉什麼（本站建議）。最後寫一段我放棄了什麼：選了這個方案，在哪些準則上分數比較低（本站建議）。
  qa:
    question: 總分最高的方案，一定要選嗎？
    answer: 不一定。分數是幫助思考，不是取代判斷（本站整理）。NASA 手冊說「Sometimes the benefits and advantages of a lower or close score outweigh the highest score.」，只是要把為什麼選分數較低的方案說清楚（翻譯是本站整理）。
    source: nasa-seh
  items_title: 四步做
  items:
