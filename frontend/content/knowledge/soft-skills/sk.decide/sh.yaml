what:
  heading: 用準則和權重做選擇
  body:
  - 學完後，能為一個真實的選擇列出方案、準則和權重，先寫權重再打分，算出加權總分，並說出最後選了什麼、放棄了什麼。
  items_title: 學完能做到
  items:
  - title: 列準則和權重
    text: 打分前先寫好。
  - title: 算加權總分
    text: 分數乘權重再加總。
  - title: 說出取捨
    text: 選了什麼、放棄了什麼。
  checklist_title: 家長檢核
  checklist:
  - 權重先寫好
  - 方案不只一個
  - 有寫放棄什麼
  notes:
  - 本點融入生涯規劃教育議題：議題融入說明手冊高中的實質內涵有「具備生涯評估與決定的方法，展現反思與彈性的能力。」用決策矩陣比較選組或社團，就是在練習。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。依教育部《高級中等以下學校人工智慧使用和學習指引》，高中生的作品若用了生成式 AI，要「標註所使用的工具名稱、版本與使用方式」，不提供真實姓名、學校名稱、帳號密碼等個人資料。
  sources:
  - issues-handbook
  - genai-student
  - moe-ai-guide
