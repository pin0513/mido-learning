verify_notes:
- 核心素養 A2、A3：依總綱 p.4–6 高級中等學校教育的 U-A2、U-A3 與綜合活動領綱的綜S-U-A2、綜S-U-A3 原文確認（表格窄欄分散對齊，字距大，文字用 pdftotext 原始順序層與頁面文字塊核對）。
- stage 不填 grades：綜合活動領綱 p.2 說普通型高中的生命教育、生涯規劃、家政「可在不同年級規劃修習不同科目。」高中的學習重點也沒有分年級；總綱 p.7 說高級中等學校十、十一、十二年級為第五學習階段。
- est_time 寫高中生涯規劃課：綜合活動領綱 p.2 的高中部定必修是生命教育 1 學分、生涯規劃 1 學分、家政 2 學分；本點的綜合活動代碼出自生涯規劃。
- 頁碼都是頁腳印的頁碼：綜合活動領綱與總綱比 PDF 頁少 4，議題融入說明手冊少 16，NASA 系統工程手冊少 10；教育部 AI 指引與學生版注意事項的 PDF 頁就是頁腳印的頁碼。
- 新增代碼的頁碼：學習表現用綜合活動領綱 p.28–32 學習重點表，學習內容用附錄二學習內容說明裡代碼所在的頁（同代碼表既有的 家 Ca-V-1 p.100、家 Cb-V-2 p.100）。
- 高中的 ai.delegable 不改成由老師或家長操作：教育部《高級中等以下學校人工智慧使用和學習指引》讓高中生在規則內自己使用（同 B15、B19、B23 高中的做法），每條補上使用條件（本站建議），What 加上注意事項（學生版）與指引的使用規則。
- 綜合活動 涯 3a-V-1（p.29 學習重點表）、涯 Ca-V-1（p.99 附錄二）原本不在代碼表，本批依原文加入（taxonomy patch）。
- 健康與體育領綱也有同號的代碼（文字不同）：學習表現 3a-V-1、4b-V-2（健體 p.30）、3c-V-1（p.31），學習內容 Ca-V-1、Db-V-2（p.31）、Cc-V-1（p.32）；國語文也有學習內容 Ca-V-1（國語文 p.18）、Cc-V-1（p.19）；綜合活動高中本身也有 生 3a-V-1、生 Ca-V-1、生 Db-V-2、涯 3c-V-1、涯 Cc-V-1。本點的代碼都帶科目字首（涯、家），代碼表的鍵不衝突（taxonomy 的綜合活動區塊加了註解；領綱用羅馬數字，本站整理成拉丁字母 V）。
- 原 curriculum_108.domains 有數學：數學領綱高中的學習表現沒有對應加權評分的條目，本點不放數學代碼，domains 改成只有綜合活動；加權總分的算法寫在 How（本站整理）。核心素養維持 A2、A3。
- 議題生涯規劃教育：生涯規劃教育高中實質內涵 涯U8「具備生涯評估與決定的方法，展現反思與彈性的能力。」（p.96）；用決策矩陣比較選組、選社團，就是在練習。
- 原 idea 的怎麼比拿掉引號；原 guiding question「選社團時，『好朋友在那裡』應該佔幾分？」的內層引號拿掉，另加兩題，三題的答案寫在 Why 的問答、How 內文與 How 的問答；原 review 的 3 個方案、4 個準則標成示意，我放棄了什麼拿掉引號。
- 原 scenario「親子共學：全家用同一張決策矩陣選下一次旅行地點，每個人先各自訂權重，再比較誰的權重不同、為什麼。」保留做法，補上本站建議。
- 原 ai.delegable「計算加權分數、列出更多方案」補上使用條件（本站建議）。
- 原有草稿說明「課綱對應只到領域、核心素養與議題…」已處理：本點已逐條對照官方領綱與議題融入說明手冊原文（頁碼見來源）。
- 原有草稿說明「引用的框架只寫名稱（決策矩陣（加權評分））…」已處理：依 NASA 系統工程手冊（NASA/SP-2016-6105 Rev2）6.8 決策分析與名詞解釋的 Decision Matrix 改寫，英文短句逐字引用，中文說明是本站整理。
- NASA 系統工程手冊是寫給太空任務工程團隊的；本點只借它對決策矩陣的定義和使用提醒（準則依重要程度排、準則要能衡量、先講清楚權重和分數的意思、最高分不一定要選、要反覆檢查），用在高中生的選組、選社團（本站建議）。手冊講正規化的句子含彎引號，本頁不引。
- 原 link_notes 的跨學門先學拿掉引號，改寫成專案管理的時間、金錢、品質取捨（pm.triangle@jh）。
- 英文 PDF 的引文避開彎引號與撇號；PDF 換行處的斷字照原詞接回，其餘空白照原文；中文說明和翻譯是本站整理。
- 生成式 AI 的使用規則依教育部注意事項（學生版）與《高級中等以下學校人工智慧使用和學習指引》；supports 逐段標頁碼。
