idea: 同一件事，站的位置不同，看到的就不同。想像自己是對方：他看到什麼？他想到什麼？他覺得怎樣？懂了他，不代表要同意他，而是先試著懂他。
guiding_questions:
- 你覺得好玩的玩笑，被開玩笑的人也覺得好玩嗎？
- 換到對方的位置時，要想哪三件事？
- 懂了對方的想法，就一定要同意他嗎？
scenario: 親子共學：看卡通或繪本時暫停，問如果你是另一邊的角色，你會怎麼想；大人也回答一次（本站建議）。
goal: 說出故事或生活裡另一個人看到什麼、想到什麼、感覺怎樣，並分清楚懂他和同意他不一樣。
review: 讀完一本繪本，孩子挑一個跟自己想法不同的角色，說出他看到什麼、想到什麼、感覺怎樣三句；家長確認三句都是從那個角色的角度說，再請孩子說自己同不同意這個角色、為什麼。
