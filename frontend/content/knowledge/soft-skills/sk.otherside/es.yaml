idea: 同一件事，站的位置不同，看到的就不同。想像自己是對方：他看到什麼？他在擔心什麼？這不代表要同意他，而是先懂他。
guiding_questions:
- 你覺得好玩的玩笑，被開玩笑的人也覺得好玩嗎？
scenario: 親子共學：看卡通或繪本時暫停，問：「如果你是壞人那一邊，你會怎麼想？」大人也回答一次。
goal: 說出故事裡另一個角色看到什麼、想什麼、覺得怎麼樣。
review: 讀完一本繪本，孩子挑一個跟自己想法不同的角色，說出他的「看到、想到、感覺」三句；家長確認三句都是那個角色的角度。
