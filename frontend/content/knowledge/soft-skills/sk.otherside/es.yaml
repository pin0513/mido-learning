how:
  heading: 換位子：看到、想到、感覺
  body:
  - 先選角色：讀繪本或看卡通時，在角色吵架或做決定的地方暫停，挑一個跟自己想法不同的角色（本站建議）。
  - 再換位子說三句：他看到什麼（他知道哪些事）、他想到什麼（他在擔心或希望什麼）、他感覺怎樣（本站整理）。說的時候主角是他，像他看到……、他覺得……；如果句子變成我覺得他很壞，就是又回到自己的位置了（本站建議）。綜合活動課綱說的「同理心的增進與實踐」，就是練習這樣想。
  - 最後分開懂和同意：說完三句，再說自己同不同意他、為什麼（本站建議）。懂他不等於同意他；國語課綱要「與他人溝通時能尊重不同意見。」大人也換位子說一次，比比看同一個角色，兩個人是不是想得不一樣（本站建議）。
  qa:
    question: 換到對方的位置時，要想哪三件事？
    answer: 看到、想到、感覺：他看到什麼、想到什麼、覺得怎樣（本站整理）。三句的主角都是他，不是我；綜合活動課綱要五、六年級練習的，就是「同理心的增進與實踐。」
    source: zonghe
  items_title: 四步做
  items:
  - title: 暫停選角色
    text: 挑一個想法不同的。
  - title: 說他看到的
    text: 他知道哪些事？
  - title: 說他想的和感覺
    text: 主角是他，不是我。
  - title: 再說自己的看法
    text: 懂他不等於同意他。
  checklist_title: 說的時候檢查一下
  checklist:
