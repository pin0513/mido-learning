what:
  heading: 換個位置，看見不同
  body:
  - 學完後，孩子能站到另一個人的位置，說出他看到什麼、想到什麼、感覺怎樣，也分得清楚懂他和同意他是兩回事。
  items_title: 學完能做到
  items:
  - title: 說出三句
    text: 看到、想到、感覺。
  - title: 用他的角度說
    text: 主角是他，不是我。
  - title: 分開懂和同意
    text: 再說自己的看法。
  checklist_title: 家長檢核
  checklist:
  - 說得出三句
  - 三句都是他的角度
  - 說得出同不同意
  notes:
  - 本點融入品德教育議題：議題融入說明手冊國小的實質內涵有同理分享。換位子想、說出別人的感受，就是在練習同理。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - issues-handbook
  - genai-student
