why:
  heading: 先懂對方，再說自己
  body:
  - 綜合活動課綱要五、六年級練習「同理心的增進與實踐。」國語課綱也要孩子「與他人溝通時能尊重不同意見。」品德教育議題的國小實質內涵，則有「同理分享。」
  - CASEL（美國推動社會情緒學習的組織）把社會覺察列為核心能力，說明是「The abilities to understand the perspectives of and empathize with others, including those from diverse backgrounds, cultures, and contexts.」，也就是理解別人的觀點、感受別人的處境，包括和自己背景不同的人（翻譯是本站整理）。
  qa:
    question: 你覺得好玩的玩笑，被開玩笑的人也覺得好玩嗎？
    answer: 不一定。開玩笑的人站在旁邊看，被開玩笑的人站在中間被大家看（本站整理）。換到他的位置想，他可能覺得丟臉或難過；CASEL 說的社會覺察也包括「Showing concern for the feelings of others」，關心別人的感受（翻譯是本站整理）。
    source: casel-framework
  items_title: 課綱的學習重點
  items:
