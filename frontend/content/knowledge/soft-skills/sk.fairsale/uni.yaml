why:
  heading: 法律已經畫出兩條線
  body:
  - 公平交易法第 21 條規定：「事業不得在商品或廣告上，或以其他使公眾得知之方法，對於與商品相關而足以影響交易決定之事項，為虛偽不實或引人錯誤之表示或表徵。」同條也列出價格、數量、品質等事項。
  - 消費者保護法第 19 條規定，通訊交易或訪問交易的消費者「得於收受商品或接受服務後七日內，以退回商品或書面通知方式解除契約，無須說明理由及負擔任何費用或對價。」本站的解讀：法律預想到，在螢幕前或家門口，人容易來不及想清楚。
  qa:
    question: 「今天不買就沒了」，這句話什麼時候算施壓？
    answer: 如果是真的（限量、檔期有明確根據），它是在提供資訊；如果不是真的，就可能是公平交易法第 21 條說的虛偽不實或引人錯誤的表示。就算是真的，也要讓對方能說「我再想想」；網購和到府推銷，消費者原則上有七天可以解除契約。
    source: ftc21
  items_title: 兩條界線
  items:
  - title: 不誤導
    text: 價格、數量、品質這類影響決定的事，說的都要有根據。
  - title: 不施壓
    text: 留給對方考慮和拒絕的時間。
  sources:
  - ftc21
  - cpa19
how:
  heading: 說之前，先自己檢查
  body:
  - 寫完文案或提案，逐句問三件事：這句會不會影響對方的決定？有沒有根據？對方能不能慢慢決定？三題都過，再說出口。（本站建議）
  items:
  - title: 圈出關鍵句
    example: 「全台最低價」「只剩三組」
    text: 找出影響交易決定的說法。
  - title: 附上根據
    example: 比價截圖、庫存紀錄
    text: 每句都要說得出根據；說不出來就改寫或刪掉。
  - title: 留出空間
    example: 「可以帶回去想，七天內都能問我」
    text: 給對方考慮和拒絕的時間。
  activity_figure: how-flow
  sources:
  - ftc21
  - cpa19
what:
  heading: 說服不等於誤導
  figures:
  - what-compare
  notes:
  - 公平交易法第 21 條管的是「虛偽不實或引人錯誤」的表示，條文把「虛偽不實」和「引人錯誤」並列；本站的解讀：不只明顯的假話，讓人誤會影響決定的事也要避免。
  - 消費者保護法第 19 條的七日解除契約適用於通訊交易和訪問交易；通訊交易有合理例外情事的，不在此限。
  - 個案是否違法，由主管機關或法院認定；本頁不是法律意見。
  sources:
  - ftc21
  - cpa19
