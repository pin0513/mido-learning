idea: 說服是幫對方做出自己的決定；誤導和施壓是替對方做決定。公平交易法要求，跟交易決定有關的事（例如價格、品質）不能說得不實或讓人誤會；消費者保護法則讓網購、到府推銷這類交易的消費者，收到商品或接受服務後七天內可以解除契約（通訊交易有合理例外）。這兩條法律畫出界線：資訊要真，決定要留給對方。個案是否違法，由主管機關或法院認定；本頁不是法律意見。
guiding_questions:
- 「今天不買就沒了」，這句話什麼時候算施壓？
scenario: 親子共學：一起看一則手機上的廣告或直播銷售，大人和孩子各圈出一句「讓人想馬上買」的話，討論它是事實、誇大，還是在催人。
goal: 推銷或提案時，所有影響決定的說法都有根據，並且留給對方考慮和拒絕的空間。
review: 拿自己寫過的一份銷售文案、提案或募資頁，逐句標出影響決定的說法（價格、數量、品質、期限）；每句附上根據，沒有根據的改寫或刪除；再加一句讓對方可以慢慢決定的話，請一位同學或同事檢查。
