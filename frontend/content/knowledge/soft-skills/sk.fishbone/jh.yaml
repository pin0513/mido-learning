verify_notes:
- 核心素養 A2：依總綱 p.4–6 國民中學教育的 J-A2 與綜合活動領綱 p.3 的綜-J-A2、自然科學領綱 p.4–5 的自-J-A2原文確認（表格窄欄分散對齊，字距大，文字用 pdftotext 原始順序層與頁面文字塊核對）。
- stage.grades 填 7、8、9：本點的代碼都是第四學習階段（IV），國中的學習重點沒有再分年級；總綱 p.7 說國民中學七、八、九年級為第四學習階段。
- est_time 依綜合活動領綱 p.2：第四學習階段綜合活動每週 3 節課；本點建議在綜合活動課上做，也可以親子一起練（本站建議）。
- 頁碼都是頁腳印的頁碼：綜合活動領綱與總綱比 PDF 頁少 4，自然科學領綱少 4；教育部學生版的 PDF 頁就是頁腳印的頁碼。
- 綜合活動 1b-IV-2（p.17）、輔 Db-IV-1（p.93）、自然科學 pa-IV-2 原本不在代碼表，本批依原文加入（taxonomy patch）。pa-IV-2 的文字跨 p.21–22（在發現新知中間換頁），引文標 p.21–22，代碼表記第一頁 p.21。
- 健康與體育領綱也有同號的學習表現：1b-IV-2、2a-IV-1、2a-IV-3、2c-IV-1（健體 p.26），文字和綜合活動不同；健體不在代碼表，代碼表以代碼為鍵，將來要收健體要先改 schema（taxonomy 的綜合活動區塊加了註解）。健體的學習內容 Da-IV-1、Db-IV-1（健體 p.28）沒有科目字首，本點的家 Da-IV-1、輔 Db-IV-1 帶字首，鍵不衝突。
- 原 curriculum_108.domains 只有綜合活動，本點加上自然科學 pa-IV-2（從資訊或數據獲知因果關係），所以 domains 補自然科學；核心素養維持 A2。
- 原 idea 的「魚骨圖（石川圖）」改成魚骨圖（也叫因果圖）；「逼自己想到」改成幫自己想到：CMS 的工具寫 A cause and effect diagram；石川圖的出處（ASQ 網頁）讀取時回 403，沒有可逐字引用的來源，所以不寫。
- 原稿的四類（方法、時間、環境、身心）保留，標成本站建議；CMS 的例子用設備、環境、規則程序和人員四類，本頁說明類別可以依問題調整。
- 原 review 的「至少 4 類、每類 2 個原因」「圈出 2 個」標成示意。
- 原 scenario「親子共學：全家一起畫『為什麼早上總是很趕』的魚骨圖，每個人都要在別人的分類裡補一個原因。」保留做法，補上本站建議。內層引號拿掉。
- 原 ai.delegable「補充可能遺漏的原因類別」補上由老師或家長操作（本站建議），並在 What 加上教育部注意事項（學生版）的使用規則。
- 原有草稿說明「課綱對應只到領域、核心素養與議題…」已處理：本點已逐條對照官方領綱與議題融入說明手冊原文（頁碼見來源）。
- 原有草稿說明「引用的框架只寫名稱（魚骨圖（石川圖））…」已處理：依美國聯邦醫療保險與補助服務中心（CMS）QAPI 的魚骨圖工具改寫，英文短句逐字引用（頁碼見來源），中文說明是本站整理。
- CMS 的工具是寫給醫療照護機構做品質改善的；本點把問題換成家庭、學校生活的問題，用在國中生練習找原因（本站建議）。
- 英文 PDF 的引文避開彎引號；PDF 換行處照原詞接回，其餘空白照原文。
- 生成式 AI 的使用規則依教育部注意事項（學生版）；supports 逐段標頁碼（學生版的 PDF 頁就是頁腳印的頁碼）。
