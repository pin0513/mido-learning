what:
  heading: 分類找原因，再查證
  body:
  - 學完後，能為一個真實問題畫魚骨圖，把可能的原因分類寫出來，圈出最可能的原因，並寫下怎麼查證。
  items_title: 學完能做到
  items:
  - title: 寫清楚問題
    text: 魚頭寫問題。
  - title: 分類列原因
    text: 原因不怪人。
  - title: 查證可能原因
    text: 寫下怎麼確認。
  checklist_title: 家長檢核
  checklist:
  - 至少四類原因
  - 原因不是怪人
  - 寫了怎麼確認
  notes:
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - genai-student
