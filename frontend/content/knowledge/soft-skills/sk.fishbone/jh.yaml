how:
  heading: 魚頭、魚骨，再圈出來
  body:
  - 先寫魚頭：把問題寫清楚，例如這次段考數學比上次低（例子是本站整理）。CMS 建議「Be as clear and specific as you can about the problem.」，也提醒「Beware of defining the problem in terms of a solution」，魚頭寫問題，不要寫成辦法，例如不要寫要多補習（翻譯和例子是本站整理）。
  - 再畫魚骨：本頁建議分成方法、時間、環境、身心四類，每類想兩個以上的原因（本站建議）；CMS 的例子用的是設備、環境、規則程序和人員四類，類別可以依問題調整（本站整理）。全家每個人都可以補，CMS 也建議「Encourage each person to participate in the brainstorming activity」（翻譯是本站整理）。原因寫成事情，不寫成怪誰，例如寫睡不到七小時，不寫他很懶（例子是本站建議）。
  - 最後圈出來：CMS 的做法是「having each team member identify the top three root causes」，本頁建議每個人先圈 2 個最可能的原因（本站建議）。再替圈到的原因寫下要怎麼確認，例如連續一週記下睡眠時間；查過才知道是不是真的原因（例子是本站整理）。
  qa:
    question: 畫完之後，怎麼找出最該先查的原因？
    answer: 每個人圈出自己覺得最可能的原因，被圈最多的先查（本站建議）。CMS 的做法是請每個人在魚骨圖上「place three tally marks or colored sticky dots」，標出他認為的根本原因（翻譯是本站整理）。
    source: cms-fishbone
  items_title: 四步做
  items:
  - title: 寫魚頭
    text: 寫問題，不寫辦法。
  - title: 分類畫魚骨
    text: 每類想兩個原因。
  - title: 圈出可能原因
    text: 每人圈 2 個。
  - title: 寫怎麼確認
    text: 查過才算數。
