idea: 魚骨圖（也叫因果圖）把問題寫在魚頭，原因分類寫在魚骨上，例如方法、時間、環境、身心。分類可以幫自己想到平常忽略的原因；畫完再圈出最可能的兩三個去查證。
guiding_questions:
- 數學退步，可能的原因只有「不夠用功」嗎？
- 魚頭要寫什麼？
- 畫完之後，怎麼找出最該先查的原因？
scenario: 親子共學：全家一起畫為什麼早上總是很趕的魚骨圖，每個人都要在別人的分類裡補一個原因（本站建議）。
goal: 用魚骨圖把可能的原因分成幾類，圈出最值得先查證的原因。
review: 為一個真實問題（例如段考退步）畫魚骨圖：至少 4 類、每類 2 個原因，圈出 2 個最可能的原因並寫下要怎麼確認；家長檢查原因不是在責怪人（數字都是示意）。
