why:
  heading: 原因常常不只一個
  body:
  - 綜合活動課綱要國中生「運用問題解決策略，處理生活議題，進而克服生活逆境。」輔導的學習內容有「生活議題的問題解決、危機因應與克服困境的方法。」自然科學課綱也要學生「從（所得的）資訊或數據，形成解釋、發現新知、獲知因果關係、解決問題或是發現新的問題。」
  - 美國聯邦醫療保險與補助服務中心（CMS）的品質改善工具說，「A fishbone diagram is a visual way to look at cause and effect.」，也就是用圖來看原因和結果（翻譯是本站整理）。它也說，分類可以幫大家找出「possible causes for a problem that might not otherwise be considered」，也就是平常可能想不到的原因（翻譯是本站整理）。CMS 的例子也提醒「As this example illustrates, there can be more than one root cause.」，根本原因可能不只一個（翻譯是本站整理）。
  qa:
    question: 數學退步，可能的原因只有「不夠用功」嗎？
    answer: 不一定。可能還有方法（只看不寫）、時間（考前才讀）、環境（讀書時手機在旁邊）、身心（睡不夠）等原因（例子是本站整理）。CMS 的工具建議先「Brainstorm all the possible causes of the problem.」，也就是把可能的原因都列出來，再來判斷（翻譯是本站整理）。
    source: cms-fishbone
  items_title: 課綱的學習重點
  items:
  - title: 運用問題解決策略
    text: 綜合活動 1b-IV-2：運用問題解決策略，處理生活議題，進而克服生活逆境。
    code: 1b-IV-2
  - title: 生活議題的問題解決
    text: 綜合活動 輔 Db-IV-1：生活議題的問題解決、危機因應與克服困境的方法。
    code: 輔 Db-IV-1
  - title: 從數據獲知因果關係
    text: 自然科學 pa-IV-2：能運用科學原理、思考智能、數學等方法，從（所得的）資訊或數據，形成解釋、發現新知、獲知因果關係、解決問題或是發現新的問題。並能將自己的探究結果和同學的結果或其他相關的資訊比較對照，相互檢核，確認結果。
    code: pa-IV-2
