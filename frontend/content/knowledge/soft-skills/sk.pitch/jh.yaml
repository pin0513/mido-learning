why:
  heading: 好處要對到需要
  body:
  - 社會課綱在國中公民問：「人為什麼從自給自足轉向交易？」「自願的交易為什麼對雙方都有利？」推薦就是在找一個對雙方都有利的交易。
  - Strategyzer 的價值主張圖要先描述一群顧客：他們想完成的事、遇到的痛點、想得到的好處；再列出自己提供什麼。它也提醒：「Fit is a claim until customers confirm it.」合不合，要對方說了才算。
  qa:
    question: 你最愛的一本書，要怎麼推薦給一個不愛看書的同學？
    answer: 先問他最近喜歡什麼、為什麼不愛看書。如果他喜歡打電動又嫌書太長，就說「這本每章都很短，主角像在破關」；如果真的對不上，就說「這本可能不適合你」。
    source: strategyzer-vpc
  items_title: 練好以後，可以
  items:
  - title: 說明交易
    text: 用例子說明人為什麼從自給自足轉向交易。
    code: 公 Bn-IV-2
  - title: 雙方有利
    text: 說出一次自願交易讓雙方各得到什麼。
    code: 公 Bn-IV-3
  - title: 對上需要
    text: 每說一個好處，都對到對方說過的一個需要。
  sources:
  - shehui
  - strategyzer-vpc
how:
  heading: 先問、再對、後說
  body:
  - 先問三件事：想完成什麼、哪裡卡住、想得到什麼。再把自己東西的好處一條條對上去，對不上的先不說。最後用一兩點推薦，加一句限制。
  items:
  - title: 問需要
    example: 你最近放學後最想做什麼？
    text: 問對方想完成的事、痛點和想要的好處。
  - title: 對好處
    example: 他嫌書太長：這本每章十頁。
    text: 只留下能對上需要的好處。
  - title: 說限制
    example: 不過前兩章比較慢。
    text: 誠實說出一個不適合的地方。
  activity_figure: how-flow
  sources:
  - strategyzer-vpc
what:
  heading: 推薦不是把優點全部說完
  figures:
  - what-compare
  notes:
  - 價值主張圖（Value Proposition Canvas）分兩邊：一邊是顧客想完成的事、痛點和想要的好處；一邊是你提供的東西、它減輕哪些痛點、帶來哪些好處。兩邊對得上，才叫合適。
  sources:
  - strategyzer-vpc
