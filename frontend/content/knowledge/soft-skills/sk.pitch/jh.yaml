idea: 推薦之前先問：對方想完成什麼事、哪裡卡住、想得到什麼。再從自己的東西裡挑出能幫上忙的一兩點來說。對方用不到的好處，說再多也沒用；說不出能幫上忙的地方，就老實說「可能不適合你」。
guiding_questions:
- 你最愛的一本書，要怎麼推薦給一個不愛看書的同學？
scenario: 親子共學：孩子向家人推薦一本書或一款桌遊。先訪問家人三個問題（最近想做什麼、什麼讓你煩、想要什麼感覺），再用一分鐘推薦，家人最後說會不會試。
goal: 推薦前先問出對方的需要，只說和這些需要有關的好處，並誠實說出限制。
review: 向一位家人或同學推薦一樣東西：事前寫下問到的三個答案；推薦時每個好處都能對到一個答案，並說出一個限制；最後請對方說會不會試、為什麼。
formats:
