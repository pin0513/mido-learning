  exercise: 目標：推薦前先問出對方的需要，只說和這些需要有關的好處，並誠實說出限制。　檢核：向一位家人或同學推薦一樣東西：事前寫下問到的三個答案；推薦時每個好處都能對到一個答案，並說出一個限制；最後請對方說會不會試、為什麼。
