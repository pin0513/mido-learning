verify_notes:
- 公 Bj-IV-1、IV-2、IV-3、IV-5 於 2026-11-11 由社會領綱 PDF 第 35 頁（頁腳第 31 頁）依文字座標抽出，並寫進 curriculum-108-codes.yaml。卡片文字與代碼表全文相同。IV-4 本點不用，沒有收進卡片。
- 民法第 12、13、77、79、153 條於 2026-11-11 從全國法規資料庫單條頁逐字核對。網址見 sources。頁首「尚未生效」是第 166 條之 1 與 115 年 8 月 17 日修正的第 1223 條，不是這五條。法規整編資料截止日為民國 115 年 10 月 30 日。
- 現行第 13 條只有兩項，沒有「但」。日常生活所必需、純獲法律上利益寫在第 77 條同一段裡。用字是「身分」，不是另一個寫法。第 77 條的「但」不另取名字。
- 第 153 條第 2 項讀過：「當事人對於必要之點，意思一致，而對於非必要之點，未經表示意思者，推定其契約為成立，關於該非必要之點，當事人意思不一致時，法院應依其事件之性質定之。」三個例子用不到，頁上不寫。
- 買水、儲值點數、十二期買手機都是本站虛構。本頁不判決，不講消費者保護，也不講公平交易。
