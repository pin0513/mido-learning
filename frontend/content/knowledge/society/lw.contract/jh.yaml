why:
  heading: 先對上課綱在問什麼
  body:
  - 國中公民問：一般契約為什麼合意就可以生效、有的為什麼要登記、不履行會怎樣；為什麼限制行為能力人訂約原則上要法定代理人同意；人民怎麼解決民事紛爭。這一點用三次虛構的買賣，先把成立和允許打開。
  - 要登記才生效、不履行的責任、紛爭處理的優缺點，這三個例子都不進入。課綱的問句留在卡片上。弄壞東西要不要負責，是上一階，這裡不重講。
  items_title: 課綱原句
  items:
  - title: 合意與登記
    text: 為什麼一般契約只要雙方當事人合意即可生效，而有些契約必須完成登記方能生效？契約不履行會產生哪些責任？
    code: 公 Bj-IV-1
  - title: 誰可以訂約
    text: 為什麼一般人能自由訂立契約，而限制行為能力人訂立契約原則上必須得法定代理人同意？
    code: 公 Bj-IV-2
  - title: 侵權先標出
    text: 侵權行為的概念與責任。
    code: 公 Bj-IV-3
  - title: 紛爭怎麼解
    text: 社會生活上人民如何解決民事紛爭？這些解決方法各有哪些優缺點？
    code: 公 Bj-IV-5
  qa:
    question: 為什麼有些東西，小孩不能自己買？
    answer: 未滿十八歲、滿七歲，是限制行為能力。原則上要法定代理人允許。對上第 77 條原句裡「但」的後面，才不用另外允許。沒有允許、也對不上，就要承認才生效。本頁不下判決。
    source: civil-77
  sources:
  - social108
how:
  heading: 四問對上條文
  body:
  - 成立看第 153 條第 1 項：「當事人互相表示意思一致者，無論其為明示或默示，契約即為成立。」三次買賣都先問有沒有意思一致。
  - 幾歲看第 12 條：「滿十八歲為成年。」和第 13 條。第 1 項：「未滿七歲之未成年人，無行為能力。」第 2 項：「滿七歲以上之未成年人，有限制行為能力。」現行第 13 條只有這兩項。十五歲是限制行為能力。
  - 要不要允許，看第 77 條整句：「限制行為能力人為意思表示及受意思表示，應得法定代理人之允許。但純獲法律上利益，或依其年齡及身分、日常生活所必需者，不在此限。」沒有允許、也對不上這句「但」的後面，看第 79 條：「限制行為能力人未得法定代理人之允許，所訂立之契約，須經法定代理人之承認，始生效力。」
  items_title: 三次虛構買賣
  items:
  - title: 買一瓶水
    text: 錢交給店員、店員收下，意思一致，契約成立。一瓶水可以對上第 77 條的「依其年齡及身分、日常生活所必需者」。本頁這樣對，不下法院會怎麼判。
  - title: 儲值點數
    text: 按儲值、系統收下，意思可以一致，契約可以成立。他要付錢，不是「純獲法律上利益」，也不是日常生活所必需。本頁這樣對。沒有允許，要第 79 條的承認才生效。
  - title: 分期買手機
    text: 說好十二期、甲點頭，是意思一致，契約成立。不是純獲利益，也不是日常生活所必需。本頁這樣對。沒有允許，要承認才生效。成立和生效分開。
  checklist_title: 四問都要寫
  checklist:
  - 意思一致嗎
  - 滿十八歲嗎
  - 對上第77條
  - 沒允許看79
  figures:
  - contract-flow
  qa:
    question: 這三個虛構情境，契約什麼時候成立？
    answer: 依第 153 條第 1 項，互相表示意思一致就成立。買水是付錢和收下。儲值是按下去和系統收下。分期手機是說好期數並且點頭。成立還不等於生效。
    source: civil-153
  sources:
  - civil-12
  - civil-13
  - civil-77
  - civil-79
  - civil-153
what:
  heading: 成立和生效分開
  body:
  - 課綱這張卡片寫「同意」，第 77 條寫「允許」。卡片照課綱原文。判斷三次買賣時，用條文的「允許」和同一句裡的「但」。
  - 一瓶水，本頁對上「日常生活所必需」，所以不一定要另外允許。儲值和分期手機，本頁對不上那句「但」的後面。沒有允許，契約可以先成立，生效要等法定代理人承認。
  - 三個例子都不進法院。要登記的契約、不履行的責任、紛爭怎麼處理，這一頁不下結論。
  figures:
  - contract-compare
  qa:
    question: 十五歲買東西，什麼時候要法定代理人允許或承認？
    answer: 原則上要允許。對上第 77 條原句「但」的後面，不用另外允許。對不上、又沒有允許，第 79 條要承認才生效。一瓶水本頁對得上；儲值和分期手機本頁對不上。這是對條文，不是判決。
    source: civil-79
  sources:
  - civil-13
  - civil-77
  - civil-79
  notes:
  - 流程和對照是本站整理，不是法典裡的原圖。
  - 第 13 條的現行文字沒有「但」。那一句在第 77 條。
  - 消費者保護和公平交易不在這一點。本頁不判決。
