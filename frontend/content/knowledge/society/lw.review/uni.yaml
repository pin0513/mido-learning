verify_notes:
- 大學不填 curriculum_108、不列 est_time。公 Bg-V-1、Bg-V-2、公 Ha-V-1、Ha-V-2 已於 2026-11-14 寫進 curriculum-108-codes.yaml，全文與 PDF 座標抽出的句子相同。Bg-V-1 的代碼和前半在頁腳第 29 頁，最後「現？」兩個字在頁腳第 30 頁。Bg-V-2 在頁腳第 30 頁。Ha 兩條在頁腳第 43 頁。Bg-V-2 下面的延伸探究讀過，沒有收進代碼表。
- 憲法第 23 條、行政程序法第 7 條、憲法訴訟法第 1 條與第 52 條，於 2026-11-14 從全國法規資料庫單條頁逐字核對。憲法頁首只有公布日期民國 36 年 01 月 01 日，沒有修正日期欄。行政程序法修正日期民國 110 年 01 月 20 日。憲法訴訟法修正日期民國 114 年 01 月 23 日。法規整編資料截止日為民國 115 年 11 月 06 日。
- 課綱 Ha-V-1 寫「聲請大法官解釋」。憲法訴訟法第 1 條寫的是憲法法庭。兩句都照各自原文，不併成一句。Ha-V-2 問有哪些解釋立下里程碑。本頁不回答，因為沒有打開任何判決。
- 不引用 113 年憲判字第 3 號，也不引用任何裁判。不評論真實案件。道路交通管理的罰則條文沒有打開，不引用。「適當、必要、衡量」是本站對行政程序法第 7 條三款的短稱，條文本身沒有這三個標題。
- 騎機車要戴安全帽，只當作一種法律限制的題目。本頁不寫它違憲或合憲。
