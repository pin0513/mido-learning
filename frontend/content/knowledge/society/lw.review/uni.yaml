why:
  heading: 先把兩套句子分開
  body:
  - 憲法第 23 條：「以上各條列舉之自由權利，除為防止妨礙他人自由、避免緊急危難、維持社會秩序，或增進公共利益所必要者外，不得以法律限制之。」「以法律」是限制要由法律來。「所必要」是同句裡的另一個要件。這條沒有把後面的三款寫進去。
  - 行政程序法第 7 條寫的是行政行為：「行政行為，應依下列原則為之：」一、「採取之方法應有助於目的之達成。」二、「有多種同樣能達成目的之方法時，應選擇對人民權益損害最少者。」三、「採取之方法所造成之損害不得與欲達成目的之利益顯失均衡。」本頁把三款短稱為適當、必要、衡量。短稱是本站整理，不是條文標題。用這三句來整理一個法律限制，是這一頁的寫法，不是把第 7 條說成憲法法庭使用的條文。
  qa:
    question: 誰可以決定一條法律違憲？
    answer: 憲法訴訟法第 1 條第 1 項寫，司法院大法官組成憲法法庭，審理的案件包括法規範憲法審查及裁判憲法審查案件。第 52 條第 1 項寫，判決宣告法規範違憲且應失效者，該法規範自判決生效日起失效。寫這一頁的人不能自己宣告違憲。
    source: constproc-1
  items_title: 先標出你在用哪一句
  items:
  - title: 以法律
    text: 第 23 條寫不得以法律限制之。限制要由法律來。
  - title: 所必要
    text: 同一個第 23 條寫，為了條文列出的目的所必要。
  - title: 三款短稱
    text: 適當、必要、衡量是本站對第 7 條三款的短稱。
  - title: 誰來宣告
    text: 法規範憲法審查，由憲法法庭審理。
  sources:
  - const-23
  - adminproc-7
  - constproc-1
how:
  heading: 三步寫成一頁
  body:
  - 題目用「騎機車應戴安全帽」這種限制。道路交通管理的罰則這一頁沒有打開，不引用條文，也不說法院已經怎麼判（題目是本站整理的一種限制，不是一份裁判）。
  - 一頁分成四格，都先問、不填結論。以法律：這項限制是不是用法律規定。適當：採取的方法是否有助於目的之達成。必要：有多種同樣能達成目的的方法時，是否選擇對人民權益損害最少者。衡量：採取的方法所造成的損害，與欲達成目的之利益，有沒有顯失均衡。第 7 條的「必要」兩個字沒有出現；本頁的短稱「必要」指的是第二款，不拿去取代第 23 條的「所必要」。
  - 課綱問基本權利的限制有何範圍、國家如何促進基本權利的實現，也問憲法如何規範公權力以保障人權。問句留在出處。這一頁只用第 23 條和第 7 條來排格子。
  items_title: 四格都先留空
  items:
  - title: 以法律
    text: 這項限制是不是由法律規定。回到第 23 條，不另編一個名稱。
  - title: 適當
    text: 採取之方法應有助於目的之達成。
  - title: 必要
    text: 有多種同樣能達成目的之方法時，應選擇對人民權益損害最少者。
  - title: 衡量
    text: 採取之方法所造成之損害不得與欲達成目的之利益顯失均衡。
  checklist_title: 寫之前先標
  checklist:
  - 先寫以法律
  - 三款對短稱
  - 第7條不是憲法
  - 法院那格留白
  - 不引用判決
  figures:
  - review-flow
  qa:
    question: 安全帽這條限制，三步要怎麼寫？
    answer: 適當對第一款：方法有沒有助於目的。必要對第二款：同樣能達成目的時，有沒有選對人民權益損害最少的方法。衡量對第三款：損害與目的的利益有沒有顯失均衡。三句都先問。本頁不填安全帽這一題的結論。
    source: adminproc-7
  sources:
  - adminproc-7
  - const-23
  - social108
what:
  heading: 判決不是我的看法
  body:
  - 憲法訴訟法第 1 條：「司法院大法官組成憲法法庭，依本法之規定審理下列案件：」第一款是「法規範憲法審查及裁判憲法審查案件。」第 52 條第 1 項：「判決宣告法規範違憲且應失效者，該法規範自判決生效日起失效。但主文另有諭知溯及失效或定期失效者，依其諭知。」第 2 項是定期失效的期間，法律不得逾二年、命令不得逾一年。安全帽這一題用不到期間，正文不拿它做結論。
  - 課綱有一句寫「聲請大法官解釋的程序」。現行第 1 條寫的是憲法法庭。兩句都照各自原文，不併成一句。另一句問有哪些解釋立下人權保障的里程碑。這一頁不列任何解釋，因為沒有打開判決，也不評論真實案件。
  - 所以一頁紙分成兩段。法院怎麼判：空白，並寫明宣告法規範違憲的是憲法法庭，不是寫的人。我怎麼看：上面四格是自己的對照。兩段不要合成一個「因此違憲」或「因此合憲」。
  figures:
  - review-flow
  qa:
    question: 法院怎麼判，和我怎麼看，要怎麼分開？
    answer: 法院怎麼判那一段留白，只寫憲法法庭審理法規範憲法審查，並可宣告法規範違憲且應失效。我怎麼看那一段是自己用第 23 條和第 7 條三款做的對照。本頁兩段都不填安全帽違憲或合憲。
    source: constproc-52
  sources:
  - constproc-1
  - constproc-52
  - social108
  notes:
  - 流程圖是本站整理。三個短稱不是第 7 條的標題。
  - 第 52 條裡的「但」照原文，不另取名字。
  - 本頁不引用判決，也不評論真實案件。
