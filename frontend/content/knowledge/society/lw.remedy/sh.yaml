    第 1 項：「公共設施因設置或管理有欠缺，致人民生命、身體、人身自由或財產受損害者，國家應負損害賠償責任。」第 2 項：「前項設施委託民間團體或個人管理時，因管理欠缺致人民生命、身體、人身自由或財產受損害者，國家應負損害賠償責任。」第 3 項：「前二項情形，於開放之山域、水域等自然公物，經管理機關、受委託管理之民間團體或個人已就使用該公物為適當之警告或標示，而人民仍從事冒險或具危險性活動，國家不負損害賠償責任。」第 4 項：「第一項及第二項情形，於開放之山域、水域等自然公物內之設施，經管理機關、受委託管理之民間團體或個人已就使用該設施為適當之警告或標示，而人民仍從事冒險或具危險性活動，得減輕或免除國家應負之損害賠償責任。」第 5 項：「第一項、第二項及前項情形，就損害原因有應負責任之人時，賠償義務機關對之有求償權。」2026-11-14 單條頁核對。現行是五項。
