why:
  heading: 先對上課綱在問什麼
  body:
  - 高中公民問怎麼判斷行政處分合不合法、訴願和行政訴訟有哪些程序要件，以及什麼情況可以請求國家賠償、什麼情況是補償。這一點用一張虛構罰單和一塊鬆掉的地磚把前半打開。補償不在這兩個例子裡，不下結論。
  - 憲法第 16 條：「人民有請願、訴願及訴訟之權。」請願不是這一頁的流程。基本權怎麼衝突，是上一階。
  items_title: 課綱原句
  items:
  - title: 訴願與訴訟
    text: 如何判定行政處分的合法性？人民提起訴願或行政訴訟的重要程序要件有哪些？
    code: 公 Hb-V-2
  - title: 賠償與補償
    text: 什麼情況下人民可以請求國家賠償？什麼情況下國家應對人民補償損失？國家為什麼要賠償或補償人民？
    code: 公 Hb-V-3
  qa:
    question: 被開罰單覺得不公平，可以怎麼辦？
    answer: 先看它是不是行政處分。訴願法第 1 條第 1 項寫，人民對行政處分認為違法或不當、權利或利益受損害，可以提起訴願。第 14 條第 1 項寫，從處分達到或公告期滿的次日起三十日內。不服訴願決定，行政訴訟法第 4 條第 1 項才寫得向行政法院提撤銷訴訟。本頁不說這張罰單會不會撤銷。
    source: appeal-1
  sources:
  - social108
  - const-16
  - appeal-1
how:
  heading: 先畫救濟流程
  body:
  - 虛構的松果市罰單先對訴願法第 1 條第 1 項。甲認為違法或不當、權利或利益受損害，可以訴願。第 2 項是地方自治團體或其他公法人，這張罰單用不到。三十日看第 14 條第 1 項：「訴願之提起，應自行政處分達到或公告期滿之次日起三十日內為之。」不是從收到當天回頭算。
  - 不服訴願決定，才看行政訴訟法第 4 條第 1 項：「人民因中央或地方機關之違法行政處分，認為損害其權利或法律上之利益，經依訴願法提起訴願而不服其決定，或提起訴願逾三個月不為決定，或延長訴願決定期間逾二個月不為決定者，得向行政法院提起撤銷訴訟。」訴願可以寫違法或不當。這一條寫的是違法。第 2 項：「逾越權限或濫用權力之行政處分，以違法論。」
  - 圖只畫主線：收到處分、次日起三十日內訴願、不服再提撤銷訴訟。逾期不決定的兩條路在第 4 條第 1 項裡，圖沒有另開一格。本頁不說甲會贏（例子是本站整理）。
  items_title: 主線對上的句子
  items:
  - title: 誰可以訴願
    text: 人民對於中央或地方機關之行政處分，認為違法或不當，致損害其權利或利益者，得依本法提起訴願。但法律另有規定者，從其規定。
  - title: 三十日怎麼算
    text: 訴願之提起，應自行政處分達到或公告期滿之次日起三十日內為之。
  - title: 不服再起訴
    text: 經依訴願法提起訴願而不服其決定，或提起訴願逾三個月不為決定，或延長訴願決定期間逾二個月不為決定者，得向行政法院提起撤銷訴訟。
  - title: 以違法論
    text: 逾越權限或濫用權力之行政處分，以違法論。
  checklist_title: 畫流程之前
  checklist:
  - 次日起算三十日
  - 先寫訴願
  - 不服再訴訟
  - 不當不等於違法
  - 不寫真實案件
  figures:
  - remedy-flow
  qa:
    question: 這張虛構罰單的救濟要先畫哪幾步？
    answer: 先確認是行政處分。再寫次日起三十日內訴願。不服決定，或逾期不為決定，才依第 4 條第 1 項提撤銷訴訟。圖上的第三步只畫「不服」。本頁不填結果。
    source: appeal-14
  sources:
  - appeal-1
  - appeal-14
  - adminlit-4
what:
  heading: 國家賠償兩種情形
  body:
  - 罰單走的是訴願和撤銷訴訟。國家賠償是另一條。第 2 條第 2 項：「公務員於執行職務行使公權力時，因故意或過失不法侵害人民自由或權利者，國家應負損害賠償責任。公務員怠於執行職務，致人民自由或權利遭受損害者亦同。」第 3 條第 1 項：「公共設施因設置或管理有欠缺，致人民生命、身體、人身自由或財產受損害者，國家應負損害賠償責任。」
  - 圖書館鬆掉的地磚，本頁拿來對第 3 條第 1 項。膝蓋擦紅是虛構。第 2 項是設施委託民間管理。第 3 項是開放的山域、水域等自然公物，已警告或標示而人仍去冒險時，國家不負損害賠償責任。這個圖書館不是那一項。現行第 3 條有五項，不是三項。
  - 第 2 條第 3 項和第 3 條第 5 項是求償，例子走不到。課綱問的補償，這兩件都不進入。本頁不說松果市要賠，也不引用真實案件。
  items_title: 先分開的四格
  items:
  - title: 執行職務
    text: 公務員於執行職務行使公權力時，因故意或過失不法侵害人民自由或權利者，國家應負損害賠償責任。公務員怠於執行職務，致人民自由或權利遭受損害者亦同。
  - title: 設施有欠缺
    text: 公共設施因設置或管理有欠缺，致人民生命、身體、人身自由或財產受損害者，國家應負損害賠償責任。
  - title: 委託民間
    text: 前項設施委託民間團體或個人管理時，因管理欠缺致人民生命、身體、人身自由或財產受損害者，國家應負損害賠償責任。
  - title: 自然公物
    text: 前二項情形，於開放之山域、水域等自然公物，經管理機關、受委託管理之民間團體或個人已就使用該公物為適當之警告或標示，而人民仍從事冒險或具危險性活動，國家不負損害賠償責任。
  qa:
    question: 國家賠償，條文寫了哪兩種情形？
    answer: 第 2 條第 2 項是公務員執行職務行使公權力時故意或過失不法侵害，怠於執行職務也寫在同一項。第 3 條第 1 項是公共設施設置或管理有欠缺。地磚只對第 1 項。第 3 項的自然公物，這個例子用不到。本頁不說會不會賠。
    source: stcomp-2
  sources:
  - stcomp-2
  - stcomp-3
  - social108
  notes:
  - 流程圖是本站整理。第三步只畫不服決定，逾期不決定寫在第 4 條第 1 項。
  - 訴願法第 14 條還有利害關係人起算、三年、收受日，以及提錯機關。全文在出處。
  - 行政訴訟法第 4 條第 3 項是訴願人以外的利害關係人。這張罰單不用。
  - 國家賠償法第 3 條第 4 項、第 5 項在出處。本頁不說松果市要賠。
