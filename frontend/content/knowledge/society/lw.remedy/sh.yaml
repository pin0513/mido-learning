- 公 Hb-V-2、Hb-V-3 於 2026-11-14 由社會領綱 PDF 第 47 頁（頁腳第 43 頁）依文字座標抽出，並寫進 curriculum-108-codes.yaml。卡片文字與代碼表全文相同。
