- 憲法第 16 條、訴願法第 1 條與第 14 條、行政訴訟法第 4 條、國家賠償法第 2 條與第 3 條，皆於 2026-11-14 從全國法規資料庫單條頁逐字核對。憲法頁首只有公布日期民國 36 年 01 月 01 日，沒有修正日期欄。訴願法修正日期民國 101 年 06 月 27 日。行政訴訟法修正日期民國 111 年 06 月 22 日。國家賠償法修正日期民國 108 年 12 月 18 日。法規整編資料截止日為民國 115 年 11 月 06 日。
- 現行國家賠償法第 3 條有五項。第 3 項是開放的山域、水域等自然公物，已為適當警告或標示而人民仍從事冒險或具危險性活動時，國家不負損害賠償責任。本頁例子用不到這一項，仍把全文放在出處。
- 松果市的罰單和圖書館地磚都是本站虛構。不提任何真實案件。
