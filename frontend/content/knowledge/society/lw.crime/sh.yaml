    第 1 項：「行為人雖非故意，但按其情節應注意，並能注意，而不注意者，為過失。」第 2 項：「行為人對於構成犯罪之事實，雖預見其能發生而確信其不發生者，以過失論。」2026-11-10 單條頁核對。條文中的「但」照原文，不另取名字。
- id: penal-18
  title: 刑法第 18 條
  publisher: 全國法規資料庫
  url: https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=C0000001&flno=18
