- id: penal-13
  title: 刑法第 13 條
  publisher: 全國法規資料庫
  url: https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=C0000001&flno=13
  accessed: '2026-11-10'
  kind: government
  supports: |
    第 1 項：「行為人對於構成犯罪之事實，明知並有意使其發生者，為故意。」第 2 項：「行為人對於構成犯罪之事實，預見其發生而其發生並不違背其本意者，以故意論。」2026-11-10 單條頁核對。
- id: penal-14
  title: 刑法第 14 條
  publisher: 全國法規資料庫
