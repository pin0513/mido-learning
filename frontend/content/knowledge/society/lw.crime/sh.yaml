    第 1 項：「少年法院依調查之結果，認少年觸犯刑罰法律，且有左列情形之一者，應以裁定移送於有管轄權之法院檢察署檢察官︰」一、「犯最輕本刑為五年以上有期徒刑之罪者。」二、「事件繫屬後已滿二十歲者。」第 2 項：「除前項情形外，少年法院依調查之結果，認犯罪情節重大，參酌其品行、性格、經歷等情狀，以受刑事處分為適當者，得以裁定移送於有管轄權之法院檢察署檢察官。」第 3 項：「前二項情形，於少年犯罪時未滿十四歲者，不適用之。」2026-11-10 單條頁核對。第一項句末的冒號照網頁原字。
