- id: juv-3
  title: 少年事件處理法第 3 條
  publisher: 全國法規資料庫
  url: https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=C0010011&flno=3
  accessed: '2026-11-10'
  kind: government
  supports: |
    第 1 項：「下列事件，由少年法院依本法處理之：」一、「少年有觸犯刑罰法律之行為者。」二、「少年有下列情形之一，而認有保障其健全自我成長之必要者：」（一）「無正當理由經常攜帶危險器械。」（二）「有施用毒品或迷幻物品之行為而尚未觸犯刑罰法律。」（三）「有預備犯罪或犯罪未遂而為法所不罰之行為。」第 2 項：「前項第二款所指之保障必要，應依少年之性格及成長環境、經常往來對象、參與團體、出入場所、生活作息、家庭功能、就學或就業等一切情狀而為判斷。」2026-11-10 單條頁核對。正文只用第一款，不把其餘各目編成故事。
