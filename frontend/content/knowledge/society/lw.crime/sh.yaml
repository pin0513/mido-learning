    第 1 項：「未滿十四歲人之行為，不罰。」第 2 項：「十四歲以上未滿十八歲人之行為，得減輕其刑。」第 3 項：「滿八十歲人之行為，得減輕其刑。」2026-11-10 單條頁核對。第 2 項不是不罰。
