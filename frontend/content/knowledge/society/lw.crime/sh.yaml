why:
  heading: 先對上課綱在問什麼
  body:
  - 高中公民把刑罰、罪刑法定、追訴和少年程序分成幾條問句。這一點用一個虛構的小事把問句打開，不進入判決。
  items_title: 課綱原句
  items:
  - title: 罪刑法定
    text: 為什麼罪刑法定主義是刑法的最高原則？有哪些重要內涵？
    code: 公 Bi-V-2
  - title: 成立要件
    text: 國家為什麼要以刑罰的方式處罰人民？犯罪的一般成立要件有哪些？
    code: 公 Bi-V-1
  - title: 推定無罪
    text: 國家如何追訴、處罰犯罪行為？為什麼被告未經審判確定有罪前，應推定其為無罪？為什麼被告與被害人的權利應受到保障？
    code: 公 Bi-V-3
  - title: 少年程序
    text: 為什麼少年的刑事司法程序與成年人不同？
    code: 公 Bk-V-1
  qa:
    question: 這個虛構例子要先問哪四件事？
    answer: 法律有沒有明文規定、故意還是過失、有沒有正當防衛或緊急避難、行為人幾歲走哪種程序。四問先打開，本頁不說甲成立什麼罪。
    source: social108
  sources:
  - social108
how:
  heading: 四問都先打開
  body:
  - 十六歲的甲把乙的耳機放進自己口袋。乙拉住背包帶，甲甩開，乙的手擦到桌角，紅了一小塊。下面四問對這個虛構例子打開。本頁不說甲成立什麼罪（例子是本站整理）。
  - 第一問對刑法第 1 條：「行為之處罰，以行為時之法律有明文規定者為限。」本頁不指出甲碰的是哪一條罪名。第二問對第 13 條和第 14 條：明知並有意使其發生，是故意；應注意、能注意而不注意，是過失。拿耳機是甲有意放進口袋。手擦到桌角，本頁不把它定成故意或過失。
  - 第三問對第 23 條、第 24 條。第 23 條是對現在不法侵害、出於防衛自己或他人權利。第 24 條是為避免自己或他人生命、身體、自由、財產的緊急危難，出於不得已。乙拉背包帶、甲甩開，本頁不說這是防衛或避難。條文裡的「但」照原文留在來源，不另取名字。第四問：甲十六歲，是少年事件處理法第 2 條的少年。未滿十四歲的行為，刑法第 18 條第 1 項不罰。十六歲不是未滿十四歲。
  items_title: 四個問題
  items:
  - title: 有沒有明文
    text: 刑法第 1 條要求行為時的法律有明文規定。沒有先指出罪名，就不能跳到有罪。
  - title: 故意或過失
    text: 第 12 條第 1 項：行為非出於故意或過失者，不罰。第 2 項：過失行為之處罰，以有特別規定者，為限。
  - title: 防衛或避難
    text: 第 23 條是正當防衛的要件，第 24 條是緊急避難的要件。對得上才談得到不罰。本頁不說這個例子對得上。
  - title: 幾歲哪程序
    text: 未滿十四歲，第 18 條第 1 項不罰。十二歲以上十八歲未滿，是少年事件處理法的少年。十六歲走哪一種裁定，本頁不結論。
  checklist_title: 拆開再寫
  checklist:
  - 有沒有明文
  - 故意或過失
  - 防衛或避難
  - 幾歲哪程序
  - 先推定無罪
  figures:
  - crime-flow
  qa:
    question: 「推定無罪」在條文裡怎麼寫？
    answer: 刑事訴訟法第 154 條第 1 項寫：「被告未經審判證明有罪確定前，推定其為無罪。」課綱的問句用字不同，兩句都照各自原文，不併成一句。
    source: cpp-154
  sources:
  - penal-1
  - penal-12
  - cpp-154
what:
  heading: 不是小孩都不用被關
  body:
  - 刑事訴訟法第 154 條第 1 項：「被告未經審判證明有罪確定前，推定其為無罪。」第 2 項：「犯罪事實應依證據認定之，無證據不得認定犯罪事實。」課綱的問句是：「為什麼被告未經審判確定有罪前，應推定其為無罪？」兩句都照各自原文。
  - 為什麼小孩犯錯，不用跟大人一樣被關？不是「小孩都不用被關」。未滿十四歲，刑法第 18 條第 1 項說行為不罰。第 2 項是十四歲以上未滿十八歲得減輕其刑，不是不罰。十二歲以上未滿十八歲走少年事件處理法。第 1 條寫的是保障健全之自我成長、調整成長環境、矯治性格。第 27 條有應移送檢察官的情形，也有得移送的情形；犯罪時未滿十四歲，不適用前二項。十六歲的甲，本頁不說會不會被移送。
  - 課綱另有一條：「法院的事實認定與自由心證主義。」四問先停在條文對照，不教自由心證怎麼用。第 3 條第 1 項第 2 款的各目寫在來源裡。本點的例子只用「觸犯刑罰法律之行為」，不另編那些款的故事。
  items:
  - title: 自由心證
    text: 法院的事實認定與自由心證主義。
    code: 公 Bi-V-4
  qa:
    question: 為什麼小孩犯錯，不用跟大人一樣被關？
    answer: 不是小孩都不用被關。未滿十四歲，刑法第 18 條第 1 項不罰。十二歲以上未滿十八歲走少年事件處理法，程序和第 27 條的移送都跟成人刑事程序不同。十六歲的例子本頁不結論。
    source: penal-18
  notes:
  - 流程圖是本站整理，不是法條格式。
  - 司法院兒童網的口號沒有寫進本頁。
  sources:
  - penal-18
  - juv-1
  - juv-27
  - social108
