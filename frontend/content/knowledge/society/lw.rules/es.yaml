verify_notes:
- 社會 Ac-II-1 已在代碼表。Ac-II-2、Ac-III-1、Ac-III-2 於 2026-11-14 由社會領綱 PDF 第 19 頁（頁腳第 15 頁）依文字座標抽出，並寫進 curriculum-108-codes.yaml。卡片文字與代碼表全文相同。國語文也有 Ac-II-1，所以那一格寫成「社會:Ac-II-1」。同頁的 Ac-III-3、Ac-III-4 讀過，本點不用，沒有收。
- 憲法第 7 條於 2026-11-14 從全國法規資料庫單條頁逐字核對，只放給老師和家長的出處。沿革只有一筆：民國三十六年一月一日公布、十二月二十五日施行。頁首是公布日期民國 36 年 01 月 01 日，沒有修正日期欄。法規整編資料截止日為民國 115 年 11 月 06 日。
- 孩子看得到的文字不放條號、不放條文。兒童法治教育教材這一輪沒有打開可核對的原文，不引用。
- 三年甲班、睡覺前收作業、鉛筆盒，都是本站虛構。不下誰該受什麼處罰。
