why:
  heading: 先問為什麼要有規則
  body:
  - 沒有大家一起守的規則，誰的鉛筆盒、誰可以說話，就說不清。班規和家規也是這樣：先有規則，才知道違反會怎樣（例子是本站整理）。
  - 法律是大家要一起守的規則。課綱寫，它由立法機關制定，功能是保障權利、維護秩序、促進進步。這一頁不講沒有法律就會發生可怕的事，也不講怎麼罰。
  items_title: 課綱原句
  items:
  - title: 權利與責任
    text: 兒童在生活中擁有許多權利（可包括生存權、學習權、表意權、隱私權、身體自主權及不受歧視的權利等）與責任（可包括遵守規範、尊重他人或維護公共利益等）。
    code: 社會:Ac-II-1
  - title: 找誰幫忙
    text: 遇到違反人權的事件，可尋求適當的救助管道。
    code: Ac-II-2
  - title: 憲法裡的權利
    text: 憲法規範人民的基本權利與義務。
    code: Ac-III-1
  - title: 法律誰來訂
    text: 法律是由立法機關所制定，其功能在保障人民權利、維護社會秩序和促進社會進步。
    code: Ac-III-2
  qa:
    question: 為什麼要有法律？如果沒有法律會怎樣？
    answer: 法律由立法機關制定，用來保障權利、維護秩序、促進進步。沒有大家一起守的規則，誰的東西、誰可以說話，就說不清。這一頁不講可怕的故事，也不講處罰。
    source: social108
  sources:
  - social108
how:
  heading: 三種規則分開看
  body:
  - 班規：虛構的三年甲班可以跟老師一起討論「上課不打斷別人說話」。違反了，先提醒，再照班上的約定。家規：睡覺前收作業，是家裡的人一起訂的。違反了，先說清楚，再照家裡的約定。
  - 法律不一樣。課綱寫，法律由立法機關制定。拿走別人的鉛筆盒，先找大人。這一頁不講會被罰什麼。
  checklist_title: 三張卡都要寫
  checklist:
  - 三種誰來訂
  - 違反會怎樣
  - 權利配責任
  - 找誰幫忙
  figures:
  - rules-compare
  qa:
    question: 班規、家規、法律，各由誰訂？
    answer: 班規可以由老師和同學一起討論。家規由家裡的人一起訂。法律由立法機關制定。違反了，班規和家規先提醒、先說清楚；法律先找大人。這一頁不講處罰。
    source: social108
  sources:
  - social108
what:
  heading: 權利和找誰幫忙
  body:
  - 權利和責任是一對。可以在班上說出想法，也要聽別人說完。這是自己的一組例子，不是全班只有這一組。
  - 權利被碰到，先找老師、家長，或學校裡的大人。課綱寫的是尋求適當的救助管道。這一頁不給電話，也不替你決定找哪一個單位。
  qa:
    question: 權利被碰到，可以找誰？
    answer: 先找老師、家長，或學校裡的大人。自己的例子要有一項權利，也要有對上的責任。這一頁不講處罰。
    source: social108
  sources:
  - social108
  notes:
  - 對照圖是本站整理，不是課綱裡的原圖。
  - 給老師和家長的憲法句子收在出處。孩子不用背條號。
  - 這一頁不講誰該受什麼處罰。
