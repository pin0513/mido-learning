why:
  heading: 先對上課綱在問什麼
  body:
  - 國中公民問法治和人治差在哪、憲法和法律命令為什麼有位階、為什麼憲法被稱為人民權利的保障書。這一點用一個虛構班群把問句打開，不進入判決。
  - 班規、家規和法律是上一階。這裡不重講誰訂班規，只接「權利有界線」。
  items_title: 課綱原句
  items:
  - title: 法治與人治
    text: 法治與人治的差異。
    code: 公 Bf-IV-1
  - title: 三種位階
    text: 憲法、法律、命令三者為什麼有位階的關係？
    code: 公 Bf-IV-2
  - title: 權利保障書
    text: 為什麼憲法被稱為「人民權利的保障書」？
    code: 公 Bg-IV-1
  qa:
    question: 有言論自由，就可以想說什麼就說什麼嗎？
    answer: 第 11 條寫人民有言論、講學、著作及出版之自由。第 23 條寫，限制這些自由權利，除了為了條文列出的目的所必要者外，不得以法律限制之。有這項自由，不是想說什麼就說什麼都沒有界線。本頁不說這一次該不該刪。
    source: const-23
  sources:
  - social108
  - const-11
  - const-23
how:
  heading: 四條對上一個情境
  body:
  - 甲把乙沒有公開的作文貼進班群，主張第 11 條：「人民有言論、講學、著作及出版之自由。」乙沒有答應，主張的是第 22 條：「凡人民之其他自由及權利，不妨害社會秩序公共利益者，均受憲法之保障。」第 22 條沒有把「作文」兩個字寫進去。本頁這樣對，不下判決（例子是本站整理）。
  - 第 7 條：「中華民國人民，無分男女、宗教、種族、階級、黨派，在法律上一律平等。」用來問這條約定是不是只用在一個人身上。班群約定不是第 7 條說的法律，也不是第 23 條說的法律。
  - 第 23 條：「以上各條列舉之自由權利，除為防止妨礙他人自由、避免緊急危難、維持社會秩序，或增進公共利益所必要者外，不得以法律限制之。」國家要限制，才走到「以法律」和「所必要」。兩句都留在原句裡。
  items_title: 四條原文
  items:
  - title: 一律平等
    text: 中華民國人民，無分男女、宗教、種族、階級、黨派，在法律上一律平等。
  - title: 言論自由
    text: 人民有言論、講學、著作及出版之自由。
  - title: 其他權利
    text: 凡人民之其他自由及權利，不妨害社會秩序公共利益者，均受憲法之保障。
  - title: 限制的界線
    text: 以上各條列舉之自由權利，除為防止妨礙他人自由、避免緊急危難、維持社會秩序，或增進公共利益所必要者外，不得以法律限制之。
  checklist_title: 對條文再寫
  checklist:
  - 寫出誰衝突
  - 對上第11條
  - 對上第22條
  - 限制要法律
  - 而且要必要
  figures:
  - rights-compare
  qa:
    question: 這個班群裡，誰的哪項權利碰到一起？
    answer: 甲對第 11 條的言論自由。乙對第 22 條所說、憲法沒有在這一條裡點名的其他權利。第 7 條用來問約定有沒有只針對一個人。本頁不說該不該刪文。
    source: const-11
  sources:
  - const-7
  - const-11
  - const-22
  - const-23
what:
  heading: 限制要法律而且必要
  body:
  - 有言論自由，不是想說什麼就說什麼都沒有界線。界線要回到第 23 條：不得以法律限制，除非是為了那四項目的所必要。班群自己的刪文約定，不是這條說的法律。
  - 課綱問憲法為什麼叫人民權利的保障書，也問憲法、法律、命令為什麼有位階。這一頁只把四條放在虛構例子旁邊。位階的全表、命令是什麼，不下結論。
  figures:
  - rights-compare
  qa:
    question: 國家限制權利，條文要求哪兩件事？
    answer: 第 23 條寫「不得以法律限制之」，所以限制要由法律來。同句寫，只有為了防止妨礙他人自由、避免緊急危難、維持社會秩序，或增進公共利益所必要，才除得開。兩件都要在，本頁不說這一次過不過。
    source: const-23
  sources:
  - const-23
  - social108
  notes:
  - 對照圖是本站整理，不是憲法裡的原圖。
  - 班群約定不是第 23 條所說的法律。
  - 本頁不判決。
