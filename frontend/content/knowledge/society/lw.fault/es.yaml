why:
  heading: 弄壞了先分三種
  body:
  - 杯子碎了，三個人看起來都在場。甲是自己推下去。乙是轉身時碰到。丙是地震時人沒有碰。三張卡不一樣（例子是本站整理）。
  - 兒童在生活裡有權利，也有責任。弄壞別人的東西，先問是哪一種，再問道歉、修好、賠償哪一種比較合適。這一頁不下誰該賠。
  items_title: 三張卡
  items:
  - title: 權利與責任
    text: 兒童在生活中擁有許多權利（可包括生存權、學習權、表意權、隱私權、身體自主權及不受歧視的權利等）與責任（可包括遵守規範、尊重他人或維護公共利益等）。
    code: 社會:Ac-II-1
  - title: 故意
    text: 甲看著杯子，伸手推下去，看著它碎。他要它掉下去。
  - title: 不小心
    text: 乙轉身拿書包，手肘碰到杯子。他不是要把它弄碎。
  - title: 沒辦法避免
    text: 地震時丙沒有碰杯子，杯子自己掉下去。這一頁不把他算成弄壞的人。
  qa:
    question: 三張卡要怎麼分？
    answer: 自己推下去、看著它掉，是故意。轉身碰到，是不小心。地震自己掉、人沒碰，是沒辦法避免。
    source: social108
  sources:
  - social108
how:
  heading: 先道歉再選做法
  body:
  - 分完三張卡，先道歉。東西壞了，能修好就修好。修不好，再談賠償。故意通常三樣都要問。
  - 不小心不是「都不用管」。乙不是要弄碎杯子，還是可能要道歉，能修就修。是不是這一次要賠，這一頁不替你判。
  checklist_title: 選做法之前
  checklist:
  - 先分成三種
  - 先道歉
  - 能修就修好
  - 修不好再談
  - 不小心也要問
  figures:
  - fault-compare
  qa:
    question: 道歉、修好、賠償，哪一種比較合適？
    answer: 先道歉。能修好就修好。修不好，再談賠償。故意通常三樣都要問。不小心有時候也要問。沒辦法避免的，先問是不是他弄的。
    source: social108
  sources:
  - social108
what:
  heading: 不小心有時也要管
  body:
  - 不小心和沒辦法避免不要放在同一格。乙碰到了杯子。丙沒有碰，是地震。沒辦法避免的，先問是不是他弄的。
  - 不小心打破別人的東西，有時候也要負責。先道歉，能修就修。不是每一個不小心都一樣。這一頁不下誰該賠。
  qa:
    question: 不小心打破別人的東西，也要賠嗎？
    answer: 有時候要負責。先道歉。能修好就修好，修不好再談賠。不是每個不小心都一樣。是不是這一次要賠，這一頁不替你判。
    source: social108
  sources:
  - social108
  - civil-184
  - penal-12
  notes:
