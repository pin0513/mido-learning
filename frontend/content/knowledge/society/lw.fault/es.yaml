  exercise: 目標：把三張情境卡分成故意、不小心、沒辦法避免，說出道歉、修好、賠償哪一種比較合適，並說出不小心有時候也要負責。　檢核：三張卡都分對；先講道歉，再講修好，修不好才談賠償；被問到不小心時能說有時候也要負責；沒有背條號。
