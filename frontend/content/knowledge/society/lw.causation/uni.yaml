why:
  heading: 兩套問法不要混用
  body:
  - 史丹佛哲學百科的法律因果條目談的是英美侵權與刑法。它寫道：「This minimalist requirement is by far the dominant explicit test for cause in fact in both torts and criminal law.」同一段把這個測驗叫做 sine qua non，也叫做 but-for；頁上這兩個名稱各自有引號。同段也說這測驗「is also sometimes called the necessary condition test」。這不是民法或刑法的條文（說明是本站整理）。
  - 臺灣最高法院 76 年台上字第 192 號判例的要旨寫：「刑法上之過失，其過失行為與結果間，在客觀上有相當因果關係始得成立。所謂相當因果關係，係指依經驗法則，綜合行為當時所存在之一切事實，為客觀之事後審查，認為在一般情形下，有此環境、有此行為之同一條件，均可發生同一之結果者，則該條件即為發生結果之相當條件，行為與結果即有相當之因果關係。」問的是一般情形下是不是都會發生，不是只問拿掉之後這一次還會不會發生。
  qa:
    question: 假如沒有，和相當因果，問的是同一件事嗎？
    answer: 不是。假如沒有問的是拿掉這個條件，這一次的結果還在不在。要旨裡的相當因果問的是：一般情形下，同樣的條件是不是都可以發生同樣的結果。英美百科裡的 but-for 也不能直接當成臺灣條文。
    source: precedent-192
  items_title: 先標出你在用哪一套
  items:
  - title: 假如沒有
    text: 拿掉它，這一次還會不會。
  - title: 相當因果
    text: 一般情形下是不是都會發生。
  - title: 英美 but-for
    text: 百科說的是英美法，不是這裡的條文。
  - title: 先不下結論
    text: 條文不同，問題就不同。
  sources:
  - precedent-192
  - sep-causation-law
how:
  heading: 用條文分題，不下判
  body:
  - 虛構例子：甲沒把狗繫繩，狗衝向路人乙，乙閃避時跌倒，手腕挫傷，乙當時在看手機，丙只是路過。民法第 190 條第 1 項：「動物加損害於他人者，由其占有人負損害賠償責任。但依動物之種類及性質已為相當注意之管束，或縱為相當注意之管束而仍不免發生損害者，不在此限。」第 217 條第 1 項：「損害之發生或擴大，被害人與有過失者，法院得減輕賠償金額，或免除之。」這兩條各問一件事：占有人的管束，以及法院得不得減輕。本頁不說甲要賠多少，也不說乙看手機就當然免責。
  - 刑法第 15 條第 1 項：「對於犯罪結果之發生，法律上有防止之義務，能防止而不防止者，與因積極行為發生結果者同。」第 2 項：「因自己行為致有發生犯罪結果之危險者，負防止其發生之義務。」丙若沒有這種義務，不能只因為他路過沒有出手，就把他寫成和第 1 項相同。第 276 條：「因過失致人於死者，處五年以下有期徒刑、拘役或五十萬元以下罰金。」這一條要有死亡結果。本例只有挫傷，不套這條下結論，只用它看見結果不同、條文就不同。
  - 百科用兩場各自就足夠的火說明 but-for 的困難，並寫下：「So on the but-for test, neither was the cause!」民法第 185 條第 1 項則是另一條規範：「數人共同不法侵害他人之權利者，連帶負損害賠償責任。不能知其中孰為加害人者亦同。」第 184 條第 1 項是一般規定：「因故意或過失，不法侵害他人之權利者，負損害賠償責任。故意以背於善良風俗之方法，加損害於他人者亦同。」若受傷的人是未成年人，要另外看第 187 條，本例沒有把乙寫成未成年人，所以不套用。以上都只是把條文放在例子旁邊，不是判決。
  items_title: 這個例子可以對上的問題
  items:
  - title: 誰在管束
    example: 狗是誰占有的？
    text: 對上民法第 190 條，先不下判。
  - title: 被害人自己
    example: 乙當時在看手機。
    text: 對上第 217 條，法院得減輕或免除。
  - title: 路過的人
    example: 丙沒有飼養這隻狗。
    text: 對上刑法第 15 條的義務從哪來。
  - title: 結果是什麼
    example: 本例是挫傷，不是死亡。
    text: 第 276 條要有死亡結果。
  checklist_title: 引用之前
  checklist:
  - 寫出條號
  - 標明哪一套問法
  - 最後寫不下結論
