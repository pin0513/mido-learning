- id: precedent-192
  title: 最高法院 76 年台上字第 192 號判例
  publisher: 全國法規資料庫（裁判字號 76年台上字第192號，民國 76 年 1 月 16 日）
  url: https://law.moj.gov.tw/LawClass/ExContent.aspx?JC=B&JCASE=%E5%8F%B0%E4%B8%8A&JNO=192&JNUM=001&JYEAR=76&ty=J
  accessed: '2026-11-10'
  kind: government
  supports: |
    要旨：「刑法上之過失，其過失行為與結果間，在客觀上有相當因果關係始得成立。所謂相當因果關係，係指依經驗法則，綜合行為當時所存在之一切事實，為客觀之事後審查，認為在一般情形下，有此環境、有此行為之同一條件，均可發生同一之結果者，則該條件即為發生結果之相當條件，行為與結果即有相當之因果關係。反之，若在一般情形下，有此同一條件存在，而依客觀之審查，認為不必皆發生此結果者，則該條件與結果不相當，不過為偶然之事實而已，其行為與結果間即無相當因果關係。」編註寫明本則判例依據法院組織法第 57 條之 1 第 2 項，其效力與未經選編為判例之最高法院裁判相同。本點不引用該案事實。
- id: sep-causation-law
  title: Causation in the Law（Stanford Encyclopedia of Philosophy）
  publisher: Michael Moore（Stanford Encyclopedia of Philosophy；2019 年 10 月 3 日首次發表，2024 年 2 月 4 日實質修訂）
  url: https://plato.stanford.edu/entries/causation-law/
  accessed: '2026-11-10'
  kind: reference
  supports: |
    第 2.2 節讀到：「This minimalist requirement is by far the dominant explicit test for cause in fact in both torts and criminal law.」下一句把這個測驗叫做 sine qua non，也叫做 but-for；頁上這兩個名稱各自有引號，所以不整句放進引號。同段：「This test is also sometimes called the necessary condition test」。過度決定的兩火例子讀到：「So on the but-for test, neither was the cause!」本點把這些句子標成英美法的整理，不當成臺灣條文。含撇號的句子沒有引用。
