  - civil-185
  - civil-184
  - civil-187
  - sep-causation-law
what:
  heading: 規範選哪條，問題就不同
  body:
  - 要旨後段寫：「反之，若在一般情形下，有此同一條件存在，而依客觀之審查，認為不必皆發生此結果者，則該條件與結果不相當，不過為偶然之事實而已，其行為與結果間即無相當因果關係。」這是「不必皆發生」就不相當，和「拿掉之後這一次還在不在」不是同一題。全國法規資料庫的編註寫，本則判例依法院組織法第 57 條之 1 第 2 項，效力與未經選編為判例之最高法院裁判相同。
  - 所以檢核時要先寫：我現在用的是假如沒有、相當因果，還是某一條的構成要件。民法第 187 條第 1 項把識別能力寫進法定代理人的責任：「無行為能力人或限制行為能力人，不法侵害他人之權利者，以行為時有識別能力為限，與其法定代理人連帶負損害賠償責任。」條文在，不代表這個虛構例子適用它。結論取決於法院適用哪一條規範。本頁不進入判決。
  figures:
  - causation-compare
  notes:
  - 圖是本站整理，用來對照兩種問法，不是法院的裁判格式。
  - 第 187 條全文在來源裡。本例的乙沒有被寫成未成年人，正文不套用該條做結論。
  sources:
  - precedent-192
  - civil-187
  - sep-causation-law
