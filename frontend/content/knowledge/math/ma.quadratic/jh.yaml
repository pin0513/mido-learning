why:
  heading: 不是直線的變化
  body:
  - 數學課程手冊說，從實際觀測的數據可以理解拋擲物體時，「因為受到地心引力的影響」，物體與地面的距離是時間的二次函數。
  - 九年級要理解二次函數的意義並描繪它的圖形；手冊說描點畫圖後，要能「察覺圖形的對稱軸及最高點或最低點。必要時，可透過應用軟體繪圖展示。」
  items_title: 數學領綱的學習重點
  items:
  - title: 二次函數的圖形
    text: 數學 f-IV-2：理解二次函數的意義，並能描繪二次函數的圖形。
    code: f-IV-2
  - title: 二次函數的意義
    text: 數學 F-9-1：二次函數的意義：二次函數的意義；具體情境中列出兩量的二次函數關係。
    code: F-9-1
  checklist_title: 開始前先確認
  checklist:
  - 會描坐標點
  - 會算負數平方
  notes:
  - 數學學習內容代碼中間的數字是年級，學習表現代碼中間的羅馬數字是學習階段（II 是國小中年級，IV 是國中）。
  sources:
  - math108
  - math-handbook
how:
  heading: 描點畫出曲線
  body:
  - y ＝ x²：x 取 −3、−2、−1、0、1、2、3，y 是 9、4、1、0、1、4、9。描點後用平滑曲線連起來，開口向上、左右對稱，最低點是 (0, 0)。y ＝ −x² 的每個 y 都變成相反數，開口向下，最高點是 (0, 0)。
  - 生活中的二次函數：邊長 x 公分的正方形，面積 y ＝ x² 平方公分。拋出去的球，高度是時間的二次函數（依課程手冊）；高度先升後降，最高的地方就是圖形的最高點（本站整理）。
  qa:
    question: y ＝ x² 的圖形為什麼左右對稱？
    answer: 因為 x 和 −x 的平方一樣，例如 (−2)² ＝ 4 ＝ 2²，所以 x ＝ 2 和 x ＝ −2 的點一樣高，整個圖形對稱於 y 軸（說明是本站整理）。課程手冊說描點畫圖時，要能「察覺圖形的對稱軸及最高點或最低點」。
    source: math-handbook
  items_title: 畫二次函數
  items:
  - title: 列表
    text: x 取 −3 到 3，算出 y。
  - title: 描點連線
    text: 用平滑曲線，不要連成折線。
  - title: 看開口
    text: y ＝ x² 向上，y ＝ −x² 向下。
  - title: 找對稱和頂點
    text: 對稱於 y 軸，頂點 (0, 0)。
  checklist_title: 每次畫完勾一下
  checklist:
  - 表格算對
  - 曲線平滑
  - 說出開口
  - 找到頂點
  activity_figure: quadratic-flow
  sources:
  - math-handbook
what:
  heading: 畫得出，也說得出
  body:
  - 學完後，孩子能用描點畫出 y ＝ x² 和 y ＝ −x² 的圖形，說出開口方向、左右對稱和最低點或最高點，並舉出生活中的二次函數。
  items_title: 學完能做到
  items:
  - title: 描點畫圖
    text: 畫出兩條曲線。
  - title: 說出特徵
    text: 開口、對稱、頂點。
  - title: 舉出例子
    text: 正方形面積、拋出的球。
  checklist_title: 家長檢核
  checklist:
  - 圖畫對
  - 特徵說對
  - 例子合理
  figures:
  - quadratic-compare
  notes:
  - 本頁的表格取值是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - math-handbook
  - genai-student
