idea: 有些變化不是直線，而是先升後降的曲線，例如丟出去的球。這條曲線叫拋物線。
guiding_questions:
  - 為什麼球不會沿著直線飛？
scenario: 拍下投籃的影片，在坐標紙上描出球的軌跡，找出最高點。
