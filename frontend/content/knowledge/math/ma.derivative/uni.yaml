why:
  heading: 變化率幫你找最好
  body:
  - OpenStax 說切線斜率和瞬時速度「each measures the instantaneous rate of change of a function」，兩者都靠導數算。知道函數在每一點增加還是減少，就能找出它在哪裡最大或最小。
  - 書中也說「One common application of calculus is calculating the minimum or maximum value of a function.」高中數學甲、乙的 12 年級選修都列了「基本的最佳化問題」，數學乙還寫到「導數的邊際意涵」；大學把它用到有限制條件的設計問題。
  items_title: 導數的意思和用途
  items:
  - title: 瞬間變化率
    text: 某一刻變化得多快。
  - title: 切線斜率
    text: 曲線在一點的傾斜程度。
  - title: 找極值
    text: 導數為 0 的點是候選。
  checklist_title: 開始前先確認
  checklist:
  - 會求多項式導數
  - 會用圓面積公式
  sources:
  - os-deriv
  - os-maxmin
  - os-opt
  - math108
how:
  heading: 寫函數、求導、檢查
  body:
  - 寫函數：表面積 S ＝ 2πr² ＋ 2πrh，容量 πr²h ＝ 350，所以 h ＝ 350 ÷ (πr²)，S(r) ＝ 2πr² ＋ 700 ÷ r，r ＞ 0。求導：S′(r) ＝ 4πr − 700 ÷ r²，令它等於 0 得 r³ ＝ 175 ÷ π，r ≈ 3.82 公分，h ≈ 7.64 公分，剛好 h ＝ 2r（說明是本站整理）。
  - 檢查：r ＝ 3 時 S ≈ 289.9，r ≈ 3.82 時 S ≈ 274.9，r ＝ 5 時 S ≈ 297.1 平方公分；r 很小或很大時 S 都會變很大，所以這個點是最小。OpenStax 的解題步驟第一步是「Determine which quantity is to be maximized or minimized」，也要依實際問題定出變數的範圍。
  - 換假設：如果上下蓋每平方公分的成本是側面的 k 倍，成本最小時 h ＝ 2kr；k ＝ 2 時 r ≈ 3.03 公分、h ≈ 12.12 公分，罐子變成又細又高。最佳解是對某個目標和某些假設而言的（說明是本站整理）。
  qa:
    question: 數學上的最佳解，換了假設還會是同一個嗎？
    answer: 不一定。上下蓋和側面同材料時，最省料的罐子 h ＝ 2r；上下蓋成本是側面的 2 倍時，最省錢的罐子變成 h ＝ 4r（數字是示意，說明是本站整理）。OpenStax 的最佳化步驟第一步就是確定要最大化或最小化的量；目標或假設一換，要算的函數就不同，答案也可能不同（本站整理）。
    source: os-opt
  items_title: 三步做
  items:
  - title: 寫成一個變數
    text: 用容量條件消去 h。
  - title: 令導數為 0
    text: 解出候選的半徑。
  - title: 比較與檢查
    text: 代值比較，再看假設。
  checklist_title: 每次做完勾一下
  checklist:
  - 寫出 S(r)
  - 解出 r
  - 代 3 和 5 比較
  - 改成本再算
  activity_figure: derivative-flow
  sources:
  - os-opt
what:
  heading: 算出最佳，也說出前提
  body:
  - 學完後，自己能把有條件的設計問題寫成一個變數的函數，用導數找出最佳解並驗證，還能說出這個最佳解依賴哪些假設。
  items_title: 學完能做到
  items:
  - title: 建立目標函數
    text: 用條件消去多的變數。
  - title: 求出最佳解
    text: 導數為 0，再驗證。
  - title: 說出前提
    text: 換了假設，答案可能不同。
  checklist_title: 自我檢核
  checklist:
  - 函數寫對
  - 最佳解算對
  - 說出假設
  figures:
  - derivative-compare
  notes:
  - 本頁的容量、尺寸和成本比例都是示意。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，算式和數字要自己驗算；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - os-opt
  - genai-student
