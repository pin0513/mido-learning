idea: 導數是瞬間變化率，也是切線斜率。函數在可微分的地方取到局部最大或最小時，導數是 0，所以最佳化常從找導數為 0 的點開始，再比較端點，最後回頭檢查假設。
guiding_questions:
- 數學上的最佳解，換了假設還會是同一個嗎？
- 裝 350 毫升的圓柱罐，半徑多少最省料？
scenario: 設計一個裝 350 毫升（350 立方公分）的圓柱罐，假設上下蓋和側面用同樣的材料，找出表面積最小的半徑和高；再改成上下蓋比較貴，看最佳解怎麼變（數字是示意，本站整理）。
formats:
  slides: []
  exercise: 目標：把圓柱罐的表面積寫成半徑的函數，用導數求出最省料的半徑和高，並說明改變成本假設後最佳解怎麼變（數字是示意）。　檢核：不看本頁，自己算出 r ≈ 3.82 公分、h ≈ 7.64 公分（h ＝ 2r），驗算 r ＝ 3 和 r ＝ 5 的表面積都比較大，並說出上下蓋貴 2 倍時最佳解變成 h ＝ 4r；三件事都對（數字是示意）。
