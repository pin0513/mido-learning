est_time:
  school: 高中十、十二年級數學課
  source: math108
why:
  heading: 從一段到一瞬間
  body:
  - 十年級學三次函數的圖形特徵時，數學領綱寫到圖形「局部（local）則近似一條直線」；課程手冊說「多項式的泰勒形式，多項式函數的局部圖形，對三次函數的初步探究，都是微分的前置經驗，宜善加利用。」
  - 12 年級的加深加廣選修學微分，手冊列的目標是「能理解變化率與導數之間的關係，以及割線與切線的關係。」
  items_title: 數學領綱的學習重點
  items:
  - title: 極限與導數
    text: 數學 f-V-6：認識極限，理解微分與導數的意義，並能用以溝通和推論。
    code: f-V-6
  - title: 局部近似直線
    text: 數學 F-10-2：三次函數的圖形特徵：二次、三次函數圖形的對稱性，兩者圖形的大域（global）特徵由最高次項決定，而局部（local）則近似一條直線。
    code: F-10-2
  checklist_title: 開始前先確認
  checklist:
  - 會算斜率
  - 會用計算機
  notes:
  - 數學學習內容代碼中間的數字是年級（10 是高一；11A、11B 是十一年級的 A、B 兩類），學習表現代碼中間的 V 是第五學習階段（普通型高中）。
  sources:
  - math108
  - math-handbook
how:
  heading: 把間隔一直縮小
  body:
  - 玩具車滑下斜坡，假設位置 s ＝ t²（公尺，t 是秒；示意模型）。從 t ＝ 1 到 t ＝ 2，平均速度是 (4 − 1) ÷ (2 − 1) ＝ 3 公尺／秒，這是圖上兩點連線（割線）的斜率。
  - 用計算機把間隔縮小：1 到 1.1 是 (1.21 − 1) ÷ 0.1 ＝ 2.1；1 到 1.01 是 2.01；1 到 1.001 是 2.001，越來越接近 2，2 就是 t ＝ 1 那一瞬間的速度。用代數看：(1 ＋ h)² − 1 ＝ 2h ＋ h²，除以 h 得 2 ＋ h，h 越小越接近 2；而 t² ＝ 1 ＋ 2(t − 1) ＋ (t − 1)²，所以在 t ＝ 1 附近，圖形近似斜率 2 的直線（說明是本站整理）。
  qa:
    question: 時間間隔越縮越小，平均速度會越來越接近哪個數？
    answer: 以本頁的 s ＝ t² 來說，間隔是 1、0.1、0.01、0.001 時，平均速度是 3、2.1、2.01、2.001，越來越接近 2；這個數就是 t ＝ 1 的瞬間速度（數字是示意）。課程手冊建議「可適當運用計算機，透過逐次計算理解極限的意義。」
    source: math-handbook
  items_title: 三步逼近
  items:
  - title: 算平均變化率
    text: 改變量除以經過的時間。
  - title: 把間隔縮小
    text: 用計算機逐次算。
  - title: 看出靠近的數
    text: 就是瞬間變化率。
  checklist_title: 每次做完勾一下
  checklist:
  - 算出 3
  - 算出 2.1
  - 算出 2.01
  - 說出接近 2
  activity_figure: rate-flow
  sources:
  - math-handbook
what:
  heading: 看見瞬間的變化
  body:
  - 學完後，孩子能算出一段時間的平均變化率，用計算機把間隔縮小，看出平均變化率接近的數就是瞬間變化率，並說出它是曲線在那一點附近近似直線的斜率。
  items_title: 學完能做到
  items:
  - title: 算平均變化率
    text: 兩點連線的斜率。
  - title: 逐次逼近
    text: 間隔越小越接近。
  - title: 說出瞬間變化率
    text: 附近近似直線的斜率。
  checklist_title: 家長檢核
  checklist:
  - 平均算對
  - 逼近算對
  - 說出意思
  figures:
  - rate-compare
  notes:
  - 本頁的 s ＝ t² 和數字是示意模型。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - math-handbook
  - genai-student
