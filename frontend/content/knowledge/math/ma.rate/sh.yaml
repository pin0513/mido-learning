idea: 平均速度是「總距離 ÷ 總時間」。把時間間隔縮得越來越短，就逼近某一瞬間的速度：這是微積分的入口。
guiding_questions:
  - 區間測速和定點測速，量到的是同一個速度嗎？
scenario: 用手機拍下推車滑下斜坡，量不同時間間隔的平均速度，觀察間隔變小時數值往哪裡靠近。
