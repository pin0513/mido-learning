idea: 平均變化率是改變量除以經過的時間，也就是圖上兩點連線（割線）的斜率。把時間間隔縮得越來越短，平均變化率會越來越接近一個數，那就是那一瞬間的變化率：這是微分的入口。
guiding_questions:
- 時間間隔越縮越小，平均速度會越來越接近哪個數？
scenario: 玩具車從斜坡滑下，假設位置 s ＝ t²（公尺，t 是秒；本站整理的示意模型），用計算機算 t ＝ 1 到 2、1 到 1.1、1 到 1.01 的平均速度，看數值往哪裡靠近。
formats:
  slides: []
  exercise: 目標：用計算機算出越來越短的時間間隔的平均變化率，看出它們越來越接近一個數，並說出這個數就是那一瞬間的變化率，也是圖形在那一點附近近似直線的斜率（數字是示意）。　檢核：孩子用本頁的 s ＝ t²，算出 t ＝ 1 到 1.1、1 到 1.01 的平均速度 2.1、2.01，說出它們接近 2，並用 (1 ＋ h)² ＝ 1 ＋ 2h ＋ h² 說明為什麼是 2；三件事都對（數字是示意）。
