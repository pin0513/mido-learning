why:
  heading: 把對稱說精確
  body:
  - Judson 的教科書這樣定義：「A symmetry of a geometric figure is a rearrangement of the figure preserving the arrangement of its sides and vertices as well as its distances and angles.」有了定義，對稱就能數、能算，也能分類。
  - 國中已經學過「線對稱的基本圖形：等腰三角形；正方形；菱形；箏形；正多邊形。」大學把旋轉和翻轉放在一起，用群描述一個圖形所有的對稱（說明是本站整理）。
  items_title: 對稱的三個層次
  items:
  - title: 一個對稱
    text: 轉或翻之後和原來重合。
  - title: 對稱群
    text: 所有對稱，可以接連做。
  - title: 花紋分類
    text: 依對稱把重複花紋分組。
  checklist_title: 開始前先確認
  checklist:
  - 懂線對稱
  - 懂旋轉角度
  sources:
  - aata-sym
  - math108
how:
  heading: 剪、轉、翻、數
  body:
  - 數對稱：正方形可以轉 0、90、180、270 度，共 4 種；也可以沿兩條對角線、兩條對邊中點的連線翻，共 4 種，合起來 8 種。Judson 的書也說正方形的剛體運動群「consists of eight elements」。
  - 接連做：先轉 90 度再轉 90 度等於轉 180 度；沿同一條線翻兩次等於不動。任兩個對稱接連做還是這 8 種之一，所以它們形成一個群，叫做二面體群 D₄。轉 90 度也可以用 ma.linalg@uni 的旋轉矩陣表示（說明是本站整理）。
  - 重複花紋：Judson 的書說「Wallpaper patterns are simply repeating patterns in the plane」，並列出「The 17 wallpaper groups」；書中的定理說壁紙群的點群只能是 n ＝ 1、2、3、4、6 的旋轉群或二面體群，所以重複花紋不會有五重旋轉對稱。
  qa:
    question: 一個正方形有幾種對稱？
    answer: 8 種：轉 0、90、180、270 度 4 種，沿兩條對角線和兩條對邊中點連線翻 4 種。Judson 的書說正方形的剛體運動群「consists of eight elements」。
    source: aata-dih
  items_title: 三步做
  items:
  - title: 標號
    text: 四個角寫上 1 到 4。
  - title: 找轉法和翻法
    text: 每種都要和原位置重合。
  - title: 試接連做
    text: 看結果是哪一種。
  checklist_title: 每次做完勾一下
  checklist:
  - 找到 4 種轉法
  - 找到 4 種翻法
  - 試 2 次接連做
  - 找一種花紋
