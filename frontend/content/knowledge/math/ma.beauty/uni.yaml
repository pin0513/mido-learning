what:
  heading: 看見結構
  body:
  - 學完後，自己能用定義判斷一個動作是不是對稱，列出正方形的 8 種對稱並說明它們形成群，也能說出重複花紋的旋轉對稱有哪些限制。
  items_title: 學完能做到
  items:
  - title: 列出對稱
    text: 正方形的 8 種。
  - title: 說明群
    text: 接連做還在裡面。
  - title: 說出限制
    text: 沒有五重旋轉的壁紙。
  checklist_title: 自我檢核
  checklist:
  - 8 種列對
  - 接連做說對
  - 說出限制
  figures:
  - beauty-compare
  notes:
  - 剪紙請用安全剪刀；觀察花紋只看、不拆。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，算式和數字要自己驗算；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - aata-wall
  - genai-student
