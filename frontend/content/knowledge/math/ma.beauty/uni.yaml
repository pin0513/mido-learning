idea: 對稱可以精確描述：把圖形轉一轉或翻一翻，還和原來重合，這個動作就是一種對稱。一個圖形的所有對稱可以接連做、像數一樣運算，形成群；重複的花紋也能依它的對稱分類。
guiding_questions:
- 一個正方形有幾種對稱？
- 牆上重複的磁磚花紋，能有五重旋轉對稱嗎？
scenario: 用安全剪刀剪一張正方形紙，四個角標上 1、2、3、4，找出所有讓它和原來位置重合的轉法和翻法；再看看家裡的磁磚、布料或包裝紙，找出花紋有哪些對稱（本站整理）。
