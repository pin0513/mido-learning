idea: 隨機變數把不確定的結果寫成數字，機率分布說明每個結果有多可能。期望值是長期的平均，卻看不出風險；重複模擬可以估計機率，試得越多次，相對次數越接近理論機率。
guiding_questions:
- 八成會準時和一定會準時，對決策有什麼不同？
- 平均 4.5 天就做得完，期限 5 天就一定來得及嗎？
scenario: 一個小專案有兩項工作接著做：A 要 2 或 3 天（丟銅板決定），B 要 1、2 或 3 天（丟骰子：1–2 點 1 天、3–4 點 2 天、5–6 點 3 天），期限 5 天。先算準時的機率和平均天數，再丟 30 次模擬比較（數字是示意，本站整理）。
formats:
  slides: []
  exercise: 目標：算出本頁小專案準時完成的機率和期望天數，說明平均比期限短為什麼還會遲到，並用丟銅板和骰子的模擬檢查結果（數字是示意）。　檢核：不看本頁，自己算出準時的機率是 5/6、期望值是 4.5 天、遲到機率是 1/6，並說出 30 次模擬的結果為什麼不一定剛好是 5/6；三件事都對（數字是示意）。
