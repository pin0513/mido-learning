updated: '2026-10-29'
goal: 算出本頁小專案準時完成的機率和期望天數，說明平均比期限短為什麼還會遲到，並用丟銅板和骰子的模擬檢查結果（數字是示意）。
review: 不看本頁，自己算出準時的機率是 5/6、期望值是 4.5 天、遲到機率是 1/6，並說出 30 次模擬的結果為什麼不一定剛好是 5/6；三件事都對（數字是示意）。
why:
  heading: 不確定也能算
  body:
  - OpenStax 說機率「does not describe the short-term results of an experiment. It gives information about what can be expected in the long term.」做決策時，要知道的不只是平均，還有出錯的機會有多大。
  - 高中數學甲、乙的 12 年級選修都列了「離散型隨機變數：期望值、變異數與標準差，獨立性，伯努力試驗與重複試驗。」大學再把它用到更複雜的問題，例如本頁把每項工作的時間當成隨機變數，算出整個計畫準時的機率（本站整理）。
  items_title: 三個工具
  items:
  - title: 隨機變數
    text: 把結果寫成數字，例如天數。
  - title: 機率分布
    text: 每個值的機率，合起來是 1。
  - title: 期望值
    text: 長期下來的平均。
  checklist_title: 開始前先確認
  checklist:
  - 會算獨立事件
  - 會算期望值
  sources:
  - os-mean
  - math108
how:
  heading: 先算，再模擬
  body:
  - 算機率：總天數 T ＝ A ＋ B，假設 A 和 B 互相獨立。A ＝ 2 時，B 不管幾天都不超過 5 天；A ＝ 3 時，B 要 1 或 2 天才準時，機率 2/3。準時的機率 ＝ 1/2 × 1 ＋ 1/2 × 2/3 ＝ 5/6 ≈ 83%。OpenStax 的機率分布要符合「Each probability is between zero and one, inclusive.」和「The sum of the probabilities is one.」（說明是本站整理）。
  - 看平均：E(A) ＝ 2.5、E(B) ＝ 2，E(T) ＝ 4.5 天，比期限短；但 A ＝ 3 且 B ＝ 3 時要 6 天，遲到機率是 1/2 × 1/3 ＝ 1/6。只看平均會漏掉風險；期限放寬到 6 天，準時的機率就是 1（說明是本站整理）。
  - 模擬：丟一次銅板（正面 2 天、反面 3 天）和一次骰子算一次專案，做 30 次，數準時幾次再除以 30。OpenStax 的大數法則說「as the number of repetitions of an experiment is increased, the relative frequency obtained in the experiment tends to become closer and closer to the theoretical probability」，30 次的結果離 5/6 有點遠是正常的。
  qa:
    question: 八成會準時和一定會準時，對決策有什麼不同？
    answer: 5/6 會準時，表示大約每 6 次有 1 次遲到；要不要多留 1 天緩衝，看遲到的代價有多大。本頁的例子把期限放寬到 6 天，準時的機率就是 1（數字是示意，說明是本站整理）。OpenStax 也提醒，機率講的是長期，「probability does not describe the short-term results of an experiment」。
    source: os-mean
  items_title: 三步做
  items:
  - title: 列出結果
    text: A、B 的天數和機率。
  - title: 算機率和平均
    text: 準時機率、期望天數。
  - title: 模擬比較
    text: 丟 30 次，和理論比。
  checklist_title: 每次做完勾一下
  checklist:
  - 算出 5/6
  - 算出 4.5 天
  - 丟滿 30 次
  - 比較模擬結果
  activity_figure: probmodel-flow
  sources:
  - os-pdf
  - os-lln
what:
  heading: 用機率說明風險
  body:
  - 學完後，自己能把不確定的時間寫成隨機變數，算出準時的機率和期望值，用模擬檢查結果，並向別人說明平均和風險的差別。
  items_title: 學完能做到
  items:
  - title: 算出準時機率
    text: 用獨立事件相乘相加。
  - title: 分辨平均和風險
    text: 平均短，仍可能遲到。
  - title: 用模擬檢查
    text: 次數越多越接近。
  checklist_title: 自我檢核
  checklist:
  - 機率算對
  - 期望值算對
  - 說出模擬差距
  figures:
  - probmodel-compare
  notes:
  - 本頁的工作天數和期限都是示意；銅板和骰子只是用來產生隨機結果。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，算式和數字要自己驗算；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - os-lln
  - genai-student
