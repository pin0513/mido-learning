  exercise: 目標：假設銅板公正，用組合數算出丟 10 次出現 9 次以上正面的機率 11/1,024（約 1%），並說出機率很小代表什麼、不代表什麼（數字是示意）。　檢核：孩子算出公正銅板丟 10 次的結果共 1,024 種、其中 9 次以上正面有 10 ＋ 1 ＝ 11 種，再算出機率約 1%，並說出這只讓說法值得懷疑、不是證明它錯；三件事都對（數字是示意）。
