est_time:
  school: 高中十、十二年級數學課
  source: math108
why:
  heading: 這個說法合理嗎？
  body:
  - 數學領綱要高中生「能以機率檢核不確定之假設或推論的合理性。」12 年級選修的二項分布條目也備註「應用於事件發生機率的合理性檢定。」
  - 課程手冊說，這裡的假設檢定「並不需要做到統計課程中的第一型、第二型錯誤」，要讓學生「能直觀性的瞭解即可」。
  items_title: 數學領綱的學習重點
  items:
  - title: 檢核假設
    text: 數學 d-V-5：能以機率檢核不確定之假設或推論的合理性。
    code: d-V-5
  - title: 以機率量化
    text: 數學 d-V-3：理解事件的不確定性，並能以機率將之量化。理解機率的性質並能操作其運算，能用以溝通和推論。
    code: d-V-3
  - title: 有系統的計數
    text: 數學 D-10-3：有系統的計數：有系統的窮舉，樹狀圖，加法原理，乘法原理，取捨原理。直線排列與組合。
    code: D-10-3
  - title: 古典機率
    text: 數學 D-10-4：複合事件的古典機率：樣本空間與事件，複合事件的古典機率性質，期望值。
    code: D-10-4
  checklist_title: 開始前先確認
  checklist:
  - 會算組合數
  - 會算古典機率
  notes:
  - 數學學習內容代碼中間的數字是年級（10 是高一；11A、11B 是十一年級的 A、B 兩類），學習表現代碼中間的 V 是第五學習階段（普通型高中）。
  sources:
  - math108
  - math-handbook
how:
  heading: 先假設，再算機率
  body:
  - 假設銅板公正，丟 10 次的結果（每次正或反）共有 2¹⁰ ＝ 1,024 種，每一種機會均等。剛好 9 次正面的有 C(10, 9) ＝ 10 種，10 次都是正面的有 1 種，所以 9 次以上正面的機率是 11/1,024，約 1%（數字是示意）。
  - 判斷：如果銅板真的公正，這麼多正面大約 93 次裡才出現 1 次，所以銅板公正的說法值得懷疑，可以再多丟幾次收集資料。但機率小不等於不可能，這只是檢核說法合不合理，不是證明銅板一定不公正（說明是本站整理）。
  qa:
    question: 丟 10 次出現 9 次正面，這枚銅板還算公正嗎？
    answer: 值得懷疑，但不能說它一定不公正。公正銅板丟 10 次出現 9 次以上正面的機率是 11/1,024，約 1%，很少見；要更有把握，就要丟更多次（說明是本站整理）。課程手冊提醒，用古典機率的前提是「能窮舉樣本空間的元素，且每個樣本點發生的機會均等。」
    source: math-handbook
  items_title: 檢核三步
  items:
  - title: 先假設
    text: 銅板公正，正反機會相等。
  - title: 算機率
    text: 用組合數數出 11 種。
  - title: 下判斷
    text: 機率很小就值得懷疑。
  checklist_title: 每次做完勾一下
  checklist:
  - 數出 1,024 種
  - 數出 11 種
  - 算出約 1%
  - 說出不代表什麼
  activity_figure: stats-flow
  sources:
  - math-handbook
what:
  heading: 用機率檢核說法
  body:
  - 學完後，孩子能先假設一個說法成立，用組合數和古典機率算出出現眼前結果或更極端結果的機率，判斷說法合不合理，也說得出機率很小不等於證明說法錯。
  items_title: 學完能做到
  items:
  - title: 寫出假設
    text: 先假設說法是對的。
  - title: 算出機率
    text: 用組合數和古典機率。
  - title: 說出結論
    text: 值得懷疑，但不是證明。
  checklist_title: 家長檢核
  checklist:
  - 假設寫對
  - 機率算對
  - 結論不誇大
  figures:
  - stats-compare
  notes:
  - 本頁丟銅板的次數和結果是示意。
  - 高中數學課綱沒有抽樣與信賴區間，本頁不教民調的誤差範圍。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - math-handbook
  - genai-student
