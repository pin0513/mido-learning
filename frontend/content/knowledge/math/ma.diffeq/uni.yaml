idea: 很多現象的變化率取決於現況：熱水和室溫差越多，降溫越快。把這個關係寫成微分方程，解出公式，再拿資料比對；對不上時，要回頭檢查模型的假設。
guiding_questions:
- 模型預測錯了，是模型壞了還是假設錯了？
- 知道降溫多快和現在幾度，能預測之後的溫度嗎？
scenario: 一杯熱水放在 25°C 的房間，已經記好每 2 分鐘的溫度（示意數據：85、77.2、70.5、64.6、59.5、55°C）。用牛頓冷卻定律建立模型，預測什麼時候降到 40°C；本頁只用數據計算，不需要自己燒水或碰熱水（本站整理）。
formats:
  slides: []
  exercise: 目標：把牛頓冷卻定律寫成微分方程，用示意數據定出常數，預測水溫降到 40°C 的時間，並說出模型用了哪些假設（數字是示意）。　檢核：不看本頁，自己寫出 dT/dt ＝ −k(T − 25)、算出溫差每 10 分鐘減半、預測 20 分鐘降到 40°C，並說出室溫不變是模型的假設；三件事都對（數字是示意）。
