review: 不看本頁，自己寫出 dT/dt ＝ −k(T − 25)、算出溫差每 10 分鐘減半、預測 20 分鐘降到 40°C，並說出室溫不變是模型的假設；三件事都對（數字是示意）。
why:
  heading: 用變化率說未來
  body:
  - OpenStax 說微分方程是「an equation involving an unknown function」…「and one or more of its derivatives」：不直接給出答案，而是說答案怎麼變化。再加上起點，就是「A differential equation together with one or more initial values is called an initial-value problem」。
  - 高中數學 A 類已經學過「按比例成長或衰退的數學模型」，學習表現也要「認識以指數函數為數學模型的成長或衰退現象」。大學從變化率出發，解出為什麼會是指數，也學會檢查模型。
  items_title: 建模的三個部分
  items:
  - title: 微分方程
    text: 說明變化率和現況的關係。
  - title: 初始值
    text: 一開始的狀態。
  - title: 和資料比對
    text: 對不上就檢查假設。
  checklist_title: 開始前先確認
  checklist:
  - 懂指數函數
  - 會用自然對數
  sources:
  - os-de
  - math108
how:
  heading: 寫方程、解出、比對
  body:
  - 寫方程：OpenStax 的牛頓冷卻定律說，物體溫度的變化率「is proportional to the difference between its own temperature and the ambient temperature」。室溫是 25°C 時寫成 dT/dt ＝ −k(T − 25)，k 是正的常數，初始值 T(0) ＝ 85。
  - 解和定常數：這個方程的解是 T ＝ 25 ＋ 60 × e^(−kt)，溫差每過同樣的時間就乘同一個倍數。示意數據的溫差是 60、52.2、45.5、39.6、34.5、30，每 2 分鐘約乘 0.87，10 分鐘剛好減半，所以 k ＝ ln 2 ÷ 10 ≈ 0.069（每分鐘）（說明是本站整理）。
  - 預測和檢查：降到 40°C 時溫差是 15，是 60 的四分之一，要減半兩次，也就是 20 分鐘（數字是示意）。如果實際數據每 2 分鐘的倍數不固定，就要回頭檢查假設，例如室溫是不是真的不變（說明是本站整理）。
  qa:
    question: 模型預測錯了，是模型壞了還是假設錯了？
    answer: 先檢查假設。本頁的模型假設室溫固定 25°C，而且降溫速度和溫差成正比；數學推導沒錯時，預測對不上通常表示某個假設不成立，例如室溫在變，就要改模型再比對（說明是本站整理）。牛頓冷卻定律本身就是一個假設：變化率「is proportional to the difference between its own temperature and the ambient temperature」。
    source: os-cool
  items_title: 三步做
  items:
  - title: 寫出方程
    text: 變化率和溫差成正比。
  - title: 定出常數
    text: 從數據的倍數算 k。
  - title: 預測再檢查
    text: 對不上就改假設。
  checklist_title: 每次做完勾一下
  checklist:
  - 寫出方程
  - 算出倍數
  - 預測 40°C
  - 說出假設
  activity_figure: diffeq-flow
  sources:
  - os-cool
what:
  heading: 建模、預測、檢查
  body:
  - 學完後，自己能把變化率取決於現況的現象寫成微分方程，用資料定出常數做預測，並在預測對不上時回頭檢查假設。
  items_title: 學完能做到
  items:
  - title: 寫出微分方程
    text: dT/dt ＝ −k(T − 25)。
  - title: 用資料定常數
    text: 算出 k ≈ 0.069。
  - title: 檢查假設
    text: 說出模型的前提。
  checklist_title: 自我檢核
  checklist:
  - 方程寫對
  - 時間算對
  - 說出假設
  figures:
  - diffeq-compare
  notes:
  - 本頁的溫度數據是示意；不需要自己燒水或碰熱水。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，算式和數字要自己驗算；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
