idea: 很多現象是「變化率取決於現況」：人口成長、熱咖啡冷卻、疾病傳播。用微分方程建模，再檢查模型是否合理。
guiding_questions:
  - 模型預測錯了，是模型壞了還是假設錯了？
scenario: 記錄一杯熱水每 2 分鐘的溫度，建立冷卻模型，預測何時降到可以喝的溫度。
