est_time:
  school: 高中十一年級數學課
  source: math108
why:
  heading: 用數描述位置與移動
  body:
  - 數學領綱要高中生「認識直角坐標可以用數來表示平面與空間中的位置，可以經由向量觀念而做點的運算」。課程手冊的學習目標是「能理解向量同時具有大小及方向的特性；只要此兩特性相等的向量，就是同一個向量。」
  - 手冊也說高中的向量教學「並不是支援物理課程的工具」，目標是為大學的線性代數打基礎，所以本頁用位移和坐標來學。
  items_title: 數學領綱的學習重點
  items:
  - title: 坐標與向量
    text: 數學 g-V-1：認識直角坐標可以用數來表示平面與空間中的位置，可以經由向量觀念而做點的運算，理解並熟練其操作，並能用於溝通。
    code: g-V-1
  - title: 平面向量
    text: 數學 G-11A-1：平面向量：坐標平面上的向量係數積與加減，線性組合。
    code: G-11A-1
  - title: 空間坐標系
    text: 數學 G-11A-2：空間坐標系：點坐標，兩點距離，點到坐標軸或坐標平面的投影。
    code: G-11A-2
  - title: 空間向量
    text: 數學 G-11A-3：空間向量：坐標空間中的向量係數積與加減，線性組合。
    code: G-11A-3
  checklist_title: 開始前先確認
  checklist:
  - 會平面坐標
  - 會畢氏定理
  notes:
  - 數學學習內容代碼中間的數字是年級（10 是高一；11A、11B 是十一年級的 A、B 兩類），學習表現代碼中間的 V 是第五學習階段（普通型高中）。
  sources:
  - math108
  - math-handbook
how:
  heading: 平面加法，空間距離
  body:
  - 往東 3 格是向量 (3, 0)，往北 4 格是 (0, 4)。向量相加就是坐標各自相加：(3, 0) ＋ (0, 4) ＝ (3, 4)，從起點直接斜走到終點也是同一個向量。長度用畢氏定理算：√(3² ＋ 4²) ＝ 5 格。乘上倍數改變長度：2 × (3, 4) ＝ (6, 8)，方向不變、長度變成 10 格（數字是示意）。
  - 空間多一個坐標：把牆角當原點，地板上的兩條牆邊當 x、y 軸，往上的牆角線當 z 軸。以原點和點 (2, 3, 6) 為對角畫一個長方體，先算地板上的對角線 √(2² ＋ 3²) ＝ √13，再和高 6 用一次畢氏定理，距離是 √(13 ＋ 36) ＝ √49 ＝ 7（數字是示意）。空間向量的加法和係數積，也是三個坐標各自做。
  qa:
    question: 往東走 3 步、再往北走 4 步，離起點多遠、在哪個方向？
    answer: 離起點 5 步，方向就是從起點斜走到終點的那條線，也就是向量 (3, 4)：(3, 0) ＋ (0, 4) ＝ (3, 4)，長度 √(3² ＋ 4²) ＝ 5（數字是示意）。課程手冊提醒「學生常忘記向量可移動到任意始點」，所以第二段位移要接在第一段的終點。
    source: math-handbook
  items_title: 三種運算
  items:
  - title: 加法
    text: 坐標各自相加。
  - title: 係數積
    text: 每個坐標乘同一個數。
  - title: 長度與距離
    text: 用畢氏定理算。
  checklist_title: 每次做完勾一下
  checklist:
  - 算出 (3, 4)
  - 算出長度 5
  - 算出 (6, 8)
  - 算出距離 7
  activity_figure: vector-flow
  sources:
  - math-handbook
what:
  heading: 算得出位移和距離
  body:
  - 學完後，孩子能用坐標表示平面向量並做加法和係數積、算出長度，也能用三個坐標描述空間中的點，算出它到原點的距離。
  items_title: 學完能做到
  items:
  - title: 平面向量運算
    text: 加法與係數積。
  - title: 向量長度
    text: 用畢氏定理。
  - title: 空間坐標
    text: 三個坐標與距離。
  checklist_title: 家長檢核
  checklist:
  - 加法算對
  - 長度算對
  - 空間距離對
  figures:
  - vector-compare
  notes:
  - 本頁的格數和坐標是示意；在地磚上走時選空曠、乾燥的地方慢慢走（本站建議）。
  - 空間坐標和空間向量（G-11A-2、G-11A-3）是十一年級 A 類的內容；B 類只有平面向量（G-11B-1）。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - math-handbook
  - genai-student
