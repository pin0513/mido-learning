  exercise: 目標：用七巧板拼出圖形並找出全等的片子，把長方形沿對角線剪開重組，再把紙盒拆成展開圖、黏回原來的盒子。　檢核：家長看孩子動手做：用七巧板拼出一個動物，疊出兩對全等的片子，把剪開的長方形重組成別的形狀，並把紙盒的展開圖黏回盒子；四件事都做到。
