est_time:
  school: 國小三、四年級數學課
  source: math108
why:
  heading: 動手拼，看懂形狀
  body:
  - 數學課程手冊說，學生若「不知道可做旋轉或翻轉，建議多做拼圖活動，理解其必要性。」並舉七巧板為例：「若學生只會將綠色平行四邊形做旋轉，就無法拼成正方形。」
  - 三年級的平面圖形分割重組和展開圖以操作為主，手冊說「本條目不做操作以外的紙筆評量。」四年級認識全等：「兩圖形若形狀和大小都一樣稱為『全等』圖形。」
  items_title: 數學領綱的學習重點
  items:
  - title: 旋轉角與展開圖
    text: 數學 s-II-4：在活動中，認識幾何概念的應用，如旋轉角、展開圖與空間形體。
    code: s-II-4
  - title: 分割重組與展開圖
    text: 數學 S-3-4：幾何形體之操作：以操作活動為主。平面圖形的分割與重組。初步體驗展開圖如何黏合成立體形體。知道不同之展開圖可能黏合成同一形狀之立體形體。
    code: S-3-4
  - title: 全等的意義
    text: 數學 s-II-2：認識平面圖形全等的意義。
    code: s-II-2
  - title: 平面圖形的全等
    text: 數學 S-4-6：平面圖形的全等：以具體操作為主。形狀大小一樣的兩圖形全等。能用平移、旋轉、翻轉做全等疊合。全等圖形之對應角相等、對應邊相等。
    code: S-4-6
  checklist_title: 開始前先確認
  checklist:
  - 認得三角形
  - 會用剪刀
  notes:
  - 數學學習內容代碼中間的數字是年級，學習表現代碼中間的羅馬數字是學習階段（II 是國小中年級，IV 是國中）。
  sources:
  - math108
  - math-handbook
how:
  heading: 拼一拼、剪一剪、拆一拆
  body:
  - 先玩七巧板：拼出動物時，片子可以轉一轉，也可以翻過來（本站整理）。再把兩片大三角形疊在一起，完全重合，形狀和大小都一樣，就是全等；兩片小三角形也是。手冊說「平移」、「旋轉」、「翻轉」這些名詞「僅作為教師溝通之用，不需出現於教學中。」
  - 再剪長方形，用兒童安全剪刀（本站建議）：手冊問「將長方形依對角線剪開，可以重組出哪些簡單的圖形？」最後拆紙盒：紙盒比較硬，由大人沿邊剪開，孩子攤平成展開圖，再黏回去（本站建議）；剪開的邊不同，展開圖也不同，手冊說「學生應知道同一形體可能有不同的展開圖」。
  qa:
    question: 同樣七片七巧板，為什麼能拼出那麼多不同的東西？
    answer: 因為每一片都可以換位置、轉一轉、翻過來，再和其他片拼接，組合的方法很多（本站整理）。課程手冊也提醒，只會轉、不會翻，有些形狀就拼不出來：「若學生只會將綠色平行四邊形做旋轉，就無法拼成正方形。」
    source: math-handbook
  items_title: 四個動手活動
  items:
  - title: 七巧板
    text: 轉一轉、翻過來，拼出圖形。
  - title: 疊疊看
    text: 兩片完全重合就是全等。
  - title: 剪長方形
    text: 沿對角線剪開，重組新形狀。
  - title: 拆紙盒
    text: 大人剪開，孩子攤平再黏回。
  checklist_title: 每次做完勾一下
  checklist:
  - 拼出一個圖形
  - 疊出全等片
  - 剪開重組了
  - 盒子黏回去
  activity_figure: shape-flow
  sources:
  - math-handbook
what:
  heading: 拼得出，也拆得開
  body:
  - 學完後，孩子能轉、翻七巧板拼出圖形，用疊合找出全等的片子，把長方形剪開重組，並把紙盒拆成展開圖再黏回去。
  items_title: 學完能做到
  items:
  - title: 拼出圖形
    text: 會轉、會翻七巧板。
  - title: 找出全等
    text: 疊起來完全重合。
  - title: 拆合盒子
    text: 展開圖黏回盒子。
  checklist_title: 家長檢核
  checklist:
  - 拼圖完成
  - 全等疊對
  - 盒子還原
  figures:
  - shape-compare
  notes:
  - 本點以動手操作為主，不做紙筆測驗（依課程手冊）。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - math-handbook
  - genai-student
