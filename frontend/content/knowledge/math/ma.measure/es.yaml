why:
  heading: 大家都同意的單位
  body:
  - 數學課程手冊說，二年級引入「公分」、「公尺」之前，「宜先進行『為什麼需要相同單位的活動』：例如由學生自選個別單位，測量同一物件，進而從溝通需要，建立使用相同單位的需求感。」
  - 手冊也說「量感的教學應配合學生身體或周遭物件，以建立量感的實質基礎。」，而且「估測必須在實測已有經驗之後才進行」。
  items_title: 數學領綱的學習重點
  items:
  - title: 長度與常用單位
    text: 數學 n-I-7：理解長度及其常用單位，並做實測、估測與計算。
    code: n-I-7
  - title: 公分與公尺
    text: 數學 N-2-11：長度：「公分」、「公尺」。實測、量感、估測與計算。單位換算。
    code: N-2-11
  - title: 直尺操作
    text: 數學 S-2-3：直尺操作：測量長度。報讀公分數。指定長度之線段作圖。
    code: S-2-3
  - title: 時間的加減
    text: 數學 n-II-10：理解時間的加減運算，並應用於日常的時間加減問題。
    code: n-II-10
  checklist_title: 開始前先確認
  checklist:
  - 會數到一百
  - 看得懂刻度
  notes:
  - 數學學習內容代碼中間的數字是年級，學習表現代碼中間的羅馬數字是學習階段（II 是國小中年級，IV 是國中）。
  sources:
  - math108
  - math-handbook
how:
  heading: 先用腳步，再用捲尺
  body:
  - 先用腳步量：孩子和家長各用自己的腳，腳跟接腳尖，量同一段走廊，例如孩子 30 步、家長 20 步（數字是示意）。課程手冊的例子是用筆量桌子，學生討論後能說明「因為筆不一樣長，量得數量不相同」；腳步也一樣，所以需要相同的單位。
  - 再用捲尺量：把 0 對齊一端，讀出公尺和公分，例如 5 公尺 20 公分，也就是 520 公分（1 公尺 ＝ 100 公分；數字是示意）。手冊說「實際測量一定會發生誤差，教師教導學生使用『大概』或『大約』幾公分的描述方式。」
  - 三年級學秒以後量時間：家裡通常沒有 20 公尺長，可以到戶外，或在走廊來回走滿 20 公尺，用碼錶量要幾秒；用走的，不用跑（本站建議）。量兩次，例如第一次 18 秒、第二次 22 秒，兩次共 18 ＋ 22 ＝ 40 秒（數字是示意）。手冊說三年級「『時間量的加減』限同單位時間量的加減」，秒加秒就在範圍內。
  qa:
    question: 如果全世界都用自己的腳當單位，會發生什麼事？
    answer: 同一段路，每個人量出來的數字都不一樣，彼此說不清楚到底多長。課程手冊說要讓學生「從溝通需要，建立使用相同單位的需求感」，所以大家才約定用公分、公尺（說明是本站整理）。
    source: math-handbook
  items_title: 量長度和時間
  items:
  - title: 腳步量
    text: 每個人的步數不一樣。
  - title: 捲尺量
    text: 0 對齊一端，讀公尺和公分。
  - title: 說大約
    text: 用「大約幾公尺幾公分」描述。
  - title: 量秒數再相加
    text: 用碼錶量兩次，把秒數加起來。
  checklist_title: 每次量完勾一下
  checklist:
  - 0 對齊一端
  - 讀出公尺公分
  - 說了大約
  - 秒數加對了
  activity_figure: measure-flow
