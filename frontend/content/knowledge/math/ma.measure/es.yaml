  - math-handbook
what:
  heading: 用單位說出多長多久
  body:
  - 學完後，孩子能說明為什麼要用相同的單位，用捲尺量出長度並用公尺、公分說出「大約多少」，也能用碼錶量出走一段路要幾秒，並把兩次的秒數加起來。
  items_title: 學完能做到
  items:
  - title: 說明單位
    text: 說出為什麼要用相同單位。
  - title: 量出長度
    text: 用公尺、公分說出來。
  - title: 量出時間
    text: 用秒說出走多久，會把秒數相加。
  checklist_title: 家長檢核
  checklist:
  - 理由說得通
  - 長度讀對
  - 秒數加對
  figures:
  - measure-compare
  notes:
  - 本頁的步數、長度、秒數都是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - math108
  - math-handbook
  - genai-student
