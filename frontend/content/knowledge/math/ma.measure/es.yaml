  exercise: 目標：說出為什麼要用相同的單位，用捲尺量出一段長度並用公尺、公分說出來，再用碼錶量走一段路要幾秒，並把兩次的秒數加起來。　檢核：孩子用腳步和捲尺各量一次同一段長度，說出兩種結果為什麼不一樣、捲尺量到「大約幾公尺幾公分」，再到戶外或在走廊來回量走 20 公尺要幾秒，把兩次的秒數加起來；三件事都做到（數字是示意）。
