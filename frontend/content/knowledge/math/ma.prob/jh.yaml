idea: 機率描述「多可能發生」。擲越多次，實驗結果會越接近理論機率。
guiding_questions:
  - 連續 5 次擲到 6，下一次擲到 6 的機會變大還是變小？
scenario: 全班各擲骰子 60 次，合併結果，比較每個點數出現的次數和理論值。
