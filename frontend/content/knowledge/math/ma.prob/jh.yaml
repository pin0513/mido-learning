why:
  heading: 用數字說出有多可能
  body:
  - 數學課程手冊說，九年級要「從重複試驗中，認識機率的意義。」；八年級先學相對次數：「『相對次數』是將各筆或各組資料的次數除以總次數所得的比值。」
  - 手冊要讓學生初步體認「如果試驗越多次，所獲得的機率資訊越可靠」，也提醒有些學生會誤認為「若第一次出現正面，第二次就要出現反面」。
  items_title: 數學領綱的學習重點
  items:
  - title: 機率與樹狀圖
    text: 數學 d-IV-2：理解機率的意義，能以機率表示不確定性和以樹狀圖分析所有的可能性，並能應用機率到簡單的日常生活情境解決問題。
    code: d-IV-2
  - title: 相對次數
    text: 數學 D-8-1：統計資料處理：累積次數、相對次數、累積相對次數折線圖。
    code: D-8-1
  - title: 認識機率
    text: 數學 D-9-2：認識機率：機率的意義；樹狀圖（以兩層為限）。
    code: D-9-2
  - title: 古典機率
    text: 數學 D-9-3：古典機率：具有對稱性的情境下（銅板、骰子、撲克牌、抽球等）之機率；不具對稱性的物體（圖釘、圓錐、爻杯）之機率探究。
    code: D-9-3
  checklist_title: 開始前先確認
  checklist:
  - 會約分
  - 會算除法
  notes:
  - 數學學習內容代碼中間的數字是年級，學習表現代碼中間的羅馬數字是學習階段（II 是國小中年級，IV 是國中）。
  sources:
