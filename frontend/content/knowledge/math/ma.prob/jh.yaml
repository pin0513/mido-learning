  - math-handbook
how:
  heading: 先算，再擲，再比較
  body:
  - 先列出所有可能：公正的骰子有 1 到 6 點，每一面機會一樣，擲出 6 點的機率是 1/6。擲兩枚銅板畫兩層樹狀圖：第一枚正或反，第二枚再分正或反，共 4 種，兩枚都正面的機率是 1/4。
  - 再做試驗：每人擲 60 次，記下 6 點出現幾次，相對次數 ＝ 次數 ÷ 總次數，例如 12 次就是 12 ÷ 60 ＝ 0.2（數字是示意）；全班合併，次數更多，資訊更可靠。圖釘、爻杯不對稱，沒辦法用對稱算，只能靠多做試驗來估計（本站整理）。
  qa:
    question: 連續 5 次擲到 6，下一次擲到 6 的機會變大還是變小？
    answer: 都不是，機率不變，還是 1/6：骰子不會記得前面擲過什麼（說明是本站整理）。課程手冊用銅板說明：「即使投擲一銅板已出現 10 次正面，下次投擲仍然有一半的機會是正面。」
    source: math-handbook
  items_title: 機率四步
  items:
  - title: 列出可能
    text: 骰子 6 種，兩枚銅板 4 種。
  - title: 畫樹狀圖
    text: 兩層，第一枚再分第二枚。
  - title: 算相對次數
    text: 次數 ÷ 總次數。
  - title: 合併比較
    text: 全班合併，和 1/6 比一比。
  checklist_title: 每次做完勾一下
  checklist:
  - 列出所有可能
  - 樹狀圖兩層
  - 算相對次數
  - 和機率比較
  activity_figure: prob-flow
  sources:
  - math-handbook
what:
  heading: 算得出，也擲得出
  body:
  - 學完後，孩子能用對稱性和兩層樹狀圖算出簡單的機率，用相對次數整理試驗結果，並說明前面的結果不會改變下一次的機率。
  items_title: 學完能做到
  items:
  - title: 算出機率
    text: 用對稱性和樹狀圖。
  - title: 整理試驗
    text: 算出相對次數。
  - title: 說明獨立
    text: 下一次機率不變。
  checklist_title: 家長檢核
  checklist:
  - 機率算對
  - 相對次數對
  - 說明正確
  figures:
  - prob-compare
  notes:
  - 本頁的擲骰次數和結果是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - math108
  - math-handbook
  - genai-student
