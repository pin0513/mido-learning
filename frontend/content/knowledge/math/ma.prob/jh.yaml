idea: 機率描述一件事有多可能發生。骰子、銅板這類每一面機會一樣的東西可以直接算；圖釘、爻杯就要靠多做試驗來估計，試驗越多次，得到的資訊越可靠。
guiding_questions:
- 連續 5 次擲到 6，下一次擲到 6 的機會變大還是變小？
scenario: 全班各擲骰子 60 次，合併結果，比較每個點數出現的相對次數和 1/6（數字是示意）。
formats:
  slides: []
  exercise: 目標：用對稱性和兩層樹狀圖算出簡單的機率，用相對次數整理擲骰子的試驗結果，並說明前面的結果不會改變下一次的機率。　檢核：孩子算出擲骰子出現 6 點、擲兩枚銅板都正面的機率並畫出樹狀圖，用 60 次試驗算出相對次數，再回答連續擲到 6 之後下一次的機率；四題都對（數字是示意）。
