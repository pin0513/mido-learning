review: 孩子摺出 1/2、1/4、1/8，排出大小；在 4 等分的紙上塗出 3/4；再把 1/2 的紙對摺，說明 2/4 ＝ 1/2。三件事都做到（數字是示意）。
est_time:
  school: 國小二至四年級數學課
  source: math108
why:
  heading: 公平地平分
  body:
  - 數學課程手冊說，二年級的單位分數「是小學第一次的分數教學」，「應以基於『公平』的等分活動來進行。」
  - 手冊說學生在摺紙活動中，「知道分的次數越多，所得越小的道理即可。」三年級學簡單同分母分數，四年級從操作和討論中「理解等值分數的意義與操作方法」。
  items_title: 數學領綱的學習重點
  items:
  - title: 單位分數
    text: 數學 n-I-6：認識單位分數。
    code: n-I-6
  - title: 幾分之一
    text: 數學 N-2-10：單位分數的認識：從等分配的活動（如摺紙）認識單部分為全部的「幾分之一」。知道日常語言「的一半」、「的二分之一」、「的四分之一」的溝通意義。在已等分割之格圖中，能說明一格為全部的「幾分之一」。
    code: N-2-10
  - title: 同分母與等值分數
    text: 數學 n-II-6：理解同分母分數的加、減、整數倍的意義、計算與應用。認識等值分數的意義，並應用於認識簡單異分母分數之比較與加減的意義。
    code: n-II-6
  - title: 等值分數
    text: 數學 N-4-6：等值分數：由操作活動中理解等值分數的意義。簡單異分母分數的比較、加、減的意義。簡單分數與小數的互換。
    code: N-4-6
  checklist_title: 開始前先確認
  checklist:
  - 會對摺紙
  - 會數格子
  notes:
  - 數學學習內容代碼中間的數字是年級，學習表現代碼中間的羅馬數字是學習階段（II 是國小中年級，IV 是國中）。
  sources:
  - math108
  - math-handbook
how:
  heading: 摺一摺，比一比
  body:
  - 拿一張長方形紙對摺，打開後兩份一樣大，一份是 1/2（二分之一）；再對摺一次是 4 份，一份是 1/4；再一次是 8 份，一份是 1/8。排一排：1/8 < 1/4 < 1/2，分的份數越多，每份越小。
  - 三年級：在摺成 4 份的紙上塗 3 份，就是 3/4，也就是 3 個 1/4。數一數有幾個 1/4，就能比大小和加減：3/4 > 2/4，1/4 + 2/4 ＝ 3/4，3/4 − 1/4 ＝ 2/4；4 個 1/4 是整張紙，所以 1/4 + 3/4 ＝ 1。課程手冊說要「以整數點數與單位分數為基礎，處理簡單同分母分數之比較、加、減」（例子是本站整理）。
  - 四年級：把 1/2 的紙再對摺，同一塊變成 2 個 1/4，所以 2/4 ＝ 1/2，這就是等值分數（例子是本站整理）。
  qa:
    question: 一個披薩分給 3 個人和分給 4 個人，誰拿到比較多？
    answer: 分給 3 個人時每人拿到 1/3，分給 4 個人時每人拿到 1/4；同一個披薩分的份數越多，每份越小，所以 1/3 > 1/4，分給 3 個人時每人拿得比較多（例子是本站整理）。課程手冊說學生要「知道分的次數越多，所得越小的道理」。
    source: math-handbook
  items_title: 分數四步
  items:
  - title: 摺一摺
    text: 對摺再對摺，每份一樣大。
  - title: 比大小
    text: 份數越多，每份越小。
  - title: 塗幾份
    text: 塗 3 份就是 3/4。
  - title: 再細分
    text: 1/2 對摺成 2 個 1/4。
  checklist_title: 每次做完勾一下
  checklist:
  - 每份一樣大
  - 排出大小
  - 塗對份數
  - 說出 2/4 ＝ 1/2
  activity_figure: fraction-flow
  sources:
  - math-handbook
what:
  heading: 看懂幾分之幾
  body:
  - 學完後，孩子能用摺紙做出 1/2、1/4、1/8 並比較大小，在等分的紙上塗出幾分之幾，並用摺紙說明 2/4 和 1/2 一樣大。
  items_title: 學完能做到
  items:
  - title: 做出分數
    text: 用摺紙做出 1/2、1/4、1/8。
  - title: 比較大小
    text: 說出份數越多每份越小。
  - title: 說明等值
    text: 說明 2/4 ＝ 1/2。
  checklist_title: 家長檢核
  checklist:
  - 摺得公平
  - 大小排對
  - 等值說對
  figures:
  - fraction-compare
  notes:
  - 本頁的分數例子是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - math-handbook
  - genai-student
