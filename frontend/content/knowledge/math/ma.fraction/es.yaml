idea: 分數是「把一個整體平分成幾份，取其中幾份」。一樣大的東西，分越多份，每份越小。
guiding_questions:
  - 一個披薩分給 3 個人和分給 4 個人，誰拿到比較多？
scenario: 摺紙與切披薩：用摺紙做出 1/2、1/4、1/8，比較哪一份大，再討論 2/4 和 1/2 一不一樣。
