idea: 分數是「把一個整體平分成幾份，取其中幾份」。一樣大的東西，分越多份，每份越小。
guiding_questions:
- 一個披薩分給 3 個人和分給 4 個人，誰拿到比較多？
scenario: 親子共學：用長方形紙摺出 1/2、1/4、1/8，比較哪一份大，再討論 2/4 和 1/2 一不一樣（數字是示意）。
formats:
  slides: []
  exercise: 目標：用摺紙做出二分之一、四分之一、八分之一並比較大小，塗出幾分之幾，再用摺紙說明四分之二和二分之一一樣大。　檢核：孩子摺出 1/2、1/4、1/8，排出大小；在 4 等分的紙上塗出 3/4；再把 1/2 的紙對摺，說明 2/4 ＝ 1/2。三件事都做到（數字是示意）。
