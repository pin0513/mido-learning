idea: 積分是把很多很小的量累積起來：每一小段時間的速度乘時間再加總，就逼近走過的距離，切得越細越準。微積分基本定理說，累積和變化率是一體兩面。
guiding_questions:
- 知道每一刻的速度，就能知道走了多遠嗎？
scenario: 腳踏車碼表每 0.5 秒記一次速度，假設速度 v ＝ 2t 公尺／秒（t 從 0 到 2 秒），用長方形面積加總估計騎了多遠，再用微積分基本定理算出準確的答案比較（數字是示意，本站整理）。
formats:
  slides: []
  exercise: 目標：用左、右端點的長方形加總估計本頁 0 到 2 秒的距離，說出切得越細兩個估計越接近，並用微積分基本定理算出準確的距離（數字是示意）。　檢核：不看本頁，自己算出切 4 段時估計是 3 公尺和 5 公尺、準確答案是 4 公尺，並說出位移和總路程什麼時候不一樣；三件事都對（數字是示意）。
