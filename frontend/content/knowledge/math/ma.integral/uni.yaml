why:
  heading: 從速度算出距離
  body:
  - OpenStax 說「By using smaller and smaller rectangles, we get closer and closer approximations to the area. Taking a limit allows us to calculate the exact area under the curve.」速度圖下的面積就是走過的距離，切越細越準，取極限就是定積分。
  - 高中數學甲已經學過「黎曼和與定積分的連結」，也學過「定積分在面積、位移、總變化量的意涵」。大學課本再把這個想法寫成淨變化定理：知道起始值和變化率，就能算出新的值；OpenStax 也說微積分基本定理「establish a relationship between integration and differentiation」。
  items_title: 積分的三個重點
  items:
  - title: 曲線下的面積
    text: 很多細長方形加起來。
  - title: 總變化量
    text: 變化率累積起來的結果。
  - title: 微積分基本定理
    text: 累積和變化率互為逆運算。
  checklist_title: 開始前先確認
  checklist:
  - 會求導數
  - 會算長方形面積
  sources:
  - os-area
  - os-net
  - os-ftc
  - math108
how:
  heading: 切段、加總、再驗算
  body:
  - 切 4 段（每段 0.5 秒）：用每段開頭的速度 0、1、2、3，距離約 0.5 × (0 ＋ 1 ＋ 2 ＋ 3) ＝ 3 公尺；用每段結尾的速度 1、2、3、4，約 0.5 × (1 ＋ 2 ＋ 3 ＋ 4) ＝ 5 公尺。切 8 段時兩個估計是 3.5 和 4.5 公尺，越切越接近（說明是本站整理）。
  - 驗算：位置 s ＝ t² 的導數是 v ＝ 2t（ma.rate@sh 的例子），所以 0 到 2 秒走的距離是 s(2) − s(0) ＝ 4 − 0 ＝ 4 公尺，剛好夾在兩個估計中間。這是微積分基本定理第二部分：「if we can find an antiderivative for the integrand, then we can evaluate the definite integral by evaluating the antiderivative at the endpoints of the interval and subtracting」。OpenStax 的淨變化定理也說「The new value of a changing quantity equals the initial value plus the integral of the rate of change」。
  - 位移和總路程：如果中途倒退，速度會是負的，速度的積分得到的是位移。OpenStax 提醒「Total distance traveled, on the other hand, is always positive.」，要算總路程，就把速度取絕對值再積分，書中說「we need to integrate the absolute value of the velocity function」。
  qa:
    question: 知道每一刻的速度，就能知道走了多遠嗎？
    answer: 能。速度對時間的積分是位移，速度一直是正的時，就是走過的距離；本頁的例子 0 到 2 秒走了 4 公尺（數字是示意）。但要知道最後在哪裡，還要知道起點，這就是淨變化定理說的「the new value equals the initial value plus the integral of the rate of change」。
    source: os-net
  items_title: 三步做
  items:
  - title: 切成小段
    text: 每段當成等速。
  - title: 加總估計
    text: 左端點和右端點各算一次。
  - title: 用定理驗算
    text: 找出位置函數相減。
  checklist_title: 每次做完勾一下
  checklist:
  - 算出 3 和 5
  - 切 8 段再算
  - 用 s(t) 驗算
  - 分辨位移路程
  activity_figure: integral-flow
  sources:
  - os-net
  - os-ftc
what:
  heading: 累積算得出來
  body:
  - 學完後，自己能用長方形加總估計累積量，說明切得越細越準，用微積分基本定理算出準確值，並分辨位移和總路程。
  items_title: 學完能做到
  items:
  - title: 估計累積量
    text: 左、右端點加總。
  - title: 算出準確值
    text: 用位置函數相減。
  - title: 分辨位移路程
    text: 倒退時兩者不同。
  checklist_title: 自我檢核
  checklist:
  - 估計算對
  - 準確值算對
  - 說出兩者差別
  figures:
  - integral-compare
  notes:
  - 本頁的速度模型和數字是示意。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，算式和數字要自己驗算；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
