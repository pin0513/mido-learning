why:
  heading: 縮放後，比例不變
  body:
  - 數學課程手冊說「常見的比例問題有：折扣、加成、利率、匯率、密度、濃度、速度、比例尺等。」九年級學相似形，要「透過圖形的縮放了解縮放後的邊長成比例，對應角仍不變。」
  - 判斷三角形相似不必量三個角：手冊說「三角形中只要有兩組對應角相等，則第三組對應角也相等；因此不需要三組對應角相等。」
  items_title: 數學領綱的學習重點
  items:
  - title: 比與比例式
    text: 數學 n-IV-4：理解比、比例式、正比、反比和連比的意義和推理，並能運用到日常生活的情境解決問題。
    code: n-IV-4
  - title: 相似形
    text: 數學 s-IV-6：理解平面圖形相似的意義，知道圖形經縮放後其圖形相似，並能應用於解決幾何與日常生活的問題。
    code: s-IV-6
  - title: 三角形的相似
    text: 數學 s-IV-10：理解三角形相似的性質，利用對應角相等或對應邊成比例，判斷兩個三角形的相似，並能應用於解決幾何與日常生活的問題。
    code: s-IV-10
  checklist_title: 開始前先確認
  checklist:
  - 會算比值
  - 會解比例式
