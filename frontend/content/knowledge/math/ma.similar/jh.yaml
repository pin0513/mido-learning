how:
  heading: 地圖和影子都靠比例
  body:
  - 先看地圖：比例尺 1：100000 表示地圖上 1 公分是實際的 100000 公分，也就是 1 公里；地圖上 3 公分就是 3 公里（數字是示意）。
  - 再量旗桿：同一時間，身高 160 公分的人影長 120 公分，旗桿影長 6 公尺（數字是示意）。太陽光可看成平行，人和旗桿都垂直地面（本站整理），兩個三角形有兩組對應角相等，所以相似；對應邊成比例：旗桿高 ÷ 6 ＝ 160 ÷ 120，旗桿高是 8 公尺。量影子時只看地上的影子，不要直視太陽（本站建議）。
  qa:
    question: 地圖上的 1 公分，為什麼可以代表真實的 1 公里？
    answer: 地圖是把真實的地形按同一個比例縮小的圖形，所有長度都縮成 1/100000；1 公里是 100000 公分，縮小後就是 1 公分（比例尺是示意，說明是本站整理）。課程手冊說，縮放後「邊長成比例，對應角仍不變」。
    source: math-handbook
  items_title: 用比例量世界
  items:
  - title: 讀比例尺
    text: 1：100000，1 公分代表 1 公里。
  - title: 找相似
    text: 兩組對應角相等就相似。
  - title: 列比例式
    text: 對應邊的比相等。
  - title: 算出高度
    text: 解比例式，得到旗桿高。
  checklist_title: 每次做完勾一下
  checklist:
  - 單位換算對
  - 說出相似理由
  - 對應邊對好
  - 算出高度
  activity_figure: similar-flow
  sources:
  - math-handbook
what:
  heading: 用相似量高度
  body:
  - 學完後，孩子能用比例尺換算地圖距離，用兩組對應角相等說明兩個三角形相似，再用對應邊成比例算出量不到的高度。
  items_title: 學完能做到
  items:
  - title: 換算地圖
    text: 用比例尺算實際距離。
  - title: 判斷相似
    text: 說出兩組對應角相等。
  - title: 算出高度
    text: 用比例式算旗桿高。
  checklist_title: 家長檢核
  checklist:
  - 換算正確
  - 相似理由對
  - 高度算對
  figures:
  - similar-compare
  notes:
  - 本頁的身高、影長、比例尺都是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - math-handbook
  - genai-student
