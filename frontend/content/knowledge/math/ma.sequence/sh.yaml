why:
  heading: 和無窮打交道
  body:
  - 數學領綱要高中生「認識無窮的概念，理解並欣賞數學掌握無窮的方法。」十年級先學有限項等比級數，12 年級的加深加廣選修再學無窮等比級數。
  - 課程手冊提醒：「學生對於『無窮』的概念，需要引導與時間消化」，也建議找「圖形中蘊含無窮等比級數和的關係，讓學生體會數學之美。」
  items_title: 數學領綱的學習重點
  items:
  - title: 認識無窮
    text: 數學 n-V-8：認識無窮的概念，理解並欣賞數學掌握無窮的方法。
    code: n-V-8
  - title: 規律與級數
    text: 數學 n-V-5：能察覺規律並以一般項或遞迴方式表現，進而熟悉級數的操作。理解數學歸納法的意義，並能用於數學論證。
    code: n-V-5
  - title: 數列與級數
    text: 數學 N-10-6：數列、級數與遞迴關係：有限項遞迴數列，有限項等比級數，常用的求和公式，數學歸納法。
    code: N-10-6
  checklist_title: 開始前先確認
  checklist:
  - 會分數加減
  - 會算次方
  notes:
  - 數學學習內容代碼中間的數字是年級（10 是高一；11A、11B 是十一年級的 A、B 兩類），學習表現代碼中間的 V 是第五學習階段（普通型高中）。
  sources:
  - math108
  - math-handbook
how:
  heading: 剪紙看級數
  body:
  - 第一刀留下 1/2，第二刀 1/4，第三刀 1/8……。前 n 塊的和是首項 1/2、公比 1/2 的等比級數：1/2 ＋ 1/4 ＋ … ＋ 1/2ⁿ ＝ 1 − 1/2ⁿ。剪 5 次是 31/32，還差 1/32；剪 10 次還差 1/1,024。剩下的那一小塊永遠和最後剪下的一塊一樣大，所以和永遠不超過 1（數字是示意）。
  - 差距 1/2ⁿ 要多小就能多小，所以把無限多塊依序加起來，我們說和就是 1；這就是 12 年級選修的無窮等比級數。同樣的想法看 0.999…：0.9、0.99、0.999 和 1 的差是 0.1、0.01、0.001，越來越小；也可以從 1/3 ＝ 0.333… 乘以 3，得 0.999… ＝ 1。這兩種都是直觀的說法，嚴格的說明要用 12 年級無窮等比級數的和：0.999… ＝ 0.9 ＋ 0.09 ＋ 0.009 ＋ …（說明是本站整理）。
  qa:
    question: 0.999… 到底等不等於 1？
    answer: 等於 1。0.9、0.99、0.999 和 1 的差是 0.1、0.01、0.001，可以要多小就多小，兩個數之間沒有距離；也可以用 1/3 ＝ 0.333… 乘以 3 來看（說明是本站整理）。課程手冊的引導問題是「如果兩個數之間沒有距離，是不是就是相等的數？」
    source: math-handbook
  items_title: 從有限到無窮
  items:
  - title: 有限項的和
    text: 1 − 1/2ⁿ，永遠不到 1。
  - title: 差距越來越小
    text: 1/2ⁿ 可以要多小就多小。
  - title: 無限多項的和
    text: 依序加起來，和是 1。
  checklist_title: 每次做完勾一下
  checklist:
  - 算出 31/32
  - 寫出 1 − 1/2ⁿ
  - 說出差距
  - 解釋 0.999…
  activity_figure: sequence-flow
  sources:
  - math-handbook
what:
  heading: 有限算得出，無窮說得清
  body:
  - 學完後，孩子能用有限項等比級數算出剪紙的總和，說出差距越來越小的意思，並用它解釋無限多塊的和是 1、0.999… 等於 1。
  items_title: 學完能做到
  items:
  - title: 算有限項的和
    text: 用等比級數公式。
  - title: 說出差距
    text: 1/2ⁿ 越來越小。
  - title: 解釋無窮
    text: 和是 1，0.999… ＝ 1。
  checklist_title: 家長檢核
  checklist:
  - 和算對
  - 差距說對
  - 無窮說清楚
  figures:
  - sequence-compare
  notes:
  - 本頁的剪紙次數是示意；剪紙用安全剪刀（本站建議）。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - math-handbook
  - genai-student
