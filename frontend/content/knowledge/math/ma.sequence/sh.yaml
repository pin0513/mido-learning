  exercise: 目標：用有限項等比級數算出 1/2 ＋ 1/4 ＋ … ＋ 1/2ⁿ ＝ 1 − 1/2ⁿ，說出差距 1/2ⁿ 會越來越小，並用同樣的想法解釋 0.999… ＝ 1（本站整理）。　檢核：孩子算出剪 5 次的總和 31/32、還差 1/32，寫出 n 塊的和 1 − 1/2ⁿ，並說出為什麼無限多塊加起來是 1、0.999… 也等於 1；三件事都對（數字是示意）。
