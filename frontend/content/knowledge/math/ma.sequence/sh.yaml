idea: 把數一個一個排好是數列，把它們加起來是級數。1/2 ＋ 1/4 ＋ … ＋ 1/2ⁿ 的和是 1 − 1/2ⁿ，永遠不到 1，但可以要多接近就多接近；所以把無限多項依序加起來，我們說和是 1。
guiding_questions:
- 把一張紙一直對半剪，所有小塊加起來會超過一張紙嗎？
- 0.999… 到底等不等於 1？
scenario: 把一張紙對半剪，留下一半再對半剪，一塊塊排成一列，討論加無限多塊會不會超過一張紙；再看 0.999… 和 1 的關係（本站整理）。
