why:
  heading: 把問題翻譯成算式
  body:
  - 數學課程手冊說，「『方程式』指的是含有未知數的等式」；七年級要學一元一次方程式及其解的意義，並在具體情境中列出方程式。
  - 解方程式時，手冊說「等量公理為移項法則的基礎。」解完還要「應用『一元一次方程式解的意義』於驗算。」
  items_title: 數學領綱的學習重點
  items:
  - title: 一元一次方程式
    text: 數學 a-IV-2：理解一元一次方程式及其解的意義，能以等量公理與移項法則求解和驗算，並能運用到日常生活的情境解決問題。
    code: a-IV-2
  - title: 方程式的意義
    text: 數學 A-7-2：一元一次方程式的意義：一元一次方程式及其解的意義；具體情境中列出一元一次方程式。
    code: A-7-2
  - title: 解法與應用
    text: 數學 A-7-3：一元一次方程式的解法與應用：等量公理；移項法則；驗算；應用問題。
    code: A-7-3
  checklist_title: 開始前先確認
  checklist:
  - 會整數四則
  - 會用字母記數
  notes:
  - 數學學習內容代碼中間的數字是年級，學習表現代碼中間的羅馬數字是學習階段（II 是國小中年級，IV 是國中）。
  sources:
  - math108
  - math-handbook
how:
  heading: 設、列、解、驗
  body:
  - 園遊會飲料攤：攤位費 300 元，每杯材料費 15 元，每杯賣 25 元（數字是示意）。設賣 x 杯剛好不賺不賠：收入 25x 元，支出 300 ＋ 15x 元，列出方程式 25x ＝ 300 ＋ 15x。
  - 兩邊同減 15x，得 10x ＝ 300；兩邊同除以 10，得 x ＝ 30。驗算：25 × 30 ＝ 750，300 ＋ 15 × 30 ＝ 750，兩邊相等。所以賣 30 杯剛好打平，賣到 31 杯時收入 775 元、支出 765 元，開始有賺（數字是示意）。
  qa:
    question: 為什麼方程式兩邊同時做一樣的事，等號還會成立？
    answer: 等號表示兩邊一樣多，像天平兩邊平衡；兩邊同加、同減同一個數，或同乘、同除以同一個不是 0 的數，兩邊還是一樣多，這就是等量公理（說明是本站整理）。課程手冊說「等量公理為移項法則的基礎。」
    source: math-handbook
  items_title: 解題四步
  items:
  - title: 設未知數
    text: 用 x 代表要求的數。
  - title: 列方程式
    text: 收入 ＝ 支出，寫成等式。
  - title: 等量公理求解
    text: 兩邊同減、同除，算出 x。
  - title: 驗算
    text: 把 x 代回原式，兩邊相等。
  checklist_title: 每題做完勾一下
  checklist:
  - 寫了設 x
  - 列出等式
  - 兩邊同時做
  - 代回驗算
  activity_figure: algebra-flow
  sources:
  - math-handbook
what:
  heading: 列得出，也驗得了
  body:
  - 學完後，孩子能把生活情境寫成一元一次方程式，用等量公理或移項法則求解，再把解代回原式驗算，並說出解在情境裡的意思。
  items_title: 學完能做到
  items:
  - title: 列出方程式
    text: 設未知數，寫成等式。
  - title: 解出答案
    text: 用等量公理或移項。
  - title: 驗算並解釋
    text: 代回原式，說出意思。
  checklist_title: 家長檢核
  checklist:
  - 列式正確
  - 解正確
  - 驗算相等
  figures:
  - algebra-compare
  notes:
  - 本頁的金額和杯數是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - math-handbook
  - genai-student
