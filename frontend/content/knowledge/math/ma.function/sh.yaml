why:
  heading: 看懂按比例成長
  body:
  - 課程手冊建議「透過生活中、故事裡或寓言式的例子，讓學生感受指數的成長或衰退。」指數成長一開始看起來很慢，後來卻快得出乎意料，靠直覺很容易猜錯。
  - 十一年級 A 類的數學要學「指數函數及其圖形，按比例成長或衰退的數學模型」，手冊也建議「透過實例說明指數函數、對數函數在科學（例如：pH 值或地震規模…）和金融上的應用（例如：利率問題…）。」本頁的應用例子是金融的利率問題。
  items_title: 數學領綱的學習重點
  items:
  - title: 指數對數函數
    text: 數學 f-V-4：認識指數與對數函數的圖形特徵，理解其特徵的意義，認識以指數函數為數學模型的成長或衰退現象，並能用以溝通和解決問題。
    code: f-V-4
  - title: 指數與對數函數
    text: 數學 F-11A-4：指數與對數函數：指數函數及其圖形，按比例成長或衰退的數學模型，常用對數函數的圖形，在科學和金融上的應用。
    code: F-11A-4
