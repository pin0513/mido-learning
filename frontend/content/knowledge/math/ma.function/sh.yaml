how:
  heading: 加固定量和乘固定倍
  body:
  - 對摺：紙厚 0.01 公分，每摺一次厚度乘 2，摺 n 次的厚度是 0.01 × 2ⁿ 公分，這是以次數為輸入的指數函數。摺 10 次是 0.01 × 1,024 ＝ 10.24 公分（數字是示意）。
  - 超過 1 公里（100,000 公分）要 2ⁿ ＞ 10,000,000 ＝ 10⁷。用計算機的 log 鍵：log 2 ≈ 0.3010，兩邊取常用對數得 0.3010 × n ＞ 7，n ＞ 7 ÷ 0.3010 ≈ 23.3，所以要摺 24 次。驗算：2²³ ＝ 8,388,608 還不到 10⁷，2²⁴ ＝ 16,777,216 超過了（說明是本站整理）。
  - 存款：本金 10,000 元、年利率 5%（示意）。單利每年加 500 元，20 年後是 20,000 元；複利每年乘 1.05，20 年後是 10,000 × 1.05²⁰ ≈ 26,533 元。在方格紙上描點，單利是一條直線，複利是越來越陡的曲線。
  qa:
    question: 一張厚 0.01 公分的紙如果能一直對摺，摺幾次會超過 1 公里？先猜再算。
    answer: 24 次。摺 n 次厚 0.01 × 2ⁿ 公分，要超過 100,000 公分就要 2ⁿ ＞ 10⁷，用 log 2 ≈ 0.3010 算出 n ＞ 23.3（說明是本站整理）。課程手冊的釋例也從「將一張厚度0.01 公分且足夠大的紙，對摺 10 次的厚度為幾公分？」問起。
    source: math-handbook
  items_title: 三步看懂
  items:
  - title: 寫成函數
    text: 次數當輸入，結果當輸出。
  - title: 看成長方式
    text: 每次加固定量，或乘固定倍數。
  - title: 用 log 算次數
    text: 把次方換成乘法來比。
  checklist_title: 每次做完勾一下
  checklist:
  - 寫出厚度函數
  - 算出 10 次厚度
  - 用 log 解次數
  - 比較單利複利
