what:
  heading: 看出成長，算出次數
  body:
  - 學完後，孩子能把按比例成長寫成指數函數，分辨每次加固定量和每次乘固定倍數，並用常用對數算出要經過幾次才超過某個大小。
  items_title: 學完能做到
  items:
  - title: 寫出指數函數
    text: 例如 0.01 × 2ⁿ。
  - title: 分辨兩種成長
    text: 單利是直線，複利是曲線。
  - title: 用對數解次數
    text: 算出要幾次才超過。
  checklist_title: 家長檢核
  checklist:
  - 函數寫對
  - 次數算對
  - 說出兩種差別
  figures:
  - function-compare
  notes:
  - 本頁的紙厚、金額和利率都是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - math-handbook
  - genai-student
