  exercise: 目標：用指數函數寫出對摺厚度和複利本利和，說出它和每次加固定量的差別，並用計算機的 log 鍵算出要摺幾次（數字是示意）。　檢核：孩子算出本頁對摺 10 次的厚度 10.24 公分、超過 1 公里要摺 24 次，並說出單利 20,000 元和複利約 26,533 元哪個是每年加固定量、哪個是每年乘固定倍數；三件事都對（數字是示意）。
