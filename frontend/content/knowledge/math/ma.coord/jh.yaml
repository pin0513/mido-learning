  exercise: 目標：把兩種收費方案寫成兩個一次式，列表描點畫出兩條直線，讀出交點並說出它在生活中的意思。　檢核：孩子用本頁兩個方案列表、描點、畫出兩條直線，讀出交點 (50, 300)，並說出通話少於、多於 50 分鐘時各選哪個方案；四件事都對（數字是示意）。
