idea: 把兩個量的關係畫在坐標平面上，就看得見變化。每多一單位都增加固定的量，畫出來是一條直線；兩條直線的交點，是兩邊剛好一樣的地方。
guiding_questions:
- 兩條線的交點，在生活中代表什麼？
scenario: 比較兩種手機方案（月租不同、每分鐘費率不同），畫成兩條直線，找出交點代表的意義（本站整理）。
