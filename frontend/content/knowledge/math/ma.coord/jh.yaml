est_time:
  school: 國中七、八年級數學課
  source: math108
why:
  heading: 把關係畫成圖
  body:
  - 數學課程手冊說，七年級要「能運用直角坐標來標定位置」；八年級學一次函數的圖形，手冊也說「理解正比關係也是函數的一種。」
  - 兩條直線的交點有意義：手冊說兩個二元一次方程式的解，「對應到直角坐標平面上的兩條直線之交點」，而且「在國中階段僅處理二元一次聯立方程式恰有一個解的情況。」
  items_title: 數學領綱的學習重點
  items:
  - title: 直角坐標
    text: 數學 g-IV-1：認識直角坐標的意義與構成要素，並能報讀與標示坐標點，以及計算兩個坐標點的距離。
    code: g-IV-1
  - title: 一次函數
    text: 數學 f-IV-1：理解常數函數和一次函數的意義，能描繪常數函數和一次函數的圖形，並能運用到日常生活的情境解決問題。
    code: f-IV-1
  - title: 一次函數的圖形
    text: 數學 F-8-2：一次函數的圖形：常數函數的圖形；一次函數的圖形。
    code: F-8-2
  - title: 交點的幾何意義
    text: 數學 g-IV-2：在直角坐標上能描繪與理解二元一次方程式的直線圖形，以及二元一次聯立方程式唯一解的幾何意義。
    code: g-IV-2
  checklist_title: 開始前先確認
  checklist:
  - 會描坐標點
  - 會代入算式
  notes:
  - 數學學習內容代碼中間的數字是年級，學習表現代碼中間的羅馬數字是學習階段（II 是國小中年級，IV 是國中）。
  sources:
  - math108
  - math-handbook
how:
  heading: 列表、描點、找交點
  body:
  - 設通話 x 分鐘、月費 y 元。方案 A 月租 200 元、每分鐘 2 元：y ＝ 200 ＋ 2x；方案 B 月租 100 元、每分鐘 4 元：y ＝ 100 ＋ 4x（數字是示意）。x ＝ 0、50、100 時，A 是 200、300、400，B 是 100、300、500。描點連線，兩個都是直線，因為每多 1 分鐘，費用都增加固定的錢（本站整理）。
  - 兩條直線交在 (50, 300)：通話 50 分鐘時，兩個方案都是 300 元。也可以列式驗算：200 ＋ 2x ＝ 100 ＋ 4x，得 x ＝ 50。交點左邊 B 的線比較低，少於 50 分鐘選 B；右邊 A 比較低，多於 50 分鐘選 A（數字是示意）。
  qa:
    question: 兩條線的交點，在生活中代表什麼？
    answer: 代表兩邊剛好一樣的時候：兩個方案在這個通話時間花的錢一樣多。交點左右兩邊，哪一條線比較低，那個方案就比較便宜（說明是本站整理）。課程手冊說，兩個方程式的解「對應到直角坐標平面上的兩條直線之交點」。
    source: math-handbook
  items_title: 比較方案四步
  items:
  - title: 寫成一次式
    text: 月費 ＝ 月租 ＋ 每分鐘費率 × 分鐘。
  - title: 列表描點
    text: 取幾個 x，算出 y 再描點。
  - title: 畫出直線
    text: 兩個方案各畫一條直線。
  - title: 讀交點
    text: 說出交點和兩邊各選誰。
  checklist_title: 每次做完勾一下
  checklist:
  - 兩式都寫對
  - 描點正確
  - 畫出兩條線
  - 讀出交點
  activity_figure: coord-flow
  sources:
  - math-handbook
what:
  heading: 讀懂交點，做出選擇
  body:
  - 學完後，孩子能把兩種收費方案寫成一次式，在坐標平面上畫出兩條直線，讀出交點，並說出在交點左右兩邊各該選哪一個方案。
  items_title: 學完能做到
  items:
  - title: 寫出一次式
    text: 把收費寫成 y 和 x 的關係。
  - title: 畫出直線
    text: 列表描點畫兩條線。
  - title: 解讀交點
    text: 說出交點和怎麼選。
  checklist_title: 家長檢核
  checklist:
  - 式子正確
  - 圖畫對
  - 選擇說得通
  figures:
  - coord-compare
  notes:
  - 本頁的月租、費率都是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - math-handbook
  - genai-student
