why:
  heading: 描述會重複的變化
  body:
  - 數學領綱十年級把正弦、餘弦、正切從銳角「推廣至廣義角」，十一年級再學三角函數的圖形與「週期現象的數學模型」。
  - 課程手冊說，十一年級 B 類要讓學生「了解函數的週期性就是一種模式的反覆出現。」
  items_title: 數學領綱的學習重點
  items:
  - title: 三角比
    text: 數學 s-V-1：理解三角比的意義，熟練其彼此關係與運算操作，能靈活應用於等式或函數，並能用以推論及解決問題。
    code: s-V-1
  - title: 三角函數圖形
    text: 數學 f-V-3：認識三角函數的圖形特徵，理解其特徵的意義，認識以正弦函數為數學模型的週期性現象，並能用以溝通和解決問題。
    code: f-V-3
  - title: 廣義角三角比
    text: 數學 G-10-6：三角比：定義銳角的正弦、餘弦、正切，推廣至廣義角的正弦、餘弦、正切，特殊角的值，使用計算機的sin, cos, tan 鍵。
    code: G-10-6
  - title: 週期性數學模型
    text: 數學 F-11B-1：週期性數學模型：正弦函數的圖形、週期性，其振幅、週期與頻率，週期性現象的範例。
    code: F-11B-1
  checklist_title: 開始前先確認
  checklist:
  - 會銳角三角比
  - 會用計算機
  notes:
  - 數學學習內容代碼中間的數字是年級（10 是高一；11A、11B 是十一年級的 A、B 兩類），學習表現代碼中間的 V 是第五學習階段（普通型高中）。
  sources:
