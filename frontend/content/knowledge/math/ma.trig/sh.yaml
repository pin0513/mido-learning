idea: 三角函數從直角三角形的比例出發，延伸成描述「重複變化」的工具：摩天輪、潮汐、聲波。
guiding_questions:
  - 為什麼一天的氣溫變化看起來像波浪？
scenario: 記錄摩天輪車廂高度隨時間的變化，畫出波形；用手機 App 看自己聲音的波形。
