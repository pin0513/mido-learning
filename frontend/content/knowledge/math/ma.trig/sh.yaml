how:
  heading: 從圓到波
  body:
  - 車廂繞中心轉了角度 θ（從正右方開始，逆時針量），它比中心高 10 × sin θ 公尺，所以離地高度是 12 ＋ 10 × sin θ。用計算機的 sin 鍵：sin 30° ＝ 0.5，高 17 公尺；sin 90° ＝ 1，高 22 公尺；sin 210° ＝ −0.5，高 7 公尺；sin 270° ＝ −1，高 2 公尺（數字是示意）。
  - 轉一圈 8 分鐘，每 40 秒轉 30 度。在方格紙上把時間當橫軸、高度當縱軸描點連起來，得到一條在 2 到 22 公尺之間上下的平滑曲線：每 8 分鐘重複一次（週期），最高、最低離中間值 12 公尺都是 10 公尺（振幅）。這就是正弦波（說明是本站整理）。
  qa:
    question: 摩天輪車廂的高度隨時間變化，畫出來為什麼像波浪？
    answer: 因為轉動一直重複：每轉一圈，高度就照同樣的順序從中間升到最高、降到最低、再回到中間，所以圖形一段一段重複，像波浪；它的形狀是正弦波，不是半圓接起來（說明是本站整理）。課程手冊提醒，學生會「誤以為正弦函數是由一些半圓弧連接而成。」
    source: math-handbook
  items_title: 從角度到圖形
  items:
  - title: 算高度
    text: 12 ＋ 10 × sin θ。
  - title: 描點
    text: 時間當橫軸，高度當縱軸。
  - title: 讀週期和振幅
    text: 8 分鐘、10 公尺。
  checklist_title: 每次做完勾一下
  checklist:
  - 算出 4 個高度
  - 描點連線
  - 讀出週期
  - 讀出振幅
  activity_figure: trig-flow
  sources:
  - math-handbook
what:
  heading: 讀懂週期與振幅
  body:
  - 學完後，孩子能用廣義角的正弦算出繞圓轉動的點的高度，畫出高度隨時間的圖，讀出週期和振幅，並說明為什麼重複的轉動會畫出正弦波。
  items_title: 學完能做到
  items:
  - title: 算出高度
    text: 用計算機的 sin 鍵。
  - title: 畫出圖形
    text: 在方格紙上描點。
  - title: 讀出特徵
    text: 週期 8 分鐘、振幅 10 公尺。
  checklist_title: 家長檢核
  checklist:
  - 高度算對
  - 圖形畫對
  - 週期振幅對
  figures:
  - trig-compare
  notes:
  - 本頁的摩天輪尺寸和轉速是示意。
  - 預告：十一年級學三角函數時，角度改用弧度（弳），本頁的高度會寫成 h ＝ 12 ＋ 10 sin(πt/4)，t 的單位是分鐘；本頁不教弧度（數字是示意，說明是本站整理）。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - math-handbook
  - genai-student
