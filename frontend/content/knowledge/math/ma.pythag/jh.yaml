why:
  heading: 量不完，就要證明
  body:
  - 數學課程手冊說，畢氏定理是「直角三角形斜邊長的平方等於兩股的平方和」，要透過摺紙、剪紙或計算面積「等多樣的活動介紹畢氏定理，認識它的證明與推理過程」。
  - 這個關係很早就有記載：手冊說，中國古老的數學書《周髀算經》裡「有一段周公和商高的對話」，商高提到勾三、股四、弦五。
  items_title: 數學領綱的學習重點
  items:
  - title: 畢氏定理與逆敘述
    text: 數學 s-IV-7：理解畢氏定理與其逆敘述，並能應用於數學解題與日常生活的問題。
    code: s-IV-7
  - title: 畢氏定理
    text: 數學 S-8-6：畢氏定理：畢氏定理（勾股弦定理、商高定理）的意義及其數學史；畢氏定理在生活上的應用；三邊長滿足畢氏定理的三角形必定是直角三角形。
    code: S-8-6
  checklist_title: 開始前先確認
  checklist:
  - 會算正方形面積
  - 會算平方
  notes:
  - 數學學習內容代碼中間的數字是年級，學習表現代碼中間的羅馬數字是學習階段（II 是國小中年級，IV 是國中）。
  sources:
  - math108
  - math-handbook
how:
  heading: 拼出證明，拉出直角
  body:
  - 剪 4 個全等的直角三角形，兩股 a、b，斜邊 c。在邊長 a ＋ b 的大正方形裡用兩種方式擺：第一種中間空出一個邊長 c 的正方形；第二種空出邊長 a 和 b 的兩個正方形。大正方形一樣大、4 個三角形也一樣，所以空出的面積相等：c² ＝ a² ＋ b²（本站整理）。
  - 手冊說「三角形的三邊長滿足畢氏定理必定是直角三角形。」繩子等距打結，拉成 3、4、5 段的三角形，3² ＋ 4² ＝ 9 ＋ 16 ＝ 25 ＝ 5²，所以 3 和 4 夾的角是直角。手冊也提醒「學生習慣背誦3，4，5」：要先看哪一邊是斜邊，例如兩股 6、8 的斜邊是 10（36 ＋ 64 ＝ 100）。
  qa:
    question: 量了 100 個三角形都成立，和證明它成立，有什麼不同？
    answer: 量再多個也只檢查了那些三角形，而且量會有誤差；證明用的是每個直角三角形都有的面積關係，所以對所有直角三角形都成立（說明是本站整理）。課程手冊要學生「認識它的證明與推理過程」。
    source: math-handbook
  items_title: 證明與應用
  items:
  - title: 剪三角形
    text: 剪 4 個全等的直角三角形。
  - title: 兩種擺法
    text: 空出 c² 或 a² 和 b²。
  - title: 算斜邊
    text: 兩股平方相加，再找哪個數的平方。
  - title: 拉出直角
    text: 3、4、5 繩結（逆敘述）。
  checklist_title: 每次做完勾一下
  checklist:
  - 兩種都擺出
  - 說明面積相等
  - 先找出斜邊
  - 用了逆敘述
  activity_figure: pythag-flow
  sources:
  - math-handbook
what:
  heading: 說得出為什麼成立
  body:
  - 學完後，孩子能用拼圖說明畢氏定理為什麼成立，用它從兩股算出斜邊，並用逆敘述說明三邊 3、4、5 的三角形是直角三角形。
  items_title: 學完能做到
  items:
  - title: 拼圖證明
    text: 說明兩種擺法面積相等。
  - title: 算出斜邊
    text: 兩股平方和等於斜邊平方。
  - title: 判斷直角
    text: 三邊滿足定理就是直角。
  checklist_title: 家長檢核
  checklist:
  - 證明說得通
  - 斜邊算對
  - 直角說對
  figures:
  - pythag-compare
  notes:
  - 本頁的邊長是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - math-handbook
  - genai-student
