why:
  heading: 從猜想到證明
  body:
  - 課程手冊說，數學歸納法「應先透過觀察發現規律，然後用以證明」，因為「觀察有限項所做的臆測，不見得正確，需經過驗證的過程才能確認其正確性」。
  - 數學領綱的高中核心素養也要學生「了解數學在觀察歸納之後還須演繹證明的思維特徵及其價值。」
  items_title: 數學領綱的學習重點
  items:
  - title: 數學歸納法
    text: 數學 n-V-5：能察覺規律並以一般項或遞迴方式表現，進而熟悉級數的操作。理解數學歸納法的意義，並能用於數學論證。
    code: n-V-5
  - title: 數列與歸納法
    text: 數學 N-10-6：數列、級數與遞迴關係：有限項遞迴數列，有限項等比級數，常用的求和公式，數學歸納法。
    code: N-10-6
  checklist_title: 開始前先確認
  checklist:
  - 會展開平方
  - 會用字母寫式子
  notes:
  - 數學學習內容代碼中間的數字是年級（10 是高一；11A、11B 是十一年級的 A、B 兩類），學習表現代碼中間的 V 是第五學習階段（普通型高中）。
  sources:
  - math108
  - math-handbook
how:
  heading: 先猜規律，再證兩步
  body:
  - 先觀察：1 ＝ 1²，1 ＋ 3 ＝ 4 ＝ 2²，1 ＋ 3 ＋ 5 ＝ 9 ＝ 3²，1 ＋ 3 ＋ 5 ＋ 7 ＝ 16 ＝ 4²，猜前 n 個奇數的和是 n²。用積木看：k × k 的正方形外面補一圈 L 形的 2k ＋ 1 塊，就變成 (k ＋ 1) × (k ＋ 1)。但只看例子不夠：n² − n ＋ 41 在 n ＝ 1 到 40 都是質數，n ＝ 41 時卻等於 41²，不是質數（例子是本站整理）。
  - 再證明。第一步：n ＝ 1 時左邊是 1、右邊是 1²，成立。第二步：假設 n ＝ k 時 1 ＋ 3 ＋ … ＋ (2k − 1) ＝ k² 成立，兩邊加上下一個奇數 2k ＋ 1，得 k² ＋ 2k ＋ 1 ＝ (k ＋ 1)²，所以 n ＝ k ＋ 1 也成立。兩步合起來，就對所有正整數 n 都成立，像骨牌一塊推倒下一塊。
  qa:
    question: 數學歸納法是「歸納」還是「演繹」？
    answer: 名字裡有歸納，但它是演繹證明：觀察例子、猜出規律是歸納，只能當猜想；用第一步和第二步推出所有情形都成立，才是證明（說明是本站整理）。課程手冊說學生應「瞭解歸納思維的侷限性並能應用演繹思維來論證所得結果之正確性。」
    source: math-handbook
  items_title: 歸納法兩步
  items:
  - title: 第一步
    text: 證明 n ＝ 1 成立。
  - title: 第二步
    text: 假設 n ＝ k 成立，推到 k ＋ 1。
  - title: 下結論
    text: 對所有正整數都成立。
  checklist_title: 每次做完勾一下
  checklist:
  - 先算幾個例子
  - 寫出第一步
  - 寫出第二步
  - 寫出結論
  activity_figure: proof-flow
  sources:
  - math-handbook
what:
  heading: 會猜，也會證
  body:
  - 學完後，孩子能從例子猜出規律，用數學歸納法的兩步寫出完整證明，並說明只看有限個例子為什麼還不能下結論。
  items_title: 學完能做到
  items:
  - title: 猜出規律
    text: 從例子寫出 n 的式子。
  - title: 寫出證明
    text: 第一步加第二步。
  - title: 說出差別
    text: 例子只是猜想，證明才確定。
  checklist_title: 家長檢核
  checklist:
  - 猜想寫對
  - 兩步都有
  - 說出差別
  figures:
  - proof-compare
  notes:
  - 本頁的例子是本站整理。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - math-handbook
  - genai-student
