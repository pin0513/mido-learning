idea: 數學歸納法像推骨牌：證明第一塊會倒，也證明每一塊倒了會推倒下一塊，就知道全部都會倒。
guiding_questions:
  - 數學歸納法是「歸納」還是「演繹」？
scenario: 用骨牌示範，再證明 1 + 3 + 5 + …… 的前 n 項和等於 n²，連回國小的積木圖形。
