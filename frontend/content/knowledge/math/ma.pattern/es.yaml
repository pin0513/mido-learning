idea: 很多東西藏著規律：數字、圖形、節奏。找到規律，就能預測下一個；用 □ 代表不知道的數，就是代數的開始。
guiding_questions:
  - 你怎麼確定第 100 個也會照這個規律？
scenario: 用積木排出 1、3、5、7……的圖形，預測第 10 個要幾塊；用拍手節奏做出規律讓同學猜。
