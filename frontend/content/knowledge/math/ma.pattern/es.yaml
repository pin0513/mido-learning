est_time:
  school: 國小三、四年級數學課
  source: math108
why:
  heading: 看出規律，說出理由
  body:
  - 數學課程手冊說「模式的察覺是科學的起步」。三年級學的是一維的變化，重點是察覺、說明和簡單推理：手冊說「不可要求學生用公式來表示規律」，「也不要求學生做許多步（例如超過三步）的預測。」
  - 四年級再學奇數與偶數：手冊說學生要「能說明為什麼偶數與偶數的和或奇數與奇數的和一定是偶數」，而且「這類活動不能只靠直式計算特例」。
  items_title: 數學領綱的學習重點
  items:
  - title: 數量模式與推理
    text: 數學 r-II-2：認識一維及二維之數量模式，並能說明與簡單推理。
    code: r-II-2
  - title: 一維變化模式
    text: 數學 R-3-2：數量模式與推理（I）：以操作活動為主。一維變化模式之觀察與推理，例如數列、一維圖表等。
    code: R-3-2
  - title: 奇數與偶數
    text: 數學 R-4-4：數量模式與推理（II）：以操作活動為主。二維變化模式之觀察與推理，如二維數字圖之推理。奇數與偶數，及其加、減、乘模式。
    code: R-4-4
  checklist_title: 開始前先確認
  checklist:
  - 會數到一百
  - 會兩位數加法
  notes:
  - 數學學習內容代碼中間的數字是年級，學習表現代碼中間的羅馬數字是學習階段（II 是國小中年級，IV 是國中）。
  sources:
  - math108
  - math-handbook
how:
  heading: 接下一個，再說為什麼
  body:
  - 先玩節奏：家長拍「拍、拍、停、拍、拍、停」，孩子接下一拍。再用火柴棒連著排三角形，用表格記下支數：1 個三角形 3 支、2 個 5 支、3 個 7 支、4 個 9 支，猜第 5 個要 11 支（支數依課程手冊的火柴棒例子）；理由是每多一個三角形，和前一個共用一邊，只多 2 支（本站整理）。
  - 奇數加奇數：用積木排成兩個一排，奇數會多出一塊；兩個奇數放在一起，多出的兩塊剛好湊成一排，所以和一定是偶數（本站整理）。手冊用圖示說明「奇數與奇數的和一定是偶數。」
  qa:
    question: 同一串數，可能有不只一種規律嗎？
    answer: 可能。課程手冊說一維模式的觀察是一種歸納，「規則並非只有一種」，「若學生對於變化的規律見解不同，應請學生說明，合理者皆應鼓勵。」例如 1、2、4 後面可以接 8（每次乘以 2），也可以接 7（依序多 1、多 2、多 3）（例子是本站整理）。
    source: math-handbook
  items_title: 找規律四步
  items:
  - title: 接下一個
    text: 看節奏或圖形，接出下一個。
  - title: 用表格記
    text: 記下每個圖形用了幾支火柴棒。
  - title: 說出理由
    text: 說出每次多幾個、為什麼。
  - title: 奇偶配對
    text: 積木兩個一排，看會不會多出一塊。
  checklist_title: 每次做完勾一下
  checklist:
  - 接對下一個
  - 表格有記錄
  - 說出了理由
  activity_figure: pattern-flow
  sources:
  - math-handbook
what:
  heading: 猜得出，也說得出
  body:
  - 學完後，孩子能從節奏、圖形和數列找出規律，猜出下一個並說出理由，也能用積木說明為什麼奇數加奇數一定是偶數。
  items_title: 學完能做到
  items:
  - title: 猜下一個
    text: 從規律接出下一個。
  - title: 說出理由
    text: 說出每次怎麼變。
  - title: 說明奇偶
    text: 說明奇數加奇數是偶數。
  checklist_title: 家長檢核
  checklist:
  - 下一個猜對
  - 理由說得通
  - 奇偶說明對
  figures:
  - pattern-compare
  notes:
  - 本頁的支數依課程手冊的火柴棒例子；其他數字是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - math-handbook
  - genai-student
