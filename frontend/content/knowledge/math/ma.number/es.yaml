idea: 數學不只是算對，還要有「大概有多少」的感覺。先估再數，估得越來越準，就是數感。
guiding_questions:
  - 不用一顆一顆數，有什麼方法可以知道大概有多少？
scenario: 估一罐豆子有幾顆：先猜，再數 50 顆的高度，用「一份有多少」推估全部，最後真的數一次。
