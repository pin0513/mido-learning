why:
  heading: 估一估，培養數感
  body:
  - 數學領綱第二學習階段（國小三、四年級）的目標是「在數方面，能確實掌握自然數的四則與混合運算，培養流暢的數字感，並初步學習分數與小數的概念。」
  - 數學課程手冊說「學生能正確做估算，可以提升學生的數感。」，而且估算有時機：「確算不好算或沒有必要尋求確算答案時，才是估算的時機。」
  items_title: 數學領綱的學習重點
  items:
  - title: 四則估算
    text: 數學 n-II-4：解決四則估算之日常應用問題。
    code: n-II-4
  - title: 估算策略
    text: 數學 N-3-8：解題：四則估算。具體生活情境。較大位數之估算策略。能用估算檢驗計算結果的合理性。
    code: N-3-8
  - title: 取概數與≈
    text: 數學 N-4-4：解題：對大數取概數。具體生活情境。四捨五入法、無條件進入、無條件捨去。含運用概數做估算。近似符號「≈」的使用。
    code: N-4-4
  checklist_title: 開始前先確認
  checklist:
  - 會數到一千
  - 會乘以一位數
  notes:
  - 數學學習內容代碼中間的數字是年級，學習表現代碼中間的羅馬數字是學習階段（II 是國小中年級，IV 是國中）。
  sources:
  - math108
  - math-handbook
how:
  heading: 數一小份，再乘出全部
  body:
  - 先讓孩子猜一罐豆子有幾顆，寫下來。再數出 100 顆裝進一個小杯，看全罐可以裝滿幾杯；例如大約 6 杯，就用 100 × 6 ＝ 600，估計全罐大約 600 顆，寫成「≈ 600 顆」（數字是示意）。
  - 最後真的數一次，例如數出 587 顆；把 587 四捨五入到百位是 600，和估計一樣（數字是示意）。課程手冊說概數是「大概準確的數字，捨棄數字中較小位數的部分。」，也提醒「用概數做計算時，應只用四捨五入法。」
  qa:
    question: 不用一顆一顆數，有什麼方法可以知道大概有多少？
    answer: 先數出一小份，看全部大約是幾份，再用乘法估（本站整理）。課程手冊說，當確算不好算或沒有必要時，「才是估算的時機」；估完再真的數一次，就知道自己估得準不準。
    source: math-handbook
  items_title: 估算四步
  items:
  - title: 先數一小份
    text: 數出 100 顆裝一小杯（數字是示意）。
  - title: 數有幾份
    text: 看全罐大約裝滿幾杯。
  - title: 用乘法估
    text: 杯數乘以 100，用 ≈ 寫出估計。
  - title: 真的數
    text: 結果四捨五入到百位，和估計比一比。
  checklist_title: 每次做完勾一下
  checklist:
  - 先寫下猜測
  - 數了一小份
  - 寫出≈估計
  - 真的數一次
  activity_figure: number-flow
  sources:
  - math-handbook
what:
  heading: 先估再數，比一比
  body:
  - 學完後，孩子能先數一小份，用乘法估出大概有多少並用「≈」寫下來，再真的數，把結果四捨五入到百位，和估計比一比。
  items_title: 學完能做到
  items:
  - title: 估出大概
    text: 用一小份和乘法估全部。
  - title: 寫出近似
    text: 用 ≈ 寫估計。
  - title: 檢查估計
    text: 數完四捨五入，比一比。
  checklist_title: 家長檢核
  checklist:
  - 說得出怎麼估
  - 估計有寫≈
  - 四捨五入正確
  figures:
  - number-compare
  notes:
  - 本頁的顆數、杯數都是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - math-handbook
  - genai-student
