est_time:
  school: 國小三、四年級數學課
  source: math108
why:
  heading: 整理資料，一眼看懂
  body:
  - 數學課程手冊說「長條圖常用來表示不同分類數量的多寡，並進行比較，是最簡單的統計圖。」也說「製作統計圖的目的是與他人溝通」。
  - 三年級先學表格：手冊說「一維表格通常表示考慮的因素只有一個」；四年級學報讀長條圖、折線圖，並製作長條圖。
  items_title: 數學領綱的學習重點
  items:
  - title: 表格與長條圖
    text: 數學 d-II-1：報讀與製作一維表格、二維表格與長條圖，報讀折線圖，並據以做簡單推論。
    code: d-II-1
  - title: 一維與二維表格
    text: 數學 D-3-1：一維表格與二維表格：以操作活動為主。報讀、說明與製作生活中的表格。二維表格含列聯表。
    code: D-3-1
  - title: 長條圖與折線圖
    text: 數學 D-4-1：報讀長條圖與折線圖以及製作長條圖：報讀與說明生活中的長條圖與折線圖。配合其他領域課程，學習製作長條圖。
    code: D-4-1
  checklist_title: 開始前先確認
  checklist:
  - 會畫正字記號
  - 會用尺畫線
  notes:
  - 數學學習內容代碼中間的數字是年級，學習表現代碼中間的羅馬數字是學習階段（II 是國小中年級，IV 是國中）。
  sources:
  - math108
  - math-handbook
how:
  heading: 從畫記到長條圖
  body:
  - 先調查：每個人選一種最喜歡的水果，只記水果和票數，不寫名字（本站建議）。用畫記數完，整理成一維表格，例如蘋果 9 票、葡萄 7 票、香蕉 5 票、芭樂 0 票（數字是示意）。
  - 再畫長條圖：手冊說要「清楚標示出統計圖之基本元件：圖表名稱、軸、分類組別、數量軸的單位」；每一格代表 1 票，長條越高票越多。手冊也說「長條圖和折線圖都是以長度表示數量的多寡而非面積。」最後讀圖：最多的是蘋果，同樂會就先買蘋果（本站整理）。
  qa:
    question: 有一種水果得 0 票，長條圖上要不要畫出來？
    answer: 要。課程手冊說「當某些組別資料為 0 時，仍須呈現在統計圖，有些學生可能會忽略。」芭樂 0 票，也要在橫軸寫上芭樂，只是長條高度是 0，大家才看得出「有人問過，但沒人選」（說明是本站整理）。
    source: math-handbook
  items_title: 畫長條圖四要素
  items:
  - title: 圖表名稱
    text: 例如：最喜歡的水果。
  - title: 兩條軸
    text: 橫軸放分類，縱軸放數量。
  - title: 分類組別
    text: 每種水果一條，0 票也要列。
  - title: 數量的單位
    text: 縱軸寫上單位：票。
  checklist_title: 每次畫完勾一下
  checklist:
  - 有圖表名稱
  - 兩軸都有標
  - 0 票也畫了
  - 寫了單位
  activity_figure: data-flow
  sources:
  - math-handbook
what:
  heading: 畫出長條圖做決定
  body:
  - 學完後，孩子能把調查整理成一維表格，畫出有圖名、兩軸、分類和單位的長條圖，從圖說出最多和最少的是哪一項，並用來做決定。
  items_title: 學完能做到
  items:
  - title: 整理成表格
    text: 畫記後整理成一維表格。
  - title: 畫長條圖
    text: 四要素都有。
  - title: 讀圖做決定
    text: 說出最多、最少。
  checklist_title: 家長檢核
  checklist:
  - 表格正確
  - 四要素都有
  - 說出最多最少
  figures:
  - data-compare
  notes:
  - 本頁的票數是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - math-handbook
  - genai-student
