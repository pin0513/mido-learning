idea: 矩陣可以看成把向量變成向量的函數：旋轉、縮放都能寫成矩陣乘向量，接連做兩個變換就是兩個矩陣相乘。資料也能寫成一串數字（向量），兩個向量夾角的餘弦可以衡量它們有多像。
guiding_questions:
- 電腦怎麼知道兩句話的意思很像？
- 把一個圖形轉 90 度，可以用一個矩陣表示嗎？
scenario: 在方格紙上畫一個 L 形（點 (0, 0)、(1, 0)、(0, 2)），用矩陣把它轉 90 度、放大 2 倍；再把三個短句寫成字數向量，算它們兩兩的餘弦相似度（數字是示意，本站整理）。
formats:
  slides: []
  exercise: 目標：用 2 × 2 矩陣算出 L 形旋轉和放大後的位置，並用字數向量算出兩個短句的餘弦相似度，說明 AI 用的向量和自己數的有什麼不同（數字是示意）。　檢核：不看本頁，自己算出 (0, 2) 轉 90 度後是 (−2, 0)、句子 A 和 B 的餘弦相似度是 2/3，並說出 AI 的嵌入向量是模型學出來的；三件事都對（數字是示意）。
