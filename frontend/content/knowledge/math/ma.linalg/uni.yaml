why:
  heading: 矩陣是一種函數
  body:
  - Interactive Linear Algebra 的學習目標是「Learn to view a matrix geometrically as a function.」，並舉出「reflection, dilation, rotation, shear, projection」等矩陣變換。把矩陣看成函數，就能用幾何想像計算。
  - 高中數學 A 類已經學過「將矩陣視為資料表，用電腦做矩陣運算的觀念與示範。」和「平面上的線性變換」。大學線性代數再處理任意維度的向量和矩陣（本站整理）；機器學習也用很多維的向量表示資料，Google 的機器學習課程說「An embedding is a vector representation of data in embedding space」。
  items_title: 向量和矩陣
  items:
  - title: 向量
    text: 一串數字，可以是點，也可以是資料。
  - title: 矩陣乘向量
    text: 把向量變成另一個向量。
  - title: 餘弦相似度
    text: 看兩個向量的方向有多接近。
  checklist_title: 開始前先確認
  checklist:
  - 會算內積
  - 會算向量長度
  sources:
  - ila-mt
  - gml-emb
  - math108
how:
  heading: 轉圖形，比句子
  body:
  - 轉 90 度：逆時針轉 90 度的矩陣第一列是 (0, −1)、第二列是 (1, 0)。(1, 0) 變成 (0, 1)，(0, 2) 變成 (−2, 0)，L 形整個轉了 90 度。放大 2 倍的矩陣第一列 (2, 0)、第二列 (0, 2)；先轉再放大，等於乘上兩個矩陣的乘積，第一列 (0, −2)、第二列 (2, 0)（說明是本站整理）。
  - 字數向量：只數貓、喜歡、魚、老鼠四個詞各出現幾次。句子 A（貓喜歡魚）是 (1, 1, 1, 0)，B（貓喜歡老鼠）是 (1, 1, 0, 1)，C（魚和老鼠）是 (0, 0, 1, 1)。cos(A, B) ＝ 2 ÷ (√3 × √3) ＝ 2/3 ≈ 0.67，cos(A, C) ＝ 1 ÷ (√3 × √2) ≈ 0.41，所以 A 和 B 比較像（說明是本站整理）。
  - Google 的課程列出餘弦是比較兩個向量相似度的方法之一，相似度越高，餘弦越大；也說「words that are used in similar contexts will be closer to each other in embedding space」。字數向量只看用了哪些字，AI 用的是模型學出來的嵌入向量。
  qa:
    question: 電腦怎麼知道兩句話的意思很像？
    answer: 一種作法是把每句話表示成向量，再算兩個向量夾角的餘弦，越接近 1 越像。本頁用自己數的字數向量示範，A 和 B 的餘弦是 2/3（數字是示意）；AI 用的是模型學出來的嵌入向量，Google 的課程說嵌入裡「the distance between any two items can be calculated mathematically」。
    source: gml-emb
  items_title: 三步做
  items:
  - title: 寫成向量
    text: 點的坐標，或詞的次數。
  - title: 矩陣乘向量
    text: 算出變換後的位置。
  - title: 算餘弦
    text: 內積除以兩個長度。
  checklist_title: 每次做完勾一下
  checklist:
  - 轉出三個點
  - 算出乘積矩陣
  - 寫出三個向量
  - 算出兩個餘弦
  activity_figure: linalg-flow
  sources:
  - gml-sim
  - gml-emb
what:
  heading: 看懂向量和變換
  body:
  - 學完後，自己能把旋轉、縮放寫成矩陣，算出圖形變換後的位置，並用餘弦相似度比較兩筆資料，說出 AI 的嵌入向量和自己數的向量有什麼不同。
  items_title: 學完能做到
  items:
  - title: 寫出變換矩陣
    text: 旋轉、縮放、接連變換。
  - title: 算出相似度
    text: 用餘弦比較兩個向量。
  - title: 說出嵌入
    text: 模型學出來的向量。
  checklist_title: 自我檢核
  checklist:
  - 旋轉算對
  - 餘弦算對
  - 說出兩種向量
  figures:
  - linalg-compare
  notes:
  - 本頁的圖形、句子和數字是示意。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，算式和數字要自己驗算；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
  sources:
  - gml-emb
  - genai-student
