  - math108
what:
  heading: 說清楚，也算得出
  body:
  - 學完後，自己能用列表和化簡求極限，用精確定義說明要多接近都做得到，並分辨極限值和函數值：兩者相等才連續。
  items_title: 學完能做到
  items:
  - title: 求極限
    text: 列表、化簡，得到 2。
  - title: 用 ε 和 δ 說明
    text: 說出 δ 怎麼依 ε 選。
  - title: 判斷連續
    text: 函數值等於極限值。
  checklist_title: 自我檢核
  checklist:
  - 極限算對
  - δ 取對
  - 連續判斷對
  figures:
  - limit-compare
  notes:
  - 本頁的函數和數字是示意。
  - 教育部的生成式 AI 注意事項（學生版）是寫給中小學生的，其中幾條原則大學生也適用（本站建議）：不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信，算式和數字要自己驗算；作業若用了 AI，要註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊；以學校和課程的規定為準。
