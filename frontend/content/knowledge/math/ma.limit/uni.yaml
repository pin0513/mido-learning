idea: 極限把無限接近說精確：不管要求多接近，都找得到夠近的範圍做到。函數在一點連續，就是那裡的函數值等於極限值，圖形沒有斷開。
guiding_questions:
- 0.999… 等於 1 嗎？怎麼說服別人？
- 函數在某一點沒有定義，還能談它在那裡的極限嗎？
scenario: 用計算機列表，看 f(x) ＝ (x² − 1) ÷ (x − 1) 在 x 靠近 1 時的值：x ＝ 1 時沒有定義，但值越來越接近 2；再用精確定義說明為什麼（數字是示意，本站整理）。
