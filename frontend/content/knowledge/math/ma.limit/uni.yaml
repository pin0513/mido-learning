why:
  heading: 把無限接近說清楚
  body:
  - OpenStax 的微積分教科書說，極限的想法已經有幾千年，早期數學家用它逼近圓的面積，但「the formal definition of a limit—as we know and understand it today—did not appear until the late 19th century」。直覺會騙人，例如 0.999… 和 1 到底差多少，要靠精確定義才說得清楚。
  - 書中也說精確定義很難，卻是「the key that opens the door to a better understanding of calculus」。高中數學甲已經學過數列的極限和函數的極限，大學把它寫成任何人都能檢驗的定義。
  items_title: 從直覺到定義
  items:
  - title: 直覺的極限
    text: x 靠近 a 時，函數值靠近某個數。
  - title: 精確的定義
    text: 要多接近都做得到，可以檢驗。
  - title: 連續
    text: 函數值剛好等於極限值。
  checklist_title: 開始前先確認
  checklist:
  - 會化簡分式
  - 懂絕對值
  sources:
  - os-limit
  - os-precise
  - math108
how:
  heading: 列表、化簡、再檢驗
  body:
  - 列表：x ＝ 0.9、0.99、0.999 時 f(x) 是 1.9、1.99、1.999；x ＝ 1.1、1.01、1.001 時是 2.1、2.01、2.001。x ≠ 1 時 (x² − 1) ÷ (x − 1) ＝ x ＋ 1，所以 x 越靠近 1，f(x) 越靠近 2；x ＝ 1 本身沒有定義，不影響極限（說明是本站整理）。
  - 精確定義：要求 |f(x) − 2| ＜ 0.01，只要 |x − 1| ＜ 0.01（而且 x ≠ 1）就做到，因為 |f(x) − 2| ＝ |x − 1|；不管要求小於哪個正數 ε，取 δ ＝ ε 都做得到。OpenStax 說這一節要把直覺「into a formal definition using precise mathematical language」（說明是本站整理）。
  - 連續：OpenStax 的直覺說法是「a function is continuous at a particular point if there is no break in its graph at that point」。本頁的 f 在 x ＝ 1 有一個洞，補上 f(1) ＝ 2，函數就在 x ＝ 1 連續。
  qa:
    question: 0.999… 等於 1 嗎？怎麼說服別人？
    answer: 等於。0.999… 指的是 0.9、0.99、0.999… 一直下去的極限；第 n 個數和 1 差 1/10ⁿ，不管指定多小的正數，差距都能比它小，所以極限就是 1（說明是本站整理）。高中數學甲的無窮等比級數也列了「循環小數」。
    source: math108
  items_title: 三步做
  items:
  - title: 列表觀察
    text: 從兩側靠近，看值往哪裡去。
  - title: 化簡找極限
    text: x ≠ 1 時化成 x ＋ 1。
  - title: 用定義檢驗
    text: 給定 ε，找出 δ。
  checklist_title: 每次做完勾一下
  checklist:
  - 列出 6 個值
  - 化簡成 x ＋ 1
  - 說出 δ 怎麼取
  - 補上 f(1)
  activity_figure: limit-flow
