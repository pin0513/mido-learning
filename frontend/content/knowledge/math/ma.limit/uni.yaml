  exercise: 目標：用列表和化簡求出本頁函數在 x ＝ 1 的極限，用精確定義說明要多接近都做得到，並判斷怎樣補一個值讓它連續（數字是示意）。　檢核：不看本頁，自己算出極限是 2、說出要讓 |f(x) − 2| ＜ 0.01 只要 |x − 1| ＜ 0.01（而且 x ≠ 1），並說出補上 f(1) ＝ 2 就連續；三件事都對（數字是示意）。
