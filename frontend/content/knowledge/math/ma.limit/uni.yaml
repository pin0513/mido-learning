verify_notes:
- 原有待核對「課綱對應只到領域與核心素養（A1–C3）…」已處理：大學不屬於 108 課綱，本點不填 curriculum_108、不列年級；高中數學 A／B、甲／乙的相關學習內容只在 math108 來源逐字引用（含頁碼），當作先學過的內容，主要依據改用大學開放教科書。
- math108 來源裡 12 年級加深加廣選修的代碼照 PDF 寫成有空白的「12 甲」「12 乙」（如 F-12 甲-4）；含數學斜體字元的條目只引不含斜體字的一段，用刪節號表示省略。頁碼是頁腳印的頁碼（PDF 頁 − 3）。
- 英文教科書的引文取自網頁版（2026-10-29 讀取）；網頁上的數學式是 MathML，引文只取不含數學式或彎引號的句子或片段，省略處用刪節號。
- 原 scenario「用程式畫出函數在某點附近的放大圖，逐步縮小範圍，觀察極限是否存在。」改成用計算機列表，不必寫程式；例子 f(x) ＝ (x² − 1) ÷ (x − 1) 的值（x ＝ 0.9、0.99、0.999 時 1.9、1.99、1.999，x ＝ 1.1、1.01、1.001 時 2.1、2.01、2.001）、|f(x) − 2| ＝ |x − 1| 所以 δ ＝ ε、0.999… 和 1 的差 1/10ⁿ，都已驗算。
- 原 guiding question 的「0.999……」改成和 ma.sequence@sh 一致的「0.999…」。
