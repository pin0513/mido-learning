idea: 大學寫作要有清楚主張、可查的證據，並主動回應反方。引用要標明出處，自己的話和別人的話分清楚。
guiding_questions:
- 你最強的論點，最怕別人用什麼反駁？
scenario: 親子共學：就一個公共議題寫 1,500 字評論，請家人扮演反方提三個問題，再改一版。
goal: 寫一篇有主張、可查證據、並回應反方的評論。
review: 就公共議題寫 1,500 字評論，家人扮演反方提 3 個問題；改後的版本至少回應其中 2 個，所有證據都附出處。
