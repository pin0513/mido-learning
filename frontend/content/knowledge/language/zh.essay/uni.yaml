  title: AI世代的學術寫作指南⸺給研究生的參考手冊（電子書）
  publisher: 教育部臺灣學術倫理教育資源中心（手冊註明「本手冊內容僅代表作者觀點，不代表教育部立場」）
  url: https://ethics.moe.edu.tw/files/resource/ebook/file/ebook_05.pdf
  accessed: '2026-10-29'
  kind: reference
  supports: 貳 論文的結構：「大多可分為序論、文獻探討、研究方法與實施、研究發現與討論、結論與建議這五個部分」；參、四 運用生成式AI於學術與研究活動應注意事項：「研究者應對自己的研究行為與產出負全部責任」；「使用任何科技輔助軟體，都應留意相關的資訊安全及隱私問題」；「建議使用前仍應諮詢指導教授、參考相關機構的指引，並適度公開資訊，例如：在研究方法中聲明使用哪些AI工具以及如何使用」；「直接使用AI翻譯整篇論文或直接複製貼上生成資料，都不符合學術誠信的基本原則」
