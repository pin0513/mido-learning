what:
  heading: 反方不等於稻草人
  figures:
  - what-compare
  notes:
  - 寫成學術論文時，教育部臺灣學術倫理教育資源中心的指南說明論文結構「大多可分為序論、文獻探討、研究方法與實施、研究發現與討論、結論與建議這五個部分」；實際格式依課程或期刊規定。
  - 用 AI 輔助時，指南提醒「研究者應對自己的研究行為與產出負全部責任」，並建議適度公開使用情形。
  - 三根柱子與回應方式的分類是本站整理；「1,500 字」「3 個問題」「回應 2 個」是示意。
  sources:
  - ethics-guide
