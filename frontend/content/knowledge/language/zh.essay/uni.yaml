why:
  heading: 主張要有證據撐
  body:
  - UNC 寫作中心說明，學術寫作裡的論證通常是一個主要想法，也就是主張或論點，再加上支持它的證據；不同學科對可接受證據的要求也略有不同。
  - 預想反方能讓論證更強：UNC 寫作中心建議先想想讀者會怎麼反駁，並且通常深入回應一兩個重要反方，比蜻蜓點水地帶過很多個更好。
  qa:
    question: 你最強的論點，最怕別人用什麼反駁？
    answer: 先替反方想最有力的理由，並公平地寫出來；UNC 寫作中心提醒摘述反方時要「be charitable」。然後選一兩個最重要的反方深入回應，找證據說明你為什麼仍然成立，或修正你的主張。
    source: unc-argument
  items_title: 評論的三根柱子（本站整理）
  items:
  - title: 主張
    text: 一句話說出你的立場。
  - title: 證據
    text: 可查證、附出處的資料或例子。
  - title: 反方
    text: 公平寫出最有力的反對理由，再回應。
  sources:
  - unc-argument
how:
  heading: 先找反方，再改一版
  body:
  - 找反方的方法，UNC 寫作中心建議可以和朋友或老師聊，也可以想像對方會怎麼回。回應時可以說明反方哪裡不成立、承認部分有理但結論不同，或因此調整自己的立場；如果反方改變了你的看法，就回頭修改原本的論證。
  - 請 AI 列出可能的反方時，它只是幫你想到方向；ICMJE 指出，把 AI 產生的內容當成主要來源引用是不能接受的。每個反方與證據都要自己找原始資料查證，也不要把個人資料貼進對話框。
  items_title: 回應反方的三種方式（本站整理）
  items:
  - title: 指出不成立
    text: 說明反方的前提或證據哪裡有問題。
  - title: 部分承認
    text: 承認反方有道理，再說明為什麼結論仍成立。
  - title: 修正主張
    text: 反方改變了你的看法，就回頭改論證。
  checklist_title: 改完一版後：
  checklist:
  - 主張一句話
  - 證據附出處
  - 回應了反方
  - 反方說得公道
  activity_figure: how-flow
