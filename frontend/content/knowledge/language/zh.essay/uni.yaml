goal: 寫一篇有主張、可查證據、並回應反方的評論。
review: 就公共議題寫一篇約 1,500 字（示意）的評論，家人扮演反方提 3 個問題（示意）；改後的版本至少回應其中 2 個（示意），所有證據都附出處。
