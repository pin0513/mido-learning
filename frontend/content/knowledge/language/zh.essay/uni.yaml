  supports: 「In academic writing, an argument is usually a main idea, often called a 『claim』 or 『thesis statement,』 backed up with evidence that supports the idea.」；「Every field has slightly different requirements for acceptable evidence」；Counterargument：「Talk with a friend or with your teacher.」；「When you are summarizing opposing arguments, be charitable.」；「It is usually better to consider one or two serious counterarguments in some depth, rather than to give a long but superficial list of many different counterarguments and replies.」；「If considering a counterargument changes your position, you will need to go back and revise your original argument accordingly.」
