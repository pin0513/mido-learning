why:
  heading: 聽懂廣播和對話的重點
  body:
  - 英語文領綱第四學習階段要學生「能聽懂公共場所廣播的內容，如捷運、車站、機場廣播」，並「能綜合相關資訊作合理的猜測」；學習內容包括「人、事、時、地、物的描述及問答」。全民英檢初級的聽力能力是聽懂與日常生活相關的淺易談話，包括價格、時間及地點等。
  qa:
    question: 聽不懂一個字時，你會停下來還是繼續聽？
    answer: 繼續聽。全民英檢初級聽力每題只播出一遍，停下來就會錯過後面的重點；抓住人、事、時、地，再用前後的資訊合理猜測漏掉的字。
    source: gept-elementary
  items_title: 英語文領綱的學習重點
  items:
  - title: 聽懂廣播
    text: 英語文 1-Ⅳ-11：能聽懂公共場所廣播的內容，如捷運、車站、機場廣播。
    code: 1-IV-11
  - title: 合理猜測
    text: 英語文 9-Ⅳ-1：能綜合相關資訊作合理的猜測。
    code: 9-IV-1
  - title: 人事時地物
    text: 英語文 B-Ⅳ-5：人、事、時、地、物的描述及問答。
    code: B-IV-5
  checklist_title: 開始前先確認
  checklist:
  - 會聽數字和時間
  - 會聽地點名稱
  notes:
  - 英語文 5-Ⅳ-9「能聽懂簡易廣播，並能以簡單的字詞、句子記下要點。」與第二外國語文同號，只在內文引用。
  sources:
  - english
  - gept-elementary
how:
  heading: 只抓人、事、時、地
  body:
  - 本站建議：聽之前先看題目和圖，猜會聽到什麼；聽的時候只記人、事、時、地這幾個關鍵字；漏掉的字不要停，用前後文補。
  items_title: 本站建議的聽法
  items:
  - title: 先看題目
    text: 聽之前先看圖和選項。
  - title: 抓關鍵字
    text: 只記人、事、時、地。
  - title: 不停下來
    text: 漏掉的字先放掉，繼續聽。
  - title: 用前後文補
    text: 綜合聽到的資訊合理猜測。
  checklist_title: 每次聽完勾一下
  checklist:
  - 先看了題目
  - 記下關鍵字
  - 沒有停下來
  activity_figure: listening-flow
  notes:
  - 聽法是本站建議。
  sources:
  - english
what:
  heading: 兩種考試，播放次數不同
  body:
  - 全民英檢初級聽力有看圖辨義、問答、簡短對話、短文聽解四部分，共 30 題、約 20 分鐘，每題只播出一遍。會考英語聽力是 3 選 1、20～30 題、25 分鐘，每道試題播音兩次。練習時要知道自己在練哪一種。
  items_title: 學完能做到
  items:
  - title: 聽懂廣播
    text: 說出廣播裡的時間、地點、班次。
  - title: 聽懂對話
    text: 說出對話裡的人和事。
  - title: 只聽一遍
    text: 照全民英檢的形式作答。
  checklist_title: 家長檢核
  checklist:
  - 說出時間地點
  - 練過只播一遍
  - 答對率有進步
  figures:
  - listening-compare
  notes:
  - 國中對應全民英檢初級是本站建議，不是官方換算。
  - 「7 成」是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網E-BOT），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去。
  sources:
  - gept-elementary
  - cap-english
  - cap-subjects
  - genai-student
