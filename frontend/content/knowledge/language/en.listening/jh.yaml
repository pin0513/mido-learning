idea: 聽力的關鍵是不要卡住：抓人、事、時、地這些關鍵字，漏掉的字靠上下文補。
guiding_questions:
- 聽不懂一個字時，你會停下來還是繼續聽？
scenario: 親子共學：聽一段機場或車站的英文廣播，只寫下時間、地點、班次三件事，再對答案。
goal: 聽懂日常對話與簡短廣播裡的人、事、時、地，達到全民英檢初級聽力的程度。
review: 家長從全民英檢初級官方練習題選一回聽力（看圖辨義、問答、簡短對話、短文聽解，每題只播一遍），孩子作答，答對 7 成以上；或做一回會考英語聽力歷屆試題。
