idea: 把字母的聲音一個一個拼起來，就能念出沒學過的字。這套規則叫自然發音（phonics），有例外，但大多數字都適用。
guiding_questions:
- 沒看過的字 bat、bed，你能不能猜出怎麼念？
scenario: 親子共學：把 b、c、h、m 和 -at 組合起來念：bat、cat、hat、mat，看誰先找到一個真的不是字的組合。
goal: 用自然發音拼讀沒學過的短母音單字（CVC，例如 bat、bed、pig）。
review: 家長寫 10 個孩子沒看過的 CVC 字，孩子不看提示念出來，至少 8 個念對。
