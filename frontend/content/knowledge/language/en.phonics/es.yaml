idea: 英文字母和聲音大致有對應：b-a-t 一個一個念出聲音再連起來，就是 bat。這種看字讀音的方法叫自然發音（phonics）；也有拼法不規則的字，要另外認（見 en.sight）。
guiding_questions:
- 沒看過的字 bat、bed，你能不能猜出怎麼念？
scenario: 親子共學：用字母卡拼 -at 家族（bat、cat、hat、mat），每換一個開頭字母就念一次；再換其他字母試試，組出念得出來的字後一起查字典，看是不是真的英文單字。
goal: 用自然發音拼讀沒學過的短母音單字（CVC，例如 bat、bed、pig）。
review: 家長寫 10 個沒學過的三個字母單字（像 bed、pig），孩子試著念出來，至少 8 個念對（10 個、8 個是示意）。
