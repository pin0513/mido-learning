why:
  heading: 看到生字也念得出來
  body:
  - 英語文領綱實施要點說：「字母拼讀規則呈現語音和字母的對應關係，也是語音與文字的重要聯結，能幫助學生在語音、認字與拼字等方面的學習。」國小「應善用字母拼讀規則看字讀音與聽音拼字」（p.27）。Cambridge Dictionary 把 phonics 解釋為依字母所代表的聲音來教閱讀的方法。
  qa:
    question: 沒看過的字 bat、bed，你能不能猜出怎麼念？
    answer: 可以。把 b、a、t 三個聲音一個一個念出來，再連起來念，就是 bat；bed 也一樣。這就是領綱說的看字讀音。
    source: english
  items_title: 領綱條目（只在內文引用）與定義
  items:
  - title: 拼讀讀出字詞
    text: 英語文 5-Ⅱ-4：能運用所學的字母拼讀規則讀出英文字詞。
  - title: 拼讀規則
    text: 英語文 Ab-Ⅱ-4：所學的字母拼讀規則（含看字讀音、聽音拼字）。
  - title: 什麼是 phonics
    text: 依字母所代表的聲音來教閱讀的方法（Cambridge Dictionary）。
  checklist_title: 開始前先確認
  checklist:
  - 認得 26 個字母
  - 說得出字母音
  notes:
  - 這些條目與國語文同號，只在內文引用。
  sources:
  - english
  - camb-phonics
  - oxf-phonics
how:
  heading: 一個一個念，再連起來
  body:
  - 先從三個字母、中間是短母音的字開始，例如 bat、bed、pig（共同核心標準稱為 CVC，子音、母音、子音）。本站建議：每次只換一個字母，像 bat、cat、hat，孩子比較容易看出規律。
  items_title: 本站建議的練法
  items:
  - title: 拆開念
    text: b、a、t 三個聲音分開念。
  - title: 連起來念
    text: 把三個聲音連成 bat。
  - title: 換開頭字母
    text: bat 換成 cat、hat、mat。
  - title: 換中間母音
    text: bat 換成 bit、but。
  checklist_title: 每次練完勾一下
  checklist:
  - 拆開念
  - 連起來念
  - 換字母再念
  activity_figure: phonics-flow
  notes:
  - 練法是本站建議；CVC 一詞依共同核心標準 RF.K.2d。
  sources:
  - ccss-ela
what:
  heading: 規則字拼得出，例外字另外認
  body:
  - 共同核心標準要一年級學生「Decode regularly spelled one-syllable words」，也要認讀拼法不規則的字（irregularly spelled words）。所以學完拼讀後，大部分照規則拼的短字念得出來；拼法不規則的字，要另外一眼認得（見 en.sight）。
  items_title: 學完能做到
  items:
  - title: 念出規則字
    text: 沒學過的 CVC 字也念得出來。
  - title: 認出字族
    text: 看出 bat、cat、hat 是同一家。
  - title: 知道有例外
    text: 拼法不規則的字要另外認。
  checklist_title: 家長檢核
  checklist:
  - 生字念得出
  - 看得出字族
  - 知道有例外
  figures:
  - phonics-compare
  notes:
  - 檢核用的 10 個、8 個是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網E-BOT），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - ccss-ela
  - english
  - genai-student
