idea: 讀日文要同時處理假名和漢字。從有圖的漫畫和短文開始，用漢字猜意思、用假名讀出聲。
guiding_questions:
- 漫畫對話框裡的日文，跟課本裡的有什麼不同？
scenario: 親子共學：選一頁喜歡的日文漫畫，把對話框翻成中文，和官方中文版比較。
goal: 讀懂一頁漫畫或 300 字短文，說出主要內容。
review: 孩子讀一頁日語漫畫或短文，用中文說出發生什麼事；家長對照翻譯版，主要事件都說對。
