sources:
- id: sfl
  title: 十二年國民基本教育課程綱要 國民中學暨普通型高級中等學校語文領域－第二外國語文
  publisher: 國家教育研究院（中華民國一○七年四月）
  url: https://stv.naer.edu.tw/data/course_outline/pta_18521_6265663_59836.pdf
  accessed: '2026-10-29'
  kind: curriculum
  supports: 學習表現與學習內容：四級 3-Ⅴ-22「能閱讀不同體裁、不同主題的簡易文章。」（p.9）；四級 5-Ⅴ-21「能讀懂繪本、漫畫，並以簡單句子描述大意。」（p.10）；四級 6-Ⅴ-20「能熟悉各種閱讀技巧(如擷取大意、推敲文意、預測後續文意)。」（p.10）；時間分配「1.加深加廣選修第二外國語文至多 6學分。」、備註「高級中等學校教育階段，學校亦可依據學生需求與學校發展願景及特色，於校訂課程規劃第二外國語文（含新住民語文）課程。」（p.2）；實施要點「於『多元選修』課程中開設第二外國語文（含新住民語文）供學生選修」（p.15）；編碼說明「第 2 碼為『語文程度級別』，以Ⅳ代表一級、二級，以Ⅴ代表三級、四級」（p.4）；三級學習表現註「外語表達能力相當於《歐洲共同語文參考架構》 (Common European Framework of Reference for Languages, CEFR)A2-1 等級之能力」（p.9）；四級註「CEFR)A2-2 等級之能力」（p.10）；外-U-B1「具備聽、說、讀、寫第二外國語文的基礎素養，在日常生活常見情境中，能運用所學詞彙、句型及肢體語言進行適切合宜的溝通與互動。」（p.3）；外-U-A1「具備積極主動的學習態度，將學習延伸至課堂外，豐富個人知識。運用各種學習與溝通策略，強化第二外國語文學習與溝通成效。」（p.2）；附錄一：四級 6-Ⅴ-16、6-Ⅴ-18、6-Ⅴ-19、6-Ⅴ-20 對應外-U-A1，6-Ⅴ-20 也對應外-U-B1（p.27）
- id: jlpt-levels
  title: N1～N5：認定の目安
  publisher: 日本語能力試験 JLPT（国際交流基金・日本国際教育支援協会）
  url: https://www.jlpt.jp/about/levelsummary.html
  accessed: '2026-10-29'
  kind: exam
  supports: N4 読む「基本的な語彙や漢字を使って書かれた日常生活の中でも身近な話題の文章を、読んで理解することができる。」；N3 読む「日常的な話題について書かれた具体的な内容を表す文章を、読んで理解することができる。」、「新聞の見出しなどから情報の概要をつかむことができる。」
- id: genai-student
  title: 中小學使用「生成式人工智慧」注意事項2.1（學生版）
  publisher: 教育部（中小學數位學習精進方案網站）
  url: https://pads.moe.edu.tw/download_file.php?file=_upload_aba798ab3bb88f11d0c43a7e477fb9c5.pdf
  accessed: '2026-10-29'
  kind: government
  supports: 前言「在家長或學校老師的指導與同意下遵守各工具年齡分級與帳號申請規範」；五「中小學學生使用『生成式人工智慧』工具應遵守各平臺註冊年齡限制及相關規範。建議中小學學生使用為教育目的而設計的『生成式人工智慧』工具，如教育部因材網生成式AI學習夥伴e度、酷英網E-BOT、均一教育平臺或CK-12 Flexi等…若為非在校使用，亦請家長陪伴使用。」；六（三）「不可以將自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料…輸入至『生成式人工智慧』工具。」；一「這些工具無法自行判斷結果的正確性和合理性…不宜直接採信」；六（四）「應依規定註明所使用的工具及用途，不得將生成內容直接當作自己原創作品繳交。」；六（五）「遵守學校訂定之資訊倫理與學術誠信規範，不得使用『生成式人工智慧』工具從事抄襲、代寫、作弊或其他違反校規與法令之行為。」；五「若需使用其他商用版的『生成式人工智慧』工具，應經由學校評估資安風險，並在師長指導下審慎使用。」
