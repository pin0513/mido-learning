why:
  heading: 讀得懂生活中的日文
  body:
  - 第二外國語文領綱的四級學習表現有「能閱讀不同體裁、不同主題的簡易文章。」（3-Ⅴ-22）、「能讀懂繪本、漫畫，並以簡單句子描述大意。」（5-Ⅴ-21）和「能熟悉各種閱讀技巧(如擷取大意、推敲文意、預測後續文意)。」（6-Ⅴ-20）。
  - JLPT 官網說 N4 能讀「基本的な語彙や漢字を使って書かれた日常生活の中でも身近な話題の文章」，N3 能讀「日常的な話題について書かれた具体的な内容を表す文章」；選文章時可以從這個難度開始（本站建議）。
  items_title: 第二外國語文領綱的學習重點
  items:
  - title: 讀簡易文章
    text: 第二外國語文 3-Ⅴ-22：能閱讀不同體裁、不同主題的簡易文章。
    code: 3-V-22
  - title: 讀繪本漫畫說大意
    text: 第二外國語文 5-Ⅴ-21：能讀懂繪本、漫畫，並以簡單句子描述大意。
    code: 5-V-21
  - title: 閱讀技巧
    text: 第二外國語文 6-Ⅴ-20：能熟悉各種閱讀技巧(如擷取大意、推敲文意、預測後續文意)。
    code: 6-V-20
  checklist_title: 開始前先確認
  checklist:
  - 會讀假名
  - 認得基本漢字
  notes:
  - 第二外國語文的Ⅴ代表語文程度三級、四級，不是年級；高中由學校在加深加廣選修、多元選修或校訂課程開設，不是每校都有。本點對到三級、四級是本站建議。
  sources:
  - sfl
  - jlpt-levels
how:
  heading: 先猜大意，再推詞意
  body:
  - 本站建議的三步：①先看標題、圖和對話框，預測大概在說什麼；②讀文字，不會的詞先看漢字推意思、再用前後文推敲，最後才查字典核對；③用三句簡單的句子說出大意（三句是示意）。這三步呼應領綱閱讀技巧裡的「擷取大意、推敲文意、預測後續文意」（6-Ⅴ-20）。
  - 本站整理：日文漢字常和中文意思接近，可以先猜；但也有意思不同的，例如「手紙」是信，所以猜完要用前後文或字典確認。漫畫、文章只讀不轉貼，也不把整頁內容輸入 AI（本站建議）。
  qa:
    question: 遇到不會的詞，怎麼不查字典也猜出意思？
    answer: 先看漢字猜意思，再看前後文對不對得上，最後查字典核對（本站整理）。領綱把「推敲文意」列為閱讀技巧（6-Ⅴ-20）；也要小心像「手紙」這種和中文意思不同的詞。
    source: sfl
  items_title: 本站建議的讀法
  items:
  - title: 看圖與標題
    text: 先預測大意。
  - title: 用漢字推意思
    text: 再用前後文推敲，最後查字典。
  - title: 說出大意
    text: 用簡單句子說三句（示意）。
  - title: 小心同形異義
    text: 例如「手紙」是信（本站整理）。
  checklist_title: 每次讀完勾一下
  checklist:
  - 先看了圖和標題
  - 猜了不會的詞
  - 說出了大意
  activity_figure: read-flow
  sources:
  - sfl
what:
  heading: 讀懂一頁並說出大意
  body:
  - 學完後，孩子能先看圖和標題預測大意，用漢字和前後文推敲不會的詞，讀懂一頁漫畫或一篇短文，並用簡單的句子說出大意。
  items_title: 學完能做到
  items:
  - title: 預測大意
    text: 看圖和標題先猜。
  - title: 推敲詞意
    text: 用漢字和前後文猜詞。
  - title: 說出大意
    text: 用簡單句子說出發生什麼事。
  checklist_title: 家長檢核
  checklist:
  - 主要事件說對
  - 說得出猜詞過程
  figures:
  - read-compare
  notes:
  - 檢核的 300 字、三句是示意。
  - 本站建議：本點可當作 JLPT N4 到 N3 的準備；這是本站建議的對應，不是官方換算。JLPT 官網寫 N4 是「基本的な日本語を理解することができる」，N3 是「日常的な場面で使われる日本語をある程度理解することができる」。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，其他商用工具「應經由學校評估資安風險」，並在師長指導下使用；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料，自己或別人的錄音也不上傳（本站建議）；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - sfl
  - jlpt-levels
  - genai-student
