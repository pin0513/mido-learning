idea: 讀日文要同時處理假名和漢字。本站建議的讀法：先看標題和圖猜大意，遇到不會的詞先用漢字推意思、用前後文推敲，最後用簡單的句子說出大意。第二外國語文領綱把「擷取大意、推敲文意、預測後續文意」列為閱讀技巧。
guiding_questions:
- 遇到不會的詞，怎麼不查字典也猜出意思？
scenario: 親子共學：從學校圖書館或課本選一頁日文漫畫或一篇短文，孩子先看圖和標題猜大意，再讀文字，用三句中文說出發生什麼事，家長對照中文版或課本翻譯確認（本站建議；三句是示意）。
goal: 用看圖和標題預測大意、用漢字和前後文推敲詞意的方法，讀懂一頁漫畫或一篇短文，用簡單的句子說出大意。
review: 孩子讀一頁日文漫畫或約 300 字的短文，用三句中文說出發生什麼事，並指出一個自己用漢字或前後文猜出意思的詞；家長對照中文版或課本翻譯，主要事件都說對（字數、句數是示意）。
