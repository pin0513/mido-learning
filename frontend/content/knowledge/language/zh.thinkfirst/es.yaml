idea: 先把自己的想法說出來或寫下來，再和大人一起問 AI，比一比哪裡一樣、哪裡不一樣。AI 的話不能直接抄成自己的作業。
guiding_questions:
- 問 AI 之前，你自己的答案是什麼？
scenario: 親子共學：全程家長陪同：孩子先講「我覺得……」，家長再幫忙問 AI，一起找出 AI 說得不對或太籠統的地方。
goal: 問 AI 之前先說出自己的答案，再和大人一起比較。
review: 家長陪同時，孩子先講或寫「我覺得……」，再看 AI 的回答，說出一處一樣、一處不一樣。
