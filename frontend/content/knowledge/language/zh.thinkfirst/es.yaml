idea: 先把自己的想法說出來或寫下來，再由大人操作、一起問 AI（人工智慧），比一比哪裡一樣、哪裡不一樣。教育部提醒：AI 是協助學習的工具，不能取代自己的思考；AI 的話不能直接抄成自己的作業。
