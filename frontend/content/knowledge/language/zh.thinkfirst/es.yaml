# B3 提案：zh.thinkfirst@es
# - 依教育部〈中小學使用「生成式人工智慧」注意事項2.1〉補上依據：先自行閱讀與思考（學生版 p.3）、遵守平臺註冊年齡限制、非在校使用請家長陪伴（學生版 p.2）、不得把生成內容直接當原創作品繳交（p.3）、不可輸入個人資料（p.3）。
# - main 的 scenario 已寫「全程家長陪同」「家長再幫忙問 AI」，方向正確；本提案把「家長操作」寫得更明確，並在正文補上年齡限制與不輸入個人資料的依據。
# - 定義 AI（人工智慧，Artificial Intelligence）。補上 5-III-12（運用科技與網路，進行資料蒐集、解讀與判斷）與國-E-B2。
# - 注意：教育部注意事項 PDF 所在網站 pads.moe.edu.tw 的 SSL 憑證鏈不完整，研究時以 curl -k 下載公開 PDF（見 research.md）。
# - 複審修正：5-III-12 項目改為逐字全文；how 改寫為優先用教育部因材網生成式AI學習夥伴e度等教育用工具（家長版 p.3 原文）；「本站說明」改「本站整理」。
