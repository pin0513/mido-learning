why:
  heading: 先有自己的想法
  body:
  - 教育部給學生的注意事項說，生成式人工智慧「是協助學習的工具，不能取代自己的思考與判斷，應先自行閱讀與思考，再視需要使用工具輔助」。
  - 注意事項也提醒：使用工具要遵守各平臺的註冊年齡限制，不在學校使用時請家長陪伴；不可以直接把生成內容當作業或報告的答案。課綱也希望國小學生「培養審慎使用各類資訊的能力」。
  qa:
    question: 問 AI 之前，你自己的答案是什麼？
    answer: 先說或寫下「我覺得……，因為……」。教育部的注意事項說，要「先自行閱讀與思考，再視需要使用工具輔助」。有了自己的答案，才比得出 AI 哪裡和你一樣、哪裡不一樣，也比較看得出 AI 哪裡說錯。
    source: genai-student
  items_title: 教育部注意事項的重點
  items:
  - title: 先自己想
    text: 不能取代自己的思考與判斷，應先自行閱讀與思考（學生版 p.3）。
  - title: 家長陪伴
    text: 遵守平臺註冊年齡限制；非在校使用，請家長陪伴（學生版 p.2）。
  - title: 不直接抄
    text: 不得將生成內容直接當作自己原創作品繳交（學生版 p.3）。
  - title: 判斷資訊
    text: 五、六年級：運用圖書館(室)、科技與網路，進行資料蒐集、解讀與判斷，提升多元文本的閱讀和應用能力。
    code: 5-III-12
  sources:
  - genai-student
  - genai-parent
  - kuoyu
how:
  heading: 說出來、問、比一比
  body:
  - 孩子先講或寫「我覺得……」；家長操作，優先用教育部因材網生成式AI學習夥伴e度等為教育目的設計的工具提問（家長版 p.3）；最後一起比：哪裡一樣、哪裡不一樣、哪裡說得太籠統或不對。提問時不輸入姓名、照片、住址、學號等個人資料。
  items:
  - title: 先說答案
    example: 我覺得月亮會跟著我走，因為……
    text: 說出想法和理由。
  - title: 家長提問
    example: 請用小學生聽得懂的話解釋……
    text: 由家長操作，不輸入個人資料。
  - title: 比一比
    example: 一樣：……；不一樣：……
    text: 各找出一處，再一起查證。
  checklist_title: 每次問 AI 前後：
  checklist:
  - 先說我覺得
  - 家長操作提問
  - 不給個人資料
  - 說一處一樣
  - 說一處不一樣
  activity_figure: how-flow
  sources:
  - genai-student
  - genai-parent
what:
  heading: AI 是幫手，不是答案
  figures:
  - what-compare
  notes:
  - AI＝人工智慧（Artificial Intelligence）；生成式人工智慧是能依提問產生文字、圖片等內容的工具（本站整理）。
  - 作業如果允許用 AI 協助構思或潤飾，要依規定註明用了什麼工具、做什麼用（學生版 p.3）。
  - 教育部建議中小學生使用為教育目的設計的生成式 AI 服務，例如因材網的「e度」（家長版 p.3）。
  sources:
  - genai-student
  - genai-parent
