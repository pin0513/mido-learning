idea: 海報和公告只能有一個重點。最大的字放最重要的事，時間地點寫清楚，不重要的刪掉。
guiding_questions:
- 路過的人只看 3 秒，海報上最大的字要寫什麼？
scenario: 親子共學：替家裡的跳蚤市場或班級活動做一張 A4 海報，請家人站遠遠看 3 秒，說出記得什麼。
goal: 做一張只說一件事的海報：最大的字是最重要的事，時間地點清楚。
review: 家人站遠看 3 秒，能說出活動名稱、時間、地點三件事中的至少兩件。
