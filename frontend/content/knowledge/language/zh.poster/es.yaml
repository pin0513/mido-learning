why:
  heading: 海報要先被看見
  body:
  - 《重編國語辭典》說，海報是「將圖畫與文字適當的安排在一畫面上」，目的是「引起大家的注意，以收宣傳的效果」。看海報的人多半只是路過，所以重點要一眼看到。
  - 課綱三、四年級學「日記、海報的格式與寫作方法」，五、六年級再學說明書、廣告、標語、告示、公約等。
  qa:
    question: 路過的人只看 3 秒，海報上最大的字要寫什麼？
    answer: 寫你最想讓人記住的那件事，通常是活動名稱。「3 秒」是示意，意思是路人多半只會看一眼；海報的目的是「引起大家的注意」，所以最大的字要留給最重要的事，時間、地點用次大的字寫清楚。
    source: dict-haibao
  items_title: 課綱的應用文學習
  items:
  - title: 海報的格式
    text: 三、四年級學習內容：在生活應用方面，以日記、海報的格式與寫作方法為主。
    code: Be-II-1
  - title: 書寫應用作品
    text: 三、四年級：書寫記敘、應用、說明事物的作品。
    code: 6-II-4
  - title: 廣告、標語、告示
    text: 五、六年級學習內容：在生活應用方面，以說明書、廣告、標語、告示、公約等格式與寫作方法為主。
    code: Be-III-1
  sources:
  - dict-haibao
  - kuoyu
how:
  heading: 先決定最重要的一件事
  body:
  - 先寫下所有想放的內容，再挑出一件最重要的事放最大；接著寫時間、地點；其他的能刪就刪。做好後請家人站遠一點看，說出記得什麼。（步驟是本站建議。）
  items:
  - title: 最大的字
    example: 二手玩具交換日
    text: 放最重要的一件事。
  - title: 次大的字
    example: 11 月 14 日（六）上午 10 點・社區活動中心
    text: 時間、地點寫清楚（例子是本站自編）。
  - title: 小字或刪掉
    example: 其他說明
    text: 不重要的能刪就刪。
  checklist_title: 貼出去前檢查：
  checklist:
  - 只放一個重點
  - 最大字最重要
  - 有時間
  - 有地點
  - 站遠看得清
  activity_figure: how-flow
  sources:
