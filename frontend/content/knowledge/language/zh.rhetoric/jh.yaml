scenario: 親子共學：複習版：在一篇文章裡找到排比，刪掉其中兩句，比較哪個版本比較有力。
goal: 認出譬喻、轉化、排比、設問，並說出這裡用它的理由。
review: 家長從課文挑 4 句，孩子說出各是哪一種修辭並說出判斷理由，再自己用其中兩種寫一句描寫家裡的東西，家長判斷用得自然。
