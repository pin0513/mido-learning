idea: 譬喻是拿熟悉的東西比；轉化是把物當人寫；排比是三句以上同樣的句型；設問是自問自答。修辭要有理由才用，連續排比讀起來像口號，也是常見的 AI 腔。
guiding_questions:
- 「月亮害羞地躲進雲裡」，月亮真的會害羞嗎？
scenario: 親子共學：複習版：在一篇文章裡找到排比，刪掉其中兩句，比較哪個版本比較有力。
goal: 認出譬喻、轉化、排比、設問，並說出這裡用它的理由。
review: 家長從課文挑 4 句，孩子說出各是哪一種修辭，再自己用其中兩種寫一句描寫家裡的東西，家長判斷用得自然。
