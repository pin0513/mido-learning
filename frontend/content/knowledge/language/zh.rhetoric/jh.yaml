idea: 譬喻是「利用二件事物的相似點，用彼方來說明此方」；轉化是改變事物原來的性質來寫，分人性化、物性化、形象化；排比是連續三個或三個以上結構相同或相似的句法；設問是由平敘忽然變成詢問的語氣。修辭要有理由才用；排比連用太多，讀起來容易像喊口號（本站建議）。
