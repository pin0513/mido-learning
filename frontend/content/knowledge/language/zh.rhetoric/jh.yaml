why:
  heading: 修辭是寫作特色
  body:
  - 國語文課綱要國中生「理解各類文本內容、形式和寫作特色」，寫作要「寫出結構完整、主旨明確、文辭優美的文章」。會考國文第五項考試內容也包括「理解各類文本內容、形式和寫作特色」。
  - 認得修辭，讀文章時才看得出作者為什麼這樣寫；自己寫作時，也能選對地方用（本站建議）。
  qa:
    question: 「月亮害羞地躲進雲裡」，月亮真的會害羞嗎？
    answer: 不會。這句把月亮當成人來寫，是轉化裡的「人性化」。辭典說轉化是描述一件事物時，「轉變其原來的性質，化成另一種本質截然不同的事物」來形容敘述；除了人性化，還有物性化、形象化。
    source: rev-zhuanhua
  items_title: 國中課綱怎麼說
  items:
  - title: 理解寫作特色
    text: 國語文 5-Ⅳ-3：理解各類文本內容、形式和寫作特色。
    code: 5-IV-3
  - title: 寫出文辭優美的文章
    text: 國語文 6-Ⅳ-2：依據審題、立意、取材、組織、遣詞造句、修改潤飾，寫出結構完整、主旨明確、文辭優美的文章。
    code: 6-IV-2
  sources:
  - kuoyu
  - cap-guowen
  - rev-zhuanhua
how:
  heading: 先認出，再問為什麼
  body:
  - 讀到一句特別的句子，先對照下面四種定義認出是哪一種修辭，再問：作者為什麼在這裡用它？換成平鋪直敘，效果差在哪裡？
  items:
  - title: 譬喻
    text: 利用二件事物的相似點，用彼方來說明此方，通常以易知說明難知、以具體說明抽象。
  - title: 轉化
    text: 轉變事物原來的性質來寫，分人性化、物性化、形象化三種，也叫比擬。
  - title: 排比
    text: 連續三個或三個以上內容相關、結構相同或相似的句法。
    example: 富貴不能淫，貧賤不能移，威武不能屈。
  - title: 設問
    text: 講話行文時，忽然由平敘的語氣變為詢問的語氣。
    example: 借問酒家何處有？牧童遙指杏花村。
  checklist_title: 分析一句修辭：
  checklist:
  - 認出是哪一種
  - 說出效果
  - 改成平敘比較
