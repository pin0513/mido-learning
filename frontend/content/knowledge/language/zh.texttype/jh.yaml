idea: 108 國語文的學習內容把文本分成記敘、抒情、說明、議論與應用。記敘看事件經過，抒情看情感，說明看順序與方法，議論看論點與論據。先認出類型，就知道要找什麼。
guiding_questions:
- 同樣寫颱風，新聞報導和一首詩，讀法一樣嗎？
scenario: 親子共學：一起翻當天報紙或網站，各找一篇記敘、說明、議論文，互相說出判斷的理由。
goal: 分辨記敘、抒情、說明、議論四種文本，並說出各自怎麼讀。
review: 家長給 4 段不同類型的短文，孩子判斷類型並各說一個證據（例如「有論點和例子，是議論」），4 段都對。
