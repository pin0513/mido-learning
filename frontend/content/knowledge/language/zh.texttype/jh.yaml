what:
  heading: 說明和議論的差別
  figures:
  - what-compare
  notes:
  - 第五類應用文本在國中以「自傳、簡報、新聞稿」等生活應用為主（Be-Ⅳ-1）。
  - 一篇文章可能混用多種表述方式，判斷時看它主要的目的（本站整理）。
  sources:
  - kuoyu
