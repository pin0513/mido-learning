idea: 國語文課綱把「文本表述」分成記敘、抒情、說明、議論與應用五類。記敘文本「以人、事、時、地、物為敘寫對象」；抒情文本抒發「對人、事、物、景之情感」；說明文本「以邏輯、客觀、理性的方式，說明事理或事物」；議論文本「以論點、論據、論證方式，表達對人、事、物看法」。先認出類型，就知道要找什麼（本站整理的讀法）。
guiding_questions:
- 同樣寫颱風，新聞報導和一首詩，讀法一樣嗎？
scenario: 親子共學：一起翻當天報紙或網站，各找一篇記敘、說明、議論文，互相說出判斷的理由。
goal: 分辨記敘、抒情、說明、議論四種文本並說出各自怎麼讀，也知道第五類應用文本。
review: 家長給 4 段不同類型的短文，孩子判斷類型並各說一個證據（例如「有論點和例子，是議論」），4 段都對。
