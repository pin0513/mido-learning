why:
  heading: 認出類型，才知道找什麼
  body:
  - 國語文課綱說「文本表述」依其體用分成記敘、抒情、說明、議論及應用五項；第三學習階段起加入議論文本。會考國文第五項考試內容要「理解各類文本內容、形式和寫作特色」。
  - 大學入學考試中心的學測國文說明，也用同樣的五類解釋「文本」，並說文本「也包含圖表、圖形、圖解、表單等等」。
  qa:
    question: 同樣寫颱風，新聞報導和一首詩，讀法一樣嗎？
    answer: 不一樣。新聞報導多半是記敘或說明：記敘文本「以人、事、時、地、物為敘寫對象」，讀的時候先抓人、事、時、地、物。一首寫颱風的詩通常是抒情：抒情文本抒發「對人、事、物、景之情感」，讀的時候找作者的感受和寄託（本站整理）。
    source: kuoyu
  items_title: 國中課綱的五類文本（舉例）
  items:
  - title: 記敘文本
    text: 國語文 Ba-Ⅳ-1：順敘、倒敘、插敘與補敘法。
    code: Ba-IV-1
  - title: 抒情文本
    text: 國語文 Bb-Ⅳ-5：藉由敘述事件與描寫景物間接抒情。
    code: Bb-IV-5
  - title: 說明文本
    text: 國語文 Bc-Ⅳ-1：具邏輯、客觀、理性的說明，如科學知識、產品、環境、制度等說明。
    code: Bc-IV-1
  - title: 議論文本
    text: 國語文 Bd-Ⅳ-1：以事實、理論為論據，達到說服、建構、批判等目的。
    code: Bd-IV-1
  sources:
  - kuoyu
  - cap-guowen
  - ceec
how:
  heading: 先判斷類型，再找重點
  body:
  - 讀一篇文章，先問：它在記事、抒情、說明，還是想說服我？再照類型找重點：記敘找人、事、時、地、物和敘事順序；抒情找感受；說明找事理和說明方法；議論找論點和論據（本站整理）。應用文本要看格式，例如自傳、簡報、新聞稿。
  items:
  - title: 記敘
    text: 找人、事、時、地、物，看是順敘、倒敘、插敘還是補敘。
  - title: 抒情
    text: 找直接抒情的句子，或藉事件、景物間接抒情的地方。
  - title: 說明
    text: 找邏輯、客觀、理性的說明，例如科學知識、產品、制度。
  - title: 議論
    text: 找論點，再找作者用哪些事實、理論當論據。
  checklist_title: 判斷一篇文章：
  checklist:
  - 先猜類型
  - 找出證據
  - 照類型找重點
  activity_figure: how-flow
  sources:
