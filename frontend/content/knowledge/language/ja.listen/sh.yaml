why:
  heading: 生活場景先聽懂關鍵字
  body:
  - 第二外國語文領綱的三級學習表現有「能藉由多媒體，聽取所需的生活訊息。」（1-Ⅴ-16）和「能運用反問策略，如請求說慢一點、重複說明或確認內容，協助理解對方語意。」（6-Ⅴ-14），四級有「能聽懂公共場域的外語廣播內容。」（1-Ⅴ-21）；學習內容有「確認。」（Af-Ⅴ-9）。
  - JLPT 官網說 N4 聽得懂「日常的な場面で、ややゆっくりと話される会話であれば、内容がほぼ理解できる。」
  items_title: 第二外國語文領綱的學習重點
  items:
  - title: 多媒體生活訊息
    text: 第二外國語文 1-Ⅴ-16：能藉由多媒體，聽取所需的生活訊息。
    code: 1-V-16
  - title: 公共場域廣播
    text: 第二外國語文 1-Ⅴ-21：能聽懂公共場域的外語廣播內容。
    code: 1-V-21
  - title: 反問策略
    text: 第二外國語文 6-Ⅴ-14：能運用反問策略，如請求說慢一點、重複說明或確認內容，協助理解對方語意。
    code: 6-V-14
  - title: 確認
    text: 第二外國語文 Af-Ⅴ-9：確認。
    code: Af-V-9
  checklist_title: 開始前先確認
  checklist:
  - 會數字和價錢
  - 會說です句
  notes:
  - 第二外國語文的Ⅴ代表語文程度三級、四級，不是年級；高中由學校在加深加廣選修、多元選修或校訂課程開設，不是每校都有。本點對到三級、四級是本站建議。
  sources:
  - sfl
  - jlpt-levels
how:
  heading: 預測、記關鍵字、反問
  body:
  - 《いろどり》入門（A1）第13課練習在車站問「何番線ですか？」、問車子去不去「このバスは、空港に行きますか？」，也練習聽報站名的車內廣播、聽不懂時問旁邊的人（活動「すみません、今どこですか？」）；第16課的一個能力目標（Can-do 66）是「商品の値段を聞いて、理解することができる。」第6課、第16課有店員會問的「こちらでおめしあがりですか？」「こちら、温めますか？」。
  - 聽不懂時，第2課教「もういちど、お願いします」（能力目標「相手の言っていることがよくわからないとき、聞き返すことができる。」）；第10課用「Nですね」確認，例如「はい、30 ですね。」本站建議：先預測會聽到什麼（月台、站名、價錢），只寫關鍵字，聽完再對逐字稿。
  qa:
    question: 車站廣播講得很快，你要抓哪幾個字？
    answer: 先抓月台號碼和站名。《いろどり》入門第13課練習問「何番線ですか？」，也練習聽報站名的車內廣播、聽不懂時問旁邊的人。只抓這幾個字、其他先放掉，是本站整理的聽法。
    source: irodori
  items_title: 《いろどり》的句子
  items:
  - title: 車站
    text: 月台與站名
    example: 何番線ですか？
  - title: 商店
    text: 價錢與店員的問題
    example: こちら、温めますか？
  - title: 聽不懂
    text: 請對方再說一次
    example: もういちど、お願いします
  - title: 確認
    text: 用 Nですね 確認
    example: はい、30 ですね。
  checklist_title: 每次練完勾一下
  checklist:
  - 先預測關鍵字
  - 只寫關鍵字
  - 對過逐字稿
  - 會請對方重說
  activity_figure: listen-flow
  sources:
  - irodori
what:
  heading: 聽懂關鍵資訊並回應
  body:
  - 學完後，孩子能聽懂車站和商店的關鍵資訊（月台、站名、價錢、店員的問題），聽不懂時會說「もういちど、お願いします」，或用「Nですね」確認。
  items_title: 學完能做到
  items:
  - title: 車站資訊
    text: 聽出月台和站名。
  - title: 商店資訊
    text: 聽出價錢和店員的問題。
  - title: 反問與確認
    text: 請對方重說或確認。
  checklist_title: 家長檢核
  checklist:
  - 關鍵資訊寫對
  - 會反問或確認
  figures:
  - listen-compare
  notes:
  - 檢核的 3 段、2 段是示意。
  - 本站建議：本點可當作 JLPT N4 到 N3 的準備；這是本站建議的對應，不是官方換算。JLPT 官網寫 N4 是「基本的な日本語を理解することができる」，N3 是「日常的な場面で使われる日本語をある程度理解することができる」。
  - 和 AI 練店員對話時，用虛構的名字和情境（本站建議）。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，其他商用工具「應經由學校評估資安風險」，並在師長指導下使用；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料，自己或別人的錄音也不上傳（本站建議）；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - irodori
  - jlpt-levels
  - genai-student
