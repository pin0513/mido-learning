idea: 生活日語有很多固定說法：まもなく、ご注意ください、いらっしゃいませ。先熟悉場景裡一定會出現的句子。
guiding_questions:
- 車站廣播講得很快，你要抓哪幾個字？
scenario: 親子共學：聽一段日本車站廣播，寫下列車要開往哪裡、幾號月台；再用 AI 扮演店員練習結帳。
goal: 聽懂車站廣播與店員的常用句，並回應。
review: 聽 3 段車站或商店的日語錄音，孩子寫出每段的關鍵資訊（月台、時間、價格）；家長對照逐字稿至少 2 段正確。
