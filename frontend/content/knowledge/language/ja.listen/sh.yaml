idea: 生活日語的聽力，先抓場景裡常出現的資訊：車站聽月台和站名，商店聽價錢和店員的問題。聽不懂時，用「もういちど、お願いします」請對方再說一次，或用「Nですね」確認（抓哪些資訊是本站整理；句子依《いろどり》入門）。
guiding_questions:
- 車站廣播講得很快，你要抓哪幾個字？
scenario: 親子共學：用課本或教材附的車站、商店錄音，孩子不看逐字稿，寫下月台、站名或價錢；接著家長演店員問「こちら、温めますか？」，孩子回答，聽不懂就說「もういちど、お願いします」（本站建議）。
goal: 聽懂車站和商店的關鍵資訊（月台、站名、價錢、店員的問題），聽不懂時會請對方再說一次或確認。
review: 聽 3 段教材附的車站或商店錄音，孩子寫出每段的關鍵資訊，家長對照逐字稿至少 2 段正確；再由家長演店員說一句，孩子用「もういちど、お願いします」或「Nですね」回應（段數是示意）。
