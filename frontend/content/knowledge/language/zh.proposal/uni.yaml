why:
  heading: 審查者可能只讀開頭
  body:
  - UNC 寫作中心指出，審查者可能不會讀完每個字，也許只讀摘要、研究設計與方法、履歷和預算；摘要給讀者對計畫的第一印象。它也引述審查者讀計畫時心裡的三個問題：會學到什麼（目標）、為什麼值得知道（重要性）、怎麼知道結論成立（成功標準）。
  - 國內也一樣：國家科學及技術委員會補助大專學生研究計畫的審查重點，包括「研究主題之重要性、研究方法及步驟之可行性」等項目。
  qa:
    question: 審核的人最想先知道什麼：做什麼、為什麼、花多少？
    answer: 三件都想先知道，再加上怎麼判斷成功。所以第一段就要寫清楚：要做什麼、為什麼值得做、需要多少錢或時間、做到什麼程度算成功，細節放後面。
    source: unc-grant
  items_title: 審查者的三個問題（UNC）
  items:
  - title: 目標
    text: 這個計畫要達成什麼。
  - title: 重要性
    text: 為什麼值得做。
  - title: 成功標準
    text: 怎麼知道做到了。
  sources:
  - unc-grant
  - nstc-ugrad
how:
  heading: 先寫一段結論，再補細節
  body:
  - UNC 寫作中心建議，摘要要寫出計畫的整體目的、具體目標、研究設計、方法與重要性；預算除了表格，最好附一兩頁說明每一項為什麼需要。
  - 國科會大專學生研究計畫的申請書依序要寫摘要、研究動機與研究問題、文獻回顧與探討、研究方法及步驟、預期結果、需要指導教授指導內容與參考文獻，研究計畫內容以 10 頁為限。家庭或社團活動不必寫這麼多，但可以照同樣的順序。
  items_title: 一頁企劃（本站建議）
  items:
  - title: 第一段
    text: 做什麼、為什麼、要多少資源、怎麼算成功。
  - title: 做法
    text: 步驟、分工與時程。
  - title: 預算說明
    text: 每一項寫出金額與為什麼需要。
  checklist_title: 第一段有沒有寫到：
  checklist:
  - 做什麼
  - 為什麼
  - 要多少資源
  - 怎麼算成功
  activity_figure: how-flow
  sources:
  - unc-grant
  - nstc-form
what:
  heading: 先寫結論，不把重點埋在後面
  figures:
  - what-compare
  notes:
  - 用 AI 整理格式與預算表時，每一個數字都要自己核算；指南提醒「若要用生成式AI輔助完成論文或計畫書，研究者必須具備資訊驗證與判斷的能力」。未公開的計畫內容、個人資料不要貼進對話框。計畫書用了 AI，依補助機關或課程的規定說明用了哪個工具、做了什麼（本站建議）。
  - 申請國科會大專學生研究計畫者，依要點須「完成至少六小時之學術倫理教育課程訓練」。
  - 一頁企劃的格式是本站建議；正式申請依各單位規定的格式。
  - 一頁企劃的四段順序是本站整理。
  sources:
  - ethics-guide
  - ethics-epaper13
  - nstc-ugrad
