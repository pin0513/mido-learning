  supports: 「Keep in mind that reviewers may not read every word of your proposal. Your reviewer may only read the abstract, the sections on research design and methodology, the vitae, and the budget.」；「The abstract provides readers with their first impression of your project.」；「reviewers read with three questions in mind」：「What are we going to learn as a result of the proposed project that we do not know now? (goals, aims, and outcomes)」「Why is it worth knowing? (significance)」「How will we know that the conclusions are valid? (criteria for success)」；「Most abstracts state」：「(1) the general purpose, (2) specific goals, (3) research design, (4) methods, and (5) significance (contribution and rationale).」；Budget：「be sure to include a one or two page explanation of the budget」
