idea: 企劃書先寫結論：要做什麼、為什麼值得做、要多少資源、怎麼知道成功。細節放後面。
guiding_questions:
- 審核的人最想先知道什麼：做什麼、為什麼、花多少？
scenario: 親子共學：為一個家庭或社團活動寫一頁企劃，請家長當審核者，只看第一段就決定要不要往下讀。
goal: 寫一頁企劃書：做什麼、為什麼、要多少資源、怎麼算成功。
review: 家長當審核者只讀第一段，就能說出要做什麼、要多少錢或時間；四項齊全才打勾。
