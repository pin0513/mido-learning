# B7 提案：en.gept1@jh
# - 補 grades 與 Why/How/What、兩張圖；全民英檢沒有對應的課綱代碼。學習時間的「國中七至九年級（第四學習階段）」引英語文領綱的編碼說明與時間分配。
# - 錯誤修正：原檢核說「做一回官方模擬題並對照官方通過標準…家長看成績單或模擬分數打勾」。官方說明聽讀成績是量尺分數，答對題數要經統計程序轉換，練習題的答對題數不能直接換成 160／72 分。改成練習題只看答對題數找弱點，正式成績單才對照通過標準。
# - 通過標準、題數、聽讀通過才能加考說寫、初級聽讀對應 CEFR A2，都依 LTTC 官網逐字核對並補上出處 id；CEFR A2 的描述依歐洲理事會原文。
# - AI 依教育部學生版注意事項。
# - 標題修正：原標題「聽說讀寫一起過」，但官方規定聽讀通過後才能加考說寫，改成「全民英檢初級：先過聽讀，再考說寫」。
