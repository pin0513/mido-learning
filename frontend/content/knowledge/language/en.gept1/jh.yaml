idea: 全民英檢（GEPT）由語言訓練測驗中心（LTTC）辦理。LTTC 寫明「初級聽讀（CEFR A2）」；說寫另外對照，LTTC 對照表上初級說寫是 A2+。LTTC 的初級能力敘述是：能聽懂價格、時間、地點，看懂路標、菜單、時刻表，能簡單自我介紹、寫明信片與便條。聽讀通過後才能加考說寫，四項都過才拿到聽讀說寫四項合格證書。
guiding_questions:
- 初級聽讀過了，寫作和口說也過得了嗎？
scenario: 親子共學：全家訂一個英檢日：孩子做官方練習題，大人計時並當口說考官，結束後一起整理錯題。
goal: 先過聽讀，再準備說寫：通過全民英檢初級聽讀，再加考寫作與口說。
review: 孩子做一回全民英檢初級官方練習題，記下各部分答對題數、找出最弱的一項；正式成績對照官方通過標準：聽力與閱讀總和 160 分以上，且任一項不低於 72 分（各滿分 120），寫作 70 分、口說 80 分（各滿分 100）。家長看正式成績單打勾。
