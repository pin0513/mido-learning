why:
  heading: 用國內檢定確認四項能力
  body:
  - 全民英檢是專為國人設計的分級檢定，LTTC 說測驗內容「同步參考國內英語課程綱要及國際語言分級架構」，並以初級聽讀（CEFR A2）為多數考生第一次參加的標準化英語測驗。歐洲理事會的 CEFR 把 A2 描述為能理解和自己最切身相關的句子和常用語，例如個人和家庭基本資料、購物、當地地理。
  qa:
    question: 初級聽讀過了，寫作和口說也過得了嗎？
    answer: 不一定，要另外準備。LTTC 規定聽讀達標才可以加考說寫；說寫是人工評分，題型是單句寫作、段落寫作、複誦、朗讀和回答問題。
    source: gept-elementary
  items_title: 全民英檢初級四項能力
  items:
  - title: 聽
    text: 能聽懂與日常生活相關的淺易談話，包括價格、時間及地點等。
  - title: 讀
    text: 能閱讀路標、交通標誌、招牌、簡單菜單、時刻表及賀卡等。
  - title: 說
    text: 能朗讀簡易文章、簡單地自我介紹，能以簡易英語對答。
  - title: 寫
    text: 能寫簡單的句子及段落，如寫明信片、便條、賀卡及填表格等。
  checklist_title: 開始前先確認
  checklist:
  - 讀過四項敘述
  - 看過官方練習題
  notes:
  - 四項能力依 LTTC 初級檢測程度；學段與檢定的對應是本站建議，不是官方換算。
  sources:
  - gept-elementary
  - gept-faq
  - cefr-global
how:
  heading: 先過聽讀，再準備說寫
  body:
  - 初級分兩階段：聽讀達到通過標準，才可以加考該級數的說寫。本站建議：先用官方練習題熟悉題型，找出最弱的一項多練；聽讀考過後再加練寫作和口說。
  items_title: 初級題型與時間（官方）
  items:
  - title: 聽力
    text: 30 題，約 20 分鐘；看圖辨義、問答、簡短對話、短文聽解。
  - title: 閱讀
    text: 30 題，35 分鐘；詞彙、段落填空、閱讀理解。
  - title: 寫作
    text: 16 題，40 分鐘；單句寫作與段落寫作。
  - title: 口說
    text: 18 題，約 10 分鐘；複誦、朗讀、回答問題。
  checklist_title: 準備進度
  checklist:
  - 做過聽讀練習
  - 找出弱項
  - 練過說寫題型
  activity_figure: gept1-flow
  notes:
  - 準備順序是本站建議；題數與時間依 LTTC 官網。
  sources:
  - gept-elementary
what:
  heading: 看懂初級的通過標準
  body:
  - 聽力和閱讀是量尺分數，各滿分 120：兩項總和達 160 分，且任一項不低於 72 分才算通過。答對題數要經統計程序轉換成量尺分數，所以練習題的答對題數不能直接換算。寫作通過標準 70 分、口說 80 分（各滿分 100）。聽讀說寫都通過，LTTC 會發聽讀說寫四項合格證書。
  items_title: 學完能做到
  items:
  - title: 說出通過標準
    text: 聽讀 160 分且單項不低於 72 分。
  - title: 知道考試順序
    text: 聽讀過了才能加考說寫。
  - title: 找出弱項
    text: 用練習題找出最弱的一項。
  checklist_title: 家長檢核
  checklist:
  - 知道通過標準
  - 知道考試順序
  - 看正式成績單
  figures:
  - gept1-compare
  notes:
  - 報名前以 LTTC 官網最新公告為準。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網E-BOT），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去。
  sources:
  - gept-elementary
  - gept-faq
  - genai-student
