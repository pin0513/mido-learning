idea: 全民英檢（GEPT）由語言訓練測驗中心（LTTC）辦理，初級對應 CEFR A2：能聽懂價格、時間、地點，讀懂路標、菜單、時刻表，能簡單自我介紹、寫明信片與便條。聽讀通過後才能加考說寫，四項都過才是完整的初級。
guiding_questions:
- 初級聽讀過了，寫作和口說也過得了嗎？
scenario: 親子共學：全家訂一個「英檢日」：孩子做模擬題，大人計時並當口說考官，結束後一起對照通過標準。
goal: 四項一起準備：通過全民英檢初級聽讀，再加考寫作與口說。
review: 做一回完整的全民英檢初級官方模擬題並對照官方通過標準：聽力與閱讀總分 160 分以上，且單項不低於 72 分（各滿分 120）；寫作 70 分、口說 80 分以上。家長看成績單或模擬分數打勾。
