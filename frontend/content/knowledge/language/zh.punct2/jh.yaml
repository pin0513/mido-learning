why:
  heading: 標點會改變說服力
  body:
  - 國語文課綱要國中生「善用標點符號，增進情感表達及說服力。」會考寫作把同一句話列為重要的寫作能力；評分規準的第四個向度就是「錯別字、格式與標點符號」。
  - 教育部《重訂標點符號手冊》說頓號「用於並列連用的詞、語之間」，分號「用於分開複句中平列的句子」。用對了，讀者一眼就看出哪些東西是並列的。
  qa:
    question: 「我買了蘋果，香蕉，橘子和葡萄。」哪幾個逗號該換成頓號？
    answer: 蘋果、香蕉、橘子、葡萄是並列的詞，手冊說頓號「用於並列連用的詞、語之間」，所以兩個逗號都換成頓號：「我買了蘋果、香蕉、橘子和葡萄。」最後兩項之間已經有「和」，就不必再加頓號；手冊頓號的例句「可以用『閉月羞花』、『明眸皓齒』和『國色天香』等成語」也是這樣。
    source: punct
  items_title: 國中課綱的標點目標
  items:
  - title: 比較標點的效果
    text: 國語文 5-Ⅳ-1：比較不同標點符號的表達效果，流暢朗讀各類文本，並表現情感的起伏變化。
    code: 5-IV-1
  - title: 善用標點
    text: 國語文 6-Ⅳ-1：善用標點符號，增進情感表達及說服力。
    code: 6-IV-1
  - title: 標點的不同效果
    text: 國語文 Ac-Ⅳ-1：標點符號在文本中的不同效果。
    code: Ac-IV-1
