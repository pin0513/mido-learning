how:
  heading: 先找完整的意思
  body:
  - 把一段話唸出來，一個意思說完就用句號；並列的詞用頓號，並列的句子用分號；要補充說明或語意轉變，用破折號。破折號和刪節號都「占行中二格」。引用別人說的話或要特別強調的詞語，用引號「」；引號裡面還要再引用，就用『』。
  items:
  - title: 頓號
    text: 用於並列連用的詞、語之間。
    example: 蘋果、香蕉、橘子
  - title: 分號
    text: 用於分開複句中平列的句子。
    example: 鯨魚是獸類，不是魚類；蝙蝠是獸類，不是鳥類。
  - title: 破折號
    text: 用於語意的轉變、聲音的延續，或補充說明某詞語。
  - title: 刪節號
    text: 用於節略原文、語句未完、意思未盡，或語句斷斷續續。
  checklist_title: 改一段作文：
  checklist:
  - 唸出來
  - 意思完整用句號
  - 並列詞用頓號
  - 查手冊
