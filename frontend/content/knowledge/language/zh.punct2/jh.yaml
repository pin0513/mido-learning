# B4 提案：zh.punct2@jh（逐條對照教育部《重訂標點符號手冊》修訂版）
# - 用語錯誤：原文「篇名號〈〉」。手冊沒有「篇名號」，〈〉是書名號的乙式，「《 》多用於書名，〈 〉多用於篇名」（p.14）。idea、goal 改正。
# - 破折號原文「表示解釋或轉折」不完整；依手冊「用於語意的轉變、聲音的延續，或在行文中為補充說明某詞語之處……」（p.12）改寫。頓號、分號、刪節號依手冊 p.4、5、13 逐字。
# - 「一逗到底」是本站整理的說法；「每 3 行 1 個句號」標示意。
# - 補 grades、5-Ⅳ-1、6-Ⅳ-1、Ac-Ⅳ-1 與 Why/How/What；連結會考寫作「能善用標點符號，增進情感表達及說服力」。
# - 複審修正：goal 有「引號」，補手冊引號的說明（p.7）；「和」前不加頓號引手冊頓號例句（p.4）佐證。
