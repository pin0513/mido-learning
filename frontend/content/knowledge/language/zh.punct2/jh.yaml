what:
  heading: 書名號：《》與〈〉
  figures:
  - what-compare
  notes:
  - 引號「」『』「用於標示說話、引語、特別指稱或強調的詞語」；「通常先用單引號，如果有需要，單引號內再用雙引號」（手冊 p.7）。例如：俗語說：「學如逆水行舟，不進則退。」
  - 手冊的書名號有甲、乙兩式，可以自由選用；甲式「直行標在書名左旁，橫行標在書名之下」，乙式是《》〈〉。
  - 「每 3 行 1 個句號」只是示意的自我檢查，不是手冊或會考的規定。
  sources:
  - punct
