idea: 並列的詞語用頓號；複句中平列的句子用分號；破折號用在語意轉變、聲音延續或補充說明；刪節號用在節略原文、語句未完、意思未盡。書名號乙式《》多用於書名、〈〉多用於篇名。常見的毛病是「一逗到底」（本站整理的說法）：整段只有逗號，最後才一個句號。
guiding_questions:
- 「我買了蘋果，香蕉，橘子和葡萄。」哪幾個逗號該換成頓號？
scenario: 親子共學：複習版：拿自己一篇舊作文，數一數句號有幾個；如果每 3 行（示意）還找不到 1 個句號，就找出可以斷開的地方。
goal: 會用頓號、分號、破折號、刪節號、引號與書名號（《》、〈〉），不再一逗到底。
review: 拿孩子一篇舊作文，數每 3 行的句號數；改寫後每 3 行至少 1 個句號（示意），並至少正確用到頓號、引號、書名號各一次，家長對照教育部《重訂標點符號手冊》核對。
