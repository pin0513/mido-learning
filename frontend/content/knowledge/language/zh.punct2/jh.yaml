idea: 並列的詞用頓號；並列的句子用分號；破折號表示解釋或轉折；刪節號表示省略；書名號《》用於書名，篇名號〈〉用於篇名。最常見的毛病是「一逗到底」：整段只有逗號，最後一個句號。
guiding_questions:
- 「我買了蘋果，香蕉，橘子和葡萄。」哪幾個逗號該換成頓號？
scenario: 親子共學：複習版：拿自己一篇舊作文，數一數句號有幾個；每 3 行少於 1 個句號，就找出可以斷開的地方。
goal: 會用頓號、分號、破折號、引號、書名號與篇名號，不再一逗到底。
review: 拿孩子一篇舊作文，數每 3 行的句號數；改寫後每 3 行至少 1 個句號，並至少正確用到頓號、書名號各一次，家長對照手冊核對。
