  - rev-jinti
  - rev-changduan
how:
  heading: 數句數，找對仗
  body:
  - 拿到一首作品，先數句數和每句字數：八句、每句五字或七字，可能是律詩；句子長短不一、有詞牌名，是詞；句數不固定、不一定對仗的，可能是古體詩。律詩再找第三四句、第五六句，看詞性和意思是不是兩兩相對。平仄只要知道有規則，國中不必自己辨認（本站建議）。
  items:
  - title: 律詩
    text: 每首八句，二、四、六、八句押韻，三四、五六兩句對仗。
  - title: 對仗
    text: 詩文中句子的對偶。
  - title: 詞牌
    text: 詞調的名稱，例如水調歌頭、菩薩蠻。
  - title: 詞
    text: 句法多長短不一，又稱「詩餘」「長短句」。
  checklist_title: 判斷一首作品：
  checklist:
  - 數句數
  - 數每句字數
  - 找詞牌名
  - 找對仗
