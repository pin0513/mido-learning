why:
  heading: 國中要讀的韻文
  body:
  - 國語文課綱的國中學習內容列出「韻文：如古體詩、樂府詩、近體詩、詞、曲等。」教材編選也說國中選材「應包含古今散文、古典詩詞曲選（含本土素材）、現代詩選、文化經典選讀及語文基礎常識等。」
  - 認得體裁的規則，就知道為什麼這裡要對仗、為什麼那裡句子忽長忽短。
  qa:
    question: 為什麼有的詩每句一樣長，有的「詞」長短不齊？
    answer: 近體詩的聲韻有定則，除排律外句數都有限制；律詩每首八句，分五言律詩、七言律詩兩種，所以每句一樣長。詞要依詞牌（詞調的名稱）來寫，「詞因句法多長短不一，故又稱為「長短句」」。
    source: rev-changduan
  items_title: 國中課綱怎麼說
  items:
  - title: 國中要讀的韻文
    text: 國語文 Ad-Ⅳ-3：韻文：如古體詩、樂府詩、近體詩、詞、曲等。
    code: Ad-IV-3
  - title: 理解形式和寫作特色
    text: 國語文 5-Ⅳ-3：理解各類文本內容、形式和寫作特色。
    code: 5-IV-3
