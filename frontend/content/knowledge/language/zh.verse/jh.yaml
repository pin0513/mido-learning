idea: 唐代近體詩有固定字數、押韻與平仄；律詩八句，中間兩聯要對仗。詞依詞牌填寫，句子長短不一，原本是可以唱的歌詞。國中材料包含古典詩詞曲選。
guiding_questions:
- 為什麼有的詩每句一樣長，有的「詞」長短不齊？
scenario: 親子共學：全家各挑一首詞找出詞牌名，搜尋同詞牌的另一首，比較句子長短是不是一樣。
goal: 分辨古體詩、近體詩與詞，說出律詩的對仗與詞的長短句。
review: 家長給一首律詩和一首詞，孩子說出各是什麼體裁、標出律詩中間兩聯的對仗，並說出詞牌名；三項都對。
