idea: 近體詩約形成於唐代，「聲韻有定則，且除排律外，句數都有限制」；古體詩則「句數無限制，用韻無定則，不拘平仄對偶」。律詩每首八句，二、四、六、八句押韻，三四、五六兩句要對仗。詞的句法多長短不一，所以又叫「長短句」；詞牌是「詞調的名稱」，例如水調歌頭、菩薩蠻。國中選材包含「古典詩詞曲選」。
guiding_questions:
- 為什麼有的詩每句一樣長，有的「詞」長短不齊？
scenario: 親子共學：全家各挑一首詞找出詞牌名，搜尋同詞牌的另一首，比較句子長短是不是一樣。
goal: 分辨古體詩、近體詩與詞，說出律詩的對仗與詞的長短句。
review: 家長給一首律詩和一首詞，孩子說出各是什麼體裁、標出律詩第三四句和第五六句的對仗，並說出詞牌名；三項都對。
