what:
  heading: 律詩和詞，哪裡不一樣
  figures:
  - what-compare
  notes:
  - 《國語小字典》說詞「興起於唐代，在宋代最為興盛。由古之樂府演變而來，其後又遞變而為曲。」
  - 《重編國語辭典修訂本》說古體詩「相對於近體詩而言。每句有四言、五言、六言、七言等，句數無限制，用韻無定則，不拘平仄對偶。」
  - 平仄只做入門介紹，不要求國中生辨平仄（本站建議）。
