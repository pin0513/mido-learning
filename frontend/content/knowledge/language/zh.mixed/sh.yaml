idea: 學測國綜有混合題，要求用文字回答。答題順序：先直接回答題目，再寫「依據文中……」，字數照規定，不抄整段。
guiding_questions:
- 選擇題選對了，寫成一句話的答案你也寫得出來嗎？
scenario: 親子共學：大人和孩子各寫同一題的答案，交換看誰的「依據」比較清楚。
goal: 寫混合題的非選答案：用自己的話作答，並引出文中依據。
review: 家長從學測國綜歷屆試題挑 2 題非選擇題，孩子限時作答；對照官方參考答案，每題都有「答案＋依據」兩部分。
