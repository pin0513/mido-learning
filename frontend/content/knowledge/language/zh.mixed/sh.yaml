why:
  heading: 選對了，也要寫得出來
  body:
  - 大考中心說，混合題型是在選擇題之外，「進一步在非選擇題中，用精簡的文字表述答案或說明理由，以顯露思考的過程」。非選擇題約「占國綜全卷 100 分中 20-28 分」。
  - 國語文課綱要高中生「辨析文本的寫作主旨、風格、結構及寫作手法」，也要「歸納文本中不同論點，形成個人的觀點」。
  qa:
    question: 選擇題選對了，寫成一句話的答案你也寫得出來嗎？
    answer: 要練。大考中心說，混合題的非選擇題要「以簡單明瞭的方式，解釋說明文本的內容或形式」，而且「答案相對較為明確、答題字數相對較少」；和國寫要提出個人見解不同。
    source: ceec
  items_title: 高中課綱的閱讀目標
  items:
  - title: 辨析主旨與手法
    text: 國語文 5-Ⅴ-1：辨析文本的寫作主旨、風格、結構及寫作手法。
    code: 5-V-1
  - title: 歸納不同論點
    text: 國語文 5-Ⅴ-2：歸納文本中不同論點，形成個人的觀點，發展系統性思考以建立論述體系。
    code: 5-V-2
  sources:
  - ceec
  - kuoyu
how:
  heading: 答案先寫，依據跟上
  body:
  - 大考中心說，非選擇題讓考生「嘗試使用自己的語言，寫出對於文本理解、分析甚至推理的結果」。作答時先用一句話直接回答，再寫依據（本站建議）。
  items_title: 作答順序（本站建議）
  items:
  - title: 先答題目問的
    text: 第一句直接回答，不先繞背景。
  - title: 再寫依據
    text: 寫「依據文中……」，指出是哪一段、哪一句。
  - title: 用自己的話
    text: 改寫重點，不抄整段原文。
  - title: 照建議字數
    text: 考試說明的範例會寫「建議作答字數」。
  checklist_title: 寫完檢查：
  checklist:
  - 第一句是答案
  - 有寫依據
  - 沒有抄整段
  - 字數合規定
