idea: 學測國綜有「混合題型（兼含選擇題與非選擇題）」，大考中心說非選擇題要「用精簡的文字表述答案或說明理由」。答題順序（本站建議）：先直接回答題目，再寫「依據文中……」，字數照題目建議，不抄整段。
guiding_questions:
- 選擇題選對了，寫成一句話的答案你也寫得出來嗎？
scenario: 親子共學：大人和孩子各寫同一題的答案，交換看誰的「依據」比較清楚。
goal: 寫混合題的非選答案：用自己的話作答，並引出文中依據。
review: 家長從學測國綜歷屆試題挑 2 題（2 題為示意）非選擇題，孩子限時作答；對照大考中心公布的參考答案或評分原則，每題都有「答案＋依據」兩部分。
