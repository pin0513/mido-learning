# B3 提案：zh.wrongchar@es
# - 「他跑的很快」要寫「得」：依《國語小字典》，得「放在動詞或形容詞後面，表示程度、結果或狀態」，的沒有這個義項；答案正確，但改成引用字典的說法，不寫成絕對規則。
# - 新增提醒：教育部辭典收「的」作副詞詞尾（「慢慢的走」），同「地」，不要把它判成錯字；學校老師若要求用「地」，以老師為準。
# - 複審建議：《國語小字典》來源由首頁拆成「在」「再」「的」「得」四個單字查詢網址，方便讀者核對。
# - 補上 grades [3,4]、4-II-4、Ab-II-3；「聲旁」是課綱實施要點的用語（p.48）。
