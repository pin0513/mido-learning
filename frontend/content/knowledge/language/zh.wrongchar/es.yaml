idea: 很多錯字是同音字：在（在家、我在聽音樂）、再（再一次、吃了飯再走）；的（我的書）、得（跑得快）。形聲字看部首猜意思，看聲旁猜讀音，可以少寫錯。
guiding_questions:
- 「我明天在來」和「他跑的很快」，各錯在哪裡？
scenario: 親子共學：複習版：全家各寫下自己最常寫錯的 3 個字，貼在冰箱上一週，誰寫錯就畫一筆。
goal: 分得清常見同音字（在／再、的／得），寫完會自己挑出來。
review: 家長準備 10 句（示意）含「在、再、的、得」的句子（一半寫錯），孩子圈出錯字並說出理由，答對 8 句以上（示意）。
