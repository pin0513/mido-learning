why:
  heading: 寫對字，意思才對
  body:
  - 「在」和「再」都念 ㄗㄞˋ，「的」和「得」也都有輕聲 ˙ㄉㄜ 的念法，耳朵分不出來，只能靠意思分。寫錯了，句子的意思就變了。
  - 課綱要三、四年級「能分辨形近、音近字詞，並正確使用」。國中教育會考的寫作評分也把「錯別字」列在評分向度裡。
  figures:
  - why-compare
  qa:
    question: 「我明天在來」和「他跑的很快」，各錯在哪裡？
    answer: 「我明天在來」要寫「再」：《國語小字典》說再表示重複，或兩個動作的接續（如「吃了飯再走」）；在表示動作正在進行（如「我在聽音樂」）或時間、處所。「他跑的很快」要寫「得」：得「放在動詞或形容詞後面，表示程度、結果或狀態」，例如「飛得很高」。
    source: mini-de2
  items_title: 分辨同音字的線索
  items:
  - title: 看意思
    text: 三、四年級：能分辨形近、音近字詞，並正確使用。
    code: 4-II-4
  - title: 看部首和部件
    text: 三、四年級學習內容：常用字部首及部件的表音及表義功能。
    code: Ab-II-3
  sources:
  - mini-zai
  - mini-zai2
  - mini-de2
  - kuoyu
  - cap-writing
how:
  heading: 說出為什麼是這個字
  body:
  - 寫完後挑出句子裡的在、再、的、得，各問一次：這裡是什麼意思？是「再一次、接著做」，就用再；是「正在、在哪裡」，就用在。動詞或形容詞後面接「很快、很高」這類程度，用得。
  - 課綱建議三、四年級起用部件（部首、聲旁）歸類識字：部首常提示意思，聲旁常提示讀音。
  items:
  - title: 在／再
    example: 我在家。／明天再來。
    text: 在：正在、處所、時間；再：重複、接續。
  - title: 的／得
    example: 我的書。／跑得很快。
    text: 得放在動詞或形容詞後面，表示程度。
  - title: 的＝地也可以
    example: 慢慢的走
    text: 教育部辭典收「的」作副詞詞尾，同「地」，不算錯；學校老師若要求用「地」，以老師為準。
  checklist_title: 寫完自己挑：
  checklist:
  - 圈出在和再
  - 圈出的和得
  - 說出是什麼意思
  - 不確定就查字典
