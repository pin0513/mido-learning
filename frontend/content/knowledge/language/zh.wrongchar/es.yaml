what:
  heading: 常見的兩組同音字
  notes:
  - 「的」用在名詞前表示所屬，如「我的書」；也可作副詞詞尾，如「慢慢的走」（國語小字典；《重編國語辭典》注明同「地」）。
  - 「錯別字」是「錯字和別字」的合稱（重編國語辭典）；把在寫成再，屬於用錯了字。
  sources:
  - mini-de
  - dict-de
  - dict-cuobiezi
