# B7 提案：en.grammar@jh
# - 補 grades 與 Why/How/What、兩張圖。Ad-Ⅳ-1「國中階段所學的文法句型」與國語文、第二外國語文等同號，只在內文引用；時式範圍依英語文領綱附錄六（國民中學英語文基礎文法句構參考表，pp.70–71）。
# - 錯誤修正：原 idea「英文靠動詞本身」不完整：進行式要 be 動詞＋V-ing，完成式要 have＋過去分詞，未來式要 will 或 be going to。已改寫；中文「了、在、過」的對照標為本站整理。
# - 目標只寫本點實際練到的四種時式（現在簡單式、現在進行式、過去簡單式、現在完成式；附錄六另列過去進行式、未來式）；現在完成式的用法依 Cambridge Dictionary 文法頁。
# - 檢核數字標示意；AI 依教育部學生版注意事項。
