why:
  heading: 時式讓人知道什麼時候
  body:
  - 英語文領綱實施要點說，國中「尤其應該注重其中最基礎、核心的文法句構（參見附錄六），避免冷僻、抽象文法知識的灌輸」（p.28）。附錄六列出的時式有：現在式（簡單式、進行式、完成式）、過去式（簡單式、進行式）和未來式（will…; be going to）。
  qa:
    question: 「我吃了」和「我正在吃」，英文怎麼分？
    answer: I ate. 是過去簡單式，說吃這件事在過去；I am eating. 是現在進行式，說現在正在吃。如果想說到現在為止已經吃過，用現在完成式 I have eaten.。
    source: english
  items_title: 附錄六列出的時式
  items:
  - title: 現在式
    text: 簡單式、進行式、完成式（現在完成式）。
  - title: 過去式
    text: 簡單式（規則與不規則動詞）、進行式。
  - title: 未來式
    text: 簡單式（will…; be going to）。
  checklist_title: 開始前先確認
  checklist:
  - 會 be 動詞
  - 會一般動詞
  notes:
  - 英語文 Ad-Ⅳ-1「國中階段所學的文法句型。」與其他領綱同號，只在內文引用。
  sources:
  - english
how:
  heading: 同一件事，換時式說
  body:
  - 本站建議：拿同一件事，用不同時式各說一次，比較動詞怎麼變。例如 I play basketball every day. / I am playing basketball now. / I played basketball yesterday. / I have played basketball for three years.
  items_title: 本站建議的練法
  items:
  - title: 現在簡單式
    text: I play every day.（習慣）
  - title: 現在進行式
    text: I am playing now.（正在做）
  - title: 過去簡單式
    text: I played yesterday.（過去）
  - title: 現在完成式
    text: I have played for three years.
  checklist_title: 每次練完勾一下
  checklist:
  - 同一件事
  - 換四種時式
  - 動詞改對
  activity_figure: grammar-flow
  notes:
  - 練法和例句是本站建議。附錄六還列了過去進行式和未來式，本點先練這四種（本站建議）。
  sources:
  - english
what:
  heading: 選對時式說自己的事
  body:
  - 學完後，孩子能依事情發生的時間選對時式，寫出關於自己的句子。Cambridge Dictionary 說明，現在完成式用來說發生在過去、但和現在有關的事，例如到現在為止的經驗。
  items_title: 學完能做到
  items:
  - title: 選對時式
    text: 依時間選現在式、過去式或現在完成式。
  - title: 改對動詞
    text: 過去式、V-ing、過去分詞寫對。
  - title: 說自己的事
    text: 用時式寫自己的生活。
  checklist_title: 家長檢核
  checklist:
  - 時式選對
  - 動詞改對
  - 寫的是自己的事
  figures:
  - grammar-compare
  notes:
  - 檢核用的 2 句、7 句是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網E-BOT），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去。
  sources:
  - camb-pp
  - camb-pc
  - english
  - genai-student
