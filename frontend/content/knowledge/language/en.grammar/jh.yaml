  supports: 學習重點：Ad-Ⅳ-1「國中階段所學的文法句型。」（p.17）；實施要點（4）文法句構「國民中學教育階段尤其應該注重其中最基礎、核心的文法句構（參見附錄六），避免冷僻、抽象文法知識的灌輸」（p.28）；附錄六「國民中學英語文基礎文法句構參考表」時式：1.現在式（簡單式、進行式「現在進行式的基本句型：直述句、否定句、疑問句及答句」、完成式「現在完成式：直述句、否定句、疑問句及答句」），2.過去式（簡單式「規則動詞與不規則動詞的過去式」、進行式），3.未來式「簡單式 (will…; be going to)」（pp.70–71）；編碼說明「Ⅱ代表第二學習階段（國民小學 3-4 年級），Ⅲ代表第三學習階段（國民小學 5-6 年級），Ⅳ代表第四學習階段（國民中學 7-9 年級）」（p.8）；時間分配：英語文必修國小三、四年級每週 1 節，五、六年級每週 2 節，國中每週 3 節（p.4）
