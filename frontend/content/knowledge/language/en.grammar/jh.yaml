idea: 英文用動詞形式說出時間：過去式要改動詞（played、went）；依 Cambridge Dictionary 文法頁，現在進行式用 am、are、is 加動詞的 -ing 形式，現在完成式用 have/has 加動詞的 -ed 形式（不規則動詞要另外記過去分詞，例如 eaten，本站整理）；未來式用 will 或 be going to（英語文領綱附錄六）。中文常用「了、在、過」這類字表示（本站整理的對照），英文則要改動詞形式或加助動詞。
guiding_questions:
- 「我吃了」和「我正在吃」，英文怎麼分？
scenario: 親子共學：拍家裡三個人（示意）正在做的事，用現在進行式寫說明；一小時後（示意）改成過去式再寫一次。
goal: 用四種常用時式（現在簡單式、現在進行式、過去簡單式、現在完成式）說出事情發生的時間。
review: 孩子用現在簡單式、現在進行式、過去簡單式、現在完成式各寫 2 句關於自己的事，家長對照文法書確認 8 句裡至少 7 句正確（2 句、7 句是示意）。
