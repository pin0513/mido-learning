idea: 英文用動詞的變化說出時間：現在、過去、正在進行、已經完成。中文靠「了、在、過」，英文靠動詞本身。
guiding_questions:
- 「我吃了」和「我正在吃」，英文怎麼分？
scenario: 親子共學：拍家裡三個人正在做的事，用現在進行式寫說明；一小時後改成過去式再寫一次。
goal: 用現在式、過去式、進行式、完成式說出事情發生的時間。
review: 孩子用 4 種時態各寫 2 句關於自己的事，家長對照文法書確認 8 句裡至少 7 句正確。
