idea: 讀長文要會推論：作者的立場、語氣、舉這個例子的目的。本站建議：先略讀標題、各段第一句和轉折語抓架構；作者沒明寫立場時，從帶評價的字、選的例子和語氣推論；再細讀找證據，分清哪些是事實、哪些是作者的意見。
guiding_questions:
- 作者沒直接寫出來的意思，你怎麼讀出來？
scenario: 親子共學：讀一篇英文評論，用螢光筆畫出作者的立場句；如果沒有明寫，就從帶評價的字、例子和語氣推論，再找兩句（示意）支持它的證據。
goal: 讀長文時用略讀抓架構、細讀找證據，並從帶評價的字、例子和語氣推論作者沒寫出來的立場。
review: 孩子讀一篇約 400 字的英文評論（學測題組選文約 180 至 400 字），畫出作者立場句並找 2 句證據，說出其中一個例子在支持哪個論點；再讀一段沒有明寫立場的段落，用帶評價的字、例子或語氣說出推論的理由；最後做一組學測英文閱讀測驗，答對 7 成以上（400 字、2 句、7 成為示意）。
