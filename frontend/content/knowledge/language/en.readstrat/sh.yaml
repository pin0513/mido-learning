idea: 讀長文要會推論：作者的立場、語氣、舉這個例子的目的。用略讀抓架構，再用細讀找證據。
guiding_questions:
- 作者沒直接寫出來的意思，你怎麼讀出來？
scenario: 親子共學：讀一篇英文評論，用螢光筆畫出作者的立場句，再找兩句支持它的證據。
goal: 讀長文時用略讀抓架構、細讀找證據，推論作者沒寫出來的立場。
review: 孩子讀一篇 400 字英文評論，畫出作者立場句並找 2 句證據；再做一組學測英文閱讀測驗，答對 7 成以上。
