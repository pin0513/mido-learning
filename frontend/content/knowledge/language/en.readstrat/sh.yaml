why:
  heading: 作者沒寫出來的也要讀懂
  body:
  - 英語文領綱第五學習階段要學生「能分析及判斷文章內容，了解敘述者的觀點、態度及寫作目的。」（3-Ⅴ-15）、「能依上下文分辨客觀事實與主觀意見。」（9-Ⅴ-3），學習內容有「敘述者的觀點、態度、及寫作目的。」（Ae-Ⅴ-12）。
  - 大考中心說，學測題組「旨在評量考生是否能閱讀文長約 180 至 400 字之選文，理解其文意脈絡及篇章結構」。
  qa:
    question: 作者沒直接寫出來的意思，你怎麼讀出來？
    answer: 看作者選了哪些例子、用了哪些帶評價的字、轉折語後面強調什麼（本站建議）。英語文領綱也要學生「能利用文本的結構特色（如轉折語、陳述次序等），增進文意理解。」
    source: english
  items_title: 高中英語文課綱的相關條目
  items:
  - title: 轉折語與結構
    text: 英語文 7-Ⅴ-5：能利用文本的結構特色（如轉折語、陳述次序等），增進文意理解。
    code: 7-V-5
  - title: 事實與意見
    text: 英語文 9-Ⅴ-3：能依上下文分辨客觀事實與主觀意見。
    code: 9-V-3
  - title: 觀點態度目的
    text: 英語文 Ae-Ⅴ-12：敘述者的觀點、態度、及寫作目的。
    code: Ae-V-12
  checklist_title: 讀之前先想
  checklist:
  - 這是什麼文體
  - 作者想說服誰
  sources:
  - english
  - ceec-english
how:
  heading: 先略讀架構，再細讀證據
  body:
  - 本站建議：第一遍只讀標題、各段第一句和轉折語，抓出文章架構；有明寫的立場句就畫出來。沒有明寫時，從三個線索推論作者的立場：帶評價的字（例如 unfortunately、merely）、作者選了哪些例子、整篇的語氣是讚許、擔心還是諷刺。
  - 看到例子時問自己：這個例子在支持哪一個論點？拿掉它，哪個論點就少了證據（本站建議）。第二遍細讀，畫出支持立場的證據，並標出哪些句子是事實、哪些是意見。
  - 猜字義時，英語文領綱的學習表現是「能利用字詞結構、上下文意、句型結構及篇章組織推測字詞意義或句子內容。」（3-Ⅴ-12）。用 AI 練習時，照教育部注意事項（學生版）做：先確認符合平臺的註冊年齡限制，優先用為教育目的設計的工具（例如酷英網的 CoolE Bot），在家使用請家長陪伴；不輸入自己或他人的個人資料；AI 的回答要查證，不直接採信；作業「應依規定註明所使用的工具及用途，不得將生成內容直接當作自己原創作品繳交」，也不能用 AI 抄襲、代寫或作弊。
  items_title: 本站建議的讀法
  items:
  - title: 略讀架構
    text: 標題、各段首句、轉折語。
  - title: 找出或推論立場
    text: 有立場句就畫；沒有就看評價字、例子、語氣。
  - title: 問例子的目的
    text: 這個例子支持哪一個論點。
  - title: 找證據分事實意見
    text: 畫出支持立場的句子；可以查證的是事實。
  checklist_title: 讀完勾一下
  checklist:
  - 找出或推論立場
  - 說出例子目的
  - 找到證據
  - 分出事實意見
  activity_figure: readstrat-flow
  sources:
  - english
  - genai-student
  - moe-coolebot
what:
  heading: 讀出作者的立場
  body:
  - 學完後，孩子能在一篇英文長文裡找出或推論作者的立場、找出證據，分清事實和意見，並說出作者舉例的目的。
  items_title: 學完能做到
  items:
  - title: 找出立場
    text: 畫出立場句，或用評價字、例子、語氣推論。
  - title: 找出證據
    text: 說出支持立場的句子。
  - title: 說出舉例目的
    text: 這個例子支持哪個論點。
  - title: 分清事實意見
    text: 說出判斷理由。
  checklist_title: 家長檢核
  checklist:
  - 立場有根據
  - 證據對得上
  - 說得出例子目的
  figures:
  - readstrat-compare
  notes:
  - 選文長度依大考中心；把高中對應學測是本站建議，不是官方換算。
  - 情境的兩句與檢核的 400 字、2 句、7 成是示意；略讀、細讀、推論立場的步驟和例詞是本站建議。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網的 CoolE Bot），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - english
  - genai-student
  - moe-coolebot
