idea: 文化庁〈敬語の指針〉把敬語分成尊敬語、謙譲語Ⅰ、謙譲語Ⅱ（丁重語）、丁寧語、美化語五種。尊敬語抬高對方或第三者的行為，例如いらっしゃる；謙譲語Ⅰ抬高自己行為所朝向的人，例如伺う；謙譲語Ⅱ是對聽話的人鄭重地說自己的事，例如参る。
guiding_questions:
- 為什麼對客人說話時，連「去」都要換一個字？
scenario: 親子共學：設定一個虛構的打工情境（虛構的店名和人名），把一段接待客人的對話改成敬語，標出哪些是尊敬語、謙譲語Ⅰ、謙譲語Ⅱ（本站建議）。
goal: 分清尊敬語、謙譲語Ⅰ、謙譲語Ⅱ，依說的是誰的行為、行為朝向誰選對敬語，並避開指針舉的誤用。
review: 家人給 5 個情境（說老師的行為、說自己去拜訪老師、對客人說自己的行程等），學習者各說一句敬語，並說出是尊敬語、謙譲語Ⅰ還是謙譲語Ⅱ；至少 4 句對（題數是示意）。
