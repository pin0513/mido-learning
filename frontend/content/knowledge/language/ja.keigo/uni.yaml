idea: 敬語分尊敬語（抬高對方）和謙讓語（降低自己）。「行く」對客人說「いらっしゃる」，說自己用「参る」。
guiding_questions:
- 為什麼對客人說話時，連「去」都要換一個字？
scenario: 親子共學：把一段打工的日文對話（點餐、結帳）改成標準敬語，再對照真實店員的說法。
goal: 分清尊敬語與謙讓語，在正式場合用對。
review: 家長給 5 個情境（對客戶、對老師），學習者各說一句正確的敬語，並說出是尊敬語還是謙讓語；至少 4 句對。
