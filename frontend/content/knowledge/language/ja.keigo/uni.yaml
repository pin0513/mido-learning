why:
  heading: 五種敬語，分工不同
  body:
  - 〈敬語の指針〉（文化審議會 2007 年答申）說：「本答申の第２章以降では，敬語を『尊敬語・謙譲語Ⅰ・謙譲語Ⅱ・丁寧語・美化語』の５種類に分けて解説する。」又說「謙譲語として一括されている語群を『謙譲語Ⅰ』と『謙譲語Ⅱ』の２群に，また丁寧語としてまとめられている語群を『丁寧語』と『美化語』の２群に，それぞれ区分けしたもので，従来の考え方に基づいたものである。」也就是把原本合稱謙讓語的一群，分成謙譲語Ⅰ和謙譲語Ⅱ。
  - 指針也說（節錄）：「現代社会においては，その人を尊重しようという気持ちを表すこと，その人の立場に配慮すること，その人と親しいか親しくないかといった親しさの程度を示そうとすることなどの意識に基づいて使われていると言ってよい。」並以「相互尊重」為基本。
  items_title: 指針的五種敬語
  items:
  - title: 尊敬語
    text: 「いらっしゃる・おっしゃる」型
  - title: 謙譲語Ⅰ
    text: 「伺う・申し上げる」型
  - title: 謙譲語Ⅱ（丁重語）
    text: 「参る・申す」型
  - title: 丁寧語、美化語
    text: 「です・ます」型、「お酒・お料理」型
  notes:
  - 本站建議：把本點放在大學階段、對應 JLPT N2 是本站建議，不是官方換算。JLPT 官網寫 N2 是「日常的な場面で使われる日本語の理解に加え、より幅広い場面で使われる日本語をある程度理解することができる」。
  sources:
  - keigo
  - jlpt-levels
how:
  heading: 先問誰的行為、朝向誰
  body:
  - 〈敬語の指針〉的定義：尊敬語是「相手側又は第三者の行為・ものごと・状態などについて，その人物を立てて述べるもの。」；謙譲語Ⅰ是「自分側から相手側又は第三者に向かう行為・ものごとなどについて，その向かう先の人物を立てて述べるもの。」；謙譲語Ⅱ是「自分側の行為・ものごとなどを，話や文章の相手に対して丁重に述べるもの。」
  - 判斷順序（本站整理）：對方或第三者的行為用尊敬語，例如「先生は来週海外へいらっしゃるんでしたね。」；自己的行為朝向要尊敬的人，用謙譲語Ⅰ，例如「先生のところに伺います。」；只是對聽話的人鄭重地說自己的事，用謙譲語Ⅱ，例如「明日から海外へ参ります。」指針說「謙譲語Ⅱは，一般に『ます』を伴って使う。」用 AI 練習時，先自己改好、標出分類，再請 AI 對照；兩邊不同時，回指針的定義和例語核對（本站建議）。
  - 指針舉的誤用：「『（あなたは）どちらから参りましたか。』『先生は来週海外へ参ります。』などと使うのは，不適切である。」——参る不能用來說對方或要尊敬的人的行為。指針也說「『弟のところに伺います。』は，明らかな誤用である」，因為弟弟不是要抬高的人。
  qa:
    question: 為什麼對客人說話時，連「去」都要換一個字？
    answer: 因為要分清是誰去：客人去，用尊敬語いらっしゃる；自己去拜訪對方，用謙譲語Ⅰ伺う；對客人鄭重地說自己要去哪裡，用謙譲語Ⅱ参る（例句依〈敬語の指針〉，整理是本站整理）。
    source: keigo
  items_title: 指針的例語
  items:
  - title: 尊敬語
    text: 對方或第三者的行為
    example: いらっしゃる，おっしゃる，なさる，召し上がる
  - title: 謙譲語Ⅰ
    text: 自己朝向對方的行為
    example: 伺う，申し上げる，お目に掛かる，差し上げる
  - title: 謙譲語Ⅱ（丁重語）
    text: 對聽話的人鄭重說自己的事
    example: 参る，申す，いたす，おる
  - title: 常見誤用
    text: 不用参る說對方的行為
    example: （あなたは）どちらから参りましたか。
  checklist_title: 每次練完勾一下
  checklist:
  - 先問誰的行為
  - 看行為朝向誰
  - 参る不說對方
  activity_figure: keigo-flow
  sources:
  - keigo
what:
  heading: 依行為選對敬語
  body:
  - 學完後，能依說的是誰的行為、行為朝向誰，選對尊敬語、謙譲語Ⅰ或謙譲語Ⅱ，並避開把参る用在對方行為上的誤用。
  items_title: 學完能做到
  items:
  - title: 分辨三種
    text: 尊敬語、謙譲語Ⅰ、謙譲語Ⅱ。
  - title: 說對例句
    text: 依情境說出敬語。
  - title: 避開誤用
    text: 参る不說對方的行為。
  checklist_title: 自我檢核
  checklist:
  - 分類正確
  - 例句正確
  - 沒有誤用
  figures:
  - keigo-compare
  notes:
  - 檢核的 5 個情境、4 句是示意。
  - 用生成式 AI 時，不要把個人資訊、未公開文件、機密資料貼進去（教育部臺灣學術倫理教育資源中心 2023 年的電子報）；不上傳自己或別人的錄音（本站建議）；AI 的輸出要自己查證。同一份電子報也說，學術界對使用生成式 AI 是否需要標註「尚無統一的規定」，建議先了解相關單位的政策；交作業時依課程規定說明用了哪個工具、做了什麼；AI 規定變化快，以學校和課程最新的規定為準（本站建議）。作業要自己寫，不把 AI 生成的內容直接當成自己的作品（本站建議）；同一份電子報還說，直接使用生成內容「可能有代寫的學術倫理問題」。
  sources:
  - keigo
  - ethics-epaper13
