- id: keigo
  title: 敬語の指針（文化審議会答申，平成19年2月2日）
  publisher: 文化庁（文化審議会）
  url: https://www.bunka.go.jp/seisaku/bunkashingikai/kokugo/hokoku/pdf/keigo_tosin.pdf
  accessed: '2026-10-29'
  kind: government
  supports: p.3「本答申の第２章以降では，敬語を『尊敬語・謙譲語Ⅰ・謙譲語Ⅱ・丁寧語・美化語』の５種類に分けて解説する。」、「謙譲語として一括されている語群を『謙譲語Ⅰ』と『謙譲語Ⅱ』の２群に，また丁寧語としてまとめられている語群を『丁寧語』と『美化語』の２群に，それぞれ区分けしたもので，従来の考え方に基づいたものである。」；p.13 表：尊敬語（「いらっしゃる・おっしゃる」型）、謙譲語Ⅰ（「伺う・申し上げる」型）、謙譲語Ⅱ（丁重語）（「参る・申す」型）、丁寧語（「です・ます」型）、美化語（「お酒・お料理」型）；p.14 尊敬語「相手側又は第三者の行為・ものごと・状態などについて，その人物を立てて述べるもの。」例「先生は来週海外へいらっしゃるんでしたね。」；p.15 謙譲語Ⅰ「自分側から相手側又は第三者に向かう行為・ものごとなどについて，その向かう先の人物を立てて述べるもの。」；p.18 謙譲語Ⅱ「自分側の行為・ものごとなどを，話や文章の相手に対して丁重に述べるもの。」例「明日から海外へ参ります。」，「『（あなたは）どちらから参りましたか。』『先生は来週海外へ参ります。』などと使うのは，不適切である。」；p.19「先生のところに伺います。」、「一方，謙譲語Ⅱは，一般に『ます』を伴って使う。」；p.33（節錄）「現代社会においては，その人を尊重しようという気持ちを表すこと，その人の立場に配慮すること，その人と親しいか親しくないかといった親しさの程度を示そうとすることなどの意識に基づいて使われていると言ってよい。」、「相互尊重」；p.38「『弟のところに伺います。』は，明らかな誤用であるのに対して，『弟のところに参ります。』は問題のない敬語の使い方である。」
