idea: 引導寫作的題幹會給情境與任務。先把題目拆成幾個要回答的問題，每一個都要在文章裡找得到。
guiding_questions:
- 「賦予什麼新面貌？又會怎麼做？」要回答幾件事？
scenario: 親子共學：拿近三年會考題目，各用 5 分鐘只做審題：列出要回答的問題，不寫文章。
goal: 把引導寫作的題目拆成要回答的問題清單，寫完逐項打勾。
review: 拿一題會考寫作歷屆題目，孩子 5 分鐘內列出題目要回答的問題；家長對照題幹，沒有漏掉任何一問。
