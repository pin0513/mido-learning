why:
  heading: 審題錯，整篇就偏
  body:
  - 會考寫作的命題依據是國語文課綱第四學習階段，重要能力的第一項是「能正確審題依據題目或寫作任務，統整閱讀內容、配合語言情境，適當轉化材料以表情達意。」
  - 評分規準的零級分包括「完全離題」；審題是寫作的第一步，課綱也把「審題」列在寫作步驟的最前面。
  qa:
    question: 「你想賦予什麼事物新面貌？又會怎麼做？」要回答幾件事？
    answer: 至少三件：一、你選了什麼事物（賦予什麼事物新面貌）；二、你會怎麼做；三、題目最後要求「請結合你的經驗或見聞，寫下對此的感受、想法」。題目還寫了「不必訂題」，所以不用自己寫題目。
    source: cap-115w
  items_title: 國中課綱怎麼說
  items:
  - title: 從審題開始寫
    text: 國語文 6-Ⅳ-2：依據審題、立意、取材、組織、遣詞造句、修改潤飾，寫出結構完整、主旨明確、文辭優美的文章。
    code: 6-IV-2
  sources:
  - cap-wcontent
  - cap-writing
  - kuoyu
  - cap-115w
how:
  heading: 把題目拆成問題清單
  body:
  - 把題幹裡的每個問號、每個「請……」都抄成一個問題，再看「※」的注意事項。寫完文章，逐項打勾，確認每個問題都在文章裡找得到（本站建議）。
  items:
  - title: 圈問號
    text: 每個問號都是一件要回答的事。
    example: 賦予什麼事物新面貌？又會怎麼做？
  - title: 圈「請……」
    text: 題目要你做的事。
    example: 請結合你的經驗或見聞，寫下對此的感受、想法。
  - title: 看※注意事項
    text: 例如不必訂題、不可洩漏私人身分、不可使用詩歌體。
  checklist_title: 寫之前：
  checklist:
  - 圈出問號
  - 圈出請什麼
  - 看注意事項
  - 列成清單
  activity_figure: how-flow
  sources:
  - cap-115w
