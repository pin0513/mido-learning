# - 引用錯誤：guiding question 引 115 年會考題目漏了「事物」兩字（原題「你想賦予什麼事物新面貌？又會怎麼做？」），改成逐字。
# - 補上心測中心對引導寫作的說明：「引導訊息的作用有二：一為解釋題意，幫助審題、取材，避免誤解；一為提供情境、資訊，指示寫作任務。」
