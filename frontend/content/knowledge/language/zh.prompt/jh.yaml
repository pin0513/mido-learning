goal: 把引導寫作的題目拆成要回答的問題清單，寫完逐項打勾。
review: 拿一題會考寫作歷屆題目，孩子在 5 分鐘內（示意）列出題目要回答的問題；家長對照題幹，沒有漏掉任何一問。
