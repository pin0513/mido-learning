idea: 會考寫作採「引導寫作」：心測中心說，引導訊息一方面「解釋題意，幫助審題、取材，避免誤解」，一方面「提供情境、資訊，指示寫作任務」。先把題目拆成幾個要回答的問題，每一個都要在文章裡找得到（本站建議）。
