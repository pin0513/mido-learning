why:
  heading: 接得起來，才讀得下去
  body:
  - 會考寫作考試內容列出的重要能力包括「能適當地組織材料、安排段落，並組織成篇。」評分規準的「結構組織」：六級分「文章結構完整，脈絡分明，內容前後連貫」，五級分「文章結構完整，但偶有轉折不流暢之處」，四級分「文章結構大致完整，但偶有不連貫、轉折不清之處」。
  - 國語文課綱的國中學習內容也有「篇章的主旨、結構、寓意與分析」。
  qa:
    question: 從「事情經過」跳到「我學到什麼」，中間少了什麼？
    answer: 少了轉折：說明這件事是怎麼讓你想到後面的道理，例如「那天回家的路上，我一直想著……」。規準把「轉折不流暢」「轉折不清」寫在五級分、四級分的描述裡，接好了，才會「內容前後連貫」（例句是本站整理）。
    source: cap-rubric
  items_title: 國中課綱怎麼說
  items:
  - title: 組織成結構完整的文章
    text: 國語文 6-Ⅳ-2：依據審題、立意、取材、組織、遣詞造句、修改潤飾，寫出結構完整、主旨明確、文辭優美的文章。
    code: 6-IV-2
  - title: 篇章的主旨與結構
    text: 國語文 Ad-Ⅳ-1：篇章的主旨、結構、寓意與分析。
    code: Ad-IV-1
  sources:
  - cap-wcontent
  - cap-rubric
  - kuoyu
how:
  heading: 每段一句話排大綱
  body:
  - 寫完後，把每段濃縮成一句話排成大綱，從頭讀一遍：哪兩句之間跳太快，就在那兩段之間補一句轉折（本站建議）。
  items:
  - title: 每段一個任務
    text: 例如：開頭點題、經過、轉折、體悟（本站建議）。
  - title: 濃縮成一句
    text: 每段只留一句話，排成大綱。
  - title: 補轉折句
    text: 說明前一段怎麼帶到下一段。
  checklist_title: 檢查結構：
  checklist:
  - 每段一句
  - 排成大綱
  - 找跳太快處
  - 補轉折句
