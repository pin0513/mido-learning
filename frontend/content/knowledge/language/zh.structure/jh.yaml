idea: 六級分是「結構完整，脈絡分明，內容前後連貫」。每段有一個任務，段與段之間用轉折句接起來。
guiding_questions:
- 從「事情經過」跳到「我學到什麼」，中間少了什麼？
scenario: 親子共學：把一篇文章每段濃縮成一句話，排成大綱，看看哪兩段之間接不起來。
goal: 每段一個任務，段與段之間用轉折句接起來。
review: 孩子把一篇自己的作文每段濃縮成一句做成大綱，家長讀大綱能順著讀下去，沒有兩段接不起來。
