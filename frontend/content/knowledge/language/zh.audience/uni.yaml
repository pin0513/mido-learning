why:
  heading: 寫給誰，決定怎麼寫
  body:
  - UNC 寫作中心提醒，你永遠是在寫給某個讀者；寫作時把讀者放在心上，能幫你決定要放哪些材料、怎麼組織想法，以及怎麼支持你的論點。
  - 它舉例：同一件事寫信告訴奶奶和告訴好友，兩封信的內容、結構，甚至語氣都會很不一樣。
  qa:
    question: 同一個活動，寫給主管、家長和同學，哪裡要改？
    answer: 先問三件事：他們需要知道什麼、想知道什麼、在乎什麼，再調整用詞、長度、格式和語氣。時間、地點、數字這些事實，三個版本都要一樣。
    source: unc-audience
  items_title: 寫之前問三件事（UNC）
  items:
  - title: 需要什麼
    text: 讀者一定要知道的資訊。
  - title: 想要什麼
    text: 讀者有興趣、會想多看的部分。
  - title: 重視什麼
    text: 讀者在乎的價值與語氣。
  sources:
  - unc-audience
how:
  heading: 三個版本，事實一致
  body:
  - 本站建議先列一張事實表：時間、地點、人物、數字，三個版本都從這張表取材。再依讀者調整：UNC 寫作中心說，用詞與語氣要符合讀者的期待；修改草稿時也問自己，語氣與正式程度適合你的讀者嗎。
  - 用 AI 產生改寫草稿時，UNC 寫作中心談到用 AI 草擬信件、活動宣傳這類事務性文字，建議每個結果都要依讀者與目的修改；它談 AI 翻譯時也提到，AI 不太會拿捏慣用語、情境與正式程度。本站建議逐項對照事實表，也不要把個人資料貼進對話框。作業或正式文件用了 AI，依課程或單位規定說明用了哪個工具、做了什麼（本站建議）。
  items_title: 三種文類（本站整理）
  items:
  - title: 正式邀請信
    text: 稱謂、目的、時間地點、敬請回覆。
  - title: 新聞稿
    text: 標題與第一段交代誰、何時、何地、做什麼。
  - title: 社群貼文
    text: 短句、重點在前、附報名或連結。
  checklist_title: 三版寫完後對照：
  checklist:
  - 時間一致
  - 地點一致
  - 數字一致
  - 說得出寫給誰
