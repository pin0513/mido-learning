idea: 對象決定用詞、長度和格式。正式信件、新聞稿、社群貼文各有慣例，事實要一致，語氣可以不同。
guiding_questions:
- 同一個活動，寫給主管、家長和同學，哪裡要改？
scenario: 親子共學：同一則活動消息，寫成一封正式邀請信、一則新聞稿和一則社群貼文，比較三者的差別。
goal: 同一件事改寫給三種讀者，事實一致、語氣與格式各自得體。
review: 寫一封正式信、一則新聞稿、一則貼文報同一件事，家人比對三版的時間、地點、數字完全一致，且說得出每版是寫給誰。
