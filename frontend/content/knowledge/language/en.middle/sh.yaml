how:
  heading: 小說追情節，說明文找證據
  body:
  - 本站建議：小說每讀完一章，記下背景、人物、事件；讀完整本，補上結局，再用英文寫心得，說出主旨與感想。說明文先找出作者的主張句，再畫出支持它的證據，問自己：這個證據真的支持主張嗎？
  - 共同核心標準 RI.8.8 要學生「recognize when irrelevant evidence is introduced」，也就是看出哪些證據和主張無關。
  - 用 AI 練習時，照教育部注意事項（學生版）做：先確認符合平臺的註冊年齡限制，優先用為教育目的設計的工具（例如酷英網的 CoolE Bot），在家使用請家長陪伴；不輸入自己或他人的個人資料；AI 的回答要查證，不直接採信；作業「應依規定註明所使用的工具及用途，不得將生成內容直接當作自己原創作品繳交」，也不能用 AI 抄襲、代寫或作弊。
  items_title: 本站建議的讀法
  items:
  - title: 每章記要素
    text: 背景、人物、事件；讀完補上結局。
  - title: 寫心得
    text: 讀完整本，用英文說出主旨與感想。
  - title: 找主張句
    text: 說明文作者要說服你什麼。
  - title: 檢查證據
    text: 證據真的支持主張嗎？
  checklist_title: 讀完勾一下
  checklist:
  - 記下故事要素
  - 找到主張句
  - 檢查過證據
