verify_notes:
- 待核對：課綱對應只到領域、核心素養與議題，上線前請以教育部課綱與國語文、英語文、第二外國語文課綱核對。
- 英文以全民英檢、美國小學／中學讀本、多益、托福為主要基準，108 課綱英語文為次要對照；學段與檢定的對應是本站的學習建議，不是官方換算。
- 基準標籤：美國 6–8 年級讀本。
- 引用的框架只寫名稱（Common Core ELA（6–12 年級各科讀寫素養）），教材內容是改寫的入門說明，上線前請核對原始出處的用語。
- 本點為這次補強新增，內容尚未經老師審閱。
- 「美國 6–8 年級讀本」是程度描述，請用出版社標示的年級或閱讀級數選書；本站不指定書目。
