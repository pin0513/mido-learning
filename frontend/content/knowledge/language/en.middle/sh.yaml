idea: 美國的共同核心州立標準（Common Core ELA）從六年級開始，要求在歷史、科學等科目也讀資訊文本，重視細讀與「用證據支持主張」。台灣高中生讀美國中學程度的書，正好銜接全民英檢中級的閱讀：故事、信件、說明書與短文。
guiding_questions:
- 美國國中生讀的小說，跟你的課本差在哪裡？
scenario: 親子共學：親子挑一本改編成電影的青少年小說，讀完再一起看電影，比較哪裡改了、為什麼。
goal: 讀美國中學（6–8 年級）程度的青少年小說與說明文，找出主張與證據。
review: 孩子讀完一本 6–8 年級程度的青少年小說，寫 120 字英文心得；再讀一篇同程度的說明文，畫出主張句和 2 個證據，家長確認證據真的支持主張。
