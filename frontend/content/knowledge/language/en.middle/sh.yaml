what:
  heading: 讀懂小說與說明文
  body:
  - 學完後，孩子能讀完一本美國國中程度的青少年小說並說出主旨，也能在說明文裡找出主張與支持它的證據，看出無關的證據。
  items_title: 學完能做到
  items:
  - title: 讀完整本
    text: 說出背景、人物、事件和結局。
  - title: 寫出心得
    text: 用英文說出主旨與感想。
  - title: 檢查證據
    text: 判斷證據是否支持主張。
  checklist_title: 家長檢核
  checklist:
  - 心得有主旨
  - 證據支持主張
  figures:
  - middle-compare
  notes:
  - 把高中對應全民英檢中級是本站建議，不是官方換算。
  - 檢核的 120 字、2 個證據是示意；這裡不指定書目，請用出版社標示的年級或閱讀級數選書。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網的 CoolE Bot），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
