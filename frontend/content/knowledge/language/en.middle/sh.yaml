why:
  heading: 小說和說明文都要讀
  body:
  - 共同核心標準要八年級學生「Cite the textual evidence that most strongly supports an analysis of what the text says explicitly as well as inferences drawn from the text.」（RL.8.1），讀資訊文本時要判斷推理和證據是否站得住（RI.8.8）。
  - 英語文領綱第五學習階段要學生「能閱讀不同體裁、不同主題的文章。」（3-Ⅴ-11）、「能辨識故事的要素，如背景、人物、事件和結局。」（3-Ⅴ-10），並「能讀懂故事及短文，並以簡短的句子述說或寫出主旨或大意。」（5-Ⅴ-10）
  qa:
    question: 美國國中生讀的小說，跟你的課本差在哪裡？
    answer: 課本是一課一課的短文；整本小說要自己追人物和情節，說明文要自己找主張和證據（本站整理）。共同核心標準也說，六到十二年級的資訊文本閱讀有很大一部分要在其他科目完成。
    source: ccss-ela
  items_title: 高中英語文課綱的相關條目
  items:
  - title: 不同體裁
    text: 英語文 3-Ⅴ-11：能閱讀不同體裁、不同主題的文章。
    code: 3-V-11
  - title: 故事要素
    text: 英語文 3-Ⅴ-10：能辨識故事的要素，如背景、人物、事件和結局。
    code: 3-V-10
  - title: 故事四要素
    text: 英語文 Ae-Ⅴ-11：故事的背景、人物、事件和結局。
    code: Ae-V-11
  - title: 主旨大意
    text: 英語文 B-Ⅴ-12：故事及短文的主旨或大意。
    code: B-V-12
