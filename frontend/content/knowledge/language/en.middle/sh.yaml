idea: 美國的共同核心標準（Common Core ELA）把文學和資訊文本分開列，並說明六到十二年級有大量資訊文本要在歷史、科學等其他科目裡讀。八年級要能引用最有力的文本證據，並判斷一篇文章的主張「whether the reasoning is sound and the evidence is relevant and sufficient」。高中生讀美國國中（6–8 年級）程度的小說與說明文，可以銜接全民英檢中級的閱讀（本站建議）。
guiding_questions:
- 美國國中生讀的小說，跟你的課本差在哪裡？
scenario: 親子共學：親子挑一本改編成電影的青少年小說（選適合年齡分級的電影），讀完再一起看電影，比較哪裡改了、為什麼。
goal: 讀美國國中（6–8 年級）程度的青少年小說與說明文：記下故事要素，找出主張與證據。
review: 孩子讀完一本 6–8 年級程度的青少年小說，寫一篇約 120 字的英文心得；再讀一篇同程度的說明文，畫出主張句和 2 個證據，家長確認證據真的支持主張（120 字、2 個證據是示意）。
