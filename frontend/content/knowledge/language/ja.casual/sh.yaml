idea: 日文的句尾會依照對象改變：對長輩和陌生人用です・ます（敬體），對朋友用常體。選錯會顯得太冷淡或太沒禮貌。
guiding_questions:
- 跟朋友和跟老師說話，日文為什麼要換說法？
scenario: 親子共學：把同一句「明天要去嗎？」寫成對朋友和對老師兩種版本，再角色扮演一次。
goal: 分清常體和敬體，知道對朋友和對老師說法不同。
review: 家長給 5 句敬體，孩子改成對朋友說的常體，再說出各適合對誰說；5 句都對。
