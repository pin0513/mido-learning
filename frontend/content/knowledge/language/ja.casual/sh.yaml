why:
  heading: 句尾透露你和對方的關係
  body:
  - 〈敬語の指針〉說「例えば，公的な場での改まった気持ちと，私的な場でのくつろいだ気持ちとを人は区別する。」也說現代的敬語是依尊重對方、顧及立場，以及想表示「親しいか親しくないか」等意識來用。
  - 第二外國語文領綱的四級學習表現有「能依情境使用日常語句。」（2-Ⅴ-24），學習內容有「禮儀規範。」（Bo-Ⅴ-28）。
  items_title: 第二外國語文領綱的學習重點
  items:
  - title: 依情境說話
    text: 第二外國語文 2-Ⅴ-24：能依情境使用日常語句。
    code: 2-V-24
  - title: 禮儀規範
    text: 第二外國語文 Bo-Ⅴ-28：禮儀規範。
    code: Bo-V-28
  checklist_title: 開始前先確認
  checklist:
  - 會說です句
  - 會說ます句
  notes:
  - 第二外國語文的Ⅴ代表語文程度三級、四級，不是年級；高中由學校在加深加廣選修、多元選修或校訂課程開設，不是每校都有。本點對到三級、四級是本站建議。
  sources:
  - keigo
  - sfl
how:
  heading: 先看對象，再改句尾
  body:
  - 《いろどり》入門（A1）第5課把同一種問法分成「V-ますか？（マス形）」例「お茶、飲みますか？」，和「V-る？（辞書形）」例「何、飲む？」；第10課請人幫忙，有「V-てください」例「ちょっと、手伝ってください。」和「V-て」例「そこのドライバー、取って。」
  - 名詞句的です對應だ：〈敬語の指針〉說「『次は来月十日です。』は『次は来月十日だ。』と…それぞれ同じ内容であるが」，加上です是對聽話的人添上禮貌。本站整理：先看對象，再改句尾——ます改辞書形（只限現在肯定，否定、過去另有變化，本頁不教）；名詞句、な形容詞句的現在肯定です改だ（否定、過去本頁不教），い形容詞句只去掉です，疑問句的ですか整個去掉，ますか照樣把ます改辞書形，再去掉か（飲みますか？→飲む？）；てください改て。初級2（A2）第5課的普通形例句「うどんがおいしいって聞きました。」「バスが安くて便利だって先輩が言ってました。」裡，おいしい後面沒有だ，便利後面有だ。
  qa:
    question: 跟朋友和跟老師說話，日文為什麼要換說法？
    answer: 因為日文用句尾表示對人的態度。〈敬語の指針〉說，「です」「ます」加在句尾，是「話や文章の相手に対して丁寧さを添えて述べる」；對朋友不必那麼正式，就用常體（本站整理）。
    source: keigo
  items_title: 三種改法
  items:
  - title: ます句
    text: マス形改辞書形（只限現在肯定；疑問句不加か）
    example: 何、飲む？
  - title: です句
    text: 名詞、な形容詞的現在肯定です改だ；い形容詞只去掉です
    example: 次は来月十日だ。
  - title: てください句
    text: V-てください改V-て
    example: そこのドライバー、取って。
  - title: 先看對象
    text: 對老師、不熟的人用敬體，對朋友、家人用常體（本站整理）。
  checklist_title: 每次練完勾一下
  checklist:
  - 先想對象是誰
  - 現在肯定ます改辞書形
  - 現在肯定です句改常體
  - てください改て
  activity_figure: casual-flow
  sources:
