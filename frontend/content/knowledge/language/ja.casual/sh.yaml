idea: 日文句尾有兩種：加「です」「ます」的敬體，和不加的常體。文化庁〈敬語の指針〉說，「です」「ます」加在句尾，是對聽話或讀文章的人添上禮貌；人也會區分公開場合的正式心情和私下的放鬆心情。對老師、不熟的人用敬體，對朋友、家人用常體，是本站整理的入門原則。
guiding_questions:
- 跟朋友和跟老師說話，日文為什麼要換說法？
scenario: 親子共學：用《いろどり》的例句「お茶、飲みますか？」和「何、飲む？」當範本，家長輪流演老師和朋友，孩子先判斷對象，再決定用敬體還是常體問一句（本站建議）。
goal: 分清常體和敬體，把本頁三種敬體句（ます句、です句、てください句）改成常體，並說出各適合對誰說。
review: 家長用本頁三種句型給 5 句敬體（ます句、です句都只用現在肯定），孩子改成對朋友說的常體，再說出原句適合對誰說；5 句都對（句數是示意）。
