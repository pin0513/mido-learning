scenario: 親子共學：把自主學習成果做成 5 張投影片（5 張為示意），先寫每張的一句話標題，再補內容。
goal: 寫說明文和投影片文字：先寫結論，一張一個重點，用例子取代術語。
review: 孩子做 5 張投影片，先只交 5 句標題（5 張、5 句為示意）；家長只看標題就能說出整份的結論。
