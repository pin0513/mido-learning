idea: 說明文和投影片的文字，是讓不懂的人看懂：先寫結論，再分點說明，每張投影片的標題就是一句完整的重點，用例子取代術語。怎麼上台講，交給「溝通與解決問題」的簡報。
guiding_questions:
- 如果聽眾只記得一句話，你希望是哪一句？
scenario: 親子共學：把自主學習成果做成 5 張投影片，先寫每張的一句話標題，再補內容。
goal: 寫說明文和投影片文字：先寫結論，一張一個重點，用例子取代術語。
review: 孩子做 5 張投影片，先只交 5 句標題；家長只看標題就能說出整份的結論。
