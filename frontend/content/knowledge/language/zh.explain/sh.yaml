why:
  heading: 讓不懂的人看懂
  body:
  - 國語文課綱的高中學習內容包括「具邏輯、客觀、理性、知識的說明」，學習應用方面的格式也列了「簡報、讀書報告、演講稿」等。
  - 說明文的寫作手法，課綱列出「描述、列舉、因果、問題解決、比較、定義、引用、問答等」。舉例、定義和比較，都是讓讀者看懂的工具。
  - 學測國綜的「文本」也包括「說明文本」；大考中心說，國綜測驗的文本「除語言文字組成的篇章外，也包含圖表、圖形、圖解、表單等等」。
  qa:
    question: 如果聽眾只記得一句話，你希望是哪一句？
    answer: 那一句就是你的結論，把它放在最前面，也寫成投影片的標題（本站建議）。課綱把簡報列在高中學習應用的格式裡，簡報文字和說明文一樣，要讓沒聽過的人看懂。
    source: kuoyu
  items_title: 高中課綱的說明文目標
  items:
  - title: 邏輯客觀的說明
    text: 國語文 Bc-Ⅴ-1：具邏輯、客觀、理性、知識的說明，如人權公約、百科全書、制度演變等。
    code: Bc-V-1
  - title: 說明的寫作手法
    text: 國語文 Bc-Ⅴ-2：描述、列舉、因果、問題解決、比較、定義、引用、問答等寫作手法。
    code: Bc-V-2
  - title: 簡報等學習應用
    text: 國語文 Be-Ⅴ-3：在學習應用方面，以簡報、讀書報告、演講稿、會議紀錄、劇本、小論文、計劃書、申請書等格式與寫作方法為主。
    code: Be-V-3
  - title: 說明知識
    text: 國語文 6-Ⅴ-4：掌握各種文學表現手法，適切地敘寫，關懷當代議題，抒發個人情感，說明知識或議論事理。
    code: 6-V-4
  sources:
  - kuoyu
  - ceec
how:
  heading: 結論先行，一張一個重點
  body:
  - 先寫一句結論，再列出支持它的三到五個重點，每個重點做一張投影片（本站建議）。數據和圖表是輔助說明，課綱也列了「數據、圖表、圖片、工具列等輔助說明」。
  items_title: 寫投影片文字（本站建議）
  items:
  - title: 先寫結論
    text: 第一張就告訴聽眾結論。
  - title: 標題是完整句
    text: 標題寫成一句有主詞、有結論的話。
  - title: 一張一個重點
    text: 放不下就拆成兩張。
  - title: 用例子取代術語
    text: 術語先下定義，再舉一個例子。
  checklist_title: 交投影片前：
  checklist:
  - 第一張是結論
  - 標題是完整句
  - 一張一個重點
  - 術語有例子
