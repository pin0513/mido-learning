idea: 說明文和投影片的文字，是讓不懂的人看懂。本站建議：先寫結論，再分點說明，每張投影片的標題就是一句完整的重點，用例子取代術語。怎麼上台講，交給「溝通與解決問題」的簡報。
guiding_questions:
