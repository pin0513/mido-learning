# B3 提案：zh.sentence@es
# - idea「標點符號幫讀的人換氣」改依手冊：逗號標示「語氣的停頓」、句號用在「語義完整的句末」。
# - 「誰、做了什麼、怎麼樣」是本站整理的檢查法，課綱沒有列出，正文標為本站整理；goal、scenario、review 原寫「誰、在哪裡、做了什麼」，與 idea 不一致，統一成同一組。
# - 補上 grades [1,2]、2-I-1、6-I-3、Ac-I-2。2-I-1 與 B2 相同（taxonomy 重複列出）。
