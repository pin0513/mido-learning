idea: 一句話要說清楚誰、做了什麼、怎麼樣；一段話只講一件事。標點符號幫讀的人換氣。
guiding_questions:
- 「我很開心」和「我撿到一片紅葉子，好開心」，哪句看得到畫面？
scenario: 親子共學：親子各說一件今天的小事，先說一句「很普通」的版本，再一起補上誰、在哪裡、做了什麼。
goal: 寫出有誰、在哪裡、做了什麼的完整句子，一段只講一件事。
review: 孩子寫 5 句今天的小事，家長逐句檢查「誰、在哪裡、做了什麼」三項都有，5 句全過才打勾。
