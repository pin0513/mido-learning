why:
  heading: 讓讀的人看到畫面
  body:
  - 只寫「我很開心」，讀的人不知道發生了什麼。補上誰、做了什麼，讀的人才看得到畫面，也知道為什麼開心。
  - 課綱要一、二年級的孩子說話時「以正確發音流利的說出語意完整的話」，寫作時「寫出語意完整的句子、主題明確的段落」。
  figures:
  - why-compare
  qa:
    question: 「我很開心」和「我撿到一片紅葉子，好開心」，哪句看得到畫面？
    answer: 第二句。它說出了發生什麼事（撿到一片紅葉子），讀的人才看得到畫面，也知道開心的原因。課綱要孩子寫出「語意完整的句子」，把事情說清楚就是第一步。
    source: kuoyu
  items_title: 一、二年級的目標
  items:
  - title: 說完整的話
    text: 以正確發音流利的說出語意完整的話。
    code: 2-I-1
  - title: 寫完整的句子
    text: 寫出語意完整的句子、主題明確的段落。
    code: 6-I-3
  - title: 學簡單句型
    text: 學習內容：簡單的基本句型。
    code: Ac-I-2
  sources:
  - kuoyu
how:
  heading: 先說，再補，再寫
  body:
  - 先用嘴巴說一件今天的小事，再一起補上缺的部分，最後寫下來。課綱說一、二年級的寫作「由口述作文開始引導」，先說再寫正是這個順序。
  items:
  - title: 誰
    example: 我、弟弟、班上的小美
    text: 這件事是誰做的（本站整理）。
  - title: 做了什麼
    example: 撿到一片紅葉子
    text: 發生了什麼事。
  - title: 怎麼樣
    example: 好開心
    text: 結果或感受。
  checklist_title: 寫完一段，檢查：
  checklist:
  - 有誰
  - 做了什麼
  - 怎麼樣
  - 一段一件事
  - 句末有標點
  activity_figure: how-flow
  sources:
  - kuoyu
what:
  heading: 句子和標點
  notes:
  - 逗號用來隔開句子裡的小句子，或標出語氣的停頓；一句話的意思完整了，就用句號（標點符號手冊 p.2、3）。
  - 一段只講一件事：課綱的說法是「主題明確的段落」。
  sources:
  - punct
  - kuoyu
