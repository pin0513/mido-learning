# B6 提案：zh.disclose@uni
# - 補依據：教育部《未來人才AI能力圖像》（115 年）把「正確描述與標註AI協作情形」列為能力，大專校院階段的能力描述包括「清楚揭露其使用方式與範圍」（能力架構，不是規定）；學術倫理資源中心指南與電子報（目前沒有統一規定，先查規定、適度公開）。
# - 補揭露要寫的三件事（工具、用途、誰負責）與揭露句範本（本站整理，示意）；補「AI 不能當作者」「揭露不等於免責」。
# - 找不到以大專校院生成式 AI 使用指引為名的教育部文件，已在 notes 說明以學校規定為準。
# - 「2–3 句」標示示意；補 Why/How/What 與兩張圖。
