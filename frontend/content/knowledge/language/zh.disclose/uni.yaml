why:
  heading: 用了 AI，要說清楚
  body:
  - 教育部的「未來人才AI能力圖像」把「負責任使用AI的能力」列為四項能力之一，內容包括「正確描述與標註AI協作情形」；大專校院階段的能力描述也包括「清楚揭露其使用方式與範圍」。能力圖像是能力架構，不是規定，實際規定以學校與課程為準。
  - 沒有揭露，可能被當成不當行為。ICMJE 建議期刊要求作者投稿時揭露是否用了 AI、怎麼用，並指出未揭露在某些情況下可能被視為不當行為；APA Style 也提醒，把 AI 產出當成自己寫的交出去，對學生來說可能構成學術不端。
  qa:
    question: 有人問「這是你寫的嗎？」，你怎麼回答才誠實？
    answer: 照實說：哪些是你想的、你寫的，哪些地方用了 AI、用哪個工具、做了什麼，並說明你檢查過、願意負責。教育部臺灣學術倫理教育資源中心的指南建議，在研究方法中聲明使用哪些 AI 工具以及如何使用。
    source: ethics-guide
  items_title: 揭露要寫的三件事（本站整理）
  items:
  - title: 用了哪個工具
    text: 寫出工具與模型名稱，必要時寫版本或日期。
  - title: 做了什麼
    text: 例如檢查文法、整理文獻清單、提出反方。
  - title: 誰負責
    text: 說明你檢查過內容，並為整份作品負責。
  sources:
  - moe-ai-news
  - moe-ai-portrait
  - icmje-ai
  - apa-genai
how:
  heading: 先查規定，再寫說明
  body:
  - 學術倫理電子報在 2023 年指出「目前學術界對於使用生成式AI是否需要標註，尚無統一的規定」，建議先瞭解補助機關或期刊的政策，「並於著作或報告中適度公開相關訊息」。APA Style 也說，允許哪些 AI 使用、要怎麼揭露，取決於授課老師、系所與出版者的政策。
  - 寫說明時，APA Style 的例句是寫明用了哪個工具編修論文、請它回饋清晰度與流暢度；它也建議把用過的提示詞留給自己做紀錄。說明裡不要放個人資料或未公開的內容（本站建議）。
  items_title: 揭露句範本（本站整理，示意）
  items:
  - title: 只用於潤飾
    text: 本文內容由我撰寫；我用〔工具名稱〕檢查文法與語句，每一處修改都經我逐句確認。
  - title: 用於整理資料
    text: 我用〔工具名稱〕初步整理文獻清單，每一筆都已打開原始來源核對；分析與結論由我完成。
  checklist_title: 送出前問自己：
  checklist:
  - 查過規定了嗎
  - 寫了工具名稱
  - 寫了用途
  - 寫了誰負責
  - 留了紀錄嗎
  activity_figure: how-flow
  sources:
  - ethics-epaper13
  - apa-genai
what:
  heading: 揭露不等於免責
  figures:
  - what-compare
  notes:
  - AI 不能當作者：ICMJE 指出聊天機器人無法為作品的正確性、完整性與原創性負責，所以不能列為作者；APA Style 也說 AI 本身不能是作者。
  - 教育部臺灣學術倫理教育資源中心的指南提醒「研究者應對自己的研究行為與產出負全部責任」，並說「直接使用AI翻譯整篇論文或直接複製貼上生成資料，都不符合學術誠信的基本原則」。
  - 目前查無以大專校院生成式 AI 使用指引為名的教育部文件；各大學另有規定，以你的學校、課程或投稿單位的規定為準。
  - 三件事與揭露句範本是本站整理；「2–3 句」是示意。
  sources:
  - ethics-guide
  - icmje-ai
  - apa-genai
