idea: 各學校、期刊、公司對 AI 使用的規定不同。先查規定，再清楚說明 AI 幫了哪些忙、哪些是你自己的。
guiding_questions:
- 有人問「這是你寫的嗎？」，你怎麼回答才誠實？
scenario: 親子共學：找你學校或常投稿平台的 AI 使用規定，替自己一篇作品寫一段兩三句的使用說明。
goal: 依學校或平台規定，寫出一段誠實的 AI 使用說明。
review: 找到自己學校或投稿平台的 AI 使用規定原文，替一件作品寫 2–3 句說明；家人對照規定確認沒有遺漏。
