why:
  heading: 讀懂作者想做什麼
  body:
  - 會考國文第五項考試內容是「句段篇章的理解與賞析：理解各類文本的句子、段落與主要概念，指出寫作的目的與觀點，理解各類文本內容、形式和寫作特色。」這和國語文課綱 5-Ⅳ-2、5-Ⅳ-3 的文字一樣。
  - 知道作者想說服你，你才會停下來檢查他的理由夠不夠。
  qa:
    question: 作者寫這篇文章，是想告訴你、說服你，還是讓你感動？
    answer: 先看文章類型和用詞。說明文本「以邏輯、客觀、理性的方式，說明事理或事物」，目的是讓你知道；議論文本「以論點、論據、論證方式，表達對人、事、物看法」，目的是說服你；抒情文本抒發「對人、事、物、景之情感」，想讓你感動。一篇文章也可能同時有好幾個目的（本站整理）。
    source: kuoyu
  items_title: 國中課綱怎麼說
  items:
  - title: 指出目的與觀點
    text: 國語文 5-Ⅳ-2：理解各類文本的句子、段落與主要概念，指出寫作的目的與觀點。
    code: 5-IV-2
  - title: 事實、理論當論據
    text: 國語文 Bd-Ⅳ-1：以事實、理論為論據，達到說服、建構、批判等目的。
    code: Bd-IV-1
  - title: 主旨、結構、寓意
    text: 國語文 Ad-Ⅳ-1：篇章的主旨、結構、寓意與分析。
    code: Ad-IV-1
  sources:
  - cap-guowen
  - kuoyu
how:
  heading: 三個問題讀觀點
  body:
  - 讀完一段，問自己（本站整理）：一、作者想讓我知道或相信什麼？把這句畫線，就是觀點句。二、他用了哪些事實或理論支持？三、哪些句子可以查證，哪些只是作者的看法？
  items:
  - title: 找觀點句
    text: 作者最想讓你相信的那一句，常在開頭或結尾（本站整理）。
  - title: 找論據
    text: 議論文本「以事實、理論為論據」。
  - title: 分事實與意見
    text: 能查證的是事實，帶有評價的是意見（本站整理）。
  checklist_title: 讀一篇評論：
  checklist:
  - 畫觀點句
  - 圈論據
  - 標事實與意見
  - 說同不同意
