idea: 會考國文考「句段篇章的理解與賞析」，常問目的、觀點、寫作特色。讀的時候問三件事：作者想讓我知道或相信什麼？他用什麼支持？哪些是事實、哪些是他的看法？
guiding_questions:
- 作者寫這篇文章，是想告訴你、說服你，還是讓你感動？
scenario: 親子共學：親子各讀同一則社論，各自寫一句「作者想要我……」，對照後討論差在哪裡。
goal: 說出作者的觀點與寫作目的，並分清事實與意見。
review: 孩子讀一篇 600 字評論，畫出作者觀點句、標出 2 個事實與 2 個意見；家長核對後至少 3 處正確。
