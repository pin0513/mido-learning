idea: 校稿分兩層：內容（主旨、結構）先講，文字（錯字、標點、病句）後講。先說一個具體優點，再給最多三個最重要的修改。
guiding_questions:
- 幫朋友改稿，先說錯字，還是先說哪裡寫得好？
scenario: 親子共學：親子互換作品校稿：大人改孩子的作文、孩子改大人的訊息或報告，各給一個優點、三個建議。
goal: 替別人校稿：先內容後文字，給一個優點和最多三個修改。
review: 親子互改一篇作品，校稿單上有 1 個具體優點、最多 3 個最重要的修改；被改的人說出至少 2 個建議「聽得進去」。
