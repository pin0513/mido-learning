why:
  heading: 先改大處，再改小處
  body:
  - UNC 寫作中心把修改分成兩個階段：編輯看內容、整體結構、段落、清晰度、風格與引註；校對是最後一步，專看錯字、文法與標點，而且應該在其他修改都完成後才做。
  - Purdue OWL 指出，評語太多、方向太分散時，寫作者會被淹沒，常常只改容易改的文法，錯過內容與組織這些高層次問題；所以建議評語只集中在三四個主要修改。
  qa:
    question: 幫朋友改稿，先說錯字，還是先說哪裡寫得好？
    answer: 先說哪裡寫得好，而且要具體說出好在哪、為什麼；Purdue OWL 提醒，籠統的稱讚後面接一大堆批評，對方得不到幫助。錯字留到最後，等內容和結構談完再標。
    source: purdue-feedback
  items_title: 兩層修改
  items:
  - title: 內容層
    text: 主旨清楚嗎、結構合理嗎、證據撐得住嗎。
  - title: 文字層
    text: 錯字、標點、文法與病句，最後才看。
  sources:
  - unc-editing
  - purdue-feedback
how:
  heading: 一個優點，最多三個修改
  body:
  - Kennesaw State University 寫作中心建議：先問作者想要哪種回饋；態度要和善；用「我」開頭說出讀者的感受，例如說我在這段有點迷惑，而不是說你寫得不清楚；也不要把對方的文字改成你的風格。
  - 本站建議：校稿單只寫一個具體優點和最多三個最重要的修改，每個修改都指出位置、說明原因，依重要性排序。
  items_title: 校稿單（本站建議）
  items:
  - title: 具體優點
    text: 指出位置，說明好在哪裡。
    example: 第二段用數據回應反方，讓我更相信你的主張。
  - title: 最多三個修改
    text: 先內容後文字，依重要性排序。
  - title: 用我開頭
    text: 說出你讀到哪裡卡住、哪裡不懂。
  checklist_title: 交回校稿前：
  checklist:
  - 先問想要什麼
  - 優點夠具體
  - 修改不超過三
  - 沒改成我的風格
  activity_figure: how-flow
  sources:
  - ksu-feedback
what:
  heading: 校稿不等於改成你的
  figures:
  - what-compare
  notes:
  - 別人的稿子是未公開文件。學術倫理電子報提醒「不要將個人資訊、未公開文件、機密資料等內容輸入到生成式AI的對話框中」；Springer Nature 也規定，稿件、審查報告與敏感資料不得分享給不安全或公開的 AI 系統。要用工具標錯字，先取得作者同意，或請作者自己用。
  - 「一個優點、最多三個修改」是本站建議（Purdue OWL 建議三四個主要修改）；「2 個」是示意。
  sources:
  - ethics-epaper13
  - nature-ai
  - purdue-feedback
