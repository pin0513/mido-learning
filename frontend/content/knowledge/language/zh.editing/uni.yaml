sources:
- id: unc-editing
  title: Editing and Proofreading（Writing Center 寫作講義）
  publisher: The Writing Center, University of North Carolina at Chapel Hill
  url: https://writingcenter.unc.edu/tips-and-tools/editing-and-proofreading/
  accessed: '2026-10-29'
  kind: reference
  supports: 「editing and proofreading are two different stages of the revision process」；Editing 的層次：Content、Overall structure、Structure within paragraphs、Clarity、Style、Citations；「Proofreading is the final stage of the editing process, focusing on surface errors such as misspellings and mistakes in grammar and punctuation. You should proofread only after you have finished all of your other editing revisions.」
- id: purdue-feedback
  title: Instructor's Guide for Giving Feedback
  publisher: Purdue Online Writing Lab（Purdue OWL），Purdue University
  url: https://owl.purdue.edu/owl/general_writing/the_writing_process/feedback/instructor_guide_giving%20feedback.html
  accessed: '2026-10-29'
  kind: reference
  supports: Focus：「Students often become overwhelmed if there are too many comments on a paper」；「So, teachers should try to keep comments engaged with just three or four major elements to be revised.」；HOC/LOC：higher order concerns 多與想法和整體結構有關，lower order concerns 多是句子層級的文法與技術問題；Praise：「being specific about what is working well and why, rather than just saying 『great work!』」；「If a general compliment is followed with an abundance of criticism, even if it's formulated in a compliment sandwich, students won't benefit from the praise.」
- id: ksu-feedback
  title: Giving and Receiving Feedback
  publisher: Writing Center，Kennesaw State University
  url: https://campus.kennesaw.edu/current-students/academics/writing-center/open-educational-resources/giving-receiving-feedback.php
  accessed: '2026-10-29'
  kind: reference
  supports: Giving Peer Feedback：「First, listen to the writer. What kind of feedback are they asking for?」；「Be kind.」；「Comment on the higher order concerns first.」；「Use 『I』 statements to help stay focused on your reaction to the writing.」；「Don’t try to make the writer sound like you.」；「Remember that the responsibility for correcting the errors lies with the writer, not with you.」
- id: ethics-epaper13
  title: 大學校園因應生成式AI之指引及教學建議（學術倫理電子報第 13 期）
  publisher: 教育部臺灣學術倫理教育資源中心（2023 年 8 月）
  url: https://ethics.moe.edu.tw/resource/epaper/html/21/
  accessed: '2026-10-29'
  kind: reference
  supports: （三）個人資料保護與資通安全：「研究者應留意，不要將個人資訊、未公開文件、機密資料等內容輸入到生成式AI的對話框中，以避免產生個人隱私洩露的問題。」
- id: nature-ai
  title: Artificial Intelligence (AI)（Editorial policies）
  publisher: Springer Nature／Nature Portfolio
  url: https://www.nature.com/nature-portfolio/editorial-policies/ai
  accessed: '2026-10-29'
  kind: reference
  supports: 「Manuscripts, peer review reports, and sensitive data must not be shared with unsecured or public AI systems.」；審查者：「Confidential manuscript content must not be shared with unsecured or public AI tools.」
