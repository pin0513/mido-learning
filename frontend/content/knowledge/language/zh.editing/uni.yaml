# B6 提案：zh.editing@uni
# - 安全／隱私（中）：原文的 AI 可代勞「逐字標出錯字與標點」沒提醒那是別人的稿子。補：未經作者同意不貼進 AI；學術倫理電子報「不要將…未公開文件…輸入」、Springer Nature「Manuscripts…must not be shared with unsecured or public AI systems」。
# - 補依據：UNC 寫作中心（編輯先、校對最後）、Purdue OWL（聚焦三四個主要修改、具體稱讚）、Kennesaw State 寫作中心（用「我」開頭、不改成你的風格）。「最多三個」標示本站建議。
# - 「至少 2 個」標示示意；補 Why/How/What 與兩張圖。
