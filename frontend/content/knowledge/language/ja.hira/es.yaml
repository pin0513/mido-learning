idea: 日文的基本文字是平假名。五十音表橫看是同一個子音，直看是同一個母音，抓到規律就不用死背。
guiding_questions:
- あいうえお排成一張表，你能找到它的規律嗎？
scenario: 親子共學：做一張空白五十音表，每天填一行，孩子念、大人寫，一個月填滿整張。
goal: 認得並寫出 46 個平假名，念得出每個音。
review: 家長隨機指 15 個平假名，孩子念出來，再聽家長念 5 個音寫出平假名；20 題至少 18 題對。
