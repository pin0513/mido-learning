why:
  heading: 從平假名開始讀日文
  body:
  - JLPT 官網對 N5 讀解的說明是「ひらがなやカタカナ、日常生活で用いられる基本的な漢字で書かれた定型的な語句や文、文章を読んで理解することができる。」平假名、片假名和基本漢字都要會；本站建議先從平假名學起，再學片假名和漢字。
  - 國中以後，第二外國語文領綱的日語學習內容有「平假名、片假名及漢字的辨識與書寫。」（日語 Aa-Ⅳ-1）；國小沒有日語課綱，本點先打基礎（本站建議）。
  items_title: 官方對初級讀的說明
  items:
  - title: JLPT N5 讀
    text: 讀得懂用平假名、片假名和基本漢字寫的固定句子（依 JLPT 官網，中文是本站整理）。
  checklist_title: 開始前先確認
  checklist:
  - 聽過あいうえお
  - 有一張字表
  notes:
  - 國小沒有日語的課綱；三至六年級是本站建議的年級。第二外國語文領綱從國中開始（國中由學校在彈性學習課程選開）。
  sources:
  - jlpt-levels
  - sfl
how:
  heading: 一天一行，先抓規律
  body:
  - 本站整理：五十音表從あ行到わ行，清音 45 個再加上ん，共 46 個。同一行（例如か行：か、き、く、け、こ）子音相同，但あ行沒有子音；用常見的平文式（Hepburn）羅馬拼音看，し、ち、つ、ふ拼成 shi、chi、tsu、fu，不照同一行的拼法，を也常拼成 o（照實際發音，ひ、に等字的子音也和同一行其他字略有不同）；同一段（例如あ段：あ、か、さ、た、な）母音相同；や行只有や、ゆ、よ，わ行只有わ、を。
  - 本站建議：每天學一行，先念再寫，寫完對照字表檢查；學完一行就和前幾行一起複習。
  qa:
    question: あいうえお排成一張表，你能找到它的規律嗎？
    answer: 有規律：同一行的字子音大致相同，同一段的字母音相同（本站整理）。國際交流基金《まるごと》的教師手冊也說，第 2 課要「文字と音の規則性を理解する」。
    source: marugoto-notes
  items_title: 本站整理的規律
  items:
  - title: 同一行
    text: か、き、く、け、こ：子音都是 k。平文式羅馬拼音不照同一行規則的有し、ち、つ、ふ，を也常拼成 o。
  - title: 同一段
    text: あ、か、さ、た、な：母音都是 a。
  - title: 少字的行
    text: や行只有や、ゆ、よ；わ行只有わ、を。
  - title: 最後一個
    text: ん自己一格。
  checklist_title: 每天練完勾一下
  checklist:
  - 念了一行
  - 寫了一行
  - 對照字表
  - 複習前幾行
  activity_figure: hira-flow
  sources:
  - marugoto-notes
what:
  heading: 認得、念得出、寫得出
  body:
  - 學完後，孩子能認得並寫出五十音表的平假名，看到字念得出音，聽到音寫得出字。
  items_title: 學完能做到
  items:
  - title: 認字念音
    text: 看到平假名念出音。
  - title: 聽音寫字
    text: 聽到音寫出平假名。
  - title: 說出規律
    text: 說出同一行、同一段的規律。
  checklist_title: 家長檢核
  checklist:
  - 念得出來
  - 寫得出來
  - 說得出規律
  figures:
  - hira-compare
  notes:
  - 檢核的題數與門檻是示意。
  - 本站建議：本點可當作 JLPT N5 的準備；這是本站建議的對應，不是官方換算。JLPT 官網寫 N5 是「基本的な日本語をある程度理解することができる」。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - jlpt-levels
  - genai-student
