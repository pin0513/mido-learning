idea: 本站建議從平假名開始學日文的字。五十音表有規律：同一行的字子音大致相同，同一段的字母音相同（本站整理），先抓規律再記字。
guiding_questions:
- あいうえお排成一張表，你能找到它的規律嗎？
scenario: 親子共學：做一張空白五十音表，每天填一行：孩子邊念邊寫，大人對照課本或字表檢查，大約十天填滿（每天一行、十天都是示意）。
goal: 認得並寫出五十音表的 46 個平假名（46 個是本站整理的算法），念得出每個音。
review: 家長隨機指 15 個平假名，孩子念出來；再念 5 個音，孩子寫出平假名；20 題至少 18 題對（題數與門檻是示意）。
