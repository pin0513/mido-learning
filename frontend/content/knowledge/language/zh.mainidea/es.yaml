idea: 每段先找「這段主要在說誰、說什麼」，就是段落大意；把各段串起來，想想作者最想說的是什麼，就是全文主旨。主旨有時直接寫在文中，有時要自己歸納。
guiding_questions:
- 一篇文章刪到只剩一句話，你會留哪一句？
scenario: 親子共學：讀完一本繪本或一篇故事，全家各寫一句「這本書在說什麼」，比比看誰最短又沒漏重點。
goal: 用一句話說出每段在講什麼，再用一句話說出全文主旨。
review: 孩子讀一篇 4 段（示意）的短文，寫出 4 句段落大意和 1 句主旨；家長讀原文後同意主旨句沒有漏掉重點。
