why:
  heading: 從一段到一篇
  body:
  - 《重編國語辭典》說，大意是「大概、大要」，主旨是「主要的意旨」。段落大意說每段講什麼，主旨說全篇最想表達什麼。
  - 課綱在一、二年級學「篇章的大意」，三、四年級學「意義段」（把意思相關的幾個自然段合成一段來看，本站整理）和「篇章的大意、主旨與簡單結構」，並要「運用適合學習階段的摘要策略，擷取大意」。
  qa:
    question: 一篇文章刪到只剩一句話，你會留哪一句？
    answer: 留下最能說出「作者最想告訴我們什麼」的那一句。如果文中有這樣的句子，那就是寫出來的主旨；如果沒有，就要自己用一句話歸納。PIRLS 把「找出明確寫出的主旨句」算作提取，把「看出全文的整體訊息或主題」算作詮釋整合。
    source: pirls-interpret
  items_title: 課綱怎麼排
  items:
  - title: 意義段
    text: 三、四年級學習內容：意義段（把意思相關的幾個自然段合成一段來看，本站整理）。
    code: Ad-II-1
  - title: 大意、主旨與結構
    text: 三、四年級學習內容：篇章的大意、主旨與簡單結構。
    code: Ad-II-2
  - title: 摘要策略
    text: 三、四年級：「運用適合學習階段的摘要策略，擷取大意。」
    code: 5-II-6
  - title: 熟習摘要
    text: 五、六年級：「熟習適合學習階段的摘要策略，擷取大意。」
    code: 5-III-6
