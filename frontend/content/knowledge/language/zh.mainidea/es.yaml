how:
  heading: 一段一句，再串成一句
  body:
  - 先每段寫一句：這段主要在說誰、說什麼。再把幾句段落大意放在一起讀，問自己：作者最想告訴我什麼？寫成一句話，就是主旨。寫好後回去對照原文，看有沒有漏掉重要的事。（步驟是本站建議。）
  items:
  - title: 每段一句
    example: 第 1 段：小明第一次自己搭公車。
    text: 說出誰、什麼事。
  - title: 串起來
    example: 搭錯車 → 問司機 → 平安到站
    text: 把各段大意排在一起看。
  - title: 歸納主旨
    example: 第一次自己做事雖然緊張，也讓人長大。
    text: 例句是本站自編。
  checklist_title: 寫完檢查：
  checklist:
  - 每段一句
  - 有誰和什麼事
  - 主旨只寫一句
  - 回原文對照
  activity_figure: how-flow
  sources:
  - kuoyu
