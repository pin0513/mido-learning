why:
  heading: AI 幫你想，不替你想
  body:
  - UNC 寫作中心提醒，老師允許用 AI 時，通常是假設工具幫你思考與寫作，而不是替你思考或寫作；你交出去的文字永遠由你百分之百負責。
  - 教育部臺灣學術倫理教育資源中心的指南也說「研究者應對自己的研究行為與產出負全部責任」，並提醒「直接使用AI翻譯整篇論文或直接複製貼上生成資料，都不符合學術誠信的基本原則」。
  qa:
    question: 一篇文章裡，哪些決定一定要你來做？
    answer: 主旨、立場、選哪些材料、每一句最後怎麼寫，都要你決定。AI 可以提問、挑漏洞、給反方，但它的內容可能出錯，取捨與查證都在你。
    source: unc-ai
  items_title: 三段分工（本站整理）
  items:
  - title: 我想
    text: 決定主旨、立場與材料。
  - title: AI 陪練
    text: 提問、找漏洞、提出反方。
  - title: 我定稿
    text: 自己寫每一句，查證並依規定揭露。
  sources:
  - unc-ai
  - ethics-guide
how:
  heading: 留下紀錄，守住隱私
  body:
  - 先看課程大綱或問老師能不能用 AI。可以用時，只把自己的大綱或段落交給 AI 提問；學術倫理電子報提醒，不要把個人資訊、未公開文件、機密資料輸入對話框。
  - 每一步都留紀錄：指南建議「建立版本控制紀錄來證明人類創意的存在」，APA Style 也建議把用過的提示詞留給自己做紀錄。
  items_title: 可以請 AI 做的事（本站建議）
  items:
  - title: 提問
    text: 請它問你：這段想說什麼、證據在哪裡。
  - title: 找漏洞
    text: 請它指出推論跳太快的地方。
  - title: 給反方
    text: 請它列出可能的反對意見，你再自己查證。
  checklist_title: 每輪對話後：
  checklist:
  - 課程允許嗎
  - 有沒有個資
  - 哪句是 AI 的
  - 查證了嗎
  - 紀錄存了嗎
  activity_figure: how-flow
  sources:
  - ethics-epaper13
  - ethics-guide
  - apa-genai
what:
  heading: 陪練不等於代寫
  figures:
  - what-compare
  notes:
  - 教育部《未來人才AI能力圖像》是能力架構，不是規定；它把「能理解並遵循AI相關之智慧財產權、個資保護及使用規範，於學習與職場情境中正當運用AI，並清楚揭露其使用方式與範圍」列為大專校院階段的能力。實際規定以學校與課程為準。
  - Springer Nature 的 AI 政策把用 AI 壓力測試研究問題列為允許的輔助用途，但把未揭露就用大型語言模型產生核心研究推論列為不允許；交作業時依課程規定揭露。
  - 三段分工與可以請 AI 做的事是本站整理與本站建議。
  sources:
  - moe-ai-portrait
  - nature-ai
