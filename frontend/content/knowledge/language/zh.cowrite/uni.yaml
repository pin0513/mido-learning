scenario: 親子共學：先確認課程允許使用 AI，再用一篇要交的文章走一次流程，保留每一步的紀錄（不貼個人資料或未公開資料），最後標出哪些句子受過 AI 影響。
goal: 人機共寫：主旨與選材自己決定，AI 只負責提問、挑錯、給反方。
review: 交一份過程紀錄（自己的大綱、AI 提問、修改紀錄、定稿），並在定稿上標出受 AI 影響的句子、附上揭露說明；家人看紀錄就能說出哪些決定是你做的。
