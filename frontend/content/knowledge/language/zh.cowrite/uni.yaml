idea: 先自己決定主旨與材料，請 AI 提問、挑錯、給反方；草稿與定稿由你寫。最後刪掉 AI 腔，補上親身細節。
guiding_questions:
- 一篇文章裡，哪些決定一定要你來做？
scenario: 親子共學：用一篇真的要交的文章走一次流程，保留每一步的紀錄，最後標出哪些句子受過 AI 影響。
goal: 人機共寫：主旨與選材自己決定，AI 只負責提問、挑錯、給反方。
review: 交一份過程紀錄（自己的大綱、AI 提問、修改紀錄、定稿），並在定稿上標出受 AI 影響的句子；家人看紀錄就能說出哪些決定是你做的。
