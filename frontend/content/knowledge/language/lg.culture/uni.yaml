idea: 語言不只是字和文法，還包含說話的習慣：多直接、多客氣、話說到哪裡就停。學外語也是在學另一套默契，照字面翻可能翻錯意思。
guiding_questions:
- 為什麼日語只說「土曜日はちょっと」，對方就知道你在拒絕？
scenario: 親子共學：找一段英文和一段日文的道歉或拒絕，比較它們怎麼開頭、怎麼收尾，和中文的說法排在一起看。
goal: 察覺語言背後的文化默契，避免照字面翻譯造成誤會。
review: 找 3 句（示意）英文或日文裡「照字面翻會誤會」的說法，寫出字面意思、實際意思與適合的場合，並附上查到的出處；家人看得懂差別。
