  url: https://dictionary.cambridge.org/grammar/british-grammar/quite
  accessed: '2026-10-29'
  kind: reference
  supports: Quite + gradable adjectives and adverbs：「When we use quite with a gradable adjective or adverb, it usually means 『a little, moderately but not very』.」；同一個意思的例句「He had been quite good at drawing when he was at school. (OK, moderately good but not outstanding)」
