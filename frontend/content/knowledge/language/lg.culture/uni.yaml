why:
  heading: 照字面翻，可能翻錯意思
  body:
  - 東京外國語大學的日語教材把「･･･はちょっと。」列為拒絕邀請的說法，例如「土曜日ですか。土曜日はちょっと。」。辭典把「ちょっと」解釋為數量、程度或時間很少，也就是すこし；也記載它可以把不方便、不好說的事說得含糊，例如「私はお酒はちょっと…」。加藤香須美（2019）分析日語教科書時也說，它的原義是程度或數量上的少，在教科書裡是拒絕邀請時的委婉說法。
  - 英語也有類似情形。Cambridge Dictionary 說明，quite 加在可分程度的形容詞或副詞前，通常是有一點、還可以但不是很的意思；它的例句說某人以前 quite good at drawing，意思是還可以、不算出色。照字面翻成「很會畫」，就把評價翻高了。
  qa:
    question: 為什麼日語只說「土曜日はちょっと」，對方就知道你在拒絕？
    answer: 拒絕邀請時，日語常用「…はちょっと」，把不方便說得委婉；照字面翻成星期六有一點，就看不出是在拒絕。不過它不是每個場合都合適：加藤香須美（2019）的訪談裡，也有人被這樣拒絕後覺得不愉快，該教科書的教師手冊則建議別只說「ちょっと…」，要補上理由。
    source: kato-chotto
  items_title: 兩個照字面會誤會的例子
  items:
  - title: 日語〜はちょっと
    text: 字面是一點點，拒絕邀請時是委婉說法。
    example: 土曜日はちょっと。
  - title: 英式英語 quite
    text: 字面像很，加在 good 前常是還可以。
    example: He had been quite good at drawing when he was at school.
  sources:
  - tufs-kotowari
  - kotobank-chotto
  - kato-chotto
  - cambridge-quite
how:
  heading: 並排比較，再問情境
  body:
  - CEFR 2020 版描述跨文化能力的進程：B1 能簡單討論在另一個文化裡看似奇怪的事，對當地人可能很正常；B2 能察覺自己視為理所當然的事，別人不一定這樣想，並能反思不同的溝通方式可能帶來的誤會。
  - 本站建議：把外語說法、字面翻譯、實際意思和適合的場合並排寫下來，每一句都附上查到的出處，再找會說這種語言的人或教材確認情境。
  items_title: 並排表（本站建議）
  items:
  - title: 字面意思
    text: 逐字翻成中文是什麼。
  - title: 實際意思
    text: 說話的人真正想表達什麼。
  - title: 適合的場合
    text: 對誰說、在什麼情況說。
  checklist_title: 每一句都寫出：
  checklist:
  - 字面意思
  - 實際意思
  - 適合的場合
  - 查到的出處
  activity_figure: how-flow
  sources:
  - cefr-cv
what:
  heading: 字面意思，不等於實際意思
  figures:
  - what-compare
  notes:
  - 用 AI 整理禮貌用語時，UNC 寫作中心提醒 AI 不太會拿捏慣用語、情境與正式程度；它給的例子要回到教材或辭典查證。
  - 別把一個例子當成整個文化的定論。CEFR C1 描述語描述的能力包括察覺判斷與偏見背後常有隱含的價值觀；本站建議說成「這個說法在某些情境常見」，而不是「某國人都這樣」。
  - 並排表是本站建議；「3 句」是示意。
  sources:
  - unc-ai
  - cefr-cv
