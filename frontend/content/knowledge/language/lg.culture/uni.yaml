  supports: デジタル大辞泉 ちょっと［副］１：「物事の数量・程度や時間がわずかであるさま。すこし。」；精選版 日本国語大辞典 ちょっと［一］③：「差し障りのあること、具合の悪いことを曖昧にぼかして表わす語。」例「私はお酒はちょっと…」
- id: kato-chotto
  title: 日本語教科書の中の「ちょっと」―外国人は「ちょっと」をどう学ぶか―（“Chotto” in a Japanese language textbook）
  publisher: 加藤香須美，日本国際情報学会誌『Kokusai-Joho』4 巻 1 号 pp. 49–55（2019 年 7 月 7 日発行；J-STAGE）
  url: https://www.jstage.jst.go.jp/article/kjoho/4/1/4_49/_article/-char/ja
  accessed: '2026-10-29'
  kind: reference
  supports: Abstract：「The original meaning of this word is the amount and extent」；「The former is euphemism used when declining an invitation, or making a request moderately.」；本文：「『ちょっと』の原義は程度や数量を表す『少し』であるのだが、文脈によってさまざまな意味に変化し多くの機能を持つことになる。」；『翻訳・文法解説』は「誘いを断るときの婉曲表現と説明している」；『手引き』：「『ちょっと…。』で止めるのではなく、相手への気配りから理由を添えるとしている」；「一方で日本人同士でも『ちょっと…。』と断られて不愉快になりその後その人との関係に影響を及ぼしたと話す人もいた。」
