idea: 一篇文章先交代發生什麼，再寫經過和轉變，最後收在一個想法或感受。
guiding_questions:
- 故事少了結尾，會讓人有什麼感覺？
scenario: 親子共學：用三張便利貼寫開頭、經過、結尾，排一排，再試試把順序換掉會怎樣。
goal: 寫一篇有開頭、經過、結尾的短文，結尾收在一個想法或感受。
review: 孩子寫 300 字短文，家長能用一句話說出開頭、經過、結尾各在講什麼，且結尾有一句感受或想法。
