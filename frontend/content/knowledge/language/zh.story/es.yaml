why:
  heading: 有順序，讀的人才跟得上
  body:
  - 課綱一、二年級學「順敘法」，也就是照事情發生的先後來寫（本站整理）；三、四年級學「記敘文本的結構」，並練習「審題、立意、選材、組織等寫作步驟」。
  - 閱讀時也一樣：一、二年級要「利用圖像、故事結構等策略，協助文本的理解與內容重述」。會看結構，寫的時候也比較知道怎麼排。
  qa:
    question: 故事少了結尾，會讓人有什麼感覺？
    answer: 會覺得事情沒說完，不知道結果怎樣、作者想說什麼。結尾把事情收住，也讓讀的人知道你的感受或想法。會考寫作的評分向度裡也有「結構組織」，完整的開頭、經過、結尾就是結構的一部分（本站整理）。
    source: cap-writing
  items_title: 課綱的安排
  items:
  - title: 順敘法
    text: 一、二年級學習內容：順敘法（照事情發生的先後寫，本站整理）。
    code: Ba-I-1
  - title: 用故事結構理解
    text: 一、二年級：利用圖像、故事結構等策略，協助文本的理解與內容重述。
    code: 5-I-6
  - title: 記敘文本的結構
    text: 三、四年級學習內容：記敘文本的結構。
    code: Ba-II-1
  - title: 寫作步驟
    text: 三、四年級：學習審題、立意、選材、組織等寫作步驟。
    code: 6-II-3
  sources:
  - kuoyu
  - cap-writing
how:
  heading: 三張便利貼排順序
  body:
  - 先用三張便利貼各寫一句：開頭（發生什麼事）、經過（怎麼了、有什麼轉變）、結尾（結果和感受）。排好順序後，再擴寫成段落。課綱說一、二年級的寫作「由口述作文開始引導」，所以可以先說給家人聽，再寫下來。
  items:
  - title: 開頭
    example: 星期六，我第一次自己去買早餐。
    text: 發生什麼事（例句是本站自編）。
  - title: 經過
    example: 老闆沒聽清楚，我鼓起勇氣又說了一次。
    text: 怎麼了、有什麼轉變。
  - title: 結尾
    example: 拿到蛋餅時，我覺得自己長大了。
    text: 結果和感受。
  checklist_title: 寫完檢查：
  checklist:
  - 開頭說發生什麼
  - 經過有轉變
  - 結尾有感受
  - 順序不亂跳
