idea: 六級分要「適切地統整、運用材料，並能進一步闡述說明以凸顯主旨」。挑一件最有感的事，寫出細節和你的想法。
guiding_questions:
- 寫「改變」，說五件事，還是把一件事說深？
scenario: 親子共學：同一題列出 5 個材料，親子各投一票「最只有你寫得出來」的那個，再說為什麼。
goal: 為題目選一件最有感的小事，寫出細節與自己的想法來撐起主旨。
review: 同一題孩子列 5 個材料，選 1 個寫成 300 字段落；家長讀完能說出一個「只有你寫得出來」的細節。
