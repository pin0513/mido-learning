why:
  heading: 材料要撐得起主旨
  body:
  - 會考寫作評分規準把「立意取材」列為第一個向度。六級分要「適切地統整、運用材料，並能進一步闡述說明以凸顯主旨」；四級分只「尚能闡述說明主旨」。差別在材料選得準不準、說得深不深（本站整理）。
  - 國語文課綱寫作的步驟是「審題、立意、取材、組織、遣詞造句、修改潤飾」。
  qa:
    question: 寫「改變」，說五件事，還是把一件事說深？
    answer: 評分規準沒有規定要寫幾件事，看的是材料能不能「適切地統整、運用」，並「進一步闡述說明以凸顯主旨」。五件事都只說一句，很難做到「進一步闡述」；所以通常建議挑一件最有感的事寫深，再用一兩件小事呼應（本站建議）。
    source: cap-rubric
  items_title: 國中課綱怎麼說
  items:
  - title: 立意、取材
    text: 國語文 6-Ⅳ-2：依據審題、立意、取材、組織、遣詞造句、修改潤飾，寫出結構完整、主旨明確、文辭優美的文章。
    code: 6-IV-2
  sources:
  - cap-rubric
  - kuoyu
how:
  heading: 列五個，選一個寫深
  body:
  - 先列 5 個可能的材料，問自己：哪一件真的發生過、我最有感、別人寫不出來？選定後，寫出當時看到、聽到的細節，再寫你因此想到什麼（本站建議）。
  items:
  - title: 列材料
    text: 先寫 5 個，不急著挑。
  - title: 選最有感的
    text: 真的發生過、別人寫不出來的那件。
  - title: 寫細節和想法
    text: 細節讓人相信，想法讓人看到主旨。
  checklist_title: 選材之前：
  checklist:
  - 列五個材料
  - 選最有感的
  - 寫出細節
  - 連回主旨
  activity_figure: how-flow
  sources:
  - cap-rubric
