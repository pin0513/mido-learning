idea: 高中必修的文言選文比例為 3 年平均 35%–45%，學測國綜也照這個比例命題。自學一篇古文：先看題解知道背景，讀注釋解決字詞，逐句翻譯，最後問「作者想說什麼、怎麼寫的」。
guiding_questions:
- 沒有老師講解，你能自己讀懂一篇古文嗎？
scenario: 親子共學：大人和孩子選同一篇古文，各自做五欄筆記，對照哪一句翻得不一樣。
goal: 用題解、作者、注釋、翻譯、賞析五步，自己讀懂一篇沒教過的古文。
review: 孩子挑一篇課本沒教的古文（例如推薦選文以外的短篇），交一頁五欄筆記；家長抽 3 句請孩子翻成白話，都通順。
