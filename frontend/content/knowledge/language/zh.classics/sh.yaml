why:
  heading: 沒有老師，也讀得懂古文
  body:
  - 國語文課綱規定：「文言文除中華文化基本教材外，其課數比率須符合 3 年平均 35%至 45%。」大考中心的學測國文考試說明引用這條原則，並說「國綜文言文命題取材比率，參酌此原則」。
  - 課綱也說明每課內容可附「題解、作者、注釋、問題討論、賞析、延伸閱讀」。自己讀一篇沒教過的古文，可以照著這個結構做筆記。
  qa:
    question: 沒有老師講解，你能自己讀懂一篇古文嗎？
    answer: 可以，借用課本每課的結構。課綱說「題解包括文類、主旨、寫作背景等」，「注釋以詞意解釋為原則」。先讀題解知道背景，再靠注釋解決字詞，逐句翻成白話，最後寫賞析。
    source: kuoyu
  items_title: 高中課綱的文言閱讀目標
  items:
  - title: 詞義與語詞結構
    text: 國語文 Ab-Ⅴ-2：文言文的詞義及語詞結構。
    code: Ab-V-2
  - title: 虛字與古今義變
    text: 國語文 Ab-Ⅴ-3：文言文的字詞、虛字、古今義變。
    code: Ab-V-3
  - title: 非韻文
    text: 國語文 Ad-Ⅴ-4：非韻文：如古文、古典小說、語錄體、寓言等。
    code: Ad-V-4
  - title: 主動探索意涵
    text: 國語文 5-Ⅴ-5：主動思考與探索文本的意涵，建立終身學習能力。
    code: 5-V-5
  sources:
  - kuoyu
  - ceec
how:
  heading: 五欄筆記
  body:
  - 一頁紙分五欄：題解、作者、注釋、翻譯、賞析（翻譯一欄是本站整理，其他四欄出自課綱列的每課內容）。
  items_title: 五欄怎麼寫（本站整理）
  items:
  - title: 題解與作者
    text: 寫下文類、主旨、寫作背景和作者。
  - title: 注釋
    text: 把不懂的字詞和虛字列出來，查注釋或辭典。
  - title: 逐句翻譯
    text: 一句一句翻成白話，不跳過。
  - title: 賞析
    text: 作者想說什麼？用了什麼寫法？
  checklist_title: 交筆記前：
  checklist:
  - 寫出主旨
  - 列出難字詞
  - 每句都翻
  - 寫一句賞析
  activity_figure: how-flow
  sources:
  - kuoyu
what:
  heading: 翻譯之後還要賞析
  figures:
  - what-compare
  notes:
  - 課綱附錄四列出「普通型高級中等學校（第五學習階段）推薦選文 15 篇」，例如〈燭之武退秦師〉〈師說〉〈赤壁賦〉〈勸和論〉，「提供編選參考」。
  - 35% 至 45% 不包含中華文化基本教材。
