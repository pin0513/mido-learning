why:
  heading: 打招呼是說英語的第一步
  body:
  - 英語文領綱第二學習階段要學生「能了解國內外基本的招呼方式」，第三學習階段要學生「能作簡易的提問」。全民英檢初級的口說能力也包括「簡單地自我介紹」。會打招呼、會介紹自己、會問對方一個問題，就能開始一段對話。
  qa:
    question: 跟外國朋友見面，第一句話要說什麼？
    answer: 先打招呼（Hi! / Hello!），再說名字（I'm…），最後問對方一個問題（What's your name?）。全民英檢初級的口說能力就包括簡單地自我介紹。
    source: gept-elementary
  items_title: 英語文領綱的學習重點
  items:
  - title: 招呼方式
    text: 英語文 8-Ⅱ-1：能了解國內外基本的招呼方式。
    code: 8-II-1
  - title: 國內外招呼
    text: 英語文 C-Ⅱ-1：國內（外）招呼方式。
    code: C-II-1
  - title: 簡易提問
    text: 英語文 2-Ⅲ-8：能作簡易的提問。
    code: 2-III-8
  checklist_title: 開始前先確認
  checklist:
  - 會說 Hi、Hello
  - 會說自己的名字
  notes:
  - 2-Ⅲ-8 屬第三學習階段（國小五、六年級）；本站建議三、四年級先練打招呼。
  sources:
  - english
  - gept-elementary
how:
  heading: 打招呼、介紹、再提問
  body:
  - 本站建議：把自我介紹拆成三步：打招呼、說名字和一件喜歡的事、問對方一個問題。先和家人練，熟了再和老師、同學練。
  items_title: 本站建議的步驟
  items:
  - title: 打招呼
    text: Hi! / Hello! / Good morning!
  - title: 介紹自己
    text: I'm… I like…
  - title: 問對方
    text: What's your name? / What do you like?
  - title: 聽回答
    text: 聽懂對方的回答，再說 Nice to meet you.
  checklist_title: 每次練完勾一下
  checklist:
  - 打了招呼
  - 說了名字
  - 問了問題
  - 聽懂回答
  activity_figure: greet-flow
  notes:
  - 步驟與句子是本站建議。
  sources:
  - english
what:
  heading: 能和新朋友開口聊
  body:
  - 學完後，孩子能用英文打招呼、介紹自己，並問對方一個問題。自我介紹裡的名字是個人資料，只在家人、老師、同學面前說；不要輸入 AI，也不要把影片上傳。
  items_title: 學完能做到
  items:
  - title: 打招呼
    text: 用 Hi、Hello 或 Good morning 打招呼。
  - title: 自我介紹
    text: 說出名字和喜歡的東西。
  - title: 提問
    text: 問對方一個簡單的問題。
  checklist_title: 家長檢核
  checklist:
  - 說了自我介紹
  - 問了一個問題
  - 影片沒有上傳
  figures:
  - greet-compare
  notes:
  - 檢核的 30 秒是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網E-BOT），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  - 不把孩子的名字、照片輸入 AI（教育部學生版注意事項六（三））。
  sources:
  - english
  - gept-elementary
  - genai-student
