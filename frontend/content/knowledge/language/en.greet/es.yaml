idea: 用 Hello、My name is…、I like… 這幾句，就能和人開始聊天。說的時候看著對方、面帶微笑，也是溝通的一部分。
guiding_questions:
- 跟外國朋友見面，第一句話要說什麼？
scenario: 親子共學：全家輪流當「新同學」，用三句英文介紹自己：名字、幾歲、喜歡什麼，再問對方一個問題。
goal: 用三句英文打招呼和自我介紹，並問對方一個問題。
review: 錄一段 30 秒影片：打招呼、名字、喜歡的東西、問對方一個問題；家長確認四項都有且聽得懂。這也是全民英檢初級口說「簡單地自我介紹」的起點。
