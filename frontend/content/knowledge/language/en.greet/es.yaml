# - 全民英檢初級口說「簡單地自我介紹」逐字正確，補上出處 id。
# - 安全：原本建議 AI「扮演對話的另一方」、檢核要錄自我介紹影片，但內容含名字和年齡。依教育部學生版注意事項，改成 AI 只由大人操作、不輸入孩子的個人資料；影片只留在家裡、不上傳。
# - 檢核數字標示意。
