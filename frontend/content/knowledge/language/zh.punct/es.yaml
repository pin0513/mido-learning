why:
  heading: 標點讓人讀對意思
  body:
  - 說話時，我們用停頓和語氣讓人聽懂；寫成文字，就要靠標點符號。教育部《重訂標點符號手冊》說，逗號「用於隔開複句內各分句，或標示句子內語氣的停頓」，句號「用於一個語義完整的句末」。
  - 課綱要一、二年級「認識常用標點符號」，三、四年級「理解各種標點符號的用法」；寫作時則要「根據表達需要」使用標點。
  figures:
  - why-compare
  qa:
    question: 「我昨天去公園，看到很多花，很漂亮，然後回家。」哪裡該換成句號？
    answer: 可以把「很漂亮」後面的逗號換成句號：「我昨天去公園，看到很多花，很漂亮。然後回家。」前半句說完了在公園看到的事，意思已經完整；手冊說句號用在「語義完整的句末」，逗號用來「隔開複句內各分句」。在哪裡斷句，要看你想把哪些事放在一起說，有時不只一種對的答案（本站整理）。
    source: punct
  items_title: 一到四年級，課綱要孩子
  items:
  - title: 認識常用標點
    text: 一、二年級：認識常用標點符號。
    code: 5-I-2
  - title: 會用常用標點
    text: 一、二年級：根據表達需要，使用常用標點符號。
    code: 6-I-1
  - title: 理解各種用法
    text: 三、四年級：理解各種標點符號的用法。
    code: 5-II-2
  - title: 依需要使用
    text: 三、四年級：根據表達需要，使用各種標點符號。
    code: 6-II-1
