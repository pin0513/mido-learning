idea: 一個意思說完用句號，還沒說完用逗號；問句用問號，感嘆用驚嘆號；說出口的話用引號「」，引號前常用冒號。
guiding_questions:
- 「我昨天去公園，看到很多花，很漂亮，然後回家。」哪裡該換成句號？
scenario: 親子共學：複習版：把一段沒有標點的文字唸給對方聽，聽的人在停頓處拍手，再一起補上標點。大人可以用自己最近傳的一則長訊息來試。
goal: 一段話裡的逗號、句號、問號用得對，說完一個意思就用句號。
review: 家長給一段 60 字左右、拿掉標點的文字，孩子補上標點後唸出來；句號位置與家長的版本差不到 1 處。
