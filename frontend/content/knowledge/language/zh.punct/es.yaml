how:
  heading: 唸出來，聽哪裡要停
  body:
  - 先把句子唸出來：只是停頓、意思還沒說完，用逗號；意思說完整了，用句號。再聽語氣：問人用問號，感嘆或加重語氣用驚嘆號。唸出來找停頓是本站建議的方法，對不對還是以手冊的說明為準。
  items:
  - title: 問句用問號
    example: 你吃飽了嗎？
    text: 手冊：問號用於疑問句之後。
  - title: 感嘆用驚嘆號
    example: 這朵花好香啊！
    text: 手冊：用於感嘆語氣及加重語氣的詞、語、句之後。
  - title: 說話加引號
    example: 我問他：「你有什麼意見？」
    text: 冒號總起下文，引號標示說話；引文的句尾符號標在引號之內。
  checklist_title: 寫完檢查五件事：
  checklist:
  - 意思完整用句號
  - 停頓用逗號
  - 問句用問號
  - 感嘆用驚嘆號
  - 說的話加引號
  activity_figure: how-flow
  sources:
  - punct
what:
  heading: 國小先學的標點
  figures:
  - what-symbols
  notes:
  - 句號占一個字的位置，寫在格子正中（手冊 p.2）。
  - 引號裡如果是完整的句子，句尾符號標在引號之內，例如：我問他：「你有什麼意見？」（手冊 p.7）
  - 冒號也用在稱呼後面，例如「親愛的小朋友：」（手冊 p.6）。
  - 手冊共列十五種標點符號（p.1）；三、四年級起學「各種標點符號的用法」（課綱 Ac-II-1）。
  sources:
  - punct
  - kuoyu
