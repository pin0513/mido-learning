why:
  heading: 不會念也查得到
  body:
  - 《重編國語辭典》說，部首是字典「按照字形結構，取形體偏旁相同者，分部排列，作為查字的依據」。所以不知道讀音，也能從字形找到這個字；知道讀音、不會寫，就用注音找。
  - 課綱一、二年級要「學習查字典的方法」，三、四年級要「會利用書面或數位方式查字辭典，並能利用字辭典，分辨字詞義」。
  figures:
  - why-compare
  qa:
    question: 「鯨」不會念，用部首查，要先翻哪一部？
    answer: 先翻「魚」部。《國語小字典》列出「鯨」的部首是魚，部首外筆畫 8 畫、總筆畫 19 畫，所以在魚部的 8 畫裡找；查到它念 ㄐㄧㄥ。
    source: mini-jing
  items_title: 課綱的查字典目標
  items:
  - title: 學查字典
    text: 一、二年級：學習查字典的方法。
    code: 4-I-3
  - title: 部首的分類功能
    text: 一、二年級學習內容：常用字部首的表義（分類）功能。
    code: Ab-I-4
  - title: 書面或數位查
    text: 三、四年級：會利用書面或數位方式查字辭典，並能利用字辭典，分辨字詞義。
    code: 4-II-3
  - title: 字辭典的運用
    text: 三、四年級學習內容：字辭典的運用。
    code: Ab-II-10
  sources:
  - dict-bushou
  - kuoyu
how:
  heading: 先猜部首，再數筆畫
  body:
  - 拿到不會念的字，先猜它的部首（常是左邊、上面或外框的部分，這是本站整理的猜法，不是每個字都適用），到部首索引找到那一部，再數部首以外的筆畫，在那一頁找。會念不會寫的字，就用注音索引照讀音找。
  - 線上查字，教育部《重編國語辭典》網站提醒：中小學學習建議使用《國語辭典簡編本》或《國語小字典》。
  items:
  - title: 部首查
    example: 鯨 → 魚部 → 部首外 8 畫
    text: 不會念時用。
  - title: 注音查
    example: ㄐㄧㄥ → 鯨
    text: 會念不會寫時用。
  - title: 看例詞
    example: 在：「我在聽音樂。」
    text: 知道這個字怎麼用。
  checklist_title: 查一個字的步驟：
  checklist:
  - 猜出部首
  - 數其餘筆畫
  - 找到讀音
  - 讀一個例詞
  activity_figure: how-flow
  sources:
  - mini-jing
  - mini-zai
  - dict-bushou
what:
  heading: 部首、筆畫、讀音
  notes:
  - 鯨：部首 魚，部首外筆畫 8 畫，總筆畫 19 畫，讀音 ㄐㄧㄥ（國語小字典）。
  - 「魚」本身是 11 畫（國語小字典）；鯨的總筆畫 19＝部首 11 畫＋部首外 8 畫。
  - 「三分鐘」是示意，熟練以後自然會變快。
  sources:
  - mini-jing
  - mini-yu
