idea: 不會念的字用部首查：先找部首，再數部首以外的筆畫。會念不會寫的字用注音查。查到後順便看例詞，知道這個字怎麼用。
guiding_questions:
- 「鯨」不會念，用部首查，要先翻哪一部？
scenario: 親子共學：複習版：家長和孩子比賽，各用紙本字典和教育部線上《國語辭典》查同三個字，比較兩種方法。
goal: 不會念的字用部首查，會念不會寫的字用注音查，三分鐘內查到。
review: 家長出 3 個生字（1 個只給字形、2 個只給讀音），孩子用紙本或線上字典各在 3 分鐘內查到，並說出一個例詞。
