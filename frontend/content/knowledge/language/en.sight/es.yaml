idea: the、of、to、you、is 這類常見字（high-frequency words）在書裡一直出現，美國共同核心標準要幼兒園學生一眼認讀（read by sight）；其中有些拼法不規則，要整個字記（本站整理）。認得這些字，再搭配分級讀本，就能開始自己讀。
guiding_questions:
- 繪本裡一直出現的 the、is、can，為什麼要先認得？
scenario: 親子共學：親子共讀一本英文繪本，每次看到 the、is、can 就拍一下手，讀完數一數各出現幾次。
goal: 一眼認得常見字，讀完一本美國幼兒園到二年級（K–2）程度的分級讀本。
review: 孩子讀完一本程度相當的分級讀本，說出故事在講什麼；家長記下卡住的字，平均 1 頁少於 2 個（示意）。
