why:
  heading: 常見字一眼認，才讀得順
  body:
  - 英語文領綱第三學習階段要學生「能看懂繪本故事的主要內容」，並「能藉圖畫、標題、書名等作簡易的猜測」。實施要點建議「經由簡易有趣的故事及短文，讓學生在有意義的語意環境下學習識字」（p.31）。美國共同核心標準也要學生一眼認讀 the、of、to、you 這類常見字。
  qa:
    question: 繪本裡一直出現的 the、is、can，為什麼要先認得？
    answer: 美國共同核心標準 RF.K.3c 要幼兒園學生「Read common high-frequency words by sight」，例如 the、of、to、you。這些常見字一眼認得，讀故事時注意力就能放在內容上（本站整理）。RF.1.3g 也要一年級學生認讀拼法不規則的字（irregularly spelled words）；這類字用拼讀不好念，整個字記比較快（本站整理）。
    source: ccss-ela
  items_title: 英語文領綱的學習重點
  items:
  - title: 看懂繪本
    text: 英語文 3-Ⅲ-7：能看懂繪本故事的主要內容。
    code: 3-III-7
  - title: 藉圖猜測
    text: 英語文 3-Ⅲ-9：能藉圖畫、標題、書名等作簡易的猜測。
    code: 3-III-9
  checklist_title: 開始前先確認
  checklist:
  - 會基本拼讀
  - 找好一本讀本
  sources:
  - english
  - ccss-ela
how:
  heading: 先認常見字，再讀分級書
  body:
  - 英語文領綱把「分級的英語文課外閱讀教材」列為教學資源（p.32）。本站建議：台灣孩子可以從美國 K–2 程度的分級讀本開始，讀之前先看圖和書名猜內容，讀的時候把卡住的字記下來。
  items_title: 本站建議的讀法
  items:
  - title: 先看圖和書名
    text: 猜猜故事會講什麼。
  - title: 認常見字
    text: the、of、to、you 一眼認出來。
  - title: 記下卡住的字
    text: 讀完再查、再念。
  - title: 說出故事
    text: 用中文或英文說故事大意。
  checklist_title: 每讀一本勾一下
  checklist:
  - 先猜內容
  - 記下生字
  - 說出大意
  activity_figure: sight-flow
  notes:
  - 從 K–2 程度開始是本站建議；這裡不指定書目。
  sources:
  - english
  - ccss-ela
what:
  heading: 能自己讀完一本小書
  body:
  - 學完後，孩子一眼認得常見字，能自己讀完一本程度相當的分級讀本，並說出故事的主要內容。
  items_title: 學完能做到
  items:
  - title: 認得常見字
    text: 常見字不用拼就認得。
  - title: 讀完一本書
    text: 自己讀完程度相當的讀本。
  - title: 說出主要內容
    text: 說出故事在講什麼。
  checklist_title: 家長檢核
  checklist:
  - 讀完一本
  - 說出大意
  - 卡住的字少
  figures:
  - sight-compare
  notes:
  - 「1 頁少於 2 個」是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網E-BOT），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - english
  - genai-student
