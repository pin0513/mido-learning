idea: 有些字出現得特別多，又不太照拼讀規則（the、is、said），一眼認得它們，讀繪本就快很多。美國小學用分級讀本（leveled readers）一級一級往上讀，台灣孩子也可以從幼兒園到二年級的程度開始。
guiding_questions:
- 繪本裡一直出現的 the、is、can，為什麼要先認得？
scenario: 親子共學：親子共讀一本英文繪本，每次看到 the、is、can 就拍一下手，讀完數一數各出現幾次。
goal: 一眼認得常見字，讀完一本美國幼兒園到二年級（K–2）程度的分級讀本。
review: 孩子自己朗讀一本 K–2 分級讀本給家長聽，卡住的字少於 1 頁 2 個，讀完能用中文說出故事發生了什麼。
