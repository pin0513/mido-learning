idea: 很多實證研究論文用 IMRAD 結構：引言（Introduction）、方法（Methods）、結果（Results）、討論（Discussion）；不同學科會有些變化，有些會要求加上摘要。先讀標題、摘要、引言、各節標題和結論，決定要不要細讀，再挑需要的部分細讀。
guiding_questions:
- 一篇很長的英文論文，要先讀哪幾段？
scenario: 親子共學：找一篇和你興趣相關的英文論文，先做第一遍讀法（標題、摘要、引言、各節標題、結論），用幾句中文說它發現了什麼（例如三句，示意）。
goal: 讀英文學術論文：用第一遍讀法（標題、摘要、引言、各節標題、結論）決定要不要細讀，再挑需要的部分。
review: 選一篇和興趣相關的英文論文，先做第一遍讀法，再用三句中文說出研究問題、方法、發現；家人對照摘要確認沒有說錯（三句是示意）。
