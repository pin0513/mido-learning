# B8 提案：en.academic@uni
# - 補 Why/How/What 與兩張圖。論文結構改依 UNC 寫作中心〈Scientific Reports〉：Introduction、Methods、Results、Discussion（IMRAD），並註明「may take slightly different shapes depending on the discipline」，不說所有論文都一樣。
# - 先讀哪幾段改依 Keshav 三遍讀法的第一遍（標題、摘要、引言、各節標題、結論）。
# - 引導問題的「20 頁」、情境與檢核的「三句」是沒標示的示意數字，改成一般說法或標示意。
# - 安全：AI 摘要論文——要讀全文核對、不貼未公開文件；大學對應托福標為本站建議（顯示在 notes）。
# - 第一輪獨立審查修正：原 notes 引的學術寫作指南那句，是在講研究生「寫自己論文的摘要」，而且手冊註明不代表教育部立場，放在「讀別人論文」脈絡會誤導；改成本站建議＋學術倫理電子報（2023 年 8 月）「資訊驗證」原文，刪 ethics-guide 來源。本點沒有托福事實，刪 toefl-content 來源。idea 的「常再加上摘要」改成 UNC 原文的「有些會要求加上摘要」；goal、情境改成 How 教的第一遍讀法。
# - 第三輪獨立審查修正：What「說出 IMRAD 各節在哪裡」只在 Why 教，How 新增第三段：讀各節標題時對照 IMRAD 找出四節、細讀時直接跳到方法或結果（本站建議，依 UNC）；how.sources 補 unc-scientific-reports；How checklist 補「找到 IMRAD 各節」。
# - 第五輪獨立審查修正：What notes 的 AI 注意事項補「不代寫」（學術倫理電子報（二）著作權「還可能有代寫的學術倫理問題」；是電子報的提醒，不寫成硬規定），ethics-epaper13 supports 補（二）著作權整句（2026-10-29 重抓逐字核對）；How body 補 AI 使用說明（不貼機密、自己查證、自己寫、說明工具），how.sources 加 ethics-epaper13，讓 What 的注意事項在 How 有教到。
# - 第六輪獨立審查修正：（阻擋 R-1）How 的 AI 段落改寫：刪掉和 What notes 重複的電子報引文、合併自我重複的「自己寫／不直接交出去」；不貼個資與未公開文件或機密資料（電子報（三））、輸出自己查證（（一））、內容自己寫（（二））歸給電子報，只有「依課程規定說明用了哪個工具」標本站建議。
