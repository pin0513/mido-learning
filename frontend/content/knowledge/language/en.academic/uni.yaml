- id: unc-scientific-reports
  title: Scientific Reports（Writing Center 寫作講義）
  publisher: The Writing Center, University of North Carolina at Chapel Hill
  url: https://writingcenter.unc.edu/tips-and-tools/scientific-reports/
  accessed: '2026-10-29'
  kind: reference
  supports: '「Here is the basic format scientists have designed for research reports: Introduction Methods and Materials Results Discussion」；「This format, sometimes called 『IMRAD,』 may take slightly different shapes depending on the discipline or audience; some ask you to include an abstract」；表格：Methods「details how you tested your hypothesis」，Results「provides raw (i.e., uninterpreted) data collected」，Discussion「considers whether the data you obtained support the hypothesis」'
- id: keshav
  title: How to Read a Paper
  publisher: S. Keshav，University of Waterloo（ACM SIGCOMM Computer Communication Review 發表之講義版，史丹佛大學 EE384M 課程網頁存放）
  url: https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf
  accessed: '2026-10-29'
  kind: reference
  supports: The first pass：「The first pass is a quick scan to get a bird's-eye view of the paper. You can also decide whether you need to do any more passes.」步驟「Carefully read the title, abstract, and introduction」「Read the section and sub-section headings, but ignore everything else」「Read the conclusions」
- id: ethics-epaper13
  title: 大學校園因應生成式AI之指引及教學建議（學術倫理電子報第 13 期）
  publisher: 教育部臺灣學術倫理教育資源中心（2023 年 8 月）
  url: https://ethics.moe.edu.tw/resource/epaper/html/21/
  accessed: '2026-10-29'
  kind: reference
  supports: （五）學術寫作的自我揭露：「目前學術界對於使用生成式AI是否需要標註，尚無統一的規定」，「建議研究者應先瞭解經費補助機關（構）或期刊等單位對於生成式AI之政策，並於著作或報告中適度公開相關訊息」；（三）個人資料保護與資通安全：「研究者應留意，不要將個人資訊、未公開文件、機密資料等內容輸入到生成式AI的對話框中，以避免產生個人隱私洩露的問題。」；（一）資訊驗證：「因此研究者在使用生成式AI工具時，必須對於其產出之內容保持一定程度之質疑，並親自驗證相關內容的正確性與時效性，以確保可信度。」；（二）著作權：「由於生成式AI是將網路開放資料透過蒐集與彙整所生成的內容，研究者若直接將生成的內容拿來使用，而非親自撰寫或創作，除在法律上不享有著作權保障之外，還可能有代寫的學術倫理問題。」
