why:
  heading: 論文有固定的路標
  body:
  - UNC 寫作中心說，研究報告的基本格式是 Introduction、Methods and Materials、Results、Discussion，「sometimes called 『IMRAD,』 may take slightly different shapes depending on the discipline or audience」。
  - 每一節有自己的任務：Methods「details how you tested your hypothesis」，Results「provides raw (i.e., uninterpreted) data collected」，Discussion「considers whether the data you obtained support the hypothesis」。知道路標，就知道要找的資訊在哪裡。
  qa:
    question: 一篇很長的英文論文，要先讀哪幾段？
    answer: 先做 Keshav 說的第一遍：「Carefully read the title, abstract, and introduction」、只讀各節標題、再「Read the conclusions」。讀完就能決定要不要繼續細讀。
    source: keshav
  items_title: IMRAD 各節的任務
  items:
  - title: 引言
    text: 提出研究問題與假設，連到過去研究。
  - title: 方法
    text: 說明怎麼檢驗假設。
  - title: 結果
    text: 呈現收集到的資料。
  - title: 討論
    text: 判斷資料是否支持假設，談限制。
  checklist_title: 開始前先確認
  checklist:
  - 選好一篇論文
  - 找到摘要和結論
  sources:
  - unc-scientific-reports
  - keshav
how:
  heading: 先掃一遍，再決定細讀
  body:
  - Keshav 說，第一遍是「a quick scan to get a bird's-eye view of the paper」，也可以決定要不要再讀下去。
  - 本站建議：第一遍讀完，用三個問題檢查自己：研究問題是什麼？用什麼方法？發現了什麼？
  - 讀各節標題時，對照 UNC 寫作中心說的 IMRAD 四節（Introduction、Methods and Materials、Results、Discussion），找出引言、方法、結果、討論各在哪裡；UNC 也說這個格式「may take slightly different shapes depending on the discipline or audience」，所以標題不一定一模一樣。本站建議：需要細讀時，直接跳到方法（怎麼檢驗假設）或結果（收集到的資料）。用 AI 幫忙時，照學術倫理電子報的提醒做：不貼個人資訊、未公開文件或機密資料，AI 的輸出自己查證，內容自己寫，不把 AI 生成的內容直接交出去。本站建議：交作業時依課程規定說明用了哪個工具、做了什麼。
  items_title: 第一遍讀法（Keshav）
  items:
  - title: 讀標題摘要引言
    text: 仔細讀這三個部分。
  - title: 讀各節標題
    text: 其他內容先略過。
  - title: 讀結論
    text: 看作者的主要發現。
  - title: 決定下一步
    text: 要不要細讀方法與結果。
  checklist_title: 讀完第一遍
  checklist:
  - 找到 IMRAD 各節
  - 說得出研究問題
  - 說得出方法
  - 說得出發現
  activity_figure: academic-flow
  sources:
  - keshav
  - unc-scientific-reports
  - ethics-epaper13
what:
  heading: 讀懂一篇論文的骨架
  body:
  - 學完後，能用第一遍讀法快速判斷一篇英文論文和自己有沒有關係，並說出它的研究問題、方法與發現。
  items_title: 學完能做到
  items:
  - title: 找到路標
    text: 說出 IMRAD 各節在哪裡。
  - title: 快速判斷
    text: 用第一遍決定要不要細讀。
  - title: 說出重點
    text: 研究問題、方法、發現。
  checklist_title: 家人檢核
  checklist:
  - 三項都說得出
  - 對照摘要沒說錯
  figures:
  - academic-compare
  notes:
  - 把大學階段對應多益、托福是本站建議，不是官方換算。
  - 本站建議：用 AI 摘要別人的論文時，AI 的摘要只當導讀，要回到全文核對。教育部臺灣學術倫理教育資源中心 2023 年的電子報提醒，研究者使用生成式 AI 工具時「必須對於其產出之內容保持一定程度之質疑，並親自驗證相關內容的正確性與時效性」。
  - 用生成式 AI 時，不要把個人資訊、未公開文件、機密資料貼進去（教育部臺灣學術倫理教育資源中心 2023 年的電子報）；AI 的輸出要自己查證。這份 2023 年的電子報也說，學術界對使用生成式 AI 是否需要標註「尚無統一的規定」，建議先了解相關單位的政策；不要把 AI 生成的內容直接當成自己寫的交出去，電子報提醒，直接使用生成的內容而非親自撰寫，「還可能有代寫的學術倫理問題」；交作業時依課程規定說明用了哪個工具、做了什麼；AI 規定變化快，以學校和課程最新的規定為準（本站建議）。
  - 情境與檢核的三句是示意。
  sources:
  - ethics-epaper13
