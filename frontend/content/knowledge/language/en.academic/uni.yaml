idea: 論文有固定的結構：摘要、引言、方法、結果、討論。先讀摘要和結論判斷要不要讀，再挑需要的部分細讀。
guiding_questions:
- 一篇 20 頁的論文，要先讀哪幾段？
scenario: 親子共學：找一篇和你興趣相關的英文論文，只讀摘要和結論，用三句中文說它發現了什麼。
goal: 讀英文學術論文：先讀摘要和結論決定要不要細讀，再挑需要的部分。
review: 選一篇和興趣相關的英文論文，用三句中文說出研究問題、方法、發現；家人對照摘要確認沒有說錯。
