idea: 很多英文單字是拼出來的：字首 + 字根 + 字尾。認得常見的零件，就能猜出生字，也記得更久。
guiding_questions:
- unhappy 和 replay 裡的 un-、re-，是什麼意思？
scenario: 親子共學：寫下 5 個 un- 開頭和 5 個 re- 開頭的字，先猜意思再查字典，看猜對幾個。
goal: 用常見字首、字根、字尾猜出生字的意思，累積會考基本字彙。
review: 家長挑 10 個含 un-、re-、-ful、-less 的生字，孩子先猜意思再查字典，猜對 7 個以上。
