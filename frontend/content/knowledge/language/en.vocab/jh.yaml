why:
  heading: 國中要會 1,200 個字
  body:
  - 英語文領綱說，國小畢業「口語部分應至少會應用300個字詞，書寫部分則至少會拼寫其中180個字詞」；「國民中學畢業時，學生應至少學會1,200個字詞，並能應用於聽、說、讀、寫的日常溝通中」（pp.27–28）。國中教育會考英語科的字彙「詳見課程綱要附錄五：表一、基本1,200字」。領綱也要學生熟悉猜測字義等閱讀技巧。
  qa:
    question: unhappy 和 replay 裡的 un-、re-，是什麼意思？
    answer: un- 加在字前面表示 not、lacking 或相反，所以 unhappy 是不快樂；re- 表示 do again，所以 replay 是再播一次。
    source: camb-un
  items_title: 英語文領綱的學習重點
  items:
  - title: 猜測字義
    text: 英語文 3-Ⅳ-12：能熟悉重要的閱讀技巧，如擷取大意、猜測字義、推敲文意、預測後續文意及情節發展等。
    code: 3-IV-12
  - title: 合理猜測
    text: 英語文 9-Ⅳ-1：能綜合相關資訊作合理的猜測。
    code: 9-IV-1
  checklist_title: 開始前先確認
  checklist:
  - 會查英英字典
  - 認得基本字
  notes:
  - 英語文 Ac-Ⅳ-4「國中階段所學字詞（能聽、讀、說、寫最基本的1,200字詞）。」與其他領綱同號，只在內文引用。
  sources:
  - english
  - cap-english
  - camb-un
  - camb-re
how:
  heading: 拆開字首、字尾猜意思
  body:
  - 本站建議：看到生字先找有沒有認得的字首或字尾，拆掉後看剩下的字認不認得，再把意思拼起來猜，最後查字典確認。
  items_title: 四個常見字首、字尾
  items:
  - title: un-
    text: not、lacking、the opposite of：unhappy
  - title: re-
    text: do again：replay、rewrite
  - title: -ful
    text: having the stated quality to a high degree：careful
  - title: -less
    text: without：careless
  checklist_title: 每猜一個勾一下
  checklist:
  - 找出字首字尾
  - 認出剩下的字
  - 查字典確認
  activity_figure: vocab-flow
  notes:
  - 猜字步驟是本站建議；字首、字尾的意思依 Cambridge Dictionary。
  sources:
  - camb-un
  - camb-re
  - camb-ful
  - camb-less
what:
  heading: 用字首、字尾猜生字
  body:
  - 學完後，孩子看到含 un-、re-、-ful、-less 的生字能猜出意思，再用新字造自己的句子；慢慢累積會考的基本 1,200 字。
  items_title: 學完能做到
  items:
  - title: 認出字首字尾
    text: un-、re-、-ful、-less 一眼認出。
  - title: 猜出意思
    text: 把字首、字尾和原字的意思拼起來。
  - title: 造句
    text: 用新字寫一句自己的話。
  checklist_title: 家長檢核
  checklist:
  - 猜得出意思
  - 查過字典
  - 造了句子
  figures:
  - vocab-compare
  notes:
  - 檢核用的 10 個、7 個是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網E-BOT），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去。
  sources:
  - camb-ful
  - camb-less
  - cap-english
  - genai-student
