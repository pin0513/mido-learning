# - 補 grades、英語文 3-Ⅳ-12、9-Ⅳ-1 與 Why/How/What、兩張圖。Ac-Ⅳ-4（國中 1,200 字詞）與第二外國語文、閩南語文同號，只在內文引用。
# - 會考 1,200 字依心測中心會考網站與英語文領綱（pp.27–28、附錄五表一）補上出處 id。
