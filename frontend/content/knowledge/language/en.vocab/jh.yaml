# - 檢核數字標示意；AI 依教育部學生版注意事項。
# - 標題與目標修正：原標題「字根字首」、目標「字首、字根、字尾」，本點只教字首與字尾，改成「字首字尾：猜出單字的意思」，目標刪去字根。
