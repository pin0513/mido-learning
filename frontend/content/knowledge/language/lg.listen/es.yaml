# B3 提案：lg.listen@es
# - guiding question「小嬰兒沒學過文法，為什麼也學會說話？」把母語習得直接類推到國小學外語，找不到課綱或可靠來源支持，換成「學英語，為什麼要先聽、再開口？」，依英語文課綱教學實施（p.31）回答。
# - 依英語文領綱補上依據：國小教材「重視聽、說能力的培養」（p.30）；初學階段給「正確範例與真實語言素材讓學生模仿」、鼓勵「大膽嘗試及不畏犯錯」、用「聆聽、複誦、跟讀、齊聲朗讀」（p.31）。
# - 英語文學習表現代碼（1-Ⅱ-4、1-Ⅱ-6、2-Ⅱ-2、2-Ⅲ-10）只寫在正文與來源，不放進 curriculum_108，也不加進 taxonomy：taxonomy 的代碼表跨科共用，國語文課綱有同號代碼（如 1-Ⅱ-4、2-Ⅱ-2），內容不同；目前 taxonomy 還沒收這兩個國語文代碼，但日後收錄就會衝突（代碼表以代碼為唯一鍵）。
# - 日文兒歌標為本站建議（總綱表 3：第二外國語文只列在高級中等學校選修）；「10 分鐘」「30 秒」標為示意。
# - 複審建議：verify_notes 寫明同號代碼（如 1-Ⅱ-4、2-Ⅱ-2）會衝突的原因（代碼表以代碼為唯一鍵）。
