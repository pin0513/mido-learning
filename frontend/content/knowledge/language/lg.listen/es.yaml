idea: 學一種語言，先大量聽、跟著念，耳朵熟了，嘴巴才跟得上。先求敢說，不求一次說對。
guiding_questions:
- 小嬰兒沒學過文法，為什麼也學會說話？
scenario: 親子共學：全家選一首英文和一首日文兒歌，每天聽三次，第三天開始一起跟唱，錄下來和第一天比較。
goal: 先大量聽、跟著模仿，再開口說。
review: 一週內每天聽 10 分鐘外語兒歌或故事並跟著念；週末孩子模仿一段 30 秒的錄音，家長聽得出語調和節奏相近。
