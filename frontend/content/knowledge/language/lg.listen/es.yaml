why:
  heading: 先聽到，才模仿得像
  body:
  - 英語文課綱說，國小的教材和活動「重視聽、說能力的培養」，要引領學生接觸「童謠、歌曲、節奏韻文、簡易故事、卡通等，以訓練學生聽與說的能力」。
  - 國小英語從三年級開始。三、四年級的學習表現包括「能聽辨句子的語調」（1-Ⅱ-4）、「能聽辨句子的節奏」（1-Ⅱ-6）、「能唸出英語的語音」（2-Ⅱ-2）；國語文課綱也說，聆聽和口語表達結合時「宜注意先聆聽後口語表達」。
  qa:
    question: 學英語，為什麼要先聽、再開口？
    answer: 因為要先聽到正確的聲音，才知道要模仿什麼。英語文課綱說，初學階段老師應給學生「正確範例與真實語言素材讓學生模仿」，用「聆聽、複誦、跟讀、齊聲朗讀」等方法練習，並鼓勵學生「大膽嘗試及不畏犯錯」，不須處處要求精確無誤。
    source: english
  items_title: 英語文課綱的聽說目標
  items:
  - title: 聽辨語調
    text: 三、四年級（英語文 1-Ⅱ-4）：能聽辨句子的語調。
  - title: 聽辨節奏
    text: 三、四年級（英語文 1-Ⅱ-6）：能聽辨句子的節奏。
  - title: 唸出語音
    text: 三、四年級（英語文 2-Ⅱ-2）：能唸出英語的語音。
  - title: 吟唱歌謠
    text: 五、六年級（英語文 2-Ⅲ-10）：能複誦和吟唱簡易的歌謠韻文。
