  - kuoyu
how:
  heading: 聽、跟、唱、錄
  body:
  - 每天固定聽一小段兒歌或故事，先只聽，再跟著念，熟了再一起唱。課綱建議的方法是「聆聽、複誦、跟讀、齊聲朗讀」；初學時「不須處處要求精確無誤」，敢開口比一次說對重要。
  items:
  - title: 先聽
    example: 同一首兒歌聽三遍
    text: 先聽清楚聲音和節奏。
  - title: 跟讀
    example: 聽一句，跟一句
    text: 課綱的「複誦、跟讀」。
  - title: 錄音比一比
    example: 第一天和第三天的錄音
    text: 聽聽語調、節奏有沒有更像（本站建議）。
  checklist_title: 每天練習：
  checklist:
  - 先聽再念
  - 跟讀一句
  - 敢開口
  - 錄音比一比
