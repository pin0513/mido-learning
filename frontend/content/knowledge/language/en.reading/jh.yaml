idea: 讀文章先抓主旨：標題、第一段、每段第一句通常最重要。遇到生字先跳過，從上下文猜。
guiding_questions:
- 不查每個生字，能不能看懂這篇在說什麼？
scenario: 親子共學：挑一篇給青少年的英文短文，只准查三個字，讀完用一句中文說出它在講什麼。
goal: 讀懂路標、菜單、時刻表和短文，找出主旨與細節，達到全民英檢初級閱讀的程度。
review: 家長從全民英檢初級官方練習題選一組閱讀理解（1–2 篇短文或一張菜單、時刻表，配四選一題目），孩子作答並指出答案在原文哪一行，答對 7 成以上。
