# B7 提案：en.reading@jh
# - 補 grades、英語文 3-Ⅳ-12、9-Ⅳ-1、Ae-Ⅳ-8 與 Why/How/What、兩張圖。
# - 全民英檢初級閱讀（詞彙 10、段落填空 8、閱讀理解 12，共 30 題 35 分鐘；每個題組 1 至 2 篇短文）依 LTTC 官網逐字核對。
# - 原 idea「標題、第一段、每段第一句通常最重要」是本站整理的讀法，已標示；「遇到生字先跳過」改引領綱 3-Ⅳ-12「猜測字義」與實施要點「微量生字」。
# - 情境「只准查三個字」與檢核「7 成」標示意；AI 依教育部學生版注意事項。
