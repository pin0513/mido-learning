how:
  heading: 先抓主旨，再找細節
  body:
  - 本站建議：先看標題和每段第一句猜主旨；再讀全文，生字先猜不查；最後回頭找出支持答案的那一行。
  items_title: 本站建議的讀法
  items:
  - title: 看標題
    text: 猜這篇大概在講什麼。
  - title: 看每段第一句
    text: 找出每段的重點。
  - title: 猜生字
    text: 從前後文猜意思，先不查。
  - title: 找出原文
    text: 答案要指得出在哪一行。
  checklist_title: 每讀一篇勾一下
  checklist:
  - 先猜主旨
  - 生字先猜
  - 指出原文
  activity_figure: reading-flow
  notes:
  - 讀法是本站建議。
  sources:
  - english
what:
  heading: 讀懂短文、找出主旨
  body:
  - 學完後，孩子能讀懂短文，找出主旨與細節。全民英檢初級閱讀有詞彙 10 題、段落填空 8 題、閱讀理解 12 題，共 30 題、35 分鐘；閱讀理解每個題組含 1 至 2 篇短文。
  items_title: 學完能做到
  items:
  - title: 說出主旨
    text: 用一句話說出文章在講什麼。
  - title: 找出細節
    text: 指出答案在原文哪一行。
  - title: 猜出生字
    text: 從前後文猜出生字的意思。
  checklist_title: 家長檢核
  checklist:
  - 說出主旨
  - 指出原文
  - 生字先猜
  figures:
  - reading-compare
  notes:
  - 國中對應全民英檢初級是本站建議，不是官方換算。
  - 「只准查三個字」與「7 成」是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網E-BOT），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去。
  sources:
  - gept-elementary
  - genai-student
