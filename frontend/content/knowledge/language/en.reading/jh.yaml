why:
  heading: 不查每個字也讀得懂
  body:
  - 英語文領綱第四學習階段要學生「能熟悉重要的閱讀技巧，如擷取大意、猜測字義、推敲文意、預測後續文意及情節發展等」，並「能綜合相關資訊作合理的猜測」。實施要點鼓勵學生「在有微量『生字』的情況下，仍有信心、能力處理文本的訊息」（p.32）。全民英檢初級閱讀能力還包括閱讀路標、交通標誌、招牌、簡單菜單、時刻表及賀卡等；本點先練短文的主旨與細節。
  qa:
    question: 不查每個生字，能不能看懂這篇在說什麼？
    answer: 可以。先抓標題和每段的重點句，再從前後文猜生字的意思；領綱也要國中生熟悉擷取大意、猜測字義這些閱讀技巧。
    source: english
  items_title: 英語文領綱的學習重點
  items:
  - title: 閱讀技巧
    text: 英語文 3-Ⅳ-12：能熟悉重要的閱讀技巧，如擷取大意、猜測字義、推敲文意、預測後續文意及情節發展等。
    code: 3-IV-12
  - title: 合理猜測
    text: 英語文 9-Ⅳ-1：能綜合相關資訊作合理的猜測。
    code: 9-IV-1
  - title: 短文大意
    text: 英語文 Ae-Ⅳ-8：簡易故事及短文的大意。
    code: Ae-IV-8
  checklist_title: 開始前先確認
  checklist:
  - 選好一篇短文
  - 準備好字典
  sources:
