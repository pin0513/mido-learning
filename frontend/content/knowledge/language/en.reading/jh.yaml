idea: 讀文章先抓主旨：本站整理的讀法是先看標題、第一段和每段第一句。英語文領綱要學生熟悉擷取大意、猜測字義等閱讀技巧；遇到生字先別急著查，從上下文合理猜測。
guiding_questions:
- 不查每個生字，能不能看懂這篇在說什麼？
scenario: 親子共學：挑一篇給青少年的英文短文，只准查三個字（示意），讀完用一句中文說出它在講什麼。
goal: 讀懂短文，找出主旨與細節，達到全民英檢初級閱讀的程度。
review: 家長從全民英檢初級官方練習題選一組閱讀理解（1–2 篇短文，配四選一題目），孩子作答並指出答案在原文哪一行，答對 7 成以上（7 成是示意）。
