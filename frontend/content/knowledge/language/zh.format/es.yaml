# B3 提案：zh.format@es
# - idea「標點也占一格」說得太滿：手冊規定破折號、刪節號「占行中二格」（p.12、13），已改寫。
# - 「段首空兩格」「句號、逗號不放行首」在教育部手冊與課綱都找不到明文，標為本站建議（常見稿紙寫法），列入待核對。手冊只寫「原則上單一句號不成行」（p.2），以及夾注號、書名號乙式前半不在行末、後半不在行首（p.9、14）。
# - 補上 grades [1,2,3,4]、6-I-1、6-II-1、Ac-I-1、Be-I-2。
# - 待核對補證：W3C《中文排版需求》寫明中文出版品段首縮排兩字、點號不出現在行首，也寫明港台沒有相應規範；補為來源 clreq。稿紙沿用這兩個排版習慣、行首標點和上一行最後一字同格，仍標本站建議；to_verify 改為 false。
