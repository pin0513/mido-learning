verify_notes:
- 教育部《重訂標點符號手冊》與國語文課綱都沒有「段首空兩格」「句號、逗號不放行首」的明文；手冊只寫「原則上單一句號不成行」（p.2），以及夾注號、書名號乙式「前半不出現在一行之末，後半不出現在一行之首」（p.9、14）。
- 已補出處：W3C《中文排版需求》§6.2.1.1 寫「中文出版品上，段首縮排以兩個漢字的空間為標準。」；§6.1.1 基礎級寫點號（頓號、逗號、句號、冒號、分號、嘆號、問號）「不能出現在一行的開頭」，同節也說「在港台，雖未有相應的規範，但多數出版品皆以此處所述規則對標點符號進行配置。」（2026-10-30 讀取）
- 仍是本站建議：把這兩個出版排版習慣用在稿紙上，以及行首標點和上一行最後一個字寫在同一格的寫法。W3C 同份文件 §6.1.3 說港台橫排「不做行尾懸掛配置」，所以同格寫法不能算它的規定；學校老師如果有規定，以老師為準。
