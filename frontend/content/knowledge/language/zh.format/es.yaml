to_verify: false
verify_notes:
- 段首空兩格的出處是歷史出處：1919 年〈請頒行新式標點符號議案（修正案）〉附則（丙）「每段開端，必須低兩格。」，這份議案曾由教育部在民國 9 年 2 月以訓令第 53 號公布（維基文庫錄文，2026-10-31 讀取）。現行《重訂標點符號手冊》與國語文課綱沒有寫到段首空格，所以頁面寫成常見做法。
- 行首只引《重訂標點符號手冊》原句：句號附注「原則上單一句號不成行。」（p.2）；夾注號「前半不出現在一行之末，後半不出現在一行之首。」（p.9）。手冊沒有寫逗號等其他點號能不能放行首，也沒有寫行首標點和上一行最後一個字同格的寫法；這兩點是本站整理。
- 留言條和卡片依序寫稱呼、內容、署名、日期，沒有找到出處，是本站整理；課綱 Be-I-2 只寫「以書信、卡片等慣用語彙及書寫格式為主」。
- W3C《中文排版需求》談的是出版與數位排版，不是手寫稿紙，已從來源拿掉。頁面也加註「實際格式以老師／課本為準」。
