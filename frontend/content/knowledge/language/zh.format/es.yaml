what:
  heading: 標點在稿紙上占幾格
  figures:
  - what-compare
  notes:
  - 夾注號（　）和書名號乙式《　》〈　〉：前半不寫在一行的最後，後半不寫在一行的開頭（手冊 p.9、14）。
  - W3C《中文排版需求》：中文出版品「段首縮排以兩個漢字的空間為標準」；點號「不能出現在一行的開頭」。它也說「在港台，雖未有相應的規範」，多數出版品照這些規則排。
  - 「200 字」是示意的練習份量。
  sources:
  - punct
  - clreq
