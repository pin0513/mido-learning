why:
  heading: 格式讓人一眼看懂
  body:
  - 整齊的格式讓讀的人一眼看出哪裡是新的一段、哪裡停頓。國中教育會考的寫作評分，就把「錯別字、格式與標點符號」列為四個向度之一。
  - 課綱的寫作教學要孩子「恰當運用詞彙、文法修辭與標點符號」；一、二年級寫卡片、書信，也要學「慣用語彙及書寫格式」。
  qa:
    question: 句號剛好落在新的一行第一格，要怎麼寫？
    answer: 手冊只規定「原則上單一句號不成行」，也就是不要讓一個句號自己占一行。中文書刊排版也不讓句號、逗號出現在行首（見下方說明）。寫稿紙時，本站建議把它和上一行最後一個字寫在同一格裡；教育部手冊沒有明文，學校老師如果有規定，以老師為準。
    source: punct
  items_title: 格式和這些能力有關
  items:
  - title: 使用常用標點
    text: 一、二年級：根據表達需要，使用常用標點符號。
    code: 6-I-1
  - title: 卡片書信格式
    text: 一、二年級學習內容：在人際溝通方面，以書信、卡片等慣用語彙及書寫格式為主。
    code: Be-I-2
  - title: 使用各種標點
    text: 三、四年級：根據表達需要，使用各種標點符號。
    code: 6-II-1
  sources:
  - cap-writing
  - kuoyu
  - punct
how:
  heading: 先數格子，再下筆
  body:
  - 抄寫前先想：這一段從哪一格開始、標點會不會落在行首。下面有些是手冊的規定，有些是把書刊排版習慣用在稿紙上（本站建議），分開標出來。
  items:
  - title: 段首空兩格
    example: □□今天下午……
    text: 書刊排版以縮排兩字為標準；用在稿紙是本站建議。
  - title: 一般標點占一格
    example: 句號寫在格子正中
    text: 手冊：句號、逗號等「占一個字的位置，居正中」。
  - title: 破折號刪節號兩格
    example: ——　……
    text: 手冊：破折號、刪節號「占行中二格」。
  - title: 句號不單獨成行
    text: 手冊：原則上單一句號不成行；不放行首是書刊排版習慣。
  checklist_title: 交稿前看三件事：
  checklist:
  - 段首空兩格
  - 標點占對格子
  - 行首沒有逗句號
