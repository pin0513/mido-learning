idea: 每段開頭空兩格；標點也占一格；句號、逗號等不放在一行的第一格，就寫在上一行最後一格裡。留言條和卡片也有固定的位置：稱呼、內容、署名、日期。
guiding_questions:
- 句號剛好落在新的一行第一格，要怎麼寫？
scenario: 親子共學：複習版：拿一張 300 字稿紙抄一段課文，數數看有幾處標點差點落在行首，看你怎麼處理。
goal: 在稿紙上寫一段話：段首空兩格，標點不落在行首。
review: 抄寫 200 字課文到稿紙，家長檢查三件事：段首空兩格、每個標點都占一格、沒有標點在行首，全部做到才打勾。
