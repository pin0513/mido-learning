# B3 提案：zh.format@es
# - idea「標點也占一格」說得太滿：手冊規定破折號、刪節號「占行中二格」（p.12、13），已改寫。
# - 「段首空兩格」「句號、逗號不放行首」在教育部手冊與課綱都找不到明文，標為本站建議（常見稿紙寫法），列入待核對。手冊只寫「原則上單一句號不成行」（p.2），以及夾注號、書名號乙式前半不在行末、後半不在行首（p.9、14）。
# - 補上 grades [1,2,3,4]、6-I-1、6-II-1、Ac-I-1、Be-I-2。
# - 待核對補證：W3C《中文排版需求》寫明中文出版品段首縮排兩字、點號不出現在行首，也寫明港台沒有相應規範；補為來源 clreq。稿紙沿用這兩個排版習慣、行首標點和上一行最後一字同格，仍標本站建議；to_verify 改為 false。
# - PM 審查：clreq 談的是出版與數位排版，又說港台沒有相應規範、台港報刊常「完全不處理」行首禁則，撐不起稿紙規定；to_verify 改回 true。QA 與 How 的行首說法改成「多數出版品」，「基礎級」改為原文「基本處理」。
# - PM 決定（方案 A）：段首空兩格改引歷史出處〈請頒行新式標點符號議案（修正案）〉（1919，教育部民國 9 年訓令第 53 號公布）「每段開端，必須低兩格」，寫成常見做法；行首只引手冊原句（p.2、p.9），不延伸到逗號；同格寫法、留言條順序標本站整理；加「實際格式以老師／課本為準」；拿掉 clreq 與「多數出版品」；自己的文字不用官方口吻的字眼。to_verify 改為 false。
