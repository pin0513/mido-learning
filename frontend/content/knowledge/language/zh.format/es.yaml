- 句號剛好落在新的一行第一格，要怎麼寫？
scenario: 親子共學：複習版：拿一張 300 字稿紙抄一段課文，數數看有幾處標點差點落在行首，看你怎麼處理。
goal: 在稿紙上寫一段話：段首空兩格（本站建議），標點占對格子，句號、逗號不落在行首（本站建議）。
review: 抄寫 200 字（示意）課文到稿紙，家長檢查三件事：段首空兩格（本站建議）、標點占對格子（破折號、刪節號占兩格）、沒有句號或逗號在行首（本站建議），全部做到才打勾。
