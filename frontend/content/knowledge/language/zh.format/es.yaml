idea: 在稿紙上，每個字和大多數標點各占一格，但破折號、刪節號占兩格（教育部手冊）。每段開頭空兩格是常見做法，歷史出處是 1919 年新式標點議案的「每段開端，必須低兩格」。手冊寫「原則上單一句號不成行」；逗號等其他標點也不放在行首，是本站整理的常見做法。留言條和卡片常見的寫法是依序寫稱呼、內容、署名、日期（本站整理）。實際格式以老師／課本為準。
guiding_questions:
- 句號剛好落在新的一行第一格，要怎麼寫？
scenario: 親子共學：複習版：拿一張 300 字稿紙抄一段課文，數數看有幾處標點差點落在行首，看你怎麼處理。
goal: 在稿紙上寫一段話：段首空兩格（常見做法），標點占對格子，句號、逗號不落在行首（本站整理）。
review: 抄寫 200 字（示意）課文到稿紙，家長檢查三件事：段首空兩格（常見做法）、標點占對格子（破折號、刪節號占兩格）、沒有句號或逗號在行首（本站整理），全部做到才打勾。
