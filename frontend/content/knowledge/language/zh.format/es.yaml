why:
  heading: 格式讓人一眼看懂
  body:
  - 整齊的格式讓讀的人一眼看出哪裡是新的一段、哪裡停頓。國中教育會考的寫作評分，就把「錯別字、格式與標點符號」列為四個向度之一。
  - 課綱的寫作教學要孩子「恰當運用詞彙、文法修辭與標點符號」；一、二年級寫卡片、書信，也要學「慣用語彙及書寫格式」。
  qa:
    question: 句號剛好落在新的一行第一格，要怎麼寫？
    answer: 手冊寫「原則上單一句號不成行」，也就是不要讓一個句號自己占一行。手冊沒有寫句號落在行首時怎麼處理；常見做法是把它和上一行最後一個字寫在同一格裡（本站整理）。實際格式以老師／課本為準。
    source: punct
  items_title: 格式和這些能力有關
  items:
  - title: 使用常用標點
    text: 一、二年級：根據表達需要，使用常用標點符號。
    code: 6-I-1
  - title: 卡片書信格式
    text: 一、二年級學習內容：在人際溝通方面，以書信、卡片等慣用語彙及書寫格式為主。
    code: Be-I-2
  - title: 使用各種標點
    text: 三、四年級：根據表達需要，使用各種標點符號。
    code: 6-II-1
  sources:
  - cap-writing
  - kuoyu
  - punct
how:
  heading: 先數格子，再下筆
  body:
  - 抄寫前先想：這一段從哪一格開始、標點會不會落在行首。下面分開標出手冊原句、歷史出處和本站整理的常見做法；實際格式以老師／課本為準。
  items:
  - title: 段首空兩格
    example: □□今天下午……
    text: 常見做法；歷史出處是 1919 年新式標點議案「每段開端，必須低兩格」。
  - title: 一般標點占一格
    example: 句號寫在格子正中
    text: 手冊：句號、逗號等「占一個字的位置，居正中」。
  - title: 破折號刪節號兩格
    example: ——　……
    text: 手冊：破折號、刪節號「占行中二格」。
  - title: 句號不單獨成行
    text: 手冊：「原則上單一句號不成行。」
  checklist_title: 交稿前看三件事（常見做法）：
  checklist:
  - 段首空兩格
  - 標點占對格子
  - 行首沒有逗句號
