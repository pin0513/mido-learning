what:
  heading: 標點在稿紙上占幾格
  figures:
  - what-compare
  notes:
  - 夾注號（　）和書名號乙式《　》〈　〉：前半不寫在一行的最後，後半不寫在一行的開頭（手冊 p.9、14）。
  - 段首空兩格的歷史出處：1919 年〈請頒行新式標點符號議案（修正案）〉附則寫「每段開端，必須低兩格。」，教育部在民國 9 年 2 月以訓令第 53 號公布；現行手冊沒有寫到段首空格。
  - 「200 字」是示意的練習份量。
  - 實際格式以老師／課本為準。
