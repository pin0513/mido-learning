idea: 在稿紙上，每個字和大多數標點各占一格，但破折號、刪節號占兩格。中文書刊排版習慣每段開頭縮排兩字、句號和逗號不出現在行首；寫稿紙也照這兩個習慣，是本站建議。留言條和卡片常見的寫法是依序寫稱呼、內容、署名、日期（本站整理）。
