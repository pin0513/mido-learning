why:
  heading: 同一件事，標題不同
  body:
  - 國語文核心素養國 S-U-B2 要高中生「善用科技、資訊與各類媒體所提供的素材，進行閱讀思考，整合資訊，激發省思及批判媒體倫理與社會議題的能力」。
  - 教育部媒體素養白皮書希望大眾「穿透媒體與資訊表象，深入媒體與資訊產製目的與可能影響」，並把「分析」能力寫成「運用思辨能力分析、評估媒體及資訊品質與內涵觀點」。
  qa:
    question: 同一件事，兩家媒體的標題為什麼差那麼多？
    answer: 因為產製的人、目的和想給誰看不一樣，挑的字、圖和證據也就不同。白皮書要我們「深入媒體與資訊產製目的與可能影響」：先問誰寫的、為了什麼，再看證據，最後找一找哪些人的說法沒有出現。
    source: moe-medialit
  items_title: 高中課綱的閱讀目標
  items:
  - title: 歸納不同論點
    text: 國語文 5-Ⅴ-2：歸納文本中不同論點，形成個人的觀點，發展系統性思考以建立論述體系。
    code: 5-V-2
  - title: 文本與社會議題
    text: 國語文 5-Ⅴ-3：大量閱讀多元文本，探討文本如何反應文化與社會現象中的議題，以拓展閱讀視野與生命意境。
    code: 5-V-3
  sources:
  - kuoyu
  - moe-medialit
how:
  heading: 四格表：四個問題
  body:
  - 同一事件找兩則報導或貼文，每則填一張四格表，最後比較哪一則比較可信、為什麼。四個問題是本站整理。
  items_title: 四格表（本站整理）
  items:
  - title: 誰寫的
    text: 作者、媒體或帳號是誰？
  - title: 為了什麼
    text: 想讓誰看？用了哪些字和圖引導你？
  - title: 證據在哪
    text: 點開原始來源，看證據能不能查到。
  - title: 少了誰的聲音
    text: 哪些相關的人的說法沒有出現？
  checklist_title: 每一則都要：
  checklist:
  - 找到作者
  - 說出目的
  - 點開證據
  - 找缺席的人
  activity_figure: how-flow
  sources:
  - moe-medialit
