idea: 媒體文本都有作者和目的。讀的時候追問四件事（本站整理）：誰寫的、為了什麼（包括用了哪些字和圖引導）、證據在哪、少了誰的聲音。教育部媒體素養白皮書把「分辨事實與意見之能力」「評估論據合理性之能力」列為分析能力。
guiding_questions:
- 同一件事，兩家媒體的標題為什麼差那麼多？
scenario: 親子共學：挑同一事件的兩則報導，全家各負責一格四格表，最後一起決定哪一則比較可信、為什麼。
goal: 讀一則新聞或貼文時問四件事：誰寫的、為了什麼、證據在哪、少了誰的聲音。
review: 孩子挑一則熱門貼文或新聞，填一張四格表（作者、目的、證據、缺少的觀點）並附原始來源連結；家長點開連結確認來源存在。
