why:
  heading: 讀的人不在你身邊
  body:
  - 《重編國語辭典》說，便條是「內容為簡單事項的非正式簡便紙條」。寫的人不在旁邊，讀的人沒辦法問，所以要一次寫清楚。
  - 課綱一、二年級學「書信、卡片等慣用語彙及書寫格式」，三、四年級再加上「便條、啟事」。
  qa:
    question: 留言給媽媽說去同學家，要寫哪些事她才不擔心？
    answer: 寫清楚：寫給誰（媽媽）、什麼事（去哪位同學家、在哪裡）、什麼時候回來、怎麼聯絡，最後署名（讓媽媽知道是誰留的）並寫下時間。媽媽讀一次就知道你在哪、何時回家。另外，出門前最好先得到家人同意，不是只留一張紙條（本站建議）。
    source: dict-biantiao
  items_title: 課綱的應用文學習
  items:
  - title: 書信、卡片
    text: 一、二年級學習內容：在人際溝通方面，以書信、卡片等慣用語彙及書寫格式為主。
    code: Be-I-2
  - title: 便條、啟事
    text: 三、四年級學習內容：在人際溝通方面，以書信、卡片、便條、啟事等慣用語彙及書寫格式為主。
    code: Be-II-2
  - title: 書寫應用作品
    text: 三、四年級：書寫記敘、應用、說明事物的作品。
    code: 6-II-4
  sources:
  - dict-biantiao
  - kuoyu
how:
  heading: 先想讀的人要知道什麼
  body:
  - 寫之前先問：讀的人會擔心什麼、需要做什麼？把答案寫成短句，最後署名、寫上時間。寫完唸一遍，想像自己是讀的人，看看還缺什麼。（方法是本站建議。）
  items:
  - title: 留言條
    example: 媽媽：我去小華家寫功課，五點前回家。小明 3:30
    text: 例句是本站自編。
  - title: 感謝卡
    example: 小美：謝謝你借我雨傘，我才沒淋溼。
    text: 說出謝什麼、為什麼。
  checklist_title: 五項都寫了嗎：
  checklist:
  - 寫給誰
  - 什麼事
  - 時間
  - 地點
  - 署名（誰留的）
