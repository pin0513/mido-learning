idea: 寫給別人看的字，要先想讀的人需要知道什麼：誰、什麼事、什麼時候、在哪裡，最後署名。
guiding_questions:
- 留言給媽媽說去同學家，要寫哪些事她才不擔心？
scenario: 親子共學：孩子寫一張真的要用的留言條或感謝卡，家長只看「讀完知不知道該怎麼做」。
goal: 寫一張讓讀的人知道該怎麼做的留言條或卡片：誰、什麼事、時間、地點、署名。
review: 孩子寫一張真的要用的留言條，家長只讀一次就知道要做什麼，五項都齊才打勾。
