sources:
- id: yoron-h28
  title: 平成28年度「国語に関する世論調査」の結果の概要
  publisher: 文化庁（文化部国語課）
  url: https://www.bunka.go.jp/tokei_hakusho_shuppan/tokeichosa/kokugo_yoronchosa/pdf/h28_chosa_kekka.pdf
  accessed: '2026-10-29'
  kind: government
  supports: 問３ 標題「―『(a)言葉に表して伝え合うこと』が約５割，『(b)察し合って心を通わせること』が約３割―」；選項「(a)互いの考えていることをできるだけ言葉に表して伝え合うこと」50.1％、「(b)考えていることを全部は言わなくても，互いに察し合って心を通わせること」30.3％，(a) 比平成20年度增加 12 ポイント；調查對象全國 16 歳以上の男女，平成 29 年２月～３月個別面接調查，有效回答 2,015 人（56.5％）
- id: jfs
  title: JF日本語教育スタンダード 2010（第二版）
  publisher: 国際交流基金（The Japan Foundation）
  url: https://www.jfstandard.jpf.go.jp/pdf/web_whole.pdf
  accessed: '2026-10-29'
  kind: reference
  supports: 「これによって、学習者は複合的な視野を得て、自文化を相対化して新しい視点を持つことができるようになります。その際に求められる能力を『異文化理解能力』と呼びます。」；「『スタンダード』は言語教育環境をデザインする際の枠組みや目安を提供するものであって、拘束力があるものではないということです。」
- id: jlpt-levels
  title: N1～N5：認定の目安
  publisher: 日本語能力試験 JLPT（国際交流基金・日本国際教育支援協会）
  url: https://www.jlpt.jp/about/levelsummary.html
  accessed: '2026-10-29'
  kind: exam
  supports: N2「日常的な場面で使われる日本語の理解に加え、より幅広い場面で使われる日本語をある程度理解することができる」；N2 聞く「日常的な場面に加えて幅広い場面で、自然に近いスピードの、まとまりのある会話やニュースを聞いて、話の流れや内容、登場人物の関係を理解したり、要旨を把握したりすることができる。」；N1「幅広い場面で使われる日本語を理解することができる」
- id: ethics-epaper13
  title: 大學校園因應生成式AI之指引及教學建議（學術倫理電子報第 13 期）
  publisher: 教育部臺灣學術倫理教育資源中心（2023 年 8 月）
  url: https://ethics.moe.edu.tw/resource/epaper/html/21/
  accessed: '2026-10-29'
  kind: reference
  supports: （五）學術寫作的自我揭露：「目前學術界對於使用生成式AI是否需要標註，尚無統一的規定」，「建議研究者應先瞭解經費補助機關（構）或期刊等單位對於生成式AI之政策，並於著作或報告中適度公開相關訊息」；（三）個人資料保護與資通安全：「研究者應留意，不要將個人資訊、未公開文件、機密資料等內容輸入到生成式AI的對話框中，以避免產生個人隱私洩露的問題。」；（二）著作權：「研究者若直接將生成的內容拿來使用，而非親自撰寫或創作，除在法律上不享有著作權保障之外，還可能有代寫的學術倫理問題。」
