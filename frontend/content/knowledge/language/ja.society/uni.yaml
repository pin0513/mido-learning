idea: 日語裡很多說法和社會習慣綁在一起，例如「空気を読む」（察言觀色）。看懂文化脈絡，才聽得懂沒說出口的話。
guiding_questions:
- 日劇裡的「客氣」，背後是什麼社會習慣？
scenario: 親子共學：看一集日劇，記下三個「話沒說完」的場景，討論角色真正想表達什麼。
goal: 從新聞、綜藝或動畫看懂日本社會的習慣與價值觀。
review: 選一部日劇或一則新聞，寫出 2 個「台灣不會這樣做」的地方並查證背景；家人看得出查證來源。
