idea: 日語的很多說法和社會習慣有關，例如「空気を読む」（察言觀色；例子是本站整理）。但印象不等於事實：文化庁平成 28 年度的「国語に関する世論調査」裡，比較重視「言葉に表して伝え合うこと」的有 50.1％，比較重視「察し合って心を通わせること」的是 30.3％。
guiding_questions:
- 日本人真的都不把話說清楚嗎？
scenario: 親子共學：看一集日劇或一則新聞，記下一個「話沒說完」或「說得很直接」的場景，討論角色想表達什麼，再用世論調查等可信資料檢查自己的印象（本站建議）。
goal: 從日劇、新聞的一個場景寫下你對日本社會習慣的印象，並用可信的調查資料檢查這個印象。
review: 選一部日劇或一則新聞，寫出 2 個「和台灣不一樣」的印象，各找一個可信來源（例如政府調查）檢查，寫清楚出處；家人看得出每個印象都有查證和出處（2 個是示意）。
