what:
  heading: 用資料檢查文化印象
  body:
  - 學完後，能從日劇或新聞的一個場景寫下對日本社會習慣的印象，找可信的調查資料檢查，並寫清楚出處。
  items_title: 學完能做到
  items:
  - title: 寫下印象
    text: 從一個場景寫成一句話。
  - title: 查證印象
    text: 找可信的調查資料。
  - title: 寫清出處
    text: 說明資料來自哪裡。
  checklist_title: 自我檢核
  checklist:
  - 印象寫清楚
  - 有可信來源
  - 出處寫清楚
  figures:
  - society-compare
  notes:
  - 檢核的 2 個是示意。
  - 影視作品只記場景重點，不轉貼台詞或畫面（本站建議）。
  - 用生成式 AI 時，不要把個人資訊、未公開文件、機密資料貼進去（教育部臺灣學術倫理教育資源中心 2023 年的電子報）；不上傳自己或別人的錄音（本站建議）；AI 的輸出要自己查證。同一份電子報也說，學術界對使用生成式 AI 是否需要標註「尚無統一的規定」，建議先了解相關單位的政策；交作業時依課程規定說明用了哪個工具、做了什麼；AI 規定變化快，以學校和課程最新的規定為準（本站建議）。作業要自己寫，不把 AI 生成的內容直接當成自己的作品（本站建議）；同一份電子報還說，直接使用生成內容「可能有代寫的學術倫理問題」。
  sources:
  - yoron-h28
  - ethics-epaper13
