why:
  heading: 印象要用資料檢查
  body:
  - 國際交流基金的 JF 日本語教育スタンダード說，接觸不同的語言和文化，學習者能「自文化を相対化して新しい視点を持つことができるようになります。」這種能力叫「異文化理解能力」。
  - JF スタンダード也說，它提供的是「枠組みや目安」，「拘束力があるものではない」：它是參考框架，不是規定。
  items_title: JF スタンダード的重點
  items:
  - title: 異文化理解能力
    text: 相對化自己的文化，得到新視點
  - title: 不是規定
    text: 參考框架，沒有拘束力
  notes:
  - 本站建議：把本點放在大學階段、對應 JLPT N2 到 N1 是本站建議，不是官方換算。JLPT 官網寫 N2 是「日常的な場面で使われる日本語の理解に加え、より幅広い場面で使われる日本語をある程度理解することができる」，N1 是「幅広い場面で使われる日本語を理解することができる」。
  sources:
  - jfs
  - jlpt-levels
how:
  heading: 記場景、寫印象、查資料
  body:
  - 本站建議的三步：①記下場景：誰對誰說、說了什麼（只記重點，不抄整段台詞）；②把自己的印象寫成一句話，例如「日本人不把話說清楚」，也寫下它和台灣的習慣哪裡不一樣；③找可信資料檢查，例如文化庁的世論調查，看印象是不是以偏概全，再修正，並寫下出處（發布機構、調查名稱、年度）。印象和查證紀錄自己寫；AI 只幫忙找資料線索，找到的資料要回原始出處核對（本站建議）。
  - 例子：文化庁平成 28 年度世論調查問３的標題是「『(a)言葉に表して伝え合うこと』が約５割，『(b)察し合って心を通わせること』が約３割」；和平成 20 年度比，(a) 增加 12 個百分點。調查對象是全國 16 歲以上，有效回答 2,015 人。
  qa:
    question: 日本人真的都不把話說清楚嗎？
    answer: 不能這樣概括。平成 28 年度世論調查中，選「(a)互いの考えていることをできるだけ言葉に表して伝え合うこと」的有 50.1％，多於選「察し合って心を通わせること」的 30.3％。一個場景不能代表全體。
    source: yoron-h28
  items_title: 本站建議的步驟
  items:
  - title: 記場景
    text: 誰對誰、說了什麼（不抄台詞）
  - title: 寫印象
    text: 把印象寫成一句話
  - title: 查資料
    text: 用政府調查等可信來源
  - title: 修正印象
    text: 看是否以偏概全
  checklist_title: 每次練完勾一下
  checklist:
  - 記下場景
  - 寫下印象
  - 找到可信來源
  - 寫清楚出處
  activity_figure: society-flow
