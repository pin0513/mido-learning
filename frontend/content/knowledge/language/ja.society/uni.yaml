# - 補 Why/How/What、兩張圖；大學不列 108 課綱代碼。
# - 錯誤修正：原標題「社會與流行文化」承諾流行文化，但 How 教的是用資料檢查對日本社會習慣的印象，改成「讀懂日本：從語言看社會習慣」；原 guiding question 問日劇的「客氣」，答案沒有出處，改成可用文化庁世論調查回答的「日本人真的都不把話說清楚嗎」；不抄日劇台詞；數量標示意；JF スタンダード是參考框架，註明沒有拘束力。
