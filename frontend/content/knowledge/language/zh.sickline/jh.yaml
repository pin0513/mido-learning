idea: 常見病句可以先分四種（本站整理）：少了主語（透過……使我……）、贅字（大約……左右）、語序顛倒（讀了三遍很仔細）、搭配不當（穿著……帽子）。改法是把句子縮成「誰＋做什麼」，再看哪裡不通。會考寫作評分規準四級分的描述就有「有時會出現冗詞贅句」。
guiding_questions:
- 「透過這次活動，使我學到很多。」少了什麼？
scenario: 親子共學：複習版：從新聞或公告裡找 3 個病句，親子各改一版，比較誰改得最短又最清楚。
goal: 找出並改好四種常見病句：缺主語、贅字、語序、搭配不當。
review: 家長從新聞或公告挑 5 句病句，孩子各改一版並說出是哪一種毛病，改得通順且不改原意的至少 4 句（示意）。
