why:
  heading: 病句會讓讀者卡住
  body:
  - 國語文課綱的學習內容有「文句表達的邏輯與意義」；寫作要經過「修改潤飾」。
  - 會考寫作評分規準的「遣詞造句」向度，六級分是「能精確使用語詞，並有效運用各種句型使文句流暢」，四級分是「能正確使用語詞，文意表達尚稱清楚，但有時會出現冗詞贅句；句型較無變化」。
  qa:
    question: 「透過這次活動，使我學到很多。」少了什麼？
    answer: 少了主語。「透過這次活動」只是說明方式，後面「使我學到很多」沒有說是「誰」使我學到。可以改成「這次活動使我學到很多。」或「透過這次活動，我學到很多。」（本站整理）
    source: kuoyu
  items_title: 國中課綱怎麼說
  items:
  - title: 文句的邏輯與意義
    text: 國語文 Ac-Ⅳ-3：文句表達的邏輯與意義。
    code: Ac-IV-3
  - title: 修改潤飾
    text: 國語文 6-Ⅳ-2：依據審題、立意、取材、組織、遣詞造句、修改潤飾，寫出結構完整、主旨明確、文辭優美的文章。
    code: 6-IV-2
  sources:
  - kuoyu
  - cap-rubric
how:
  heading: 縮成「誰＋做什麼」
  body:
  - 把修飾語先拿掉，只留下「誰＋做什麼（＋什麼）」，再一個一個加回去，看哪裡不通（本站整理的方法）。改完唸一遍，確認沒有改掉原來的意思。
  items:
  - title: 缺主語
    text: 說明方式的片語後面，要有「誰」做這件事。
    example: 透過這次活動，我學到很多。
  - title: 贅字
    text: 「左右」已經表示約略之數，前面不必再加「大約」。
    example: 大約三十人左右 → 三十人左右
  - title: 語序
    text: 修飾語要放在被修飾的詞旁邊（本站整理）。
    example: 這本書我讀了三遍很仔細 → 這本書我很仔細地讀了三遍
  - title: 搭配不當
    text: 動詞和後面的詞要配得上（本站整理）。
    example: 穿著紅上衣和帽子 → 穿著紅上衣、戴著帽子
  checklist_title: 改一句病句：
  checklist:
  - 拿掉修飾語
  - 找出誰做什麼
  - 加回去檢查
  - 唸一遍
