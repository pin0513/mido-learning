idea: 美國共同核心標準（Common Core ELA）把文學（故事、戲劇、詩）和資訊文本（歷史、社會、科學、技術）分開列，三到五年級各有要讀懂的難度。分章的小說叫 chapter book：故事分成幾章，不像圖畫書那樣圖多字少。本站建議台灣國中生讀這個程度的書做廣泛閱讀。
guiding_questions:
- 美國小學生讀的英文書，你讀得懂幾成？
scenario: 親子共學：親子共讀一本章節書，每天一章（示意），孩子讀給大人聽，大人負責問「接下來會怎樣」。
goal: 讀完一本美國小學三到五年級程度的分章小說，和一篇同程度的知識短文。
review: 孩子讀完一本 3–5 年級程度的章節書，每章寫一句英文摘要；家長抽 2 章請孩子用中文說出發生了什麼，再讀一篇同程度的科學或歷史短文，說出 3 個事實（2 章、3 個是示意）。
