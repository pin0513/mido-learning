- id: english
  title: 十二年國民基本教育課程綱要 國民中小學暨普通型高級中等學校—語文領域－英語文
  publisher: 國家教育研究院（教育部 107 年 4 月 16 日發布）
  url: https://stv.naer.edu.tw/data/course_outline/pta_18518_3555074_59836.pdf
  accessed: '2026-10-29'
  kind: curriculum
  supports: 學習重點：3-Ⅳ-14「能快速閱讀了解文章重點，並有效應用於廣泛閱讀中。」（p.11）；3-Ⅳ-16「能閱讀不同體裁、不同主題的簡易文章。」（p.11）；5-Ⅳ-10「能讀懂簡易故事及短文，並能以簡短的句子說出或寫出其內容大意。」（p.13）；Ae-Ⅳ-6「簡易故事的背景、人物、事件和結局。」（p.18）；Ae-Ⅳ-8「簡易故事及短文的大意。」（p.18）；教學要領（二）「閱讀教學應該突破字彙量的框架與箝制，適度選取稍微超出學生現有字彙量的文本」（p.32）；編碼說明「Ⅱ代表第二學習階段（國民小學 3-4 年級），Ⅲ代表第三學習階段（國民小學 5-6 年級），Ⅳ代表第四學習階段（國民中學 7-9 年級）」（p.8）；時間分配：英語文必修國小三、四年級每週 1 節，五、六年級每週 2 節，國中每週 3 節（p.4）
- id: ccss-ela
  title: Common Core State Standards for English Language Arts & Literacy in History/Social Studies, Science, and Technical Subjects
  publisher: National Governors Association Center for Best Practices、Council of Chief State School Officers（Common Core State Standards Initiative）
  url: https://corestandards.org/wp-content/uploads/2023/09/ELA_Standards1.pdf
  accessed: '2026-10-29'
  kind: reference
  supports: RL.3.10、RL.4.10、RL.5.10（PDF p.12）：「read and comprehend literature, including stories, dramas, and poetry」，3 年級為 the grades 2–3 text complexity band 高端、5 年級為 the grades 4–5 text complexity band 高端；RI.3.10、RI.4.10、RI.5.10（PDF p.14）：「read and comprehend informational texts, including history/social studies, science, and technical texts」；RL.4.10、RI.4.10 的 4 年級要求：「in the grades 4–5 text complexity band proficiently, with scaffolding as needed at the high end of the range」
