why:
  heading: 讀整本書，練廣泛閱讀
  body:
  - 英語文領綱第四學習階段要學生「能閱讀不同體裁、不同主題的簡易文章」，「能快速閱讀了解文章重點，並有效應用於廣泛閱讀中」，並能讀懂故事後「以簡短的句子說出或寫出其內容大意」。實施要點也鼓勵「適度選取稍微超出學生現有字彙量的文本」（p.32）。美國小學三到五年級的章節書和知識短文，正好是不同體裁、不同主題的練習材料。
  qa:
    question: 美國小學生讀的英文書，你讀得懂幾成？
    answer: 試讀一章就知道：說得出誰、在哪裡、發生什麼事，就讀得懂大意。共同核心標準要美國四、五年級學生讀懂 4–5 年級難度帶的文學和資訊文本，台灣國中生可以從這個程度開始試（本站建議）。
    source: ccss-ela
  items_title: 英語文領綱的學習重點
  items:
  - title: 不同體裁
    text: 英語文 3-Ⅳ-16：能閱讀不同體裁、不同主題的簡易文章。
    code: 3-IV-16
  - title: 廣泛閱讀
    text: 英語文 3-Ⅳ-14：能快速閱讀了解文章重點，並有效應用於廣泛閱讀中。
    code: 3-IV-14
  - title: 說出大意
    text: 英語文 5-Ⅳ-10：能讀懂簡易故事及短文，並能以簡短的句子說出或寫出其內容大意。
    code: 5-IV-10
  - title: 故事四要素
    text: 英語文 Ae-Ⅳ-6：簡易故事的背景、人物、事件和結局。
    code: Ae-IV-6
  checklist_title: 開始前先確認
  checklist:
  - 選好一本章節書
  - 選好一篇知識文
  sources:
  - english
  - ccss-ela
how:
  heading: 一天一章，一章一句
  body:
  - 本站建議：每天讀一章，讀完用一句英文寫這章發生什麼；遇到生字先猜，不必每個都查。知識短文則找出 3 個事實。故事要抓背景、人物、事件和結局（領綱 Ae-Ⅳ-6）。
  items_title: 本站建議的讀法
  items:
  - title: 讀一章
    text: 孩子讀給大人聽，或自己默讀。
  - title: 寫一句摘要
    text: 用一句英文寫這章發生什麼。
  - title: 抓故事四要素
    text: 背景、人物、事件、結局。
  - title: 讀知識短文
    text: 找出 3 個事實。
  checklist_title: 每天讀完勾一下
  checklist:
  - 讀了一章
  - 寫了一句摘要
  - 猜了生字
  activity_figure: chapter-flow
  notes:
  - 每天一章、一句摘要是本站建議；這裡不指定書目。
  sources:
  - english
what:
  heading: 讀完一本章節書和知識文
  body:
  - 學完後，孩子能自己讀完一本分章的小說，說出背景、人物、事件和結局，也能從一篇同程度的知識短文裡找出事實。
  items_title: 學完能做到
  items:
  - title: 讀完整本
    text: 讀完一本 3–5 年級程度的章節書。
  - title: 寫出摘要
    text: 每章用一句英文寫大意。
  - title: 找出事實
    text: 從知識短文找出事實。
  checklist_title: 家長檢核
  checklist:
  - 每章有摘要
  - 說得出情節
  - 找得到事實
  figures:
  - chapter-compare
  notes:
  - 檢核用的 2 章、3 個事實是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網E-BOT），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去。
  sources:
  - english
  - camb-chapterbook
  - genai-student
