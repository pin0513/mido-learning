idea: 美國小學到了三到五年級，開始讀分章的小說（chapter books），也讀科學、歷史的知識短文。美國的共同核心州立標準（Common Core ELA）把文學與資訊文本並列。台灣國中生讀這個程度的書，生字多但句子短，最適合大量閱讀。
guiding_questions:
- 美國小學生讀的英文書，你讀得懂幾成？
scenario: 親子共學：親子共讀一本章節書，每天一章，孩子讀給大人聽，大人負責問「接下來會怎樣」。
goal: 讀完一本美國小學三到五年級程度的分章小說，和一篇同程度的知識短文。
review: 孩子讀完一本 3–5 年級程度的章節書，每章寫一句英文摘要；家長抽 2 章請孩子用中文說出發生了什麼，再讀一篇同程度的科學或歷史短文，說出 3 個事實。
