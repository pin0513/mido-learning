  accessed: '2026-10-29'
  kind: reference
  supports: chapter book：「a book for children with a story that is divided into chapters (= separate parts, usually given a number or a title), rather than a book that has many pictures and a simple story told in few words」
- id: genai-student
  title: 中小學使用「生成式人工智慧」注意事項2.1（學生版）
  publisher: 教育部（中小學數位學習精進方案網站）
  url: https://pads.moe.edu.tw/download_file.php?file=_upload_aba798ab3bb88f11d0c43a7e477fb9c5.pdf
  accessed: '2026-10-29'
  kind: government
  supports: 前言「在家長或學校老師的指導與同意下遵守各工具年齡分級與帳號申請規範」；五「中小學學生使用『生成式人工智慧』工具應遵守各平臺註冊年齡限制及相關規範。建議中小學學生使用為教育目的而設計的『生成式人工智慧』工具，如教育部因材網生成式AI學習夥伴e度、酷英網E-BOT、均一教育平臺或CK-12Flexi等…若為非在校使用，亦請家長陪伴使用。」；六（三）「不可以將自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料…輸入至『生成式人工智慧』工具。」；一「這些工具無法自行判斷結果的正確性和合理性…不宜直接採信」；六（四）「應依規定註明所使用的工具及用途，不得將生成內容直接當作自己原創作品繳交。」
