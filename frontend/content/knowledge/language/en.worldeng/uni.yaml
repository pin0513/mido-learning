idea: 英文有很多口音，美國、英國、澳洲、印度、新加坡都不一樣。CEFR 補充版說，過去把口音當成發音不好、以母語者為目標，對發音教學有害；現在以讓人聽得懂為重點。多益和托福的聽力也收錄不同口音。
guiding_questions:
- 印度、新加坡、英國的英文，聽起來不一樣，哪一種才標準？
scenario: 親子共學：聽五個不同國家的人用英文介紹自己的興趣，記下最難懂和最好懂的，說說為什麼。
goal: 聽懂不同口音的英文，目標是讓人聽懂，不是模仿某一種口音。
review: 聽 5 段不同國家講者的英文（例如美、英、澳、印度、新加坡），每段寫 2 句重點；家人對照逐字稿，至少 4 段的重點正確（5 段、2 句、4 段是示意）。
