# B8 提案：en.worldeng@uni
# - 補 Why/How/What 與兩張圖。錯誤修正：原文說法沒有出處；改依 CEFR 補充版 Phonological control：以「聽得懂」（intelligibility）為主，而不是以接近某一種母語口音為目標。
# - 補上檢定也收不同口音：ETS 多益改版說明加入多種口音，托福聽力會聽到北美、英國、紐西蘭、澳洲口音。
# - 檢核的 5 段、2 句、4 段標示意；大學對應多益、托福標為本站建議（顯示在 notes）。
# - 第一輪獨立審查修正：p.134 的描述標出是 B2；What 的「說得讓人懂」改成「知道說的目標」（How 只教聽）；情境改成介紹自己的興趣；notes 的對應說明改成本點實際用到的口音說明。
# - 第三輪獨立審查修正：goal／What「以讓人聽懂為目標」只在 Why，How 新增第三段（cefr-cv 逐字，how.sources 補 cefr-cv）；情境「五個」補標示意（notes 同步）。
# - 第四輪獨立審查修正：（建議項）How 第一段「托福聽力會聽到」改「可能會聽到」；cefr-cv supports 補 Why items 三個分量表的原文名稱（p.133）。
# - 第五輪獨立審查修正：（建議項）cefr-cv supports 補 p.133「The focus is on how much effort is required from the interlocutor to decode the speaker's message.」（Why items、qa、比較圖的依據）；比較圖「不費力」改「少費力」，貼近原文。 What notes 的 AI 注意事項補「不代寫」（學術倫理電子報（二）著作權「還可能有代寫的學術倫理問題」；是電子報的提醒，不寫成硬規定），ethics-epaper13 supports 補（二）著作權整句（2026-10-29 重抓逐字核對）；How body 補 AI 使用說明（不貼機密、自己查證、自己寫、說明工具），how.sources 加 ethics-epaper13，讓 What 的注意事項在 How 有教到。
# - 第六輪獨立審查修正：（阻擋 R-1）How 的 AI 段落改寫：刪掉和 What notes 重複的電子報引文、合併自我重複的「自己寫／不直接交出去」；不貼個資與未公開文件或機密資料（電子報（三））、輸出自己查證（（一））、內容自己寫（（二））歸給電子報，只有「依課程規定說明用了哪個工具」標本站建議。
