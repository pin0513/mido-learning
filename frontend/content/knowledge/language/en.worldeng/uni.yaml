why:
  heading: 聽得懂比口音重要
  body:
  - CEFR 補充版說「The focus on accent and on accuracy instead of on intelligibility has been detrimental to the development of the teaching of pronunciation.」新的量表裡「Intelligibility has been a key factor in discriminating between levels.」
  - 量表的描述也承認口音會受母語影響，例如 B2 的描述「accent tends to be influenced by the other language(s) they speak, but has little or no effect on intelligibility.」
  qa:
    question: 印度、新加坡、英國的英文，聽起來不一樣，哪一種才標準？
    answer: CEFR 補充版的發音量表不以某一種口音為標準，而是看對方要多費力才聽得懂你。所以重點是說得清楚、讓人聽懂，也要練習聽懂不同的口音（本站整理）。
    source: cefr-cv
  items_title: CEFR 補充版發音量表看三件事
  items:
  - title: 整體發音
    text: 聽的人要多費力才懂。
  - title: 發音清楚
    text: 每個音發得清不清楚。
  - title: 語調重音
    text: 語調、重音和節奏。
  checklist_title: 聽之前先想
  checklist:
  - 講者來自哪裡
  - 要抓什麼重點
  sources:
  - cefr-cv
how:
  heading: 多聽不同口音
  body:
  - ETS 改版多益時說明，舊版聽力「included only standard American accents」，改版加入不同口音，因為考生「are likely to need to communicate with a variety of English speakers」；托福聽力可能會聽到北美、英國、紐西蘭、澳洲的口音。
  - 本站建議：每週選一種口音聽，先不看字幕抓重點，再對照逐字稿找出沒聽懂的地方，記下這種口音的特色。
  - 自己說英文時，目標是讓人聽得懂，不必模仿某一種口音：CEFR 補充版說，新的發音量表裡「Intelligibility has been a key factor in discriminating between levels.」用 AI 幫忙時，照學術倫理電子報的提醒做：不貼個人資訊、未公開文件或機密資料，AI 的輸出自己查證，內容自己寫，不把 AI 生成的內容直接交出去。本站建議：交作業時依課程規定說明用了哪個工具、做了什麼。
  items_title: 本站建議的練法
  items:
  - title: 每週一種口音
    text: 輪流聽不同國家的講者。
  - title: 先不看字幕
    text: 先抓重點。
  - title: 對照逐字稿
    text: 找出沒聽懂的地方。
  - title: 記下特色
    text: 例如哪些音不一樣。
  checklist_title: 每週勾一下
  checklist:
  - 聽了一種口音
  - 寫了重點
  - 對了逐字稿
  activity_figure: worldeng-flow
  sources:
  - toeic-redesign
  - toefl-listening
  - cefr-cv
  - ethics-epaper13
what:
  heading: 聽懂不同口音的英文
  body:
  - 學完後，能聽懂幾種不同口音的英文並抓出重點，也知道說英文的目標是讓人聽懂，不必模仿某一種口音。
  items_title: 學完能做到
  items:
  - title: 聽懂不同口音
    text: 抓出各段重點。
  - title: 說出差異
    text: 說出聽到的口音特色。
  - title: 知道說的目標
    text: 以讓人聽懂為目標，不必模仿某一種口音。
  checklist_title: 家人檢核
  checklist:
  - 重點大多正確
  - 說得出口音特色
  figures:
  - worldeng-compare
  notes:
  - 把大學階段對應多益、托福是本站建議，不是官方換算；檢定收錄的口音依 ETS 說明。
  - 情境的五個國家與檢核的 5 段、2 句、4 段是示意。
  - 用生成式 AI 時，不要把個人資訊、未公開文件、機密資料貼進去（教育部臺灣學術倫理教育資源中心 2023 年的電子報）；AI 的輸出要自己查證。這份 2023 年的電子報也說，學術界對使用生成式 AI 是否需要標註「尚無統一的規定」，建議先了解相關單位的政策；不要把 AI 生成的內容直接當成自己寫的交出去，電子報提醒，直接使用生成的內容而非親自撰寫，「還可能有代寫的學術倫理問題」；交作業時依課程規定說明用了哪個工具、做了什麼；AI 規定變化快，以學校和課程最新的規定為準（本站建議）。
  sources:
  - toeic-redesign
  - ethics-epaper13
