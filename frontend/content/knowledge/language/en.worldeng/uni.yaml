sources:
- id: cefr-cv
  title: 'Common European Framework of Reference for Languages: Learning, teaching, assessment – Companion volume'
  publisher: Council of Europe（2020 年 4 月，ISBN 978-92-871-8621-8）
  url: https://rm.coe.int/common-european-framework-of-reference-for-languages-learning-teaching/16809ea0d4
  accessed: '2026-10-29'
  kind: reference
  supports: Phonological control（p.133）「The focus on accent and on accuracy instead of on intelligibility has been detrimental to the development of the teaching of pronunciation.」「Intelligibility has been a key factor in discriminating between levels.」；量表描述（p.134）B2「accent tends to be influenced by the other language(s) they speak, but has little or no effect on intelligibility.」；發音量表的三個分量表（p.133）「overall phonological control (replacing the existing scale)」「sound articulation」「prosodic features (intonation, stress and rhythm)」；p.133「The focus is on how much effort is required from the interlocutor to decode the speaker's message.」
- id: toeic-redesign
  title: Background and Goals of the TOEIC Listening and Reading Test Redesign Project（TOEIC Compendium TC-10-02）
  publisher: ETS（Educational Testing Service）
  url: https://www.ets.org/Media/Research/pdf/TC-10-02.pdf
  accessed: '2026-10-29'
  kind: reference
  supports: 「The Classic TOEIC Listening and Reading test included only standard American accents. The design team proposed varying the accents used in the listening section because the TOEIC test is a test of international English, and examinees are likely to need to communicate with a variety of English speakers.」
- id: toefl-listening
  title: TOEFL iBT Listening Section
  publisher: ETS（Educational Testing Service）
  url: https://www.ets.org/toefl/test-takers/ibt/about/content/listening.html
  accessed: '2026-10-29'
  kind: exam
  supports: 「You may hear native-speaker English accents from North America, the U.K., New Zealand, or Australia, reflecting the variety of English used in academic environments.」
- id: ethics-epaper13
  title: 大學校園因應生成式AI之指引及教學建議（學術倫理電子報第 13 期）
  publisher: 教育部臺灣學術倫理教育資源中心（2023 年 8 月）
  url: https://ethics.moe.edu.tw/resource/epaper/html/21/
  accessed: '2026-10-29'
  kind: reference
  supports: （五）學術寫作的自我揭露：「目前學術界對於使用生成式AI是否需要標註，尚無統一的規定」，「建議研究者應先瞭解經費補助機關（構）或期刊等單位對於生成式AI之政策，並於著作或報告中適度公開相關訊息」；（三）個人資料保護與資通安全：「研究者應留意，不要將個人資訊、未公開文件、機密資料等內容輸入到生成式AI的對話框中，以避免產生個人隱私洩露的問題。」；（二）著作權：「由於生成式AI是將網路開放資料透過蒐集與彙整所生成的內容，研究者若直接將生成的內容拿來使用，而非親自撰寫或創作，除在法律上不享有著作權保障之外，還可能有代寫的學術倫理問題。」
