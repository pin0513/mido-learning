idea: 全世界說英文的人，多數不是母語者。溝通的目標是讓人聽懂，不是模仿某一種口音；聽得懂不同口音，才走得出去。
guiding_questions:
- 印度、新加坡、英國的英文，聽起來不一樣，哪一種才標準？
scenario: 親子共學：聽五個不同國家的人用英文介紹自己的城鎮，記下最難懂和最好懂的，說說為什麼。
goal: 聽懂不同口音的英文，目標是讓人聽懂，不是模仿某一種口音。
review: 聽 5 段不同國家講者的英文（例如美、英、澳、印度、新加坡），每段寫 2 句重點；家人對照逐字稿，至少 4 段的重點正確。
