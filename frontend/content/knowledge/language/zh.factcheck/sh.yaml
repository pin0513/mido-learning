idea: AI 會寫出看起來很真的錯誤引文、數字和出處。文章裡每個事實都要找到原始來源，查不到就刪掉。
guiding_questions:
- AI 給你一句名人名言，你怎麼知道他真的說過？
scenario: 親子共學：請 AI 給你 5 句跟主題相關的名言或數據，逐一查證，標出真的、查不到的、錯的。
goal: 文章裡每一個事實、數字與引文都找到原始來源，查不到就刪掉。
review: 請 AI 給 5 則名言或數據，孩子逐一附上原始來源連結並標「真的、查不到、錯的」；家長抽點 2 個連結確認。
