why:
  heading: AI 不會替你查證
  body:
  - 教育部的注意事項說，生成式 AI 的資料來源如果有錯，結果也會有錯，「因為這些工具無法自行判斷結果的正確性和合理性」，所以「不宜直接採信或用於作業、報告或公開發表的內容」。附錄還舉例：AI 排的旅遊行程「甚至還可能是虛構景點的行程」。
  - 國語文課綱要高中生「廣泛運用工具書及資訊網絡蒐集、分析資料」；教育部媒體素養白皮書也把「能夠透過多方查證或運用數位工具辨識不實訊息」列為能力學習面向。
  qa:
    question: AI 給你一句名人名言，你怎麼知道他真的說過？
    answer: 不能只看 AI 怎麼說。教育部的注意事項要我們「結合其他可靠來源的知識和批判性思維進行查證」。名言要找到原著、演講紀錄或可信的出版品，核對原文和出處；找不到，就不要用。
    source: genai-student
  items_title: 高中課綱的查證目標
  items:
  - title: 蒐集與分析資料
    text: 國語文 5-Ⅴ-4：廣泛運用工具書及資訊網絡蒐集、分析資料，提高綜合學習和應用能力。
    code: 5-V-4
  - title: 以事實為論據
    text: 國語文 Bd-Ⅴ-1：以事實、理論為論據，達到說服、建構、批判等目的。
    code: Bd-V-1
  sources:
  - genai-student
  - kuoyu
  - moe-medialit
how:
  heading: 每個事實找到原始來源
  body:
  - 把 AI 給的每一個事實拆開，一則一則查（本站建議）。注意事項提醒，遇到疑慮「應向老師或家長詢問」，也不可以「直接將生成內容作為作業或報告的原始答案」。
  items_title: 三種事實怎麼查（本站建議）
  items:
  - title: 名言
    text: 找原著、演講紀錄或可信出版品，核對原句。
  - title: 數字
    text: 找發布數據的機關或研究原文，看年份和單位。
  - title: 出處
    text: 打開連結，確認頁面真的有這句話。
  checklist_title: 每一則都要：
  checklist:
  - 找到原始來源
  - 核對原文
  - 查不到就刪
  - 標明出處
  activity_figure: how-flow
  sources:
  - genai-student
what:
  heading: 真的、查不到、錯的
  figures:
  - what-compare
  notes:
  - 使用生成式 AI 的規則依教育部注意事項：遵守「各平臺註冊年齡限制」；建議使用為教育目的而設計的工具（如教育部因材網 e度、酷英平臺的 CoolE Bot（注意事項寫作「酷英網E-BOT」）），「非在校使用，亦請家長陪伴使用」；不可以輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；交作業時依老師規定註明工具及用途，不把生成內容當成自己的作品。
  - 三類標記與查證步驟是本站建議；「5 則」「抽點 2 個」是示意。
  sources:
  - genai-student
  - moe-coolebot
  - moe-medialit
