# B5 提案：zh.factcheck@sh
# - 安全（中）：原文要孩子「請 AI 給你 5 句名言或數據」，沒有年齡限制、家長陪伴、教育用工具與不輸入個資的提醒；已依教育部生成式 AI 注意事項（學生版）補上。
# - 「AI 會寫出看起來很真的錯誤…」改成引用注意事項「無法自行判斷結果的正確性和合理性」與附錄的「虛構景點」例子；不再說 AI 一定會捏造引文。
# - 補 grades、5-Ⅴ-4、Bd-Ⅴ-1、教育部媒體素養白皮書（「多方查證」），以及 Why/How/What 與兩張圖。
