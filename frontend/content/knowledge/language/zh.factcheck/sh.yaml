goal: 文章裡每一個事實、數字與引文都找到原始來源，查不到就刪掉。
review: 在家長陪伴下請教育用 AI 工具給 5 則名言或數據（5 則為示意），孩子逐一附上原始來源連結並標「真的、查不到、錯的」；家長抽點 2 個連結確認。
