  human_experience:
  - 面對真人時不害怕，敢開口修補
idea: 真實對話會卡住，重點是會「修補」：Sorry? Could you say that again? 會請對方慢一點、換個說法，就能把話說下去。
guiding_questions:
- 店員說太快，你要怎麼請他再說一次？
scenario: 親子共學：在家開一間「英文早餐店」，孩子當店員、大人當客人，故意點很複雜的餐，練習請對方再說一次。
goal: 在問路、點餐、購物對話裡聽懂並回答，聽不懂時會請對方再說一次。
review: 家長扮演店員或路人用英文問 7 個問題（全民英檢初級口說「回答問題」的形式，每題 15 秒內回答），孩子每題都有回應，至少 5 題切題。
