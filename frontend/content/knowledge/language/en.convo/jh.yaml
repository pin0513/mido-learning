goal: 在問路、點餐、購物對話裡聽懂並回答，聽不懂時會請對方再說一次。
review: 家長扮演店員或路人用英文問 7 個問題（全民英檢初級口說「回答問題」的形式：每題說兩次，孩子在 15 秒內回答），孩子每題都有回應，至少 5 題切題（5 題是示意）。
