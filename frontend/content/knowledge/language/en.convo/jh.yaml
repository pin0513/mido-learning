why:
  heading: 聽不懂也能把話說下去
  body:
  - 英語文領綱第四學習階段的學習內容包括「語言與非語言的溝通策略（如請求重述、手勢、表情等）」、「人、事、時、地、物的描述及問答」和「角色扮演」。全民英檢初級的口說能力是「對熟悉的話題能以簡易英語對答，如問候、購物、問路等」。實施要點也提醒，練習時要「鼓勵學生放鬆心情大膽嘗試及不畏犯錯」（p.31）。
  qa:
    question: 店員說太快，你要怎麼請他再說一次？
    answer: 說 Sorry? Could you say that again? 或 Could you speak slowly, please? 這就是領綱說的請求重述。
    source: english
  items_title: 英語文領綱的學習重點
  items:
  - title: 溝通策略
    text: 英語文 B-Ⅳ-3：語言與非語言的溝通策略（如請求重述、手勢、表情等）。
    code: B-IV-3
  - title: 描述及問答
    text: 英語文 B-Ⅳ-5：人、事、時、地、物的描述及問答。
    code: B-IV-5
  - title: 角色扮演
    text: 英語文 B-Ⅳ-7：角色扮演。
    code: B-IV-7
  checklist_title: 開始前先確認
  checklist:
  - 會說數字和價錢
  - 會說左右前後
  notes:
  - 英語文 7-Ⅳ-3「利用語言及非語言溝通策略（如請求重述、手勢、表情等）提升溝通效能。」與第二外國語文同號，只在內文引用。
  sources:
  - english
  - gept-elementary
how:
  heading: 角色扮演，練請求重述
  body:
  - 本站建議：在家開一間英文早餐店，孩子當店員、大人當客人；大人故意點很複雜的餐，孩子練習請對方再說一次、確認點了什麼。熟了再換成問路、購物。
  items_title: 本站建議的練法
  items:
  - title: 請對方再說、說慢
    text: Sorry? Could you say that again? / Could you speak slowly, please?
  - title: 確認內容
    text: So you want a sandwich and milk?
  - title: 問路
    text: How can I get to the station?
  - title: 購物
    text: How much is it? / I'll take this one.
  checklist_title: 每次練完勾一下
  checklist:
  - 請對方重說
  - 確認了內容
  - 完成對話
  activity_figure: convo-flow
  notes:
  - 句子與練法是本站建議。
  sources:
  - english
what:
  heading: 點餐、問路、購物都能應對
  body:
  - 學完後，孩子能在問路、點餐、購物的對話裡聽懂並回答，聽不懂時會請對方再說一次，也能用手勢和表情幫忙。全民英檢初級口說的「回答問題」共 7 題，題目播出二次，每題回答時間 15 秒，可以用來檢核。
  items_title: 學完能做到
  items:
  - title: 聽懂並回答
    text: 點餐、問路、購物都能回應。
  - title: 請求重述
    text: 聽不懂時請對方再說一次。
  - title: 15 秒內回答
    text: 照全民英檢初級的形式回答。
  checklist_title: 家長檢核
  checklist:
  - 每題有回應
  - 會請求重述
  - 回答切題
  figures:
  - convo-compare
  notes:
  - 國中對應全民英檢初級是本站建議，不是官方換算。
  - 「至少 5 題切題」是示意；7 題、15 秒是官方形式。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網E-BOT），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去。
  - 教育部國教署的酷英平臺有 CoolE Bot 情境式英語聊天機器人，可以用來練對話；在家使用要家長陪伴。
  sources:
  - gept-elementary
  - genai-student
  - moe-coolebot
