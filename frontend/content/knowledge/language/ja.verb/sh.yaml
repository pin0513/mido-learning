how:
  heading: 三類動詞的ます形與て形
  body:
  - 本站整理的規則：い段或え段音＋る的動詞多半是第二類（例如食べる、見る），第二類去掉る加ます、加て：食べます、食べて；第三類只有する、来る（含勉強する這類名詞＋する）：します・して，来ます・来て；其餘是第一類，ます形把語尾的う段音改成い段音再加ます（飲む→飲みます），て形看語尾：う・つ・る→って，む・ぶ・ぬ→んで，く→いて，ぐ→いで，す→して，例外是行く→行って。帰る、入る、走る看起來像第二類，其實是第一類，要個別記。
  - 用法依《いろどり》：入門（A1）第10課「V-てください」例「ちょっと、手伝ってください。」；初級2（A2）第2課「V-ている +人」例「加藤さんは、あそこで、コピーをしている人です。」，第1課「V-ていました」例「ベトナムでは、ホテルで働いていました。」用「〜ています」說正在做的事是本站整理；但〜ています也可以表示狀態，例如入門第4課「【場所】に住んでいます」例「家族は、フィリピンに住んでいます。」是住在哪裡，不是正在做的動作（本站整理）。
  qa:
    question: 同一個動詞，為什麼有這麼多種樣子？
    answer: 因為不同用途要用不同的形：《いろどり》入門分開教「V-ますか？（マス形）」和「V-る？（辞書形）」，請人做事用「V-てください」；初級2 第2課有「V-ている +人」。哪一個有禮貌、哪一個用在朋友間，以及用 V-ている 說正在做的事，是本站整理。
    source: irodori
  items_title: 本站整理的變化表
  items:
  - title: 第一類
    text: ます形：う段改い段；て形：う・つ・る→って，む・ぶ・ぬ→んで，く→いて，ぐ→いで，す→して；行く→行って
    example: 飲む→飲みます→飲んで
  - title: 第二類
    text: 去る加ます／加て
    example: 食べる→食べます→食べて
  - title: 第三類
    text: する→します→して；来る（くる）→来ます（きます）→来て（きて）（含勉強する等）
  - title: 用て形造句
    text: V-てください（請求）；V-ている（正在做）
    example: ちょっと、手伝ってください。
  checklist_title: 每次練完勾一下
  checklist:
  - 先判斷類別
  - ます形對了
  - て形對了
  - 造了兩個句子
  activity_figure: verb-flow
  sources:
  - irodori
  - irodori2
what:
  heading: 變對動詞，說出請求與動作
  body:
  - 學完後，孩子能依三類動詞的規則變出ます形和て形，並用「〜てください」請對方做事、用「〜ています」說正在做的事。
  items_title: 學完能做到
  items:
  - title: ます形
    text: 依類別變出ます形。
  - title: て形
    text: 依語尾變出て形。
  - title: 造句
    text: 〜てください、〜ています。
  checklist_title: 家長檢核
  checklist:
  - 變化正確
  - 請求句正確
  - 進行句正確
  figures:
  - verb-compare
  notes:
  - 檢核的 10 個、8 組、各 1 句是示意。
  - 本站建議：本點可當作 JLPT N4 的準備；這是本站建議的對應，不是官方換算。JLPT 官網寫 N4 是「基本的な日本語を理解することができる」。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，其他商用工具「應經由學校評估資安風險」，並在師長指導下使用；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料，自己或別人的錄音也不上傳（本站建議）；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - irodori
  - jlpt-levels
  - genai-student
