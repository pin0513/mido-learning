why:
  heading: 學會規則就能類推
  body:
  - 第二外國語文領綱的四級學習表現有「能將習得的原則類推並善加運用。」（8-Ⅴ-14），學習內容有「類推運用。」（Af-Ⅴ-13）；三級有「能以簡易外語表達個人需求、意願和感受。」（2-Ⅴ-15）。
  - 動詞變化就是把規則類推到新的動詞，再用「〜てください」說出需求（本站整理）。
  items_title: 第二外國語文領綱的學習重點
  items:
