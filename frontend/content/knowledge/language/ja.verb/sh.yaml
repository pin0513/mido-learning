idea: 日文動詞會依照語氣和用途變形：禮貌的ます形、連接動作的て形。動詞分三類，每類有自己的變化規則。
guiding_questions:
- 同一個動詞，為什麼有這麼多種樣子？
scenario: 親子共學：把 10 個常用動詞做成卡片，正面是辭書形，背面寫ます形和て形，全家抽卡比賽。
goal: 把動詞變成ます形與て形，說出正在做、請對方做的事。
review: 家長給 10 個動詞原形，孩子變成ます形與て形，至少 8 組全對；再用て形說 2 句請家人做的事。
