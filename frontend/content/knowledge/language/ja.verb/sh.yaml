    code: 8-V-14
  - title: 類推運用
    text: 第二外國語文 Af-Ⅴ-13：類推運用。
    code: Af-V-13
  - title: 表達需求與感受
    text: 第二外國語文 2-Ⅴ-15：能以簡易外語表達個人需求、意願和感受。
    code: 2-V-15
  checklist_title: 開始前先確認
  checklist:
  - 會說ます句
  - 認得辞書形
