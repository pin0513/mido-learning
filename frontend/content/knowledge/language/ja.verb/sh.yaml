idea: 日文動詞會依用途變形：有禮貌的ます形，和接「ください」「いる」的て形。本站整理把動詞分成第一類、第二類、第三類，每類的ます形、て形有自己的規則，學會規則就能類推到新的動詞。
guiding_questions:
- 同一個動詞，為什麼有這麼多種樣子？
scenario: 親子共學：把 10 個動詞做成卡片（10 是示意），正面寫辞書形，背面寫ます形和て形，全家輪流抽卡說出變化，再用「〜てください」請家人做一件事（本站建議）。
goal: 依三類動詞的規則把動詞變成ます形和て形，並用「〜てください」請對方做事、用「〜ています」說正在做的事。
review: 家長給 10 個動詞的辞書形（三類都有），孩子變成ます形和て形，至少 8 組全對；再用「〜てください」說 1 句請家人做的事、用「〜ています」說 1 句家人正在做的事（數量是示意）。
