- 已補出處：「何陋之有」裡「之」的作用依國語文學科中心「倒裝句」B 項「賓語+之〈倒裝助詞〉+述語」（例「無恥之恥→恥無恥」）；大考中心 102 學年度學測國文第 4 題把「何厭之有」列為「將賓語提到動詞前面」的句子（選擇題答案第 4 題為 D，即 A「何厭之有」屬於這種結構）（2026-10-31 讀取）。《重編國語辭典修訂本》「之」字條（ID 7481）與《國語辭典簡編本》（ID 28881）沒有這個用法，所以不引辭典的「之」字條。
