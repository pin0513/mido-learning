# - 判斷句改用辭典例：「孟子是亞聖」對照「孟子，亞聖也。」（《重編國語辭典修訂本》「判斷句」）；原文「……者，……也」這個格式本批沒有開到官方來源，改成辭典的例子。
# - 被動句「為……所」「於」依《國語小字典》，「見」依《重編國語辭典修訂本》「見笑」（「被人譏笑」，例「吾長見笑於大方之家」）。
# - 倒裝句改用辭典例：《重編國語辭典修訂本》「倒裝句」（ID 42964）「文法成分先後顛倒的句型」，「吾誰欺」為「吾欺誰」的倒裝。
# - 「何陋之有」裡「之」的作用、省略句的名稱：辭典查不到，列為本站整理並待核對，to_verify 維持 true。省略句補一個例子（〈桃花源記〉「見漁人，乃大驚」，原文依教育部《成語典》「世外桃源」典源），標本站整理。
# - 新增一個 guiding question（判斷句），讓 Why 的問答有辭典來源；原本的「何陋之有」問題保留，在 How 以本站整理回答。
# - 複審修正：解說類標籤一律統一為「本站整理」；How 的被動句兩項合併，騰出位置放倒裝句（辭典例）與省略句。
# - 「學測國綜 A3 語法」是高中（第五學習階段）的考試說明，改成附註；補 grades、Ac-Ⅳ-2、Ab-Ⅳ-6 與 Why/How/What。
# - 待核對補證：《重編國語辭典修訂本》「是」（ID 8779）有「使賓語提前」的用法（例「惟利是圖」），補為來源 rev-shi，How 用它說明賓語可以提到動詞前面。「之」字條（重編 ID 7481、簡編本 ID 28881）仍沒有這個用法，「何陋之有」的「之」與省略句仍是本站整理；to_verify 維持 true。
# - 待核對補證（二）：「何陋之有」的「之」改依國語文學科中心「倒裝句」B 項（「賓語+之〈倒裝助詞〉+述語」，datapage/16）與大考中心 102 學測國文第 4 題（答案 D，「何厭之有」屬「將賓語提到動詞前面」）；意思對照《重編國語辭典修訂本》「何罪之有」「何功之有」，白話翻譯仍標本站整理。省略句的名稱與「省略主語」改依同中心「省略句」（datapage/17）；〈桃花源記〉例子仍標本站整理。to_verify 改為 false。
