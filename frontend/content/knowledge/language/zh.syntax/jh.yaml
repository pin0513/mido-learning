idea: 文言文的語序和白話不完全一樣。判斷句常用「……者，……也」；被動句用「見、為、於」；倒裝句把賓語放前面（何陋之有）；省略句省掉主語或介詞。翻譯時先補齊、再調回白話語序。
guiding_questions:
- 「何陋之有」為什麼不寫成「有何陋」？
scenario: 親子共學：親子各寫 3 句白話，交換改成文言倒裝或判斷句，再請對方翻回來。
goal: 認出四種文言句式：判斷句、被動句、倒裝句、省略句，並翻成通順白話。
review: 家長給 8 句文言句，孩子標出句式並翻成白話；句式與翻譯都對的至少 6 句。
