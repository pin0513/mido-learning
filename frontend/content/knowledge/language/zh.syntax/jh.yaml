idea: 文言文的語序和白話不完全一樣。判斷句可以不用「是」：「孟子，亞聖也。」被動句常用「為……所」「見」「於」：「為人所害」「吾長見笑於大方之家」。倒裝句是「文法成分先後顛倒的句型」，例如「吾誰欺」就是「吾欺誰」的倒裝（《重編國語辭典修訂本》）。省略句是句中的某些成分或上下文省略的句子，常見的是省略主語（國語文學科中心）；例如〈桃花源記〉「見漁人，乃大驚」，大驚的是村裡的人（例子為本站整理）。翻譯時先補齊、再調回白話語序。
guiding_questions:
- 「何陋之有」為什麼不寫成「有何陋」？
- 「孟子，亞聖也。」沒有「是」，為什麼也是判斷句？
scenario: 親子共學：親子各寫 3 句白話，交換改成文言倒裝或判斷句，再請對方翻回來。
goal: 認出四種文言句式：判斷句、被動句、倒裝句、省略句，並翻成通順白話。
review: 家長給 8 句文言句，孩子標出句式並翻成白話；句式與翻譯都對的至少 6 句（示意）。
