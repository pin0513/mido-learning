why:
  heading: 語序不同，意思才讀得對
  body:
  - 國語文課綱的國中學習內容有「敘事、有無、判斷、表態等句型」和「常用文言文的詞義及語詞結構」；會考國文的「基本的語文常識」也包括「理解基本的語法」。
  - 文言句子常常少了「是」或「被」這些字，不認得句式，就容易把意思讀反。
  qa:
    question: 「孟子，亞聖也。」沒有「是」，為什麼也是判斷句？
    answer: 判斷句是謂語在「說明或判斷主語所指稱的事物」的句子。白話會用「是」連接：「孟子是亞聖」；文言可以不用繫詞，《重編國語辭典修訂本》就說「孟子，亞聖也。」是「不使用繫詞的判斷句」。
    source: rev-panduan
  items_title: 國中課綱怎麼說
  items:
  - title: 判斷等句型
    text: 國語文 Ac-Ⅳ-2：敘事、有無、判斷、表態等句型。
    code: Ac-IV-2
  - title: 文言詞義與語詞結構
    text: 國語文 Ab-Ⅳ-6：常用文言文的詞義及語詞結構。
    code: Ab-IV-6
  sources:
  - kuoyu
  - cap-guowen
  - rev-panduan
how:
  heading: 先補齊，再調語序
  body:
  - 翻譯時先找出句式的記號（也、為……所、見、於），補上白話少不了的「是」「被」，再把語序調回白話。
  - 文言可以把賓語提到動詞前面：《重編國語辭典修訂本》說「是」可以「用於句中，使賓語提前」，例如「惟利是圖」。
  - 「何陋之有」是「有何陋」的倒裝：賓語「何陋」提到動詞「有」前面，中間用「之」；國語文學科中心把這種「之」叫作「倒裝助詞」，例如「無恥之恥→恥無恥」。意思是「有什麼簡陋的呢？」，用反問表示不簡陋（白話為本站整理，對照《重編國語辭典修訂本》「何罪之有」「何功之有」的反問解釋）。
  items:
  - title: 判斷句
    text: 不用「是」，句末常見「也」。
    example: 孟子，亞聖也。（孟子是亞聖）
  - title: 被動句
    text: 「為……所」的「為」是「被」；「見笑」是「被人譏笑」；「於」可表被動。
    example: 為人所害；吾長見笑於大方之家
  - title: 倒裝句
    text: 文法成分先後顛倒的句型（《重編國語辭典修訂本》）。
    example: 吾誰欺（吾欺誰）
  - title: 省略句
    text: 句中的某些成分省略，常見省略主語（國語文學科中心）。翻譯時補回來，這個做法和例子是本站整理。
    example: （村人）見漁人，乃大驚
  checklist_title: 翻一句文言：
  checklist:
  - 找句式記號
  - 補上是或被
  - 調回白話語序
  - 唸一遍
