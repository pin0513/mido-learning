  heading: 判斷句：有沒有「是」
  figures:
  - what-compare
  notes:
  - 高中學測國文說明把「語法的辨識與應用」列為測驗目標，常見題型包括「辨識被動句」；國中先把基本句式讀懂。
  - 倒裝句的定義和「吾誰欺」例依《重編國語辭典修訂本》「倒裝句」；「是」使賓語提前（「惟利是圖」）依同一部辭典「是」字條；「之」當倒裝助詞依國語文學科中心「倒裝句」B 項。
  - 大考中心 102 學年度學測國文第 4 題寫「古漢語中，往往為強調賓語（受詞），而將賓語提到動詞前面」，選項 A 就是「夫晉，何厭之有」（答案 D 才不屬於這種結構）。
  - 省略句的名稱和「省略主語」依國語文學科中心「省略句」；〈桃花源記〉的例子是本站整理。
  - 「至少 6 句」是示意的檢核標準。
