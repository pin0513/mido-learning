- 原有待核對「大學不對應 108 課綱，以學門路徑對應」已處理：大學不列 108 課綱代碼，依據改用Council of Europe CEFR Companion volume、JLPT 官網與教育部臺灣學術倫理教育資源中心等來源。
- 日文以 JLPT 為主要基準；大學階段與 JLPT 級數的對應是本站建議，不是官方換算。
