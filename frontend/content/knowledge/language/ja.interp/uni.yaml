what:
  heading: 筆譯與視譯都翻出重點
  body:
  - 學完後，能把一段日文短文筆譯成自然的中文，並看著原文當場口頭翻出重點，不逐字照翻。
  items_title: 學完能做到
  items:
  - title: 筆譯
    text: 譯成自然的中文。
  - title: 視譯
    text: 當場口頭說出重點。
  - title: 自己檢查
    text: 放下原文重讀譯文。
  checklist_title: 自我檢核
  checklist:
  - 意思翻對
  - 中文自然
  - 視譯說出重點
  figures:
  - interp-compare
  notes:
  - 情境與檢核的 200 字是示意。
  - 用生成式 AI 時，不要把個人資訊、未公開文件、機密資料貼進去（教育部臺灣學術倫理教育資源中心 2023 年的電子報）；不上傳自己或別人的錄音（本站建議）；AI 的輸出要自己查證。同一份電子報也說，學術界對使用生成式 AI 是否需要標註「尚無統一的規定」，建議先了解相關單位的政策；交作業時依課程規定說明用了哪個工具、做了什麼；AI 規定變化快，以學校和課程最新的規定為準（本站建議）。作業要自己寫，不把 AI 生成的內容直接當成自己的作品（本站建議）；同一份電子報還說，直接使用生成內容「可能有代寫的學術倫理問題」。
  sources:
  - cefr-cv
  - ethics-epaper13
