idea: 日翻中常見的難題：主詞常被省略、敬語在中文沒有一對一的說法、句尾語氣很難翻（本站整理）。CEFR 把看著書面文字當場口頭翻出來（視譯）和筆譯都放在中介（mediation）裡；筆譯看譯文好不好懂、有沒有被原文結構牽著走、有沒有保留原文的語氣。
guiding_questions:
- 好的翻譯是逐字照翻，還是讓讀者有一樣的感受？
scenario: 親子共學：用自己寫的或老師提供的日文短文（約 200 字，字數是示意），一人筆譯成中文，一人看著原文當場口頭翻出來（視譯），再比較兩個版本哪裡被日文語序牽著走（本站建議）。
goal: 把一段日文短文筆譯成自然的中文，並看著原文當場口頭翻出重點（視譯），不逐字照翻。
review: 筆譯一段約 200 字的日文短文成中文，家人對照原文或可信的翻譯，主要意思都翻對、讀起來是自然的中文；再視譯同一段，說出重點（字數是示意）。
