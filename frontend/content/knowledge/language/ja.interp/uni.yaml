# B10 提案：ja.interp@uni
# - 補 Why/How/What、兩張圖；大學不列 108 課綱代碼。
# - 錯誤修正：原標題「日中翻譯與口譯入門」承諾口譯，但能找到可引用的只有 CEFR 的筆譯與視譯（把書面文字當場口頭翻出）描述，改成「日中翻譯入門：筆譯與視譯」，並說明 CEFR 的描述不是專業口筆譯訓練；原 scenario 翻譯動畫台詞有著作權問題，改成自己寫的或老師提供的短文；日翻中的難題標本站整理；字數標示意。
# - 安全：譯文自己先譯，AI 只對照檢查；不把公司、客戶的機密文件貼進 AI。
