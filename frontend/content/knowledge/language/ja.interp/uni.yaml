why:
  heading: 翻譯不是逐字換
  body:
  - CEFR Companion volume 對筆譯的觀察重點包括「comprehensibility of the translation」、原文的說法和結構是否「(over-)influence the translation」，以及「capturing nuances in the original」。
  - CEFR 也說「Translation and interpretation competences and strategies are an entirely different field.」，它的描述「not intended to describe the competences of professional interpreters and translators」：本點是語言能力的入門練習，不是專業口筆譯訓練（本站整理）。
  notes:
  - 本站建議：把本點放在大學階段、對應 JLPT N1 是本站建議，不是官方換算。JLPT 官網寫 N1 是「幅広い場面で使われる日本語を理解することができる」。
  sources:
  - cefr-cv
  - jlpt-levels
how:
  heading: 先懂再譯，譯完重讀
  body:
  - 筆譯（本站建議的三步）：①讀完整段，先懂意思再動筆；②補出省略的主詞，把敬語換成中文的禮貌說法（例如用您、請）；③放下原文讀一遍譯文，檢查是不是自然的中文，有沒有被日文語序牽著走。③做完之後才請 AI 對照，不讓 AI 先譯（本站建議）。
  - 視譯：CEFR 說這是「the process of spontaneously giving an oral translation of a written text」，重點是「providing a rough, approximate translation」、「capturing the essential information」，程度高了再抓語氣。練習時先口頭說出大意，不求每個字都翻到（本站建議）。
  qa:
    question: 好的翻譯是逐字照翻，還是讓讀者有一樣的感受？
    answer: 不是逐字照翻。CEFR 看筆譯時，會看原文的說法和結構是否「(over-)influence the translation」，相對於譯文「following relevant conventions in the target language」；也看能不能「capturing nuances in the original」。讓讀者讀起來自然、又保留語氣，是本站整理的目標。
    source: cefr-cv
  items_title: 本站建議的步驟
  items:
  - title: 先懂再譯
    text: 讀完整段再動筆
  - title: 補主詞
    text: 中文常要把省略的主詞補回（本站整理）
  - title: 換禮貌說法
    text: 敬語換成您、請等（本站整理）
  - title: 視譯抓重點
    text: 先說大意，再抓語氣
  checklist_title: 每次練完勾一下
  checklist:
  - 讀完才動筆
  - 補了主詞
  - 讀起來像中文
  - 視譯說出重點
  activity_figure: interp-flow
