idea: 日翻中常見的難題：主詞常被省略、敬語在中文沒有對應、語尾的語氣很難翻。好的翻譯要先懂，再重寫。
guiding_questions:
- 好的翻譯是逐字照翻，還是讓讀者有一樣的感受？
scenario: 親子共學：拿一段動畫台詞，各自翻成中文字幕，比較誰的版本最自然、最不失原味。
goal: 日中互譯一段文字，翻出意思與語氣，不逐字換。
review: 翻譯一段 200 字日文新聞成中文，家人對照官方中文版或可信翻譯，主要意思都翻對、語氣得體。
