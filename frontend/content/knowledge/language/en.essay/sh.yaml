  - moe-coolebot
what:
  heading: 寫出段落清楚的作文
  body:
  - 學完後，孩子能依題目寫一篇段落清楚的英文作文，說得出每個轉承語交代了什麼關係，並用學測的四項分項標準自己檢查。
  items_title: 學完能做到
  items:
  - title: 分段寫
    text: 每段一個重點，有主題句。
  - title: 用對轉承語
    text: 說得出轉折、結果、舉例的差別。
  - title: 用評分標準自查
    text: 內容、組織、文法句構、字彙拼字。
  checklist_title: 家長檢核
  checklist:
  - 每段有主題句
  - 轉承語正確
  - 四項都到可
  figures:
  - essay-compare
  notes:
  - 作答說明與評分依大考中心、全民英檢中級作文依 LTTC；把高中對應全民英檢中級、學測是本站建議，不是官方換算。
  - 學測分項評分每項 0–5 分：「優」5–4 分、「可」3 分、「差」2–1 分、「劣」0 分；檢核用的 30 分鐘、3 分門檻是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網的 CoolE Bot），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - ceec-english
