verify_notes:
- 待核對：課綱對應只到領域、核心素養與議題，上線前請以教育部課綱與國語文、英語文、第二外國語文課綱核對。
- 英文以全民英檢、美國小學／中學讀本、多益、托福為主要基準，108 課綱英語文為次要對照；學段與檢定的對應是本站的學習建議，不是官方換算。
- 基準標籤：全民英檢中級・作文。
- 引用的框架只寫名稱（全民英檢中級英文作文約 120 字（LTTC）；學測英文作文至少 120 字（大考中心）），教材內容是改寫的入門說明，上線前請核對原始出處的用語。
