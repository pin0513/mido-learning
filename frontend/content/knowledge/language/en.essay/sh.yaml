scenario: 親子共學：把一篇英文短文的段落剪開打亂，再靠轉承語排回原本的順序。
goal: 寫一篇至少 120 個單詞的英文作文：每段一個重點，用轉承語交代句子和段落的關係。
review: 孩子依一個題目寫一篇至少 120 個單詞的英文作文（學測作答說明），限時 30 分鐘；家長用學測分項評分的四項（內容、組織、文法句構、字彙拼字）各給 0–5 分，每項都到「可」（3 分）以上（30 分鐘、3 分門檻是示意）。
