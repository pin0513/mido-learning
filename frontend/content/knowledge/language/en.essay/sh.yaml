why:
  heading: 讓讀者跟得上你的思路
  body:
  - 大考中心說，學測英文作文「用以評量考生書寫具連貫性短文之能力」；分項評分的「組織」一項，最高等級是「重點分明，有開頭、發展、結尾，前後連貫，轉承語使用得當」。
  - 英語文領綱第五學習階段要學生「能根據上下文語境釐清兩個訊息間的關係」（9-Ⅴ-2），並學習「短文、書信的內容及文本結構」（B-Ⅴ-8）；較高階的 *4-Ⅴ-8 是「能依提示寫出符合主題、語意連貫且組織完整的段落或說明。」
  qa:
    question: However 和 Therefore 放錯，文章會怎樣？
    answer: 讀者會誤會前後兩句的關係：However 表示轉折，Therefore 表示結果（本站整理）。放錯了，理由和結論就接不起來；學測的組織項看的正是「前後連貫，轉承語使用得當」。
    source: ceec-english
  items_title: 高中英語文課綱的相關條目
  items:
  - title: 釐清訊息關係
    text: 英語文 9-Ⅴ-2：能根據上下文語境釐清兩個訊息間的關係。
    code: 9-V-2
  - title: 文本結構
    text: 英語文 B-Ⅴ-8：短文、書信的內容及文本結構。
    code: B-V-8
  checklist_title: 動筆前先確認
  checklist:
  - 看懂題目要求
  - 想好兩三個重點
  sources:
  - ceec-english
  - english
how:
  heading: 一段一個重點，用轉承語接
  body:
  - 本站建議：先列出要寫的重點，一段只寫一個；段落開頭寫主題句，再用例子支持，最後用轉承語接到下一段。寫完自己檢查每個 However、Therefore、For example 前後的關係對不對，再請家長複查一次。
  - 學測評分原則依考生在「內容、組織、文法句構、字彙拼字之表現評分」；學測考試說明的分項標準，每項分優（5–4 分）、可（3 分）、差（2–1 分）、劣（0 分）。本站建議：寫完用這四項各自給自己打 0–5 分，找出分數最低的一項先改，再交給家長複查。
  - 學測的作答說明是「文長至少 120 個單詞」；評分原則寫明「字數明顯不足者，扣總分1分；未分段者，亦扣總分1分」。全民英檢中級則是「長度約120字（8至12個句子）。作文可以是一個完整的段落，也可以分段。」用 AI 練習時，照教育部注意事項（學生版）做：先確認符合平臺的註冊年齡限制，優先用為教育目的設計的工具（例如酷英網的 CoolE Bot），在家使用請家長陪伴；不輸入自己或他人的個人資料；AI 的回答要查證，不直接採信；作業「應依規定註明所使用的工具及用途，不得將生成內容直接當作自己原創作品繳交」，也不能用 AI 抄襲、代寫或作弊。
  items_title: 本站建議的寫法
  items:
  - title: 列重點
    text: 一段只放一個重點。
  - title: 寫主題句
    text: 段落第一句說這段要講什麼。
  - title: 用轉承語
    text: However 轉折、Therefore 結果、For example 舉例。
  - title: 回頭檢查
    text: 確認轉承語前後關係，再用四項各自打分。
  checklist_title: 寫完勾一下
  checklist:
  - 每段一個重點
  - 轉承語用對
  - 字數夠
  - 有分段
  activity_figure: essay-flow
  sources:
