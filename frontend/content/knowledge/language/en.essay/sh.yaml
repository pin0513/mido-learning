idea: 英文作文要讓讀者看得出句子和段落之間的關係：每段一個重點，用 However、Therefore、For example 這類轉承語交代轉折、結果或舉例。學測英文作文的分項評分把「轉承語使用得當」放在「組織」一項；全民英檢中級的作文可以寫成一段，也可以分段。
