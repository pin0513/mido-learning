idea: 一篇英文作文是好幾段的組合：每段一個重點，用 However、Therefore、For example 這類連接詞，把段落之間的關係說清楚。
guiding_questions:
- However 和 Therefore 放錯，文章會怎樣？
scenario: 親子共學：把一篇英文短文的段落剪開打亂，再靠連接詞排回原本的順序。
goal: 寫一篇約 120 字的英文作文：段落清楚，用連接詞交代關係。
review: 孩子 25 分鐘內寫一篇 120 字以上的作文（全民英檢中級與學測英文作文的長度），家長用學測評分的四項（內容、組織、文法句構、字彙拼字）各給 1–5 分，各項都在 3 分以上。
