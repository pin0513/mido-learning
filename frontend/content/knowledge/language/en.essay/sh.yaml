# - 第二輪獨立審查修正：What／檢核承諾「用學測四項分項標準自查」，How 補一段教法：依 115 評分原則的四項各自打 0–5 分、先改最低的一項（本站建議）；How items「回頭檢查」改為轉承語＋四項自評。
# - 第三輪獨立審查修正：（建議項）How 第二段的分數等級改標「學測考試說明的分項標準」，不再寫在評分原則名下。
# - 第五輪獨立審查修正：（建議項）比較圖 essay-compare 的學測兩格（至少 120 個單詞、未分段扣 1 分）都出自 115 學測評分原則，source 由 ceec-english 改 ceec-115-scoring（supports 補「寫一篇文長至少 120 個單詞的作文」），caption 改寫，what.sources 加 ceec-115-scoring。 What notes 的 AI 注意事項 How 沒教，How body 補 AI 使用說明（年齡限制、教育用工具、家長陪伴、不輸入個資、查證、註明工具、不代寫；學生版六（四）逐字），how.sources 加 genai-student。
# - 第六輪獨立審查修正：（建議項）酷英網工具名稱依國教署新聞稿與酷英網現行頁面改為「CoolE Bot」（How body 與 What notes 的內文；genai-student supports 的引文照學生版 PDF 原文「酷英網E-BOT」不改），新增來源 moe-coolebot（國教署 2023-11-26 即時新聞），列入 how.sources 與 what.sources。
