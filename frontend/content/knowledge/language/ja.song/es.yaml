# - 補 grades（三至六年級，本站建議；不列 108 代碼）、Why/How/What、兩張圖。
# - 錯誤修正：原 AI 用法「顯示歌詞假名」會讓 AI 轉出整首歌詞，歌詞受著作權保護，改成大人用 AI 找歌名、不轉貼歌詞；原檢核「家長對照歌詞」改成對照正版歌本或官方頁面；數字標示意；原目標「5 個字」標示意。
# - 安全：看影片依國健署「用眼30分鐘 休息10分鐘」、每天不超過 1 小時；孩子唱歌的影片不上傳；AI 只由大人操作。
