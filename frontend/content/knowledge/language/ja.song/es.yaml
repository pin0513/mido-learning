idea: 兒歌句子短、常重複，邊聽邊唱就能記住日語的發音和節奏（本站整理）。挑正版影片或歌本，看螢幕要記得休息。
guiding_questions:
- 你聽過的日語裡，有哪些字是你聽得懂的？
scenario: 親子共學：大人挑一首日語兒歌（例如〈どんぐりころころ〉），全家聽一週，比賽誰能跟唱最多句（一週是示意）。
goal: 跟著一首日語兒歌唱，聽出並說出其中 5 個認得的字（5 個是示意）。
review: 孩子跟唱一首兒歌，再說出歌裡 5 個認得的字和意思；家長對照正版歌本或官方頁面確認（5 個是示意）。
