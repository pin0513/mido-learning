why:
  heading: 用歌把耳朵打開
  body:
  - 兒歌速度慢、句子短，常常重複同樣的字，適合用來練聽和練念（本站整理）。
  - JLPT 官網對 N5 聽解的說明是「教室や、身の回りなど、日常生活の中でもよく出会う場面で、ゆっくり話される短い会話であれば、必要な情報を聞き取ることができる。」先從慢而短的日語聽起（本站建議）。
  - 國中以後，第二外國語文領綱的一級學習表現有「聽詞彙能模仿發音。」（2-Ⅳ-2）；國小沒有日語課綱，本點先打基礎（本站建議）。
  qa:
    question: 你聽過的日語裡，有哪些字是你聽得懂的？
    answer: 常見的是招呼語和數字，例如こんにちは、ありがとう、いち、に、さん（本站整理）。把聽懂的字記下來，就是聽力練習的開始；JLPT 的 N5 聽解也是從「ゆっくり話される短い会話」開始。
    source: jlpt-levels
  items_title: 官方對初級聽的說明
  items:
  - title: JLPT N5 聽
    text: 聽得懂日常場面裡、慢慢說的短對話（依 JLPT 官網，中文是本站整理）。
  checklist_title: 開始前先確認
  checklist:
  - 會念平假名
  - 有正版歌本
  notes:
  - 國小沒有日語的課綱；三至六年級是本站建議的年級。第二外國語文領綱從國中開始（國中由學校在彈性學習課程選開）。
  sources:
  - jlpt-levels
  - sfl
how:
  heading: 聽、記、唱，再對照
  body:
  - 本站建議：大人挑一首兒歌，從正版影片、CD 或歌本來聽。先聽三遍，孩子記下聽懂的字，再跟著唱；不懂的字由大人查歌本或字典，把意思告訴孩子。
  - 看螢幕依國民健康署的愛眼守則：「用眼30分鐘 休息10分鐘」，2 歲以上每天不要超過 1 小時。歌詞屬於音樂著作，可能仍受著作權保護，不要轉貼整首歌詞，也不要把孩子唱歌的影片上傳（本站建議）。
  items_title: 本站建議的步驟
  items:
  - title: 選歌
    text: 大人挑一首正版兒歌。
  - title: 聽三遍
    text: 第一遍聽旋律，第二、三遍聽字。
  - title: 記字
    text: 孩子說出聽懂的字，大人查出意思告訴孩子。
  - title: 跟唱
    text: 看正版歌本跟著唱。
  checklist_title: 每次練完勾一下
  checklist:
  - 聽了三遍
  - 記了幾個字
  - 跟著唱了
  - 看完休息了
  activity_figure: song-flow
  sources:
  - hpa-eye
  - tipo-music
what:
  heading: 跟唱一首、聽懂幾個字
  body:
  - 學完後，孩子能跟著一首日語兒歌唱，並說出歌裡幾個聽得懂的字。
  items_title: 學完能做到
  items:
  - title: 跟唱
    text: 跟著一首兒歌唱完。
  - title: 聽出字
    text: 說出歌裡認得的字和意思。
  - title: 守規則
    text: 看螢幕會休息，不轉貼歌詞。
  checklist_title: 家長檢核
  checklist:
  - 唱完一首
  - 說出認得的字
  - 影片沒有上傳
  figures:
  - song-compare
  notes:
  - 目標與檢核的 5 個字是示意。
  - 本站建議：本點可當作 JLPT N5 的準備；這是本站建議的對應，不是官方換算。JLPT 官網寫 N5 是「基本的な日本語をある程度理解することができる」。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
