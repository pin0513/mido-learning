idea: 兒歌和動畫是最自然的日語輸入：重複多、有畫面。先享受聽，聽到熟悉的字就記下來。
guiding_questions:
- 你看過的日本卡通裡，有哪些字是你聽得懂的？
scenario: 親子共學：選一首日文兒歌（例如「どんぐりころころ」），全家聽一週，比賽誰能跟唱最多句。
goal: 跟著一首日語兒歌或動畫主題曲唱，聽出其中 5 個認得的字。
review: 孩子跟唱一首日語歌，唱完寫出（或說出）聽到的 5 個字和意思；家長對照歌詞確認。
