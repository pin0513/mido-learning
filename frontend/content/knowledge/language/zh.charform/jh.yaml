why:
  heading: 字對了，意思才對
  body:
  - 國中教育會考（簡稱會考）國文的第一項考試內容是「常用字的形音義：認識國字至少4,500字，使用3,500字。」第三項「基本的語文常識」也包括「認識基本的造字原則」。
  - 國語文課綱要國中生「能運用字典或辭典了解一字多音及一字多義的現象」。同一個字換了詞，讀音和意思都可能跟著變。
  qa:
    question: 「便宜」的「便」和「方便」的「便」，念法一樣嗎？
    answer: 不一樣。「方便」的「便」念 ㄅㄧㄢˋ；「便宜」當「物價低廉」講時念 ㄆㄧㄢˊ ˙ㄧ。可是同樣寫成「便宜」，在「便宜行事」裡是「方便合宜」的意思，念 ㄅㄧㄢˋ ㄧˊ。所以多音字要看詞義判斷，再查辭典確認。
    source: rev-pianyi
  items_title: 國中課綱的字音字形目標
  items:
  - title: 認識與使用的字量
    text: 國語文 4-Ⅳ-1：認識國字至少 4,500 字，使用 3,500 字。
    code: 4-IV-1
  - title: 認識造字原則
    text: 國語文 4-Ⅳ-2：認識造字的原則，輔助識字，了解文字的形、音、義。
    code: 4-IV-2
  - title: 一字多音、一字多義
    text: 國語文 4-Ⅳ-3：能運用字典或辭典了解一字多音及一字多義的現象。
    code: 4-IV-3
  - title: 四種基本造字原則
    text: 國語文 Ab-Ⅳ-3：基本的造字原則：象形、指事、會意、形聲。
    code: Ab-IV-3
  sources:
  - cap-guowen
  - kuoyu
  - rev-pianyi
  - mini-bian
how:
  heading: 先想詞義，再查辭典
  body:
  - 遇到多音字，先想這個詞是什麼意思，再查教育部《重編國語辭典修訂本》。心測中心說明，會考的國字字音以教育部公告的《國語一字多音審訂表》88 年 3 月版為據。形近字則把兩個字並排，圈出不一樣的部件。
  items:
  - title: 形近字並排比
    text: 戍：以兵卒防守邊疆；戌：地支的第十一位（《重編國語辭典修訂本》）。
    example: 戍守（ㄕㄨˋ）／戌時（ㄒㄩ）
  - title: 找意符和音符
    text: 辭典說形聲字「意符表形，音符表聲」：江、河「從水取義，以工、可分標其聲」。
    example: 江、河
  - title: 多音字看詞義
    text: 同一個字，詞義不同，讀音就可能不同。
    example: 方便（ㄅㄧㄢˋ）／便宜（ㄆㄧㄢˊ）
  checklist_title: 每查一組字：
  checklist:
  - 先想詞義
  - 查教育部辭典
  - 圈出不同部件
  - 造一個詞
  activity_figure: how-flow
  sources:
  - cap-guowen-qa
  - rev-shu
  - rev-xu
  - rev-xingsheng
what:
  heading: 形近字：戍與戌
  figures:
  - what-compare
  notes:
  - 傳統的「六書」還有轉注、假借。國中課綱只列象形、指事、會意、形聲四種基本造字原則（Ab-Ⅳ-3）；完整的六書在高中：國語文課綱第五學習階段的學習內容是「六書的基本原則」（Ab-Ⅴ-1），大學入學考試中心的學測國文說明也寫到「六書基本原則」。
  - 「答對 8 組」是示意的檢核標準。
  sources:
  - rev-shu
  - rev-xu
  - kuoyu
  - ceec
