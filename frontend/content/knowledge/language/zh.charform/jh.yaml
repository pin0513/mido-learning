verify_notes:
- 待核對：課綱對應只到領域、核心素養與議題，上線前請以教育部課綱與國語文、英語文、第二外國語文課綱核對。
- 引用的框架只寫名稱（會考國文「常用字的形音義」、學測國綜 A1、造字原則（六書）），教材內容是改寫的入門說明，上線前請核對原始出處的用語。
- 本點為這次補強新增，內容尚未經老師審閱。
- 多音字讀音以教育部《國語辭典》與《一字多音審訂表》為準，教材舉例前請核對。
