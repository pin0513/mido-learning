idea: 會考國文考「常用字的形音義」，學測國綜考「字形、字音、字義的辨識與應用」。多音字靠詞義判斷讀音；形近字看部首與筆畫差在哪；六書（象形、指事、會意、形聲、轉注、假借）裡最多的是形聲字，形旁表意、聲旁表音。
guiding_questions:
- 「便宜」的「便」和「方便」的「便」，念法一樣嗎？
scenario: 親子共學：全家各寫下自己最常念錯的兩個多音詞，貼在冰箱上，一週內每念對一次畫一筆。
goal: 辨認形近字、音近字和多音字，用六書說出一個字為什麼這樣寫。
review: 家長從課本挑 10 組形近或多音字（例如「戍／戌」「便宜／方便」），孩子寫出讀音並各造一個詞，答對 8 組以上；再挑 2 個形聲字說出形旁和聲旁。
