# - 嚴重度中：原文把「六書（象形、指事、會意、形聲、轉注、假借）」當國中範圍；國語文領綱國中只列「基本的造字原則：象形、指事、會意、形聲」（Ab-Ⅳ-3，p.14），會考也只寫「認識基本的造字原則」。改成四種，轉注、假借移到附註（學測國綜才寫「六書基本原則」）。
# - 原文「六書裡最多的是形聲字」本批沒有開到可核對的官方來源（《重編國語辭典修訂本》「形聲」條沒有這句），刪除。
# - 「便宜／方便」補上辭典讀音：「便宜」表物價低廉念 ㄆㄧㄢˊ ˙ㄧ，但「便宜行事」念 ㄅㄧㄢˋ ㄧˊ；會考字音依《國語一字多音審訂表》88 年版（心測中心問與答）。
# - 補 grades、4-Ⅳ-1～3、Ab-Ⅳ-1、Ab-Ⅳ-3 與 Why/How/What；「8 組」標示意。
# - 複審建議：what.notes 補國語文領綱第五學習階段 Ab-Ⅴ-1「六書的基本原則。」（p.14，逐字），說明完整六書在高中。
