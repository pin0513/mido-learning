idea: 會考國文考「常用字的形音義」，也考「認識基本的造字原則」。多音字要看詞義判斷讀音，再查教育部辭典確認；形近字把兩個字並排，看部件和筆畫差在哪。國中課綱的基本造字原則是象形、指事、會意、形聲；形聲字由表義的意符和表音的音符組成。
guiding_questions:
- 「便宜」的「便」和「方便」的「便」，念法一樣嗎？
scenario: 親子共學：全家各寫下自己最常念錯的兩個多音詞，貼在冰箱上，一週內每念對一次畫一筆。
goal: 辨認形近字、音近字和多音字，用象形、指事、會意、形聲說出一個字的造字原則。
review: 家長從課本挑 10 組形近或多音字（例如「戍／戌」「便宜／方便」），孩子寫出讀音並各造一個詞，再查教育部辭典核對，答對 8 組以上（示意）；再挑 2 個形聲字說出意符和音符。
