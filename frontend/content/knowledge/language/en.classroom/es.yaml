why:
  heading: 先聽懂，才能跟上課
  body:
  - 英語文領綱第二學習階段要學生「能聽懂簡易的日常生活用語」，也要「能妥善運用情境中的非語言訊息以幫助學習」。實施要點提醒，國小聽力教學「宜注重語意理解」，並「利用圖示、肢體動作等視覺輔助，增進學生對語意的掌握」（p.31）。聽指令做動作，就是把聽到的話和動作連起來。
  qa:
    question: 不懂每個字，也能聽懂老師要你做什麼嗎？
    answer: 可以。老師說 Open your books. 時，看老師的手勢和同學的動作，再抓住 open、books 這兩個關鍵字，就能猜出要打開課本。這正是領綱說的運用情境中的非語言訊息。
    source: english
  items_title: 英語文領綱的學習重點
  items:
  - title: 聽懂生活用語
    text: 英語文 1-Ⅱ-9：能聽懂簡易的日常生活用語。
    code: 1-II-9
  - title: 看非語言訊息
    text: 英語文 7-Ⅱ-2：能妥善運用情境中的非語言訊息以幫助學習。
    code: 7-II-2
  - title: 生活溝通
    text: 英語文 B-Ⅱ-1：第二學習階段所學字詞及句型的生活溝通。
    code: B-II-1
