idea: 聽外語時，從語氣、動作和幾個關鍵字就能猜出意思。先抓大意，不用每個字都懂。
guiding_questions:
- 不懂每個字，也能聽懂老師要你做什麼嗎？
scenario: 親子共學：玩「Simon says」：Stand up、Touch your nose、Turn around，大人說、孩子做，再交換。
goal: 聽懂教室與生活裡的簡短英文指令並做出動作。
review: 家長用英文說 10 個指令（Stand up、Open your book……），孩子不看翻譯直接做，至少 8 個做對。
