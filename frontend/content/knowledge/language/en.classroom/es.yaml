how:
  heading: 用 Simon says 練聽
  body:
  - Simon says 是一種兒童遊戲：只有指令前面說了 Simon says 才做。孩子必須仔細聽整句話，不能只看動作。本站建議：先用 Stand up、Sit down、Open your book 這類常用指令，熟了再加快速度。
  items_title: 本站建議的玩法
  items:
  - title: 先示範動作
    text: 大人一邊說一邊做，孩子跟著做。
  - title: 加上規則
    text: 只有聽到 Simon says 才做。
  - title: 只說不做
    text: 大人只說不做，孩子靠聽。
  - title: 互換角色
    text: 孩子當發令的人，練習說指令。
  checklist_title: 每次玩完勾一下
  checklist:
  - 聽懂指令
  - 分得出陷阱
  - 能說出指令
  activity_figure: classroom-flow
  notes:
  - 玩法與指令是本站建議；遊戲規則依 Oxford Learner's Dictionaries 釋義。
  sources:
  - oxf-simon
  - english
what:
  heading: 聽到就能做出反應
  body:
  - 學完後，孩子聽到常用指令能直接做出動作，也分得出哪一句是陷阱。剛開始可以看大人的動作，慢慢改成只靠聽。
  items_title: 學完能做到
  items:
  - title: 聽懂常用指令
    text: Stand up、Sit down 等指令一聽就懂。
  - title: 分辨陷阱
    text: 沒有 Simon says 就不動。
  - title: 說出指令
    text: 能用英文對別人下指令。
  checklist_title: 家長檢核
  checklist:
  - 指令做對
  - 陷阱不上當
  - 能說出指令
  figures:
  - classroom-compare
  notes:
  - 檢核用的 10 個、8 個是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網E-BOT），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - english
  - oxf-simon
  - genai-student
