why:
  heading: 套話換不到真誠
  body:
  - 大考中心說明國寫「為了鼓勵考生寫出自己真誠的思想與感受」，提醒考生「切莫以背誦、套用文章的方式作答」。115 學年度國寫第二大題的評分原則裡，C+ 級的描述是「稍能觸及與對象產生隔閡的原因，然內容空洞」。
  - 生成式 AI 寫出的範文常把漂亮的句子排在一起，卻沒有任何只屬於你的細節。國語文課綱要高中生「運用各種寫作技巧，反覆推敲、修改」，認出套話就是修改的第一步。
  qa:
    question: 「在這個快速變遷的時代」放進任何文章都通嗎？
    answer: 通，但這正是問題：它沒有告訴讀者任何只屬於你的事。換成一個具體的場景，例如「國三那年冬天，我第一次自己搭車去補習班」（示意），讀者才知道你在說什麼。大考中心也提醒，國寫「切莫以背誦、套用文章的方式作答」。
    source: ceec
  items_title: 高中課綱的修改目標
  items:
  - title: 反覆推敲修改
    text: 國語文 6-Ⅴ-5：運用各種寫作技巧，反覆推敲、修改以深化作品的內涵層次，提升藝術價值。
    code: 6-V-5
  - title: 細部描寫
    text: 國語文 Ba-Ⅴ-2：人、事、時、地、物的細部描寫。
    code: Ba-V-2
  sources:
  - ceec
  - ceec-115
  - kuoyu
how:
  heading: 標出套話，換成細節
  body:
  - 先自己寫，再看 AI 範文。教育部的注意事項說，生成式 AI「不能取代自己的思考與判斷，應先自行閱讀與思考，再視需要使用工具輔助」。範文只拿來找套話，不拿來抄。
  items_title: 四種 AI 腔（本站整理）
  items:
  - title: 大時代開頭
    text: 一開頭就談時代、社會，和題目裡的人事沒有關係。
    example: 在這個快速變遷的時代
  - title: 一連串排比
    text: 三四句句型相同的句子排在一起，每句都沒有細節。
  - title: 四平八穩的結論
    text: 結尾說「我們都應該珍惜」之類放進任何文章都通的話。
  - title: 沒有人事時地物
    text: 讀完說不出是誰、在哪裡、發生什麼事。
  checklist_title: 每標一句就問：
  checklist:
  - 換個題目也通嗎
  - 有人事時地物嗎
  - 只有我知道嗎
  - 刪掉或改寫
  activity_figure: how-flow
  sources:
  - genai-student
what:
  heading: 套話與具體細節
  figures:
  - what-compare
  notes:
  - 使用生成式 AI 的規則依教育部注意事項：遵守「各平臺註冊年齡限制」；建議使用為教育目的而設計的工具（如教育部因材網 e度、酷英平臺的 CoolE Bot（注意事項寫作「酷英網E-BOT」）），「非在校使用，亦請家長陪伴使用」；不可以輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；交作業時依老師規定註明工具及用途，不把生成內容當成自己的作品。
  - 「AI 腔」和四種特徵是本站整理的說法；「5 句」「國三那年冬天」是示意。
  sources:
  - genai-student
  - moe-coolebot
  - ceec
