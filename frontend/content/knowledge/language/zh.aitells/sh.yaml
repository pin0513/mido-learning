idea: 常見的 AI 腔（本站整理）：大時代開頭、一連串排比、四平八穩的空泛結論、沒有具體的人事時地物。改法是刪掉放進任何文章都通的句子，換成只有你知道的細節。大考中心提醒國寫考生「切莫以背誦、套用文章的方式作答」。
guiding_questions:
- 「在這個快速變遷的時代」放進任何文章都通嗎？
scenario: 親子共學：家長在教育用的生成式 AI 工具上產生一篇情意寫作範文（不輸入任何個人資料），孩子用螢光筆標出「放進任何文章都通」的句子，再換成自己的經驗；這份練習稿不拿去交作業。
goal: 認出 AI 腔（大時代開頭、空泛排比、四平八穩結論），換成只有自己知道的細節。
review: 孩子在家長產生的 AI 範文上標出 5 句放進任何文章都通的句子（5 句為示意），並各改寫成具體細節；家長讀改寫版，5 處都看得到具體的人事時地物。
