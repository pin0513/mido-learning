why:
  heading: 摘要讓人決定要不要讀
  body:
  - UNC 寫作中心說明，摘要讓可能有興趣的讀者很快判斷長文值不值得花時間讀；摘要不是書評，也不評價原作。
  - Keshav 提醒，多數審稿人和讀者只會讀一遍，所以摘要要簡潔而完整。教育部臺灣學術倫理教育資源中心的指南把摘寫定義為「將參考資料的核心思想或主要論點，用更簡潔的文字概括出來，篇幅一般會比原文簡短許多」。
  qa:
    question: 一篇很長的報告，你能用一段話說清楚嗎？
    answer: 可以，先抓四件事：作者想回答什麼問題、用什麼方法、發現了什麼、作者自己說的限制是什麼。用自己的話各寫一兩句，不加原文沒有的資訊，也不加評論。
    source: unc-abstracts
  items_title: 摘要的四個元素（本站整理）
  items:
  - title: 問題
    text: 作者想回答什麼。
  - title: 方法
    text: 用什麼資料、怎麼做。
  - title: 發現
    text: 最重要的結果。
  - title: 限制
    text: 作者自己寫出的研究限制，不是你的評論（本站建議）。
  sources:
  - unc-abstracts
  - keshav
  - ethics-guide
how:
  heading: 先略讀，再細讀，再摘寫
  body:
  - Keshav 的三遍讀法：第一遍只仔細讀標題、摘要和引言，看各節標題，再讀結論，然後決定要不要往下讀；第二遍更仔細讀，但先跳過證明之類的細節；第三遍才深入理解。
  - 寫摘要時，UNC 寫作中心建議讀完全文後把它放到一邊，不看原文寫一段，再回頭核對；摘要別人的文章不能只靠剪貼原句，也不要加入原文沒有的資訊。
  items_title: 三遍讀法（Keshav）
  items:
  - title: 第一遍
    text: 標題、摘要、引言、各節標題、結論。
  - title: 第二遍
    text: 更仔細讀，先跳過證明之類的細節。
  - title: 第三遍
    text: 需要深入了解時才讀。
  checklist_title: 摘要交出前：
  checklist:
  - 寫了問題
  - 寫了方法
  - 寫了發現
  - 寫了限制
  - 沒有加評論
  activity_figure: how-flow
  sources:
  - keshav
  - unc-abstracts
what:
  heading: 摘要不等於評論
  figures:
  - what-compare
  notes:
  - 用 AI 產生初步摘要時，UNC 寫作中心建議把它當成導讀，再讀全文，找出工具漏掉的重點；指南也說「將撰寫摘要的全部交給生成式AI並不可行」，「AI可以協助整理摘要，但所有的內容必須逐一經過研究者嚴謹的檢視與修訂」。交作業時用了 AI，依課程規定說明用了哪個工具、做了什麼（本站建議）。
  - 未公開的報告、機密資料不要貼進生成式 AI；學術倫理電子報提醒「不要將個人資訊、未公開文件、機密資料等內容輸入到生成式AI的對話框中」。
  - 「約 200 字」是示意；四個元素的分法是本站整理，實際格式與字數依課程或期刊規定。
  sources:
  - unc-ai
  - ethics-guide
  - ethics-epaper13
