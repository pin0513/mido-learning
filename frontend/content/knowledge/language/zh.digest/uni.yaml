# - 引導問題與 goal 的「30 頁」「200 字」是沒標示的示意數字；改成一般說法，字數標示示意並說明依課程或期刊規定。
# - 補依據：Keshav 三遍讀法（先讀標題、摘要、引言、各節標題、結論）；UNC 寫作中心摘要原則（不評論、不加原文沒有的資訊）；學術倫理資源中心指南「摘寫」定義。
# - 安全（中）：AI 產生初步摘要——補指南「將撰寫摘要的全部交給生成式AI並不可行」、讀全文補漏，以及不把未公開文件貼進 AI。
# - 「限制」指作者自己寫出的限制（本站建議），避免和「不加評論」矛盾。補 Why/How/What 與兩張圖。
