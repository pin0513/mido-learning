sources:
- id: unc-abstracts
  title: Abstracts（Writing Center 寫作講義）
  publisher: The Writing Center, University of North Carolina at Chapel Hill
  url: https://writingcenter.unc.edu/tips-and-tools/abstracts/
  accessed: '2026-10-29'
  kind: reference
  supports: 「Abstracts allow readers who may be interested in a longer work to quickly decide whether it is worth their time to read it.」；「An abstract is not a review, nor does it evaluate the work being abstracted.」；How not to write an abstract：「Do not add information not contained in the original work.」；If you are abstracting someone else’s writing：「you cannot summarize key ideas just by cutting and pasting」；Don’t look back：「After reading the entire work, put it aside and write a paragraph about the work without referring to it.」
- id: keshav
  title: How to Read a Paper
  publisher: S. Keshav，University of Waterloo（ACM SIGCOMM Computer Communication Review 發表之講義版，史丹佛大學 EE384M 課程網頁存放）
  url: https://web.stanford.edu/class/ee384m/Handouts/HowtoReadPaper.pdf
  accessed: '2026-10-29'
  kind: reference
  supports: 2.1 第一遍：「1. Carefully read the title, abstract, and introduction」「2. Read the section and sub-section headings, but ignore everything else」「3. Read the conclusions」；「you can expect most reviewers (and readers) to make only one pass over it」，所以要「write concise and comprehensive abstracts」；2.2 第二遍「read the paper with greater care, but ignore details such as proofs」；「The third pass helps you understand the paper in depth.」
- id: ethics-guide
  title: AI世代的學術寫作指南⸺給研究生的參考手冊（電子書）
  publisher: 教育部臺灣學術倫理教育資源中心（手冊註明「本手冊內容僅代表作者觀點，不代表教育部立場」）
  url: https://ethics.moe.edu.tw/files/resource/ebook/file/ebook_05.pdf
  accessed: '2026-10-29'
  kind: reference
  supports: 貳、三 摘寫：「將參考資料的核心思想或主要論點，用更簡潔的文字概括出來，篇幅一般會比原文簡短許多」；常見問題：「將撰寫摘要的全部交給生成式AI並不可行」，「AI可以協助整理摘要，但所有的內容必須逐一經過研究者嚴謹的檢視與修訂」
- id: unc-ai
  title: Generative AI in Academic Writing（Writing Center 寫作講義）
  publisher: The Writing Center, University of North Carolina at Chapel Hill
  url: https://writingcenter.unc.edu/tips-and-tools/generative-ai-in-academic-writing/
  accessed: '2026-10-29'
  kind: reference
  supports: Potential uses—Summarizing longer texts：「You can use the summary as a guide to orient you to the text. After reading the summary, you can read the full text to analyze how the author has shaped the argument, to get the important details, and to capture important points that the tool may have omitted from the summary.」；「Do not input anything you prefer not to have widely shared into an AI generator.」
- id: ethics-epaper13
  title: 大學校園因應生成式AI之指引及教學建議（學術倫理電子報第 13 期）
  publisher: 教育部臺灣學術倫理教育資源中心（2023 年 8 月）
  url: https://ethics.moe.edu.tw/resource/epaper/html/21/
  accessed: '2026-10-29'
  kind: reference
  supports: （三）個人資料保護與資通安全：「研究者應留意，不要將個人資訊、未公開文件、機密資料等內容輸入到生成式AI的對話框中，以避免產生個人隱私洩露的問題。」
