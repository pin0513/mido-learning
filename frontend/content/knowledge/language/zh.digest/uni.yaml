idea: 學術文章有固定結構。先讀標題、摘要、引言與結論，決定要不要細讀；再找研究問題、方法、主要發現與作者寫到的限制。摘要用自己的話，不加入原文沒有的資訊，也不加入自己的評論。
guiding_questions:
- 一篇很長的報告，你能用一段話說清楚嗎？
scenario: 親子共學：大人選一篇工作上可公開的報告、孩子選一篇課堂文章，各寫一段約 200 字（示意）的摘要，交換讀並各提一個問題。
goal: 讀一篇學術或專業長文，寫出一段摘要：問題、方法、發現、限制。
review: 選一篇中文期刊論文或研究報告，寫一段約 200 字（示意）的摘要；家人只讀摘要，就能說出作者的主要發現與一個限制。
