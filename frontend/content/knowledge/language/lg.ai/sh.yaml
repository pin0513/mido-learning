# B5 提案：lg.ai@sh
# - 安全／隱私（高）：原文要孩子把「英文或日文自我介紹」交給 AI 修改；三句自我介紹很容易帶入姓名、學校等個人資料，違反教育部生成式 AI 注意事項（學生版）六（三）「不可以將自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料…輸入」。改成不涉及個資的主題（例如介紹一本喜歡的書），並補年齡限制、家長陪伴與教育用工具（例如酷英平臺的 CoolE Bot）。
# - 英語文 6-Ⅴ-1 和國語文同號（本 repo 的代碼表只以代碼為鍵），依 B3／B4 做法不放進 curriculum_108；7-Ⅴ-2 不和國語文同號，這一版也還沒列入。兩碼都只在內文與來源逐字引用英語文領綱。
# - 補 grades 與 Why/How/What、兩張圖。
