idea: AI 可以陪你對話、改錯、解釋文法，但它也會說錯：教育部的注意事項說這些工具「無法自行判斷結果的正確性和合理性」。要自己先寫、先說，再看 AI 怎麼改，並用字典查證。使用時遵守年齡限制，優先用教育用工具（例如酷英平臺的 CoolE Bot（注意事項寫作「酷英網E-BOT」）），不輸入個人資料。
guiding_questions:
- AI 幫你改好的句子，算是你會了嗎？
scenario: 親子共學：在家長陪伴下，先自己寫三句英文（三句為示意；主題不涉及個人資料，例如介紹一本喜歡的書），再請教育用 AI 工具（例如 CoolE Bot）改；把每個修改分成「我同意」「我要查證」兩類。
goal: 用 AI 當語言陪練：請它扮演對話角色、指出錯誤，並用字典查證它說的對不對。
review: 孩子在家長陪伴下和教育用 AI 工具用英文（或正在學的外語）對話 10 分鐘，不談個人資料，存下 AI 指出的 3 個錯誤，各用字典或文法書查證；家長看到 3 筆查證紀錄（10 分鐘、3 個為示意）。
