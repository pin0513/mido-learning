why:
  heading: 改好的句子不等於學會
  body:
  - 英語文課綱要高中生「能利用工具書（如字典、百科全書）或其他線上資源，主動了解所接觸英文的內容」（7-Ⅴ-2），也要「樂於參與課堂中各類練習活動，不畏犯錯」（6-Ⅴ-1）。AI 是一種線上資源，但不是答案本。
  - 教育部的注意事項說，生成式 AI「不能取代自己的思考與判斷，應先自行閱讀與思考，再視需要使用工具輔助」。
  qa:
    question: AI 幫你改好的句子，算是你會了嗎？
    answer: 還不算。要先自己寫、自己說，看懂 AI 改了哪裡、為什麼改，再用字典確認；下次不靠 AI 也寫得對，才算會了。教育部的注意事項也提醒，生成內容「不宜直接採信」。
    source: genai-student
  items_title: 高中英語文課綱的相關條目
  items:
  - title: 不畏犯錯
    text: 英語文 6-Ⅴ-1：樂於參與課堂中各類練習活動，不畏犯錯。
  - title: 善用工具書與線上資源
    text: 英語文 7-Ⅴ-2：能利用工具書（如字典、百科全書）或其他線上資源，主動了解所接觸英文的內容。
  sources:
  - english
  - genai-student
how:
  heading: 先自己說，再請 AI 陪練
  body:
  - 選一個不涉及個人資料的情境，先自己寫或說，再請 AI 扮演對話角色、指出錯誤（本站建議）。每個修改都分成「我同意」和「我要查證」兩類，查證用字典或文法書。
  items_title: 陪練的做法（本站建議）
  items:
  - title: 請它扮演角色
    text: 例如請 AI 扮演書店店員，你練習問書在哪裡。
    example: 書店店員
  - title: 請它指出錯誤
    text: 請它說明為什麼錯，而不是只給改好的句子。
  - title: 分兩類
    text: 看得懂、說得出理由的放「我同意」；沒把握的放「我要查證」。
  - title: 查字典確認
    text: 用字典或文法書核對「我要查證」的每一項。
  checklist_title: 每次陪練：
  checklist:
  - 先自己寫
  - 不輸入個資
  - 分成兩類
  - 查字典確認
  activity_figure: how-flow
  sources:
  - english
what:
  heading: 我同意與我要查證
  figures:
  - what-compare
  notes:
  - 使用生成式 AI 的規則依教育部注意事項：遵守「各平臺註冊年齡限制」；建議使用為教育目的而設計的工具（如教育部因材網 e度、CoolE Bot），「非在校使用，亦請家長陪伴使用」；不可以輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；交作業時依老師規定註明工具及用途，不把生成內容當成自己的作品。
  - 英語文代碼和國語文代碼同號（例如英語文、國語文都有 6-Ⅴ-1），網站的課綱代碼表只以代碼為鍵，所以本點不列 curriculum_108 代碼，只在內文引用英語文領綱原文。
  - 書店店員、三句英文、10 分鐘、3 個錯誤是示意。
  sources:
  - genai-student
  - moe-coolebot
  - english
