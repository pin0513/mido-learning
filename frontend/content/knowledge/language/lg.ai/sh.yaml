idea: AI 可以陪你對話、改錯、解釋文法，但它也會說錯。要自己先寫、先說，再看 AI 怎麼改，並查證它的說法。
guiding_questions:
- AI 幫你改好的句子，算是你會了嗎？
scenario: 親子共學：先自己寫三句英文或日文自我介紹，再請 AI 改；把每個修改分成「我同意」「我要查證」兩類。
goal: 用 AI 當語言陪練：請它扮演角色、指出錯誤，並查證它說的對不對。
review: 孩子和 AI 用外語對話 10 分鐘，存下 AI 指出的 3 個錯誤，各用字典或文法書查證；家長看到 3 筆查證紀錄。
