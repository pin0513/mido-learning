why:
  heading: 教材第一課就是打招呼
  body:
  - 國際交流基金的日語教材《いろどり》入門（A1），第 1 課第一個能力目標是「人に会ったとき、あいさつをすることができる。」，同一課還有「人にお礼を言ったり、謝ったりすることができる。」會打招呼、道謝、道歉，就能和人開始互動（本站整理）。
  - 國中以後，第二外國語文領綱的一級學習表現有「能聽懂簡易招呼語。」（1-Ⅳ-4）和「能用簡單的招呼語向教師同學打招呼。」（2-Ⅳ-4）；國小沒有日語課綱，本點先打基礎（本站建議）。
  qa:
    question: 日本人見面打招呼時，除了說話還會做什麼？
    answer: 常會鞠躬（おじぎ）。國際交流基金《まるごと》的教師手冊說，問學生「日本ではどうしますか」時，一般的答案是鞠躬，也要說明鞠躬以外的打招呼方式。
    source: marugoto-notes
  items_title: 教材的能力目標
  items:
  - title: 見面打招呼
    text: 《いろどり》Can-do 01：人に会ったとき、あいさつをすることができる。
  - title: 道謝與道歉
    text: 《いろどり》Can-do 03：人にお礼を言ったり、謝ったりすることができる。
  checklist_title: 開始前先確認
  checklist:
  - 聽過こんにちは
  - 願意開口說
  notes:
  - 國小沒有日語的課綱；三至六年級是本站建議的年級。第二外國語文領綱從國中開始（國中由學校在彈性學習課程選開）。
  sources:
  - irodori
  - marugoto-notes
  - sfl
how:
  heading: 看時間選一句招呼
  body:
  - 本站整理：早上說「おはよう」，對老師、長輩、鄰居等大人說「おはようございます」；白天說「こんにちは」；晚上說「こんばんは」。道謝說「ありがとう」或「ありがとうございます」，道歉說「すみません」或「ごめんなさい」。
  - 說的時候看著對方、輕輕鞠躬（本站建議）。「こんにちは」「こんばんは」最後的「は」念成「わ」：文化庁〈現代仮名遣い〉把這兩個詞列在「助詞の『は』は,『は』と書く。」的例子裡（念法是本站整理）。
  items_title: 本站整理的招呼語
  items:
  - title: おはよう
    text: 早上說；對老師、長輩、鄰居等大人說おはようございます。
  - title: こんにちは
    text: 白天見面時說。
  - title: こんばんは
    text: 晚上見面時說。
  - title: ありがとう／すみません
    text: 道謝說ありがとう，道歉說すみません。
  checklist_title: 每天練完勾一下
  checklist:
  - 早上說了
  - 晚上說了
  - 有道謝
  - 有看著對方
  activity_figure: hello-flow
  notes:
  - 招呼語和使用時段是本站整理；《いろどり》第 1 課的生活 TIPS 有「あいさつのジェスチャー」一節。
  sources:
  - kana
  - irodori
what:
  heading: 會用日語打招呼
  body:
  - 學完後，孩子能依早上、白天、晚上選對招呼語，也會用日語道謝和道歉。
  items_title: 學完能做到
  items:
  - title: 選對招呼
    text: 早上、白天、晚上各說一句正確的招呼語。
  - title: 道謝道歉
    text: 會說ありがとう和すみません。
  - title: 配上動作
    text: 看著對方、輕輕鞠躬。
  checklist_title: 家長檢核
  checklist:
  - 三個時段都對
  - 會道謝道歉
  - 有看著對方
  figures:
  - hello-compare
  notes:
  - 檢核的題數與門檻是示意。
  - 本站建議：本點可當作 JLPT N5 的準備；這是本站建議的對應，不是官方換算。JLPT 官網寫 N5 是「基本的な日本語をある程度理解することができる」。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - kana
  - jlpt-levels
  - genai-student
