idea: 日語打招呼會看時間換說法：早上說おはよう，白天說こんにちは，晚上說こんばんは；道謝說ありがとう，道歉說すみません（本站整理）。說的時候輕輕鞠躬，是日本常見的打招呼方式。
guiding_questions:
- 日本人見面打招呼時，除了說話還會做什麼？
- 「こんにちは」最後一個字為什麼寫「は」？
scenario: 親子共學：一週裡全家早上互說「おはよう」、晚上互說「こんばんは」，收到東西時說「ありがとう」；週末說說哪一句最順口（一週是示意）。
goal: 用日語在早上、白天、晚上打招呼，並會用日語道謝、道歉。
review: 家長扮演鄰居（鄰居是大人，早上要說おはようございます），分別在早上、白天、晚上的情境打招呼，孩子各回一句正確的招呼語，再說一次謝謝和對不起；5 句至少 4 句對（題數與門檻是示意）。
