idea: おはよう、こんにちは、ありがとう——先學幾句招呼語，再配上鞠躬，就能感受日語的禮貌習慣。
guiding_questions:
- 日本人見面時，為什麼常常要鞠躬？
scenario: 親子共學：一週裡全家早上用「おはよう」、吃飯前說「いただきます」，週末說說哪一句最順口。
goal: 用日語打招呼、道謝、道歉，知道早上、白天、晚上說法不同。
review: 家長扮演鄰居在三個時段打招呼，孩子各回一句正確的招呼語，再說一次謝謝和對不起；5 句都對。
