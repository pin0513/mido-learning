- 已補出處：課綱只寫「再用反拼法複習」，沒有定義反拼法。國家教育研究院「臺灣教育研究資訊網」典藏的李碧霞〈從兒童認知發展談「注音符號」教學〉（《語文教學》p.16）說反拼是聽到國音的「音」，就能想出注音符號的「形體」，「注出正確的字音」；《教育大辭書》「注音符號直接教學法」也把「正拼式和反拼式」列為練習方式（2026-10-30 讀取）。
