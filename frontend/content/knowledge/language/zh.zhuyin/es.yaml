  notes:
  - 一聲、二聲、三聲、四聲的調號，標在字音最後一個符號的右上角。
  - 一聲的「ˉ」注音時可以省略不標。
  - 輕聲的圓點「˙」：橫式寫在第一個符號前面，直式寫在字音上方。
  - 「嗎」念輕聲時是助詞，表示疑問的語氣，例如「好嗎」。
  sources:
