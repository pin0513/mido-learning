why:
  heading: 看懂一個字怎麼念
  body:
  - 國字常常看不出怎麼念。注音把一個字的讀音拆開，一個聲音配一個符號，孩子看到符號，就能自己拼出讀音。
  - 所以課綱把注音符號教學排在一年級的前十週，並希望在二年級結束（第一學習階段結束）前熟練應用。課綱也建議編教材時，可考慮讓一到四年級（第一、二學習階段）的課文全文附注音。
  figures:
  - why-compare
  qa:
    question: 「ㄅㄚˇ」和「ㄅㄚˋ」只差一個小記號，意思一樣嗎？
    answer: 不一樣。聲符、韻符都相同，只換了聲調，就是不同的讀音：「把門關上」的把念 ㄅㄚˇ，「爸爸」的爸念 ㄅㄚˋ。有些字不只一種讀音（「刀把」的把念 ㄅㄚˋ），所以要連著詞語一起看。
    source: dict-ba
  items_title: 會拼注音以後，孩子可以
  items:
  - title: 自己讀注音讀物
    text: 利用注音讀物學習閱讀，享受閱讀樂趣。
    code: 3-I-4
  - title: 用注音寫下想法
    text: 還不會寫的字，先用注音記下來。
    code: 3-I-3
  - title: 查字典、找資料
    text: 三、四年級起，用注音檢索資訊、吸收新知。
    code: 3-II-2
  sources:
  - kuoyu
  - zonggang
  - dict-ba
  - dict-dad
how:
  heading: 先直接拼，再拆開聽
  body:
  - 課綱建議用「直接拼讀法」：學生看到注音符號，直接讀出字音，再用「反拼法」複習。教育大辭書的說明是：直接拼讀法略去聲符、韻符、聲調的分讀和一一拼合（又稱暗拼法）。課綱沒有細寫反拼法怎麼做；國家教育研究院典藏的注音教學文章說，反拼是聽到字音，就能想出符號、「注出正確的字音」。本站的練習照這個意思：聽到字音，拆回符號寫下來。
  items:
  - title: 直接拼讀
    example: ㄅㄚˋ → 爸
    text: 看符號，一口氣念出字音。
  - title: 反拼複習
    example: 爸 → ㄅ ㄚ ˋ
    text: 聽字音，拆回聲符、韻符、聲調。
  checklist_title: 練習時，大人留意這四件事：
  checklist:
  - 發音部位
  - 口腔開合
  - 嘴唇圓或展
  - 聲調高低
  activity_figure: how-flow
  sources:
  - kuoyu
  - pedia-zhipin
  - teric-zhuyin
what:
  heading: 37 個符號，拼成一個字
  figures:
