  - toeic-handbook
how:
  heading: 按 Part 找弱點
  body:
  - 正式成績聽力、閱讀各 5–495 分；ETS 的 CEFR 最低分是聽力 275、閱讀 275 為 B1，聽力 400、閱讀 385 為 B2，ETS 說這些只是參考（guidelines）。聽力約 45 分鐘、閱讀 75 分鐘，共 200 題（ETS）。本站建議：做完模擬題不要只看總分，按 Part 記下錯題，看是哪一類題目錯最多，下週就先補那一類。
  - 閱讀時間緊，可以練習先看題目再找答案；有逐字稿時，聽力錯題回頭看逐字稿，找出沒聽懂的字（本站建議）。
  - 用 AI 幫忙時，照學術倫理電子報的提醒做：不貼個人資訊、未公開文件或機密資料，AI 的輸出自己查證，內容自己寫，不把 AI 生成的內容直接交出去。本站建議：交作業時依課程規定說明用了哪個工具、做了什麼。
  items_title: 本站建議的練法
  items:
  - title: 做官方模擬題
    text: 照正式時間做完。
  - title: 按 Part 記錯題
    text: 找出錯最多的一類。
  - title: 先補弱項
    text: 下週先練那一類。
  - title: 聽力看逐字稿
    text: 有逐字稿時，找出沒聽懂的字。
  checklist_title: 每回模擬後
  checklist:
  - 記下分數或答對數
  - 按 Part 記錯題
  - 訂好下週重點
