idea: 多益聽讀測驗由 ETS 舉辦，量的是在國際環境工作的人日常用到的英文。聽力、閱讀各 100 題、各 5–495 分，不分及格與否。ETS 公布 CEFR 對照分數，但說這些分數只是參考，不建議當成硬性門檻。
guiding_questions:
- 履歷上的多益分數，代表你在工作上能做什麼？
scenario: 親子共學：大人和大學生各做一回官方模擬題，按 Part 記下錯題，對照 CEFR 表，各寫下下一階段（例如三個月，示意）的目標與每週練習計畫。
goal: 看懂多益聽讀分數與 ETS 的 CEFR 對照，用官方模擬題按 Part 找出弱點，訂出下一步。
review: 做一回官方多益聽讀模擬題，模擬題有換算分數就記下聽力與閱讀分數（正式成績各 5–495），沒有就記答對數，並按 Part 記錯題；對照 ETS 公布的 CEFR 最低分數：聽力 275、閱讀 275 是 B1；聽力 400、閱讀 385 是 B2。家人看分數與對照表打勾。模擬分數只供參考，不是正式成績。
