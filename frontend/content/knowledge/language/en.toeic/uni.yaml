- id: toeic-sug
  title: TOEIC Listening & Reading Test Score User Guide
  publisher: ETS（Educational Testing Service）
  url: https://www.ets.org/pdfs/toeic/toeic-listening-reading-score-user-guide.pdf
  accessed: '2026-10-29'
  kind: exam
  supports: 「It measures the everyday English skills of people working in an international environment」；Listening 100 題約 45 分鐘（Part 1 Photographs 6、Part 2 Question–Response 25、Part 3 Conversations 39、Part 4 Talks 30），Reading 100 題 75 分鐘（Part 5 Incomplete Sentences 30、Part 6 Text Completion 16、Part VII（Single Passage 29、Multiple Passages 25））；「converted to a number on a scale of 5 to 495」；「not the type of test that awards a pass or fail grade」；CEFR 對照表 Listening B1 275、B2 400、C1 490，Reading B1 275、B2 385、C1 455*（表下另有星號說明）；「they should be considered guidelines, as ETS does not recommend the use of rigid cut scores.」
