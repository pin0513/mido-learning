verify_notes:
- 待核對：大學不對應 108 課綱，以學門路徑對應。
- 英文以全民英檢、美國小學／中學讀本、多益、托福為主要基準，108 課綱英語文為次要對照；學段與檢定的對應是本站的學習建議，不是官方換算。
- 基準標籤：多益聽讀 B1→B2。
- 引用的框架只寫名稱（TOEIC Listening and Reading（ETS）），教材內容是改寫的入門說明，上線前請核對原始出處的用語。
- 本點為這次補強新增，內容尚未經老師審閱。
- CEFR 對應分數取自 ETS《TOEIC Listening and Reading Score User Guide》https://www.ets.org/pdfs/toeic/toeic-listening-reading-score-user-guide.pdf（2026-10-27 讀取）；ETS 說明這些是建議的最低分數，不建議當硬性切分點。
