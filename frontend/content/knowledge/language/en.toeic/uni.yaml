idea: 多益（TOEIC）由 ETS 出題，聽讀測驗用職場與日常情境量英文能力，兩項各 5–495 分。ETS 把分數對照 CEFR，但提醒這些是參考門檻，不是硬性的切分點。多益測的是職場溝通，不是學術英文；要申請國外大學，下一步是托福。
guiding_questions:
- 履歷上的多益分數，代表你在工作上能做什麼？
scenario: 親子共學：大人和大學生各做一回模擬題，對照 CEFR 表，各寫下三個月後的目標分數與每週練習計畫。
goal: 用多益聽讀測驗量出職場英文的程度，並對照 CEFR 訂出下一步。
review: 做一回官方多益聽讀模擬題，記下聽力與閱讀分數（各 5–495），對照 ETS 公布的 CEFR 最低分數：聽力 275、閱讀 275 是 B1；聽力 400、閱讀 385 是 B2。家人看分數與對照表打勾。
