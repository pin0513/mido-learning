  - ethics-epaper13
what:
  heading: 看懂分數，訂出下一步
  body:
  - 學完後，能看懂多益聽讀分數與 ETS 的 CEFR 對照，並依錯題訂出下一步的練習重點。
  items_title: 學完能做到
  items:
  - title: 看懂分數
    text: 聽讀各 5–495，對照 CEFR。
  - title: 找出弱點
    text: 說出錯最多的 Part。
  - title: 訂出計畫
    text: 下一階段的目標與練法。
  checklist_title: 家人檢核
  checklist:
  - 對照表打勾
  - 有練習計畫
  figures:
  - toeic-compare
  notes:
  - 把大學階段對應多益、托福是本站建議，不是官方換算；檢定題型與分數依 ETS 官方說明。
  - 多益聽讀量職場與日常的聽讀，托福量學術英文四項；想出國讀書再準備托福是本站建議。情境的三個月是示意。
  - 模擬題分數只供參考，不是正式成績；AI 工具給的分數也不是 ETS 的成績。
  - 用生成式 AI 時，不要把個人資訊、未公開文件、機密資料貼進去（教育部臺灣學術倫理教育資源中心 2023 年的電子報）；AI 的輸出要自己查證。這份 2023 年的電子報也說，學術界對使用生成式 AI 是否需要標註「尚無統一的規定」，建議先了解相關單位的政策；不要把 AI 生成的內容直接當成自己寫的交出去，電子報提醒，直接使用生成的內容而非親自撰寫，「還可能有代寫的學術倫理問題」；交作業時依課程規定說明用了哪個工具、做了什麼；AI 規定變化快，以學校和課程最新的規定為準（本站建議）。
  sources:
  - toeic-sug
  - ethics-epaper13
