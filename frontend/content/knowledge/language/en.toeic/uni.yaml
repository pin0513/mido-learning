why:
  heading: 分數代表能做什麼
  body:
  - ETS 說多益聽讀測驗「measures the everyday English skills of people working in an international environment」，而且「not the type of test that awards a pass or fail grade」。
  - '職場情境包括「Offices: board meetings, committees, letters, memoranda, telephone, fax and e-mail messages」等。ETS 也提醒 CEFR 對照分數「they should be considered guidelines, as ETS does not recommend the use of rigid cut scores.」'
  qa:
    question: 履歷上的多益分數，代表你在工作上能做什麼？
    answer: 可以對照 ETS 的 CEFR 表，例如聽力 400、閱讀 385 以上對應 B2；但 ETS 說這些只是參考，分數也只量聽和讀，不代表口說和寫作（本站整理）。
    source: toeic-sug
  items_title: 聽讀七個 Part（ETS）
  items:
  - title: Part 1–2
    text: 看照片選描述、聽問句選回應。
  - title: Part 3–4
    text: 聽對話與短講，回答問題。
  - title: Part 5–6
    text: 句子與短文填空。
  - title: Part 7
    text: 單篇與多篇閱讀理解。
  checklist_title: 開始前先確認
  checklist:
  - 用官方模擬題
  - 準備錯題表
  sources:
