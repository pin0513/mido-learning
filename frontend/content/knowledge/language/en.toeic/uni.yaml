# B8 提案：en.toeic@uni
# - 補 Why/How/What 與兩張圖。題型、分數與 CEFR 對照依 ETS〈TOEIC Listening and Reading Test User Guide〉，並補上 ETS 說對照分數只是「guidelines」、不建議當成硬性門檻，也不是及格／不及格的考試。
# - 檢核改成：官方模擬題分數只供參考，重點是按 Part 記錯題找弱點；家人看對照表打勾保留。
# - 情境「三個月後」標示意；「多益之後可以考托福」改標本站建議並說明兩者用途不同；刪除過時的「尚未經老師審閱」；大學對應多益標為本站建議（顯示在 notes）。
# - 第一輪獨立審查修正：流程圖 alt 原寫「再做一回」，和第 4 步「家人看對照表」不符，改成一致；goal 從「量出程度」改成看懂分數、找弱點、訂下一步；檢核改成模擬題有換算分數才記分數，否則記答對數。
# - 第二輪獨立審查修正：（建議項）toeic-sug supports 補 5–495 原文、Part VII 改原文題型；How 的逐字稿改「有逐字稿時」。
# - 第三輪獨立審查修正：goal／What「5–495、CEFR 對照」只在 idea／Why，How 第一段開頭補正式成績範圍與 ETS 的 CEFR 最低分（toeic-sug 已在 how.sources）；How items「聽力看逐字稿」補「有逐字稿時」；How checklist「記下分數」補「或答對數」。
# - 第五輪獨立審查修正：What notes 的 AI 注意事項補「不代寫」（學術倫理電子報（二）著作權「還可能有代寫的學術倫理問題」；是電子報的提醒，不寫成硬規定），ethics-epaper13 supports 補（二）著作權整句（2026-10-29 重抓逐字核對）；How body 補 AI 使用說明（不貼機密、自己查證、自己寫、說明工具），how.sources 加 ethics-epaper13，讓 What 的注意事項在 How 有教到。
# - 第六輪獨立審查修正：（阻擋 R-1）How 的 AI 段落改寫：刪掉和 What notes 重複的電子報引文、合併自我重複的「自己寫／不直接交出去」；不貼個資與未公開文件或機密資料（電子報（三））、輸出自己查證（（一））、內容自己寫（（二））歸給電子報，只有「依課程規定說明用了哪個工具」標本站建議。
