idea: 日本語能力試験（JLPT）分 N1 到 N5，官網用「読む」「聞く」描述每一級的認定の目安。合格要總分達到合格点，而且每個得点区分都達到基準点。JLPT 目前沒有會話和作文的考試，所以說和寫要另外練。
guiding_questions:
- N4 和 N3 差在哪？你想把哪一級當目標？
scenario: 親子共學：一起打開 JLPT 官網的認定の目安，讀 N4 和 N3 的說明，選一級當目標，再做那一級的官方問題例，寫下最弱的一項，最後把目標和練習計畫說給老師或同學聽（本站建議）。
goal: 讀懂 JLPT N4、N3 的認定の目安和合格規則，選一級當目標，做一回該級的官方問題例並找出最弱的一項。
review: 孩子讀 JLPT 官網 N4 和 N3 的認定の目安，說出兩級的差別和合格要滿足的兩個條件；選出目標級數，做一回該級的官方問題例，寫下最弱的一項；家長看紀錄打勾。
