idea: 日本語能力試驗（JLPT）從 N5 到 N1 分五級。它是一把尺，幫你看出自己會什麼、下一步要補什麼。
guiding_questions:
- N5 和 N3 差在哪？一年後你想到哪一級？
scenario: 親子共學：做一份 N5 模擬題，對照結果訂出接下來三個月每週要練的內容。
goal: 對照 JLPT 各級的能力說明，選一級當目標並做一回官方練習題。
review: 孩子讀 JLPT 官方的各級認定標準，選出目標級數（例如 N4 或 N3），做一回官方練習題並寫下最弱的一項；家長看練習結果打勾。
