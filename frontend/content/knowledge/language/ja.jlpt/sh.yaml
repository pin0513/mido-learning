why:
  heading: 把目標說清楚
  body:
  - 第二外國語文領綱的四級學習表現有「能主動從網路搜尋所需資源，並與教師同學分享。」（6-Ⅴ-16），學習內容有「語言能力。」（Bn-Ⅴ-4）。領綱也註明三級相當於 CEFR A2-1、四級相當於 CEFR A2-2。
  - JLPT 官網說，這個考試「原則として日本語を母語としない人を対象に、日本語能力を測定し、認定することを目的としています。」各級認定の目安用「読む」「聞く」表示。
  items_title: 第二外國語文領綱的學習重點
  items:
  - title: 搜尋資源並分享
    text: 第二外國語文 6-Ⅴ-16：能主動從網路搜尋所需資源，並與教師同學分享。
    code: 6-V-16
  - title: 語言能力
    text: 第二外國語文 Bn-Ⅴ-4：語言能力。
    code: Bn-V-4
  checklist_title: 開始前先確認
  checklist:
  - 會讀假名
  - 能上官網
  notes:
  - 第二外國語文的Ⅴ代表語文程度三級、四級，不是年級；高中由學校在加深加廣選修、多元選修或校訂課程開設，不是每校都有。本點對到三級、四級是本站建議。
  sources:
  - sfl
  - jlpt-purpose
  - jlpt-levels
how:
  heading: 讀目安、懂合格、做問題例
  body:
  - JLPT 官網〈得点区分・合否判定・結果通知〉：N1、N2、N3 分「言語知識（文字・語彙・文法）」「読解」「聴解」三個得点区分；N4、N5 分「言語知識（文字・語彙・文法）・読解」和「聴解」兩個。合格要「①総合得点が合格に必要な点（＝合格点）以上であること」，而且每個得点区分都達到基準点；「一つでも基準点に達していない得点区分がある場合は、総合得点がどんなに高くても不合格になります。」
  - 本站建議的四步：讀目標級數的認定の目安→到官網問題例做一回→依得点区分記下最弱的一項→把目標和練習計畫跟老師或同學分享。官網說「問題例から、日本語能力試験の問題の形式がわかります。」，也提醒「試験のときの問題用紙とちがうところがあります。」問題例不是模擬考，不能換算成分數（本站整理）。
  qa:
    question: N4 和 N3 差在哪？你想把哪一級當目標？
    answer: 官網說 N4 是「基本的な日本語を理解することができる」，N3 是「日常的な場面で使われる日本語をある程度理解することができる」。聽的部分，N4 是「ややゆっくりと話される会話」，N3 是「やや自然に近いスピードのまとまりのある会話」。目標選哪一級，看你現在讀、聽的程度（本站建議）。
    source: jlpt-levels
  items_title: 官網的合格點（總分 0～180）
  items:
  - title: N1～N3
    text: 合格点 N1 100、N2 90、N3 95；三個得点区分的基準点都是 19（範圍 0～60）。
  - title: N4、N5
    text: 合格点 N4 90、N5 80；言語知識・読解的基準点 38（0～120），聴解 19（0～60）。
  - title: 沒有會話作文
    text: 官網常見問題回答：「いいえ、今のところ、どちらもありません。」
  - title: 官方問題例
    text: 「Ｎ１からＮ５まで、レベル別になっています。」
  checklist_title: 每次練完勾一下
  checklist:
  - 讀了兩級目安
  - 做了問題例
  - 記下最弱項
  - 和老師或同學分享
  activity_figure: jlpt-flow
  sources:
  - jlpt-results
  - jlpt-faq
  - jlpt-samples
what:
  heading: 選好目標，知道怎麼算合格
  body:
  - 學完後，孩子能說出 JLPT N4 和 N3 的差別和合格的兩個條件，選一級當目標，做一回官方問題例並找出最弱的一項。
  items_title: 學完能做到
  items:
  - title: 讀懂目安
    text: 說出 N4 和 N3 的差別。
  - title: 說出合格規則
    text: 合格点和基準点都要達到。
  - title: 找出弱項
    text: 做問題例，記下最弱的一項。
  checklist_title: 家長檢核
  checklist:
  - 說得出兩級差別
  - 說得出合格規則
  - 有問題例紀錄
  figures:
  - jlpt-compare
  notes:
  - 本站建議：本點可當作 JLPT N4 到 N3 的準備；這是本站建議的對應，不是官方換算。JLPT 官網寫 N4 是「基本的な日本語を理解することができる」，N3 是「日常的な場面で使われる日本語をある程度理解することができる」。
  - JLPT 官網常見問題說，它測的「言語知識」「読解」「聴解」對應 CEFR 的「言語能力」和「受容活動能力（読む・聞く）」，不含說、寫和やりとり；說和寫要另外練（本站建議）。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，其他商用工具「應經由學校評估資安風險」，並在師長指導下使用；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料，自己或別人的錄音也不上傳（本站建議）；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - jlpt-results
  - jlpt-faq
  - genai-student
