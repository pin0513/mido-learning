goal: 寫社群文案：先決定目的與對象，第一句說重點，行動呼籲具體，並確認用的圖可以用。
review: 孩子寫同一活動的「求讚版」與「找人報名版」兩則 100 字貼文（100 字為示意），家長能說出兩則的目的差別，報名版有具體的時間與方法，而且用到的圖是自己拍、自己畫或已取得授權。
