idea: 社群文案先決定目的與對象，第一句就說重點，行動呼籲要具體（本站建議）。不誇大；用別人的圖要先取得授權，只標來源不夠：智慧財產局說，不屬於合理使用時「縱註明出處，亦無法免除著作權侵權責任」。
