why:
  heading: 貼文是要讓人做一件事
  body:
  - 國語文課綱要高中生「深化寫作能力，根據生活的需求撰寫各類文本」。社群貼文是生活裡最常寫的文本之一。
  - 教育部媒體素養白皮書把「創造」能力寫成「創造具實質意涵、符合需求之媒體與資訊，並向他人自信表達自我目的之能力」，也把「理解著作權並運用於內容製作之能力」列為學習主題。
  qa:
    question: 一則貼文要讓人按讚，還是讓人去做一件事？
    answer: 先決定目的再寫：求讚和找人報名是兩種不同的貼文（本站建議）。媒體素養白皮書說的「創造」能力，就是做出「符合需求」的內容，並「向他人自信表達自我目的」。
    source: moe-medialit
  items_title: 課綱與白皮書的相關目標
  items:
  - title: 根據需求撰寫
    text: 國語文 6-Ⅴ-1：深化寫作能力，根據生活的需求撰寫各類文本。
    code: 6-V-1
  - title: 負責任地傳播
    text: 教育部媒體素養白皮書能力學習面向：能夠以符合倫理及負責任態度傳播資訊與媒體內容。
  sources:
  - kuoyu
  - moe-medialit
how:
  heading: 目的、對象、第一句、行動
  body:
  - 寫之前先用一句話寫下目的和對象，第一句就說重點，最後告訴讀者具體要做什麼（本站建議）。
  items_title: 寫社群文案（本站建議）
  items:
  - title: 先定目的
    text: 求讚、找人報名、說明資訊，三種寫法不同。
  - title: 第一句說重點
    text: 滑過去的人只看第一句。
  - title: 行動呼籲要具體
    text: 寫清楚時間、地點和報名方法。
    example: 週五前填表單報名
  - title: 不誇大
    text: 不寫做不到或無法證實的話。
  checklist_title: 發文前：
  checklist:
  - 目的一句話
  - 寫給誰
  - 第一句是重點
  - 有時間與方法
  - 圖可以用
  activity_figure: how-flow
  sources:
  - moe-medialit
what:
  heading: 標了來源，不等於能用
  figures:
  - what-compare
  notes:
  - 智慧財產局函釋：網路上的圖片如有原創性與創作性就受著作權保護，下載或截圖分享到社群平台，除合理使用外「應取得著作財產權人之同意或授權」；註明出處只是主張合理使用時的義務。最安全的做法是用自己拍、自己畫的圖，或先取得授權（本站建議）。
  - 「100 字」「週五前填表單報名」是示意。
  sources:
  - tipo-1130410
