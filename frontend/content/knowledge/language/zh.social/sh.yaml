# - 著作權（中）：原文「不用別人的圖不標來源」暗示「標了來源就能用」。經濟部智慧財產局函釋：把圖片下載或截圖分享到社群平台，除合理使用外「應取得著作財產權人之同意或授權」，而且「縱註明出處，亦無法免除著作權侵權責任」。已改寫。
