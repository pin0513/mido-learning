idea: 社群文案先決定目的與對象，第一句就說重點，行動呼籲要具體。不誇大、不用別人的圖不標來源。
guiding_questions:
- 一則貼文要讓人按讚，還是讓人去做一件事？
scenario: 親子共學：替社團或自主學習成果寫一則 100 字貼文，各寫「求讚」版和「找人參加」版，比較差別。
goal: 寫社群文案：先決定目的與對象，第一句說重點，行動呼籲具體。
review: 孩子寫同一活動的「求讚版」與「找人報名版」兩則 100 字貼文，家長能說出兩則的目的差別，且報名版有具體的時間與方法。
