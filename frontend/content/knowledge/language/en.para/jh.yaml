idea: 一段英文通常先用一句話說重點（主題句），再用兩三句細節支持，最後收尾。
guiding_questions:
- 寫週末日記，第一句要先寫什麼？
scenario: 親子共學：用 5 句英文寫「我的週末」：第一句說整體感覺，中間三句寫做了什麼，最後一句說下週想做什麼。
goal: 寫出正確的單句（改寫、合併、重組），再寫一段有主題句與細節的短文。
review: 家長從全民英檢初級官方寫作練習選 5 題單句寫作和 1 題看圖表寫段落，孩子 40 分鐘內完成；單句至少 4 題全對，段落回答了題目所有提問。
