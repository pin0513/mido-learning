idea: 一段英文常見的寫法是先用一句話說重點（主題句），再用幾句細節支持，最後用一句話收尾（總結句）（本站整理）。英語文領綱要學生閱讀段落時「能判斷主題句及總結句」，寫作則從合併、改寫句子，一步步練到寫簡單的段落。
guiding_questions:
- 寫週末日記，第一句要先寫什麼？
scenario: 親子共學：用 5 句（示意）英文寫「我的週末」：第一句說整體感覺，中間三句（示意）寫做了什麼，最後一句說下週想做什麼。
goal: 寫出正確的單句（改寫、合併、重組），再寫一段有主題句與細節的短文。
review: 家長從全民英檢初級官方寫作練習題選一回（單句寫作 15 題＋段落寫作 1 篇），孩子在官方的 40 分鐘內完成；單句至少 8 成全對，段落描寫了圖片情節、重點表達完整（8 成是示意）。只做部分題目時，時間按比例縮短（示意）。
