why:
  heading: 先說重點，再給細節
  body:
  - 英語文領綱第四學習階段要學生「能依提示書寫簡短的段落」。實施要點說，閱讀段落時「也應該能判斷主題句及總結句，分析段落發展模式」（p.29）；寫作則「應循序漸進從合併、改寫、完成句子、回答問題、造句到書寫簡單的段落」（p.32）。全民英檢初級的寫作能力也是能寫簡單的句子及段落。
  qa:
    question: 寫週末日記，第一句要先寫什麼？
    answer: 先寫主題句，用一句話說這個週末整體怎麼樣，例如 I had a busy weekend.；後面再寫做了哪些事，最後一句收尾。
    source: english
  items_title: 英語文領綱的學習重點
  items:
  - title: 依提示寫段落
    text: 英語文 4-Ⅳ-8：能依提示書寫簡短的段落。
    code: 4-IV-8
  - title: 主題句和總結句
    text: 閱讀段落時能判斷主題句及總結句（領綱實施要點 p.29）。
  - title: 由句子到段落
    text: 從合併、改寫、完成句子到書寫簡單的段落（p.32）。
  checklist_title: 開始前先確認
  checklist:
  - 會寫完整句子
  - 會用 and、but
  sources:
  - english
  - gept-elementary
how:
  heading: 主題句、細節、收尾
  body:
  - 本站建議：寫段落前，先用全民英檢初級官方練習題練單句寫作（句子改寫、句子合併、重組），寫完對答案改錯。
  - 本站建議：寫之前先列出要說的重點和三件細節；第一句寫主題句，中間每句寫一件細節，最後一句收尾。寫完再檢查大小寫、標點和動詞時式。
  items_title: 本站建議的步驟
  items:
  - title: 列重點
    text: 先用中文或英文列出要說什麼。
  - title: 寫主題句
    text: 一句話說整段的重點。
  - title: 寫細節
    text: 每句寫一件支持重點的事。
  - title: 寫收尾
    text: 最後一句總結或說感想。
  checklist_title: 寫完檢查
  checklist:
  - 有主題句
  - 細節支持重點
  - 有收尾句
  - 大小寫標點對
  activity_figure: para-flow
  notes:
  - 步驟是本站建議；主題句、總結句的說法依英語文領綱實施要點。
  sources:
  - english
  - gept-elementary
what:
  heading: 寫出一段有重點的短文
  body:
  - 學完後，孩子能寫出正確的單句（改寫、合併、重組），也能看圖寫一段有主題句和細節的短文。全民英檢初級寫作共 16 題、40 分鐘：單句寫作（句子改寫、句子合併、重組）占 50%，段落寫作是「寫一篇約50字的文章描寫圖片的情節」，占 50%。
  items_title: 學完能做到
  items:
  - title: 寫對單句
    text: 完成改寫、合併、重組。
  - title: 寫出段落
    text: 有主題句、細節和收尾。
  - title: 看圖寫作
    text: 寫約 50 字描寫圖片的情節。
  checklist_title: 家長檢核
  checklist:
  - 單句寫對
  - 段落有主題句
  - 描寫了圖片
  figures:
  - para-compare
  notes:
  - 國中對應全民英檢初級是本站建議，不是官方換算。
  - 「8 成」與按比例縮短的時間是示意；16 題、40 分鐘是官方形式。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網E-BOT），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去。
  sources:
  - gept-elementary
  - genai-student
