# B7 提案：en.para@jh
# - 補 grades、英語文 4-Ⅳ-8 與 Why/How/What、兩張圖；主題句、總結句依英語文領綱實施要點（p.29），寫作由句子到段落的順序依教學要領（p.32）。
# - 錯誤修正：原檢核「選 5 題單句寫作和 1 題看圖表寫段落，40 分鐘內完成」把官方整份寫作的時間套在部分題目上。官方寫作是 16 題、40 分鐘（單句寫作 15 題＋段落寫作 1 篇，各占 50%），段落寫作是「寫一篇約50字的文章描寫圖片的情節」；檢核改成完整一回，或明說只做部分時時間按比例（示意）。原「段落回答了題目所有提問」與官方題型不符，改成描寫圖片情節並表達完整。
# - AI 只能指出錯誤，不能代寫，依教育部學生版注意事項。
