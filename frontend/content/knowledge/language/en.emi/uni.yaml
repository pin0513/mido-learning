idea: 大學的全英語授課（EMI）重點在學專業，不在英文本身：課前先讀術語、課中抓架構、課後用英文討論。
guiding_questions:
- 用英文上專業課，聽不懂術語怎麼辦？
scenario: 親子共學：挑一堂公開的英文大學課程影片，課前列 10 個術語，看完用英文寫三句重點。
goal: 上全英語授課（EMI）：課前讀術語、課中抓架構、課後用英文討論。
review: 看一堂公開的英文大學課程影片，課前列 10 個術語，看完用英文寫 3 句重點並錄 1 分鐘口頭摘要；家人對照影片確認重點正確。
