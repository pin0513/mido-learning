idea: 大學的全英語授課（EMI）是「以英語為知識傳遞的媒介，教授各專業領域知識」，重點在學專業，不在英文本身。本站建議：課前先讀術語、課中抓架構做筆記、課後用英文摘要和討論。
guiding_questions:
- 用英文上專業課，聽不懂術語怎麼辦？
scenario: 親子共學：挑一堂公開的英文大學課程影片，課前列出術語（例如 10 個，示意），看完用英文寫三句重點（示意）。
goal: 上全英語授課（EMI）：課前讀術語、課中抓架構，課後用英文寫重點並提出問題。
review: 看一堂公開的英文大學課程影片，課前列 10 個術語，看完用英文寫 3 句重點、提出 1 個問題，並錄 1 分鐘口頭摘要；家人對照影片確認重點正確（錄音只留在自己的裝置、不上傳，本站建議；10 個、3 句、1 個、1 分鐘是示意）。
