# B8 提案：en.emi@uni
# - 補 Why/How/What 與兩張圖。EMI 的意思改依教育部大專校院學生雙語化學習計畫：「以英語為知識傳遞的媒介，教授各專業領域知識」。
# - 補教育部 2021 年新聞稿：CEFR B2 被視為修習全英語課程的基本能力；上課筆記、課堂討論改依 CEFR 補充版 Note-taking、Formal discussion 量表。
# - 檢核的 10 個術語、3 句、1 分鐘標示意；課前、課中、課後的做法標本站建議；大學對應托福標為本站建議（顯示在 notes）。
# - 第一輪獨立審查修正：items_title 改成「和 EMI 相關的 CEFR 描述（本站整理）」——CEFR 沒有「EMI 課需要的能力」這種說法；引用的描述標出量表程度（Note-taking B1、B2，Formal discussion B2，已對照 CEFR 補充版 PDF 頁面核對），補 B2 筆記描述；本點沒有托福事實，刪 toefl-content 來源；goal 與檢核補「提出一個問題」，對齊 How。
# - 第二輪獨立審查修正：檢核要「錄 1 分鐘口頭摘要」，How 補「再看著重點用英文口頭說一遍（例如 1 分鐘，示意）」；「B1 起點、B2 目標」是建議，標籤改本站建議。
# - 第五輪獨立審查修正：（建議項）檢核的 1 分鐘口頭摘要補「錄音只留在自己的裝置、不上傳」（本站建議）。 What notes 的 AI 注意事項補「不代寫」（學術倫理電子報（二）著作權「還可能有代寫的學術倫理問題」；是電子報的提醒，不寫成硬規定），ethics-epaper13 supports 補（二）著作權整句（2026-10-29 重抓逐字核對）；How body 補 AI 使用說明（不貼機密、自己查證、自己寫、說明工具），how.sources 加 ethics-epaper13，讓 What 的注意事項在 How 有教到。
# - 第六輪獨立審查修正：（阻擋 R-1）How 的 AI 段落改寫：刪掉和 What notes 重複的電子報引文、合併自我重複的「自己寫／不直接交出去」；不貼個資與未公開文件或機密資料（電子報（三））、輸出自己查證（（一））、內容自己寫（（二））歸給電子報，只有「依課程規定說明用了哪個工具」標本站建議。
