why:
  heading: 用英文學專業
  body:
  - 教育部的雙語化學習計畫說明，大學要逐步推動「全英語授課」，「以英語為知識傳遞的媒介，教授各專業領域知識，包括經濟、工程、醫學、商學、人文等專業科目課程」。
  - 教育部 2021 年的新聞稿提到，高三生約 21% 達到 CEFR B2 以上，「亦即有五分之一的高三學生具有修習全英語課程的基本能力」。
  qa:
    question: 用英文上專業課，聽不懂術語怎麼辦？
    answer: 課前先把術語讀過、查好意思（本站建議），上課時就能把注意力放在架構上。CEFR 補充版 B1 的筆記描述，也以「the topic is within their field of interest」和講課「clear and well structured」為前提，熟悉主題能幫你跟上。
    source: cefr-cv
  items_title: 和 EMI 相關的 CEFR 描述（本站整理）
  items:
  - title: 上課做筆記（B1）
    text: 主題熟悉、講課清楚時，記下之後自己用得上的筆記。
  - title: 聽講記重點（B2）
    text: 聽懂結構清楚的講課，記下覺得重要的點。
  - title: 參與正式討論（B2）
    text: 積極參與例行與非例行的正式討論。
  checklist_title: 上課前先確認
  checklist:
  - 讀過術語
  - 知道本週主題
  sources:
  - best-about
  - moe-best
  - cefr-cv
how:
  heading: 課前、課中、課後
  body:
  - 本站建議：課前讀講義或指定閱讀，列出術語和意思；課中記下老師的架構（第一、第二、結論）和舉例；課後用英文寫幾句重點，再看著重點用英文口頭說一遍（例如 1 分鐘，示意），在討論時至少提出一個問題或看法。
  - CEFR 補充版 Note-taking 量表 B1 的描述是「Can take notes during a lecture which are precise enough for their own use at a later date, provided the topic is within their field of interest and the lecture is clear and well structured.」；B2 的描述是「Can understand a clearly structured lecture on a familiar subject, and can take notes on points which strike them as important, even though they tend to concentrate on the actual formulation and therefore to miss some information.」教育部新聞稿把 B2 視為修習全英語課程的基本能力（見 Why），所以可以把 B1 當起點、B2 當目標（本站建議）。
  - 用 AI 幫忙時，照學術倫理電子報的提醒做：不貼個人資訊、未公開文件或機密資料，AI 的輸出自己查證，內容自己寫，不把 AI 生成的內容直接交出去。本站建議：交作業時依課程規定說明用了哪個工具、做了什麼。
  items_title: 本站建議的做法
  items:
  - title: 課前列術語
    text: 查好意思，帶進教室。
  - title: 課中抓架構
    text: 記下架構與舉例。
  - title: 課後寫重點
    text: 用英文寫幾句摘要，再說一遍。
  - title: 討論提問
    text: 至少提出一個問題或看法。
  checklist_title: 每堂課後
  checklist:
  - 筆記有架構
  - 寫了英文重點
  - 提了一個問題
  activity_figure: emi-flow
  sources:
  - cefr-cv
  - ethics-epaper13
what:
  heading: 跟上全英語的專業課
  body:
  - 學完後，能在全英語授課的專業課裡跟上架構、做出自己用得上的筆記，並用英文摘要重點、參與討論。
  items_title: 學完能做到
  items:
  - title: 跟上架構
    text: 說出一堂課的主要段落。
  - title: 做出筆記
    text: 之後自己看得懂、用得上。
  - title: 英文摘要
    text: 說出重點並提出問題。
  checklist_title: 家人檢核
  checklist:
  - 重點和影片一致
  - 有提出問題
  figures:
  - emi-compare
  notes:
  - 把大學階段對應多益、托福是本站建議，不是官方換算。
  - 檢核與情境的 10 個術語、3 句、1 個問題、1 分鐘是示意。
  - 用生成式 AI 時，不要把個人資訊、未公開文件、機密資料貼進去（教育部臺灣學術倫理教育資源中心 2023 年的電子報）；AI 的輸出要自己查證。這份 2023 年的電子報也說，學術界對使用生成式 AI 是否需要標註「尚無統一的規定」，建議先了解相關單位的政策；不要把 AI 生成的內容直接當成自己寫的交出去，電子報提醒，直接使用生成的內容而非親自撰寫，「還可能有代寫的學術倫理問題」；交作業時依課程規定說明用了哪個工具、做了什麼；AI 規定變化快，以學校和課程最新的規定為準（本站建議）。
  sources:
  - best-about
  - ethics-epaper13
