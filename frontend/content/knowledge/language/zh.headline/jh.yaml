why:
  heading: 113 年會考寫作考過標題
  body:
  - 113 年會考寫作題先列出六則「產品文案、社群平臺、報章雜誌中常見的標題」，並說「「標題」的擬定，常運用特殊設計，以吸引大眾目光，其中可能反映了某些群眾心理或社會面貌。」
  - 國語文課綱要國中生「指出寫作的目的與觀點」，也要「依據需求書寫各類文本」；國中的應用文本包括「自傳、簡報、新聞稿」。
  qa:
    question: 一個標題讓你點進去，內容卻不是那樣，你會怎麼想？
    answer: 多半會覺得被騙，下次看到同一個來源就不太想點（本站建議）。113 年會考題目也請考生想一想標題「受到什麼原因影響」「背後反映了什麼現象」。寫標題時，吸引人和說實話要同時做到。
    source: cap-113w
  items_title: 國中課綱怎麼說
  items:
  - title: 指出目的與觀點
    text: 國語文 5-Ⅳ-2：理解各類文本的句子、段落與主要概念，指出寫作的目的與觀點。
    code: 5-IV-2
  - title: 依需求書寫
    text: 國語文 6-Ⅳ-4：依據需求書寫各類文本。
    code: 6-IV-4
  - title: 新聞稿等應用文本
    text: 國語文 Be-Ⅳ-1：在生活應用方面，以自傳、簡報、新聞稿等格式與寫作方法為主。
    code: Be-IV-1
  sources:
  - cap-113w
  - kuoyu
how:
  heading: 先寫準，再寫亮
  body:
  - 先用一句話寫出內文最重要的事實，這是「準」；再挑一種設計讓它更吸引人，這是「亮」（本站建議）。寫完把標題和內文對照，標題說的每件事內文都要有。
  items:
  - title: 提問
    text: 用問句引起好奇（本站整理）。
    example: 百年大旱——水資源去哪了？
  - title: 懸念或驚奇
    text: 先藏住答案，讓人想看下去（本站整理）。
    example: 打趴五星飯店主廚的蛋糕，竟出自國中生之手！
  - title: 諧音
    text: 借同音或近音字聯想（本站整理）。
    example: 豪華「包糕粽」套餐——讓你考試高分過！
  checklist_title: 寫完標題：
  checklist:
  - 內文都有嗎
  - 數字對嗎
  - 有沒有誇大
  activity_figure: how-flow
