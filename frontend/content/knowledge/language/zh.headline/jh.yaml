idea: 標題常用提問、懸念、諧音等設計吸引目光（本站整理）。113 年會考寫作就請考生觀察常見標題「運用了什麼樣的設計方式」，背後「反映了什麼現象」。標題和內文對不上，讀者點進去會覺得被騙（本站建議）；好標題要準確點出內容。
guiding_questions:
- 一個標題讓你點進去，內容卻不是那樣，你會怎麼想？
scenario: 親子共學：蒐集 5 個你點過的標題，標出用了什麼手法，再替其中一則寫一個不誇大的版本。
goal: 寫出準確又吸引人的標題，不誇大、不騙點擊。
review: 孩子替 3 則（示意）新聞各寫一個標題，家長讀內文後判斷標題沒有誇大或誤導，3 則都過。
