idea: 標題常用提問、懸念、諧音吸引目光，但誇大的標題會讓讀者失去信任。好標題是準確地點出內容。
guiding_questions:
- 一個標題讓你點進去，內容卻不是那樣，你會怎麼想？
scenario: 親子共學：蒐集 5 個你點過的標題，標出用了什麼手法，再替其中一則寫一個不誇大的版本。
goal: 寫出準確又吸引人的標題，不誇大、不騙點擊。
review: 孩子替 3 則新聞各寫一個標題，家長讀內文後判斷標題沒有誇大或誤導，3 則都過。
