# B8 提案：en.acwrite@uni
# - 補 Why/How/What 與兩張圖。引用、改寫、摘要的定義改依教育部臺灣學術倫理教育資源中心〈AI世代的學術寫作指南〉；抄襲定義補 UNC 寫作中心。
# - 錯誤修正：原檢核「沒有連續 5 個字以上照抄」沒有出處；改依指南「應該要避免使用他人『一個分句』以上的文字段落，而且不僅要更換詞語，更要重新組織句子的結構」。
# - 安全：AI 建議改寫——補不貼未公開文件、是否標註依課程與期刊政策（學術倫理電子報說「尚無統一的規定」，不寫成硬規定）；大學對應托福標為本站建議（顯示在 notes）。
# - 第一輪獨立審查修正：本點沒有托福事實，刪 toefl-content 來源，notes 改用不提題型分數的對應說明；goal、情境改用指南的用語「引述、改寫、摘寫」；電子報標出 2023 年。
# - 第二輪獨立審查修正：（建議項）手冊註明「僅代表作者觀點」，Why 改稱「資源中心出版的《AI世代的學術寫作指南》」不寫成官方規定；ai.delegable 補「只貼引用清單，不貼未公開全文」。
# - 第五輪獨立審查修正：（建議項）What body「並正確附上來源」How 沒教引用格式，縮成「並附上來源」。 What notes 的 AI 注意事項補「不代寫」（學術倫理電子報（二）著作權「還可能有代寫的學術倫理問題」；是電子報的提醒，不寫成硬規定），ethics-epaper13 supports 補（二）著作權整句（2026-10-29 重抓逐字核對）；How body 補 AI 使用說明（不貼機密、自己查證、自己寫、說明工具），how.sources 加 ethics-epaper13，讓 What 的注意事項在 How 有教到。
# - 第六輪獨立審查修正：（阻擋 R-1）How 的 AI 段落改寫：刪掉和 What notes 重複的電子報引文、合併自我重複的「自己寫／不直接交出去」；不貼個資與未公開文件或機密資料（電子報（三））、輸出自己查證（（一））、內容自己寫（（二））歸給電子報，只有「依課程規定說明用了哪個工具」標本站建議。
