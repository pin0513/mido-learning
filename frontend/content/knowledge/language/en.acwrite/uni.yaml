sources:
- id: ethics-guide
  title: AI世代的學術寫作指南⸺給研究生的參考手冊（電子書）
  publisher: 教育部臺灣學術倫理教育資源中心（手冊註明「本手冊內容僅代表作者觀點，不代表教育部立場」）
  url: https://ethics.moe.edu.tw/files/resource/ebook/file/ebook_05.pdf
  accessed: '2026-10-29'
  kind: reference
  supports: 寫作慣例：一 引述「引述是一種完整使用他人原文資料的方法，也就是直接將他人的文字，一字不漏的納入自己的學術寫作內容中」，「直接引述通常需要用引號標示」；二 改寫「改寫是指用自己的話，重新闡述他人的觀點或資訊，但保持其原有的意義，篇幅也會和原本差不多」，「應該要避免使用他人『一個分句』以上的文字段落，而且不僅要更換詞語，更要重新組織句子的結構」；三 摘寫「摘寫是指將參考資料的核心思想或主要論點，用更簡潔的文字概括出來」；「學術界對抄襲的認定比較廣義」
- id: unc-plagiarism
  title: Plagiarism（Writing Center 寫作講義）
  publisher: The Writing Center, University of North Carolina at Chapel Hill
  url: https://writingcenter.unc.edu/tips-and-tools/plagiarism/
  accessed: '2026-10-29'
  kind: reference
  supports: What is plagiarism?：「deliberate or reckless representation of another's words, thoughts, or ideas as one's own without attribution in connection with submission of academic work, whether graded or otherwise」；筆記：「be careful to use quotation marks to distinguish the exact words used by the author from your own words」
- id: ethics-epaper13
  title: 大學校園因應生成式AI之指引及教學建議（學術倫理電子報第 13 期）
  publisher: 教育部臺灣學術倫理教育資源中心（2023 年 8 月）
  url: https://ethics.moe.edu.tw/resource/epaper/html/21/
  accessed: '2026-10-29'
  kind: reference
  supports: （五）學術寫作的自我揭露：「目前學術界對於使用生成式AI是否需要標註，尚無統一的規定」，「建議研究者應先瞭解經費補助機關（構）或期刊等單位對於生成式AI之政策，並於著作或報告中適度公開相關訊息」；（三）個人資料保護與資通安全：「研究者應留意，不要將個人資訊、未公開文件、機密資料等內容輸入到生成式AI的對話框中，以避免產生個人隱私洩露的問題。」；（二）著作權：「由於生成式AI是將網路開放資料透過蒐集與彙整所生成的內容，研究者若直接將生成的內容拿來使用，而非親自撰寫或創作，除在法律上不享有著作權保障之外，還可能有代寫的學術倫理問題。」
