why:
  heading: 標清楚哪些是別人的
  body:
  - UNC 寫作中心引用校規，把抄襲定義為「deliberate or reckless representation of another's words, thoughts, or ideas as one's own without attribution in connection with submission of academic work, whether graded or otherwise」。
  - 教育部臺灣學術倫理教育資源中心出版的《AI世代的學術寫作指南》提醒，學術上的抄襲和《著作權法》侵權的判斷不同，「學術界對抄襲的認定比較廣義」；沒有妥善標明出處，就可能被認為是抄襲。
  qa:
    question: 引用別人的話和抄襲，差在哪裡？
    answer: 差在有沒有標清楚。指南說直接引述「一字不漏的納入自己的學術寫作內容中」，而且「直接引述通常需要用引號標示」並提供來源；沒有標示、讓人以為是你自己的，就是抄襲。
    source: ethics-guide
  items_title: 三種寫作慣例（指南）
  items:
  - title: 引述
    text: 一字不漏使用原文，加引號、附來源。
  - title: 改寫
    text: 用自己的話重述，篇幅和原文差不多。
  - title: 摘寫
    text: 用更簡潔的文字概括核心思想。
  checklist_title: 動筆前先確認
  checklist:
  - 記下每筆來源
  - 原文另外存好
  sources:
  - unc-plagiarism
  - ethics-guide
how:
  heading: 筆記就分清楚
  body:
  - UNC 寫作中心建議做筆記時「be careful to use quotation marks to distinguish the exact words used by the author from your own words」，回頭寫報告才分得清哪些是原文。
  - 改寫時，指南說「應該要避免使用他人『一個分句』以上的文字段落，而且不僅要更換詞語，更要重新組織句子的結構」。本站建議：改寫前先闔上原文，用自己的話寫，再回頭比對。
  - 用 AI 幫忙時，照學術倫理電子報的提醒做：不貼個人資訊、未公開文件或機密資料，AI 的輸出自己查證，內容自己寫，不把 AI 生成的內容直接交出去。本站建議：交作業時依課程規定說明用了哪個工具、做了什麼。
  items_title: 本站建議的步驟
  items:
  - title: 筆記加引號
    text: 原文的句子一律加引號。
  - title: 闔上原文改寫
    text: 用自己的話寫，再比對。
  - title: 摘寫重點
    text: 只留核心論點。
  - title: 附上來源
    text: 三種方式都要附。
  checklist_title: 交出前勾一下
  checklist:
  - 引述有引號
  - 改寫重組句子
  - 都有來源
  activity_figure: acwrite-flow
