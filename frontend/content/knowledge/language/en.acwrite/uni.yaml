idea: 學術寫作要清楚標出哪些是別人的想法：引用、改寫、附上來源。這是對知識的誠實，也讓讀者能查證。
guiding_questions:
- 引用別人的話和抄襲，差在哪裡？
scenario: 親子共學：把一段英文資料用三種方式放進自己的報告：直接引用、改寫、摘要，並各附上來源。
goal: 用英文寫學術段落：分清直接引用、改寫、摘要，並附上來源。
review: 把一段英文資料用三種方式放進自己的報告（引用、改寫、摘要），各附來源；家人比對改寫版與原文，沒有連續 5 個字以上照抄。
