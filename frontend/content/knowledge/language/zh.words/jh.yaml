  - cap-guowen
  - kuoyu
  - idiom-chaqiang
how:
  heading: 先查再用，造句驗證
  body:
  - 不確定的成語，先查教育部《成語典》，看「釋義」和「使用類別」，再造一個句子試試；《成語典》正文沒收的，改查《重編國語辭典修訂本》。造好的句子唸一遍，看前後意思有沒有衝突。
  items:
  - title: 看使用類別
    text: 《成語典》把「差強人意」歸在「勉強可以」的表述。
    example: 差強人意
  - title: 不在成語典就查辭典
    text: 「首當其衝」：最先受到攻擊，或首先遭遇災難（《重編國語辭典修訂本》）。
    example: 首當其衝
  - title: 前後意思要一致
    text: 褒貶方向和句子其他部分要配得上（本站整理）。
  checklist_title: 用成語之前：
  checklist:
  - 查釋義
  - 看使用類別
  - 造一句
  - 唸一遍
