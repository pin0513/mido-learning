why:
  heading: 詞用錯，意思就反了
  body:
  - 會考國文考「詞語的理解與使用：理解、應用詞語，理解常用文言文的詞義。」國語文課綱也列出國中要「認念」6,500 個、「使用」5,000 個常用語詞。
  - 成語常有古代的本義和現在的用法。以「差強人意」為例，《成語典》說它的本義是「還真是能夠振奮人心」，後來用來「比喻雖然不夠好，但大體上還能讓人滿意」。
  qa:
    question: 「他的演講差強人意，大家都很滿意。」哪裡怪怪的？
    answer: 「差強人意」是「雖然不夠好，但大體上還能讓人滿意」，用在「勉強可以」的情況。後半句說「大家都很滿意」，意思衝突。可以改成「他的演講差強人意，還有進步空間。」或者把前半句改成「他的演講很精彩」。
    source: idiom-chaqiang
  items_title: 國中課綱的詞語目標
  items:
  - title: 認念常用語詞
    text: 國語文 Ab-Ⅳ-4：6,500 個常用語詞的認念。
    code: Ab-IV-4
  - title: 使用常用語詞
    text: 國語文 Ab-Ⅳ-5：5,000 個常用語詞的使用。
    code: Ab-IV-5
  - title: 查辭典辨一字多義
    text: 國語文 4-Ⅳ-3：能運用字典或辭典了解一字多音及一字多義的現象。
    code: 4-IV-3
