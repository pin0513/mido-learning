goal: 把成語用在對的情境；不確定就先查再用。
review: 家長給 5 個常被用錯的成語（例如差強人意、首當其衝），孩子先各造一句，再查教育部《成語典》或《重編國語辭典修訂本》自己訂正，最後 5 句都用對。
