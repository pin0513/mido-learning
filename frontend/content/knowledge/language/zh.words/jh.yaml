idea: 同一個詞要放對位置：名詞、動詞、形容詞各有用法。成語先查清楚意思再用，例如「差強人意」是勉強讓人滿意，不是很好。
guiding_questions:
- 「他的演講差強人意，大家都很滿意。」哪裡怪怪的？
scenario: 親子共學：複習版：每人找一個自己以前用錯的成語，用教育部《成語典》查原意，再各造一個正確的句子。
goal: 分辨詞性，把成語用在對的情境；不確定就先查再用。
review: 家長給 5 個常被用錯的成語（例如差強人意、首當其衝），孩子先各造一句，再查教育部《成語典》自己訂正，最後 5 句都用對。
