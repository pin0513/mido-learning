idea: 全民英檢中級的檢測程度是「具有使用簡單英語進行日常生活溝通的能力」：能閱讀短文、故事、私人信件、廣告與使用說明，能介紹自己的生活與經歷並對一般話題陳述看法，能寫簡單的書信、故事及心得。中級分兩階段：先考聽力與閱讀，通過後才能加考寫作與口說；LTTC 說明，聽讀通過對應 CEFR B1，說寫也通過的成績單會顯示 B1+。檢定是一把尺，重點是看出下一步要練什麼。
guiding_questions:
- 「英文不錯」到底是多好？有沒有一把尺可以量？
scenario: 親子共學：對照全民英檢中級的聽、讀、說、寫能力說明，親子各自勾出做得到的項目，找出下一個目標。
goal: 看懂全民英檢中級的題型與通過標準：先準備聽讀、通過後再加考說寫，並知道成績對應 CEFR 哪一級。
review: 孩子做一回全民英檢中級官方練習題的聽力與閱讀，把錯題依題型分類，找出最弱的題型；再說出官方通過標準：聽讀兩項總和 160 分以上且單項不低於 72 分，才能加考寫作與口說（各 80 分通過）。練習題的答對數不是量尺分數，是否通過以正式成績單為準。
