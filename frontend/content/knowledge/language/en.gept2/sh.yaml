why:
  heading: 用一把尺看自己在哪裡
  body:
  - CEFR 把語言能力分成 A1 到 C2 六級，用「能做到什麼」來描述；例如 B1 是「Can understand the main points of clear standard input on familiar matters regularly encountered in work, school, leisure, etc.」
  - LTTC 說明，「許多大學以CEFR B1（中級）或B2（中高級）作為英語能力畢業標準」；通過全民英檢中級聽讀，成績單會列出 CEFR 級數。
  qa:
    question: 「英文不錯」到底是多好？有沒有一把尺可以量？
    answer: 有。全民英檢中級用聽、說、讀、寫的能力說明告訴你通過者做得到什麼，例如「能閱讀短文、故事、私人信件、廣告、傳單、簡介及使用說明等」。對照這些說明，就知道自己是哪裡還不夠。
    source: gept-intermediate
  items_title: 中級通過者做得到（LTTC）
  items:
  - title: 聽
    text: 能聽懂一般會話，大致聽懂公共場所廣播、氣象報告及廣告。
  - title: 讀
    text: 能閱讀短文、故事、私人信件、廣告與使用說明。
  - title: 說
    text: 能介紹自己的生活與經歷，對一般話題陳述看法。
  - title: 寫
    text: 能寫簡單的書信、故事及心得。
  checklist_title: 先想一想
  checklist:
  - 哪一項最有把握
  - 哪一項最弱
  sources:
  - cefr-cv
  - gept-faq
  - gept-intermediate
how:
  heading: 先過聽讀，再加考說寫
  body:
  - 官方題型：聽力 35 題約 30 分鐘，分看圖辨義 5 題、問答 10 題、簡短對話 10 題、簡短談話 10 題；閱讀 35 題 45 分鐘，分詞彙 10 題、段落填空 10 題、閱讀理解 15 題（LTTC 中級測驗介紹）。官方流程：聽讀「兩項測驗成績總和達160分，且其中任一項成績不低於72分」，才「可加考該級數之說寫測驗」。寫作、口說各 80 分通過。LTTC 說明，聽讀通過的成績單對應 CEFR B1，說寫也通過顯示 B1+。
  - 本站建議：先用官方練習題找出最弱的題型，集中練習；聽讀穩定後，再練中譯英、英文作文、朗讀、回答問題與看圖敘述。練習題的答對數不能直接換算成量尺分數，LTTC 說明成績是「考生的答對題數透過統計程序轉換為量尺分數」。
  - 用 AI 練習時，照教育部注意事項（學生版）做：先確認符合平臺的註冊年齡限制，優先用為教育目的設計的工具（例如酷英網的 CoolE Bot），在家使用請家長陪伴；不輸入自己或他人的個人資料；AI 的回答要查證，不直接採信；作業「應依規定註明所使用的工具及用途，不得將生成內容直接當作自己原創作品繳交」，也不能用 AI 抄襲、代寫或作弊。
  items_title: 本站建議的準備順序
  items:
  - title: 對照能力說明
    text: 勾出做得到與做不到的項目。
  - title: 練聽讀題型
    text: 錯題依題型分類，找最弱的一種。
  - title: 聽讀通過後
    text: 再加考寫作與口說。
  - title: 看正式成績單
    text: 通過與否以成績單為準。
  checklist_title: 每次練習後
  checklist:
  - 錯題分類
  - 找出最弱題型
  - 訂下一步
  activity_figure: gept2-flow
  sources:
  - gept-intermediate
  - gept-faq
  - genai-student
  - moe-coolebot
what:
  heading: 看懂標準，找出下一步
  body:
  - 學完後，孩子說得出全民英檢中級聽讀與說寫的題型和通過標準，知道成績對應 CEFR 哪一級，也知道下一步要補哪一項。
  items_title: 學完能做到
  items:
  - title: 說出通過標準
    text: 聽讀總和 160、單項 72；說寫各 80。
  - title: 說出 CEFR 對照
    text: 聽讀通過 B1，說寫也通過 B1+。
  - title: 找出弱項
    text: 用錯題分類決定下一步。
  checklist_title: 家長檢核
  checklist:
  - 說得出標準
  - 錯題有分類
  - 有下一步計畫
  figures:
  - gept2-compare
  notes:
  - 題型、時間與通過標準依 LTTC 官方說明；把高中對應全民英檢中級是本站建議，不是官方換算。
  - 練習題只用來找弱點：LTTC 的成績是量尺分數，電腦化測驗模擬練習也註明「題數與計時非同正式測驗」，所以不能用練習題分數判斷是否通過。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網的 CoolE Bot），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - gept-intermediate
  - gept-faq
  - english
  - genai-student
  - moe-coolebot
