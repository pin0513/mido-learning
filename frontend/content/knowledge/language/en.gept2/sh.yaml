idea: 全民英檢中級對應 CEFR B1：能閱讀短文、故事、信件、廣告與說明書，能介紹自己的生活與經歷並對一般話題陳述看法，能寫簡單的書信與心得。CEFR 把語言能力分成 A1 到 C2 六級，用「能做到什麼」描述；檢定是一把尺，重點是看出下一步要練什麼。
guiding_questions:
- 「英文不錯」到底是多好？有沒有一把尺可以量？
scenario: 親子共學：對照全民英檢中級的「聽說讀寫能力說明」，親子各自勾出做得到的項目，找出下一個目標。
goal: 四項一起準備：通過全民英檢中級，知道自己在 CEFR 的哪一級。
review: 做一回完整的全民英檢中級官方模擬題並對照官方通過標準：聽力與閱讀總分 160 分以上，且單項不低於 72 分（各滿分 120）；寫作 80 分、口說 80 分以上。家長看成績或模擬分數打勾。
