- 英語文領綱把高中十至十二年級定為第五學習階段，部定必修第十、十一年級每學期 4 學分；這一點不對應特定課綱條目。
- 原有待核對「課綱對應只到領域、核心素養與議題…」已刪除：全民英檢是檢定，英語文領綱沒有對應的條目，不列 curriculum_108 代碼。
