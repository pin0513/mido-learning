# B8 提案：en.gept2@sh
# - 補 grades 與 Why/How/What、兩張圖。全民英檢是檢定，英語文領綱沒有對應條目，不列 curriculum_108 代碼。
# - 錯誤修正（高）：原檢核要家長看「模擬分數」對照通過標準，但 LTTC 說明聽讀成績是由答對題數「透過統計程序轉換為量尺分數」，練習題答對數不能直接換算成 160／72 分；改成用練習題找弱點，通過與否以正式成績單為準。
# - 錯誤修正：原 goal「四項一起準備」與官方流程不符——聽讀「兩項測驗成績總和達160分，且其中任一項成績不低於72分」才能加考說寫；改成先聽讀、後說寫。
# - 刪除過時的「尚未經老師審閱」；CEFR 對照改依 LTTC 常見問題（聽讀通過 B1，說寫也通過 B1+）；高中對應中級標為本站建議（顯示在 notes）。
# - 第一輪獨立審查修正：How 補上聽力四種、閱讀三種題型與題數（LTTC 逐字核對），讓檢核的「錯題依題型分類」有教到。
# - 第二輪獨立審查修正：標題與 What 標題「知道自己在哪一級」超出 How（How 說練習題判斷不了級數），改為「全民英檢中級：題型、通過標準與下一步」「看懂標準，找出下一步」；How 補 LTTC 的 CEFR 對照句（how.sources 補 gept-faq）。
# - 第五輪獨立審查修正：What notes 的 AI 注意事項 How 沒教，How body 補 AI 使用說明（年齡限制、教育用工具、家長陪伴、不輸入個資、查證、註明工具、不代寫；學生版六（四）逐字），how.sources 加 genai-student。
# - 第六輪獨立審查修正：（建議項）酷英網工具名稱依國教署新聞稿與酷英網現行頁面改為「CoolE Bot」（How body 與 What notes 的內文；genai-student supports 的引文照學生版 PDF 原文「酷英網E-BOT」不改），新增來源 moe-coolebot（國教署 2023-11-26 即時新聞），列入 how.sources 與 what.sources。
