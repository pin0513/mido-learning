verify_notes:
- 待核對：課綱對應只到領域、核心素養與議題，上線前請以教育部課綱與國語文、英語文、第二外國語文課綱核對。
- 英文以全民英檢、美國小學／中學讀本、多益、托福為主要基準，108 課綱英語文為次要對照；學段與檢定的對應是本站的學習建議，不是官方換算。
- 基準標籤：全民英檢中級（CEFR B1）。
- 引用的框架只寫名稱（全民英檢中級（LTTC，CEFR B1）；CEFR），教材內容是改寫的入門說明，上線前請核對原始出處的用語。
- 本點為這次補強新增，內容尚未經老師審閱。
- 通過標準與題型取自 LTTC 全民英檢網中級測驗介紹 https://www.gept.org.tw/Exam_intro/t02_introduction.asp（2026-10-27 讀取）；GEPT 與 CEFR 的對應取自 LTTC 報名手冊 https://www.gept.org.tw/info/registration_guide.pdf。
