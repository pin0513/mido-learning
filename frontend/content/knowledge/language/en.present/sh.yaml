# B8 提案：en.present@sh
# - 補 grades、英語文 *2-Ⅴ-10、B-Ⅴ-4 與 Why/How/What、兩張圖；5-Ⅴ-3 與國語文等同號，只在內文引用。
# - 錯誤修正：原檢核「每題 15–30 秒」「大致清楚」不精確；改依 LTTC 官網：回答問題「第1至5題，每題回答時間15秒；第6至10題，每題回答時間30秒」，評分對照官方 4 級分說明「發音大致清晰、正確…無礙溝通」。
# - 看圖時先說在哪裡、誰在做什麼的順序標本站建議。
# - 安全：補「錄音不要說出姓名、學校等個人資料」與教育部學生版 AI 注意事項；高中對應全民英檢中級標為本站建議（顯示在 notes）。
# - 第一輪獨立審查修正：情境改成照全民英檢看圖敘述形式錄音（不錄影），錄音只留在自己的裝置、不上傳；錄音裡不說個資（補學生版五「應經由學校評估資安風險」）；goal 與檢核註明正式成績以 LTTC 評分為準。
# - 第二輪獨立審查修正：錄音「只留在自己的裝置、不上傳」與「讓 AI 聽錄音給回饋」矛盾——改為錄音不上傳，也不交給 AI；AI 只用來出練習題（刪 How 裡請 AI 聽錄音的句子，ai.delegable 改寫）。
# - 第三輪獨立審查修正：goal／What／檢核承諾「對照官方 4 級分說明自我檢查」，How 第二段改成聽回放時逐字對照 LTTC 4 級分說明（gept-intermediate 已在 how.sources）；How items「錄音回放」與 Why 第一項的 *2-Ⅴ-10 星號同步。
# - 第四輪獨立審查修正：What／檢核承諾回答問題 15／30 秒，How 第一段補「第 1 至 5 題每題回答 15 秒、第 6 至 10 題每題 30 秒」（gept-intermediate 已有逐字 supports）。
# - 第五輪獨立審查修正：What notes 的 AI 注意事項 How 沒教，How body 補 AI 使用說明（年齡限制、教育用工具、家長陪伴、不輸入個資、查證、註明工具、不代寫；學生版六（四）逐字），how.sources 加 genai-student。
# - 第六輪獨立審查修正：（建議項）ai.delegable「依教育部學生版注意事項，不輸入個資、不上傳錄音」：學生版沒有提到錄音，改成「依教育部學生版注意事項不輸入個資；錄音不上傳，本站建議」。 （建議項）酷英網工具名稱依國教署新聞稿與酷英網現行頁面改為「CoolE Bot」（How body 與 What notes 的內文；genai-student supports 的引文照學生版 PDF 原文「酷英網E-BOT」不改），新增來源 moe-coolebot（國教署 2023-11-26 即時新聞），列入 how.sources 與 what.sources。
