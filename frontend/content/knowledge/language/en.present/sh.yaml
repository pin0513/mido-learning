how:
  heading: 朗讀、回答、看圖三步練
  body:
  - 全民英檢中級口說的三部分：朗讀短文「先利用1分鐘的時間閱讀下面2篇短文…然後在2分鐘內以正常的速度，清楚正確的讀出下面的短文」；回答問題 10 題、每題播二次，第 1 至 5 題每題回答 15 秒、第 6 至 10 題每題 30 秒；看圖敘述看圖 30 秒、作答 1 分半。
  - 本站建議：每次練習都只錄音、不錄影，錄音只留在自己的裝置，不上傳到網路；聽回放時對照 LTTC 4 級分說明「發音大致清晰、正確，語調大致正確、自然；對應內容切題，語法、字彙之使用雖有錯誤，但無礙溝通。」，找出一處要改的發音或句子，再錄一次。錄音裡不要說出自己的姓名、學校等個人資料。
  - 用 AI 練習時，照教育部注意事項（學生版）做：先確認符合平臺的註冊年齡限制，優先用為教育目的設計的工具（例如酷英網的 CoolE Bot），在家使用請家長陪伴；不輸入自己或他人的個人資料；AI 的回答要查證，不直接採信；作業「應依規定註明所使用的工具及用途，不得將生成內容直接當作自己原創作品繳交」，也不能用 AI 抄襲、代寫或作弊。
  items_title: 本站建議的練法
  items:
  - title: 朗讀短文
    text: 先默讀，再清楚正確地讀出。
  - title: 回答問題
    text: 不一定要完整句子，在時間內盡量表達。
  - title: 看圖敘述
    text: 在哪裡、誰在做什麼、為什麼。
  - title: 錄音回放
    text: 對照 4 級分說明找一處改，再錄一次。
  checklist_title: 每次練習後
  checklist:
  - 只錄音不上傳
  - 聽了回放
  - 改了一處
