what:
  heading: 朗讀、回答與看圖都說得出
  body:
  - 學完後，孩子能清楚朗讀短文、在時間內回答問題，並看一張圖用英文說 1 分半，對照官方 4 級分說明檢查自己。
  items_title: 學完能做到
  items:
  - title: 清楚朗讀
    text: 發音與語調大致正確。
  - title: 切題回答
    text: 在 15 或 30 秒內回應。
  - title: 看圖說 1 分半
    text: 有地點、人物、動作與原因。
  checklist_title: 家長檢核
  checklist:
  - 朗讀清楚
  - 回答切題
  - 看圖說得完
  figures:
  - present-compare
  notes:
  - 題型與時間依 LTTC 官方說明；把高中對應全民英檢中級是本站建議，不是官方換算。
  - 看圖先說在哪裡、誰在做什麼的順序是本站建議；對照 4 級分說明是自評，正式成績以 LTTC 評分為準。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網的 CoolE Bot），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  - 教育部學生版也說，若要用其他商用版工具，「應經由學校評估資安風險，並在師長指導下審慎使用」。
  sources:
  - gept-intermediate
  - genai-student
  - moe-coolebot
