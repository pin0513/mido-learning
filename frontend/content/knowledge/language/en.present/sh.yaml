why:
  heading: 把英文說清楚
  body:
  - 全民英檢中級口說的 4 級分說明是「發音大致清晰、正確，語調大致正確、自然；對應內容切題，語法、字彙之使用雖有錯誤，但無礙溝通。」
  - 英語文領綱第五學習階段有較高階的 *2-Ⅴ-10「能依主題說出語意連貫且條理分明的簡短演說、簡報或說明。」，學習內容有「圖片描述。」（B-Ⅴ-4）；朗讀則是「能以正確的發音及適切的斷句、節奏、語調、語氣及速度，流暢地朗讀短文、短劇及故事。」（5-Ⅴ-3）
  qa:
    question: 看一張圖用英文說 90 秒，你說得完嗎？
    answer: 全民英檢中級看圖敘述是「先利用30秒的時間看圖及問題，再於1分半內完成作答」。先想好在哪裡、誰在做什麼、為什麼（本站建議），一個一個說，90 秒就不難填滿。
    source: gept-intermediate
  items_title: 高中英語文課綱的相關條目
  items:
  - title: 簡報或說明
    text: 英語文 *2-Ⅴ-10：能依主題說出語意連貫且條理分明的簡短演說、簡報或說明。
    code: 2-V-10
  - title: 圖片描述
    text: 英語文 B-Ⅴ-4：圖片描述。
    code: B-V-4
