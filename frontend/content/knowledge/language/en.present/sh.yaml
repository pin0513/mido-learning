idea: 全民英檢中級口說考朗讀短文、回答問題、看圖敘述。看圖時先說在哪裡、誰在做什麼，再說原因或感受。上台發表的結構與台風，交給「溝通與解決問題」的簡報；這一點專心把英文說清楚。
guiding_questions:
- 看一張圖用英文說 90 秒，你說得完嗎？
scenario: 親子共學：選一個你在意的主題，準備 2 分鐘英文發表：錄影一次、看回放改一處，再錄第二次。
goal: 朗讀短文、回答問題、看圖敘述，達到全民英檢中級口說的程度。
review: 家長照全民英檢中級口說的形式考一次：朗讀 2 篇短文、回答 10 個問題（每題 15–30 秒）、看一張圖說 1 分半；錄音後對照官方評分說明，發音、內容、語法都在「大致清楚」以上。
