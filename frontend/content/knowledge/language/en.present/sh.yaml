  supports: 口說：朗讀短文「請先利用1分鐘的時間閱讀下面2篇短文，閱讀時請不要發出聲音，然後在2分鐘內以正常的速度，清楚正確的讀出下面的短文。」；回答問題「共10題。題目已事先錄音，每題經由耳機播出二次，不印在試卷上。第1至5題，每題回答時間15秒；第6至10題，每題回答時間30秒。」；看圖敘述「請先利用30秒的時間看圖及問題，再於1分半內完成作答。」；口說 4 級分說明「發音大致清晰、正確，語調大致正確、自然；對應內容切題，語法、字彙之使用雖有錯誤，但無礙溝通。」；回答問題「回答時，不一定要用完整的句子，但請在作答時間內儘量的表達。」
