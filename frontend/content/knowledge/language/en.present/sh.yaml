verify_notes:
- 待核對：課綱對應只到領域、核心素養與議題，上線前請以教育部課綱與國語文、英語文、第二外國語文課綱核對。
- 英文以全民英檢、美國小學／中學讀本、多益、托福為主要基準，108 課綱英語文為次要對照；學段與檢定的對應是本站的學習建議，不是官方換算。
- 基準標籤：全民英檢中級・口說。
- 引用的框架只寫名稱（全民英檢中級口說：朗讀短文、回答問題、看圖敘述（LTTC）），教材內容是改寫的入門說明，上線前請核對原始出處的用語。
- 與「溝通與解決問題」sk.present@sh 交界：上台結構與台風由 sk.present 負責；本點只管英文口說的語言能力，互列 related。
