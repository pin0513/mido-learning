why:
  heading: 國中文言比例逐年加
  body:
  - 國語文課綱說國中教材「文言文所佔之比例宜逐年增加，第七學年 10%-20%、第八學年 20%-30%、第九學年 25%-35%。」學習內容有「常用文言文的字詞、虛字、古今義變」。
  - 會考國文第二項考試內容是「詞語的理解與使用：理解、應用詞語，理解常用文言文的詞義。」
  qa:
    question: 「學而時習之」裡的「而」和「之」，各是什麼意思？
    answer: 「而」在這裡是「然後」，表示語義承接，《國語小字典》就拿「學而時習之」當例句。「之」是代詞，代替前面學過的東西；這句可以翻成「學了，然後時常溫習它」（本站整理）。
    source: mini-er
  items_title: 國中課綱的文言目標
  items:
  - title: 文言詞義與結構
    text: 國語文 Ab-Ⅳ-6：常用文言文的詞義及語詞結構。
    code: Ab-IV-6
  - title: 字詞、虛字、古今義變
    text: 國語文 Ab-Ⅳ-7：常用文言文的字詞、虛字、古今義變。
    code: Ab-IV-7
  - title: 查字典辨一字多義
    text: 國語文 4-Ⅳ-3：能運用字典或辭典了解一字多音及一字多義的現象。
    code: 4-IV-3
