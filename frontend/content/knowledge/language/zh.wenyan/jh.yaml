idea: 文言文常用少數虛詞串起句子。「之」可以是「的」、代名詞或「往」；「而」表示順接或轉折；「以」是用、因為；「於」是在、比。先認得這幾個字，文言句子就讀得懂一半。會考國文「詞語的理解與使用」包含常用文言詞義。
guiding_questions:
- 「學而時習之」裡的「而」和「之」，各是什麼意思？
scenario: 親子共學：把一段文言課文的虛詞用螢光筆圈起來，親子各翻一句白話，對照誰翻得最貼近。
goal: 讀懂常見文言虛詞「之、其、而、以、於」在句中的意思。
review: 家長從課本挑 10 句含這 5 個虛詞的文言句，孩子說出每個虛詞的意思（例如「之」是的、他、往），答對 8 句以上。
