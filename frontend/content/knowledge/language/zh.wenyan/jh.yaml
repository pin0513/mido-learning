  - cap-guowen
  - mini-er
how:
  heading: 圈虛字，查字典，代回句子
  body:
  - 先把句子裡的虛字圈起來，查《國語小字典》看有哪幾種意思，再一個一個代回句子，選最通順的那個。
  items:
  - title: 之
    text: 代詞：此、這、這個；助詞：相當於「的」；也可以是「往、到」。
    example: 吾欲之南海（之＝往）
  - title: 其
    text: 代詞：他、他們（的）；這、那。也可以表示反問、揣測或加強語氣。
  - title: 而
    text: 並且；然而、但是、卻（轉折）；然後（承接）。
    example: 學而時習之（而＝然後）
  - title: 以
    text: 用、拿；認為；因為。
    example: 以人廢言（以＝因為）
  checklist_title: 讀一句文言：
  checklist:
  - 圈出虛字
  - 查小字典
  - 代回句子
  - 選最通順的
