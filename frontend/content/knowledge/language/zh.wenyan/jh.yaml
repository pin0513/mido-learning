idea: 文言文常用一些虛字串起句子。「之」可以是代詞（這、這個）、助詞（的）或「往、到」；「其」常是代詞（他、他的；這、那）；「而」可以是並且、轉折（然而、卻）或承接（然後）；「以」可以是用、認為、因為；「於」常是介詞（在、對、給、比、被）。會考國文「詞語的理解與使用」包含「理解常用文言文的詞義」。
guiding_questions:
- 「學而時習之」裡的「而」和「之」，各是什麼意思？
scenario: 親子共學：把一段文言課文的虛詞用螢光筆圈起來，親子各翻一句白話，對照誰翻得最貼近。
goal: 讀懂常見文言虛詞「之、其、而、以、於」在句中的意思。
review: 家長從課本挑 10 句含這 5 個虛字的文言句，孩子說出每個虛字的意思（例如「之」是的、這、往），再查教育部《國語小字典》核對，答對 8 句以上（示意）。
