scenario: 親子共學：在家附近走一走（約 10 分鐘，示意），每人用看、聽、聞、摸各記 2 個細節；回家吃點心時再補上「嘗」，最後合寫一段。
goal: 用五感各找至少一個細節，寫進一段描寫裡（嘗味道只用大人準備的食物）。
review: 散步後加上回家的點心時間，孩子寫一段描寫，家長在段落裡找到看、聽、聞、摸、嘗至少 4 種（示意）感官的細節。
