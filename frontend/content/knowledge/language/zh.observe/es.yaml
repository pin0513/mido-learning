idea: 眼睛、耳朵、鼻子、手、嘴巴都能收集材料。寫作前先收集，文章才有只屬於你的東西。在外面只看、聽、聞、摸大人同意的東西，嘗味道留到回家吃大人準備的食物。
guiding_questions:
