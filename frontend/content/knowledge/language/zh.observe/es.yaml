# - 安全修正（R9）：原檢核要求散步後找到「嘗」的細節，可能讓孩子在戶外亂嘗東西。改成戶外只用看、聽、聞、摸（只摸大人同意的東西），「嘗」留到回家吃大人準備的食物時練習。
# - 「10 分鐘」標為示意。
# - 複審修正：core_competencies 加 B3（正文引用國-E-B3）；「摸、嘗」項目標題改為「摸（大人同意的）／嘗（在家）」；how 加上食物過敏與交通安全提醒（本站建議）。
# - 補上 grades [1,2,3,4]、6-I-2、6-II-2、Bb-I-3；引用課綱實施要點寫作（1）與總綱 E-B3「促進多元感官的發展」。
