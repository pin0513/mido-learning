why:
  heading: 材料從觀察來
  body:
  - 課綱說，寫作教學要「引導學生閱讀、觀察周遭事物與活動，積累寫作材料」，再培養想像力、感受力等寫作基本能力。
  - 總綱也希望國小學生「促進多元感官的發展，培養生活環境中的美感體驗」。用五感找細節，就是在練習這件事。
  qa:
    question: 下雨天，除了「下雨了」，你還聽到、聞到什麼？
    answer: 可能聽到雨打在雨傘或鐵皮屋頂上的聲音，聞到地面溼溼的味道。把這些寫進去，讀的人就像也站在雨裡。每個人找到的細節不一樣，這裡只是示例。
    source: kuoyu
  items_title: 課綱的寫作目標
  items:
  - title: 觀察積累材料
    text: 一、二年級：透過閱讀及觀察，積累寫作材料。
    code: 6-I-2
  - title: 對物或自然的感受
    text: 一、二年級學習內容：對物或自然的感受。
    code: Bb-I-3
  - title: 培養感受力
    text: 三、四年級：培養感受力、想像力等寫作基本能力。
    code: 6-II-2
  sources:
  - kuoyu
  - zonggang
how:
  heading: 五種感官各記一個
  body:
  - 出門前先分工：誰負責看、誰負責聽、誰負責聞。看到的寫顏色和形狀，聽到的寫聲音，聞到的寫氣味。手只摸大人同意的東西；嘗味道不在戶外做，回家吃大人準備的食物時再練習（本站安全建議）。有食物過敏的孩子先問大人；散步走人行道，過馬路牽著大人（本站建議）。
  items:
  - title: 看
    example: 紅色的郵筒
    text: 顏色、形狀、大小。
  - title: 聽
    example: 機車噗噗的聲音
    text: 聲音的大小、遠近。
  - title: 聞
    example: 麵包店的香味
    text: 氣味。
  - title: 摸（大人同意的）／嘗（在家）
    example: 樹皮粗粗的；柳丁酸酸甜甜
    text: 摸大人同意的東西；嘗只用大人準備的食物。
  checklist_title: 記下每一種感官：
  checklist:
  - 看到的
  - 聽到的
  - 聞到的
  - 摸到的
  - 嘗到的（在家）
