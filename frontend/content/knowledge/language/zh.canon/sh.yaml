idea: 高中國文每冊有一課文化經典。讀經典先弄清楚原句在什麼情境說的、原本的意思，再思考今天可以怎麼用；不要斷章取義。
guiding_questions:
- 「己所不欲，勿施於人」放到今天的網路留言，還適用嗎？
scenario: 親子共學：每週全家選一則《論語》，各說一個這週發生的相關例子。
goal: 讀懂文化經典裡的一句話（例如《論語》《孟子》），說出原意並舉一個今天的例子。
review: 孩子選 3 則經典語句，各寫原意與一個生活例子；家長確認原意與注本相符，例子不是硬套。
