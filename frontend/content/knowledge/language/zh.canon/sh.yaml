why:
  heading: 一句話要放回原來的情境
  body:
  - 國語文課綱規定高中國文「每冊應選一課文化經典，選材範圍應具時代、思想流派及文體之多樣性」。另外，普通型高中的國語文必修學分裡也含中華文化基本教材；兩者是不同的規定。
  - 經典語句常被單獨引用。只看一句，容易忽略說話的人、對象和情境，意思就可能跑掉。
  qa:
    question: 「己所不欲，勿施於人」放到今天的網路留言，還適用嗎？
    answer: 先看原意：教育部《成語典》說它出自《論語．衛靈公》，子貢問「有一言而可以終身行之者乎？」孔子答「其恕乎！己所不欲，勿施於人。」意思是「自己所不喜歡的事物，不要加在別人身上」。放到網路留言：自己不想被公開嘲笑，就不要那樣留言給別人（本站整理的例子）。
    source: idiom-jisuo
  items_title: 高中課綱的經典閱讀目標
  items:
  - title: 主動探索文本意涵
    text: 國語文 5-Ⅴ-5：主動思考與探索文本的意涵，建立終身學習能力。
    code: 5-V-5
  - title: 思想等文化內涵
    text: 國語文 Cc-Ⅴ-1：各類文本中的藝術、信仰、思想等文化內涵。
    code: Cc-V-1
  - title: 道德倫理等文化內涵
    text: 國語文 Cb-Ⅴ-1：各類文本中的親屬關係、道德倫理、儀式風俗、典章制度等文化內涵。
    code: Cb-V-1
  - title: 認識多元價值
    text: 國語文 5-Ⅴ-6：在閱讀過程中認識多元價值、尊重多元文化，思考生活品質、人類發展及環境永續經營的意義與關係。
    code: 5-V-6
  sources:
  - kuoyu
  - idiom-jisuo
how:
  heading: 原句、情境、原意、今例
  body:
  - 每讀一句經典，依序做四件事（本站整理）：找出原句和篇名，看上下文是誰對誰說、在什麼情境，對照注本說出原意，最後才舉今天的例子。
  items_title: 讀一句經典（本站整理）
  items:
  - title: 找原句和出處
    text: 查出這句話在哪一部書、哪一篇。
    example: 《論語．衛靈公》
  - title: 看情境
    text: 是誰問、誰答、為了什麼說的？
    example: 子貢問，孔子答
  - title: 說出原意
    text: 對照注本或辭典，用自己的話說。
  - title: 舉今天的例子
    text: 例子要符合原意，不要硬套。
  checklist_title: 每一句都要：
  checklist:
  - 寫出篇名
  - 說出情境
  - 核對注本
  - 例子不硬套
  activity_figure: how-flow
  sources:
  - idiom-jisuo
what:
  heading: 原意與今天的應用
  figures:
  - what-compare
  notes:
  - 課綱說文化經典的選材要「具時代、思想流派及文體之多樣性」，所以不只《論語》；本點用《論語》示範讀法。
  - 「3 則」是示意的檢核數量。
  sources:
  - kuoyu
