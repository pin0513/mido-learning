idea: 能說還要能寫。日記和明信片是最好的起點：今天做了什麼、感覺如何、問候對方。寫的時候注意假名與漢字的搭配、通篇敬體或常體一致。JLPT 不考寫作，這一點補上檢定沒量到的能力。
guiding_questions:
- 同一件事，寫給日本朋友和寫在日記裡，用字會一樣嗎？
scenario: 親子共學：全家一起寫一張日語明信片寄給日本朋友或筆友，大人負責地址，孩子負責內容。
goal: 用日語寫日記或明信片：5 句以上，假名與漢字寫對，敬體一致。
review: 孩子寫一張 5 句以上的日語明信片給朋友，家長用字典或翻譯工具逐句對照，意思正確、通篇敬體或常體一致，錯字不超過 2 個。
