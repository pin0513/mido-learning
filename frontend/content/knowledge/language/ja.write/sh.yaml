idea: 日記寫自己今天做了什麼、感覺如何；明信片寫給認識的人，先問候、再說近況、最後祝福（格式是本站整理）。寫的時候整篇要統一用敬體或常體。JLPT 目前沒有作文考試，寫作要另外練。
