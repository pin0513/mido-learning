goal: 用日語寫一篇日記或一張明信片草稿，照本頁的格式，整篇統一用常體或敬體，助詞は、を寫對。
review: 孩子寫一篇 5 句以上的日記或一張明信片草稿，家長用字典逐句對照：格式符合本頁、意思正確、整篇統一用常體或敬體、錯字不超過 2 個（句數、錯字數是示意）。
