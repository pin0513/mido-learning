why:
  heading: 把生活寫成日文
  body:
  - 第二外國語文領綱的四級學習表現有「能自由書寫日記。」（4-Ⅴ-12）和「能依主題書寫簡易短文。」（4-Ⅴ-13）。
  - JLPT 官網常見問題回答有沒有會話和作文考試：「いいえ、今のところ、どちらもありません。」所以寫作要另外練。
  items_title: 第二外國語文領綱的學習重點
  items:
  - title: 書寫日記
    text: 第二外國語文 4-Ⅴ-12：能自由書寫日記。
    code: 4-V-12
  - title: 依主題寫短文
    text: 第二外國語文 4-Ⅴ-13：能依主題書寫簡易短文。
    code: 4-V-13
  checklist_title: 開始前先確認
  checklist:
  - 會寫假名
  - 會說です句
  notes:
  - 第二外國語文的Ⅴ代表語文程度三級、四級，不是年級；高中由學校在加深加廣選修、多元選修或校訂課程開設，不是每校都有。本點對到三級、四級是本站建議。
  sources:
  - sfl
  - jlpt-faq
how:
  heading: 選格式、統一句尾、檢查
  body:
  - 本站整理的兩種格式：日記寫日期、今天做了什麼、感覺如何，寫給自己看，可用常體；明信片草稿先問候、再說近況、最後祝福，寫給老師、長輩用敬體，給同學、家人也可以用常體。不管哪一種，整篇句尾要一致：〈敬語の指針〉說「です」「ます」加在句尾，是對「話や文章の相手」添上禮貌。
  - 寫完檢查：助詞依〈現代仮名遣い〉「助詞の『を』は,『を』と書く。」「助詞の『は』は,『は』と書く。」；漢字用字典確認寫法。AI 只用來檢查錯字和文法，句子要自己寫（本站建議）；明信片草稿不寫地址、電話。
  qa:
    question: 同一件事，寫在日記裡和寫給朋友，用字會一樣嗎？
    answer: 要看寫給誰。日記寫給自己看，可用常體；明信片寫給老師、長輩用敬體，寫給同學、家人也可以用常體（本站整理）。〈敬語の指針〉說「です」「ます」是對「話や文章の相手」添上禮貌；不管選哪一種，整篇要一致。
    source: keigo
  items_title: 本站整理的寫法
  items:
  - title: 日記
    text: 日期、做了什麼、感覺（可用常體）
  - title: 明信片草稿
    text: 問候、近況、祝福（給老師、長輩用敬體，給同學、家人可用常體）
  - title: 句尾一致
    text: 整篇統一用常體或敬體
  - title: 助詞寫法
    text: は、を照〈現代仮名遣い〉寫
  checklist_title: 每次寫完勾一下
  checklist:
  - 句子自己寫
  - 句尾統一
  - 助詞寫對
  - 沒寫個人資料
  activity_figure: write-flow
  sources:
  - keigo
  - kana
what:
  heading: 寫出日記或明信片草稿
  body:
  - 學完後，孩子能照本頁的格式寫一篇日記或一張明信片草稿，整篇統一用常體或敬體，助詞は、を寫對。
  items_title: 學完能做到
  items:
  - title: 照格式寫
    text: 日記或明信片草稿。
  - title: 句尾一致
    text: 整篇常體或敬體。
  - title: 自己檢查
    text: 助詞與漢字寫對。
  checklist_title: 家長檢核
  checklist:
  - 格式符合
  - 句尾一致
  - 錯字在範圍內
  figures:
  - write-compare
  notes:
  - 檢核的 5 句、2 個錯字是示意。
  - 本站建議：JLPT 目前沒有作文考試（官網常見問題），本點練的是檢定量不到的寫作；把本點放在 JLPT N4 到 N3 的程度是本站建議，不是官方換算。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，其他商用工具「應經由學校評估資安風險」，並在師長指導下使用；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料，自己或別人的錄音也不上傳（本站建議）；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - kana
  - genai-student
