- 原有待核對「課綱對應只到領域、核心素養與議題…」已刪除：本點已逐條對照第二外國語文領綱Ⅴ（三級、四級）原文（頁碼見來源）；列入的代碼不與其他領綱同號，也不在 main 與 B7、B8、B9 的代碼表裡。
- 日文以 JLPT 為主要基準，108 課綱第二外國語文為次要對照；學段與 JLPT 級數的對應是本站建議，不是官方換算。
- 基準標籤：JLPT 不考寫作。
- 本點為這次補強新增，內容尚未經老師審閱。
- JLPT 的測驗科目不含寫作與口說；本點的檢核以家長對照字典為準。
- 第二外國語文 4-Ⅴ-12、4-Ⅴ-13 依領綱原文逐字核對（p.9），不與其他領綱同號，也不在 main 與 B7–B9 的代碼表裡。
- 第二外國語文高中核心素養只有外-U-A1、A2、B1、B2、B3、C1、C2、C3（領綱 p.2–4），列入的項目依附錄一的對應或核心素養原文挑選。B1 依外-U-B1 原文；原有的 A2 已刪除。
- 日記與明信片的格式是本站整理；JLPT 常見問題、〈敬語の指針〉p.20 與〈現代仮名遣い〉第2 的引文依原文逐字核對。
- 安全：明信片草稿不寫地址、電話等個人資料，不寄給網路上不認識的人；AI 只檢查，不代寫（教育部學生版注意事項六（三）、六（四））。
