why:
  heading: 字母有名字，也有聲音
  body:
  - 英語文領綱第二學習階段把「能聽辨 26 個字母」「能說出 26 個字母」「能辨識 26 個印刷體大小寫字母」列為學習表現，學習內容也把「字母名稱」和字母拼讀規則分開列；國小「只須學會印刷體的辨識與書寫」（p.27）。美國共同核心標準也要幼兒園學生說出每個子音最常見的聲音，並把五個主要母音的長音、短音和常見拼法連起來。所以字母要學兩件事：名字和聲音。
  qa:
    question: 為什麼 A 有時候念「欸」，有時候念「ㄚ」？
    answer: 念「欸」比較接近 A 的字母名；A 的長音和字母名念法相同（本站整理）。在 cat 這類字裡，A 發的是短音。共同核心標準 RF.K.3b 要學生把母音的長音和短音都和拼法連起來。注音只能近似英語發音（本站整理）。
    source: ccss-ela
  items_title: 英語文領綱的相關條目（只在內文引用）
  items:
  - title: 聽辨字母
    text: 英語文 1-Ⅱ-1：能聽辨 26 個字母。
  - title: 說出字母
    text: 英語文 2-Ⅱ-1：能說出 26 個字母。
  - title: 辨識大小寫
    text: 英語文 3-Ⅱ-1：能辨識 26 個印刷體大小寫字母。
  - title: 字母名稱
    text: 英語文 Aa-Ⅱ-1：字母名稱。
  checklist_title: 開始前先確認
  checklist:
  - 知道字母有名字
  - 知道字母有聲音
  - 準備 26 張字母卡
  notes:
  - 這些條目與其他領綱同號，只在內文引用，不列入代碼欄位。
  - 注音只能近似英語發音（本站整理）。
