idea: 每個字母有名字（b 念 /biː/），也有它在單字裡發出的聲音（ball 開頭的 /b/）。名字和聲音分開記，後面拼讀才會順。
guiding_questions:
- 為什麼 A 有時候念「欸」，有時候念「ㄚ」？
scenario: 親子共學：做 26 張字母卡，正面寫字母，背面畫一個開頭是這個聲音的東西，例如 b 是 ball。
goal: 認得 26 個印刷體大小寫字母，分得清字母名和字母在單字裡的聲音。
review: 家長隨機指 10 個字母，孩子說出名字和聲音（例如 b 念 /b/），再說一個這個聲音開頭的字；至少 9 個全對（10 個、9 個是示意）。
