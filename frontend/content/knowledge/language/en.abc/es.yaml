how:
  heading: 名字和聲音分開練
  body:
  - 本站建議：先用字母卡練大小寫配對，再練「字母名、字母音、開頭字」三步。子音先練最常見的一個聲音；母音（a、e、i、o、u）先練短音，再認識長音。
  items_title: 本站建議的練法
  items:
  - title: 大小寫配對
    text: 把大寫卡和小寫卡配成一對，例如 B 配 b。
  - title: 先名字再聲音
    text: 指著字母先說名字，再說它在單字裡的聲音。
  - title: 找開頭字
    text: 說一個用這個聲音開頭的字，例如 b 是 ball。
  - title: 母音兩種音
    text: a 在 cat 裡是短音；長音和字母名念法相同（本站整理）。
  checklist_title: 每天練完勾一下
  checklist:
  - 大小寫配對
  - 說出名字
  - 說出聲音
  - 說一個開頭字
  activity_figure: abc-flow
  notes:
  - 練法是本站建議；聲音和拼法的對應以共同核心標準 RF.K.3 為準。
  sources:
  - ccss-ela
  - english
what:
  heading: 字母名和字母音不一樣
  body:
  - 字母卡背面畫的是開頭聲音，不是字母名：b 的名字念 /biː/，在 ball 裡發 /b/。孩子能分清這兩種念法，下一步自然發音（en.phonics）才拼得起來。
  items_title: 學完能做到
  items:
  - title: 認得大小寫
    text: 26 個印刷體大小寫字母都認得。
  - title: 分清名字和聲音
    text: 說得出字母名，也說得出字母音。
  - title: 說出開頭字
    text: 每個字母說得出一個用它的聲音開頭的字。
  checklist_title: 家長檢核
  checklist:
  - 大小寫都認得
  - 名字聲音分清
  - 說得出開頭字
  figures:
  - abc-compare
  notes:
  - 檢核用的 10 個、9 個是示意，家長可依孩子程度調整。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網E-BOT），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  - 國小書寫也只要求印刷體（英語文 4-Ⅱ-1「能書寫 26 個印刷體大小寫字母」，p.12）。
  sources:
  - english
  - ccss-ela
  - genai-student
