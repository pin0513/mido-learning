why:
  heading: 自我介紹的第一個句型
  body:
  - 國際交流基金的《いろどり》入門（A1）在第 3 課自我介紹時，第一個文法是「Nです」，底下第二行是「N1 は N2 です」，例句「トンです。」「私はマルシアです。」介紹自己、家人和東西，都可以從這個句型開始（本站整理）。
  - 第二外國語文領綱的學習內容（歐語、日語共通）有「簡易常用的句型結構。」（Ad-Ⅳ-1），二級學習表現有「能使用簡單的用語介紹家人和朋友。」（2-Ⅳ-9）。
  items_title: 第二外國語文領綱的學習重點
  items:
  - title: 句型結構
    text: 第二外國語文 Ad-Ⅳ-1：簡易常用的句型結構。
  - title: 介紹家人朋友
    text: 第二外國語文 2-Ⅳ-9：能使用簡單的用語介紹家人和朋友。
  checklist_title: 開始前先確認
  checklist:
  - 會念平假名
  - 會說招呼語
  notes:
  - 第二外國語文的Ⅳ代表語文程度一級、二級，不是年級；國中由學校在彈性學習課程選開，不是每校都有。
  sources:
  - irodori
  - sfl
how:
  heading: N1 は N2 です
  body:
  - 肯定句：「N1 は N2 です」，例如「私はマルシアです。」否定句：「Nじゃないです」，例如「ベトナムじゃないです。」（句型與例句依《いろどり》文法ノート）。
  - 本站整理：介紹人和東西時，先說主題再加は，接著說它是什麼，最後加です；否定時把です換成じゃないです，寫作文時可用比較正式的ではありません。例詞：ちち（我爸爸）、はは（我媽媽）、がくせい（學生）、せんせい（老師）、りんご（蘋果）、くだもの（水果），例如「ちちは せんせいです」「りんごは くだものです」。
  qa:
    question: 「わたしは学生です」的「は」為什麼念「わ」？
    answer: 因為它是助詞。文化庁〈現代仮名遣い〉規定「助詞の『は』は,『は』と書く。」，例子就有「今日は日曜です」；寫成は、念成わ（念法是本站整理）。
    source: kana
  items_title: 《いろどり》的句型
  items:
  - title: 肯定
    text: N1 は N2 です
    example: 私はマルシアです。
  - title: 否定
    text: Nじゃないです
    example: ベトナムじゃないです。
  - title: 正式否定
    text: N1 は N2 ではありません（本站整理）。
  - title: 本頁例詞
    text: ちち、はは、がくせい、せんせい、りんご、くだもの（本站整理）。
  checklist_title: 每次練完勾一下
  checklist:
  - 說了肯定句
  - 說了否定句
  - は念成わ
  activity_figure: desu-flow
