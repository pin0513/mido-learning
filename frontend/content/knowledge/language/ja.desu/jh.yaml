what:
  heading: 用です介紹人和東西
  body:
  - 學完後，孩子能用「N1 は N2 です」說肯定句，用「じゃないです」說否定句，介紹家人和身邊的東西。
  items_title: 學完能做到
  items:
  - title: 肯定句
    text: 說出「N1 は N2 です」。
  - title: 否定句
    text: 把です換成じゃないです。
  - title: 念對は
    text: 助詞は念成わ。
  checklist_title: 家長檢核
  checklist:
  - 肯定句正確
  - 否定句正確
  - は念對了
  figures:
  - desu-compare
  notes:
  - 檢核的句數與門檻是示意。
  - 本站建議：本點可當作 JLPT N5 的準備；這是本站建議的對應，不是官方換算。JLPT 官網寫 N5 是「基本的な日本語をある程度理解することができる」。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
