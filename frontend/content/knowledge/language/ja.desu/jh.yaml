idea: 「わたしは学生です」是「N1 は N2 です」的句型：は接在主題後面，です放在句尾，意思是「N1 是 N2」。否定說「N1 は N2 じゃないです」，比較正式的說法是「ではありません」（本站整理）。
guiding_questions:
- 「わたしは学生です」的「は」為什麼念「わ」？
scenario: 親子共學：用「〜は〜です」介紹家人和身邊的東西，例如「ちちは せんせいです」「りんごは くだものです」，寫在自己畫的圖卡下面。
goal: 用「〜は〜です」和「〜じゃないです」說出肯定句和否定句，介紹人和東西。
review: 孩子用本頁的例詞，肯定句、否定句各說 3 句介紹家人或東西，家長對照本頁的句型確認，6 句至少 5 句正確（句數與門檻是示意）。
