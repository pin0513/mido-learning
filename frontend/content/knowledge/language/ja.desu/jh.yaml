idea: 日文的語序是「主題 → 內容 → 動詞」。「わたしは学生です」先說主題，最後才說「是」。
guiding_questions:
- 日文的動詞為什麼放在句子最後面？
scenario: 親子共學：用「〜は〜です」介紹家裡每個人：「父は先生です」，貼在家人的照片下面。
goal: 用「〜は〜です」「〜ではありません」介紹人和東西。
review: 孩子用這兩個句型各說 3 句介紹家人或物品，家長對照課本句型，6 句都正確。
