why:
  heading: 課本外的英文更真實
  body:
  - 學測英文的選文「取材來源為報紙、雜誌、書籍、網際網路等」；本點先練其中的新聞（本站建議）。
  - 英語文領綱第五學習階段要學生「能評估不同資訊，提出合理的判斷或建議」（9-Ⅴ-7），較高階的 *6-Ⅴ-7 是「能積極以英語文為工具，探索新知並關注國際議題。」；聽的方面則有「能聽懂英語新聞報導（影片或廣播）的主要內容。」（1-Ⅴ-12）。
  qa:
    question: 同一則新聞，英文報導和中文報導寫得一樣嗎？
    answer: 常常不一樣：標題強調的重點、第一句先講什麼、引用了誰，都可能不同（本站整理）。英語文領綱要學生「能評估不同資訊，提出合理的判斷或建議」，比較兩則報導就是在練這件事。
    source: english
  items_title: 高中英語文課綱的相關條目
  items:
  - title: 評估資訊
    text: 英語文 9-Ⅴ-7：能評估不同資訊，提出合理的判斷或建議。
    code: 9-V-7
  - title: 合理判斷
    text: 英語文 D-Ⅴ-7：不同資訊的評估，及合理判斷或建議的提供。
    code: D-V-7
  - title: 延伸閱讀
    text: 英語文 7-Ⅴ-6：能針對同一文本主題進行延伸閱讀或探索，以強化學習的深度與廣度。
    code: 7-V-6
  - title: 關注國際議題
    text: 英語文 *6-Ⅴ-7：能積極以英語文為工具，探索新知並關注國際議題。
    code: 6-V-7
