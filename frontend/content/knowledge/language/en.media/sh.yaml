idea: 英文新聞是寫給一般讀者的，不會配合課本的生字和句型（本站整理）。先挑自己有興趣的主題，從標題、第一段和圖表開始讀；同一則新聞找兩個來源比較，看誰被引用、強調了什麼（本站建議）。
guiding_questions:
- 同一則新聞，英文報導和中文報導寫得一樣嗎？
scenario: 親子共學：找同一則國際新聞的英文和中文報導，比較標題、第一句和引用的人有什麼不同。
goal: 讀英文新聞，抓出主要事件和引用來源，並比較英文與中文報導的角度。
review: 找同一則國際新聞的英文與中文報導，孩子寫出兩則的標題、第一句與引用來源差在哪；家長點開兩則原文確認。
