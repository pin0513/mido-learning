how:
  heading: 同一則新聞，比兩個來源
  body:
  - 本站建議：先讀標題和第一段，抓出誰、做了什麼、在哪裡；再找文中引用了誰的話；最後和中文報導對照，寫下標題、第一句和引用來源差在哪，看兩則各自強調了什麼。生字先靠上下文猜，影響理解的再查。
  - 讀完同一主題後，可以再找一篇延伸閱讀，英語文領綱稱為「能針對同一文本主題進行延伸閱讀或探索，以強化學習的深度與廣度。」（7-Ⅴ-6）
  - 用 AI 練習時，照教育部注意事項（學生版）做：先確認符合平臺的註冊年齡限制，優先用為教育目的設計的工具（例如酷英網的 CoolE Bot），在家使用請家長陪伴；不輸入自己或他人的個人資料；AI 的回答要查證，不直接採信；作業「應依規定註明所使用的工具及用途，不得將生成內容直接當作自己原創作品繳交」，也不能用 AI 抄襲、代寫或作弊。
  items_title: 本站建議的讀法
  items:
  - title: 讀標題和首段
    text: 抓出誰、做了什麼、在哪裡。
  - title: 找引用來源
    text: 文中引用了誰的話。
  - title: 對照中文報導
    text: 比較標題、第一句、引用的人。
  - title: 延伸閱讀
    text: 同一主題再讀一篇。
  checklist_title: 讀完勾一下
  checklist:
  - 抓出主要事件
  - 找到引用來源
  - 寫下差異
  activity_figure: media-flow
  sources:
  - english
  - genai-student
  - moe-coolebot
what:
  heading: 比較報導的角度
  body:
  - 學完後，孩子能讀懂英文新聞的重點，並比較同一則新聞在不同報導裡的標題、開頭與引用來源。
  items_title: 學完能做到
  items:
  - title: 讀懂重點
    text: 說出新聞的主要事件。
  - title: 找出來源
    text: 說出報導引用了誰。
  - title: 比較角度
    text: 說出兩則報導強調的不同。
  checklist_title: 家長檢核
  checklist:
  - 兩則原文都點開
  - 差異寫得具體
  figures:
  - media-compare
  notes:
  - 把高中對應全民英檢中級、學測是本站建議，不是官方換算。
  - 比較標題、第一句與引用來源的方法是本站建議。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網的 CoolE Bot），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - english
  - genai-student
  - moe-coolebot
