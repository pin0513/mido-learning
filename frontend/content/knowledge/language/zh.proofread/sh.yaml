# B5 提案：zh.proofread@sh
# - 「學測國寫的評分原則寫明標點與錯別字「斟酌扣分」」正確：考試說明範例「視標點符號使用之欠當或錯別字之多寡，斟酌扣分」，115 學年度評分原則也有同樣規定；改成逐字引用並註明出處。
# - 「交卷前 5 分鐘」與「題目要求→病句→錯字標點」的順序是本站建議，已標示（原文寫成像規定）。
# - 補 grades、6-Ⅴ-5 與 Why/How/What、兩張圖；「400 字」「不超過 2 處」標示意。
