goal: 交卷前照固定清單校對：題目要求、病句、錯字、標點。
review: 孩子限時寫完 400 字短文，用自己的 5 項清單計時 5 分鐘校對（5 分鐘是本站建議，示意）；家長再看一次，殘留的錯字與標點錯誤不超過 2 處（400 字、2 處是示意）。
