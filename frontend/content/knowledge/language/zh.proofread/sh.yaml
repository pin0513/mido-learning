why:
  heading: 錯字和標點會扣分
  body:
  - 115 學年度國寫評分原則，第二大題寫「視標點符號之使用與錯別字之多寡，斟酌扣分」；第一大題也要「審視字數是否符合要求，錯別字是否過多，另斟酌扣分」。大考中心考試說明的範例同樣寫「視標點符號使用之欠當或錯別字之多寡，斟酌扣分」。
  - 國語文課綱要高中生「運用各種寫作技巧，反覆推敲、修改以深化作品的內涵層次」。校對是修改的最後一步。
  qa:
    question: 交卷前只剩 5 分鐘，先檢查錯字、標點，還是病句？
    answer: 本站建議先看題目要求有沒有漏答，例如 115 學年度第一大題第二小題要「舉出選擇逃避或積極承擔的事例」，並「表達自己的看法與省思」。接著看病句，最後掃錯字和標點。
    source: ceec-115
  items_title: 高中課綱的修改目標
  items:
  - title: 反覆推敲修改
    text: 國語文 6-Ⅴ-5：運用各種寫作技巧，反覆推敲、修改以深化作品的內涵層次，提升藝術價值。
    code: 6-V-5
  sources:
  - ceec-115
  - ceec
  - kuoyu
how:
  heading: 題目、病句、字、標點
  body:
  - 照固定順序看，每一輪只找一種錯（本站建議）。清單寫在練習本第一頁，每次限時寫作都照著用。
  items_title: 校對順序（本站建議）
  items:
  - title: 對照題目要求
    text: 每個要求都寫到了嗎？字數和行數合規定嗎？
  - title: 找病句
    text: 默讀一遍，卡住的句子就是病句候選。
  - title: 掃錯別字
    text: 放慢速度逐字看，特別是同音字。
  - title: 看標點
    text: 句子結束有句號嗎？一逗到底要拆開。
  checklist_title: 我的校對清單：
  checklist:
  - 要求都寫到
  - 字數合規定
  - 沒有病句
  - 沒有錯別字
  - 標點正確
