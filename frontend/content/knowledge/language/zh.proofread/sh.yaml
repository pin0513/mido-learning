idea: 校對要有固定順序：先看有沒有漏答題目要求，再看病句，最後掃錯字與標點。學測國寫的評分原則寫明標點與錯別字「斟酌扣分」。
guiding_questions:
- 交卷前只剩 5 分鐘，先檢查錯字、標點，還是病句？
scenario: 親子共學：複習版：做一張自己的 5 項校對清單，拿一篇限時寫完的短文，計時 5 分鐘照清單改。
goal: 交卷前 5 分鐘照固定清單校對：題目要求、病句、錯字、標點。
review: 孩子限時寫完 400 字短文，用自己的 5 項清單計時 5 分鐘校對；家長再看一次，殘留的錯字與標點錯誤不超過 2 處。
