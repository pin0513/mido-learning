idea: 作者常不直接說，而是寫動作、表情、對話讓讀者推。推論要有證據：說出「因為文中寫了……，所以我猜……」，猜錯了就回去找線索。
guiding_questions:
- 文章沒寫「他很緊張」，你怎麼知道他很緊張？
scenario: 親子共學：看一張家庭照片或一頁漫畫，大家說出「我猜……，因為……」，沒有證據的猜測不算分。
goal: 從文中線索推論沒有直接寫出來的事，並說出是哪一句讓你這樣想。
review: 家長出 3 題推論題（例如「角色當時心情如何」），孩子每題都說出依據的那一句；理由對得上原文的至少 2 題。
