why:
  heading: 作者不會什麼都說
  body:
  - PIRLS（促進國際閱讀素養研究）說，讀者在理解文章時，會推論文中沒有明白寫出的想法或訊息，例如推論一件事造成另一件事、說出角色這麼做的原因。
  - 課綱一、二年級要「運用簡單的預測、推論等策略，找出句子和段落明示的因果關係」；五、六年級進一步「推論文本隱含的因果訊息或觀點」。
  qa:
    question: 文章沒寫「他很緊張」，你怎麼知道他很緊張？
    answer: 看他的動作、表情和說的話。例如「他的手一直搓著衣角，說話結結巴巴」，這些線索加起來，可以推論他很緊張。PIRLS 也說，角色在故事中的行動，可能清楚指向他的某種特質；從線索推出沒寫的事，就是推論。
    source: pirls-infer
  items_title: 推論的三個台階
  items:
  - title: 找明示的因果
    text: 一、二年級：運用簡單的預測、推論等策略，找出句子和段落明示的因果關係，理解文本內容。
    code: 5-I-7
  - title: 預測、推論、提問
    text: 三、四年級：運用預測、推論、提問等策略，增進對文本的理解。
    code: 5-II-8
  - title: 推論隱含的訊息
    text: 五、六年級：運用自我提問、推論等策略，推論文本隱含的因果訊息或觀點。
    code: 5-III-8
  sources:
  - pirls-infer
  - naer-pirls
  - kuoyu
how:
  heading: 我猜……，因為……
  body:
  - 每一個推論都要配一句文中的證據：先說「我猜……」，再說「因為文中寫了……」。找不到證據，就回到文章再找；找到相反的證據，就改掉原來的猜測。
  items:
  - title: 從動作推
    example: 「他把門用力一甩」→ 可能在生氣
    text: 例句是本站自編。
  - title: 從表情推
    example: 「她眼眶紅紅的」→ 可能剛哭過
    text: 表情常透露心情。
  - title: 從對話推
    example: 「隨便啦，都可以。」→ 可能不太想選
    text: 說話的語氣也是線索。
  checklist_title: 每一個推論都要有：
  checklist:
  - 說出我的推論
  - 指出文中證據
  - 證據對得上
  - 找不到就再讀
  activity_figure: how-flow
  sources:
  - kuoyu
what:
  heading: 推論＝線索＋理由
  figures:
  - what-compare
  notes:
  - 推論的答案不一定只有一個，但每個答案都要有文中的證據（本站建議）。
  - PIRLS 的直接推論題例：推論一件事造成另一件事、說出角色行動的原因、描述兩個角色的關係。
  - 對照：PIRLS 把答案就寫在文中的題目歸為「Focus on and Retrieve」（提取），例如找出故事的時間和地點。
  sources:
  - pirls-infer
  - pirls-retrieve
