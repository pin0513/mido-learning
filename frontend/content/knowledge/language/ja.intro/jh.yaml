idea: 日語自我介紹有固定的開頭和結尾：はじめまして開始，〜です說名字，〜が好きです說喜歡的東西，最後說よろしくお願いします（本站整理）。
guiding_questions:
- 第一次見面，日本人怎麼開始自我介紹？
scenario: 親子共學：全家輪流當「新同學」，用日語自我介紹，再互相問一個問題；可以錄影給自己看，影片不上傳、不寄給別人（本站建議）。
goal: 用日語說四句自我介紹（約 20 秒，20 秒是示意），並回答對方的 3 個簡單問題（3 個是示意）。
review: 孩子對家人說本頁的四句日語自我介紹（約 20 秒，含名字和喜歡的東西），再用本頁的回答範例回答家長的 3 個問題，例如「お名前は？」；家長聽得懂、回答都切題（20 秒、3 個問題是示意）。
