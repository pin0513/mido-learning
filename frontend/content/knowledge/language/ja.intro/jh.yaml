idea: 一段日文自我介紹有固定的開頭和結尾：はじめまして……どうぞよろしく。中間放名字、學校、喜歡的事。
guiding_questions:
- 「はじめまして」之後，你想讓對方知道你的哪三件事？
scenario: 親子共學：錄一段 30 秒的日文自我介紹影片，寄給一位會日文的親友或筆友，請對方回一句話。
goal: 用日語自我介紹 1 分鐘，並回答對方 3 個簡單問題。
review: 錄一段 1 分鐘日語自我介紹（名字、學校、興趣、喜歡的食物），再回答家長的 3 個問題；家長聽得懂、回答都切題。
