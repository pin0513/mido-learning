why:
  heading: 第一次見面就用得到
  body:
  - 國際交流基金的《いろどり》入門（A1）第 3 課，能力目標是「名前や出身などを言って、簡単な自己紹介をすることができる。」也要能回答初次見面的人問的問題。
  - 第二外國語文領綱的一級學習表現有「能簡單自我介紹。」（2-Ⅳ-6）和「能說出自己的姓名並詢問他人姓名。」（5-Ⅳ-3），學習內容有「自我介紹。」（Bb-Ⅳ-1）。
  qa:
    question: 第一次見面，日本人怎麼開始自我介紹？
    answer: 常用「はじめまして」開始，再說「〜です」。《いろどり》第 3 課的課名是「よろしくお願いします」，第一個活動就叫「はじめまして」。
    source: irodori
  items_title: 第二外國語文領綱的學習重點
  items:
  - title: 自我介紹
    text: 第二外國語文 2-Ⅳ-6：能簡單自我介紹。
  - title: 姓名
    text: 第二外國語文 5-Ⅳ-3：能說出自己的姓名並詢問他人姓名。
  - title: 學習內容
    text: 第二外國語文 Bb-Ⅳ-1：自我介紹。
  checklist_title: 開始前先確認
  checklist:
  - 會說です句
  - 會說招呼語
  notes:
  - 第二外國語文的Ⅳ代表語文程度一級、二級，不是年級；國中由學校在彈性學習課程選開，不是每校都有。
  sources:
  - irodori
  - sfl
how:
  heading: 四句介紹，再答三題
  body:
  - 本站整理：自我介紹分四句：「はじめまして。」「〇〇です。」「〇〇が好きです。」「よろしくお願いします。」說喜歡的東西用《いろどり》的「Nが好きです」，例如「肉と野菜が好きです。」
  - 回答問題時，先聽懂對方問什麼，例如《いろどり》的「お名前は？」「日本語、できますか？」「魚、好きですか？」，再回答。本站整理的回答範例：「お名前は？」答「〇〇です。」；「日本語、できますか？」答「はい、できます。」或「少しできます。」；「魚、好きですか？」答「はい、好きです。」或「いいえ、好きじゃないです。」另外，和 AI 練習時用虛構的角色名字（本站建議），不輸入真名、學號（教育部學生版注意事項六（三））；真名只在家人、老師、同學面前說，練習時錄的影片只給自己看、不上傳（本站建議）。
  items_title: 本站整理的四句
  items:
  - title: 開頭
    text: はじめまして。
  - title: 名字
    text: 〇〇です。（和 AI 練習時用虛構名字）
  - title: 喜歡的東西
    text: 〇〇が好きです。
  - title: 結尾
    text: よろしくお願いします。
  checklist_title: 每次練完勾一下
  checklist:
  - 說了四句
  - 答了問題
  - 沒輸入真名
  - 影片沒有上傳
  activity_figure: intro-flow
  sources:
  - irodori
  - genai-student
what:
  heading: 能做簡短的自我介紹
  body:
  - 學完後，孩子能用日語說四句自我介紹，並回答對方的簡單問題（含はい／いいえ的回答）。自我介紹裡的名字是個人資料，不要輸入 AI；只在家人、老師、同學面前說，也不要把影片上傳（本站建議）。
  items_title: 學完能做到
  items:
  - title: 四句介紹
    text: はじめまして到よろしくお願いします。
  - title: 回答問題
    text: 聽懂「お名前は？」這類問題，照本頁範例回答。
  - title: 保護自己
    text: 不把真名、學號輸入 AI；影片不上傳（本站建議）。
  checklist_title: 家長檢核
  checklist:
  - 介紹完整
  - 回答切題
  - 影片沒有上傳
  figures:
  - intro-compare
  notes:
  - 目標與檢核的 20 秒、3 個問題是示意。
  - 本站建議：本點可當作 JLPT N5 的準備；這是本站建議的對應，不是官方換算。JLPT 官網寫 N5 是「基本的な日本語をある程度理解することができる」。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - irodori
  - jlpt-levels
  - genai-student
