# - 錯誤修正：原 scenario「錄 30 秒影片寄給親友或筆友」會把孩子的臉、名字傳到網路上，改成只錄給自己看、不上傳也不寄出；原檢核要說「學校」，學校是個人資料，刪除；原 AI「扮演對方陪你練」改成用虛構的角色名字練，不輸入真實姓名、學校；1 分鐘標示意。
# - 自我介紹的句子依《いろどり》第3、5課；第二外國語文 2-Ⅳ-6、5-Ⅳ-3、Bb-Ⅳ-1 與其他領綱同號，只在內文引用。
# - 安全：真名只在家人、老師、同學面前說（本站建議）；不輸入 AI（教育部學生版注意事項六（三））；不上傳影片（本站建議）。
