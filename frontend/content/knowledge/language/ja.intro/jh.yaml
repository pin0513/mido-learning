# - Round 3 審查修正：How body[1] 補教「不輸入真名、學號（教育部學生版注意事項六（三））」和「練習時錄的影片只給自己看、不上傳（本站建議）」，虛構角色名字標本站建議；how.checklist 加「影片沒有上傳」（4 項，與 What 檢核同字）；how.sources 加 genai-student。
# - Round 4 審查建議：How body[1] 的「和 AI 練習時」前面加「另外，」，避免「和」被讀成連接詞；標籤不變。
