why:
  heading: 看懂學校要的分數
  body:
  - ETS 說明，托福 iBT 的總分「is the average of the four section scores, rounded to the nearest half band」，CEFR 對照表裡 B2 是 4–4.5、C1 是 5–5.5，而且「a score of 5 on any section aligns with C1」。
  - 學校的要求可能只看總分，也可能規定各部分的最低分（本站整理），所以要同時看懂總分和四項分數。
  qa:
    question: 申請國外大學說要「托福 4.5」，那是什麼程度？
    answer: 依 ETS 的 CEFR 對照，4–4.5 落在 B2。4.5 是四項平均後取到半級的總分，所以還要看學校有沒有規定各部分的最低分（本站整理）。
    source: toefl-scale
  items_title: 四個部分（ETS）
  items:
  - title: 閱讀
    text: 補完單字、日常閱讀、學術短文。
  - title: 聽力
    text: 回應、對話、公告、學術講課。
  - title: 寫作
    text: 組句、寫 email、學術討論。
  - title: 口說
    text: 聽了複述、模擬面試。
  checklist_title: 開始前先查
  checklist:
  - 學校的總分要求
  - 各部分最低分
