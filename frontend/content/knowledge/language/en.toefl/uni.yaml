verify_notes:
- 待核對：大學不對應 108 課綱，以學門路徑對應。
- 英文以全民英檢、美國小學／中學讀本、多益、托福為主要基準，108 課綱英語文為次要對照；學段與檢定的對應是本站的學習建議，不是官方換算。
- 基準標籤：托福 iBT B2→C1。
- 引用的框架只寫名稱（TOEFL iBT（ETS），CEFR），教材內容是改寫的入門說明，上線前請核對原始出處的用語。
- 本點為這次補強新增，內容尚未經老師審閱。
- '1–6 分量尺與 CEFR 對照取自 ETS〈TOEFL Score Scale Update: A Guide for Institutions〉https://www.ets.org/toefl/institutions/ibt/score-scale-update.html（2026-10-27 讀取）；2026-01-21 前的 0–120 分成績，對照表也在同一頁。'
- 先學列 en.toeic@uni 是依照本站的建議順序（先職場聽讀、再學術四項），不是考試的報名條件。
