# B8 提案：en.toefl@uni
# - 補 Why/How/What 與兩張圖。分數說明依 ETS〈TOEFL iBT Scores〉：各部分 1–6 分、總分是四部分平均並取到最近的半級；CEFR 對照 B2 是 4–4.5、C1 是 5–5.5。
# - 錯誤修正：原 idea 說托福「測的是在大學裡用英文讀、聽、說、寫的能力」，但新版題型也有「Read in Daily Life」、校園生活對話與「Write an Email」；改依 ETS 題型表完整說明。
# - 練習題分數只是參考：檢核改成用官方練習題找出最弱的一項、對照學校要求訂計畫；AI 評分不是 ETS 的成績（顯示在 notes）。
# - 刪除過時的「尚未經老師審閱」；大學對應托福標為本站建議（顯示在 notes）。
# - 第一輪獨立審查修正：先學列移除 en.toeic@uni、改列 related（多益是職場聽讀，不是托福的先備；驗證器規則：同一目標不可同時出現在兩個連結欄，related 不參與先學循環檢查）；goal 改成看懂分數、找弱項、訂計畫；檢核改成練習題有提供分數才記分數，否則記各部分答對率。
# - 第三輪獨立審查修正：goal／What「CEFR 對照」「對照學校要求找差距」只在 Why，How 新增 1–6 分、四項平均取半級與 CEFR 對照一段（toefl-scale，表頭「Total and section scores (1-6)」補進 supports），本站建議段改成先查學校總分與各部分最低分、寫下差距；How items「找最弱一項」補沒有分數時比答對率；how.sources 補 toefl-scale。
# - 第四輪獨立審查修正：（建議項）How 第一段「會聽到」改「可能會聽到」（ETS 原文 You may hear）；How 第二段補各部分與總分都以 0.5 為一級，toefl-scale supports 補「from 1 – 6 in increments of 0.5」。
# - 第五輪獨立審查修正：（建議項）How 第一段「ETS 說全部考試「Please allow…」」改「ETS 提醒，整場考試「Please allow…」」；How 第三段錄音補「只留在自己的裝置、不上傳」（本站建議，比照 emi、work）。 What notes 的 AI 注意事項補「不代寫」（學術倫理電子報（二）著作權「還可能有代寫的學術倫理問題」；是電子報的提醒，不寫成硬規定），ethics-epaper13 supports 補（二）著作權整句（2026-10-29 重抓逐字核對）；How body 補 AI 使用說明（不貼機密、自己查證、自己寫、說明工具），how.sources 加 ethics-epaper13，讓 What 的注意事項在 How 有教到。
# - 第六輪獨立審查修正：（阻擋 R-1）How 的 AI 段落改寫：刪掉和 What notes 重複的電子報引文、合併自我重複的「自己寫／不直接交出去」；不貼個資與未公開文件或機密資料（電子報（三））、輸出自己查證（（一））、內容自己寫（（二））歸給電子報，只有「依課程規定說明用了哪個工具」標本站建議。
