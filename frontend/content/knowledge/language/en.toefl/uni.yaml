  - toefl-about
  - toefl-scale
  - toefl-content
how:
  heading: 找出最弱的一項先補
  body:
  - ETS 提醒，整場考試「Please allow approximately two hours to complete the test. As the test adapts, test time and items may vary.」；聽力可能會聽到「native-speaker English accents from North America, the U.K., New Zealand, or Australia」。
  - ETS 的新量尺是各部分與總分都 1–6 分、以 0.5 為一級（「from 1 – 6 in increments of 0.5」；表頭「Total and section scores (1-6)」），總分是四部分平均、取到最近的半級（rounded to the nearest half band）；CEFR 對照是 4–4.5 為 B2、5–5.5 為 C1。
  - 本站建議：先查想申請學校的總分與各部分最低分，再做一回官方練習題找出最弱的一項，把每一項和學校要求的差距寫下來；每週輪流練四項、最弱的那項多練；寫作和口說錄下來或存檔（錄音只留在自己的裝置、不上傳），下次比較進步。用 AI 幫忙時，照學術倫理電子報的提醒做：不貼個人資訊、未公開文件或機密資料，AI 的輸出自己查證，內容自己寫，不把 AI 生成的內容直接交出去。本站建議：交作業時依課程規定說明用了哪個工具、做了什麼。
  items_title: 本站建議的練法
  items:
  - title: 做官方練習題
    text: 熟悉題型與時間。
  - title: 找最弱一項
    text: 比較四項分數，沒有分數就比答對率。
  - title: 每週輪流練
    text: 最弱的那項多練。
  - title: 存檔比較
    text: 作文和錄音留著比。
  checklist_title: 每週勾一下
  checklist:
  - 四項都練了
  - 最弱項多練
  - 存了作品
  activity_figure: toefl-flow
  sources:
