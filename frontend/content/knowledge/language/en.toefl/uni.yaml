what:
  heading: 訂出自己的托福計畫
  body:
  - 學完後，能看懂托福 iBT 的四項分數與 CEFR 對照，對照想申請學校的要求找出差距，並訂出每週練習計畫。
  items_title: 學完能做到
  items:
  - title: 看懂分數
    text: 說出 4.5、5 對應的 CEFR 程度。
  - title: 找出差距
    text: 對照學校的總分與各項要求。
  - title: 訂出計畫
    text: 每週練什麼、最弱項怎麼補。
  checklist_title: 家人檢核
  checklist:
  - 寫下差距
  - 有每週計畫
  figures:
  - toefl-compare
  notes:
  - 把大學階段對應多益、托福是本站建議，不是官方換算；檢定題型與分數依 ETS 官方說明。
  - 官方練習題的分數只供參考，不是正式成績；AI 工具給的分數也不是 ETS 的成績。
  - 用生成式 AI 時，不要把個人資訊、未公開文件、機密資料貼進去（教育部臺灣學術倫理教育資源中心 2023 年的電子報）；AI 的輸出要自己查證。這份 2023 年的電子報也說，學術界對使用生成式 AI 是否需要標註「尚無統一的規定」，建議先了解相關單位的政策；不要把 AI 生成的內容直接當成自己寫的交出去，電子報提醒，直接使用生成的內容而非親自撰寫，「還可能有代寫的學術倫理問題」；交作業時依課程規定說明用了哪個工具、做了什麼；AI 規定變化快，以學校和課程最新的規定為準（本站建議）。
  sources:
  - toefl-scale
  - ethics-epaper13
