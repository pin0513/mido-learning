idea: 托福 iBT 測的是在大學裡用英文讀、聽、說、寫的能力。2026 年 1 月起改成 1–6 分（每 0.5 一級），四項分數與總分用同一把尺對照 CEFR：4 分是 B2、5 分是 C1，總分是四項的平均。多益偏職場、托福偏學術；兩者都是量尺，重點是補上最弱的那一項。
guiding_questions:
- 申請國外大學說要「托福 4.5」，那是什麼程度？
scenario: 親子共學：大學生挑一間想去的學校，查出它要求的托福分數，和家人一起訂出每週聽說讀寫各練什麼。
goal: 用托福 iBT 量出學術英文四項能力，知道申請國外學校需要的程度。
review: 做一回官方托福 iBT 練習題，記下四項分數（1–6 分，每 0.5 一級），對照 ETS 公布的 CEFR 對照：4 分是 B2、5 分是 C1；再查一間想申請的學校的最低要求，寫下差距與計畫。
