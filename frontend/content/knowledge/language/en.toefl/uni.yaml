idea: 托福 iBT 由 ETS 舉辦，ETS 說它「measures all four academic English skills — reading, listening, speaking and writing — the way they are actually used in a classroom」。題型除了學術短文與課堂講課，也有日常閱讀、校園生活對話和寫 email。各部分 1–6 分，總分是四部分的平均。
guiding_questions:
- 申請國外大學說要「托福 4.5」，那是什麼程度？
scenario: 親子共學：大學生挑一間想去的學校，查出它要求的托福分數，和家人一起訂出每週聽說讀寫各練什麼。
goal: 看懂托福 iBT 的四項分數與 CEFR 對照，用官方練習題找出最弱的一項，對照想申請學校的要求訂出計畫。
review: 做一回官方托福 iBT 練習題；練習題有提供分數就記下四項分數（1–6 分，每 0.5 一級），沒有就記各部分答對率，找出最弱的一項；對照 ETS 公布的 CEFR 對照：4–4.5 是 B2、5–5.5 是 C1；再查一間想申請的學校的最低要求，寫下差距與每週練習計畫。練習分數只供參考，不是正式成績。
formats:
  slides: []
  exercise: 目標：看懂托福 iBT 的四項分數與 CEFR 對照，用官方練習題找出最弱的一項，對照想申請學校的要求訂出計畫。　檢核：做一回官方托福 iBT 練習題；練習題有提供分數就記下四項分數（1–6 分，每 0.5 一級），沒有就記各部分答對率，找出最弱的一項；對照 ETS 公布的 CEFR 對照：4–4.5 是 B2、5–5.5 是 C1；再查一間想申請的學校的最低要求，寫下差距與每週練習計畫。練習分數只供參考，不是正式成績。
