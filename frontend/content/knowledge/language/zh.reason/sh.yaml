why:
  heading: 判斷要有依據
  body:
  - 大考中心的學測國文考試說明，把國寫的知性目標寫成「(1)正確解讀文字或圖表，系統理解、分析歸納，具體描述說明。(2)針對議題進行思辨，提出個人的見解與評斷。(3)文辭組織與表達能力。」
  - 以 115 學年度第一大題第二小題為例，A 級的描述是「能具體舉出選擇逃避或積極承擔的事例，並表達自己的看法與省思，結構允當，條理分明，文辭流暢」。
  qa:
    question: 「我覺得網路很方便」是看法還是論點？少了什麼？
    answer: 只是看法，少了論據。國語文課綱的學習內容是「以事實、理論為論據，達到說服、建構、批判等目的」。補上一個具體事實（例如材料裡的數據或你親眼看到的事），看法才變成有依據的判斷。
    source: kuoyu
  items_title: 高中課綱的論說目標
  items:
  - title: 以事實理論為論據
    text: 國語文 Bd-Ⅴ-1：以事實、理論為論據，達到說服、建構、批判等目的。
    code: Bd-V-1
  - title: 論證方式
    text: 國語文 Bd-Ⅴ-2：論證方式如歸納、演繹、因果論證等。
    code: Bd-V-2
  - title: 圖表輔助說明
    text: 國語文 Bc-Ⅴ-3：數據、圖表、圖片、工具列等輔助說明。
    code: Bc-V-3
  - title: 審題立意選材組織
    text: 國語文 6-Ⅴ-3：熟練審題、立意、選材、組織等寫作步驟，寫出具說服力及感染力的文章。
    code: 6-V-3
  sources:
  - ceec
  - ceec-115
  - kuoyu
how:
  heading: 材料、判斷、例子
  body:
  - 寫成三段（本站建議）：第一段說材料說了什麼，第二段下判斷，第三段舉具體例子並省思。課綱列的論證方式有「歸納、演繹、因果論證等」，可以選一種來支持判斷。
  items_title: 三段結構（本站建議）
  items:
  - title: 材料說了什麼
    text: 用自己的話統整文字或圖表的重點。
  - title: 我的判斷
    text: 一句話說出你的看法。
  - title: 具體例子與省思
    text: 舉材料裡的事實或親身見聞，再說省思。
  checklist_title: 寫完檢查：
  checklist:
  - 統整了材料
  - 判斷一句話
  - 有具體例子
  - 判斷有依據
