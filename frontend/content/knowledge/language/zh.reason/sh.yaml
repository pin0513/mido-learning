idea: 學測知性題要「正確解讀文字或圖表」，再「提出個人的見解與評斷」。先統整材料，再舉具體事例支持你的判斷。
guiding_questions:
- 「我覺得網路很方便」是看法還是論點？少了什麼？
scenario: 親子共學：用一則新聞或圖表練 400 字內短評：一段說材料、一段下判斷、一段舉例與省思。
goal: 學測國寫知性題：讀懂材料或圖表，提出自己的判斷並舉例支持。
review: 用一則新聞或圖表寫 400 字短評，家長檢查三段：材料說了什麼、我的判斷、具體例子；判斷句能被原材料支持。
