why:
  heading: 資料要兜起來才有用
  body:
  - 會考國文第四項考試內容是「文本的統整與應用：提取、統整文本訊息，並轉化為解決問題的能力。」國語文課綱的說明文本學習內容也有「數據、圖表、圖片、工具列等輔助說明」。
  - 會考寫作也用「圖例、報章新聞、問卷調查」等訊息引導寫作；112 年的題目就先給一張「近年來臺灣民眾最喜愛的影劇類型統計」圖。
  qa:
    question: 一張圖和一篇文章說法不一樣，你相信哪一個？
    answer: 先不要急著選邊。比一比兩份資料的時間、單位、調查對象和定義是不是一樣；常常是兩份資料問的不是同一件事。都對照過了還是矛盾，就找第三份可靠的資料查證，並在結論裡說明差異（本站建議）。會考要的正是「提取、統整文本訊息」。
    source: cap-guowen
  items_title: 國中課綱怎麼說
  items:
  - title: 整合知識解決問題
    text: 國語文 5-Ⅳ-4：應用閱讀策略增進學習效能，整合跨領域知識轉化為解決問題的能力。
    code: 5-IV-4
  - title: 圖表輔助說明
    text: 國語文 Bc-Ⅳ-3：數據、圖表、圖片、工具列等輔助說明。
    code: Bc-IV-3
  sources:
  - cap-guowen
  - kuoyu
  - cap-wcontent
  - cap-112w
  - ceec
how:
  heading: 各自讀懂，再對照
  body:
  - 先各自讀懂：圖說了什麼、文說了什麼，各寫一句。再對照：哪裡一樣、哪裡不一樣、為什麼不一樣。最後用自己的話寫出合起來的結論（本站建議的步驟）。
  items:
  - title: 讀圖三件事
    text: 標題、單位、時間（本站建議）。
  - title: 讀文抓重點
    text: 提取和題目有關的訊息。
  - title: 找共同與矛盾
    text: 比較兩份資料的時間、對象與定義（本站建議）。
  checklist_title: 統整兩份資料：
  checklist:
  - 圖說一句
  - 文說一句
  - 找相同與不同
  - 寫出結論
  activity_figure: how-flow
  sources:
  - cap-guowen
