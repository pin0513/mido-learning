idea: 會考國文考「文本的統整與應用：提取、統整文本訊息，並轉化為解決問題的能力。」大學入學考試中心也說學測國文的「文本」「也包含圖表、圖形、圖解、表單等等」。先各自讀懂，再找共同點與矛盾，最後用自己的話統整。讀圖先看標題、單位與時間（本站建議）。
guiding_questions:
- 一張圖和一篇文章說法不一樣，你相信哪一個？
scenario: 親子共學：找一則有圖表的新聞，孩子先讀圖說一句，大人讀文說一句，再一起寫出合起來的結論。
goal: 讀懂圖表，把兩篇以上的資料放在一起比較、統整出結論。
review: 家長給一張統計圖和一篇相關短文，孩子寫 3 句：圖說了什麼、文說了什麼、兩者合起來的結論；家長核對數字讀得對。
