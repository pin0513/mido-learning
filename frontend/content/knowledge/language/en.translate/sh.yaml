what:
  heading: 翻出通順的英文
  body:
  - 學完後，孩子能把中文句子和短段落翻成通順、達意的英文，並對照大考中心的參考答案或官方級分說明自己檢查。
  items_title: 學完能做到
  items:
  - title: 翻出意思
    text: 不逐字硬翻。
  - title: 時態一致
    text: 整段時態前後一致。
  - title: 自我檢查
    text: 對照參考答案與級分說明。
  checklist_title: 家長檢核
  checklist:
  - 主要意思都在
  - 時態一致
  figures:
  - translate-compare
  notes:
  - 題型與配分依大考中心、LTTC 官方說明；把高中對應全民英檢中級、學測是本站建議，不是官方換算。
  - 全民英檢官網提供中譯英的級分說明與各級分範例，沒有逐題參考答案；大考中心每年公布學測非選擇題滿分參考答案與評分原則。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網的 CoolE Bot），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - gept-intermediate
  - ceec-115-scoring
  - genai-student
  - moe-coolebot
