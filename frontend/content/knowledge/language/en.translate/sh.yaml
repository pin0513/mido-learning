why:
  heading: 翻出意思，不是換字
  body:
  - 全民英檢中級中譯英的作答說明是「請將下列的一段中文翻譯成通順、達意且前後連貫的英文。」；學測中譯英的測驗目標是「評量考生將中文句子譯成正確、通順、達意英文的能力」。
  - 英語文領綱第五學習階段要學生「能將中文句子譯成正確的英文。」（4-Ⅴ-5），較高階的 *4-Ⅴ-7 是「能將中文段落翻譯成正確達意的英文。」；查證用字則可以「能利用工具書（如字典、百科全書）或其他線上資源，主動了解所接觸英文的內容。」（7-Ⅴ-2）
  qa:
    question: 「吃飽沒？」為什麼不能直接翻成英文？
    answer: 因為它在中文裡常是打招呼，不是真的問你吃了沒（本站整理）。直譯成問句，對方可能以為你要請他吃飯（本站整理）；要翻出打招呼的意思，例如換成英文的問候語。全民英檢中級也要求翻成「通順、達意且前後連貫的英文」，重點是意思，不是字面。
    source: gept-intermediate
  items_title: 高中英語文課綱的相關條目
  items:
  - title: 查工具書
    text: 英語文 7-Ⅴ-2：能利用工具書（如字典、百科全書）或其他線上資源，主動了解所接觸英文的內容。
    code: 7-V-2
  checklist_title: 動筆前先確認
  checklist:
  - 看懂整段意思
  - 找出主詞動詞
  sources:
  - gept-intermediate
  - ceec-english
  - english
how:
  heading: 先懂意思，再選句型
  body:
  - 本站建議：先讀懂整句或整段在說什麼；找出英文句子的主詞和動詞；決定時態和句型；最後用字典核對沒把握的字和搭配。
  - 學測中譯英「以單句翻譯為主」；115 學年度的評分原則寫明兩題各占 4 分，扣分是「每個錯誤扣 0.5 分，相同的錯誤只扣一次」；全民英檢中級是翻譯一段，占寫作的 40%。
  - 本站建議：翻完先自己對照——學測題對大考中心公布的「滿分參考答案」，英檢題對 LTTC 4 級分說明「內容適切表達題意」，看主要意思是否都翻到、時態是否一致，再請家長複查。用 AI 練習時，照教育部注意事項（學生版）做：先確認符合平臺的註冊年齡限制，優先用為教育目的設計的工具（例如酷英網的 CoolE Bot），在家使用請家長陪伴；不輸入自己或他人的個人資料；AI 的回答要查證，不直接採信；作業「應依規定註明所使用的工具及用途，不得將生成內容直接當作自己原創作品繳交」，也不能用 AI 抄襲、代寫或作弊。
  items_title: 本站建議的步驟
  items:
  - title: 讀懂意思
    text: 先用自己的話說一遍。
  - title: 找主詞動詞
    text: 英文句子要有主詞和動詞。
  - title: 選時態句型
    text: 依意思決定時態。
  - title: 查字典核對
    text: 確認字義與搭配。
  checklist_title: 翻完勾一下
  checklist:
  - 主詞動詞齊全
  - 時態一致
  - 查過沒把握的字
