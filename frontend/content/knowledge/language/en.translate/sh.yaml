# - 補上兩種考法的差別：學測「以單句翻譯為主」、每題 4 分、每個錯誤扣 0.5 分；全民英檢中級是翻譯「一段中文」。
# - 「吃飽沒」的說明標本站整理；情境裡的「英文母語者真的會說的話」改成英文裡自然、意思對的說法。
