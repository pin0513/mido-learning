idea: 翻譯不是一個字換一個字。中文和英文的語序、省略和習慣說法都不同（本站整理），要翻出意思和語氣：全民英檢中級要求把一段中文翻成「通順、達意且前後連貫的英文」，學測要求「正確、通順、達意」。
guiding_questions:
- 「吃飽沒？」為什麼不能直接翻成英文？
scenario: 親子共學：挑三句（示意）台灣日常問候，先直譯，再改成英文裡自然、意思對的說法，比較兩版。
goal: 把一段中文翻成通順、達意、前後連貫的英文，不逐字硬翻。
review: 孩子翻譯一回學測歷屆中譯英（兩題），家長對照大考中心公布的滿分參考答案與評分原則；再翻一段全民英檢中級練習題的中文，家長對照官方 4 級分說明「內容適切表達題意」檢查：主要意思都翻出來、時態一致。
