idea: 翻譯不是一個字換一個字。中文和英文的語序、省略和習慣說法都不同，要翻出意思和語氣。
guiding_questions:
- 「吃飽沒？」為什麼不能直接翻成英文？
scenario: 親子共學：挑三句台灣日常問候，先直譯，再改成英文母語者真的會說的話，比較兩版。
goal: 把一段中文翻成通順、達意、前後連貫的英文，不逐字硬翻。
review: 家長從全民英檢中級或學測歷屆試題挑一段中譯英，孩子翻譯後家長對照官方參考答案，每句的主要意思都翻出來、時態一致。
