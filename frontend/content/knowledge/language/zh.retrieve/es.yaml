idea: 閱讀的第一步是擷取：有些答案就寫在文章裡，要找到那一句。先看題目要找什麼，再回文章圈出關鍵字。國中會考國文考「提取、統整文本訊息」，學測（學科能力測驗）的國綜（國語文綜合能力測驗）測驗目標有「訊息的檢索與擷取」，都要先會找到訊息。
