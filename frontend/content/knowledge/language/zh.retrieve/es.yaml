why:
  heading: 答案常就寫在文章裡
  body:
  - PIRLS（促進國際閱讀素養研究）把四年級學生的閱讀理解分成四種歷程，第一種就是找出並提取文中明確寫出的訊息，例如找出故事發生的時間和地點。
  - 課綱要一、二年級「了解文本中的重要訊息與觀點」，三、四年級「掌握句子和段落的意義與主要概念」。往上到國中會考、高中學測，也都考從文章裡找訊息。
  qa:
    question: 題目問「小明為什麼遲到」，答案一定寫在文章裡嗎？
    answer: 不一定。如果文章寫了「小明因為鬧鐘沒響而遲到」，答案就在文中，找到那一句就好，這是「提取」。如果文章只寫「小明一路跑進教室，頭髮還翹著」，原因沒有寫出來，就要用線索推論。PIRLS 把「說出角色行動的原因」列在推論題裡。
    source: pirls-infer
  items_title: 從小學到高中都會用到
  items:
  - title: 一、二年級
    text: 了解文本中的重要訊息與觀點。
    code: 5-I-4
  - title: 三、四年級
    text: 掌握句子和段落的意義與主要概念。
    code: 5-II-4
  - title: 國中會考
    text: 國文科：「提取、統整文本訊息，並轉化為解決問題的能力」。
  - title: 高中學測
    text: 國語文綜合能力測驗目標：「訊息的檢索與擷取」。
  sources:
  - pirls-retrieve
  - naer-pirls
  - kuoyu
  - cap-guowen
  - ceec
how:
  heading: 先看題目，再回文章找
  body:
  - 先讀題目，圈出要找的是誰、什麼事、什麼時候、在哪裡；再回到文章，找出有同樣詞語或意思相同的句子。PIRLS 說，如果題目和答案都用文中的原詞，或只換成同義詞，就屬於「提取」。
  items:
  - title: 圈題目關鍵字
    example: 小明「幾點」到學校？
    text: 先知道要找什麼。
  - title: 回文章找同一個詞
    example: 文中：小明七點半到學校。
    text: 找原詞或同義詞。
  - title: 說出在哪裡
    example: 答案在第 2 段第 1 句
    text: 指出原文出處。
  checklist_title: 每一題都做到：
  checklist:
  - 圈出題目關鍵字
  - 找到原文那一句
  - 說出第幾段
  - 答案不加自己想的
