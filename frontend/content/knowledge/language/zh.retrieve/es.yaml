idea: 閱讀的第一步是擷取：答案寫在文章裡，要找到那一句。先看題目要找什麼，再回文章圈出關鍵字。會考國文的「提取訊息」、學測國綜的「訊息的檢索與擷取」，都從這一步開始。
guiding_questions:
- 題目問「小明為什麼遲到」，答案一定寫在文章裡嗎？
scenario: 親子共學：親子共讀一則兒童新聞，互相出題「答案在哪一句」，找到就用螢光筆畫起來。
goal: 讀完一篇短文，能找出題目問的人、事、時、地，並指出答案在第幾段。
review: 家長挑一篇 300 字課外短文，出 4 題「誰、什麼、什麼時候、在哪裡」，孩子作答並用手指出原文出處，4 題都找得到。
