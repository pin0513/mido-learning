what:
  heading: 寫在文中，還是要推
  figures:
  - what-compare
  notes:
  - PIRLS 的四種歷程：提取明確寫出的訊息、直接推論、詮釋整合、評估與批判（中文為本站翻譯）。
  - PIRLS 舉的提取題例：找出故事的時間和地點、找詞語的定義、找出明確寫出的主旨句。
  sources:
  - pirls-retrieve
  - pirls-infer
