idea: 一句五個字是五言，七個字是七言。絕句是每首四句、又合平仄（平聲和仄聲；仄指上、去、入三聲）格律的近體詩，所以四句的詩不一定是絕句。押韻是句尾用韻母相同或相近的字，念起來有節奏；常見在偶數句的最後一字押韻（本站整理，不是每首都這樣）。先朗讀、再理解，畫面出來了，就記得住。
