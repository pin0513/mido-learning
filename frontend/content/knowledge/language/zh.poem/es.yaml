idea: 一句五個字叫五言、七個字叫七言；四句叫絕句。偶數句的最後一字常常押韻，念起來有節奏。先朗讀、再理解，畫面出來了，就記得住。
guiding_questions:
- 「床前明月光」為什麼念起來特別順？
scenario: 親子共學：全家輪流朗讀一首古詩，找出押韻的字，再一起畫出詩裡的畫面。
goal: 朗讀並背出幾首五言、七言古詩，指出押韻的字。
review: 孩子背誦 2 首課本或課外的五言、七言絕句，家長確認字句正確，孩子並圈出每首押韻的字。
