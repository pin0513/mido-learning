scenario: 親子共學：全家輪流朗讀一首古詩，找出押韻的字，再一起畫出詩裡的畫面。
goal: 朗讀並背出幾首五言、七言古詩，指出押韻的字。
review: 孩子背誦 2 首（示意）課本或課外的五言、七言古詩，家長確認字句正確，孩子並圈出每首押韻的字。
