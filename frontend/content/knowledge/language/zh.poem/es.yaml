- 《靜夜思》採《唐詩三百首》通行文本。另有版本作「床前看月光」「舉頭望山月」：陳尚君〈唐詩名篇在歷史上的演進〉（光明日報 2023-08-26；復旦大學新聞文化網轉載 https://newsroom.fudan.edu.cn/_s3/2023/0828/c31a136030/page.psp）說現存最早的宋蜀刻本如此、「明月」版本首見於明代李攀龍《唐詩選》。這不是台灣學術或官方來源，也找不到可開啟核對的台灣來源，所以不列入 sources，正文不寫版本差異。兩種版本的韻腳字都是光、霜、鄉（本站比對）。
- 朗讀、圈韻腳、畫畫面的步驟是本站建議。
