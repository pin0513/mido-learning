why:
  heading: 念出節奏，記住畫面
  body:
  - 古詩字少，靠整齊的句子和押韻帶出節奏。《重編國語辭典》說，押韻是「詩詞歌賦中，某些句子的末字使用韻母相同或相近的字」。
  - 課綱說國小教材「第二、三階段古典詩文應含本土素材」；三、四年級朗讀要「表現抑揚頓挫與情感」，五、六年級的學習內容有「古典詩文」。
  figures:
  - why-compare
  qa:
    question: 「床前明月光」為什麼念起來特別順？
    answer: 一個原因是押韻：《靜夜思》第一、二、四句最後的「光」（ㄍㄨㄤ）、「霜」（ㄕㄨㄤ）、「鄉」（ㄒㄧㄤ）都收在 ㄤ，句尾的聲音互相呼應。另一個原因是每句都是五個字，節拍整齊。
    source: dict-yayun
  items_title: 課綱裡的古詩學習
  items:
  - title: 朗讀有抑揚頓挫
    text: 三、四年級：以適切的速率朗讀文本，表現抑揚頓挫與情感。
    code: 5-II-1
  - title: 流暢朗讀
    text: 五、六年級：流暢朗讀各類文本，並表現抑揚頓挫的變化。
    code: 5-III-1
  - title: 古典詩文
    text: 五、六年級學習內容：古典詩文。
    code: Ad-III-4
  sources:
  - dict-yayun
  - kuoyu
how:
  heading: 先朗讀，再找韻腳
  body:
  - 先大聲朗讀幾遍，在節拍處稍微停一下；再把每句最後一個字圈起來，查注音，看哪些字韻母相同或相近；最後說出或畫出詩裡的畫面。（步驟是本站建議。）
  items:
  - title: 數字數
    example: 床前明月光 → 五個字 → 五言
    text: 每句幾個字，就是幾言。
  - title: 圈韻腳
    example: 光、霜、鄉
    text: 查注音，都收在 ㄤ。
  - title: 畫畫面
    example: 月光照在床前，像地上的霜
    text: 說出或畫出看到的景象。
  checklist_title: 讀一首詩，做四件事：
  checklist:
  - 數每句字數
  - 圈出句尾字
  - 查注音比韻母
  - 說出畫面
  activity_figure: how-flow
  sources:
  - mini
  - kuoyu
what:
  heading: 五言、七言、絕句
  figures:
  - what-compare
  notes:
  - 絕句不只是「四句」：《重編國語辭典》說絕句是「一種近體詩。每首四句而合平仄格律的詩」。
  - 五言、七言也不只有絕句，還有古詩、律詩、排律等（重編國語辭典「五言詩」「七言詩」）。
  - 押韻不一定只在偶數句：《靜夜思》第一句的「光」也押韻。
  - 平仄是平聲和仄聲：平是四聲中的平聲，仄是上、去、入三聲；舊時寫韻文，平仄要相互交替，才合格律（重編國語辭典「平仄」）。
  sources:
  - dict-jueju
  - dict-wuyan
  - dict-qiyan
  - dict-pingze
