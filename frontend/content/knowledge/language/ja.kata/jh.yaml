why:
  heading: 片假名寫的多是外來語
  body:
  - 文化庁〈外来語の表記〉說明它處理的是「外来語や外国の地名・人名を片仮名で書き表す場合のこと」。JLPT 官網對 N5 讀解的說明是「ひらがなやカタカナ、日常生活で用いられる基本的な漢字で書かれた定型的な語句や文、文章を読んで理解することができる。」
  - 第二外國語文領綱的日語學習內容有「平假名、片假名及漢字的辨識與書寫。」（日語 Aa-Ⅳ-1），一級學習表現有「能對目標語國家之圖畫、標示、符號等作簡易的猜測或推論。」（8-Ⅳ-2），學習內容有「猜測、推論。」（Bp-Ⅳ-2）。
  items_title: 第二外國語文領綱的學習重點
  items:
  - title: 猜測、推論
    text: 第二外國語文 Bp-Ⅳ-2：猜測、推論。
    code: Bp-IV-2
  - title: 片假名書寫
    text: 第二外國語文（日語示例）Aa-Ⅳ-1：平假名、片假名及漢字的辨識與書寫。
  checklist_title: 開始前先確認
  checklist:
  - 會念平假名
  - 會查字典
  notes:
  - 第二外國語文的Ⅳ代表語文程度一級、二級，不是年級；國中由學校在彈性學習課程選開，不是每校都有。
  sources:
  - gairai-scope
  - jlpt-levels
  - sfl
how:
  heading: 記住ー、ッ、ン
  body:
  - 基本的 46 個片假名和平假名一一對應，例如あ→ア、か→カ（本站整理）。外來語還會用平假名平常不用的組合（本站整理）：〈外来語の表記〉第1表的假名有「『ティ』『ディ』は,外来音ティ,ディに対応する仮名である。」例如ボランティア；「『ファ』『フィ』『フェ』『フォ』は,外来音ファ,フィ,フェ,フォに対応する仮名である。」例如ファイル。
  - 本站建議：對照平假名、片假名對照表，每天寫一行片假名，寫完念一遍；ティ、ファ這類組合另外整理成一張表。
  - 〈外来語の表記〉的規則：「撥音は,『ン』を用いて書く。」「促音は,小書きの『ッ』を用いて書く。」例如カップ；「長音は,原則として長音符号『ー』を用いて書く。」例如ゲーム、テーブル。念的時候，ー拉長前一個音，ッ停一拍（本站整理）。
  qa:
    question: 「ゲーム」念起來像哪個英文字？
    answer: 像 game（本站整理）。〈外来語の表記〉長音的例詞就有ゲーム、テーブル：長音用「ー」寫。
    source: gairai
  items_title: 〈外来語の表記〉的規則
  items:
  - title: 長音ー
    text: 長音原則上用長音符號ー寫。
    example: ゲーム、テーブル
  - title: 促音ッ
    text: 促音用小寫的ッ寫。
    example: カップ、シャッター
  - title: 撥音ン
    text: 撥音用ン寫。
    example: コンマ、ランプ
  - title: ティ、ファ
    text: 外來音ティ、ディ、ファ、フィ、フェ、フォ用這些假名寫。
    example: ボランティア、ファイル
  checklist_title: 每次練完勾一下
  checklist:
  - 寫了一行
  - 念了外來語
  - 猜了原字
  - 查了字典
  activity_figure: kata-flow
  notes:
  - 猜原字的線索（本站整理）：ー常對應英文拉長的母音或 -er 字尾，例如ゲーム→game、シャッター→shutter；ッ常出現在短母音後面的 p、t、k 前，例如カップ→cup。猜完一定查字典。
  sources:
  - gairai
  - gairai-kana1
what:
  heading: 讀得出、猜得到外來語
  body:
  - 學完後，孩子能讀寫片假名，正確寫出長音ー、促音ッ、撥音ン，念出外來語並猜出原本的外語字。
  items_title: 學完能做到
  items:
  - title: 讀寫片假名
    text: 念得出、寫得出片假名。
  - title: 三個符號
    text: 寫對ー、ッ、ン。
  - title: 猜原字
    text: 念出外來語並猜出原本的外語字。
  checklist_title: 家長檢核
  checklist:
  - 念得出來
  - 寫對符號
  - 猜得出原字
  figures:
  - kata-compare
  notes:
  - 檢核的題數與門檻是示意。
  - 本站建議：本點可當作 JLPT N5 的準備；這是本站建議的對應，不是官方換算。JLPT 官網寫 N5 是「基本的な日本語をある程度理解することができる」。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - gairai
  - jlpt-levels
  - genai-student
