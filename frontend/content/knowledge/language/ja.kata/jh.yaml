idea: 片假名多半用來寫外來語。很多字是英文改成日語的發音，念出來就能猜到意思。
guiding_questions:
- 「コーヒー」念起來像哪個英文字？
scenario: 親子共學：在家找 10 樣日本商品的包裝，圈出片假名，念出來猜它原本是哪個英文字。
goal: 讀寫片假名，認出外來語原本是哪個英文字。
review: 家長給 10 個片假名外來語（例如 コンビニ、テレビ），孩子念出並猜出原本的英文，至少 8 個對。
formats:
