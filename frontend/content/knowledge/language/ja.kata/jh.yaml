idea: 片假名常用來寫外來語。很多外來語來自英文，念出來就能猜到意思，但也有來自其他語言的字，例如パン來自葡萄牙語、アルバイト來自德語（本站整理，請用字典查證）。
guiding_questions:
- 「ゲーム」念起來像哪個英文字？
scenario: 親子共學：找 10 樣包裝或菜單上有片假名的東西，圈出片假名，念出來猜它原本是哪個外語字（10 樣是示意）。
goal: 讀寫片假名（含長音ー、促音ッ、撥音ン），念出外來語並猜出原本的外語字。
review: 家長給 10 個片假名外來語（例如ゲーム、テーブル、カップ），孩子念出來並猜出原本的外語字或意思，至少 8 個對；再聽寫 5 個片假名詞（題數與門檻是示意）。
