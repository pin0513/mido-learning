idea: 日文靠助詞標出每個詞的角色：誰做（が）、做什麼（を）、去哪裡（に）。助詞對了，語序稍微換也看得懂。
guiding_questions:
- 換一個小小的助詞，誰對誰做了什麼就變了？
scenario: 親子共學：把一句話的助詞做成卡片蓋起來，猜猜哪個助詞放哪裡，再換一個看意思怎麼變。
goal: 分清助詞は、が、を、に的基本用法，造出正確的句子。
review: 家長給 8 個空格句，孩子填入正確的助詞並說出理由，至少 6 題對。
