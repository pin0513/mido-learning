why:
  heading: 助詞決定詞的角色
  body:
  - 國際交流基金的《いろどり》入門（A1）的文法就有助詞：第 3 課「N1 は N2 です」，第 5 課「Nが好きです」「Nを V-ます」，第 12 課「Nに行きます」。
  - 第二外國語文領綱的學習內容（歐語、日語共通）有「簡易常用的句型結構。」（Ad-Ⅳ-1）和「簡易常用句型的文法介紹，及日常對話的應用。」（Ad-Ⅳ-2）。
  items_title: 第二外國語文領綱的學習重點
  items:
  - title: 句型結構
    text: 第二外國語文 Ad-Ⅳ-1：簡易常用的句型結構。
  - title: 文法與對話
    text: 第二外國語文 Ad-Ⅳ-2：簡易常用句型的文法介紹，及日常對話的應用。
  checklist_title: 開始前先確認
  checklist:
  - 會說です句
  - 會念平假名
  notes:
  - 第二外國語文的Ⅳ代表語文程度一級、二級，不是年級；國中由學校在彈性學習課程選開，不是每校都有。
  sources:
  - irodori
  - sfl
how:
  heading: 一個助詞配一個句型
  body:
  - 《いろどり》文法ノート的句型與例句：「N1 は N2 です」例「私はマルシアです。」；「Nが好きです」例「肉と野菜が好きです。」；「Nを V-ます」例「シリアルを食べます。」；「Nに行きます」例「明日の忘年会に行きますか？」。
  - 寫法依〈現代仮名遣い〉：「助詞の『は』は,『は』と書く。」「助詞の『を』は,『を』と書く。」は念わ、を念お（念法是本站整理）。本站整理：在本頁的句型裡，は標出主題，が接在喜歡的東西後面，を接在動作的對象後面，に接在要去的地方後面。
  qa:
    question: 換一個小小的助詞，意思會變嗎？
    answer: 會。例如「Nに行きます」的に標出要去的地方，「Nを V-ます」的を標出動作的對象（句型依《いろどり》文法ノート）；把「明日の忘年会に行きますか？」的に換成を，這句就不通了；不過を配移動的動詞時也能標出經過的地方，例如道を歩きます，所以要看整個句子（本站整理）。
    source: irodori
  items_title: 《いろどり》的四個句型
  items:
  - title: は
    text: N1 は N2 です
    example: 私はマルシアです。
  - title: が
    text: Nが好きです
    example: 肉と野菜が好きです。
  - title: を
    text: Nを V-ます
    example: シリアルを食べます。
  - title: に
    text: Nに行きます
    example: 明日の忘年会に行きますか？
  checklist_title: 每次練完勾一下
  checklist:
  - 找到句型
  - 填了助詞
  - 說了理由
  activity_figure: particle-flow
  notes:
  - 造句時可以換的詞（本站整理）：動詞飲みます（喝）、見ます（看）、読みます（讀），例如水を飲みます；地點がっこう（學校）、こうえん（公園），例如がっこうに行きます；喜歡的東西りんご（蘋果）、ねこ（貓），例如ねこが好きです。
  sources:
  - irodori
  - kana
what:
  heading: 填得對、造得出句子
  body:
  - 學完後，孩子能在四個基本句型裡填對は、が、を、に，並用這些句型造出自己的句子。
  items_title: 學完能做到
  items:
  - title: 填對助詞
    text: 在空格句填對は、が、を、に。
  - title: 說出句型
    text: 說出是哪一個句型。
  - title: 自己造句
    text: 用四個句型各造一句。
  checklist_title: 家長檢核
  checklist:
