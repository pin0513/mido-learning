idea: 日文靠助詞標出詞在句子裡的角色。先從四個常用句型學：N1 は N2 です、Nが好きです、Nを V-ます、Nに行きます（句型依《いろどり》），換一個助詞，句子就不通或意思變了（本站整理）。
guiding_questions:
- 換一個小小的助詞，意思會變嗎？
scenario: 親子共學：把本頁例句的助詞做成卡片蓋起來，猜猜哪個助詞放哪裡，再換一個看句子還通不通。
goal: 分清助詞は、が、を、に在四個基本句型裡的用法，造出正確的句子。
review: 家長用本頁的四個句型出 8 個空格句（は、が、を、に各 2 題），孩子填入助詞並說出是哪個句型，至少 6 題對（題數與門檻是示意）。
