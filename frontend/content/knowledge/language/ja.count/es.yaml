idea: 日文的數字和很多漢字詞跟中文有關係，念起來有點像。從數字、顏色、食物這些生活單字開始最快。
guiding_questions:
- いち、に、さん……跟中文的一、二、三像不像？
scenario: 親子共學：去超市時用日文數商品：いち、に、さん……回家把買的水果用日文念一遍。
goal: 用日語數 1 到 100，說出顏色、食物等 20 個生活單字。
review: 家長指家裡 10 樣東西，孩子用日語說出名字或數量，至少 8 個對。
