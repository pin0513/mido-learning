why:
  heading: 數字天天用得到
  body:
  - 買東西、看時間、數人數都要用數字，學會數字就能做很多日常溝通（本站整理）。
  - 國中以後，第二外國語文領綱的一級學習表現有「能說出簡單的數字。」（2-Ⅳ-5）；國小沒有日語課綱，本點先打基礎（本站建議）。
  qa:
    question: いち、に、さん……跟中文的一、二、三像不像？
    answer: 有點像。常用漢字表在「一」「二」「三」的音訓欄列出字音イチ、ニ、サン（字音用片假名寫）；念起來和中文相近，是本站整理的觀察。
    source: joyo
  items_title: 常用漢字表的音訓
  items:
  - title: 一、二、三
    text: 字音：イチ、ニ、サン。
  - title: 百
    text: 字音：ヒャク。
  checklist_title: 開始前先確認
  checklist:
  - 會念平假名
  - 會數中文數字
  notes:
  - 國小沒有日語的課綱；三至六年級是本站建議的年級。第二外國語文領綱從國中開始（國中由學校在彈性學習課程選開）。
  sources:
