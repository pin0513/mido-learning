how:
  heading: 先背 1 到 10，再組合
  body:
  - 1 到 10：いち、に、さん、よん（し）、ご、ろく、なな（しち）、はち、きゅう（く）、じゅう。常用漢字表的「四」列了字音シ和字訓よん，「七」列了シチ和なな，「九」列了キュウ和ク，所以這三個數字有兩種念法。
  - 本站整理：11 以上用「十」組合，例如じゅういち（11）、にじゅう（20）、にじゅういち（21），一直到ひゃく（100）；40、70、90 通常說よんじゅう、ななじゅう、きゅうじゅう。生活單字用圖卡學：一面畫圖，一面寫平假名，例如あか（紅色）、あお（藍色）、りんご（蘋果）、みず（水），每天加幾張（張數由家長決定）。
  - 本站整理的字表（12 個）：顏色あか（紅）、あお（藍）、きいろ（黃）、しろ（白）、くろ（黑）、みどり（綠）；食物りんご（蘋果）、みかん（橘子）、みず（水）、ごはん（飯）、たまご（蛋）、さかな（魚）。
  items_title: 本站整理的練法
  items:
  - title: 1 到 10
    text: 每天念一遍，四、七、九兩種念法都認得。
  - title: 十的組合
    text: じゅういち、にじゅう、にじゅういち……
  - title: 到 100
    text: 數到ひゃく。
  - title: 單字圖卡
    text: 用本頁 12 個字做圖卡，一面畫圖、一面寫平假名。
  checklist_title: 每天練完勾一下
  checklist:
  - 念了 1 到 10
  - 數到 100
  - 說了圖卡
  activity_figure: count-flow
  notes:
  - 組合規則、例字、字表和練法是本站整理。
  sources:
  - joyo
what:
  heading: 會數數也會說單字
  body:
  - 學完後，孩子能用日語數 1 到 100，並用日語說出本頁字表的顏色、食物單字。
  items_title: 學完能做到
  items:
  - title: 數到 100
    text: 用日語從 1 數到 100。
  - title: 兩種念法
    text: 四、七、九兩種念法都聽得懂。
  - title: 生活單字
    text: 說出本頁字表的顏色、食物。
  checklist_title: 家長檢核
  checklist:
  - 數到 100
  - 說出單字
  - 念法都對
  figures:
  - count-compare
  notes:
  - 檢核的題數與門檻是示意。
  - 本站建議：本點可當作 JLPT N5 的準備；這是本站建議的對應，不是官方換算。JLPT 官網寫 N5 是「基本的な日本語をある程度理解することができる」。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊（本站建議）；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - joyo
  - jlpt-levels
  - genai-student
