idea: 多益考生手冊列的職場情境包括 e-mail 與會議（board meetings）；本點先練這兩種（本站建議）。CEFR 補充版描述的能力包括依情境用合適的正式程度寫 email（B2），以及在正式討論裡重述、評估別人的發言並委婉表達不同意見（C1）。本站建議：email 先寫目的，會議先確認、再摘要、最後提出不同意見。
guiding_questions:
- 一封寫給陌生客戶的 email，語氣要怎麼拿捏？
scenario: 親子共學：寫一封英文 email 邀請一位講者來學校分享：主旨、目的、時間地點、請對方回覆的期限。
goal: 寫一封清楚有禮的職場英文 email，並在會議裡用英文確認、摘要、提出不同意見。
review: 寫一封英文 email 邀請講者：主旨、目的、時間地點、回覆期限都有；家人只讀主旨與第一句就知道要做什麼。再和家人角色扮演一場短會議：先確認聽懂家人的提議，再委婉提出不同意見，最後錄 1 分鐘會議摘要，說出 3 個決定與下一步（錄音只留在自己的裝置、不上傳，本站建議；1 分鐘、3 個決定是示意）。
