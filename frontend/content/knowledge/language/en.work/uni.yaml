idea: 職場英文講求清楚和禮貌：主旨一眼看懂、第一段說目的、最後寫下一步。會議裡要會確認、摘要和提出不同意見。
guiding_questions:
- 一封寫給陌生客戶的 email，語氣要怎麼拿捏？
scenario: 親子共學：寫一封英文 email 邀請一位講者來學校分享：主旨、目的、時間地點、請對方回覆的期限。
goal: 寫一封清楚有禮的職場英文 email，並在會議裡用英文確認、摘要、提出不同意見。
review: 寫一封英文 email 邀請講者：主旨、目的、時間地點、回覆期限都有；家人只讀主旨與第一句就知道要做什麼。另錄 1 分鐘會議摘要，說出 3 個決定與下一步。
