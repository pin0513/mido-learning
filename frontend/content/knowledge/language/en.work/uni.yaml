why:
  heading: 先練 email 和會議
  body:
  - 'ETS 多益考生手冊列出的職場情境有「Offices: board meetings, committees, letters, memoranda, telephone, fax and e-mail messages」等。'
  - CEFR 補充版的 Correspondence 量表 B2 有「Can compose formal e-mails/letters of invitation, thanks or apology using appropriate registers and conventions.」；Formal discussion 量表 C1 有「Can make critical remarks or express disagreement diplomatically.」這些描述是努力的方向，不是最低要求（本站整理）。
  qa:
    question: 一封寫給陌生客戶的 email，語氣要怎麼拿捏？
    answer: 用比較正式、有禮的寫法，第一句就說明目的（本站建議）。CEFR 補充版 B2 的描述是「Can use formality and conventions appropriate to the context when writing personal and professional letters and e-mails.」
    source: cefr-cv
  items_title: 本點練的兩種場合
  items:
  - title: 寫 email
    text: 依對象調整正式程度。
  - title: 開會
    text: 確認、摘要決定與下一步、委婉表達不同意見。
  checklist_title: 寫之前先想
  checklist:
  - 寫給誰
  - 要對方做什麼
  sources:
  - toeic-handbook
  - cefr-cv
how:
  heading: 先講目的，再講細節
  body:
  - 本站建議 email 這樣寫：主旨寫清楚要做什麼；第一句說目的；接著時間、地點等細節；最後寫請對方回覆的期限並道謝。
  - 會議裡，本站建議先確認聽懂（例如 So you mean…?），再摘要決定與下一步（So we agreed to… / Next, X will…），有不同意見時先肯定再說理由（I see your point, but…）。CEFR 補充版 C1 的描述是「Can restate, evaluate and challenge contributions from other participants about matters within their academic or professional competence.」
  - 用 AI 幫忙時，照學術倫理電子報的提醒做：不貼個人資訊、未公開文件或機密資料，AI 的輸出自己查證，內容自己寫，不把 AI 生成的內容直接交出去。本站建議：交作業時依課程規定說明用了哪個工具、做了什麼。
  items_title: 本站建議的 email 結構
  items:
  - title: 主旨
    text: 一眼看出要做什麼。
  - title: 第一句說目的
    text: 邀請、詢問或確認。
  - title: 細節
    text: 時間、地點、需要的資料。
  - title: 回覆期限
    text: 請對方何時回覆。
  checklist_title: 寄出前勾一下
  checklist:
  - 主旨清楚
  - 第一句是目的
  - 有回覆期限
  activity_figure: work-flow
  sources:
  - cefr-cv
  - ethics-epaper13
what:
  heading: 寫好 email，開好會
  body:
  - 學完後，能寫一封清楚有禮的職場英文 email，並在會議裡用英文確認、摘要決定、委婉提出不同意見。
  items_title: 學完能做到
  items:
  - title: 清楚的 email
    text: 主旨與第一句就看出目的。
  - title: 會議摘要
    text: 說出決定與下一步。
  - title: 委婉不同意
    text: 先肯定，再說理由。
  checklist_title: 家人檢核
  checklist:
  - 一讀就懂目的
  - 摘要有決定
  figures:
  - work-compare
  notes:
  - 把大學階段對應多益是本站建議，不是官方換算。
  - 檢核的 1 分鐘、3 個決定是示意；引用的 CEFR 描述 Correspondence 是 B2、Formal discussion 是 C1。
  - 用 AI 潤飾 email 或整理會議紀錄時，不要把公司、客戶的機密資料或他人個資貼進去。
  - 用生成式 AI 時，不要把個人資訊、未公開文件、機密資料貼進去（教育部臺灣學術倫理教育資源中心 2023 年的電子報）；AI 的輸出要自己查證。這份 2023 年的電子報也說，學術界對使用生成式 AI 是否需要標註「尚無統一的規定」，建議先了解相關單位的政策；不要把 AI 生成的內容直接當成自己寫的交出去，電子報提醒，直接使用生成的內容而非親自撰寫，「還可能有代寫的學術倫理問題」；交作業時依課程規定說明用了哪個工具、做了什麼；AI 規定變化快，以學校和課程最新的規定為準（本站建議）。
  sources:
  - toeic-handbook
  - ethics-epaper13
