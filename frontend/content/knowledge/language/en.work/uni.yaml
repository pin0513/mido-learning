# B8 提案：en.work@uni
# - 補 Why/How/What 與兩張圖。email 與會議能力改依 CEFR 補充版 Correspondence、Formal discussion (meetings) 量表的描述（標出量表程度），職場情境依 ETS 多益考生手冊。
# - 檢核的「1 分鐘」「3 個決定」標示意；email 結構與會議句型標本站建議。
# - 安全：補「不要把公司或客戶的機密資料貼進 AI」（學術倫理電子報）；大學對應多益標為本站建議（顯示在 notes）。
# - 第一輪獨立審查修正：引用的 CEFR 描述改成標出量表程度——對照 CEFR 補充版 PDF 頁面，Correspondence 兩句都在 B2（審查稿說其中一句是 C1，核對後是 B2），Formal discussion 兩句是 C1；註明是努力方向、不是最低要求；notes 刪掉不適用的題型分數說法；檢核補上會議角色扮演，對齊 How 的確認、摘要、委婉不同意。
# - 第二輪獨立審查修正：idea 首句「職場英文最常用的是 email 和會議」無來源，改依 ETS 多益考生手冊的職場情境（e-mail、board meetings），「最常用」刪除，練這兩種標本站建議。
# - 第三輪獨立審查修正：Why 標題「email 和會議天天用」是無來源的頻率說法，改「先練 email 和會議」；items_title「職場英文兩大場合」改「本點練的兩種場合」；What／檢核「下一步」How 沒教，How 第二段改成摘要決定與下一步（So we agreed to… / Next, X will…）。
# - 第四輪獨立審查修正：比較圖「給陌生客戶」的「先自我介紹」How 沒教、和「第一句說目的」矛盾，改「較正式、有禮，第一句仍說目的」。
# - 第五輪獨立審查修正：（建議項）檢核的 1 分鐘會議摘要補「錄音只留在自己的裝置、不上傳」（本站建議）。 What notes 的 AI 注意事項補「不代寫」（學術倫理電子報（二）著作權「還可能有代寫的學術倫理問題」；是電子報的提醒，不寫成硬規定），ethics-epaper13 supports 補（二）著作權整句（2026-10-29 重抓逐字核對）；How body 補 AI 使用說明（不貼機密、自己查證、自己寫、說明工具），how.sources 加 ethics-epaper13，讓 What 的注意事項在 How 有教到。
# - 第六輪獨立審查修正：（阻擋 R-1）How 的 AI 段落改寫：刪掉和 What notes 重複的電子報引文、合併自我重複的「自己寫／不直接交出去」；不貼個資與未公開文件或機密資料（電子報（三））、輸出自己查證（（一））、內容自己寫（（二））歸給電子報，只有「依課程規定說明用了哪個工具」標本站建議。
