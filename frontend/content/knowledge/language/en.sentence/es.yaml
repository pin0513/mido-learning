why:
  heading: 一個句型能說很多句
  body:
  - 英語文領綱第二學習階段要學生「能聽懂簡易句型的句子」，第三學習階段要「能以正確的發音及適切的語調說出簡易句型的句子」，學習內容是用「所學字詞及句型」做生活溝通。學會一個句型，換幾個字就能表達很多想法。
  qa:
    question: 換掉一個字，句子的意思會怎麼變？
    answer: I like apples. 換成 I like dogs.，喜歡的東西就變了；Can you help me? 換成 Can you sing?，請對方做的事就變了。句型不變，換掉的字決定意思。
    source: english
  items_title: 英語文領綱的學習重點
  items:
  - title: 聽懂句型
    text: 英語文 1-Ⅱ-10：能聽懂簡易句型的句子。
    code: 1-II-10
  - title: 說出句型
    text: 英語文 2-Ⅲ-9：能以正確的發音及適切的語調說出簡易句型的句子。
    code: 2-III-9
  - title: 生活溝通
    text: 英語文 B-Ⅱ-1：第二學習階段所學字詞及句型的生活溝通。
    code: B-II-1
  checklist_title: 開始前先確認
  checklist:
  - 會說 I、you
  - 會幾個常用字
  notes:
  - 英語文 Ad-Ⅲ-2「簡易、常用的句型結構。」與其他領綱同號，只在內文引用。
  sources:
  - english
how:
  heading: 固定句型，換掉一塊
  body:
  - 本站建議：一次只練一個句型。先聽大人說三句，再自己換字說三句，最後用這個句型說一件真正想說的事。
  items_title: 本站建議的三個句型
  items:
  - title: 說喜好
    text: I like dogs.
  - title: 請人做事
    text: Can you help me?
  - title: 說有什麼
    text: There is a cat on the bed.
  checklist_title: 每個句型練完勾
  checklist:
  - 聽了三句
  - 換字說三句
  - 說一件真事
  activity_figure: sentence-flow
  notes:
  - 句型與步驟是本站建議。
  sources:
  - english
what:
  heading: 用句型說真正想說的
  body:
  - 學完後，孩子能用三個常用句型說出自己的喜好、請別人幫忙、描述看到的東西，而且發音和語調清楚。
  items_title: 學完能做到
  items:
  - title: 換字造句
    text: 同一句型換字說出新句子。
  - title: 問句語調
    text: Can you…? 這類問句，句尾語調通常上揚（本站整理）。
  - title: 說真實的事
    text: 用句型說自己的喜好。
  checklist_title: 家長檢核
  checklist:
  - 句子正確
  - 語調清楚
  - 說的是真事
  figures:
  - sentence-compare
  notes:
  - 檢核用的 3 句、7 句是示意。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網E-BOT），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。國小學生使用時，由大人操作並陪在旁邊；作業若用了 AI，要說明用了哪個工具，不能把 AI 寫的內容當成自己的作品。
  sources:
  - english
  - genai-student
