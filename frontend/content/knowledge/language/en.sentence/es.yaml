idea: 句子像積木：固定的句型加上可以替換的字。學會一個句型，換字就能說出很多句子。
guiding_questions:
- 換掉一個字，句子的意思會怎麼變？
scenario: 親子共學：做一張句型卡「I like ___.」「Can you ___?」，全家輪流抽單字卡填空，說出最好笑的一句。
goal: 用固定句型（I like… / Can you…?）換字說出自己的句子。
review: 家長給 3 個句型，孩子每個句型各說 3 句不同的句子，9 句裡至少 7 句文法正確。
