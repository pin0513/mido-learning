idea: 句子像積木（本站整理的比喻）：先學一個固定句型，例如 I like…，再換掉後面的字，就能說出很多句子。
guiding_questions:
- 換掉一個字，句子的意思會怎麼變？
scenario: 親子共學：做一張句型卡「I like ___.」「Can you ___?」，全家輪流抽單字卡填空，說出最好笑的一句。
goal: 用三個常用句型（I like… / Can you…? / There is…）換字說出自己的句子。
review: 孩子用 I like…、Can you…?、There is… 各說 3 句真正想說的話，家長聽句子是否正確，至少 7 句正確（3 句、7 句是示意）。
