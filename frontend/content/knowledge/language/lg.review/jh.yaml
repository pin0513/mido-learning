idea: 記憶會隨時間淡掉。研究回顧把「自己考自己」（字卡就是一種）和「分散練習」（分幾次、隔一段時間複習）評為效用高的方法，重讀、畫重點效用低。隔一天、隔三天、隔一週再複習是本站建議的排法（示意）。把單字放在例句裡，在不同句子中多遇到幾次。
guiding_questions:
- 為什麼昨天背的單字，今天就忘了不少？
scenario: 親子共學：做 20 張字卡（示意；英文日文都可以），記下每張是第幾天複習，一週後看哪種排法記得最多。
goal: 用字卡與間隔複習記住單字，知道什麼時候該複習。
review: 孩子做 30 張字卡（示意），用間隔複習排一週的複習表；一週後家長抽 10 張考，至少 8 張記得（示意）。
