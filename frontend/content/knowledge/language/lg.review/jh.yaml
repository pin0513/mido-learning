  supports: 學習表現 7-Ⅳ-5「能訂定英文學習計畫，檢視自我學習過程，並隨時改進。」（p.15）；詞彙：「國民中學畢業時，學生應至少學會 1,200 個字詞」（p.28）；「為深化學習效果，教材編纂宜採反覆出現、螺旋向上的教材編纂原則。任一學習階段所學的字彙，力求在後續學習過程中，於不同的文本、語境反覆出現」（p.28）
- id: dunlosky-2013
  title: Improving Students' Learning With Effective Learning Techniques（Dunlosky et al., 2013, Psychological Science in the Public Interest 14(1)，doi:10.1177/1529100612453266；摘要）
  publisher: SAGE／Association for Psychological Science；摘要經 Europe PMC（PMID 26173288）讀取
  url: https://europepmc.org/article/MED/26173288
  accessed: '2026-10-28'
  kind: peer_reviewed
  supports: '摘要：「Practice testing and distributed practice received high utility assessments」；「Five techniques received a low utility assessment: summarization, highlighting, the keyword mnemonic, imagery use for text learning, and rereading.」；「Most students report rereading and highlighting, yet these techniques do not consistently boost students'' performance, so other techniques should be used in their place (e.g., practice testing instead of rereading).」'
- id: cepeda-2006
  title: 'Distributed practice in verbal recall tasks: A review and quantitative synthesis（Cepeda et al., 2006, Psychological Bulletin 132(3)，doi:10.1037/0033-2909.132.3.354；摘要）'
  publisher: American Psychological Association；摘要經 Europe PMC（PMID 16719566）讀取
  url: https://europepmc.org/article/MED/16719566
  accessed: '2026-10-28'
  kind: peer_reviewed
  supports: 摘要：統合 317 個實驗；「the ISI producing maximal retention increased as retention interval increased」（ISI：兩次學習之間的間隔）
- id: murre-2015
  title: 'Replication and Analysis of Ebbinghaus'' Forgetting Curve（Murre & Dros, 2015, PLoS ONE 10(7): e0120644，doi:10.1371/journal.pone.0120644；摘要）'
  publisher: PLOS；摘要經 Europe PMC（PMID 26148023）讀取
  url: https://europepmc.org/article/MED/26148023
  accessed: '2026-10-29'
  kind: peer_reviewed
  supports: 摘要：「We present a successful replication of Ebbinghaus' classic forgetting curve from 1880 based on the method of savings. One subject spent 70 hours learning lists and relearning them after 20 min, 1 hour, 9 hours, 1 day, 2 days, or 31 days. The results are similar to Ebbinghaus' original data.」
