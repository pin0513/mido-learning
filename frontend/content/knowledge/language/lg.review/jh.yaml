why:
  heading: 背得多，不如記得久
  body:
  - 遺忘會隨時間發生：Murre 與 Dros（2015）重做了艾賓豪斯（Ebbinghaus）在 1880 年做的遺忘曲線實驗，一位受試者在 20 分鐘到 31 天後重學，結果和原始資料相近。
  - 英語文課綱要國中生「能訂定英文學習計畫，檢視自我學習過程，並隨時改進。」國中畢業時「應至少學會 1,200 個字詞」。
  qa:
    question: 為什麼昨天背的單字，今天就忘了不少？
    answer: 記憶本來就會隨時間淡掉，背完後沒有再提取，就容易忘。研究回顧指出，反覆重讀、畫重點「do not consistently boost students' performance」（不一定能提升表現），建議改用自我測驗；分散在不同時間複習，也比一次背完有效（Dunlosky 等，2013）。
    source: dunlosky-2013
  items_title: 國中課綱怎麼說
  items:
  - title: 訂學習計畫
    text: 英語文 7-Ⅳ-5：能訂定英文學習計畫，檢視自我學習過程，並隨時改進。
  sources:
  - murre-2015
  - english
how:
  heading: 字卡自我考，隔天再考
  body:
  - 一面寫單字和例句，一面寫意思。看一面、說出另一面，說不出來再翻；答對的隔久一點再考，答錯的明天再考（本站建議）。
  items:
  - title: 自我考試
    text: 看單字說意思，比重讀更有效（Dunlosky 等，2013）。
  - title: 分散複習
    text: 分幾天複習，比一次背完有效（Dunlosky 等，2013）。
  - title: 間隔拉長
    text: 最佳間隔會隨要記多久而變長（Cepeda 等，2006）。
    example: 隔一天、隔三天、隔一週（本站建議，示意）
  - title: 用例句
    text: 課綱：字彙在不同文本、語境反覆出現。
  checklist_title: 一週複習表：
  checklist:
  - 做字卡
  - 第1天考
  - 隔天再考
  - 隔三天考
  - 隔一週考
