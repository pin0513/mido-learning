idea: 記憶會隨時間淡掉。隔一天、隔三天、隔一週再複習一次，比一次背很久更記得住；用例句記，比單背一個字更牢。
guiding_questions:
- 為什麼昨天背的單字，今天就忘了一半？
scenario: 親子共學：做 20 張字卡（英文日文都可以），記下每張是第幾天複習，一週後看哪種排法記得最多。
goal: 用字卡與間隔複習記住單字，知道什麼時候該複習。
review: 孩子做 30 張字卡，用間隔複習排一週的複習表；一週後家長抽 10 張考，至少 8 張記得。
