why:
  heading: 好在哪一句
  body:
  - 大考中心的學測國文考試說明，把「B4.形式的推究與分析」和「B5.結合文學、文化知識的詮釋與鑑賞」列為國綜「文本的理解與探究」的測驗目標。
  - 國語文課綱要高中生「辨析文本的寫作主旨、風格、結構及寫作手法」，學習內容也包括「篇章的主旨、結構、寓意與評述」。
  qa:
    question: 你說這篇「寫得好」，好在哪一句？
    answer: 要指出一句原文，說它用了什麼寫法、帶來什麼效果；只說「寫得好」「很感人」還不是評鑑（本站建議）。課綱的學習內容就把「評述」和主旨、結構、寓意並列。
    source: kuoyu
  items_title: 高中課綱的評鑑目標
  items:
  - title: 辨析寫作手法
    text: 國語文 5-Ⅴ-1：辨析文本的寫作主旨、風格、結構及寫作手法。
    code: 5-V-1
  - title: 篇章的評述
    text: 國語文 Ad-Ⅴ-1：篇章的主旨、結構、寓意與評述。
    code: Ad-V-1
  - title: 手法與美感
    text: 國語文 Ba-Ⅴ-3：寫作手法與文學美感的呈現。
    code: Ba-V-3
  sources:
  - ceec
  - kuoyu
how:
  heading: 手法、引文、效果、不足
  body:
  - 評鑑一篇文章，填四格（本站整理）：用了什麼手法、哪一句是證據、帶來什麼效果、還有哪裡不足。
  items_title: 評鑑四格（本站整理）
  items:
  - title: 手法
    text: 說出寫法的名稱。
    example: 以小見大、對比
  - title: 引文
    text: 引一句原文當證據。
  - title: 效果
    text: 這個寫法讓讀者感受到什麼？
  - title: 不足
    text: 哪裡可以寫得更好？也引一句。
  checklist_title: 短評要有：
  checklist:
  - 一個手法
  - 一個效果
  - 一個不足
  - 每項有引文
