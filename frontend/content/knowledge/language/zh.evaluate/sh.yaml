idea: 學測國綜的測驗目標包含「形式的推究與分析」與「結合文學、文化知識的詮釋與鑑賞」。評鑑要具體：說出手法（例如以小見大、對比），引原文為證，再說效果與限制。
guiding_questions:
- 你說這篇「寫得好」，好在哪一句？
scenario: 親子共學：全家各挑一篇最近讀過最喜歡的文章，用「手法、效果、引文」三格向家人推薦。
goal: 評鑑一篇文章：指出它用了什麼寫法、達到什麼效果、還有哪裡不足。
review: 孩子寫 150 字短評，包含 1 個寫作手法、1 個效果、1 個不足並各引一句原文；家長確認三項都有引文。
