why:
  heading: 合理引用也要寫出處
  body:
  - 著作權法第 52 條允許「為報導、評論、教學、研究或其他正當目的之必要，在合理範圍內，得引用已公開發表之著作」，第 64 條接著要求依這些規定利用他人著作者「應明示其出處」。
  - 學術寫作的要求比法律更廣。教育部臺灣學術倫理教育資源中心的寫作指南說明「學術倫理中的抄襲，範圍比著作權法要更廣泛」：別人的構想即使用自己的話重新表達，沒有適當引註，仍可能違反學術倫理。
  qa:
    question: 引用別人的一句話，要怎麼標才不算抄？
    answer: 原句照抄就加引號，並在同一句寫出作者、年份和頁碼等出處；APA Style 要求直接引用時，在同一句附上完整引註與頁碼。只借用想法、用自己的話寫，也要註明來源。
    source: apa-quotations
  items_title: 用別人文字的三種方式
  items:
  - title: 引述
    text: 原文照錄。指南：「直接引述通常需要用引號標示，或將引述的內容單獨成段，並提供完整資料來源」。
  - title: 改寫
    text: 「用自己的話，重新闡述他人的觀點或資訊，但保持其原有的意義」；指南也提醒，改寫時「應該要避免使用他人『一個分句』以上的文字段落」。
  - title: 摘寫
    text: 「將參考資料的核心思想或主要論點，用更簡潔的文字概括出來，篇幅一般會比原文簡短許多」。
  sources:
  - copyright-law
  - ethics-guide
  - apa-quotations
how:
  heading: 引號、書名號、出處
  body:
  - 標點依教育部《重訂標點符號手冊（修訂版）》：引號「用於標示說話、引語、特別指稱或強調的詞語」，「通常先用單引號，如果有需要，單引號內再用雙引號」；書名號乙式「《 》多用於書名，〈 〉多用於篇名」。
  - 出處要讓讀者找得到：指南說，不管引述、改寫或摘寫，「研究者都應該讓讀者在文中或最後參考資料列表找到完整的書目資訊」。用 AI 整理參考文獻時，MLA 提醒要核對它列出的來源，UNC 寫作中心也提醒 AI 給的引文可能根本不存在；本站建議每一筆都打開原始來源核對。用了 AI 的地方，也依課程或指定格式說明用了哪個工具、做了什麼（本站建議）。
  items_title: 標點小抄（本站整理）
  items:
  - title: 引號「」『』
    text: 引語、特別指稱的詞；引號內再引用時改用『』。
  - title: 書名號《 》
    text: 多用於書名，例如《禮記》。
  - title: 篇名號〈 〉
    text: 多用於篇名，例如〈逍遙遊〉。
  - title: 出處
    text: 作者、年份、書名或篇名、頁碼，依課程指定的格式寫。
  checklist_title: 交出前檢查：
  checklist:
  - 原句加引號了嗎
  - 附上頁碼了嗎
  - 改寫也標出處
  - 出處查得到嗎
