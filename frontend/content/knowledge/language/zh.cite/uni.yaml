# B6 提案：zh.cite@uni
# - 原文「書名用《》、篇名用〈〉」比教育部標點手冊說得更死：手冊乙式是「《 》多用於書名，〈 〉多用於篇名」，改成「多用於」。
# - 補法律依據（著作權法第 52、64 條：合理引用也要明示出處）與學術倫理比法律更廣的說明；補引述、改寫、摘寫三種方式。
# - AI 整理參考文獻：補「逐筆打開原始來源核對」（AI 可能編造引文）。
# - 「隨機抽 3 處」標示示意；補 Why/How/What 與兩張圖。
