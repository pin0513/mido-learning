idea: 直接引用用引號並寫出處，書名用《》、篇名用〈〉。換句話說也要註明來源。各領域引用格式不同，先看投稿或課程規定。
guiding_questions:
- 引用別人的一句話，要怎麼標才不算抄？
scenario: 親子共學：複習版：拿你最近寫的報告或文章，把每一句不是你想的話找出來，標上引號或出處。
goal: 引用時用對引號、書名號與篇名號，每一句別人的話都標出處。
review: 拿最近一份報告，把不是自己想的句子全部找出來，每處都有引號或出處；請家人隨機抽 3 處，都能找到原始來源。
