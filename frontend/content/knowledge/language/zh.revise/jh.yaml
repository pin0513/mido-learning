idea: 會考寫作四級分的遣詞造句是「能正確使用語詞，文意表達尚稱清楚，但有時會出現冗詞贅句；句型較無變化」，也常「有一些錯別字」。改稿就是刪贅字、換精確的詞、變化句型、檢查標點（本站整理）。會考採整體性評分，四個向度沒有固定比重。
guiding_questions:
- 哪一句刪掉，文章反而更好？
scenario: 親子共學：拿自己一篇舊作文，對照會考規準四向度，各找一個可以升級的地方，改完唸給家人聽。
goal: 對照會考寫作四向度（立意取材、結構組織、遣詞造句、錯別字格式標點）改一篇舊作。
review: 孩子在舊作文上用四種顏色各標一處要升級的地方並改寫；家長比較前後兩版，至少 3 處（示意）確實變好。
