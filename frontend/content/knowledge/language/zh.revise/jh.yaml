# B4 提案：zh.revise@jh
# - 四級分「冗詞贅句；句型較無變化」的引文與規準一致，改成完整逐字。
# - 補上會考採整體性評分：四個向度「並沒有特定比重的規定」，錯別字「不會再行額外的扣分」（問與答 Q3），避免讀者以為按向度加權或逐字扣分。
# - 改稿四步驟是本站整理；「至少 3 處」標示意。補 grades、6-Ⅳ-2 與 Why/How/What。
# - 複審建議：補 Q3 後半句「由於錯別字很可能會影響寫作品質，考生應避免寫錯別字」（逐字），避免讀成錯字沒關係。
