why:
  heading: 從四級分往上一步
  body:
  - 會考寫作評分規準有四個向度：立意取材、結構組織、遣詞造句，以及錯別字、格式與標點符號。閱卷委員「綜合考生在這四個向度的表現」，給一至六級分的整體評分；四個向度「並沒有特定比重的規定」，錯別字也「不會再行額外的扣分」；但「由於錯別字很可能會影響寫作品質，考生應避免寫錯別字」。
  - 國語文課綱把「修改潤飾」列為寫作步驟之一。
  qa:
    question: 哪一句刪掉，文章反而更好？
    answer: 重複前面意思、或和主旨無關的句子。規準四級分的描述是「有時會出現冗詞贅句」，三級分是「冗詞贅句過多」；刪掉這些句子，文章更清楚，也更接近六級分「能精確使用語詞」。
    source: cap-rubric
  items_title: 國中課綱怎麼說
  items:
  - title: 修改潤飾
    text: 國語文 6-Ⅳ-2：依據審題、立意、取材、組織、遣詞造句、修改潤飾，寫出結構完整、主旨明確、文辭優美的文章。
    code: 6-IV-2
  sources:
  - cap-writing
  - cap-rubric
  - kuoyu
how:
  heading: 四種顏色，四個向度
  body:
  - 用四種顏色對照四個向度，各找一處可以升級的地方：主旨不清、段落接不起來、句子囉唆或單調、錯字與標點（本站建議）。改完唸給家人聽。
  items:
  - title: 刪贅字
    text: 刪掉重複意思的詞句。
  - title: 換精確的詞
    text: 六級分要「能精確使用語詞」。
  - title: 變化句型
    text: 六級分要「有效運用各種句型使文句流暢」。
  - title: 查錯字與標點
    text: 對照教育部辭典與標點符號手冊（本站建議）。
  checklist_title: 改一篇舊作：
  checklist:
  - 刪贅字
  - 換精確的詞
  - 變化句型
  - 查錯字標點
  activity_figure: how-flow
  sources:
  - cap-rubric
