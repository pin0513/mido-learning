idea: 讀日文原文要會猜：從漢字推意思、從前後文推讀音。先從新聞標題和短篇小說開始，慢慢讀長文。
guiding_questions:
- 沒有標讀音的漢字，你怎麼猜出讀音和意思？
scenario: 親子共學：每天讀一則 NHK 新聞標題，猜意思後再對照內文，一個月後比較讀懂的比例。
goal: 讀日文新聞、小說或論文原文，說出重點與作者立場。
review: 選一篇日文新聞，用三句中文說出發生什麼、誰說了什麼、作者怎麼看；家人對照翻譯確認。
