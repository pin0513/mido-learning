idea: 讀日文原文可以從新聞和評論開始：先看標題抓概要，再找每段的主旨，最後分清哪些是事實、哪些是作者的意見（讀法是本站建議）。JLPT 官網說 N2 能讀「論旨が明快な文章」，N1 能讀「論理的にやや複雑な文章や抽象度の高い文章」。
guiding_questions:
- 一篇日文評論，怎麼分出事實和作者的意見？
scenario: 親子共學：每天讀一則日文新聞的標題，先猜內容再讀內文確認；持續一個月後，挑一篇評論練習分出事實和意見（每天、一個月是示意）。
goal: 讀一篇日文新聞或評論，用看標題、找段落主旨、分出事實和意見的方法，說出重點和作者的立場。
review: 選一篇日文新聞評論，用三句中文說出發生什麼、作者的主張、作者用哪些事實支持；家人對照原文或可信的翻譯確認（三句是示意）。
