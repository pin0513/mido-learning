  supports: 「日本語能力試験のレベル認定の目安は、下の表のように『読む』『聞く』という言語行動で表します。」；N3 読む「日常的な話題について書かれた具体的な内容を表す文章を、読んで理解することができる。」、「新聞の見出しなどから情報の概要をつかむことができる。」；N2 読む「幅広い話題について書かれた新聞や雑誌の記事・解説、平易な評論など、論旨が明快な文章を読んで文章の内容を理解することができる。」；N1 読む「幅広い話題について書かれた新聞の論説、評論など、論理的にやや複雑な文章や抽象度の高い文章などを読んで、文章の構成や内容を理解することができる。」
