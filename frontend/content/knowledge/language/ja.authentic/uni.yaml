why:
  heading: N2 到 N1 讀的是論說文
  body:
  - JLPT 官網說，各級認定の目安用「読む」「聞く」表示。N2 能讀「幅広い話題について書かれた新聞や雑誌の記事・解説、平易な評論など、論旨が明快な文章を読んで文章の内容を理解することができる。」
  - N1 能讀「幅広い話題について書かれた新聞の論説、評論など、論理的にやや複雑な文章や抽象度の高い文章などを読んで、文章の構成や内容を理解することができる。」所以除了內容，也要看文章的構成。
  items_title: JLPT 的讀解目安
  items:
  - title: N3
    text: 從新聞標題抓概要
  - title: N2
    text: 論旨明快的記事、評論
  - title: N1
    text: 論說、評論的構成與內容
  notes:
  - 本站建議：把本點放在大學階段、對應 JLPT N2 到 N1 是本站建議，不是官方換算。JLPT 官網寫 N2 是「日常的な場面で使われる日本語の理解に加え、より幅広い場面で使われる日本語をある程度理解することができる」，N1 是「幅広い場面で使われる日本語を理解することができる」。
  sources:
  - jlpt-levels
how:
  heading: 標題、段落主旨、事實與意見
  body:
  - 本站建議的三步：①讀標題和第一段抓概要（JLPT N3 的目安就有「新聞の見出しなどから情報の概要をつかむことができる。」）；②每段找一句主旨，標出接續詞；③把句子分成事實和意見，最後說出作者的立場和支持的事實。
  - 本站整理：能查證的（數字、日期、誰說了什麼）是事實；帶「〜べきだ」「〜と考える」這類句尾的，多半是作者的意見。高中第二外國語文領綱四級也有「能分辨客觀事實與主觀意見。」讀的文章只摘要、不轉貼全文（本站建議）。摘要和作者立場自己寫；AI 只幫忙標讀音、解釋句型，只貼需要的句子，不貼整篇文章；寫完回原文核對（本站建議）。
  qa:
    question: 一篇日文評論，怎麼分出事實和作者的意見？
    answer: 先問這句能不能查證：數字、日期、誰說了什麼是事實；「〜べきだ」「〜と考える」這類句尾多半是作者的意見（本站整理）。分完再看作者用哪些事實支持主張。高中第二外國語文領綱四級也有「能分辨客觀事實與主觀意見。」（p.10）
    source: sfl
  items_title: 本站建議的讀法
  items:
  - title: 看標題
    text: 讀標題和第一段抓概要
  - title: 找段落主旨
    text: 每段一句，標出接續詞
  - title: 分事實與意見
    text: 能查證的是事實（本站整理）
  - title: 說出立場
    text: 作者主張什麼、用什麼支持
  checklist_title: 每次讀完勾一下
  checklist:
  - 讀了標題首段
  - 每段找到主旨
  - 分出事實意見
  - 說出作者立場
