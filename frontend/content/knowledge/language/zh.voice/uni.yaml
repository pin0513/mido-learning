idea: 聲音來自你的用詞、句子長短和節奏，以及你在意的事。長短句交錯、少用套語、寫你真的會說的話。
guiding_questions:
- 唸出來時，哪一句不像你會說的話？
scenario: 親子共學：把一篇自己的文章唸出來錄音，圈出唸起來卡卡、不像自己的句子，改寫到唸得順。
goal: 寫出唸起來像自己的文字：用詞、句長與節奏是自己的。
review: 錄音朗讀自己的一篇文章，圈出唸起來卡卡的句子並改寫；家人聽改後版本，說得出哪裡「像你」。
