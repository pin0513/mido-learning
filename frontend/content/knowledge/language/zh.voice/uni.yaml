# B6 提案：zh.voice@uni
# - 標題「找到自己的聲音」沒有冒號、承諾也太大（本點教的是唸出來、改到像自己），改為「自己的聲音：唸出來像你會說的話」。
# - 補依據：UNC 寫作中心〈Style〉（目標不是聽起來聰明）、〈Editing and Proofreading〉（唸出來、句子長短變化）、〈Generative AI〉（AI 修改後檢查是否失去你的聲音）；學術倫理資源中心指南「以自己的語氣與論述」。
# - 「聲音來自…」的分法標示本站整理；AI 分析用詞：補不貼他人或未公開文字。補 Why/How/What 與兩張圖。
