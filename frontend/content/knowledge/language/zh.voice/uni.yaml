why:
  heading: 不是聽起來聰明
  body:
  - UNC 寫作中心說，學術寫作的目標不是讓自己聽起來很聰明，而是把聰明的觀點傳達出去；刻意模仿複雜的文風，可能反而犧牲了溝通、讓人看不懂。
  - 寫論文也一樣。教育部臺灣學術倫理教育資源中心的指南談文獻探討時提醒，許多研究生只把讀到的內容平鋪直述寫出來，研究生「應該以自己的語氣與論述」來描述文獻。用 AI 潤飾時，UNC 寫作中心建議，看 AI 的修改時問自己它有沒有拿掉你獨特的聲音，AI 建議改的地方，不一定要照改。
  qa:
    question: 唸出來時，哪一句不像你會說的話？
    answer: 通常是套語太多、句子太長或太文、不是你平常會用的詞。把它唸出來，卡住或覺得彆扭的地方圈起來，改成你跟朋友解釋時會說的話，再唸一次。
    source: unc-editing
  items_title: 聲音的三個來源（本站整理）
  items:
  - title: 用詞
    text: 你平常會用的詞，而不是套語。
  - title: 句長與節奏
    text: 長短句交錯，唸起來有變化。
  - title: 在意的事
    text: 你選的細節，反映你在乎什麼。
  sources:
  - unc-style
  - ethics-guide
  - unc-ai
how:
  heading: 唸出來，圈出卡住的句子
  body:
  - UNC 寫作中心建議大聲唸出來，這會逼你說出每一個字，也讓你聽見字和字放在一起的聲音；編輯時也檢查句子的長短與結構有沒有變化。
  - Kennesaw State University 寫作中心提醒，替人改稿時不要把對方改成像你；反過來，聽別人的建議時，如果覺得對方想改掉你的風格，先想想這個建議會不會讓文章更好；不會，就可以先放著不用。
  items_title: 三步改寫（本站建議）
  items:
  - title: 錄音朗讀
    text: 唸一遍自己的文章並錄下來。
  - title: 圈出卡住處
    text: 聽錄音，圈出唸不順或不像你的句子。
  - title: 改到唸得順
    text: 改成你會說的話，再唸一次。
  checklist_title: 改完再唸一次：
  checklist:
  - 唸得順嗎
  - 像我會說嗎
  - 套語刪了嗎
  - 長短有變化
  activity_figure: how-flow
  sources:
  - unc-editing
  - ksu-feedback
what:
  heading: 你的聲音，不等於 AI 的潤飾
  figures:
  - what-compare
  notes:
  - 請 AI 分析你常用的詞與句長時，只貼你自己的文字；別人的作品、未公開文件不要貼進對話框。學術倫理電子報提醒「不要將個人資訊、未公開文件、機密資料等內容輸入到生成式AI的對話框中」。
  - 聲音的三個來源是本站整理，三步改寫是本站建議。
  sources:
  - ethics-epaper13
