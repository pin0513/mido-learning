idea: 學測情意題要「具體寫出個人的生活經驗」並「真誠抒發」。評分原則裡，B 等常是「想法較為粗淺，或僅泛論」。
guiding_questions:
- 寫家人時，哪個只有你家才有的細節，能讓人相信？
scenario: 親子共學：寫一段 300 字「只有我家才有」的場景，家長讀完說出最記得的一個細節。
goal: 學測國寫情意題：寫出具體的個人經驗與真誠的感受。
review: 孩子寫一段 300 字「只有我家才有」的場景，家長讀完說得出一個最記得的細節，且找不到放進任何文章都通的套話。
