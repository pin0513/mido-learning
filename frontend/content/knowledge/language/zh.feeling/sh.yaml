why:
  heading: 具體，才讓人相信
  body:
  - 大考中心的學測國文考試說明，把國寫的情意目標寫成「(1)具體寫出個人的生活經驗，從中感知聯想、創造抒發。(2)針對問題的情境，真誠抒發個人的情感與體會。」
  - 以 115 學年度國寫第二大題為例，B 級（13-10 分）的描述是「能簡略描述與對象產生隔閡的原因；能簡略換位思考，嘗試溝通，並傳達自己的回應。唯想法較為粗淺，或僅泛論。」
  qa:
    question: 寫家人時，哪個只有你家才有的細節，能讓人相信？
    answer: 找人、事、時、地、物裡只屬於你家的一樣，例如「爸爸每天把隔天的便當菜寫在冰箱的白板上」（示意）。課綱的學習內容就是「人、事、時、地、物的細部描寫」，再「藉由敘述事件與描寫景物間接抒情」。
    source: kuoyu
  items_title: 高中課綱的抒情寫作目標
  items:
  - title: 人際交流的感受
    text: 國語文 Bb-Ⅴ-1：自我及人際交流的感受。
    code: Bb-V-1
  - title: 細部描寫
    text: 國語文 Ba-Ⅴ-2：人、事、時、地、物的細部描寫。
    code: Ba-V-2
  - title: 間接抒情
    text: 國語文 Bb-Ⅴ-4：藉由敘述事件與描寫景物間接抒情。
    code: Bb-V-4
  - title: 抒發個人情感
    text: 國語文 6-Ⅴ-4：掌握各種文學表現手法，適切地敘寫，關懷當代議題，抒發個人情感，說明知識或議論事理。
    code: 6-V-4
  sources:
  - ceec
  - ceec-115
  - kuoyu
how:
  heading: 人事時地物，各找一個
  body:
  - 先挑一個真的發生過、你願意寫出來的場景，再從人、事、時、地、物各找一個細節（本站建議）。感受不直接喊出來，讓事件和細節替你說。
  items_title: 寫一個場景（本站建議）
  items:
  - title: 挑真實場景
    text: 選一件真的發生、願意寫出來的事。
  - title: 找五種細節
    text: 人、事、時、地、物各找一個。
  - title: 藉事寫情
    text: 讓事件和景物帶出感受，不只寫「我很感動」。
  - title: 刪掉套話
    text: 放進任何文章都通的句子就刪掉。
  checklist_title: 寫完檢查：
  checklist:
  - 真的發生過
  - 有五種細節
  - 藉事寫情
  - 沒有套話
  activity_figure: how-flow
  sources:
  - kuoyu
