why:
  heading: 說出樣子，也能比較
  body:
  - 第二外國語文領綱的三級學習表現有「能依人、事、地、物作適切的提問、描述或回答。」（2-Ⅴ-16），四級有「能把各類訊息加以比較、歸類、排序。」（8-Ⅴ-10）。
  - 國際交流基金的《いろどり》初級2（A2）第12課的一個能力目標（Can-do 53）是「家電量販店で電気製品の比較表や値札を見て、必要な情報を読み取ること…」，比較句就在這一課出現。
  items_title: 第二外國語文領綱的學習重點
  items:
  - title: 提問、描述或回答
    text: 第二外國語文 2-Ⅴ-16：能依人、事、地、物作適切的提問、描述或回答。
    code: 2-V-16
  - title: 比較、歸類、排序
    text: 第二外國語文 8-Ⅴ-10：能把各類訊息加以比較、歸類、排序。
    code: 8-V-10
  checklist_title: 開始前先確認
  checklist:
  - 會說です句
  - 認得假名
  notes:
  - 第二外國語文的Ⅴ代表語文程度三級、四級，不是年級；高中由學校在加深加廣選修、多元選修或校訂課程開設，不是每校都有。本點對到三級、四級是本站建議。
  sources:
  - sfl
  - irodori2
how:
  heading: 兩種形容詞與比較句
  body:
  - 《いろどり》入門（A1）第7課：な形容詞「家は静かです。」，い形容詞「ちょっとせまいです。」；否定是「ナ A-じゃないです」「イ A-くないです」，例如「アパートは、あまり静かじゃないです。」「寮は広くないです。」第17課的過去形是「ナ A-でした」「イ A-かったです」，例如「国際フェスティバルは、とても楽しかったです。」
  - 比較用初級2（A2）第12課的「N1 と N2（と）、どちら／どっちが～か？」，例如「どっちが使いやすいですか？」；回答用「（N1 より）N2 のほうが、～。」，例如「セーシバの掃除機のほうがスギシタより軽くて、動かしやすいですよ。」本站整理：い形容詞是把語尾的い換掉再變化（例外：いい→よくないです、よかったです），な形容詞在です句裡不出現な；きれい雖然以い結尾，其實是な形容詞，要個別記。
  qa:
    question: 「おいしい」和「きれい」為什麼變化方式不一樣？
    answer: 因為兩個屬於不同的形容詞：おいしい是い形容詞，否定說おいしくないです；きれい是な形容詞，否定說きれいじゃないです（分類與例子是本站整理）。《いろどり》把兩種分開教：「イ A-くないです」和「ナ A-じゃないです」。
    source: irodori
  items_title: 《いろどり》的句型
  items:
  - title: い形容詞
    text: 否定：イ A-くないです；過去：イ A-かったです
    example: 寮は広くないです。
  - title: な形容詞
    text: 否定：ナ A-じゃないです；過去：ナ A-でした
    example: アパートは、あまり静かじゃないです。
  - title: 問哪一個
    text: N1 と N2（と）、どちら／どっちが～か？
    example: どっちが使いやすいですか？
  - title: 比較回答
    text: （N1 より）N2 のほうが、～。
    example: セーシバの掃除機のほうがスギシタより軽くて、動かしやすいですよ。
  checklist_title: 每次練完勾一下
  checklist:
  - 分出兩種形容詞
  - 否定變對了
  - 用了のほうが
  activity_figure: adj-flow
