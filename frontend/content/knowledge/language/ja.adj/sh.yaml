idea: 日文形容詞分い形容詞和な形容詞，否定和過去的變化不同：い形容詞說「くないです」「かったです」，な形容詞說「じゃないです」「でした」。比較兩樣東西時，用「N1 と N2（と）、どちら／どっちが～か？」問，用「（N1 より）N2 のほうが、～。」回答（句型依《いろどり》）。
guiding_questions:
- 「おいしい」和「きれい」為什麼變化方式不一樣？
scenario: 親子共學：拿身邊兩樣東西（例如兩支筆），孩子先用い形容詞、な形容詞各說一句它們的樣子，再用比較句問家人哪一個比較好用，家人用「のほうが」回答，然後交換（本站建議）。
goal: 用い形容詞、な形容詞的肯定和否定說出東西的樣子，並用比較句問、答兩樣東西哪一個比較怎麼樣。
review: 孩子拿身邊兩樣東西，用い形容詞、な形容詞各說 1 句肯定、1 句否定，再用比較句問 1 次、答 1 次；家長對照本頁的變化表和句型，6 句都正確（句數是示意）。
