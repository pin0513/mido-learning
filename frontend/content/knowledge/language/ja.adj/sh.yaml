what:
  heading: 描述並比較兩樣東西
  body:
  - 學完後，孩子能用い形容詞、な形容詞的肯定和否定說出東西的樣子，並用「どっちが」問、用「のほうが」答，比較兩樣東西。
  items_title: 學完能做到
  items:
  - title: 說出樣子
    text: 用兩種形容詞說肯定句。
  - title: 改成否定
    text: くないです或じゃないです。
  - title: 比較兩樣
    text: どっちが問、のほうが答。
  checklist_title: 家長檢核
  checklist:
  - 肯定句正確
  - 否定句正確
  - 比較句正確
