idea: 日文形容詞分兩種：い形容詞和な形容詞，變化方式不同。學會比較句，就能說出哪個比較好吃、比較漂亮。
guiding_questions:
- 「おいしい」和「きれい」為什麼變化方式不一樣？
scenario: 親子共學：全家試吃三種零食，用日文說出「AはBより〜です」，選出第一名。
goal: 用い形容詞、な形容詞描述和比較兩樣東西。
review: 孩子用比較句型說 4 句比較家裡兩樣東西（大小、喜好），家長對照課本，4 句都正確。
