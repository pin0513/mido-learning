why:
  heading: 漢字是優勢，也是陷阱
  body:
  - 日本的〈常用漢字表〉是「一般の社会生活において，現代の国語を書き表す場合の漢字使用の目安」，收了 2136 個字。JLPT 官網對 N5 讀解的說明就包括「日常生活で用いられる基本的な漢字」。
  - 第二外國語文領綱二級學習表現有「能利用各種查詢工具，推測詞彙文脈意義，自主了解外語資訊。」（6-Ⅳ-7），學習內容有「字詞歸類」（Bp-Ⅳ-1）和「猜測、推論。」（Bp-Ⅳ-2）：先猜、再查、再歸類，正是本點的做法。
  items_title: 第二外國語文領綱的學習重點
  items:
  - title: 查詢工具推測詞義
    text: 第二外國語文 6-Ⅳ-7：能利用各種查詢工具，推測詞彙文脈意義，自主了解外語資訊。
    code: 6-IV-7
  - title: 字詞歸類
    text: 第二外國語文 Bp-Ⅳ-1：字詞歸類
    code: Bp-IV-1
  - title: 猜測、推論
    text: 第二外國語文 Bp-Ⅳ-2：猜測、推論。
    code: Bp-IV-2
  checklist_title: 開始前先確認
  checklist:
  - 會念平假名
  - 會查字典
  notes:
  - 第二外國語文的Ⅳ代表語文程度一級、二級，不是年級；國中由學校在彈性學習課程選開，不是每校都有。
  sources:
  - joyo
  - jlpt-levels
  - sfl
how:
  heading: 分音讀訓讀，先猜再查
  body:
  - 常用漢字表說「字音は片仮名で，字訓は平仮名で示した。」字音就是音讀，字訓就是訓讀（中文叫法是本站整理）。例如「山」的音讀是サン、訓讀是やま；「水」是スイ、みず；「手」是シュ、て；「紙」是シ、かみ。
  - 本站整理：「手紙」念てがみ，意思是信（紙的字訓かみ在詞裡變成がみ，叫連濁）；「大丈夫」是沒問題；「勉強」是讀書。遇到漢字詞，先用中文猜，再查字典確認，最後分成意思和中文一樣、不一樣兩類；猜錯的詞，寫下中文意思和日文意思各是什麼（本站建議）。
  - 本站整理的例詞表（讀音供參考，意思請查字典）：手紙（てがみ）、大丈夫（だいじょうぶ）、勉強（べんきょう）、汽車（きしゃ）、新聞（しんぶん）、娘（むすめ）、電話（でんわ）、学生（がくせい）、時間（じかん）、山（やま）。
  qa:
    question: 「手紙」在日文是什麼意思？跟中文一樣嗎？
    answer: 不一樣，日文的「手紙」是信（本站整理）。常用漢字表的「手」有字訓て，「紙」有字訓かみ；遇到這種詞，先猜再查字典確認。
    source: joyo
  items_title: 常用漢字表的音訓例
  items:
  - title: 山
    text: 音讀サン，訓讀やま。
  - title: 水
    text: 音讀スイ，訓讀みず。
  - title: 手
    text: 音讀シュ，訓讀て。
  - title: 紙
    text: 音讀シ，訓讀かみ。
  checklist_title: 每次練完勾一下
  checklist:
  - 先猜再查
  - 分了兩類
  - 寫了中日意思
  - 說出音訓
  activity_figure: kanji-flow
  notes:
  - 手紙、大丈夫、勉強的意思、連濁的說明和例詞表是本站整理，請以字典確認。
  sources:
  - joyo
what:
  heading: 會猜、會查、會分
  body:
  - 學完後，孩子能用中文漢字猜日文漢字詞的意思並查字典確認，把詞分成意思一樣和不一樣兩類，說得出猜錯的詞在中文、日文各是什麼意思，也分得出音讀和訓讀。
  items_title: 學完能做到
  items:
  - title: 猜詞義
    text: 用中文漢字猜日文漢字詞。
  - title: 查證歸類
    text: 查字典確認，分成一樣、不一樣兩類。
  - title: 說明猜錯
    text: 說出猜錯的詞中文、日文各是什麼意思。
  - title: 音讀訓讀
    text: 說出例字的音讀和訓讀。
  checklist_title: 家長檢核
  checklist:
  - 猜了再查
  - 分類正確
  - 說得出差別
  - 音訓說對
  figures:
  - kanji-compare
  notes:
  - 檢核的題數是示意。
  - 本站建議：本點可當作 JLPT N5 到 N4 的準備；這是本站建議的對應，不是官方換算。JLPT 官網寫 N5 是「基本的な日本語をある程度理解することができる」，N4 是「基本的な日本語を理解することができる」。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具，「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - joyo
  - jlpt-levels
  - genai-student
