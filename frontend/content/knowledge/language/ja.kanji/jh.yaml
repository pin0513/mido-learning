idea: 日文也用漢字，但讀音和意思不一定和中文一樣。看得懂漢字是台灣學習者的優勢，也要小心「長得一樣、意思不同」的字。
guiding_questions:
- 「手紙」在日文是什麼意思？跟中文一樣嗎？
scenario: 親子共學：收集 10 個日文漢字詞（例如手紙、大丈夫、勉強），先用中文猜意思，再查答案。
goal: 用中文漢字的知識猜日文漢字的意思，記住音讀與訓讀的差別。
review: 家長給 10 個日文漢字詞（包括「手紙」這類意思跟中文不同的字），孩子先猜再查，並說出 2 個猜錯的原因。
