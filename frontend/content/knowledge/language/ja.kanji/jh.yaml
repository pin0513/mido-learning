idea: 日文也用漢字，但讀音分音讀和訓讀，意思也不一定和中文一樣。看得懂漢字是台灣學習者的優勢，也要小心「長得一樣、意思不同」的詞（本站整理）。
guiding_questions:
- 「手紙」在日文是什麼意思？跟中文一樣嗎？
scenario: 親子共學：從本頁例詞表挑 10 個日文漢字詞（例如手紙、大丈夫、勉強），先用中文猜意思，再查字典，分成「一樣」「不一樣」兩堆（10 個是示意）。
goal: 用中文漢字的知識猜日文漢字詞的意思並查證，分得出音讀和訓讀。
review: 家長從本頁例詞表給 10 個日文漢字詞（包括「手紙」這類意思跟中文不同的詞），孩子先猜、再查字典，分成意思一樣和不一樣兩類，並說出 2 個猜錯的詞，中文意思和日文意思各是什麼；再從本頁的例字挑 2 個，說出音讀和訓讀（題數是示意）。
