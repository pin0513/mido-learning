idea: 報連相是「報告・連絡・相談」的簡稱：主動回報結果、通知變動、提早商量（說法是本站整理）。寫給公司外的人時，自己公司的人要當成ウチ，例如說「部長の田中」；電子郵件也要照顧對方，〈敬語の指針〉說電子郵件同樣需要「その都度の相手や状況に対するふさわしい気配り」。
guiding_questions:
