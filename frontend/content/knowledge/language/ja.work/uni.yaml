why:
  heading: 對外溝通靠稱呼與回報
  body:
  - 〈敬語の指針〉說，敬語對「取引先など異なる組織にいる相手であれば，年齢にかかわらず使われているものである。」；社外的人多的場合，介紹社長致詞要說「社長からごあいさつを申し上げます。」：對外時，自己公司的人是ウチ。
  - 厚生労働省給職場的教材提醒「相談や質問をしやすいように、日頃から話をする・聞く姿勢を持ちましょう。」主動回報與商量，是本站整理的報連相。
  items_title: 職場溝通的重點
  items:
  - title: ウチ・ソト
    text: 對外時，自己公司的人是ウチ
  - title: 取引先
    text: 不論年齡都用敬語
  - title: 報連相
    text: 報告、連絡、相談（本站整理）
  notes:
  - 本站建議：把本點放在大學階段、對應 JLPT N2 到 N1 是本站建議，不是官方換算。JLPT 官網寫 N2 是「日常的な場面で使われる日本語の理解に加え、より幅広い場面で使われる日本語をある程度理解することができる」，N1 是「幅広い場面で使われる日本語を理解することができる」。
  sources:
  - keigo
  - mhlw-comm
  - jlpt-levels
how:
  heading: 四部分的信與報連相
  body:
  - 本站整理的信件四部分：宛名（給個人寫〇〇様，給公司或部門寫御中）、名乘（自己的公司和名字）、要件（用報連相：先報告結果，再連絡變動，最後提出想相談的事）、結尾。〈敬語の指針〉說御中用在「その組織や機関の中にいる関係者へあてる」時；已經寫出對方姓名還加御中，就「不適切な表現になる」。信要自己先寫完，之後才請 AI 看用字；練習時公司和人名都用虛構的（本站建議）。
  - 稱呼：對公司外的人提自己的上司，指針說可以說「部長の田中」，但「田中部長」「ウチ扱いにした呼び方にはならないので，不適切である。」電子郵件不要因為簡短就省掉敬語：指針提到有人批評電子郵件「敬語も割愛してしまうといった傾向」。
  - 口頭回報可參考厚生労働省教材的例子：「お忙しいところ、すみません。コピー機が壊れています。」先體貼對方、再說事情（本站整理）；教材建議請對方「内容を復唱してもらう」來確認理解，自己接到指示時也可以主動複述（本站建議）。
  qa:
    question: 寫給客戶的信裡，怎麼稱呼自己公司的部長？
    answer: 寫「部長の田中」或「田中」。〈敬語の指針〉說對公司外的人提自己的部長時，「田中部長」不是ウチ的叫法，不適切；正式場合也可說「弊社の部長」。
    source: keigo
  items_title: 信件四部分（本站整理）
  items:
  - title: 宛名
    text: 個人用〇〇様，公司部門用御中
  - title: 名乘
    text: 自己的公司和名字
  - title: 要件
    text: 報告→連絡→相談
  - title: 結尾
    text: 請求或致謝，結束信件
  checklist_title: 每次寫完勾一下
  checklist:
  - 四個部分都有
  - 稱呼用ウチ
  - 沒放機密資料
  activity_figure: work-flow
  sources:
  - keigo
  - mhlw-comm
what:
  heading: 寫信與回報都得體
  body:
  - 學完後，能寫一封有宛名、名乘、要件、結尾四個部分的職場日語信件，要件依報告、連絡、相談排好，並用ウチ的稱呼說自己公司的人。
  items_title: 學完能做到
  items:
  - title: 四部分信件
    text: 宛名、名乘、要件、結尾。
  - title: 報連相
    text: 報告、連絡、相談依序寫。
  - title: ウチ的稱呼
    text: 部長の田中、弊社の部長。
  checklist_title: 自我檢核
  checklist:
  - 四部分齊全
  - 稱呼正確
  - 用虛構資料
  figures:
  - work-compare
  notes:
  - 用生成式 AI 時，不要把個人資訊、未公開文件、機密資料貼進去（教育部臺灣學術倫理教育資源中心 2023 年的電子報）；不上傳自己或別人的錄音（本站建議）；AI 的輸出要自己查證。同一份電子報也說，學術界對使用生成式 AI 是否需要標註「尚無統一的規定」，建議先了解相關單位的政策；交作業時依課程規定說明用了哪個工具、做了什麼；AI 規定變化快，以學校和課程最新的規定為準（本站建議）。作業要自己寫，不把 AI 生成的內容直接當成自己的作品（本站建議）；同一份電子報還說，直接使用生成內容「可能有代寫的學術倫理問題」。
  sources:
  - keigo
  - ethics-epaper13
