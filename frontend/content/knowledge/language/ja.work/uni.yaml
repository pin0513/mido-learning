scenario: 親子共學：設定一個虛構的公司和人名，寫一封日文信向「客戶」報告專案進度：完成了什麼、有什麼變動、想商量什麼；信裡不放真實公司或客戶的資料（本站建議）。
goal: 用報告、連絡、相談的順序寫一封職場日語信件，包含宛名、名乘、要件、結尾四個部分，並用ウチ的稱呼說自己公司的人。
review: 寫一封給虛構客戶的日語信件，包含宛名、名乘、要件（報告、連絡、相談）、結尾四個部分，並用「部長の田中」這類ウチ的稱呼；家人對照本頁的四個部分確認都有，稱呼也對。
