sources:
- id: keigo
  title: 敬語の指針（文化審議会答申，平成19年2月2日）
  publisher: 文化庁（文化審議会）
  url: https://www.bunka.go.jp/seisaku/bunkashingikai/kokugo/hokoku/pdf/keigo_tosin.pdf
  accessed: '2026-10-29'
  kind: government
  supports: p.10「ファクシミリや電子メールでは文章自体を要点だけの短いものにすると同時に，敬語も割愛してしまうといった傾向への批判や注意喚起である。」；p.11「そこで用いる言語表現には，他の媒体による場合と同様，その都度の相手や状況に対するふさわしい気配りが不可欠である。」；p.34「取引先など異なる組織にいる相手であれば，年齢にかかわらず使われているものである。」；p.43 御中「その組織や機関の中にいる関係者へあてる」、「『山田一郎』という氏名が明らかなのであれば，その点と矛盾するので，不適切な表現になる。」；p.44「部長の田中」、「改まった場面では『弊社の部長』，ややくだけた場面では『うちの部長』」、「田中部長」「ウチ扱いにした呼び方にはならないので，不適切である。」；p.44–45 社外「社長からごあいさつを申し上げます。」
- id: mhlw-comm
  title: 外国人従業員と一緒に働く皆様へ（外国人従業員とのコミュニケーション）
  publisher: 厚生労働省
  url: https://www.mhlw.go.jp/content/11650000/001213435.pdf
  accessed: '2026-10-29'
  kind: government
  supports: 〈話を聞くとき（聞き方）の工夫〉的會話例「お忙しいところ、すみません。コピー機が壊れています。」；「表情をみたり、理解しているか確認するために、内容を復唱してもらうとよい。」；「相談や質問をしやすいように、日頃から話をする・聞く姿勢を持ちましょう。」
- id: jlpt-levels
  title: N1～N5：認定の目安
  publisher: 日本語能力試験 JLPT（国際交流基金・日本国際教育支援協会）
  url: https://www.jlpt.jp/about/levelsummary.html
  accessed: '2026-10-29'
  kind: exam
  supports: N2「日常的な場面で使われる日本語の理解に加え、より幅広い場面で使われる日本語をある程度理解することができる」；N1「幅広い場面で使われる日本語を理解することができる」
- id: ethics-epaper13
  title: 大學校園因應生成式AI之指引及教學建議（學術倫理電子報第 13 期）
  publisher: 教育部臺灣學術倫理教育資源中心（2023 年 8 月）
  url: https://ethics.moe.edu.tw/resource/epaper/html/21/
  accessed: '2026-10-29'
  kind: reference
  supports: （五）學術寫作的自我揭露：「目前學術界對於使用生成式AI是否需要標註，尚無統一的規定」，「建議研究者應先瞭解經費補助機關（構）或期刊等單位對於生成式AI之政策，並於著作或報告中適度公開相關訊息」；（三）個人資料保護與資通安全：「研究者應留意，不要將個人資訊、未公開文件、機密資料等內容輸入到生成式AI的對話框中，以避免產生個人隱私洩露的問題。」；（二）著作權：「研究者若直接將生成的內容拿來使用，而非親自撰寫或創作，除在法律上不享有著作權保障之外，還可能有代寫的學術倫理問題。」
