idea: 日本職場重視「報告・連絡・相談」（報連相）：主動回報進度、通知變動、提早商量。日文商業信件也有固定格式。
guiding_questions:
- 日本公司常說「報連相」，和團隊溝通有什麼關係？
scenario: 親子共學：寫一封日文信，向老師報告專題進度：目前完成什麼、遇到什麼問題、想商量什麼。
goal: 寫職場日語信件，並用「報告、連絡、相談」的習慣和同事溝通。
review: 寫一封日語商務信件（開頭寒暄、主旨、請求、結尾），家人對照範本確認五個部分都有。
