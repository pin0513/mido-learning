why:
  heading: AI 改的不是你的進步
  body:
  - 教育部注意事項說：「生成式人工智慧是協助學習的工具，不能取代自己的思考與判斷，應先自行閱讀與思考，再視需要使用工具輔助。」也不得用它「從事抄襲、代寫、作弊」。
  - 國語文課綱要國中生能依據「審題、立意、取材、組織、遣詞造句、修改潤飾」寫出文章（6-Ⅳ-2），也要「運用資訊科技編輯作品」（6-Ⅳ-6）。
  qa:
    question: AI 幫你改完的作文，還算是你寫的嗎？
    answer: 整段交給 AI 改寫，就不是你寫的。教育部注意事項說，如依老師或學校規定用 AI「協助構思或潤飾，應依規定註明所使用的工具及用途，不得將生成內容直接當作自己原創作品繳交」。讓 AI 只指出問題、由你自己改，改出來的才是你的。
    source: genai-student
  items_title: 國中課綱怎麼說
  items:
  - title: 修改潤飾自己來
    text: 國語文 6-Ⅳ-2：依據審題、立意、取材、組織、遣詞造句、修改潤飾，寫出結構完整、主旨明確、文辭優美的文章。
    code: 6-IV-2
  - title: 運用資訊科技
    text: 國語文 6-Ⅳ-6：運用資訊科技編輯作品，發表個人見解、分享寫作樂趣。
    code: 6-IV-6
  sources:
  - genai-student
  - kuoyu
how:
  heading: 先寫，再請 AI 挑毛病
  body:
  - 先自己寫完草稿。再把作文（刪掉姓名、學校等個人資料）交給 AI，請它依會考寫作四個向度「立意取材、結構組織、遣詞造句，以及錯別字、格式與標點符號」各指出問題，不要給改寫好的句子（本站建議）。最後自己決定、自己改，並查證 AI 說的對不對。
  items:
  - title: 先自己寫
    text: 注意事項：「應先自行閱讀與思考」。
  - title: 只要問題清單
    text: 請 AI 依四向度指出問題、不要改寫（本站建議）。
  - title: 自己決定、自己改
    text: AI 的話也可能錯，要查證。
  - title: 註明工具與用途
    text: 交作業前依老師規定註明。
  checklist_title: 用 AI 之前：
  checklist:
  - 家長在旁
  - 工具合年齡
  - 刪掉個資
  - 只要問題
  - 自己改
  - 註明用途
  activity_figure: how-flow
  sources:
  - genai-student
  - cap-writing
what:
  heading: 教練和槍手的差別
  figures:
  - what-compare
  notes:
  - 教育部建議中小學生使用為教育目的設計的工具，如因材網 e度、酷英網 E-BOT、均一教育平臺、CK-12 Flexi；若要用其他商用版工具，「應經由學校評估資安風險，並在師長指導下審慎使用」。
  - 「教練／槍手」的比喻是本站整理。
  sources:
  - genai-student
