  - 寫出第一份草稿
  - 決定採用哪些建議並自己改寫
idea: 自己寫完草稿，再請 AI 照會考四向度「指出問題、不要改寫」。每個建議由你決定要不要採用，自己動手改。
guiding_questions:
- AI 幫你改完的作文，還算是你寫的嗎？
scenario: 親子共學：同一篇草稿，比較「請 AI 改寫」和「請 AI 只指出三個問題」的結果，討論哪一種讓自己進步。
goal: 請 AI 照規準「指出問題、不要改寫」，每個建議由自己決定、自己改。
review: 孩子交草稿、AI 建議清單和定稿三份；家長檢查定稿裡沒有整段照抄 AI 的句子，且孩子說得出採用與不採用的理由。
