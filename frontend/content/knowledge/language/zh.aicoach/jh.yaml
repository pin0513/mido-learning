idea: 自己寫完草稿，再請 AI 照會考寫作四向度「指出問題、不要改寫」（本站建議）。每個建議由你決定要不要採用，自己動手改。教育部提醒，生成式 AI「不能取代自己的思考與判斷」；要遵守平臺年齡限制，在家使用請家長陪伴，不要輸入姓名、學號等個人資料。
guiding_questions:
- AI 幫你改完的作文，還算是你寫的嗎？
scenario: 親子共學：在家長陪伴下，用符合年齡規定的教育工具（例如教育部因材網的 e度），同一篇草稿比較「請 AI 改寫」和「請 AI 只指出三個問題」的結果，討論哪一種讓自己進步；兩種結果都不直接拿去交。
goal: 請 AI 照規準「指出問題、不要改寫」，每個建議由自己決定、自己改。
review: 孩子交草稿、AI 建議清單和定稿三份；家長檢查定稿裡沒有整段照抄 AI 的句子、草稿沒有輸入個人資料，且孩子說得出採用與不採用的理由。
