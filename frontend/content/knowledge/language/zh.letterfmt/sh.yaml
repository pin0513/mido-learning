idea: 書信有固定結構：稱謂、提稱語、正文、結尾敬辭、署名、日期；電子郵件還要有清楚的主旨。格式讓讀的人知道你尊重他，也找得到重點。
guiding_questions:
- 寫給校長的建議信，結尾只寫「謝謝」就夠了嗎？
scenario: 親子共學：複習版：替一件真實的事寫一封 email 給老師或主管，請家人只看主旨和第一句，說出他知道要做什麼嗎。
goal: 寫出格式正確的書信與 email：稱謂、主旨、結尾敬辭、署名、日期。
review: 孩子寫一封真的要寄給老師的 email，家長只看主旨和第一句，就能說出要做什麼；格式五項都有才打勾。
