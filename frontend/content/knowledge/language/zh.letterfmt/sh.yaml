why:
  heading: 格式讓人讀到尊重和重點
  body:
  - 國語文課綱的高中學習內容包括「在人際溝通方面，以書信、便條、啟事、柬帖、對聯、題辭、慶賀文、祭弔文等慣用語彙與書寫格式為主」。
  - 書信的用語要配合對象。教育部《重編國語辭典修訂本》說，提稱語是「請受信人察閱的語詞。用時應與稱謂配合，並按雙方的關係來措詞」。
  qa:
    question: 寫給校長的建議信，結尾只寫「謝謝」就夠了嗎？
    answer: 不夠：正文最後一段先把請求再說一次，再道謝，例如「懇請校長撥冗考慮，謝謝您。」（示意），讓「謝謝」有具體的事可以謝；之後還要署名和日期，讓校長知道是誰、什麼時候寫的（本站建議）。開頭的稱謂和提稱語也要配合身分，例如辭典說對一般長輩用「鈞鑒、尊鑒」。傳統書信在署名前還有結尾敬辭，例如「敬請 鈞安」（國家文官學院《公文撰作解析》p.251），其他例子列在下方說明。
    source: rev-tichengyu
  items_title: 高中課綱的應用文目標
  items:
  - title: 書信的慣用語彙與格式
    text: 國語文 Be-Ⅴ-2：在人際溝通方面，以書信、便條、啟事、柬帖、對聯、題辭、慶賀文、祭弔文等慣用語彙與書寫格式為主。
    code: Be-V-2
  - title: 根據需求撰寫
    text: 國語文 6-Ⅴ-1：深化寫作能力，根據生活的需求撰寫各類文本。
    code: 6-V-1
  sources:
  - kuoyu
  - rev-tichengyu
how:
  heading: 看對象，選用語
  body:
  - 先確定寫給誰、你們是什麼關係，再決定稱謂和提稱語；電子郵件先寫主旨，正文第一句就說目的（本站建議）。
  items_title: 寫信的順序（本站整理）
  items:
  - title: 稱謂與提稱語
    text: 稱謂配合對方身分，例如「王老師」；提稱語按雙方關係措詞。
    example: 長輩：鈞鑒；平輩：大鑒
  - title: 正文
    text: 說清楚要談的事；email 另寫主旨，正文第一句就說目的（本站建議）。
  - title: 結尾敬辭（紙本）
    text: 結束正文時向對方表示禮貌，例如「敬請 鈞安」（《公文撰作解析》p.251）。
  - title: 署名與日期
    text: 寫清楚自己是誰、什麼時候寫的。
  checklist_title: 寄出前：
  checklist:
  - 稱謂合身分
  - 提稱語配合
  - 主旨和第一句說清楚
  - 署名與日期
