scenario: 親子共學：複習版：替一件真實的事寫一封 email 給老師，請家人只看主旨和第一句，說出他知道要做什麼嗎。
goal: 寫出格式正確的書信與電子郵件：稱謂合身分、提稱語配合、主旨和第一句說清楚、署名與日期。
review: 孩子寫一封真的要寄給老師的 email，家長只看主旨和第一句，就能說出要做什麼；寄出前清單四項（稱謂、提稱語、主旨和第一句、署名與日期）都做到才打勾。
