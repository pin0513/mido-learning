idea: 書信有固定結構：稱謂、提稱語、正文、結尾敬辭、署名、日期（本站整理）；電子郵件還要有清楚的主旨（本站建議）。提稱語要「與稱謂配合，並按雙方的關係來措詞」。格式讓讀的人知道你尊重他，也找得到重點。
