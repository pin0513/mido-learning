why:
  heading: 題目只播一遍
  body:
  - 全民英檢中級聽力共 35 題、約 30 分鐘，看圖辨義、問答「每題只播出一遍」，簡短對話、簡短談話則是「每段對話及問題只播出一遍」「每段談話及問題只播出一遍」；檢測程度寫明要「能大致聽懂公共場所廣播、氣象報告及廣告等」。
  - 英語文領綱第五學習階段要學生學習「日常對話、故事、廣播的要點」（B-Ⅴ-11），也要「能聽懂公共場所廣播的內容，如捷運、車站、機場廣播。」（1-Ⅴ-8）與「能聽懂廣播，並能記下要點。」（5-Ⅴ-9）
  qa:
    question: 機場廣播可能只播一次，你要先抓哪些資訊？
    answer: 先抓和你有關的：哪一個班機、改到幾點、去哪一個登機門（本站建議）。英檢中級的看圖辨義、問答也是「每題只播出一遍」，聽之前先想好要抓什麼，聽的時候才不會漏掉。
    source: gept-intermediate
  items_title: 高中英語文課綱的相關條目
  items:
  - title: 抓廣播要點
    text: 英語文 B-Ⅴ-11：日常對話、故事、廣播的要點。
    code: B-V-11
  checklist_title: 聽之前先想
  checklist:
  - 這是什麼場合
  - 要抓哪些資訊
  sources:
  - gept-intermediate
  - english
how:
  heading: 先預讀，再抓關鍵資訊
  body:
  - 本站建議：播放前先看選項，猜這段會講什麼；聽的時候記下時間、地點、數字和 but、however 這類轉折詞；廣播裡請聽眾做的事（例如改到哪個登機門）、氣象報告的溫度與降雨機率也記下；聽操作說明時，抓 first、then、after that、finally 這類順序詞，一個順序詞記一個步驟；聽完立刻作答，不回頭糾結。
  - 全民英檢中級的四種題型：看圖辨義 5 題、問答 10 題、簡短對話 10 題、簡短談話 10 題；簡短對話是「播出一段對話及一個相關的問題」，簡短談話是「播出一段談話及一個相關的問題」；看圖辨義、問答「每題只播出一遍」，簡短對話「每段對話及問題只播出一遍」，簡短談話「每段談話及問題只播出一遍」。
  - 用 AI 練習時，照教育部注意事項（學生版）做：先確認符合平臺的註冊年齡限制，優先用為教育目的設計的工具（例如酷英網的 CoolE Bot），在家使用請家長陪伴；不輸入自己或他人的個人資料；AI 的回答要查證，不直接採信；作業「應依規定註明所使用的工具及用途，不得將生成內容直接當作自己原創作品繳交」，也不能用 AI 抄襲、代寫或作弊。
  items_title: 本站建議的聽法
  items:
  - title: 預讀選項
    text: 猜這段會講什麼。
  - title: 抓時間地點
    text: 時間、地點、數字、要做的事先記下。
  - title: 注意轉折詞
    text: but、however 後面常是重點；聽完立刻作答。
  - title: 抓順序詞記步驟
    text: first、then、after that、finally 各記一步。
  checklist_title: 每次練習後
  checklist:
  - 記下時間地點
  - 步驟有順序
  - 對答案
  - 標出聽錯處
  activity_figure: listen2-flow
  sources:
  - gept-intermediate
  - genai-student
  - moe-coolebot
what:
  heading: 聽懂廣播與說明
  body:
  - 學完後，孩子能聽懂公共場所廣播、氣象報告與簡易的操作說明，聽一遍就說出時間、地點與要做的事。
  items_title: 學完能做到
  items:
  - title: 聽懂廣播
    text: 說出時間、地點與要做的事。
  - title: 聽懂氣象
    text: 記下溫度與降雨。
  - title: 聽懂說明
    text: 依順序詞說出操作步驟。
  checklist_title: 家長檢核
  checklist:
  - 說得出時間地點
  - 步驟順序正確
  - 練習題有對答案
  figures:
  - listen2-compare
  notes:
  - 題型與時間依 LTTC 官方說明；把高中對應全民英檢中級是本站建議，不是官方換算。
  - 檢核的 7 成是示意；預讀選項、抓時間地點與順序詞的方法是本站建議。
  - 使用生成式 AI 的規則依教育部注意事項（學生版）：遵守「各平臺註冊年齡限制」；建議用為教育目的設計的工具（例如酷英網的 CoolE Bot），「非在校使用，亦請家長陪伴使用」；不輸入自己或他人的姓名、照片、聯絡方式、住址、學號等個人資料；AI 的回答不宜直接採信。作業若用了 AI，要依規定註明工具和用途，不能把 AI 寫的內容當成自己的作品交出去，也不能用 AI 抄襲、代寫或作弊。
  sources:
  - gept-intermediate
  - genai-student
  - moe-coolebot
