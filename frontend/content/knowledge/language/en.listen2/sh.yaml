idea: 全民英檢中級的聽力，要「在日常生活中，能聽懂一般的會話；能大致聽懂公共場所廣播、氣象報告及廣告等」，工作上「能聽懂簡易的產品介紹與操作說明」。本站建議：先預讀選項猜要聽什麼，再抓時間、地點、數字、轉折詞和順序詞。
guiding_questions:
- 機場廣播可能只播一次，你要先抓哪些資訊？
scenario: 親子共學：一起聽一段英文氣象預報，孩子記下溫度與降雨，大人記下地點，再對答案。
goal: 熟悉全民英檢中級聽力的題型，聽一遍就抓出公共場所廣播、氣象報告與簡易操作說明的要點；是否達到中級，以正式成績為準。
review: 家長從全民英檢中級官方練習題選一回聽力（看圖辨義、問答、簡短對話、簡短談話，都只播一遍），孩子答對 7 成以上，說出其中一段談話裡的時間與地點；再聽一段英文操作說明，依 first、then 等順序詞說出步驟（7 成為示意；練習題答對率不是正式成績）。
