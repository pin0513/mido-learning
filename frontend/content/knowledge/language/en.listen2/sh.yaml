idea: 全民英檢中級的聽力，要能聽懂一般會話，並大致聽懂公共場所廣播、氣象報告及廣告，工作上能聽懂簡易的產品介紹與操作說明。先預讀選項猜要聽什麼，再抓數字、地點與轉折詞。
guiding_questions:
- 機場廣播只播一次，你要抓哪三個字？
scenario: 親子共學：一起聽一段英文氣象預報，孩子記下溫度與降雨，大人記下地點，再對答案。
goal: 聽懂公共場所廣播、氣象報告、廣告與簡易操作說明，達到全民英檢中級聽力的程度。
review: 家長從全民英檢中級官方練習選一回聽力（看圖辨義、問答、簡短對話、簡短談話，每題只播一遍），孩子答對 7 成以上，並說出一則廣播裡的時間與地點。
