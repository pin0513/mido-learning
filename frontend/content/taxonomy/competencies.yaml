# 能力軸：專才、通才，以及 AI 分工的說明。
# 108 課綱核心素養代碼只放在 curriculum-108.yaml，而且只到 A1–C3。
# 這裡的名稱是網站自己的技能標籤，不是課綱學習表現代碼。

axes:
  - id: specialist
    name: 專才
    note: 這個知識點主要在練的學科技能。
  - id: generalist
    name: 通才
    note: 溝通、領導、專案管理、跨域思考等可遷移能力。從國小就可以標。
  - id: ai_division
    name: AI 分工
    note: 不是代碼清單。每個知識點用 ai.delegable 與 ai.human_experience 分開寫。

