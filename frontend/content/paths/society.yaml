id: society
title: 社會
paths:
  - id: lw.liability
    title: 法律上的責任
    knowledge_points:
      - lw.fault@es
      - lw.contract@jh
      - lw.crime@sh
      - lw.causation@uni
    colearn: 家人先用三張弄壞東西的卡分故意、不小心、沒辦法避免。再看三次虛構的買賣，問契約何時成立、要不要法定代理人允許。接著用一個虛構小事問有沒有法條、故意還是過失、有沒有防衛或避難、行為人幾歲。最後對照因果那一點的「假如沒有」。不下結論。
  - id: lw.rights
    title: 權利與救濟
    knowledge_points:
      - lw.rules@es
      - lw.rights@jh
      - lw.remedy@sh
      - lw.review@uni
    colearn: 家人先分班規、家規、法律是誰訂的、違反會怎樣。再看一個虛構的班群，問誰的權利碰到一起，以及國家限制權利要不要用法律、是不是必要。接著拿一張虛構罰單畫訴願和行政訴訟，並說出國家賠償的兩種情形。最後用戴安全帽這種限制寫一頁審查，把法院怎麼判和自己怎麼看分開。不下結論。
