  title: 拼讀：一個字音怎麼組成
  caption: 不是每個字都用滿四格：「爸」沒有介符；「阿」（ㄚ）連聲符都沒有，手冊稱為零聲母。
  alt: 二拼：ㄅ加ㄚ加去聲成為爸；三拼：ㄏ加ㄨ加ㄚ，一聲不標，成為花
  source: dict
