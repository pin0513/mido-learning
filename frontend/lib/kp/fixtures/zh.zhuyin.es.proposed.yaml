  - {name: 上聲, alias: 三聲, mark: ˇ, contour: dipping, example: 馬, reading: ㄇㄚˇ}
  - {name: 去聲, alias: 四聲, mark: ˋ, contour: falling, example: 罵, reading: ㄇㄚˋ}
  - {name: 輕聲, alias: 輕短, mark: ˙, contour: neutral, example: 嗎, reading: ˙ㄇㄚ}

