idea: 注音由聲符、韻符和聲調組成。一個字的讀音是「聲符＋（介音）＋韻符＋聲調」，聲調記號錯了，就是另一個字。會拼注音，查字典、讀生字都靠它。
guiding_questions:
- 「ㄅㄚˇ」和「ㄅㄚˋ」只差一個小記號，意思一樣嗎？
scenario: 親子共學：玩「注音傳話」：大人寫一句注音給孩子拼讀出來，孩子再用注音回一句；最後一起對照國字。
goal: 看注音拼出不會寫、不會念的字，也能用注音寫下一句話。
review: 家長念 5 個沒教過的詞，孩子用注音寫下來（含聲調），再對照字典，至少 4 個全對。
