why:
  heading: 看懂一個字怎麼念
  body:
  - 國字常常看不出怎麼念。注音把一個字的讀音拆開，一個聲音配一個符號，孩子看到符號，就能自己拼出讀音。
  - 所以國小一年級開學的前十週，先學注音。一、二年級的課文，課綱也建議全文附上注音，孩子遇到還沒學過的字，也能自己讀下去。
  figures: [why-compare]
  qa:
    question: 「ㄅㄚˇ」和「ㄅㄚˋ」只差一個小記號，意思一樣嗎？   # 必須等於 guiding_questions 其中一題
    answer: 不一樣。聲符、韻符都相同，只換了聲調：ㄅㄚˇ 是「把」，ㄅㄚˋ 是「爸」。聲調也是讀音的一部分。
    source: dict
  items_title: 會拼注音以後，孩子可以
  items:
  - {title: 自己讀注音讀物, text: 學習閱讀，享受閱讀樂趣。, code: 3-I-4}
  - {title: 用注音寫下想法, text: 還不會寫的字，先用注音記下來。, code: 3-I-3}
  - {title: 查字典、找資料, text: 中年級起，用注音檢索資訊。, code: 3-II-2}
  sources: [kuoyu, dict]

how:
  heading: 先直接拼，再拆開聽
  body:
  - 課綱建議用「直接拼讀法」：看到注音，直接念出整個字音，不要一個符號一個符號念；熟了以後，再用「反拼法」，把聽到的字音拆回符號來複習。
  items:
  - {title: 直接拼讀, example: ㄅㄚˋ → 爸, text: 看符號，一口氣念出字音。}
  - {title: 反拼複習, example: 爸 → ㄅ ㄚ ˋ, text: 聽字音，拆回聲符、韻符、聲調。}
  checklist_title: 練習時，大人留意這四件事：
  checklist: [發音部位, 嘴巴開合, 嘴唇圓或展, 聲調高低]
  activity_figure: how-flow        # 配在既有 scenario 下面
  sources: [kuoyu]

what:
  heading: 37 個符號，拼成一個字
  figures: [what-symbols, what-spelling, what-tones]
  notes:
  - 調號標在字音最後一個符號的右上角。
  - 一聲的「ˉ」注音時省略不標。
  - 輕聲的圓點「˙」：橫式寫在第一個符號前面，直式寫在字音上方。
  - 「嗎」念輕聲是當問句的語尾，例如「好嗎」。
  sources: [handbook, dict]

